name: Deploy Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: fm-works-apps-script-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enforce design document sync
        run: node scripts/check_docs_sync.mjs
      - name: Generate in-app design documents
        run: node scripts/generate_docs.mjs
      - name: Validate repository
        run: node scripts/validate.mjs
      - name: Verify cached-row security and sheet I/O
        run: node scripts/test_data_access_performance.mjs
      - name: Verify large workspace cache, linked data and asynchronous navigation
        run: node scripts/test_workspace_loading.mjs
      - name: Run logic tests
        run: node scripts/test_logic.mjs
      - name: Run client contract tests
        run: node scripts/test_client_contract.mjs
      - name: Test finance authorization and workflows
        run: node scripts/test_finance_integration.mjs
      - name: Verify secure annual cash flow and calculations
        run: node scripts/test_cashflow.mjs
      - name: Verify annual cash flow client interactions and private-data isolation
        run: node scripts/test_cashflow_client.mjs
      - name: Verify bank accounts, CSV import security and recurring cashflow
        run: node scripts/test_cashflow_bank.mjs
      - name: Verify classified receipts, what-if cash forecast and report generation
        run: node scripts/test_cashflow_analysis.mjs
      - name: Verify cashflow data-entry UI, scenario editor and download isolation
        run: node scripts/test_cashflow_analysis_client.mjs
      - name: Verify cash-flow report callback isolation
        run: node scripts/test_cashflow_report_session.mjs
      - name: Verify finance classifications and report layouts on desktop/mobile
        run: node scripts/test_cashflow_analysis_viewport.mjs
      - name: Upload cashflow finance visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmworks-cashflow-layout-qa
          path: artifacts/cashflow-analysis/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Verify bank CSV import UI, schedules and 12-month forecast
        run: node scripts/test_cashflow_bank_client.mjs
      - name: Verify editable bank statement grid, all-row validation and retry guards
        run: node scripts/test_cashflow_bank_grid.mjs
      - name: Verify copied bank statements and isolated sample finance flows
        run: node scripts/test_cashflow_sandbox.mjs
      - name: Verify finance workspace and bulk spreadsheet-style entry
        run: node scripts/test_finance_workspace.mjs
      - name: Verify Excel-like direct finance grid and safe Sheets bulk commit
        run: node scripts/test_finance_grid.mjs
      - name: Verify redesigned finance portal and spreadsheet grid at desktop/mobile widths
        run: node scripts/test_finance_workspaces_viewport.mjs
      - name: Upload redesigned finance workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmworks-finance-workspace-layout-qa
          path: artifacts/finance-workspace/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Test estimates and formal document outputs
        run: node scripts/test_quote_integration.mjs
      - name: Test rotary loader lifecycle and all GAS entrypoints
        run: node scripts/test_rotary_integration.mjs
      - name: Verify company document CRUD and access rules
        run: node scripts/test_company_documents.mjs
      - name: Verify company document navigation and editing
        run: node scripts/test_company_documents_client.mjs
      - name: Verify general affairs storage and permissions
        run: node scripts/test_somu_integration.mjs
      - name: Verify general affairs growth models and workflows
        run: node scripts/test_somu_growth.mjs
      - name: Verify general affairs client actions
        run: node scripts/test_somu_client.mjs
      - name: Verify project aggregation, permissions and retry behavior
        run: node scripts/test_project_hub.mjs
      - name: Verify fail-closed DB v18 migration, backup and retry safety
        run: node scripts/test_schema_migration.mjs
      - name: Verify task-linked worklogs, private attachments and financial permissions before deployment
        run: node scripts/test_project_advanced.mjs
      - name: Verify legacy worklog ownership and overlap before deployment
        run: node scripts/test_worklog_integrity.mjs
      - name: Verify navigation cache and input preservation
        run: node scripts/test_business_workflows.mjs
      - name: Test light and dark modal dialog contrast before publication
        run: node scripts/test_modal_theme.mjs
      - name: Install clasp
        run: npm install --global @google/clasp@latest
      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "CLASPRC_JSON is not configured" && exit 1)
          test -n "$CLASP_JSON" || (echo "CLASP_JSON is not configured" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
      - name: Validate production deployment preflight
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID || vars.FM_WORKS_DEPLOYMENT_ID }}
          FM_WORKS_KNOWN_DEPLOYMENT_ID: AKfycbw7oWIZkrOE-ClTVNeI0Kq4hzsZrYaKSC0CqNVsV4bwpufgBVR5-7MYxVEuj_51A9YgvQ
        run: |
          set -euo pipefail
          target="${DEPLOYMENT_ID:-$FM_WORKS_KNOWN_DEPLOYMENT_ID}"
          if ! [[ "$target" =~ ^[A-Za-z0-9_-]{40,}$ ]]; then
            echo "::error::Production deployment ID is not configured or has an invalid format."
            exit 1
          fi
          known_deployments="$(clasp list-deployments)"
          if ! printf '%s\n' "$known_deployments" | grep -Fq -- "$target"; then
            echo "::error::The specified FM WORKS web app deployment is not in this Apps Script project. Refusing to push."
            exit 1
          fi
          echo "FM_WORKS_DEPLOYMENT_ID=$target" >> "$GITHUB_ENV"
      - name: Push source to Apps Script
        run: clasp push --force
      - name: Update and verify existing web app deployment
        run: |
          set -euo pipefail
          : "${FM_WORKS_DEPLOYMENT_ID:?Preflight did not select a deployment}"
          # The CLI may not return deployment descriptions from list-deployments.
          # Match the update acknowledgement *and* the immutable deployed version
          # of the same existing deployment instead of relying on description text.
          result="$(clasp create-deployment --deploymentId "$FM_WORKS_DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA}")"
          if ! printf '%s\n' "$result" | grep -Fq -- "$FM_WORKS_DEPLOYMENT_ID"; then
            echo "::error::clasp did not acknowledge the protected deployment ID."
            exit 1
          fi
          number="$(printf '%s\n' "$result" | grep -oE '@[0-9]+' | tail -n 1 | tr -d '@' || true)"
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::clasp did not return a valid immutable deployment version."
            exit 1
          fi
          verified=false
          for attempt in 1 2 3; do
            deployed="$(clasp list-deployments)"
            line="$(printf '%s\n' "$deployed" | grep -F -- "$FM_WORKS_DEPLOYMENT_ID" | head -n 1 || true)"
            if printf '%s\n' "$line" | grep -Eq "@${number}([^0-9]|$)"; then
              verified=true
              break
            fi
            sleep 2
          done
          if [ "$verified" != true ]; then
            echo "::error::Protected deployment did not report its new @version after three checks."
            exit 1
          fi
          echo "Production FM WORKS web app is deployed at @${number} for GitHub ${GITHUB_SHA}."
