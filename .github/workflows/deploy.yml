name: Deploy Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: fm-works-apps-script-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enforce design document sync
        run: node scripts/check_docs_sync.mjs
      - name: Generate in-app design documents
        run: node scripts/generate_docs.mjs
      - name: Validate repository
        run: node scripts/validate.mjs
      - name: Verify cached-row security and sheet I/O
        run: node scripts/test_data_access_performance.mjs
      - name: Run logic tests
        run: node scripts/test_logic.mjs
      - name: Run client contract tests
        run: node scripts/test_client_contract.mjs
      - name: Test finance authorization and workflows
        run: node scripts/test_finance_integration.mjs
      - name: Test estimates and formal document outputs
        run: node scripts/test_quote_integration.mjs
      - name: Test rotary loader lifecycle and all GAS entrypoints
        run: node scripts/test_rotary_integration.mjs
      - name: Verify company document CRUD and access rules
        run: node scripts/test_company_documents.mjs
      - name: Verify company document navigation and editing
        run: node scripts/test_company_documents_client.mjs
      - name: Verify general affairs storage and permissions
        run: node scripts/test_somu_integration.mjs
      - name: Verify general affairs growth models and workflows
        run: node scripts/test_somu_growth.mjs
      - name: Verify general affairs client actions
        run: node scripts/test_somu_client.mjs
      - name: Verify project aggregation, permissions and retry behavior
        run: node scripts/test_project_hub.mjs
      - name: Verify fail-closed DB v16 migration, backup and retry safety
        run: node scripts/test_schema_migration.mjs
      - name: Verify task-linked worklogs, private attachments and financial permissions before deployment
        run: node scripts/test_project_advanced.mjs
      - name: Verify legacy worklog ownership and overlap before deployment
        run: node scripts/test_worklog_integrity.mjs
      - name: Verify navigation cache and input preservation
        run: node scripts/test_business_workflows.mjs
      - name: Test light and dark modal dialog contrast before publication
        run: node scripts/test_modal_theme.mjs
      - name: Install clasp
        run: npm install --global @google/clasp@latest
      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "CLASPRC_JSON is not configured" && exit 1)
          test -n "$CLASP_JSON" || (echo "CLASP_JSON is not configured" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
      - name: Push source to Apps Script
        run: clasp push --force
      - name: Update existing web app deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp create-deployment --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA}"
          else
            echo "DEPLOYMENT_ID is not configured; source was pushed but web app deployment was not updated."
          fi

