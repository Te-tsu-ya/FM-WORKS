name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop, staging]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enforce design document sync
        run: node scripts/check_docs_sync.mjs
      - name: Generate in-app design documents
        run: node scripts/generate_docs.mjs
      - name: Validate repository
        run: node scripts/validate.mjs
      - name: Run logic tests
        run: node scripts/test_logic.mjs
      - name: Run client contract tests
        run: node scripts/test_client_contract.mjs
      - name: Test finance authorization and workflows
        run: node scripts/test_finance_integration.mjs
      - name: Verify home viewports in headless Chrome
        run: node scripts/test_home_viewport.mjs
      - name: Upload synthetic home QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmworks-home-layout-qa
          path: artifacts/home-layout/*.png
          if-no-files-found: warn
          retention-days: 14
