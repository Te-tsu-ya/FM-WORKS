<style>
/* Paired text/surface roles. Keep these last so every workspace shares the same
   contrast contract. Accent ink and filled controls have separate roles. */
:root{
 --text:#17263d;--muted:#53647b;--blue:#0759bb;--blue2:#064b9e;
 --green:#16643a;--orange:#805000;--red:#a32840;--purple:#6540a0;
 --info-ink:#174b95;--info-bg:#eef5ff;
 --success-ink:#16643a;--success-bg:#eaf7ef;
 --warning-ink:#805000;--warning-bg:#fff5df;
 --danger-ink:#a32840;--danger-bg:#fff0f2;
 --purple-ink:#6540a0;--purple-bg:#f3effb;
 --fill-info:#075bd0;--fill-info-strong:#044cac;
 --fill-success:#087548;--fill-warning:#895300;
 --fill-danger:#ba2942;--fill-purple:#6841ab;
 --control-line:#75849a;--on-action:#fff;
}
html[data-theme="dark"]{
 --text:#edf4ff;--muted:#b5c3d6;--blue:#a0ccff;--blue2:#a0ccff;
 --green:#9be4b8;--orange:#ffda92;--red:#ffb1c0;--purple:#d3baff;
 --info-ink:#a0ccff;--info-bg:#142d49;
 --success-ink:#9be4b8;--success-bg:#123527;
 --warning-ink:#ffda92;--warning-bg:#382a14;
 --danger-ink:#ffb1c0;--danger-bg:#3b1c29;
 --purple-ink:#d3baff;--purple-bg:#302441;
 --fill-info:#2168cf;--fill-info-strong:#1555af;
 --fill-success:#087548;--fill-warning:#895300;
 --fill-danger:#ba2942;--fill-purple:#6841ab;
 --control-line:#7e90aa;
}
html[data-theme] .primary-button{
 background:linear-gradient(135deg,var(--fill-info),var(--fill-info-strong));
 color:var(--on-action);
}
html[data-theme] .monthly-close-banner{background:var(--surface);color:var(--text)}
html[data-theme] .monthly-close-banner.closed{background:var(--success-bg);border-color:var(--success-ink)}
html[data-theme] .monthly-close-banner.open{background:var(--warning-bg);border-color:var(--warning-ink)}
html[data-theme] .monthly-close-banner strong{color:var(--text)}
html[data-theme] .monthly-close-banner small{color:var(--muted);font-size:12px}
html[data-theme] .badge{background:var(--info-bg);color:var(--info-ink)}
html[data-theme] .badge.success{background:var(--success-bg);color:var(--success-ink)}
html[data-theme] .badge.warning{background:var(--warning-bg);color:var(--warning-ink)}
html[data-theme] .badge.danger{background:var(--danger-bg);color:var(--danger-ink)}
html[data-theme] .tone-green{background:var(--success-bg);color:var(--success-ink)}
html[data-theme] .tone-orange{background:var(--warning-bg);color:var(--warning-ink)}
html[data-theme] .tone-red{background:var(--danger-bg);color:var(--danger-ink)}
html[data-theme] .tone-purple{background:var(--purple-bg);color:var(--purple-ink)}
html[data-theme] input:not([type="checkbox"]):not([type="radio"]),html[data-theme] select,html[data-theme] textarea{
 color:var(--text);background:var(--surface);border-color:var(--control-line);
}
html[data-theme] input::placeholder,html[data-theme] textarea::placeholder{
 color:var(--muted);opacity:1;
}
html[data-theme] button:disabled,html[data-theme] input:disabled,html[data-theme] select:disabled,html[data-theme] textarea:disabled{
 opacity:1!important;background:var(--surface2);color:var(--muted);box-shadow:none;cursor:not-allowed;
}
html[data-theme] select option{color:var(--text);background:var(--surface)}
html[data-theme] .monthly-day.off{opacity:1;background:var(--surface2)}
html[data-theme] .attendance-alert-item small,html[data-theme] .attendance-alert-empty small{opacity:1}
html[data-theme] .schedule-hybrid .month-day.outside{opacity:1;background:var(--surface2)}
html[data-theme] .schedule-hybrid .schedule-is-dimmed{opacity:1}
html[data-theme] .monthly-day small,html[data-theme] .monthly-legend{color:var(--muted)}
html[data-theme] .schedule-hybrid .schedule-event.schedule-is-dimmed,
html[data-theme] .schedule-hybrid .schedule-timed-event.schedule-is-dimmed{
 opacity:1;border-left-style:dashed;
}
html[data-theme="dark"] .schedule-event,html[data-theme="dark"] .schedule-timed-event,
html[data-theme="dark"] .schedule-agenda-event{background:var(--surface2);color:var(--text)}
html[data-theme] .person-avatar{color:#173452;background:var(--person-bg,var(--info-bg))}
html[data-theme] .schedule-category-badge{color:var(--text);background:var(--surface2);border-left:3px solid var(--category-color)}
html[data-theme] .search-box,html[data-theme] .sidebar-footer{color:var(--muted)}
html[data-theme] :is(button,a,input,select,textarea):focus-visible{
 outline:3px solid var(--blue);outline-offset:2px;
}
/* Paper is an explicit light surface in both themes. Screen preview only;
   the issued PDF/Excel template and saved documents are unchanged. */
html[data-theme] .qb-paper{background:#fff;color:#273042;color-scheme:light}
html[data-theme] .qb-paper-footer,html[data-theme] .qb-paper-empty td{color:#52647b}
</style>
