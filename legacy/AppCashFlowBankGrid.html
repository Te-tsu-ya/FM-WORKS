<script>
/* Editable bank import preview. This module edits ONLY the in-memory staging
 * rows. Import is performed by the existing admin-authorized server method. */
const CFB_GRID_FIELDS=[
 ['date','取引日'],['description','摘要'],['incoming','入金（円）'],
 ['outgoing','出金（円）'],['balance','残高（円）'],['externalId','取引番号']
];
const CFB_GRID_PAGE_SIZE=25;
function cfbBankGridEditable_(){return !cfbUi.importing&&!cfbUi.importPending&&!cfbUi.busy;}
function cfbBankGridSetAccount_(accountId){
 if(cfbUi.importing||cfbUi.importPending){
  cfbUi.error='通信結果が未確認のため、別口座には切り替えられません。';
  renderPageIfActive('finance');return;
 }
 const next=String(accountId||'');
 if(next===cfbUi.csvAccountId)return;
 const apply=()=>{cfbUi.csvAccountId=next;cfbUi.preview=null;cfbUi.bankGridEdited=false;
  cfbUi.bankGridPage=0;cfbUi.error='';renderPageIfActive('finance');};
 if(cfbUi.preview&&cfbUi.preview.length){
  openConfirmDialog('取込先口座の変更','口座を切り替えると取込前の明細プレビューは破棄されます。元データを再度解析する必要があります。',
   'プレビューを破棄して変更',apply);renderPageIfActive('finance');return;
 }
 apply();
}
function cfbBankGridDate_(value){
 const s=String(value==null?'':value).trim().replace(/年|[/.]/g,'-').replace(/月/g,'-').replace(/日/g,'');
 let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
 if(!m)m=/^(\d{4})(\d{2})(\d{2})$/.exec(s);
 if(!m)throw Error('取引日は西暦の年月日で入力');
 const year=Number(m[1]),month=Number(m[2]),day=Number(m[3]);
 const expected=String(year).padStart(4,'0')+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
 if(year<2000||year>2100||month<1||month>12||day<1||day>31||
   new Date(Date.UTC(year,month-1,day)).toISOString().slice(0,10)!==expected)
  throw Error('存在しない取引日');
 return expected;
}
function cfbBankGridMoney_(value,label,optional,negative){
 const s=String(value==null?'':value).replace(/[,，\s￥¥円]/g,'').trim();
 if(optional&&(value==null||s===''||s==='-'))return null;
 if(!s||s==='-')return 0;
 const m=s.replace(/^\((\d+)\)$/,'-$1');
 if(!/^-?(0|[1-9]\d{0,11})$/.test(m)||(!negative&&m.startsWith('-')))
  throw Error(label+'は整数の円単位');
 const n=Number(m);
 if(!Number.isSafeInteger(n)||Math.abs(n)>999999999999)throw Error(label+'が上限超過');
 return n;
}
function cfbBankGridNormalize_(row){
 const date=cfbBankGridDate_(row.date),
  description=String(row.description==null?'':row.description).trim(),
  externalId=String(row.externalId==null?'':row.externalId).trim(),
  incoming=cfbBankGridMoney_(row.incoming,'入金額',false,false),
  outgoing=cfbBankGridMoney_(row.outgoing,'出金額',false,false),
  balance=cfbBankGridMoney_(row.balance,'残高',true,true);
 if(!description||description.length>240)throw Error('摘要は1～240文字');
 if(externalId.length>100)throw Error('取引番号は100文字以内');
 if((incoming>0)===(outgoing>0))throw Error('入金・出金はどちらか一方のみ1円以上');
 return {date,description,incoming,outgoing,balance,externalId,transfer:row.transfer===true};
}
function cfbBankGridErrors_(row){
 try{cfbBankGridNormalize_(row);return [];}catch(e){return [String(e.message||e)];}
}
function cfbBankGridStats_(){
 const preview=cfbUi.preview||[];let inTotal=0,outTotal=0,invalid=0;
 for(const row of preview){
  try{const r=cfbBankGridNormalize_(row);inTotal+=r.incoming;outTotal+=r.outgoing;}
  catch(_){invalid++;}
 }
 return {count:preview.length,inTotal,outTotal,invalid};
}
function cfbBankGridReindex_(){
 const ui=cfbUi,occurrences=new Map();
 (ui.preview||[]).forEach(row=>{
  let normalized;
  try{normalized=cfbBankGridNormalize_(row);}catch(_){row.occurrence=1;return;}
  // Recompute index after edits/removals. The server deduplicates via this
  // fingerprint; independently real repeated payments must stay distinguishable.
  const k=[normalized.date,normalized.incoming,normalized.outgoing,normalized.description,
   normalized.balance,normalized.externalId].join('|');
  const nth=(occurrences.get(k)||0)+1;occurrences.set(k,nth);row.occurrence=nth;
 });
}
function cfbBankGridRefreshStats_(){
 const s=cfbBankGridStats_();
 for(const [id,val] of [['cbg-total',s.count+'件'],['cbg-in',s.inTotal.toLocaleString('ja-JP')+'円'],
  ['cbg-out',s.outTotal.toLocaleString('ja-JP')+'円'],['cbg-invalid',s.invalid+'件']]){
  const node=document.getElementById(id);if(node)node.textContent=val;
 }
 const action=document.getElementById('cbg-import');
 if(action)action.disabled=!s.count||!!s.invalid||!cfbUi.csvAccountId||cfbUi.importing;
}
function cfbBankGridCell_(index,key,value){
 if(!cfbBankGridEditable_()||!cfbUi.preview||!cfbUi.preview[index]||
    !CFB_GRID_FIELDS.some(([k])=>k===key))return;
 cfbUi.preview[index][key]=String(value==null?'':value);
 cfbUi.bankGridEdited=true;cfbBankGridReindex_();
 const status=document.getElementById('cbg-error-'+index);
 const errors=cfbBankGridErrors_(cfbUi.preview[index]);
 if(status){status.textContent=errors.length?errors.join('・'):'確認OK';status.dataset.valid=errors.length?'false':'true';}
 cfbBankGridRefreshStats_();
}
function cfbBankGridCellBlur_(index,key,node){
 if(!cfbBankGridEditable_()||!cfbUi.preview||!cfbUi.preview[index])return;
 const row=cfbUi.preview[index];
 // Standardize only valid fields, never erase invalid input while correcting it.
 try{
  if(key==='date')row.date=cfbBankGridDate_(row.date);
  else if(['incoming','outgoing','balance'].includes(key))
   row[key]=cfbBankGridMoney_(row[key],key,key==='balance',key==='balance');
  node.value=String(row[key]==null?'':row[key]);
 }catch(_){}
 cfbBankGridReindex_();cfbBankGridRefreshStats_();
}
function cfbBankGridApplyPaste_(text,startRow,startCol){
 if(!cfbBankGridEditable_())throw Error('取込中・通信結果未確認の明細は変更できません。');
 const src=String(text||'').replace(/\r\n?/g,'\n');
 if(!src||src.length>150000)throw Error('貼付は15万文字以内です。');
 const lines=src.split('\n');if(lines[lines.length-1]==='')lines.pop();
 const matrix=lines.map(line=>line.split('\t'));
 if(!matrix.length||matrix.length>3000||matrix.some(line=>line.length>6))
  throw Error('貼り付ける行と列を確認してください（6列まで）。');
 if(startCol+Math.max(...matrix.map(r=>r.length))>6||
   startRow+matrix.length>(cfbUi.preview||[]).length)
  throw Error('貼付先がプレビュー表を超えています。明細全体を貼り直す場合は上の貼り付け欄を使ってください。');
 // Validate the entire range before modifying any input cell.
 for(let i=0;i<matrix.length;i++)for(let j=0;j<matrix[i].length;j++){
  const key=CFB_GRID_FIELDS[startCol+j][0];
  if(!['date','description','incoming','outgoing','balance','externalId'].includes(key))
   throw Error('列が正しくありません。');
 }
 for(let i=0;i<matrix.length;i++)for(let j=0;j<matrix[i].length;j++){
  cfbUi.preview[startRow+i][CFB_GRID_FIELDS[startCol+j][0]]=matrix[i][j].trim();
 }
 cfbUi.bankGridEdited=true;cfbUi.bankGridPage=Math.floor(startRow/CFB_GRID_PAGE_SIZE);
 cfbBankGridReindex_();
 return {rows:matrix.length,columns:Math.max(...matrix.map(r=>r.length))};
}
function cfbBankGridPasteEvent_(event,index,col){
 if(!cfbBankGridEditable_())return;
 const text=event.clipboardData&&event.clipboardData.getData('text/plain');
 if(!text||!(/[\t\r\n]/.test(text)))return;
 event.preventDefault();
 try{const v=cfbBankGridApplyPaste_(text,index,col);
  cfbUi.error='';cfbUi.notice=v.rows+'行×'+v.columns+'列を貼り付けました。まだDBには登録されていません。';
 }catch(e){cfbUi.error=String(e.message||e);}
 renderPageIfActive('finance');
 const el=document.querySelector('[data-cbg-cell="'+index+'-'+col+'"]');
 if(el)el.focus();
}
function cfbBankGridPageChange_(page){
 if(!cfbUi.preview||!cfbUi.preview.length)return;
 const max=Math.ceil(cfbUi.preview.length/CFB_GRID_PAGE_SIZE)-1;
 cfbUi.bankGridPage=Math.max(0,Math.min(max,Number(page)||0));
 renderPageIfActive('finance');
}
function cfbBankGridRemove_(index){
 if(!cfbBankGridEditable_()||!cfbUi.preview||!cfbUi.preview[index])return;
 openConfirmDialog('明細を取込対象から除外','選んだ行をプレビューから除外します。銀行のWeb明細や既存のFM WORKS DBは変更しません。',
  'この行を除外',()=>{
   if(!cfbBankGridEditable_()||!cfbUi.preview||!cfbUi.preview[index])return;
   cfbUi.preview.splice(index,1);
   cfbUi.bankGridEdited=true;
   cfbBankGridReindex_();
   cfbUi.bankGridPage=Math.min(cfbUi.bankGridPage||0,
    Math.max(0,Math.ceil(cfbUi.preview.length/CFB_GRID_PAGE_SIZE)-1));
   cfbUi.notice='取込対象から1行除外しました。';renderPageIfActive('finance');
  });
}
function cfbBankGridCopy_(){
 const rows=cfbUi.preview||[];
 if(!rows.length)return;
 const safe=value=>String(value==null?'':value).replace(/[\r\n\t]/g,' ').replace(/^[=+\-@]/,"'$&");
 const data=CFB_GRID_FIELDS.map(r=>r[1]).join('\t')+'\n'+
   rows.map(row=>CFB_GRID_FIELDS.map(([k])=>safe(row[k])).join('\t')).join('\n');
 const fallback=()=>{
  const field=document.getElementById('cbg-copy');if(!field)return;
  field.hidden=false;field.value=data;field.focus();field.select();
  showToast('テキストを選択しました。Ctrl+Cでコピーしてください。');
 };
 if(typeof navigator!=='undefined'&&navigator.clipboard?.writeText)
  navigator.clipboard.writeText(data).then(()=>showToast('プレビュー表をコピーしました。')).catch(fallback);
 else fallback();
}
function cfbBankGridPreview_(){
 const ui=cfbUi,rows=ui.preview||[];
 if(!rows.length)return '<p class="cf-note">表示できる明細がありません。銀行のコピー内容を読み込み直してください。</p>';
 const current=Math.max(0,Math.min(Number(ui.bankGridPage)||0,Math.ceil(rows.length/CFB_GRID_PAGE_SIZE)-1));
 const start=current*CFB_GRID_PAGE_SIZE,items=rows.slice(start,start+CFB_GRID_PAGE_SIZE);
 const locked=!cfbBankGridEditable_(),stat=cfbBankGridStats_();
 const cols=CFB_GRID_FIELDS.map(([k,title],i)=>'<th scope="col"><small>'+String.fromCharCode(65+i)+'</small>'+title+'</th>').join('');
 const body=items.map((r,i)=>{
  const index=start+i,errors=cfbBankGridErrors_(r),cells=CFB_GRID_FIELDS.map(([key,label],j)=>{
   const value=cfbEscape_(r[key]==null?'':r[key]);
   return '<td class="'+(['incoming','outgoing','balance'].includes(key)?'cbg-money':'')+'">'+
    '<input type="text" autocomplete="off" value="'+value+'" data-cbg-cell="'+index+'-'+j+'" '+
    'aria-label="'+(index+1)+'行目 '+cfbEscape_(label)+'"'+
    ' oninput="cfbBankGridCell_('+index+',\''+key+'\',this.value)"'+
    ' onblur="cfbBankGridCellBlur_('+index+',\''+key+'\',this)"'+
    ' onpaste="cfbBankGridPasteEvent_(event,'+index+','+j+')"'+
    (locked?' readonly':'')+'></td>';
  }).join('');
  return '<tr class="'+(errors.length?'cbg-bad':'cbg-good')+'"><th scope="row">'+(index+1)+'</th>'+cells+
   '<td><label class="cbg-check"><input type="checkbox"'+(r.transfer?' checked':'')+
   ' onchange="cfbCSVTransfer_('+index+',this.checked)" aria-label="'+(index+1)+'行目を口座間振替として扱う"'+
   (locked?' disabled':'')+'>内部振替</label></td>'+
   '<td id="cbg-error-'+index+'" data-valid="'+(!errors.length)+'">'+cfbEscape_(errors.join('・')||'確認OK')+'</td>'+
   '<td><button type="button" class="secondary-button" onclick="cfbBankGridRemove_('+index+')"'+
   (locked?' disabled':'')+'>除外</button></td></tr>';
 }).join('');
 return '<div class="cbg-sheet"><div class="cbg-head"><div><h3>明細の確認・修正</h3>'+
  '<p>各セルを直接編集できます。Excelの複数セルをコピーし、対応する先頭セルでCtrl/Cmd+Vを押してください。</p></div>'+
  '<button type="button" class="secondary-button" onclick="cfbBankGridCopy_()">確認表をコピー</button></div>'+
  '<div class="cbg-totals"><span>対象 <strong id="cbg-total">'+stat.count+'件</strong></span>'+
  '<span>入金 <strong id="cbg-in">'+stat.inTotal.toLocaleString('ja-JP')+'円</strong></span>'+
  '<span>出金 <strong id="cbg-out">'+stat.outTotal.toLocaleString('ja-JP')+'円</strong></span>'+
  '<span>修正が必要 <strong id="cbg-invalid">'+stat.invalid+'件</strong></span></div>'+
  (locked?'<p class="cf-note" role="status">保存開始後の明細は変更できません。中断時は同じ送信情報で再開します。</p>':'')+
  '<div class="cf-scroll cbg-scroll" role="region" aria-label="取込前の銀行明細を編集" tabindex="0">'+
  '<table class="cbg-table"><thead><tr><th>行</th>'+cols+'<th>内部振替</th><th>入力検証</th><th>除外</th></tr></thead>'+
  '<tbody>'+body+'</tbody></table></div><div class="cbg-bottom">'+
  '<span>表示 '+(start+1)+'〜'+(start+items.length)+' / '+rows.length+'件（25件ずつ）</span>'+
  '<div><button type="button" class="secondary-button" onclick="cfbBankGridPageChange_('+(current-1)+')"'+
  (!current?' disabled':'')+'>前へ</button><span>'+(current+1)+' / '+Math.ceil(rows.length/CFB_GRID_PAGE_SIZE)+'</span>'+
  '<button type="button" class="secondary-button" onclick="cfbBankGridPageChange_('+(current+1)+')"'+
  (current+1>=Math.ceil(rows.length/CFB_GRID_PAGE_SIZE)?' disabled':'')+'>次へ</button></div></div>'+
  '<textarea id="cbg-copy" hidden aria-label="コピー用明細"></textarea></div>';
}
</script>
