<style>
/* FM WORKS company document library - same theme variables as the main app. */
.company-doc-workspace{gap:12px;--company-doc-soft:color-mix(in srgb,var(--blue) 7%,var(--surface));}
.company-doc-workspace button:focus-visible,
.company-doc-workspace select:focus-visible,
.company-doc-workspace input:focus-visible,
.company-doc-workspace textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 70%,white);outline-offset:2px}
.company-doc-hero{background:linear-gradient(110deg,var(--surface),color-mix(in srgb,var(--fill-info) 7%,var(--surface)));border:1px solid var(--line);border-radius:16px;
 padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:18px;min-height:100px}
.company-doc-hero-copy{min-width:0}.company-doc-eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--blue);display:block}
.company-doc-hero h1{font-size:25px;line-height:1.25;letter-spacing:-.02em;margin:5px 0;color:var(--text)}
.company-doc-hero p{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
.company-doc-hero-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.company-doc-count-chip{border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:750;background:var(--surface);white-space:nowrap}
.company-doc-count-chip span{color:var(--muted);font-weight:500}
.company-doc-workspace .primary-button.company-doc-create{min-height:43px;padding:0 14px;border-radius:10px;font-size:13px}
.company-doc-toolbar{background:var(--surface);border:1px solid var(--line);border-radius:13px;display:flex;align-items:stretch;gap:10px;padding:10px;min-width:0}
.company-doc-search{display:flex;align-items:center;gap:8px;flex:1 1 330px;min-width:160px;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:0 11px}
.company-doc-search span{font-size:24px;line-height:1;color:var(--muted)}
.company-doc-search input{border:0;background:transparent;min-height:42px;width:100%;outline:0;color:var(--text);font-size:13px;min-width:0}
.company-doc-search input::placeholder{color:var(--muted);opacity:.95}
.company-doc-filter{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.company-doc-filter select,.company-doc-list-tools select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:0 9px;font-size:12px;min-height:42px;max-width:145px}
.company-doc-refresh{min-height:42px!important;border-radius:9px!important;white-space:nowrap;font-size:13px}
.company-doc-quick-folders{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;min-width:0}
.company-doc-quick-folder{min-width:0;display:flex;align-items:center;justify-content:flex-start;gap:8px;
 text-align:left;border-radius:11px;border:1px solid var(--line);background:var(--surface);min-height:54px;padding:9px 10px;color:var(--text)}
.company-doc-quick-folder:hover,.company-doc-quick-folder.is-active{background:var(--company-doc-soft);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.company-doc-quick-folder strong{font-size:12px;line-height:1.25;overflow-wrap:anywhere}.company-doc-quick-folder small{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.company-doc-quick-dot{width:9px;height:9px;border-radius:4px;background:var(--fill-info);flex:none}
.company-doc-quick-folder:nth-child(2) .company-doc-quick-dot{background:var(--success-bg)}
.company-doc-quick-folder:nth-child(3) .company-doc-quick-dot{background:var(--warning-bg)}
.company-doc-quick-folder:nth-child(4) .company-doc-quick-dot{background:var(--fill-danger)}
.company-doc-quick-folder:nth-child(5) .company-doc-quick-dot{background:var(--fill-info)}
.company-doc-quick-folder:nth-child(6) .company-doc-quick-dot{background:var(--fill-info)}
.company-doc-layout{display:grid;grid-template-columns:minmax(195px,215px) minmax(280px,.92fr) minmax(345px,1.15fr);gap:12px;min-width:0;align-items:stretch}
.company-doc-workspace .company-doc-layout>.card{padding:0;min-width:0;box-shadow:0 6px 21px rgba(30,55,90,.04);
 border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.company-doc-tree-pane,.company-doc-list-pane,.company-doc-detail-pane{min-height:460px;min-width:0}
.company-doc-pane-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 15px 12px;border-bottom:1px solid var(--line)}
.company-doc-pane-head h2{font-size:14px;font-weight:850;margin:0;color:var(--text)}
.company-doc-pane-head small{font-size:11px;color:var(--muted);white-space:nowrap}
.company-doc-tree{padding:11px 9px;display:grid;align-content:start;gap:3px;max-height:calc(100vh - 290px);overflow-y:auto;scrollbar-width:thin}
.company-doc-tree button{color:var(--text);font-size:12px;background:transparent;border:0;text-align:left;border-radius:8px;min-height:36px}
.company-doc-tree-all{display:flex;align-items:center;gap:8px;width:100%;padding:0 10px;font-weight:700}
.company-doc-tree-all-icon{color:var(--blue);font-size:19px}
.company-doc-tree-all small,.company-doc-tree-root-name small,.company-doc-tree-leaf small{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);margin-left:auto}
.company-doc-tree-all.is-active,.company-doc-tree-leaf.is-active,.company-doc-tree-root-name.is-active{background:var(--company-doc-soft);color:var(--blue)!important;font-weight:800}
.company-doc-tree-group{display:grid;gap:2px}
.company-doc-tree-root{display:flex;align-items:center;gap:1px;min-width:0}
.company-doc-tree-toggle{width:27px;min-width:27px;min-height:36px!important;text-align:center!important;font-size:18px!important;color:var(--muted)!important}
.company-doc-tree-root-name{display:flex;align-items:center;gap:7px;min-width:0;padding:3px 8px 3px 3px;flex:1;font-weight:750}
.company-doc-tree-root-name>span:nth-child(2),.company-doc-tree-leaf>span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.company-doc-folder-icon{font-size:16px;color:var(--blue)}
.company-doc-tree-children{display:grid;gap:1px;margin-left:30px;border-left:1px solid var(--line);padding-left:6px}
.company-doc-tree-leaf{display:flex;align-items:center;gap:6px;width:100%;padding:4px 7px}
.company-doc-tree-leaf>span:first-child{font-size:18px;color:var(--muted)}
.company-doc-tree button:hover{background:var(--surface2)}
.company-doc-crumb{display:flex;align-items:center;gap:6px;min-height:40px;padding:12px 13px 0;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.company-doc-crumb button{background:none;border:0;color:var(--blue);font-size:12px;min-height:24px;padding:0 2px}
.company-doc-crumb strong{color:var(--text);font-weight:700}
.company-doc-list-heading{border-bottom:1px solid var(--line);padding:10px 14px 9px}
.company-doc-list-tools{display:flex;align-items:center;gap:8px}.company-doc-list-tools small{font-size:12px;color:var(--muted)}
.company-doc-list-tools select{min-height:32px;max-width:130px}
.company-doc-search-note{font-size:11px;color:var(--muted);min-height:0;line-height:1.4;margin:0 14px}
.company-doc-search-note:not(:empty){padding:7px 0}
.company-doc-list{max-height:calc(100vh - 325px);min-height:380px;overflow:auto;scrollbar-width:thin}
.company-doc-row{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto 10px;
 align-items:start;gap:8px;padding:14px 11px;text-align:left;border:0;border-bottom:1px solid var(--line);
 background:var(--surface);color:var(--text);min-width:0}
.company-doc-row:hover,.company-doc-row.is-selected{background:var(--company-doc-soft)}
.company-doc-row.is-selected{box-shadow:inset 3px 0 var(--blue)}
.company-doc-row-icon{display:grid;place-items:center;width:32px;height:37px;border-radius:8px;
 background:color-mix(in srgb,var(--fill-info) 10%,var(--surface));color:var(--blue);font-size:23px}
.company-doc-row-main{display:grid;min-width:0;gap:5px}
.company-doc-row-main strong{font-size:12.5px;line-height:1.5;font-weight:800;overflow-wrap:anywhere}
.company-doc-row-desc{font-size:11.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.company-doc-row-meta{font-size:11px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.company-doc-row-right{display:grid;justify-items:end;gap:7px;min-width:50px}
.company-doc-row-right small{font-size:11px;color:var(--muted);white-space:nowrap}
.company-doc-row-chevron{font-size:18px;color:var(--muted);padding-top:8px}
.company-doc-status{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;
 font-size:11px;font-weight:750;line-height:1.2;white-space:nowrap}
.company-doc-status.is-published{background:color-mix(in srgb,var(--fill-success) 15%,var(--surface));color:color-mix(in srgb,var(--muted) 86%,var(--text))}
.company-doc-status.is-draft{background:color-mix(in srgb,var(--warning-bg) 18%,var(--surface));color:color-mix(in srgb,var(--warning-ink) 88%,var(--text))}
.company-doc-more{display:block;margin:14px auto;min-height:40px!important;font-size:12px!important}
.company-doc-detail-pane{padding:0;max-height:calc(100vh - 290px);overflow:auto;scrollbar-width:thin}
.company-doc-article{padding:20px 21px 24px}
.company-doc-detail-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.company-doc-detail-heading h2{margin:6px 0 2px;font-size:19px;letter-spacing:-.02em;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.company-doc-detail-path{margin-top:10px;color:var(--muted);font-size:11px}
.company-doc-info{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:16px 0;margin:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.company-doc-info div{min-width:0}.company-doc-info dt{color:var(--muted);font-size:11px;margin-bottom:5px}.company-doc-info dd{margin:0;font-size:12px;color:var(--text);overflow-wrap:anywhere}
.company-doc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}
.company-doc-tag{border:1px solid var(--line);color:var(--blue);background:var(--company-doc-soft);padding:5px 8px;border-radius:7px;font-size:11px}
.company-doc-summary{padding:13px 15px;background:var(--surface2);border-radius:10px;font-size:12px;line-height:1.75;color:var(--text)}
.company-doc-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95;font-size:13px;color:var(--text);min-height:180px;padding:11px 2px 20px}
.company-doc-link a{color:var(--blue);font-size:12px;font-weight:750;text-decoration:underline}
.company-doc-article-actions{border-top:1px solid var(--line);padding-top:16px;display:flex;gap:9px;flex-wrap:wrap}
.company-doc-workspace .compact{font-size:12px;border-radius:9px;min-height:40px!important;padding:0 12px!important}
.company-doc-no-selection,.company-doc-detail-loading,.company-doc-empty{padding:48px 19px;text-align:center;display:grid;justify-items:center;align-content:center;gap:10px;color:var(--muted)}
.company-doc-no-selection{min-height:350px}.company-doc-no-selection-icon,.company-doc-empty-icon{display:grid;place-items:center;border-radius:20px;
 width:70px;height:70px;background:var(--company-doc-soft);color:var(--blue);font-size:35px}
.company-doc-no-selection h2,.company-doc-empty strong{color:var(--text);font-size:15px;line-height:1.6;margin:0}
.company-doc-no-selection p,.company-doc-empty p{font-size:12px;line-height:1.7;margin:0}
.company-doc-no-body{font-size:12px;color:var(--muted);padding:26px 0}
.company-doc-detail-loading .loading-card{width:100%;height:160px}
.company-doc-editor{display:grid;gap:14px;padding:19px;min-width:0}
.company-doc-editor label{display:grid;gap:6px;font-size:12px;font-weight:750;color:var(--text);min-width:0}
.company-doc-editor label input,.company-doc-editor label select,.company-doc-editor label textarea{
 width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);
 color:var(--text);padding:9px 11px;font-size:13px;font-weight:450}
.company-doc-editor label textarea{resize:vertical;min-height:90px;line-height:1.7}
.company-doc-form-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}
.company-doc-required{color:var(--danger-ink);font-weight:750}
.company-doc-editor-note{background:var(--surface2);padding:11px 12px;border-radius:8px;color:var(--muted);font-size:12px;line-height:1.5}
.company-doc-form-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.company-doc-workspace .company-doc-form-actions button{min-height:43px;padding-inline:16px;font-size:12px}
.company-doc-error{background:color-mix(in srgb,var(--danger-bg) 9%,var(--surface));border:1px solid color-mix(in srgb,#ed5660 35%,var(--line));
 color:var(--text);padding:12px 14px;border-radius:10px;font-size:12px}
.company-doc-upgrade{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--line);
 border-radius:10px;background:color-mix(in srgb,var(--warning-bg) 12%,var(--surface));font-size:12px}
.company-doc-empty-setup{display:grid;justify-items:start;gap:10px}.company-doc-empty-setup h2{font-size:17px;margin:0}
.company-doc-loading{min-height:240px;display:grid;gap:12px;align-content:center}.company-doc-loading .loading-card{height:100px}
.company-doc-mobile-back{display:none!important}
@media(max-width:1460px){
 .company-doc-layout{grid-template-columns:minmax(175px,195px) minmax(245px,.94fr) minmax(300px,1.12fr)}
 .company-doc-quick-folder{padding:8px}.company-doc-quick-folder small{margin-left:0}
 .company-doc-quick-folder{flex-wrap:wrap;gap:5px}
 .company-doc-row{grid-template-columns:30px minmax(0,1fr) auto;gap:6px}
 .company-doc-row-chevron{display:none}
}
@media(max-width:1120px) and (min-width:761px){
 .company-doc-layout{grid-template-columns:minmax(165px,190px) minmax(0,1fr);grid-template-areas:"folders listing" "folders detail"}
 .company-doc-tree-pane{grid-area:folders}.company-doc-list-pane{grid-area:listing}.company-doc-detail-pane{grid-area:detail}
 .company-doc-detail-pane{max-height:none}
 .company-doc-tree{max-height:calc(100vh - 265px)}
 .company-doc-quick-folders{grid-template-columns:repeat(3,minmax(0,1fr))}
 .company-doc-hero{padding:15px 17px;min-height:87px}
 .company-doc-toolbar{flex-wrap:wrap}.company-doc-search{flex:1 1 100%}
 .company-doc-list{max-height:350px;min-height:210px}
}
@media(max-width:760px){
 .company-doc-workspace{gap:10px}
 .company-doc-hero{padding:14px;gap:10px;align-items:flex-start;min-height:0}
 .company-doc-hero h1{font-size:21px}
 .company-doc-hero p{font-size:12px;line-height:1.5}
 .company-doc-hero-actions{flex-direction:column;align-items:flex-end;gap:8px}
 .company-doc-count-chip{font-size:11px;padding:6px 8px}
 .company-doc-count-chip span{display:none}
 .company-doc-workspace .primary-button.company-doc-create{min-height:40px;padding:0 10px}
 .company-doc-toolbar{flex-wrap:wrap;gap:8px;padding:8px}
 .company-doc-search{flex:1 1 100%;min-height:43px}
 .company-doc-filter{flex:1 1 110px;justify-content:space-between}
 .company-doc-filter select{flex:1;min-width:0;max-width:none}
 .company-doc-refresh{min-width:44px}
 .company-doc-refresh span{display:none}
 .company-doc-quick-folders{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding:1px 0 5px}
 .company-doc-quick-folder{flex:0 0 auto;min-height:40px;padding:7px 11px;flex-wrap:nowrap}
 .company-doc-layout{display:block}
 .company-doc-tree-pane,.company-doc-list-pane,.company-doc-detail-pane{display:none;min-height:0}
 .company-doc-workspace[data-step="folders"] .company-doc-tree-pane,
 .company-doc-workspace[data-step="list"] .company-doc-list-pane,
 .company-doc-workspace[data-step="detail"] .company-doc-detail-pane{display:block}
 .company-doc-mobile-back{display:block!important;width:max-content;background:none!important;border:0!important;
  padding:12px 15px 5px!important;color:var(--blue)!important;font-size:12px!important;font-weight:800!important}
 .company-doc-tree{max-height:none;overflow:visible;padding:10px}
 .company-doc-tree button{min-height:44px}
 .company-doc-tree-toggle{min-height:44px!important}
 .company-doc-list{max-height:none;min-height:130px}
 .company-doc-row{grid-template-columns:32px minmax(0,1fr) auto}
 .company-doc-list-tools select{max-width:125px}
 .company-doc-detail-pane{max-height:none;overflow:visible}
 .company-doc-article{padding:16px}
 .company-doc-editor{padding:15px}
 .company-doc-form-pair{grid-template-columns:1fr}
 .company-doc-article-actions button{flex:1 1 auto}
}
@media(max-width:370px){
 .company-doc-hero{flex-wrap:wrap}.company-doc-hero-actions{flex-direction:row;width:100%;justify-content:space-between}
 .company-doc-row-right small{display:none}
 .company-doc-row-main strong{font-size:12px}
}

.company-doc-unsaved{color:var(--danger-ink);background:color-mix(in srgb,var(--warning-bg) 10%,var(--surface));
  border:1px solid color-mix(in srgb,#ed9b23 32%,var(--line));padding:10px 12px;
  border-radius:9px;font-size:12px;font-weight:750;margin:0}
.company-doc-unsaved[hidden]{display:none}
html[data-theme="dark"] .company-doc-unsaved{color:var(--warning-ink);background:#41301d;border-color:#805c2c}
html[data-theme="dark"] .company-doc-status.is-published{
  color:var(--success-ink);background:#153d32;border:1px solid #38765f}
html[data-theme="dark"] .company-doc-status.is-draft{
  color:var(--warning-ink);background:#45331e;border:1px solid #795a2f}
</style>
