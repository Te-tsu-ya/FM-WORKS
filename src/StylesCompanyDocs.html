<style>
.company-doc-layout{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(0,1.5fr);gap:14px;align-items:start}
.company-doc-list-pane,.company-doc-detail-pane{min-width:0;min-height:390px}
.company-doc-list-pane h2{margin:0 0 14px;font-size:17px}.company-doc-list-pane h2 small{color:var(--muted);font-size:12px}
.company-doc-controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.company-doc-controls input{grid-column:1/-1}
.company-doc-controls input,.company-doc-controls select,.company-doc-form input,.company-doc-form select,.company-doc-form textarea{min-width:0;width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:9px 12px}
.company-doc-list{display:grid;gap:7px;max-height:62vh;overflow-y:auto}
.company-doc-item{display:grid;gap:5px;text-align:left;min-width:0;border-radius:11px;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.company-doc-item.selected,.company-doc-item:hover{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--surface))}
.company-doc-item strong{font-size:14px;overflow-wrap:anywhere}.company-doc-item small,.company-doc-meta{font-size:12px;color:var(--muted);line-height:1.5}
.company-doc-form{display:grid;gap:12px}.company-doc-form label{display:grid;gap:5px;font-size:13px;font-weight:700}.company-doc-form textarea{min-height:80px;resize:vertical;font-weight:400}
.company-doc-article-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.company-doc-article h2{margin:0;font-size:21px}
.company-doc-meta{margin:10px 0 20px}.company-doc-article p{line-height:1.75;font-size:13px}
.company-doc-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.9;border-top:1px solid var(--line);padding:19px 0;min-height:140px}
.company-doc-article .button-row{padding-top:16px;border-top:1px solid var(--line)}.company-doc-list-pane button:focus-visible,.company-doc-detail-pane button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:850px){.company-doc-layout{grid-template-columns:minmax(0,1fr)}.company-doc-list{max-height:320px}.company-doc-list-pane,.company-doc-detail-pane{min-height:0}.company-doc-workspace .v15-page-hero{flex-wrap:wrap}}
</style>
