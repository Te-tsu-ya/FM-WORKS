<style>
/* FM WORKS v0.15 – shared information hierarchy for Home, Requests, Quotes,
 * Finance, General Affairs and Administration. Source: approved nine-screen UI. */
.nav-list{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;display:block}
.nav-section{display:grid;gap:4px;margin:0 0 15px;padding:0 8px 13px;border-bottom:1px solid var(--line)}
.nav-section:last-child{border-bottom:0}
.nav-section-label{padding:5px 10px 8px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.nav-section .nav-button{width:100%;margin:0;min-height:43px;display:flex;align-items:center;gap:12px}
.mobile-drawer-nav-group{display:grid;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)}
.mobile-drawer-nav-group>small{padding:4px 14px;color:var(--muted);font-weight:800;font-size:11px}
.v15-workspace{display:grid;gap:15px;align-content:start;max-width:1740px;margin-inline:auto;min-width:0}
.v15-workspace .card{min-width:0;border-radius:15px}
.v15-page-hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;overflow:hidden;
 background:linear-gradient(120deg,var(--surface) 42%,color-mix(in srgb,var(--blue) 9%,var(--surface)) 100%);
 border:1px solid var(--line);border-radius:17px;padding:21px 24px;min-height:122px}
.v15-page-hero::before{content:"";position:absolute;right:-35px;bottom:-74px;width:345px;height:195px;border-radius:50%;
 background:radial-gradient(ellipse at 42% 26%,color-mix(in srgb,var(--blue) 18%,transparent),transparent 68%);pointer-events:none}
.v15-page-hero>div:first-child{z-index:1;min-width:0}
.v15-page-hero h1{font-size:25px;line-height:1.3;margin:5px 0 7px;color:var(--text);font-weight:850}
.v15-page-hero p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
.v15-page-hero-short{min-height:114px}
.v15-kicker{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:.03em}
.v15-hero-mark{display:grid;place-items:center;flex:0 0 135px;align-self:stretch;color:var(--blue);opacity:.8;
  background:color-mix(in srgb,var(--blue) 7%,transparent);clip-path:polygon(50% 0,100% 100%,0 100%);z-index:1}
.v15-hero-mark svg{width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:1.4}
.v15-back-link{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
 border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--text);
 font-size:12px;min-height:38px;margin-bottom:7px}
.v15-back-link:hover{border-color:var(--blue)}
.v15-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.v15-stat{display:flex;align-items:center;gap:13px;padding:16px;min-width:0;text-align:left}
.v15-stat-symbol{display:grid;place-items:center;flex-shrink:0;width:45px;height:45px;border-radius:12px;
 color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--surface))}
.v15-stat-symbol svg,.v15-section-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7}
.v15-stat-symbol.warn{color:#b5760a;background:color-mix(in srgb,#efae4e 16%,var(--surface))}
.v15-stat-symbol.good{color:#149b70;background:color-mix(in srgb,#34c89c 13%,var(--surface))}
.v15-stat-symbol.danger{color:#ce4b5b;background:color-mix(in srgb,#f27688 14%,var(--surface))}
.v15-stat-content{display:grid;gap:4px;min-width:0;flex:1}
.v15-stat-title{font-size:12px;color:var(--text);font-weight:800}
.v15-stat-value{font-size:25px;line-height:1.1;letter-spacing:-.025em;font-variant-numeric:tabular-nums;color:var(--text)}
.v15-stat-caption{font-size:11px;line-height:1.4;color:var(--muted)}
.v15-section-heading{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-width:0}
.v15-section-heading h2{font-size:16px;color:var(--text);margin:0 0 3px;font-weight:850}
.v15-section-heading p{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.v15-section-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;
 color:var(--blue);background:color-mix(in srgb,var(--blue) 9%,var(--surface));flex-shrink:0}
.v15-link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:750;padding:7px 9px;cursor:pointer}
.v15-empty{padding:22px 16px;border:1px dashed var(--line);border-radius:12px;background:var(--surface2);font-size:13px;color:var(--muted);line-height:1.7}
.v15-empty strong{color:var(--text);display:block;margin-bottom:3px}
.v15-status-pill{border:1px solid color-mix(in srgb,var(--blue) 18%,var(--line));
 background:color-mix(in srgb,var(--blue) 8%,var(--surface));color:var(--blue);
 border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.v15-chip-tabs{display:flex;gap:6px;flex-wrap:wrap}
.v15-chip-tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);
 border-radius:9px;font-size:12px;min-height:38px;padding:7px 13px;font-weight:750}
.v15-chip-tabs button.active{border-color:color-mix(in srgb,var(--blue) 50%,var(--line));
 background:color-mix(in srgb,var(--blue) 10%,var(--surface));color:var(--blue)}
.v15-workspace input:focus-visible,.v15-workspace select:focus-visible,.v15-workspace textarea:focus-visible,
.v15-workspace button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.v15-entry-form{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.85fr);gap:13px;align-items:start}
.v15-entry-main{padding:19px;grid-column:1;grid-row:1}
.v15-entry-side{grid-column:2;grid-row:1;display:grid;gap:13px;min-width:0}
.v15-entry-side>.card{padding:16px}
.v15-finance-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.v15-finance-fields .finance-field{min-width:0}
.v15-finance-fields .finance-field:has(textarea){grid-column:1/-1}
.v15-finance-fields .finance-field>span{font-size:12px}
.v15-finance-fields input,.v15-finance-fields select,.v15-finance-fields textarea{
 min-height:43px;background:var(--surface);color:var(--text);border-color:var(--line);width:100%;max-width:100%}
.v15-finance-fields textarea{min-height:81px;resize:vertical}
.v15-required{color:#d74e62;font-style:normal;font-size:11px;margin-left:4px}
.v15-helper-note{font-size:12px;color:var(--muted);line-height:1.7;margin:13px 0 0}
.v15-upload-placeholder{display:grid;justify-items:center;text-align:center;align-content:center;
 gap:8px;padding:25px 15px;border:1px dashed color-mix(in srgb,var(--blue) 46%,var(--line));
 border-radius:12px;background:color-mix(in srgb,var(--blue) 5%,var(--surface))}
.v15-upload-placeholder svg{width:34px;height:34px;color:var(--blue);fill:none;stroke:currentColor}
.v15-upload-placeholder strong{font-size:13px;color:var(--text)}
.v15-upload-placeholder p{font-size:12px;line-height:1.7;margin:0;color:var(--muted)}
.v15-summary-line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.v15-summary-line span:first-child{font-size:12px;color:var(--muted)}
.v15-summary-line strong{font-size:16px;font-weight:850;overflow-wrap:anywhere;text-align:right}
.v15-form-footer{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:9px;
 background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 16px;
 position:sticky;bottom:12px;z-index:5;box-shadow:0 8px 20px rgba(24,49,82,.07)}
.v15-form-footer button{min-height:44px}
.v15-finance-dashboard{display:grid;gap:14px;min-width:0}
.v15-finance-body{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(260px,.75fr);gap:13px;align-items:start}
.v15-finance-main,.v15-finance-side .card{padding:16px}
.v15-finance-side{display:grid;gap:13px;min-width:0}
.v15-finance-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.v15-finance-controls>label{flex:1;min-width:200px}
.v15-finance-controls input,.v15-finance-controls select{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  min-height:40px;padding:8px 11px;width:100%;color:var(--text);font-size:12px}
.v15-finance-controls select{width:auto;min-width:120px}
.v15-finance-table{display:grid;gap:7px;max-height:min(60svh,700px);overflow:auto;scrollbar-width:thin}
.v15-finance-table .finance-overview-row{border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--surface2)}
.v15-finance-table .finance-overview-row:hover{border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.v15-finance-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.v15-finance-actions button{min-height:39px}
.v15-finance-list-panel .finance-overview-actions{flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.v15-quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.v15-quick-action{display:flex;justify-content:space-between;align-items:center;gap:12px;
 padding:16px;border:1px solid var(--line);border-radius:12px;text-align:left;
 background:color-mix(in srgb,var(--blue) 5%,var(--surface));font-size:14px;font-weight:800;color:var(--blue);min-height:70px}
.v15-quick-action.primary{background:linear-gradient(130deg,#185abc,#2479e5);color:#fff}
.v15-quick-action svg{width:22px;height:22px;stroke:currentColor;fill:none}
.v15-quick-action:hover{border-color:var(--blue);filter:brightness(.98)}
.v15-request-header-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.v15-quote-columns{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(255px,.66fr);gap:13px;align-items:start}
.v15-quote-side{display:grid;gap:13px;min-width:0}
.v15-quote-side .card{padding:16px}
.v15-quote-table .quote-record{min-height:64px;flex-wrap:wrap}
.v15-quote-meta{font-size:12px;color:var(--muted);padding:10px 0}
.v15-quote-draft-guide{font-size:12px;line-height:1.7;color:var(--muted)}
.v15-admin-quotes .quote-admin{padding:0}
.v15-admin-quotes .quote-admin summary{display:none}
.v15-admin-quotes .quote-admin>*:not(summary){display:block}
.v15-affairs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.v15-affairs-card{display:grid;gap:10px;align-content:start;padding:20px;min-height:178px}
.v15-affairs-card svg{width:26px;height:26px;stroke:var(--blue);fill:none}
.v15-affairs-card h2{font-size:17px;margin:0;color:var(--text)}
.v15-affairs-card p{font-size:12px;color:var(--muted);line-height:1.7;margin:0}
.v15-pending-label{display:inline-flex;justify-self:start;padding:4px 9px;border-radius:8px;
 background:color-mix(in srgb,var(--blue) 7%,var(--surface));color:var(--muted);font-size:11px}
.v15-home-actions{display:grid;gap:11px;min-width:0}
.v15-home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr) minmax(280px,.95fr);gap:12px}
.v15-home-grid .card{padding:15px}
.v15-home-activity{display:grid;gap:8px}
.v15-home-activity-row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 0}
.v15-home-activity-row strong{font-size:12px}
.v15-home-activity-row small{font-size:11px;color:var(--muted)}
.v15-home-workflow{display:grid;gap:9px}
.v15-home-workflow>button{display:flex;gap:9px;align-items:center;border:1px solid var(--line);
 border-radius:10px;background:var(--surface2);padding:12px;text-align:left;color:var(--text)}
.v15-home-workflow>button:hover{border-color:var(--blue)}
.v15-home-workflow>button svg{width:19px;height:19px;stroke:var(--blue);fill:none}
.v15-quote-summary-side{display:grid;gap:12px}
.v15-quote-summary-side .card{padding:16px}
@media(max-width:1400px){
 .v15-home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .v15-home-grid>.card:last-child{grid-column:1/-1}
 .v15-finance-body{grid-template-columns:minmax(0,1.4fr) minmax(240px,.7fr)}
 .v15-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1100px){
 .v15-entry-form,.v15-finance-body,.v15-quote-columns{grid-template-columns:1fr}
 .v15-entry-main,.v15-entry-side{grid-column:1;grid-row:auto}
 .v15-entry-side{grid-template-columns:repeat(2,minmax(0,1fr))}
 .v15-quote-side{grid-template-columns:repeat(2,minmax(0,1fr))}
 .v15-affairs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
 .v15-workspace{gap:10px}
 .v15-page-hero{min-height:112px;padding:14px;align-items:flex-start}
 .v15-page-hero h1{font-size:21px;white-space:normal}
 .v15-page-hero p{font-size:12px}
 .v15-hero-mark{flex-basis:54px;min-width:0}
 .v15-hero-mark svg{width:28px;height:28px}
 .v15-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .v15-stat{padding:11px;gap:8px}
 .v15-stat-symbol{height:34px;width:34px}
 .v15-stat-symbol svg{width:17px;height:17px}
 .v15-stat-value{font-size:19px}
 .v15-stat-title,.v15-stat-caption{font-size:11px}
 .v15-entry-main,.v15-entry-side>.card{padding:13px}
 .v15-finance-fields{grid-template-columns:1fr}
 .v15-finance-fields .finance-field:has(textarea){grid-column:1}
 .v15-entry-side,.v15-quote-side{grid-template-columns:1fr}
 .v15-form-footer{bottom:74px;padding:9px}
 .v15-form-footer button{flex:1}
 .v15-finance-controls>label{min-width:100%}
 .v15-finance-controls select{width:100%}
 .v15-home-grid,.v15-affairs-grid,.v15-quick-grid{grid-template-columns:1fr}
 .v15-home-grid>.card:last-child{grid-column:auto}
 .v15-finance-body{grid-template-columns:1fr}
 .v15-workspace .quote-toolbar h1{font-size:21px}
}
/* Preserve the verified one-screen home behavior after applying shared v0.15 hero components. */
@media(min-width:1200px) and (min-height:690px){
  .home-portal-screen > .home-portal-header.v15-page-hero{
    min-height:74px;padding:9px 14px;gap:12px;
  }
  .home-portal-header.v15-page-hero .home-portal-intro h1{
    font-size:19px;line-height:1.27;margin:3px 0 2px;
  }
  .home-portal-header.v15-page-hero .home-portal-intro p{
    font-size:11px;line-height:1.3;
  }
  .home-portal-shortcuts .home-portal-panel-head p{display:none}
  .home-portal-screen .v15-stats{gap:9px}
}
/* 1366x768 high-density regression: lists scroll inside their cards,
   rather than pushing the entire home page below the viewport. */
@media(min-width:1200px) and (min-height:690px) and (max-height:820px){
  .home-portal-screen{gap:6px}
  .home-portal-screen > .home-portal-header.v15-page-hero{min-height:62px;padding:5px 12px}
  .home-portal-screen .home-portal-stats{gap:7px}
  .home-portal-screen .home-portal-layout{gap:7px}
  .home-portal-screen .home-portal-panel{padding:8px 10px}
  .home-portal-screen .home-portal-panel-head{margin-bottom:4px}
  .home-portal-screen .home-portal-agenda-rows{max-height:86px;overflow-y:auto}
  .home-portal-screen .home-portal-task-list{max-height:84px;overflow-y:auto}
  .home-portal-screen .home-portal-punch-history{max-height:40px;overflow-y:auto}
  .home-portal-screen .home-portal-agenda-row{padding:5px 8px}
  .home-portal-screen .home-portal-task-row{padding:5px 8px}
  .home-portal-screen .home-portal-shortcut{min-height:37px;padding:4px 8px}
}
@media(prefers-reduced-motion:reduce){.v15-workspace button{transition:none}}

/* FM WORKS v0.16.0 - split editor / live A4 estimate preview */
.quote-builder{max-width:1680px;gap:13px}
.quote-builder .card{min-width:0}
.qb-header{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;
  padding:18px 20px;border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(115deg,var(--surface) 65%,color-mix(in srgb,var(--blue) 7%,var(--surface)))}
.qb-header h1{margin:4px 0 5px;color:var(--text);font-size:23px;line-height:1.35;font-weight:850}
.qb-header p{margin:0}
.qb-header .v15-kicker{margin-top:11px;font-size:11px;font-weight:750;color:var(--blue)}
.qb-header-description{font-size:12px;color:var(--muted);line-height:1.6}
.qb-header-actions{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:9px}
.qb-header-actions button{min-height:42px;white-space:nowrap}
.qb-save-status{font-size:11px;color:var(--muted);white-space:nowrap;padding-right:3px}
.qb-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(350px,.9fr);gap:13px;align-items:start}
.qb-edit-column{display:grid;gap:13px;min-width:0}
.qb-edit-card{padding:19px}
.qb-section-title{display:flex;gap:11px;align-items:center;margin-bottom:17px}
.qb-section-title>div{flex:1;min-width:0}
.qb-section-index{display:grid;place-items:center;flex:0 0 35px;width:35px;height:35px;
  border-radius:11px;background:color-mix(in srgb,var(--blue) 11%,var(--surface));
  color:var(--blue);font-weight:800;font-size:12px}
.qb-section-title h2{font-size:16px;font-weight:850;margin:0 0 3px;color:var(--text)}
.qb-section-title p{color:var(--muted);font-size:11px;line-height:1.55;margin:0}
.qb-section-title-actions{flex-wrap:wrap}
.qb-section-title-actions button{min-height:36px;font-size:12px}
.qb-info-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qb-field{display:grid;gap:6px;min-width:0;font-size:12px;color:var(--text);font-weight:700}
.qb-field span{display:flex;align-items:center;gap:5px}
.qb-field em{font-style:normal;font-size:10px;background:#fff0f0;color:#bc3c3c;
  padding:1px 5px;border-radius:4px}
.qb-field-vendor,.qb-field-subject{grid-column:span 3}
.qb-field-quoteDate,.qb-field-delivery,.qb-field-expires,.qb-field-contact,
.qb-field-payment,.qb-field-bank{grid-column:span 2}
.qb-field input,.qb-field select,.qb-field textarea{
  width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);
  border-radius:9px;min-height:42px;padding:10px 11px;font-size:13px;font-weight:500;
  color:var(--text);font-family:inherit;line-height:1.4;box-sizing:border-box
}
.qb-field textarea{resize:vertical;min-height:85px}
.qb-number-field{grid-column:span 1}
.qb-number-field strong{display:flex;align-items:center;min-height:42px;padding:8px 10px;
  border:1px solid var(--line);background:var(--surface2);border-radius:9px;
  font-size:11px;line-height:1.4;font-weight:650;color:var(--muted);overflow-wrap:anywhere}
.quote-builder .quote-vendor-preview{margin:12px 0 0;font-size:11px;line-height:1.5}
.qb-visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.qb-lines-card{padding-bottom:14px}
.qb-grid-scroll{overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);scrollbar-width:thin}
.qb-grid-head,.quote-builder .qb-line{display:grid;grid-template-columns:37px minmax(200px,1fr) 75px 70px 97px 101px 152px;
  gap:7px;align-items:center;min-width:790px;padding:7px 9px}
.qb-grid-head{background:var(--surface2);border-bottom:1px solid var(--line);
  font-size:10px;color:var(--muted);font-weight:800}
.qb-grid-head span:nth-child(3),.qb-grid-head span:nth-child(5),
.qb-grid-head span:nth-child(6){text-align:right}
.quote-builder .quote-lines{display:block;margin:0}
.quote-builder .qb-line{border-bottom:1px solid var(--line);border-radius:0;margin:0;
  background:var(--surface)}
.quote-builder .qb-line:last-child{border-bottom:0}
.quote-builder .qb-line:hover{background:color-mix(in srgb,var(--blue) 3%,var(--surface))}
.qb-line-no{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.qb-cell{min-width:0}
.quote-builder .qb-cell input{display:block;width:100%;min-width:0;min-height:38px;
  height:38px;padding:7px 8px;border:1px solid var(--line);
  border-radius:7px;background:var(--surface);font-size:12px;font-weight:500;
