<script>
// v0.11.8: isolated leave simulator. Never reads or writes employee records or GAS.
const LEAVE_DEMO_AS_OF='2026-10-08';
const LEAVE_DEMO_DAYS=[10,11,12,14,16,18,20];
const LEAVE_DEMO_PEOPLE=[
  {id:'first',label:'初回10日',name:'田中 未来',hire:'2026-04-01',description:'入社6か月後の付与',
    records:[['2026-10-05',1,'approved'],['2026-10-07',.5,'pending']]},
  {id:'second',label:'2年目11日',name:'佐藤 彩',hire:'2025-04-01',description:'前年の残数と11日付与',
    records:[['2026-04-06',1,'approved'],['2026-05-11',1,'approved'],['2026-06-08',1,'approved'],
      ['2026-07-06',1,'approved'],['2026-08-03',1,'approved'],['2026-10-02',1,'approved'],
      ['2026-10-05',1,'approved'],['2026-10-06',.5,'approved'],['2026-10-07',1,'pending']]},
  {id:'senior',label:'最大20日',name:'鈴木 健',hire:'2019-04-01',description:'20日付与と年5日取得達成',
    records:[['2025-11-04',1,'approved'],['2025-12-05',1,'approved'],['2026-01-15',1,'approved'],
      ['2026-02-13',1,'approved'],['2026-04-06',1,'approved'],['2026-05-15',1,'approved'],
      ['2026-07-03',1,'approved'],['2026-09-15',1,'approved'],['2026-10-01',1,'approved'],
      ['2026-10-02',1,'approved'],['2026-10-05',1,'approved'],['2026-10-06',1,'approved'],
      ['2026-10-07',1,'approved']]},
  {id:'deadline',label:'年5日注意',name:'高橋 花',hire:'2025-04-20',description:'年5日の期限が近い場合の注意',
    records:[['2026-05-07',1,'approved'],['2026-09-30',.5,'approved'],['2026-10-07',1,'pending']]}
];
let leaveDemoState=null;
function leaveDemoIsAuthorized(){return !!(state.sessionToken&&state.data)}
function resetLeaveDemoSession(){
  if(!leaveDemoState)return;
  leaveDemoState=null;
  const root=document.getElementById('modalRoot');
  if(root&&root.innerHTML&&root.innerHTML.includes('leave-demo-modal'))closeModal();
}
function leaveDemoValidDate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value||'')))return false;
  const [y,m,d]=value.split('-').map(Number);
  if(y<1950||y>2100)return false;
  return new Date(Date.UTC(y,m-1,d)).toISOString().slice(0,10)===value;
}
function leaveDemoClampDate(year,month,day){
  const y=year+Math.floor((month-1)/12),m=((month-1)%12+12)%12+1;
  return [y,String(m).padStart(2,'0'),String(Math.min(day,new Date(Date.UTC(y,m,0)).getUTCDate())).padStart(2,'0')].join('-');
}
function leaveDemoGrantAt(hire,index){
  if(!leaveDemoValidDate(hire)||!Number.isInteger(index)||index<0||index>90)return '';
  const [year,month,day]=hire.split('-').map(Number);
  return leaveDemoClampDate(year,month+6+12*index,day);
}
function leaveDemoShiftDate(date,shift){
  const [y,m,d]=date.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d+shift)).toISOString().slice(0,10);
}
function leaveDemoYearsAfter(date,years){
  return leaveDemoClampDate(Number(date.slice(0,4))+years,Number(date.slice(5,7)),Number(date.slice(8,10)));
}
function leaveDemoGrants(hire,asOf=LEAVE_DEMO_AS_OF){
  const empty={valid:[],latest:null,next:null};
  if(!leaveDemoValidDate(hire)||hire>asOf)return empty;
  const valid=[];let latest=null,next=null;
  for(let i=0;i<=90;i++){
    const date=leaveDemoGrantAt(hire,i);
    if(!date)break;
    const days=LEAVE_DEMO_DAYS[Math.min(i,6)];
    if(date>asOf){next={date,days,index:i};break;}
    const expiry=leaveDemoShiftDate(leaveDemoYearsAfter(date,2),-1);
    latest={date,days,index:i,expiry};
    if(expiry>=asOf)valid.push({date,days,index:i,expiry});
  }
  return {valid,latest,next};
}
function leaveDemoSeed(id='second'){
  const p=LEAVE_DEMO_PEOPLE.find(x=>x.id===id)||LEAVE_DEMO_PEOPLE[1];
  return {id:p.id,name:p.name,hire:p.hire,notice:'',custom:false,serial:100,
    records:p.records.map(([date,days,status],i)=>({id:'demo'+i,date,days,status}))};
}
function leaveDemoCompute(d=leaveDemoState){
  if(!d)return null;
  const grants=leaveDemoGrants(d.hire),first=grants.valid[0]&&grants.valid[0].date||'9999-12-31';
  const valid=d.records.filter(r=>r.date>=first&&r.date<=LEAVE_DEMO_AS_OF);
  const used=valid.filter(r=>r.status==='approved').reduce((a,r)=>a+r.days,0);
  const pending=d.records.filter(r=>r.status==='pending').reduce((a,r)=>a+r.days,0);
  const granted=grants.valid.reduce((a,g)=>a+g.days,0);
  const balance=Math.max(0,Math.round((granted-used)*2)/2);
  const available=Math.max(0,Math.round((balance-pending)*2)/2);
  const current=grants.latest;
  const taken=current?valid.filter(r=>r.status==='approved'&&r.date>=current.date).reduce((a,r)=>a+r.days,0):0;
  const needed=Math.max(0,Math.round((5-taken)*2)/2);
  const deadline=current?leaveDemoShiftDate(leaveDemoYearsAfter(current.date,1),-1):'';
  const daysLeft=deadline?Math.round((Date.parse(deadline+'T00:00:00Z')-Date.parse(LEAVE_DEMO_AS_OF+'T00:00:00Z'))/86400000):null;
  return {grants,granted,used,pending,balance,available,taken,needed,deadline,daysLeft,
    complete:!!current&&needed===0,
    caution:!!current&&needed>0&&daysLeft<=180};
}
function leaveDemoDays(n){const a=Math.round(n*2)/2;return Number.isInteger(a)?String(a):a.toFixed(1)}
function leaveDemoDisplay(date){return String(date||'—').replace(/-/g,'/')}
function leaveDemoOpen(id='second'){
  if(!leaveDemoIsAuthorized())return false;
  leaveDemoState=leaveDemoSeed(id);leaveDemoRender();return true;
}
function leaveDemoClose(){
  leaveDemoState=null;
  closeModal();
}
function leaveDemoSelect(id){
  if(!leaveDemoIsAuthorized()||!LEAVE_DEMO_PEOPLE.some(p=>p.id===id))return;
  leaveDemoState=leaveDemoSeed(id);leaveDemoRender();
}
function leaveDemoEditHire(){
  if(!leaveDemoIsAuthorized()||!leaveDemoState)return;
  const el=document.getElementById('leaveDemoHireDate'),date=String(el&&el.value||'');
  if(!leaveDemoValidDate(date)||date>LEAVE_DEMO_AS_OF){
    leaveDemoState.notice='入社日は2026年10月8日以前の有効な日付を入力してください。';
  }else{
    leaveDemoState.hire=date;leaveDemoState.records=[];leaveDemoState.custom=true;
    leaveDemoState.notice='入社日を変更しました。架空の取得履歴をリセットして、付与日・日数を再計算しました。';
  }
  leaveDemoRender();
}
function leaveDemoDayReserved(d=leaveDemoState,date=LEAVE_DEMO_AS_OF){
  return d.records.filter(r=>r.date===date&&(r.status==='approved'||r.status==='pending'))
    .reduce((a,r)=>a+r.days,0);
}
function leaveDemoApplyRequest(days){
  if(!leaveDemoIsAuthorized()||!leaveDemoState||![1,.5].includes(days))return;
  const v=leaveDemoCompute();
  if(v.available<days||!v.grants.latest){
    leaveDemoState.notice='付与済み日数または申請可能日数が足りません。';leaveDemoRender();return;
  }
  if(leaveDemoDayReserved()+days>1){
    leaveDemoState.notice='同じ日付に申請できる有給は合計1日までです。既存の承認済み・承認待ちを確認してください。';
    leaveDemoRender();return;
  }
  leaveDemoState.records.push({id:'new'+(++leaveDemoState.serial),date:LEAVE_DEMO_AS_OF,days,status:'pending'});
  leaveDemoState.notice=leaveDemoDays(days)+'日を申請しました。承認待ちは申請可能日数から仮引きされ、確定残は変わりません。';
  leaveDemoRender();
}
function leaveDemoApprove(){
  if(!leaveDemoIsAuthorized()||!leaveDemoState)return;
  const rows=leaveDemoState.records.filter(r=>r.status==='pending'),r=rows[rows.length-1];
  if(!r)return;
  r.status='approved';
  leaveDemoState.notice=leaveDemoDays(r.days)+'日を承認しました。確定残が減り、年5日の取得実績に反映されます。';
  leaveDemoRender();
}
function leaveDemoWithdraw(){
  if(!leaveDemoIsAuthorized()||!leaveDemoState)return;
  const rows=leaveDemoState.records.filter(r=>r.status==='pending'),r=rows[rows.length-1];
  if(!r)return;
  r.status='withdrawn';
  leaveDemoState.notice=leaveDemoDays(r.days)+'日の申請を取り下げました。申請可能日数が戻ります。';
  leaveDemoRender();
}
function leaveDemoCancel(){
  if(!leaveDemoIsAuthorized()||!leaveDemoState)return;
  const rows=leaveDemoState.records.filter(r=>r.status==='approved'),r=rows[rows.length-1];
  if(!r)return;
  r.status='cancelled';
  leaveDemoState.notice=leaveDemoDays(r.days)+'日の承認済み申請を取り消した例です。確定残が戻り、年5日実績も再計算されます。';
  leaveDemoRender();
}
function leaveDemoReset(){
  if(!leaveDemoIsAuthorized()||!leaveDemoState)return;
  leaveDemoState=leaveDemoSeed(leaveDemoState.id);leaveDemoRender();
}
function leaveDemoHistoryHtml(snapshot){
  const rows=snapshot.grants.valid.map(g=>({date:g.date,status:'grant',days:g.days,label:'付与',info:'勤続'+(g.index?' '+g.index+'年6か月':'6か月')}))
    .concat(leaveDemoState.records.map(r=>({date:r.date,status:r.status,days:r.days,
      label:({approved:'取得（承認済）',pending:'申請（承認待ち）',withdrawn:'申請取下げ',cancelled:'取得取消'})[r.status],
      info:r.days===.5?'半日':'1日'})))
    .sort((a,b)=>b.date.localeCompare(a.date));
  if(!rows.length)return '<p class="leave-demo-empty">付与前です。履歴はまだありません。</p>';
  return rows.map(r=>{
    const delta=r.status==='grant'?'+'+leaveDemoDays(r.days):
      r.status==='approved'?'−'+leaveDemoDays(r.days):
      r.status==='pending'?'予定 −'+leaveDemoDays(r.days):
      r.status==='cancelled'?'戻し +'+leaveDemoDays(r.days):'取下げ';
    return `<div class='leave-demo-history-row'>
      <time>${escapeHtml(leaveDemoDisplay(r.date))}</time>
      <div><strong>${escapeHtml(r.label)}</strong><small>${escapeHtml(r.info)}</small></div>
      <b class='${r.status}'>${escapeHtml(delta)}${r.status==='withdrawn'?'':'日'}</b>
    </div>`;
  }).join('');
}
function leaveDemoRender(){
  if(!leaveDemoIsAuthorized()||!leaveDemoState)return;
  const d=leaveDemoState,v=leaveDemoCompute(),root=ensureModal(),plan=v.grants;
  const oldMain=root.querySelector&&root.querySelector('.leave-demo-main');
  const oldHistory=root.querySelector&&root.querySelector('.leave-demo-history-scroll');
  const mainScroll=oldMain?oldMain.scrollTop:0,historyScroll=oldHistory?oldHistory.scrollTop:0;
  const focused=document.activeElement,focusPerson=focused&&focused.dataset&&focused.dataset.demoId||'',
    focusControl=focused&&focused.dataset&&focused.dataset.demoControl||'';
  const pending=d.records.some(r=>r.status==='pending'),approved=d.records.some(r=>r.status==='approved'),
    sameDayReserved=leaveDemoDayReserved();
  const type=plan.latest?(v.complete?'complete':v.caution?'caution':'active'):'not-due';
  const scenario=LEAVE_DEMO_PEOPLE.find(p=>p.id===d.id);
  const metric=(label,value,sub,style)=>`<div class='leave-demo-metric ${style||''}'><span>${label}</span>
    <strong>${escapeHtml(leaveDemoDays(value))}日</strong><small>${sub}</small></div>`;
  root.innerHTML=`<div class='modal-backdrop' onclick='leaveDemoClose()'></div>
    <section class='modal-card leave-demo-modal' role='dialog' aria-modal='true' aria-label='有給の動作デモ'>
      <header class='leave-demo-title'><div><small class='leave-demo-tag'>DEMO · 架空データ</small>
        <h2>有給の付与と残数を試す</h2><p>2026年10月8日時点の操作サンプルです。実際の社員・申請・年休台帳には保存されません。</p></div>
        <button type='button' class='icon-button' aria-label='デモを閉じる' onclick='leaveDemoClose()'>×</button></header>
      <div class='leave-demo-main'>
        <div class='leave-demo-presets' role='group' aria-label='デモ社員の切替'>
          ${LEAVE_DEMO_PEOPLE.map(p=>`<button type='button' data-demo-id='${p.id}' aria-pressed='${p.id===d.id}'
            class='${p.id===d.id?'active':''}' onclick='leaveDemoSelect(this.dataset.demoId)'>
            <strong>${escapeHtml(p.label)}</strong><span>${escapeHtml(p.name)}</span></button>`).join('')}
        </div>
        <section class='leave-demo-person'>
          <div><small class='eyebrow'>SAMPLE EMPLOYEE</small><h3>${escapeHtml(d.name)}（サンプル社員）</h3>
            <p>${escapeHtml(d.custom?'入力した入社日で付与日を再計算中':scenario.description)}</p></div>
          <div class='leave-demo-hire'><label for='leaveDemoHireDate'>入社日
            <input type='date' id='leaveDemoHireDate' data-demo-control='hire-date' min='1950-01-01' max='${LEAVE_DEMO_AS_OF}'
              value='${escapeHtml(d.hire)}'></label>
            <button type='button' data-demo-control='hire-date-apply' class='secondary-button compact' onclick='leaveDemoEditHire()'>入社日で再計算</button></div>
        </section>
        <div class='leave-demo-metrics' aria-label='架空の年休残数'>
          ${metric('有効な付与合計',v.granted,'直近2年分','')}
          ${metric('取得済み',v.used,'承認された日数','')}
          ${metric('確定残日数',v.balance,'付与 − 取得','balance')}
          ${metric('承認待ち',v.pending,'まだ確定残は減らない','')}
          ${metric('申請可能',v.available,'確定残 − 承認待ち','available')}
        </div>
        <section class='leave-demo-five ${type}' aria-label='年5日取得状況'>
          <div><strong>${!plan.latest?'初回の付与前':v.complete?'年5日取得達成':v.caution?'年5日の期限に注意':'年5日の取得状況'}</strong>
            <span>${plan.latest?'取得 '+leaveDemoDays(v.taken)+'日 / 5日':'付与前のため対象期間外'}</span></div>
          <div class='leave-demo-meter' role='progressbar' aria-label='年5日取得実績'
            aria-valuemin='0' aria-valuemax='5' aria-valuenow='${Math.min(v.taken,5)}'>
            <span style='width:${Math.min(100,Math.round(v.taken/5*100))}%'></span></div>
          <p>${plan.latest?'あと'+leaveDemoDays(v.needed)+'日 ／ 期限 '+escapeHtml(leaveDemoDisplay(v.deadline))+
            (v.caution&&!v.complete?'（残り'+v.daysLeft+'日）':''):
            '初回付与は '+escapeHtml(leaveDemoDisplay(plan.next&&plan.next.date))+' ／ '+(plan.next?plan.next.days:'—')+'日'}</p>
        </section>
        <div class='leave-demo-columns'>
          <section class='leave-demo-interactions'>
            <div class='leave-demo-heading'><h3>申請・承認の動きを試す</h3>
              <button type='button' data-demo-control='reset' onclick='leaveDemoReset()'>リセット</button></div>
            <div class='leave-demo-actions'>
              <button type='button' class='secondary-button' data-demo-control='apply-day' onclick='leaveDemoApplyRequest(1)' ${v.available<1||sameDayReserved+1>1?'disabled':''}>① 1日を申請</button>
              <button type='button' class='secondary-button' data-demo-control='apply-half' onclick='leaveDemoApplyRequest(0.5)' ${v.available<.5||sameDayReserved+.5>1?'disabled':''}>半日を申請</button>
              <button type='button' class='primary-button' data-demo-control='approve' onclick='leaveDemoApprove()' ${pending?'':'disabled'}>② 申請を承認</button>
              <button type='button' class='secondary-button' data-demo-control='withdraw' onclick='leaveDemoWithdraw()' ${pending?'':'disabled'}>承認待ちを取下げ</button>
              <button type='button' class='secondary-button' data-demo-control='cancel' onclick='leaveDemoCancel()' ${approved?'':'disabled'}>③ 承認済みを取消</button>
            </div>
            <div class='leave-demo-note' role='status' aria-live='polite'>${escapeHtml(d.notice||'「1日申請 → 承認 → 取消」の順に押すと残数がどう変わるか確認できます。')}</div>
            <div class='leave-demo-grant'><h3>入社日からの付与予定</h3>
              <dl><div><dt>今回の付与</dt><dd>${plan.latest?escapeHtml(leaveDemoDisplay(plan.latest.date))+' / '+plan.latest.days+'日':'まだ付与前'}</dd></div>
                <div><dt>次回の付与</dt><dd>${plan.next?escapeHtml(leaveDemoDisplay(plan.next.date))+' / '+plan.next.days+'日':'—'}</dd></div></dl></div>
          </section>
          <section class='leave-demo-history'><h3>架空の付与・取得履歴</h3>
            <div class='leave-demo-history-scroll'>${leaveDemoHistoryHtml(v)}</div></section>
        </div>
        <p class='leave-demo-fineprint'>これは一般労働者で出勤率80％以上を満たしたと仮定した説明用の例です。ダミーの期限計算・残数は本番の年休台帳ではありません。実際のアプリには付与ロットごとの2年間の自動失効は未実装です。</p>
      </div>
      <footer class='leave-demo-footer'><span>デモ操作はサーバーへ送信されず、画面を開き直すと初期化されます。</span>
        <button type='button' class='primary-button compact' onclick='leaveDemoClose()'>閉じる</button></footer>
    </section>`;
  if(root.querySelector){
    const nextMain=root.querySelector('.leave-demo-main'),nextHistory=root.querySelector('.leave-demo-history-scroll');
    if(nextMain)nextMain.scrollTop=mainScroll;
    if(nextHistory)nextHistory.scrollTop=historyScroll;
    const control=focusPerson?root.querySelector('[data-demo-id="'+focusPerson+'"]'):
      focusControl?root.querySelector('[data-demo-control="'+focusControl+'"]'):null;
    if(control&&!control.disabled&&typeof control.focus==='function')
      requestAnimationFrame(()=>control.focus({preventScroll:true}));
  }
}
</script>
