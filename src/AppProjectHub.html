<script>
/* Project workspace uses session-local snapshots and drafts, never persistent business storage. */
let projectHubUi={data:null,at:0,loading:false,refreshNeeded:false,serial:0,error:'',selected:'',tab:'overview',query:'',filter:'all',pickerOpen:false,details:new Map(),pending:new Set(),editor:null,busy:false};
const PROJECT_HUB_TABS=[['overview','概要'],['tasks','計画・進捗'],['effort','工数'],['resources','資料'],['updates','共有メモ']];
function resetProjectHubUi(){projectHubUi={data:null,at:0,loading:false,refreshNeeded:false,serial:0,error:'',selected:'',tab:'overview',query:'',filter:'all',pickerOpen:false,details:new Map(),pending:new Set(),editor:null,busy:false};}
function projectHubIdentity_(){return String(state.sessionToken||'')+'|'+String(state.data&&state.data.user&&state.data.user.employeeId||'');}
function projectHubInvalidate_(){projectHubUi.at=0;projectHubUi.serial++;if(projectHubUi.loading)projectHubUi.refreshNeeded=true;projectHubUi.details.clear();}
function loadProjectHub(options={}){
 if(!state.sessionToken||!state.data)return;
 if(projectHubUi.loading){if(options.force)projectHubUi.refreshNeeded=true;return;}
 if(!options.force&&projectHubUi.data&&Date.now()-projectHubUi.at<300000){if(projectHubUi.selected)projectHubLoadDetail_(projectHubUi.selected);return;}
 if(options.force){projectHubUi.serial++;projectHubUi.details.clear();}
 const ui=projectHubUi,identity=projectHubIdentity_(),serial=ui.serial;ui.loading=true;ui.error='';
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(data=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.loading=false;
  if(serial!==ui.serial||ui.refreshNeeded){ui.refreshNeeded=false;loadProjectHub({force:true});return;}
  if(!data||!Array.isArray(data.projects)){ui.error='プロジェクト情報を確認できませんでした。';renderPageIfActive('projects');return;}
  ui.data=data;ui.at=Date.now();
  if(ui.selected&&!data.projects.some(p=>p.projectId===ui.selected))ui.selected='';
  if(!ui.selected&&data.projects.length)ui.selected=data.projects[0].projectId;
  if(ui.selected)projectHubLoadDetail_(ui.selected);
  renderPageIfActive('projects');
 }).withFailureHandler(error=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.loading=false;
  if(serial!==ui.serial||ui.refreshNeeded){ui.refreshNeeded=false;loadProjectHub({force:true});return;}
  ui.error=cleanApiErrorMessage(error,'プロジェクトを読み込めませんでした。');renderPageIfActive('projects');
 }).getProjectHubWorkspace(state.sessionToken,!!options.force);
}
function projectHubLoadDetail_(id,force=false){
 const ui=projectHubUi,cached=ui.details.get(id);if(!force&&cached&&Date.now()-cached.at<300000)return;
 if(ui.pending.has(id))return;ui.pending.add(id);const identity=projectHubIdentity_(),serial=ui.serial;
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(data=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.pending.delete(id);
  if(serial!==ui.serial){if(ui.selected===id)projectHubLoadDetail_(id,true);return;}
  ui.details.set(id,{data,at:Date.now()});if(ui.selected===id)renderPageIfActive('projects');
 }).withFailureHandler(error=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.pending.delete(id);
  if(serial!==ui.serial){if(ui.selected===id)projectHubLoadDetail_(id,true);return;}
  ui.error=cleanApiErrorMessage(error,'案件の詳細を読み込めませんでした。');renderPageIfActive('projects');
 }).getProjectHubDetail(state.sessionToken,id,force);
}
function projectHubSelect_(id){if(projectHubUi.busy)return;projectHubRememberDraft_();projectHubUi.selected=id;projectHubUi.pickerOpen=false;projectHubUi.error='';projectHubLoadDetail_(id);renderPageIfActive('projects');}
function projectHubTab_(tab){if(projectHubUi.busy||!PROJECT_HUB_TABS.some(x=>x[0]===tab))return;projectHubRememberDraft_();projectHubUi.tab=tab;renderPageIfActive('projects');}
function projectHubSearch_(value){projectHubUi.query=value;const list=document.getElementById('projectHubList');if(list)list.innerHTML=projectHubProjectList_();}
function projectHubTogglePicker_(){if(projectHubUi.busy)return;projectHubRememberDraft_();projectHubUi.pickerOpen=!projectHubUi.pickerOpen;renderPageIfActive('projects');}
function projectHubFilter_(value){projectHubUi.filter=value;renderPageIfActive('projects');}
function projectHubDetail_(){const e=projectHubUi.details.get(projectHubUi.selected);return e&&e.data;}
function projectHubHours_(v){return v==null?'未設定':(Number(v)/60).toLocaleString('ja-JP',{maximumFractionDigits:1})+'時間';}
function projectHubPct_(v){return v==null?'未設定':Number(v)+'%';}
function projectHubAction_(action,label,id='',cls='secondary-button'){return `<button type="button" class="${cls}" data-id="${escapeHtml(id)}" onclick="${action}(this.dataset.id)">${escapeHtml(label)}</button>`;}
function projectHubProgress_(actual,plan){return `<div class="ph-progress" aria-label="作業進捗 ${projectHubPct_(actual)}"><span style="width:${Math.max(0,Math.min(100,Number(actual)||0))}%"></span>${plan==null?'':`<i style="left:${Math.max(0,Math.min(100,Number(plan)||0))}%" title="予定日程の目安 ${plan}%"></i>`}</div>`;}
function projectHubProjectList_(){
 const d=projectHubUi.data||{projects:[]},q=projectHubUi.query.trim().toLowerCase();
 const projects=d.projects.filter(p=>(projectHubUi.filter==='all'||projectHubUi.filter==='risk'&&p.health==='要対応'||projectHubUi.filter==='active'&&p.status==='進行中')&&(!q||[p.name,p.client,p.projectId].join(' ').toLowerCase().includes(q)));
 return projects.map(p=>`<button type="button" class="ph-project ${p.projectId===projectHubUi.selected?'is-selected':''}" data-id="${escapeHtml(p.projectId)}" onclick="projectHubSelect_(this.dataset.id)" aria-pressed="${p.projectId===projectHubUi.selected}"><small>${escapeHtml(p.client||p.projectId)} <em class="ph-badge ${p.health==='要対応'?'risk':''}">${escapeHtml(p.health)}</em></small><strong>${escapeHtml(p.name)}</strong>${projectHubProgress_(p.progress,p.scheduledProgress)}<span>進捗 ${projectHubPct_(p.progress)} <b>${projectHubHours_(p.actualMinutes)}</b></span><small>予定 ${projectHubHours_(p.plannedMinutes)} / 資料 ${p.resourceCount}件</small></button>`).join('')||'<p class="ph-empty">該当する案件がありません。</p>';
}
function projectHubMetric_(label,value,help='',risk=false){return `<div class="ph-metric ${risk?'is-risk':''}"><small>${escapeHtml(label)}</small><strong>${escapeHtml(value)}</strong><span>${escapeHtml(help)}</span></div>`;}
function projectHubOverview_(d){
 const m=d.metrics,p=d.project,plan=d.plan,owner=(projectHubUi.data.employees||[]).find(e=>e.employeeId===plan.ownerId);
 return `<div class="ph-metrics">${projectHubMetric_('作業の完成度',projectHubPct_(m.progress),'予定工数で重み付けした作業の進捗')}${projectHubMetric_('日程上の目安',projectHubPct_(m.scheduledProgress),m.progressGap==null?'作業の開始日・期限を設定すると比較できます':`目安との差 ${m.progressGap>0?'+':''}${m.progressGap}ポイント`,m.progressGap!=null&&m.progressGap<0)}${projectHubMetric_('実績 / 予定工数',projectHubHours_(m.actualMinutes),`予定 ${projectHubHours_(m.plannedMinutes)}・消化率 ${projectHubPct_(m.usagePercent)}`,m.usagePercent>100)}${projectHubMetric_('期限を過ぎた作業',m.overdue+'件',`${m.completeTasks} / ${m.totalTasks}件 完了`,m.overdue>0)}</div>
 <div class="ph-overview-grid"><section class="ph-panel"><h3>案件の概要</h3><dl class="ph-facts"><div><dt>顧客</dt><dd>${escapeHtml(p.client||'未設定')}</dd></div><div><dt>責任者</dt><dd>${escapeHtml(owner?owner.name:'未設定')}</dd></div><div><dt>案件期間</dt><dd>${escapeHtml(p.startDate||'未設定')} 〜 ${escapeHtml(p.endDate||'未設定')}</dd></div><div><dt>状態</dt><dd>${escapeHtml(p.status)}</dd></div></dl><p class="ph-body">${escapeHtml(plan.note||p.note||'案件の目的や次の対応を、計画・受注情報から登録できます。')}</p>${d.canManage?projectHubAction_('projectHubOpenPlan_','計画・受注情報を編集'):''}${state.data.permissions&&state.data.permissions.adminConsole?projectHubAction_('projectHubEditMaster_','案件名・期間を編集',p.projectId):''}</section>
 <section class="ph-panel"><h3>受注情報・関連見積</h3><dl class="ph-facts"><div><dt>受注状態</dt><dd>${escapeHtml(plan.orderStatus||'未登録')}</dd></div><div><dt>受注日</dt><dd>${escapeHtml(plan.receivedOn||'未設定')}</dd></div><div><dt>受注番号</dt><dd>${escapeHtml(plan.orderNo||'未設定')}</dd></div>${d.canSeeOrderValue?`<div><dt>受注金額</dt><dd>${plan.orderValue!==''&&plan.orderValue!=null?Number(plan.orderValue).toLocaleString('ja-JP')+'円':'未設定'}</dd></div>`:''}<div><dt>関連見積</dt><dd>${escapeHtml(d.quote?d.quote.number:plan.quoteId?'ひも付け済み（見積の閲覧権限が必要）':'未設定')}</dd></div></dl>${d.quote?projectHubAction_('projectHubOpenQuote_','関連見積を開く',d.quote.id):''}<p class="ph-help">見積の発行だけで受注済にはしません。受注を確認して、受注日と状態を登録します。</p></section></div>
 <section class="ph-panel"><div class="ph-panel-heading"><h3>次の作業・確認事項</h3>${projectHubAction_('projectHubShowTasks_','作業一覧を見る')}</div>${d.tasks.filter(t=>Number(t.progress)<100).sort((a,b)=>String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999'))).slice(0,4).map(t=>`<div class="ph-next"><strong>${escapeHtml(t.title)}</strong><span>${escapeHtml(t.dueDate||'期限未設定')}・${projectHubPct_(t.progress)}</span></div>`).join('')||'<p class="ph-empty">作業計画を登録すると、次に取り組む内容を確認できます。</p>'}</section>`;
}
function projectHubShowTasks_(){projectHubTab_('tasks');}
function projectHubTasks_(d){return `<section class="ph-panel"><div class="ph-panel-heading"><div><h3>計画と作業の進捗</h3><p class="ph-help">完成度と工数消化率は別の指標です。開始日・期限が全作業にそろうと日程の目安を計算します。</p></div>${d.canManage?projectHubAction_('projectHubOpenTask_','＋ 作業を追加','','primary-button'):''}</div><div class="ph-task-list">${d.tasks.map(t=>{const owner=projectHubUi.data.employees.find(e=>e.employeeId===t.ownerId);return `<article class="ph-task"><div><span class="ph-badge ${t.dueDate&&t.dueDate<d.today&&Number(t.progress)<100?'risk':''}">${escapeHtml(t.status)}</span><h4>${escapeHtml(t.title)}</h4><p>${escapeHtml(owner?owner.name:'担当未設定')}・${escapeHtml(t.startDate||'開始未設定')} 〜 ${escapeHtml(t.dueDate||'期限未設定')}・予定 ${projectHubHours_(Number(t.plannedMinutes))}</p>${projectHubProgress_(Number(t.progress),null)}<small>${escapeHtml(t.note||'')}</small></div><strong>${projectHubPct_(Number(t.progress))}</strong>${t.canEdit?projectHubAction_('projectHubOpenTask_','進捗を更新',t.id):''}${d.canManage?projectHubAction_('projectHubHideTask_','非表示',t.id):''}</article>`;}).join('')||'<p class="ph-empty">要件整理、設計、開発、テストなどの作業と予定工数を登録してください。</p>'}</div></section>`;}
function projectHubBars_(map){const entries=Object.entries(map||{}).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...entries.map(x=>x[1]));return entries.map(([label,v])=>`<div class="ph-bar-row"><span>${escapeHtml(label)}</span><div><i style="width:${v/max*100}%"></i></div><strong>${projectHubHours_(v)}</strong></div>`).join('')||'<p class="ph-empty">工数はまだ登録されていません。</p>';}
function projectHubEffort_(d){return `<div class="ph-metrics">${projectHubMetric_('この案件の総工数',projectHubHours_(d.metrics.actualMinutes),'既存の工数記録から自動集計')}${projectHubMetric_('予定工数',projectHubHours_(d.metrics.plannedMinutes),'案件の予算工数、未設定なら作業計画の合計')}${projectHubMetric_('残り工数',projectHubHours_(d.metrics.remainingMinutes),'マイナスは予定超過',d.metrics.remainingMinutes<0)}</div><div class="ph-overview-grid"><section class="ph-panel"><h3>作業分類別</h3>${projectHubBars_(d.byCategory)}</section><section class="ph-panel"><h3>月別の工数</h3>${projectHubBars_(Object.fromEntries(Object.entries(d.byMonth).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6)))}</section></div><section class="ph-panel"><h3>担当者別の工数</h3><p class="ph-help">案件全体の合計は社員共有。個人別・作業明細は既存権限に合わせて ${escapeHtml(d.worklogScope)} を表示します。</p>${projectHubBars_(Object.fromEntries(d.byPerson.map(p=>[p.name+'（'+p.employeeId+'）',p.minutes])))}</section><section class="ph-panel"><div class="ph-panel-heading"><h3>工数の作業明細</h3>${projectHubAction_('projectHubRecordWork_','この案件の工数を入力','','primary-button')}</div><div class="ph-table-wrap"><table><thead><tr><th>日付</th><th>担当</th><th>作業内容</th><th>工数</th></tr></thead><tbody>${d.worklogs.map(w=>`<tr><td>${escapeHtml(w.date)}</td><td>${escapeHtml(w.name)}</td><td>${escapeHtml(w.description)}</td><td>${projectHubHours_(w.minutes)}</td></tr>`).join('')||'<tr><td colspan="4">表示できる工数記録がありません。</td></tr>'}</tbody></table></div><p class="ph-help">最新100件を表示（閲覧できる記録 ${d.worklogDetailCount}件）。集計は全期間の有効な記録が対象です。</p></section>`;}
function projectHubResources_(d){return `<section class="ph-panel"><div class="ph-panel-heading"><div><h3>この案件の資料</h3><p class="ph-help">案件資料は社員共有です。本文を保存するか、Google Driveなどの原本リンクを登録できます。</p></div>${projectHubAction_('projectHubOpenResource_','＋ 資料を追加','','primary-button')}</div>${d.resources.map(r=>`<details class="ph-resource" data-form-section="ph-resource-${escapeHtml(r.id)}"><summary><span class="ph-resource-icon">文</span><span><strong>${escapeHtml(r.title)}</strong><small>${escapeHtml(r.kind)}・第${Number(r.revision)}版・${escapeHtml(r.updatedAt)}</small></span></summary><div><p class="ph-body">${escapeHtml(r.body||'本文なし')}</p>${r.url?`<a class="secondary-button" href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">原本を開く ↗</a>`:''}${r.canEdit?projectHubAction_('projectHubOpenResource_','資料を編集',r.id)+projectHubAction_('projectHubHideResource_','非表示',r.id):''}</div></details>`).join('')||'<p class="ph-empty">要件定義書・技術設計書・議事録・成果物を、ここにまとめてください。</p>'}</section>`;}
function projectHubUpdates_(d){return `<section class="ph-panel"><div class="ph-panel-heading"><div><h3>共有メモ・決定事項</h3><p class="ph-help">相談、進捗、決定事項、次の対応を案件に残します。新しい投稿は「更新」で確認できます。</p></div>${projectHubAction_('projectHubOpenUpdate_','＋ 共有する','','primary-button')}</div>${d.updates.map(u=>`<article class="ph-update"><header><strong>${escapeHtml(u.authorName)}</strong><span class="ph-badge">${escapeHtml(u.kind)}</span><time>${escapeHtml(u.createdAt)}</time></header><p class="ph-body">${escapeHtml(u.body)}</p></article>`).join('')||'<p class="ph-empty">「テストをお願いします」「仕様はこの案で決定」などを、案件内で共有できます。</p>'}<p class="ph-help">最新60件を表示。共有メモは追記方式です。</p></section>`;}
function projectHubPage(){
 const ui=projectHubUi,data=ui.data,d=projectHubDetail_(),p=data&&data.projects.find(x=>x.projectId===ui.selected),editor=ui.editor&&ui.editor.projectId===ui.selected;
 return `<div class="ph-workspace"><header class="ph-heading"><div><span class="eyebrow">PROJECTS</span><h1>プロジェクト</h1><p>受注・計画・工数・資料・共有を、案件ごとにひとつに。</p></div><div class="button-row">${data&&data.canCreate?projectHubAction_('projectHubCreate_','＋ 案件を登録'):''}<button type="button" class="secondary-button" onclick="loadProjectHub({force:true})" ${ui.busy?'disabled':''}>更新</button></div></header>
 ${ui.error?`<p class="ph-error" role="alert">${escapeHtml(ui.error)}</p>`:''}
 ${data&&data.setupRequired?`<aside class="ph-setup"><strong>計画・資料・共有の保存先を準備してください</strong><p>管理者が「管理・設定 → 運用・労務 → DBスキーマ更新」でバックアップして更新します。既存の案件と工数は引き続き参照できます。</p><small>未作成：${escapeHtml(data.missing.join('、'))}</small>${data.canCreate?`<button type="button" class="secondary-button" onclick="setAdminTab('operation')">DB更新の画面へ</button>`:''}</aside>`:''}
 ${data&&data.unlinkedWorklogCount?`<details class="ph-link-warning"><summary>案件との対応を確認する工数：${data.unlinkedWorklogCount}件</summary><p>現在の案件・記録済み旧案件名に結び付かない記録です。案件の集計には含まれません。管理者が元の案件名を確認してください。</p></details>`:''}
 <div class="ph-layout"><aside class="ph-project-sidebar ${ui.pickerOpen?'is-expanded':''}"><button type="button" class="ph-mobile-picker" onclick="projectHubTogglePicker_()" aria-expanded="${ui.pickerOpen}" ${ui.busy?'disabled':''}><span>${escapeHtml(p?p.name:'案件を選択')}</span><small>${ui.pickerOpen?'選択を閉じる ▴':'案件を変更 ▾'}</small></button><div class="ph-project-controls"><label class="field"><span>案件を検索</span><input id="projectHubSearch" type="search" value="${escapeHtml(ui.query)}" placeholder="案件名・顧客名" oninput="projectHubSearch_(this.value)"></label><select aria-label="案件を絞り込み" onchange="projectHubFilter_(this.value)"><option value="all" ${ui.filter==='all'?'selected':''}>すべての案件</option><option value="active" ${ui.filter==='active'?'selected':''}>進行中</option><option value="risk" ${ui.filter==='risk'?'selected':''}>要対応</option></select><div id="projectHubList" class="ph-project-list">${data?projectHubProjectList_():'<p class="ph-empty">案件を読み込んでいます…</p>'}</div></div></aside><section class="ph-detail">
 ${p?`<header class="ph-detail-heading"><div><small>${escapeHtml(p.client||p.projectId)}</small><h2>${escapeHtml(p.name)}</h2></div><span class="ph-badge ${p.health==='要対応'?'risk':''}">${escapeHtml(p.health)}</span></header><nav class="ph-tabs" aria-label="プロジェクトの内容">${PROJECT_HUB_TABS.map(([id,label])=>`<button type="button" class="${ui.tab===id?'is-active':''}" data-tab="${id}" aria-pressed="${ui.tab===id}" onclick="projectHubTab_(this.dataset.tab)" ${ui.busy?'disabled':''}>${label}</button>`).join('')}</nav>`:''}
 ${editor?projectHubEditor_():!d?`<div class="ph-panel ph-empty">${p?'案件の詳細を読み込んでいます…':'案件を登録するか、一覧から選択してください。'}</div>`:({overview:projectHubOverview_,tasks:projectHubTasks_,effort:projectHubEffort_,resources:projectHubResources_,updates:projectHubUpdates_}[ui.tab]||projectHubOverview_)(d)}
 </section></div></div>`;
}
function projectHubEditMaster_(id){state.authAdmin={...(state.authAdmin||{}),projects:projectHubUi.data.projects};openProjectModal(id);}
function projectHubCreate_(){if(projectHubUi.busy)return;openProjectModal('');}
function projectHubOpenQuote_(id){navigate('quotes');if(state.page==='quotes')quoteOpen(id);}
function projectHubRecordWork_(){const d=projectHubDetail_();if(!d||d.project.status!=='進行中'){showToast('停止・完了した案件には新しい工数を登録できません。');return;}state.data.projects=projectHubUi.data.projects.filter(p=>p.status==='進行中');navigate('worklog');if(state.page!=='worklog')return;const field=document.getElementById('wlQuickProject');if(field){field.value=d.project.name;rememberWorklogQuickDraft();}}
function projectHubOpenEditor_(kind,id=''){
 const ui=projectHubUi,d=projectHubDetail_();if(ui.busy||!d)return;
 if(d.setupRequired){showToast('先に管理者がバックアップ付きDB更新を行ってください。');return;}
 if(ui.editor&&ui.editor.changed){ui.selected=ui.editor.projectId;showToast('入力途中の内容を再開します。先に保存か取消をしてください。');renderPageIfActive('projects');return;}
 let source=kind==='plan'?d.plan:kind==='task'?d.tasks.find(t=>t.id===id):kind==='resource'?d.resources.find(t=>t.id===id):null;
 const form={...source,projectId:ui.selected,id:source&&source.id||'',revision:Number(source&&source.revision||0),requestKey:'PH-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,15)};
 if(kind==='plan'){form.plannedHours=source&&source.plannedMinutes?Number(source.plannedMinutes)/60:'';form.orderStatus=form.orderStatus||'未登録';}
 if(kind==='task'){form.plannedHours=source&&source.plannedMinutes?Number(source.plannedMinutes)/60:'';form.progress=Number(form.progress||0);form.status=form.status||'未着手';}
 if(kind==='resource'){form.resourceKind=form.kind||'要件定義書';form.status=form.status||'共有';}
 if(kind==='update')form.updateKind='共有';
 ui.editor={kind,projectId:ui.selected,form,changed:false,context:d};renderPageIfActive('projects');
}
function projectHubOpenPlan_(){projectHubOpenEditor_('plan');}function projectHubOpenTask_(id){projectHubOpenEditor_('task',id);}function projectHubOpenResource_(id){projectHubOpenEditor_('resource',id);}function projectHubOpenUpdate_(){projectHubOpenEditor_('update');}
function projectHubField_(key,value){if(!projectHubUi.editor||projectHubUi.busy)return;projectHubUi.editor.form[key]=value;projectHubUi.editor.changed=true;if(key==='quoteId'&&projectHubUi.editor.kind==='plan')renderPageIfActive('projects');}
function projectHubRememberDraft_(){if(!projectHubUi.editor||projectHubUi.busy)return;const form=document.getElementById('projectHubForm');if(form)form.querySelectorAll('[data-ph-field]').forEach(el=>projectHubUi.editor.form[el.dataset.phField]=el.value);}
function projectHubCancelEditor_(){if(projectHubUi.busy)return;const discard=()=>{projectHubUi.editor=null;renderPageIfActive('projects');};if(projectHubUi.editor&&projectHubUi.editor.changed)openConfirmDialog('入力を取り消す','保存していない入力を破棄します。','入力を破棄',discard,true);else discard();}
function projectHubInput_(key,label,type='text',required=false,disabled=false){const f=projectHubUi.editor.form;return `<label class="field"><span>${escapeHtml(label)} ${required?'<em>必須</em>':''}</span><input id="ph-${key}" data-ph-field="${key}" type="${type}" value="${escapeHtml(f[key]??'')}" ${required?'required':''} ${disabled?'disabled':''} ${type==='number'?'step="any" min="0"':''} oninput="projectHubField_(this.dataset.phField,this.value)"></label>`;}
function projectHubSelectField_(key,label,options,disabled=false){const f=projectHubUi.editor.form;return `<label class="field"><span>${escapeHtml(label)}</span><select id="ph-${key}" data-ph-field="${key}" onchange="projectHubField_(this.dataset.phField,this.value)" ${disabled?'disabled':''}>${options.map(([v,l])=>`<option value="${escapeHtml(v)}" ${String(f[key]??'')===String(v)?'selected':''}>${escapeHtml(l)}</option>`).join('')}</select></label>`;}
function projectHubTextArea_(key,label,rows=4){return `<label class="field ph-full"><span>${escapeHtml(label)}</span><textarea id="ph-${key}" data-ph-field="${key}" rows="${rows}" oninput="projectHubField_(this.dataset.phField,this.value)">${escapeHtml(projectHubUi.editor.form[key]||'')}</textarea></label>`;}
function projectHubEditor_(){
 const e=projectHubUi.editor,d=projectHubDetail_()||e.context,people=[['','未設定'],...projectHubUi.data.employees.map(p=>[p.employeeId,p.name])],title={plan:'計画・受注情報',task:e.form.id?'作業の進捗を更新':'作業計画を追加',resource:'案件資料を登録・編集',update:'共有メモを投稿'}[e.kind];let fields='';
 if(e.kind==='plan'){
  const quotes=[['','未設定'],...projectHubUi.data.quoteOptions.map(q=>[q.id,q.number+' / '+q.subject])];if(e.form.quoteId&&!quotes.some(x=>x[0]===e.form.quoteId))quotes.push([e.form.quoteId,'ひも付け済み（閲覧権限が必要）']);
  fields=projectHubInput_('plannedHours','案件全体の予定工数（時間）','number')+projectHubSelectField_('ownerId','案件責任者',people,!(state.data.permissions&&state.data.permissions.adminConsole))+projectHubSelectField_('quoteId','正式発行済みの見積',quotes)+projectHubSelectField_('orderStatus','受注状態',['未登録','商談中','受注済','保留','終了'].map(x=>[x,x]))+projectHubInput_('receivedOn','受注日','date')+projectHubInput_('orderNo','受注番号')+(state.data.user.role==='ADMIN'||projectHubUi.data.quoteOptions.some(q=>q.id===e.form.quoteId)?projectHubInput_('orderValue','受注金額（税込・円）','number'):'')+`<div class="ph-full"><button type="button" class="secondary-button" onclick="projectHubCopyQuote_()">選んだ見積の金額を転記</button><p class="ph-help">受注日は実際の受注を確認して入力します。</p></div>`+projectHubTextArea_('note','案件の目的・概要');
 }else if(e.kind==='task'){
  const restricted=!d.canManage;
  fields=projectHubInput_('title','作業名','text',true,restricted)+projectHubSelectField_('ownerId','担当者',people,restricted)+projectHubInput_('plannedHours','予定工数（時間）','number',true,restricted)+projectHubInput_('startDate','開始予定日','date',false,restricted)+projectHubInput_('dueDate','期限','date',false,restricted)+projectHubInput_('progress','完成度（0〜100％）','number',true)+projectHubSelectField_('status','状態',['未着手','進行中','確認待ち','完了','保留'].map(x=>[x,x]))+projectHubTextArea_('note','完了したこと・残っていること');
 }else if(e.kind==='resource'){
  fields=projectHubInput_('title','資料名','text',true)+projectHubSelectField_('resourceKind','種類',['要件定義書','技術設計書','議事録','契約・受注','成果物','その他'].map(x=>[x,x]))+projectHubInput_('url','原本へのHTTPSリンク','url')+`<div class="ph-full"><button type="button" class="secondary-button" onclick="projectHubUseTemplate_()">種類に合ったひな形を入れる</button><p class="ph-help">本文・リンクはこの案件の社員共有資料として保存されます。</p></div>`+projectHubTextArea_('body','資料本文（25,000文字まで）',16);
 }else fields=projectHubSelectField_('updateKind','共有の種類',['共有','進捗','相談','決定事項'].map(x=>[x,x]))+projectHubTextArea_('body','共有内容・次の対応',8);
 return `<section class="ph-panel ph-editor"><div class="ph-panel-heading"><div><h3>${escapeHtml(title)}</h3><p class="ph-help">入力途中の内容はメニューを移動しても再開できます。再読み込み・ログアウトでは消えます。</p></div></div><form id="projectHubForm" onsubmit="event.preventDefault();projectHubSave_()"><div class="ph-form-grid">${fields}</div><p id="projectHubFormError" class="ph-error" role="alert">${escapeHtml(e.error||'')}</p>${projectHubEditorConflict_(e)}<div class="ph-form-actions"><button type="button" class="secondary-button" onclick="projectHubCancelEditor_()" ${projectHubUi.busy?'disabled':''}>取消</button><button type="submit" class="primary-button" ${projectHubUi.busy?'disabled':''}>${projectHubUi.busy?'保存中…':e.pendingOverrides&&e.pendingOverrides.status==='非表示'?'非表示を確定':e.kind==='update'?'共有メモを投稿':'保存する'}</button></div></form></section>`;
}
function projectHubLatestRecord_(e){const d=projectHubDetail_();if(!d)return null;return e.kind==='plan'?d.plan:e.kind==='task'?d.tasks.find(x=>x.id===e.form.id):e.kind==='resource'?d.resources.find(x=>x.id===e.form.id):null;}
function projectHubEditorConflict_(e){
 const latest=projectHubLatestRecord_(e),conflict=latest&&Number(latest.revision||0)!==Number(e.form.revision||0);
 const button=e.error?'<button type="button" class="secondary-button" onclick="projectHubReloadEditor_()">入力を保持して最新情報を確認</button>':'';
 if(!conflict)return button;
 const fields=e.kind==='resource'?[['title','資料名'],['kind','種類'],['url','原本リンク'],['body','本文']]:e.kind==='task'?[['title','作業名'],['ownerId','担当者'],['startDate','開始日'],['dueDate','期限'],['plannedMinutes','予定工数（分）'],['progress','完成度（％）'],['status','状態'],['note','メモ']]:[['ownerId','責任者'],['plannedMinutes','予定工数（分）'],['quoteId','関連見積'],['orderNo','受注番号'],['receivedOn','受注日'],['orderStatus','受注状態'],['note','概要']];
 if(e.kind==='plan'&&projectHubDetail_().canSeeOrderValue)fields.push(['orderValue','受注金額（円）']);
 return `<aside class="ph-setup"><strong>保存中に別の更新がありました。入力は保持しています。</strong><details><summary>最新の登録内容を確認</summary>${fields.map(([key,label])=>`<p><b>${escapeHtml(label)}</b></p><p class="ph-body">${escapeHtml(latest[key]||'未設定')}</p>`).join('')}</details><button type="button" class="secondary-button" onclick="projectHubAcceptLatest_()">最新内容を確認したうえで、この入力で更新する</button><p>この操作の後、保存ボタンで確定します。担当作業の名称・担当・予定は最新の計画を使用します。</p></aside>`;
}
function projectHubReloadEditor_(){if(projectHubUi.busy||!projectHubUi.editor)return;projectHubRememberDraft_();projectHubLoadDetail_(projectHubUi.editor.projectId,true);}
function projectHubAcceptLatest_(){const e=projectHubUi.editor;if(!e||projectHubUi.busy)return;projectHubRememberDraft_();const latest=projectHubLatestRecord_(e);if(!latest)return;e.form.revision=Number(latest.revision||0);e.error='';e.changed=true;if(e.kind==='task'&&!projectHubDetail_().canManage){['title','ownerId','startDate','dueDate'].forEach(k=>e.form[k]=latest[k]);e.form.plannedHours=Number(latest.plannedMinutes)/60;}renderPageIfActive('projects');}
function projectHubCopyQuote_(){const e=projectHubUi.editor;if(!e)return;projectHubRememberDraft_();const q=projectHubUi.data.quoteOptions.find(q=>q.id===e.form.quoteId);if(!q){showToast('閲覧できる正式見積を選択してください。');return;}e.form.orderValue=q.total;e.changed=true;renderPageIfActive('projects');}
function projectHubUseTemplate_(){const e=projectHubUi.editor;if(!e)return;projectHubRememberDraft_();if(e.form.body){showToast('入力済みの本文は保持します。');return;}const templates={'要件定義書':'# 目的\n\n# 利用者・対象業務\n\n# 必要な機能\n\n# 対象外・未確認事項\n\n# 受入条件\n\n# 決定事項・確認日\n','技術設計書':'# 全体構成\n\n# 画面・操作\n\n# データ構造\n\n# API・外部連携\n\n# 権限・安全性\n\n# エラー・復旧\n\n# テスト・公開手順\n','議事録':'# 日時・参加者\n\n# 議題\n\n# 決定事項\n\n# 次の対応（担当・期限）\n'};e.form.body=templates[e.form.resourceKind]||'# 概要\n\n# 内容\n\n# 関連資料\n';e.changed=true;renderPageIfActive('projects');}
function projectHubHideTask_(id){projectHubHide_('task',id);}
function projectHubHideResource_(id){projectHubHide_('resource',id);}
function projectHubHide_(kind,id){
 if(projectHubUi.busy)return;if(projectHubUi.editor&&projectHubUi.editor.changed){showToast('入力中の内容を先に保存か取消してください。');return;}
 const d=projectHubDetail_(),record=d&&(kind==='task'?d.tasks:d.resources).find(x=>x.id===id);if(!record||!(kind==='task'?d.canManage:record.canEdit))return;
 openConfirmDialog('この'+(kind==='task'?'作業':'資料')+'を非表示にする',kind==='task'?'登録履歴を保持して、現在の作業一覧と計画集計から外します。':'登録履歴を保持して、現在の資料一覧から外します。','非表示にする',()=>{projectHubOpenEditor_(kind,id);const e=projectHubUi.editor;if(e&&e.kind===kind&&e.form.id===id)projectHubSave_({status:'非表示'});},true);
}
function projectHubSave_(overrides={}){
 const ui=projectHubUi,e=ui.editor;if(ui.busy||!e)return;projectHubRememberDraft_();const pending=overrides.status==='非表示'?overrides:(e.pendingOverrides||{});e.pendingOverrides=pending;ui.busy=true;const identity=projectHubIdentity_();
 document.querySelectorAll('#projectHubForm input,#projectHubForm textarea,#projectHubForm select,#projectHubForm button').forEach(el=>el.disabled=true);
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(result=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.busy=false;
  if(!result||result.ok!==true){ui.error='保存結果を確認できませんでした。同じ入力を保持しています。';renderPageIfActive('projects');return;}
  ui.editor=null;ui.selected=e.projectId;ui.tab={plan:'overview',task:'tasks',resource:'resources',update:'updates'}[e.kind];projectHubInvalidate_();
  showToast(result.auditRecorded===false?'保存済みですが、監査履歴を管理者が確認してください。':'プロジェクトに保存しました');loadProjectHub({force:true});renderPageIfActive('projects');
 }).withFailureHandler(error=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.busy=false;e.error=cleanApiErrorMessage(error,'保存できませんでした。入力は保持しています。');renderPageIfActive('projects');
 }).saveProjectHubRecord(state.sessionToken,e.kind,{...e.form,...pending});
}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('beforeunload',event=>{if(projectHubUi.editor&&projectHubUi.editor.changed){event.preventDefault();event.returnValue='';}});
</script>
