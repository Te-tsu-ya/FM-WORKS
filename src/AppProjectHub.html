<script>
/* Project workspace uses session-local snapshots and drafts, never persistent business storage. */
let projectHubUi={data:null,at:0,loading:false,refreshNeeded:false,serial:0,error:'',selected:'',tab:'overview',query:'',filter:'all',pickerOpen:false,details:new Map(),pending:new Set(),editor:null,busy:false,view:'list',sort:'updated',limit:20,resourceFilter:'all',resourceQuery:'',updateFilter:'all',updateQuery:'',taskView:'board'};
const PROJECT_HUB_TABS=[['overview','概要'],['tasks','計画・進捗'],['effort','工数'],['resources','資料'],['updates','共有メモ'],['advanced','詳細管理']];

/* Session-only, privacy-preserving client RPC timing; counts browser/network/server round trips. */
const PROJECT_HUB_TIMING_LABELS=['案件一覧','案件詳細','詳細管理','案件保存'];
const projectHubTimingSamples=[];
function projectHubTimingRecord_(label,startedAt,success){
 if(!PROJECT_HUB_TIMING_LABELS.includes(label)||!Number.isFinite(Number(startedAt)))return;
 const ms=Math.max(0,Date.now()-Number(startedAt));
 projectHubTimingSamples.push({label,ms,ok:!!success});
 if(projectHubTimingSamples.length>500)projectHubTimingSamples.splice(0,projectHubTimingSamples.length-500);
}
function projectHubTimingPanel_(){
 const fmt=n=>n==null?'未計測':Math.round(n).toLocaleString('ja-JP')+' ms';
 const rows=PROJECT_HUB_TIMING_LABELS.map(label=>{
  const values=projectHubTimingSamples.filter(x=>x.label===label),sort=values.map(x=>x.ms).sort((a,b)=>a-b),count=sort.length,fail=values.filter(x=>!x.ok).length;
  const p50=count?sort[Math.ceil(count*.5)-1]:null,p95=count>=20?sort[Math.ceil(count*.95)-1]:null;
  const suffix=count&&count<20?'P95は20回以上で表示':'';
  return '<tr><td>'+escapeHtml(label)+'</td><td>'+count+'回</td><td>'+fmt(p50)+'</td><td>'+(count>=20?fmt(p95):'20回未満')+'</td><td>'+fmt(count?sort[count-1]:null)+'</td><td>'+fail+'回</td></tr>';
 }).join('');
 return `<details class="ph-panel ph-timing-panel"><summary>プロジェクトの通信速度を確認する</summary><p class="ph-help">このブラウザーの現在のログイン中に実際に発生した通信の往復時間です（ネットワーク・GAS起動・サーバー処理を含む）。キャッシュ表示や初回アプリ起動時間は含みません。20回以上の測定でP95を表示します。測定操作は追加の通信を発生させません。</p><div class="ph-table-wrap"><table class="ph-manager-table"><thead><tr><th>操作</th><th>件数</th><th>P50</th><th>P95</th><th>最長</th><th>失敗</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}

function resetProjectHubUi(){projectHubTimingSamples.length=0;if(typeof resetProjectAdvancedUi_==='function')resetProjectAdvancedUi_();projectHubUi={data:null,at:0,loading:false,refreshNeeded:false,serial:0,error:'',selected:'',tab:'overview',query:'',filter:'all',pickerOpen:false,details:new Map(),pending:new Set(),editor:null,busy:false,view:'list',sort:'updated',limit:20,resourceFilter:'all',resourceQuery:'',updateFilter:'all',updateQuery:'',taskView:'board'};}
function projectHubIdentity_(){return String(state.sessionToken||'')+'|'+String(state.data&&state.data.user&&state.data.user.employeeId||'');}
function projectHubInvalidate_(){projectHubUi.at=0;projectHubUi.serial++;if(projectHubUi.loading)projectHubUi.refreshNeeded=true;projectHubUi.details.clear();}
function loadProjectHub(options={}){
 if(!state.sessionToken||!state.data)return;
 if(projectHubUi.loading){if(options.force)projectHubUi.refreshNeeded=true;return;}
 if(!options.force&&projectHubUi.data&&Date.now()-projectHubUi.at<300000){if(projectHubUi.selected&&(projectHubUi.view==='detail'||projectHubUi.editor))projectHubLoadDetail_(projectHubUi.selected);return;}
 if(options.force){projectHubUi.serial++;projectHubUi.details.clear();}
 const ui=projectHubUi,identity=projectHubIdentity_(),serial=ui.serial,started=Date.now();ui.loading=true;ui.error='';
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(data=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.loading=false;
  if(serial!==ui.serial||ui.refreshNeeded){ui.refreshNeeded=false;loadProjectHub({force:true});return;}
  projectHubTimingRecord_('案件一覧',started,!!data&&Array.isArray(data.projects));
  if(!data||!Array.isArray(data.projects)){ui.error='プロジェクト情報を確認できませんでした。';renderPageIfActive('projects');return;}
  ui.data=data;ui.at=Date.now();
  if(ui.selected&&!data.projects.some(p=>p.projectId===ui.selected))ui.selected='';
  if(!ui.selected&&data.projects.length)ui.selected=data.projects[0].projectId;
  if(ui.selected&&(ui.view==='detail'||ui.editor))projectHubLoadDetail_(ui.selected);
  renderPageIfActive('projects');
 }).withFailureHandler(error=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.loading=false;
  if(serial!==ui.serial||ui.refreshNeeded){ui.refreshNeeded=false;loadProjectHub({force:true});return;}
  projectHubTimingRecord_('案件一覧',started,false);
  ui.error=cleanApiErrorMessage(error,'プロジェクトを読み込めませんでした。');renderPageIfActive('projects');
 }).getProjectHubWorkspace(state.sessionToken,!!options.force);
}
function projectHubLoadDetail_(id,force=false){
 const ui=projectHubUi,cached=ui.details.get(id);if(!force&&cached&&Date.now()-cached.at<300000)return;
 if(ui.pending.has(id))return;ui.pending.add(id);const identity=projectHubIdentity_(),serial=ui.serial,started=Date.now();
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(data=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.pending.delete(id);
  if(serial!==ui.serial){if(ui.selected===id)projectHubLoadDetail_(id,true);return;}
  projectHubTimingRecord_('案件詳細',started,!!data);
  ui.details.set(id,{data,at:Date.now()});if(ui.selected===id)renderPageIfActive('projects');
 }).withFailureHandler(error=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.pending.delete(id);
  if(serial!==ui.serial){if(ui.selected===id)projectHubLoadDetail_(id,true);return;}
  projectHubTimingRecord_('案件詳細',started,false);
  ui.error=cleanApiErrorMessage(error,'案件の詳細を読み込めませんでした。');renderPageIfActive('projects');
 }).getProjectHubDetail(state.sessionToken,id,force);
}
function projectHubSelect_(id){
 if(projectHubUi.busy)return;
 if(projectHubUi.editor&&projectHubUi.editor.changed){showToast('入力途中の内容を保存するか、取消してください。');return;}
 projectHubRememberDraft_();
 projectHubUi.selected=id;projectHubUi.view='detail';projectHubUi.tab='overview';projectHubUi.pickerOpen=false;projectHubUi.error='';
 projectHubLoadDetail_(id);renderPageIfActive('projects');
}
function projectHubTab_(tab){
 if(projectHubUi.busy||!PROJECT_HUB_TABS.some(x=>x[0]===tab))return;
 projectHubRememberDraft_();projectHubUi.tab=tab;projectHubUi.view='detail';
 if(tab==='advanced'&&typeof projectAdvancedLoad_==='function')projectAdvancedLoad_();
 if(projectHubUi.selected)projectHubLoadDetail_(projectHubUi.selected);
 renderPageIfActive('projects');
}
function projectHubSearch_(value){
 projectHubUi.query=value;projectHubUi.limit=20;
 const list=document.getElementById('phPortfolioResults');
 if(list)list.innerHTML=projectHubPortfolioRows_();
 const count=document.getElementById('phPortfolioCount');
 if(count)count.textContent=projectHubVisibleProjects_().length+' 件の案件';
 const legacy=document.getElementById('projectHubList');
 if(legacy)legacy.innerHTML=projectHubProjectList_();
}
function projectHubTogglePicker_(){if(projectHubUi.busy)return;projectHubRememberDraft_();projectHubUi.pickerOpen=!projectHubUi.pickerOpen;renderPageIfActive('projects');}
function projectHubFilter_(value){
 projectHubUi.filter=value;projectHubUi.limit=20;renderPageIfActive('projects');
}
function projectHubDetail_(){const e=projectHubUi.details.get(projectHubUi.selected);return e&&e.data;}
function projectHubHours_(v){return v==null?'未設定':(Number(v)/60).toLocaleString('ja-JP',{maximumFractionDigits:1})+'時間';}
function projectHubPct_(v){return v==null?'未設定':Number(v)+'%';}
function projectHubAction_(action,label,id='',cls='secondary-button'){return `<button type="button" class="${cls}" data-id="${escapeHtml(id)}" onclick="${action}(this.dataset.id)">${escapeHtml(label)}</button>`;}
function projectHubProgress_(actual,plan){return `<div class="ph-progress" aria-label="作業進捗 ${projectHubPct_(actual)}"><span style="width:${Math.max(0,Math.min(100,Number(actual)||0))}%"></span>${plan==null?'':`<i style="left:${Math.max(0,Math.min(100,Number(plan)||0))}%" title="予定日程の目安 ${plan}%"></i>`}</div>`;}
function projectHubProjectList_(){
 return projectHubVisibleProjects_().map(p=>`<button type="button" class="ph-project ${p.projectId===projectHubUi.selected?'is-selected':''}" data-id="${escapeHtml(p.projectId)}" onclick="projectHubSelect_(this.dataset.id)" aria-pressed="${p.projectId===projectHubUi.selected}"><small>${escapeHtml(p.client||'社内')} <em class="ph-badge ${p.health==='要対応'?'risk':''}">${escapeHtml(p.health)}</em></small><strong>${escapeHtml(p.name)}</strong>${projectHubProgress_(p.progress,p.scheduledProgress)}<span>進捗 ${projectHubPct_(p.progress)} <b>${projectHubHours_(p.actualMinutes)}</b></span><small>予定 ${projectHubHours_(p.plannedMinutes)} / 資料 ${p.resourceCount||0}件</small></button>`).join('')||'<p class="ph-empty">該当する案件がありません。</p>';
}
function projectHubMetric_(label,value,help='',risk=false){return `<div class="ph-metric ${risk?'is-risk':''}"><small>${escapeHtml(label)}</small><strong>${escapeHtml(value)}</strong><span>${escapeHtml(help)}</span></div>`;}
function projectHubOverviewActivity_(d){
 const docs=(d.resources||[]).slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).slice(0,4);
 const latest=(d.updates||[]).slice(0,4),decisions=latest.filter(x=>x.kind==='決定事項');
 return `<div class="ph-overview-grid ph-recent-grid"><section class="ph-panel"><div class="ph-panel-heading"><h3>最近の資料</h3>${projectHubAction_('projectHubTab_','資料を見る','resources')}</div>
 ${docs.map(r=>`<div class="ph-recent-item"><span class="ph-badge">${escapeHtml(r.kind||'資料')}</span><strong>${escapeHtml(r.title)}</strong><small>${escapeHtml(r.updatedAt||'')}</small></div>`).join('')||'<p class="ph-empty">資料はまだ登録されていません。要件定義書や設計資料をこの案件に追加できます。</p>'}</section>
 <section class="ph-panel"><div class="ph-panel-heading"><h3>最近の共有・決定事項</h3>${projectHubAction_('projectHubTab_','共有メモを見る','updates')}</div>
 ${latest.map(u=>`<div class="ph-recent-item"><span class="ph-badge ${u.kind==='決定事項'?'ph-decision-badge':''}">${escapeHtml(u.kind||'共有')}</span><strong>${escapeHtml(String(u.body||'').slice(0,110))}</strong><small>${escapeHtml(u.authorName||'')} ・ ${escapeHtml(u.createdAt||'')}</small></div>`).join('')||'<p class="ph-empty">共有メモがありません。相談・進捗・決定事項を投稿できます。</p>'}
 ${decisions.length?'<p class="ph-help">決定事項は投稿時の種類に基づいて表示します。</p>':''}</section></div>`;
}
function projectHubOverview_(d){
 const m=d.metrics,p=d.project,plan=d.plan,owner=(projectHubUi.data.employees||[]).find(e=>e.employeeId===plan.ownerId);
 return `<div class="ph-metrics">${projectHubMetric_('作業の完成度',projectHubPct_(m.progress),'予定工数で重み付けした作業の進捗')}${projectHubMetric_('日程上の目安',projectHubPct_(m.scheduledProgress),m.progressGap==null?'作業の開始日・期限を設定すると比較できます':`目安との差 ${m.progressGap>0?'+':''}${m.progressGap}ポイント`,m.progressGap!=null&&m.progressGap<0)}${projectHubMetric_('実績 / 予定工数',projectHubHours_(m.actualMinutes),`予定 ${projectHubHours_(m.plannedMinutes)}・消化率 ${projectHubPct_(m.usagePercent)}`,m.usagePercent>100)}${projectHubMetric_('期限を過ぎた作業',m.overdue+'件',`${m.completeTasks} / ${m.totalTasks}件 完了`,m.overdue>0)}</div>
 <div class="ph-overview-grid"><section class="ph-panel"><h3>案件の概要</h3><dl class="ph-facts"><div><dt>顧客</dt><dd>${escapeHtml(p.client||'未設定')}</dd></div><div><dt>責任者</dt><dd>${escapeHtml(owner?owner.name:'未設定')}</dd></div><div><dt>案件期間</dt><dd>${escapeHtml(p.startDate||'未設定')} 〜 ${escapeHtml(p.endDate||'未設定')}</dd></div><div><dt>状態</dt><dd>${escapeHtml(p.status)}</dd></div></dl><p class="ph-body">${escapeHtml(plan.note||p.note||'案件の目的や次の対応を、計画・受注情報から登録できます。')}</p>${d.canManage?projectHubAction_('projectHubOpenPlan_','計画・受注情報を編集'):''}${state.data.permissions&&state.data.permissions.adminConsole?projectHubAction_('projectHubEditMaster_','案件名・期間を編集',p.projectId):''}</section>
 <section class="ph-panel"><h3>受注情報・関連見積</h3><dl class="ph-facts"><div><dt>受注状態</dt><dd>${escapeHtml(plan.orderStatus||'未登録')}</dd></div><div><dt>受注日</dt><dd>${escapeHtml(plan.receivedOn||'未設定')}</dd></div><div><dt>受注番号</dt><dd>${escapeHtml(plan.orderNo||'未設定')}</dd></div>${d.canSeeOrderValue?`<div><dt>受注金額</dt><dd>${plan.orderValue!==''&&plan.orderValue!=null?Number(plan.orderValue).toLocaleString('ja-JP')+'円':'未設定'}</dd></div>`:''}<div><dt>関連見積</dt><dd>${escapeHtml(d.quote?d.quote.number:plan.quoteId?'ひも付け済み（見積の閲覧権限が必要）':'未設定')}</dd></div></dl>${d.quote?projectHubAction_('projectHubOpenQuote_','関連見積を開く',d.quote.id):''}<p class="ph-help">見積の発行だけで受注済にはしません。受注を確認して、受注日と状態を登録します。</p></section></div>
 <section class="ph-panel"><div class="ph-panel-heading"><h3>次の作業・確認事項</h3>${projectHubAction_('projectHubShowTasks_','作業一覧を見る')}</div>${d.tasks.filter(t=>Number(t.progress)<100).sort((a,b)=>String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999'))).slice(0,4).map(t=>`<div class="ph-next"><strong>${escapeHtml(t.title)}</strong><span>${escapeHtml(t.dueDate||'期限未設定')}・${projectHubPct_(t.progress)}</span></div>`).join('')||'<p class="ph-empty">作業計画を登録すると、次に取り組む内容を確認できます。</p>'}</section>${projectHubOverviewActivity_(d)}`;
}
function projectHubShowTasks_(){projectHubTab_('tasks');}
function projectHubTaskView_(view){
 if(!['board','timeline','list'].includes(view)||projectHubUi.busy||projectHubUi.editor)return;
 projectHubUi.taskView=view;renderPageIfActive('projects');
}
function projectHubTaskRow_(t,d){
 const team=projectHubUi.data&&projectHubUi.data.employees||[];
 const owner=team.find(x=>x.employeeId===t.ownerId),late=t.dueDate&&t.dueDate<d.today&&Number(t.progress)<100;
 return `<article class="ph-task"><div><span class="ph-badge ${late?'risk':''}">${escapeHtml(t.status||'未着手')}</span><h4>${escapeHtml(t.title)}</h4><p>${escapeHtml(owner?owner.name:'担当未設定')}・${escapeHtml(t.startDate||'開始日未設定')} ～ ${escapeHtml(t.dueDate||'期限未設定')}・予定 ${projectHubHours_(t.plannedMinutes)}</p>${projectHubProgress_(t.progress,null)}${t.note?`<small>${escapeHtml(t.note)}</small>`:''}</div><strong>${projectHubPct_(t.progress)}</strong>${t.canEdit?projectHubAction_('projectHubOpenTask_','編集',t.id):''}${d.project.status==='進行中'?projectHubAction_('projectHubRecordWork_','工数を記録',t.id):''}${d.canManage?projectHubAction_('projectHubHideTask_','非表示',t.id):''}</article>`;
}
function projectHubTaskList_(d,tasks){
 const rows=tasks||d.tasks||[];
 return `<div class="ph-task-list">${rows.map(t=>projectHubTaskRow_(t,d)).join('')||'<p class="ph-empty">作業がありません。案件責任者が作業を追加できます。</p>'}</div>`;
}
function projectHubTaskBoard_(d){
 const tasks=d.tasks||[],columns=['未着手','進行中','確認待ち','保留','完了'];
 const team=projectHubUi.data&&projectHubUi.data.employees||[];
 return `<div class="ph-kanban-board">${columns.map(status=>{
  const list=tasks.filter(t=>(t.status||'未着手')===status).sort((a,b)=>String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999')));
  return `<section class="ph-kanban-column"><h4>${escapeHtml(status)} <small>${list.length}件</small></h4>${list.map(t=>{
   const owner=team.find(x=>x.employeeId===t.ownerId),late=t.dueDate&&t.dueDate<d.today&&Number(t.progress)<100;
   return `<article class="ph-kanban-card ${late?'ph-is-late':''}"><div class="ph-kanban-top"><span class="ph-badge ${late?'risk':''}">${escapeHtml(t.status||'未着手')}</span>${late?'<span class="ph-warning">期限超過</span>':''}</div><h4>${escapeHtml(t.title)}</h4><p>担当：${escapeHtml(owner?owner.name:'未設定')}</p><p>期限：${escapeHtml(t.dueDate||'未設定')} / 予定 ${projectHubHours_(t.plannedMinutes)}</p>${projectHubProgress_(t.progress,null)}<div class="ph-kanban-bottom"><strong>${projectHubPct_(t.progress)}</strong>${t.canEdit?projectHubAction_('projectHubOpenTask_','編集',t.id):''}${d.project.status==='進行中'?projectHubAction_('projectHubRecordWork_','工数を記録',t.id):''}</div></article>`;
  }).join('')||'<p class="ph-empty">作業なし</p>'}</section>`;
 }).join('')}</div>`;
}
function projectHubTaskTimeline_(d){
 const tasks=d.tasks||[],day=v=>Date.parse(v+'T00:00:00Z'),isDate=v=>{const text=String(v||'');const ms=day(text);return /^\d{4}-\d{2}-\d{2}$/.test(text)&&Number.isFinite(ms)&&new Date(ms).toISOString().slice(0,10)===text;};
 const dated=tasks.filter(t=>isDate(t.startDate)&&isDate(t.dueDate)&&t.startDate<=t.dueDate),undated=tasks.filter(t=>!dated.includes(t));
 if(!dated.length)return `<p class="ph-empty">工程表を表示するには、作業の開始予定日と期限を入力してください。</p>${undated.length?projectHubTaskList_(d,undated):''}`;
 const start=Math.min(...dated.map(t=>day(t.startDate))),end=Math.max(...dated.map(t=>day(t.dueDate))),span=Math.max(86400000,end-start);
 const ticks=Array.from({length:5},(_,i)=>new Date(start+span*i/4).toISOString().slice(5,10));
 const today=day(d.today),showToday=Number.isFinite(today)&&today>=start&&today<=end;
 const marker=showToday?`<i class="ph-timeline-today" style="left:${((today-start)/span*100).toFixed(2)}%" aria-label="本日"></i>`:'';
 const header=`<div class="ph-timeline-line ph-timeline-header"><strong>作業名 / 期間</strong><div class="ph-timeline-track">${ticks.map((text,i)=>`<span style="left:${i*25}%">${escapeHtml(text)}</span>`).join('')}${marker}</div></div>`;
 const rows=[...dated].sort((a,b)=>a.startDate.localeCompare(b.startDate)).map(t=>{
  const left=(day(t.startDate)-start)/span*100,length=Math.max(1,(day(t.dueDate)-day(t.startDate)+86400000)/span*100);
  const width=Math.min(100-left,length),pct=Math.max(0,Math.min(100,Number(t.progress)||0)),late=t.dueDate<d.today&&pct<100;
  return `<div class="ph-timeline-line"><div class="ph-timeline-label"><strong>${escapeHtml(t.title)}</strong><small>${escapeHtml(t.startDate)} ～ ${escapeHtml(t.dueDate)}</small></div><div class="ph-timeline-track">${marker}<div class="ph-timeline-bar ${late?'ph-is-late':''}" role="img" aria-label="${escapeHtml(t.title)}・完成度${pct}%" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%"><i style="width:${pct}%"></i></div></div></div>`;
 }).join('');
 return `<p class="ph-help">表示期間：${new Date(start).toISOString().slice(0,10)} ～ ${new Date(end).toISOString().slice(0,10)}。帯は予定期間、塗り部分は作業の完成度を表します。依存関係や休日を考慮した工程予測ではありません。</p><div class="ph-timeline-scroll"><div class="ph-timeline">${header}${rows}</div></div>${undated.length?`<div class="ph-timeline-undated"><h4>予定日が未設定の作業（${undated.length}件）</h4>${projectHubTaskList_(d,undated)}</div>`:''}`;
}
function projectHubTasks_(d){
 const tasks=d.tasks||[],complete=tasks.filter(t=>Number(t.progress)>=100).length,late=tasks.filter(t=>t.dueDate&&t.dueDate<d.today&&Number(t.progress)<100).length;
 const view=['board','timeline','list'].includes(projectHubUi.taskView)?projectHubUi.taskView:'board';
 const options=[['board','ボード'],['timeline','工程表'],['list','一覧']];
 return `<section class="ph-panel ph-tasks-workspace"><div class="ph-panel-heading"><div><h3>計画・進捗</h3><p class="ph-help">担当者、期限、作業の完成度を確認できます。</p></div>${d.canManage?projectHubAction_('projectHubOpenTask_','＋ 作業を追加','','primary-button'):''}</div>
 <div class="ph-task-summary"><div><strong>${tasks.length}件</strong><small>作業総数</small></div><div><strong>${complete}件</strong><small>完了</small></div><div class="${late?'ph-is-late':''}"><strong>${late}件</strong><small>期限超過</small></div><div><strong>${projectHubPct_(d.metrics.progress)}</strong><small>作業の完成度</small></div></div>
 <nav class="ph-display-tabs" role="group" aria-label="計画・進捗の表示方法">${options.map(([id,label])=>`<button type="button" class="${view===id?'is-active':''}" aria-pressed="${view===id}" onclick="projectHubTaskView_('${id}')">${label}</button>`).join('')}</nav>
 ${view==='timeline'?projectHubTaskTimeline_(d):view==='list'?projectHubTaskList_(d):projectHubTaskBoard_(d)}
 <p class="ph-help">状態を変更する場合は「編集」から保存してください。完成度と工数消化率は異なる数値です。</p></section>`;
}
function projectHubBars_(map){const entries=Object.entries(map||{}).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...entries.map(x=>x[1]));return entries.map(([label,v])=>`<div class="ph-bar-row"><span>${escapeHtml(label)}</span><div><i style="width:${v/max*100}%"></i></div><strong>${projectHubHours_(v)}</strong></div>`).join('')||'<p class="ph-empty">工数はまだ登録されていません。</p>';}
function projectHubEffort_(d){

function projectHubHide_(kind,id){
 if(projectHubUi.busy)return;if(projectHubUi.editor&&projectHubUi.editor.changed){showToast('入力中の内容を先に保存か取消してください。');return;}
 const d=projectHubDetail_(),record=d&&(kind==='task'?d.tasks:d.resources).find(x=>x.id===id);if(!record||!(kind==='task'?d.canManage:record.canEdit))return;
 openConfirmDialog('この'+(kind==='task'?'作業':'資料')+'を非表示にする',kind==='task'?'登録履歴を保持して、現在の作業一覧と計画集計から外します。':'登録履歴を保持して、現在の資料一覧から外します。','非表示にする',()=>{projectHubOpenEditor_(kind,id);const e=projectHubUi.editor;if(e&&e.kind===kind&&e.form.id===id)projectHubSave_({status:'非表示'});},true);
}
function projectHubSave_(overrides={}){
 const ui=projectHubUi,e=ui.editor;if(ui.busy||!e)return;projectHubRememberDraft_();const pending=overrides.status==='非表示'?overrides:(e.pendingOverrides||{});e.pendingOverrides=pending;ui.busy=true;const identity=projectHubIdentity_();
 const started=Date.now();
 document.querySelectorAll('#projectHubForm input,#projectHubForm textarea,#projectHubForm select,#projectHubForm button').forEach(el=>el.disabled=true);
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(result=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.busy=false;
  projectHubTimingRecord_('案件保存',started,!!result&&result.ok===true);
  if(!result||result.ok!==true){ui.error='保存結果を確認できませんでした。同じ入力を保持しています。';renderPageIfActive('projects');return;}
  ui.editor=null;ui.selected=e.projectId;ui.tab={plan:'overview',task:'tasks',resource:'resources',update:'updates'}[e.kind];projectHubInvalidate_();
  showToast(result.auditRecorded===false?'保存済みですが、監査履歴を管理者が確認してください。':'プロジェクトに保存しました');loadProjectHub({force:true});renderPageIfActive('projects');
 }).withFailureHandler(error=>{
  if(ui!==projectHubUi||identity!==projectHubIdentity_())return;ui.busy=false;projectHubTimingRecord_('案件保存',started,false);e.error=cleanApiErrorMessage(error,'保存できませんでした。入力は保持しています。');renderPageIfActive('projects');
 }).saveProjectHubRecord(state.sessionToken,e.kind,{...e.form,...pending});
}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('beforeunload',event=>{if(projectHubUi.editor&&projectHubUi.editor.changed){event.preventDefault();event.returnValue='';}});
</script>
