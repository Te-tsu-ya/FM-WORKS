<script>
/* Protected workspaces: finance and private file data never enter the normal portfolio payload. */
let projectAdvancedUi={id:'',identity:'',data:null,at:0,mode:'dependencies',loading:false,busy:false,error:'',costAttempt:null,fileAttempt:null,confirmRemove:null};
function resetProjectAdvancedUi_(){projectAdvancedUi={id:'',identity:'',data:null,at:0,mode:'dependencies',loading:false,busy:false,error:'',costAttempt:null,fileAttempt:null,confirmRemove:null};}
function projectAdvancedLoad_(force=false){
 const id=projectHubUi.selected,identity=projectHubIdentity_();
 if(!id||!state.sessionToken)return;
 const ui=projectAdvancedUi;
 if(!force&&ui.id===id&&ui.identity===identity&&ui.data&&Date.now()-ui.at<120000)return;
 if(ui.loading)return;
 ui.id=id;ui.identity=identity;ui.loading=true;ui.error='';const started=Date.now();
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(result=>{
  if(ui!==projectAdvancedUi||identity!==projectHubIdentity_()||ui.id!==id)return;
  if(typeof projectHubTimingRecord_==='function')projectHubTimingRecord_('詳細管理',started,!!result&&!result.setupRequired);
  ui.loading=false;ui.data=result;ui.at=Date.now();renderPageIfActive('projects');
 }).withFailureHandler(err=>{
  if(identity!==projectHubIdentity_()||ui.id!==id)return;
  if(typeof projectHubTimingRecord_==='function')projectHubTimingRecord_('詳細管理',started,false);
  ui.loading=false;ui.error=cleanApiErrorMessage(err,'案件の拡張データを取得できませんでした。');renderPageIfActive('projects');
 }).getProjectAdvanced(state.sessionToken,id);
}

function projectAdvancedMode_(mode){
 if(!['dependencies','files','cost'].includes(mode)||projectAdvancedUi.busy)return;
 projectAdvancedUi.mode=mode;renderPageIfActive('projects');
}

function projectAdvancedSaveDeps_(taskId){
 const ui=projectAdvancedUi,record=(ui.data&&ui.data.dependencies||[]).find(x=>x.taskId===taskId);
 if(ui.busy||!record)return;
 const box=document.querySelector('[data-deps-for="'+taskId+'"]');
 if(!box)return;
 const selected=Array.from(box.querySelectorAll('input[data-dep-id]:checked')).map(x=>x.dataset.depId);
 ui.busy=true;
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(()=>{
  ui.busy=false;projectAdvancedLoad_(true);showToast('作業の前提条件を更新しました');
 }).withFailureHandler(err=>{ui.busy=false;showToast(cleanApiErrorMessage(err,'依存関係を保存できませんでした。'));renderPageIfActive('projects');})
 .saveProjectDependencies(state.sessionToken,ui.id,taskId,selected,record.revision);
}

function projectAdvancedDependencies_(d){
 const model=projectAdvancedUi.data||{},rows=model.dependencies||[],effort=new Map((model.taskEffort||[]).map(x=>[x.taskId,x]));
 if(!rows.length)return '<p class="ph-empty">まず「計画・進捗」から作業を追加してください。</p>';
 return `<div class="ph-advanced-rows">${rows.map(task=>{
  const hours=effort.get(task.taskId)||{},blocked=task.blocking||[],late=task.conflicting||[];
  const choices=rows.filter(other=>other.taskId!==task.taskId);
  return `<section class="ph-panel ph-adv-task"><div class="ph-panel-heading"><div><h3>${escapeHtml(task.title)}</h3><p class="ph-help">作業別実績 ${projectHubHours_(hours.actualMinutes||0)} ／ 計画 ${projectHubHours_(hours.plannedMinutes||0)}</p></div>${blocked.length?'<span class="ph-badge risk">先行作業待ち</span>':task.prerequisites.length?'<span class="ph-badge">先行作業完了</span>':''}</div>
  ${late.length?`<p class="ph-error">先行作業の期限が、この作業の開始日より後に設定されています（${late.length}件）。</p>`:''}
  <fieldset class="ph-adv-deps" data-deps-for="${escapeHtml(task.taskId)}"><legend>先に完了すべき作業</legend>
  ${choices.map(c=>`<label><input type="checkbox" data-dep-id="${escapeHtml(c.taskId)}" ${task.prerequisites.includes(c.taskId)?'checked':''} ${!model.canManage?'disabled':''}><span>${escapeHtml(c.title)}</span></label>`).join('')||'<span class="ph-help">選択できる先行作業がありません。</span>'}</fieldset>
  ${model.canManage?`<button type="button" class="secondary-button" ${projectAdvancedUi.busy?'disabled':''} data-id="${escapeHtml(task.taskId)}" onclick="projectAdvancedSaveDeps_(this.dataset.id)">前提条件を保存</button>`:''}</section>`;
 }).join('')}</div><p class="ph-help">依存関係は循環できません。工程表に警告を表示しますが、休日を考慮した自動日程調整や作業の強制ブロックは行いません。</p>`;
}

function projectAdvancedUpload_(){
 const ui=projectAdvancedUi,d=ui.data,fileInput=document.getElementById('phAdvancedFile'),picker=document.getElementById('phAdvancedResource');
 const file=fileInput&&fileInput.files&&fileInput.files[0];if(ui.busy||!file||!d)return;
 if(file.size>1572864||file.size===0){showToast('ファイルは1.5MB以下で選択してください');return;}
 if(!/(\.pdf|\.png|\.jpe?g|\.txt|\.docx|\.xlsx)$/i.test(file.name)){showToast('ファイル形式はPDF・画像・TXT・DOCX・XLSXに限定しています');return;}
 const identity=projectHubIdentity_(),id=ui.id;
 ui.busy=true;renderPageIfActive('projects');
 const reader=new FileReader();
 reader.onerror=()=>{ui.busy=false;showToast('ファイルを読み込めませんでした');renderPageIfActive('projects');};
 reader.onload=()=>{
  if(identity!==projectHubIdentity_()){ui.busy=false;return;}
  const data=String(reader.result||''),base64=data.split(',')[1]||'';
  const recognized={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',txt:'text/plain',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
  const expectedMime=recognized[(file.name.split('.').pop()||'').toLowerCase()];
  const mime=file.type&&file.type===expectedMime?file.type:expectedMime;
  const fingerprint=JSON.stringify([id,file.name,file.size,file.lastModified,mime,picker&&picker.value||'']);
  if(!ui.fileAttempt||ui.fileAttempt.fingerprint!==fingerprint)ui.fileAttempt={fingerprint,key:'PHFILE-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,14)};
  const requestKey=ui.fileAttempt.key;
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(()=>{
   ui.busy=false;ui.fileAttempt=null;showToast('非公開のプロジェクト資料として保存しました');projectAdvancedLoad_(true);
  }).withFailureHandler(err=>{ui.busy=false;showToast(cleanApiErrorMessage(err,'ファイルを保存できませんでした。'));renderPageIfActive('projects');})
  .uploadProjectAttachment(state.sessionToken,{projectId:id,resourceId:picker&&picker.value||'',name:file.name,mime,base64,requestKey:requestKey});
 };
 reader.readAsDataURL(file);
}

function projectAdvancedDownload_(id){
 if(projectAdvancedUi.busy)return;
 projectAdvancedUi.busy=true;
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(result=>{
  projectAdvancedUi.busy=false;
  try{
   const binary=atob(result.base64),bytes=new Uint8Array(binary.length);
   for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
   const url=URL.createObjectURL(new Blob([bytes],{type:result.mime})),a=document.createElement('a');
   a.href=url;a.download=result.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  }catch(err){showToast('ファイルの取得結果を処理できませんでした');}
 }).withFailureHandler(err=>{projectAdvancedUi.busy=false;showToast(cleanApiErrorMessage(err,'ファイルを取得できませんでした'));})
 .downloadProjectAttachment(state.sessionToken,id);
}

function projectAdvancedDelete_(id){
 if(projectAdvancedUi.busy)return;
 const pending=projectAdvancedUi.confirmRemove;
 if(!pending||pending.kind!=='file'||pending.id!==id){projectAdvancedUi.confirmRemove={kind:'file',id};renderPageIfActive('projects');return;}
 projectAdvancedUi.confirmRemove=null;
 projectAdvancedUi.busy=true;
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(()=>{projectAdvancedUi.busy=false;projectAdvancedLoad_(true);showToast('添付を非表示にしました');})
 .withFailureHandler(err=>{projectAdvancedUi.busy=false;showToast(cleanApiErrorMessage(err,'操作に失敗しました。'));}).deleteProjectAttachment(state.sessionToken,id);
}

function projectAdvancedFiles_(d){
 const files=projectAdvancedUi.data.attachments||[],resources=d.resources||[];
 return `<section class="ph-panel"><h3>非公開の添付ファイル</h3><p class="ph-help">閲覧できるのは案件責任者・案件の作業担当者・管理者です。Google Driveの公開共有リンクは発行しません。内容のウイルス検査は行われません。信頼できる資料のみ登録してください。</p>
 <div class="ph-adv-upload"><label>ファイルを選択<input type="file" id="phAdvancedFile" accept=".pdf,.png,.jpg,.jpeg,.txt,.docx,.xlsx" ${projectAdvancedUi.busy?'disabled':''}></label>
 <label>関連する資料<select id="phAdvancedResource"><option value="">案件共通のファイル</option>${resources.map(r=>`<option value="${escapeHtml(r.id)}">${escapeHtml(r.title)}</option>`).join('')}</select></label>
 <button class="primary-button" type="button" onclick="projectAdvancedUpload_()" ${projectAdvancedUi.busy?'disabled':''}>アップロード</button></div>
 <p class="ph-help">1ファイル最大1.5MB。大きな資料は既存の「資料」タブにGoogle Driveの原本リンクを登録してください。</p>
 <div class="ph-adv-files">${files.map(f=>`<div class="ph-adv-file"><strong>${escapeHtml(f.name)}</strong><span>第${Number(f.version)}版 ・ ${escapeHtml(f.createdAt)} ・ ${(f.bytes/1024).toFixed(1)}KB</span><button type="button" class="secondary-button" data-id="${escapeHtml(f.id)}" onclick="projectAdvancedDownload_(this.dataset.id)">取得</button>${projectAdvancedUi.data.canManage||state.data.user.employeeId===f.createdBy?`<button type="button" class="secondary-button" data-id="${escapeHtml(f.id)}" onclick="projectAdvancedDelete_(this.dataset.id)">${projectAdvancedUi.confirmRemove?.kind==='file'&&projectAdvancedUi.confirmRemove.id===f.id?'非表示を確定':'非表示'}</button>`:''}</div>`).join('')||'<p class="ph-empty">まだファイルはありません。</p>'}</div></section>`;
}

function projectAdvancedBudgetSave_(){
 const ui=projectAdvancedUi,d=ui.data,amount=document.getElementById('phBudgetAmount'),note=document.getElementById('phBudgetNote');
 if(ui.busy||!d||!amount||!note)return;
 ui.busy=true;
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(()=>{ui.busy=false;showToast('予算を保存しました');projectAdvancedLoad_(true);})
 .withFailureHandler(err=>{ui.busy=false;showToast(cleanApiErrorMessage(err,'予算を保存できませんでした'));})
 .saveProjectBudget(state.sessionToken,ui.id,{amount:amount.value,note:note.value,revision:d.budget.revision});
}

function projectAdvancedCostSave_(){
 const ui=projectAdvancedUi,ids=['phCostDate','phCostKind','phCostNote','phCostAmount'];
 const values=ids.map(id=>document.getElementById(id));if(ui.busy||values.some(x=>!x))return;
 ui.busy=true;
 const fingerprint=JSON.stringify(values.map(v=>v.value));
 if(!ui.costAttempt||ui.costAttempt.fingerprint!==fingerprint)ui.costAttempt={fingerprint,key:'PHCOST-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,15)};
 const p={date:values[0].value,kind:values[1].value,note:values[2].value,amount:values[3].value,requestKey:ui.costAttempt.key};
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(()=>{ui.busy=false;ui.costAttempt=null;showToast('案件原価を追加しました');projectAdvancedLoad_(true);})
 .withFailureHandler(err=>{ui.busy=false;showToast(cleanApiErrorMessage(err,'案件原価を保存できませんでした'));})
 .saveProjectCost(state.sessionToken,ui.id,p);
}

function projectAdvancedCostDelete_(id){
 if(projectAdvancedUi.busy)return;
 const pending=projectAdvancedUi.confirmRemove;
 if(!pending||pending.kind!=='cost'||pending.id!==id){projectAdvancedUi.confirmRemove={kind:'cost',id};renderPageIfActive('projects');return;}
 projectAdvancedUi.confirmRemove=null;
 projectAdvancedUi.busy=true;
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(()=>{
  projectAdvancedUi.busy=false;showToast('原価の記録を取り消しました');projectAdvancedLoad_(true);
 }).withFailureHandler(err=>{
  projectAdvancedUi.busy=false;showToast(cleanApiErrorMessage(err,'原価記録を取り消せませんでした。'));
 }).deleteProjectCost(state.sessionToken,projectAdvancedUi.id,id);
}
function projectAdvancedFinance_(){
 const d=projectAdvancedUi.data;
 if(!d.isAdmin)return '<p class="ph-empty">予算と原価の内訳は管理者専用です。</p>';
 const budget=d.budget||{},summary=d.financialSummary||{},costs=d.costs||[];
 const money=v=>v==null?'未登録':Number(v).toLocaleString('ja-JP')+'円';
 return `<section class="ph-panel"><h3>案件予算・原価</h3><p class="ph-help">計画値と管理者が登録した原価を確認します。会計システムの実績や請求・入金情報とは自動連携していません。</p>
 <div class="ph-metrics">${projectHubMetric_('登録済受注金額',money(summary.orderValue),'既存案件計画の受注額')}${projectHubMetric_('原価の手入力合計',money(summary.manualCosts),'下の原価台帳の合計')}${projectHubMetric_('参考差額',money(summary.estimateDifference),'受注額 − 手入力原価（粗利ではありません）')}${projectHubMetric_('予算上限',money(budget.amount),'管理者が入力した額')}</div><p class="ph-help">${escapeHtml(summary.note||'')}</p>
 <div class="ph-advanced-forms"><div><h4>予算を登録・更新</h4><label>予算額（円）<input id="phBudgetAmount" type="number" min="0" step="1" value="${budget.amount==null?'':Number(budget.amount)}"></label><label>根拠・備考<textarea id="phBudgetNote">${escapeHtml(budget.note||'')}</textarea></label><button type="button" class="primary-button" onclick="projectAdvancedBudgetSave_()">予算を保存</button></div>
 <div><h4>原価を記録</h4><label>発生日<input id="phCostDate" type="date" value="${escapeHtml(projectHubUi.data.today||'')}"></label><label>費目<select id="phCostKind">${['外注','材料','交通','社内人件費','その他'].map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label><label>金額（円）<input type="number" id="phCostAmount" min="0" step="1"></label><label>説明・根拠<input id="phCostNote" type="text"></label><button type="button" class="primary-button" onclick="projectAdvancedCostSave_()">原価を登録</button></div></div>
 <div class="ph-table-wrap"><table class="ph-manager-table"><thead><tr><th>日付</th><th>分類</th><th>内容</th><th>金額</th></tr></thead><tbody>${costs.map(c=>`<tr><td>${escapeHtml(c.date)}</td><td>${escapeHtml(c.kind)}</td><td>${escapeHtml(c.note)}</td><td>${money(c.amount)} <button class="secondary-button" type="button" data-id="${escapeHtml(c.id)}" onclick="projectAdvancedCostDelete_(this.dataset.id)">${projectAdvancedUi.confirmRemove?.kind==='cost'&&projectAdvancedUi.confirmRemove.id===c.id?'取消を確定':'取消'}</button></td></tr>`).join('')||'<tr><td colspan="4">原価の登録はありません。</td></tr>'}</tbody></table></div></section>`;
}

function projectAdvancedCancelRemoval_(){projectAdvancedUi.confirmRemove=null;renderPageIfActive('projects');}
function projectAdvancedCancelButton_(){return projectAdvancedUi.confirmRemove?'<button type="button" class="secondary-button" onclick="projectAdvancedCancelRemoval_()">取消操作をやめる</button>':'';}
function projectAdvancedPage_(d){
 const ui=projectAdvancedUi;
 if(ui.id!==projectHubUi.selected||ui.identity!==projectHubIdentity_()||(!ui.data&&!ui.loading)){
  return `<div class="ph-panel ph-empty"><p>案件の詳細機能を読み込みます。</p><button type="button" class="secondary-button" onclick="projectAdvancedLoad_(true)">読み込む</button></div>`;
 }
 if(ui.loading)return '<div class="ph-panel ph-empty" role="status">詳細管理を読み込み中です…</div>';
 if(ui.error)return `<div class="ph-panel ph-empty" role="alert">${escapeHtml(ui.error)}<button type="button" onclick="projectAdvancedLoad_(true)">再試行</button></div>`;
 if(ui.data.setupRequired)return `<div class="ph-panel ph-setup"><h3>追加管理機能のDB更新が必要です</h3><p>管理者が最新DBへ更新するまで、作業別工数・資料添付・工程依存・通知既読・案件原価は利用できません。既存の勤怠・工数は引き続き利用できます。</p>${state.data&&state.data.permissions&&state.data.permissions.adminConsole?`<button type="button" class="secondary-button" onclick="setAdminTab('operation')">運用・労務でバックアップ付きDB更新へ</button>`:''}<small>${escapeHtml((ui.data.missing||[]).join('、'))}</small></div>`;
 const tabs=[['dependencies','工程・依存関係'],['files','添付ファイル'],...(ui.data.isAdmin?[['cost','予算・原価']]:[])];
 return `<section class="ph-advanced"><div class="ph-panel-heading"><div><h2>プロジェクト詳細管理</h2><p class="ph-help">作業の前提条件・作業別工数・非公開ファイル・予算情報を管理します。</p></div><button type="button" class="secondary-button" onclick="projectAdvancedLoad_(true)">最新に更新</button></div>
 <div class="ph-display-tabs" role="group" aria-label="詳細管理の切替">${tabs.map(([id,label])=>`<button type="button" class="${ui.mode===id?'is-active':''}" onclick="projectAdvancedMode_('${id}')">${label}</button>`).join('')}</div>
 ${ui.mode==='files'?projectAdvancedFiles_(d):ui.mode==='cost'?projectAdvancedFinance_():projectAdvancedDependencies_(d)}${projectAdvancedCancelButton_()}</section>`;
}
</script>
