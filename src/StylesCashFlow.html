<style>
.cf-workspace{display:grid;gap:14px;min-width:0}
.cf-head,.cf-period,.cf-actions,.cf-save{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
.cf-head{justify-content:space-between}.cf-head h1{font-size:clamp(21px,3vw,28px);margin:4px 0}.cf-head p{color:var(--muted);font-size:12px;margin:4px 0}
.cf-period label,.cf-toolbar label{display:grid;gap:5px;font-size:12px;font-weight:700}
.cf-period input,.cf-toolbar input,.cf-table input{min-height:39px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--text);font-size:12px}
.cf-period input{width:95px}.cf-toolbar input{width:190px}
.cf-toolbar{display:flex;gap:12px;justify-content:space-between;align-items:end;flex-wrap:wrap;padding:15px}
.cf-save{margin-left:auto}.cf-save span{color:var(--muted);font-size:12px}
.cf-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cf-metric{display:grid;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;min-width:0}
.cf-metric small,.cf-metric span{color:var(--muted);font-size:12px;line-height:1.5}
.cf-metric strong{font-size:clamp(16px,2vw,22px);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.cf-chart,.cf-table-card,.cf-empty{padding:15px}.cf-chart h2,.cf-table-card h2{font-size:16px;margin:0 0 10px}
.cf-chart svg{display:block;max-width:980px;width:100%;height:auto;color:var(--text)}
.cf-chart-labels{font-size:11px;fill:var(--muted)}
.cf-legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.cf-scroll{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:9px}
.cf-table{min-width:1120px;width:100%;border-collapse:collapse;font-size:12px}
.cf-table th,.cf-table td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.cf-table thead th{background:var(--surface2);color:var(--muted);font-size:11px;position:sticky;top:0}
.cf-table input{width:110px}.cf-table input.cf-note-input{width:155px}
.cf-table .cf-num{font-weight:700;font-variant-numeric:tabular-nums}
.cf-table tbody tr:hover{background:color-mix(in srgb,var(--blue) 4%,transparent)}
.cf-note,.cf-table-card p{font-size:12px;color:var(--muted);line-height:1.65;margin:4px 0}
.cf-success{color:var(--text);font-size:12px}
@media(max-width:1000px){.cf-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.cf-metric{padding:10px}.cf-metric strong{font-size:16px}.cf-save{width:100%;justify-content:space-between;margin-left:0}}
</style>
