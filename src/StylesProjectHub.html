<style>
.ph-workspace{max-width:1600px;margin:auto;color:var(--text)}
.ph-heading,.ph-detail-heading,.ph-panel-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ph-heading{margin-bottom:22px}.ph-heading h1{margin:3px 0 7px;font-size:28px}.ph-heading p{margin:0;color:var(--muted)}
.ph-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.ph-project-sidebar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:20px;min-width:0}
.ph-project-sidebar>select{width:100%;margin:10px 0;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface);color:inherit}
.ph-project-list{display:grid;gap:10px;max-height:calc(100vh - 290px);overflow:auto}
.ph-project{display:grid;gap:9px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;padding:14px;width:100%;cursor:pointer;font:inherit}
.ph-project:hover{border-color:#6e9fe5}.ph-project.is-selected{border-color:#1975ed;box-shadow:inset 3px 0 #1975ed;background:rgba(25,117,237,.055)}
.ph-project>strong{font-size:15px;overflow-wrap:anywhere}.ph-project>small{display:flex;gap:6px;justify-content:space-between;color:var(--muted);font-size:11px}.ph-project>span{font-size:12px;display:flex;justify-content:space-between}
.ph-progress{position:relative;height:6px;border-radius:9px;background:rgba(112,135,168,.18)}.ph-progress>span{display:block;height:100%;background:#287deb;border-radius:9px}.ph-progress>i{position:absolute;top:-3px;height:12px;width:2px;background:#f59e0b}
.ph-detail{min-width:0}.ph-detail-heading{margin-bottom:16px}.ph-detail-heading small{color:var(--muted)}.ph-detail-heading h2{margin:3px 0;font-size:23px;overflow-wrap:anywhere}
.ph-badge{display:inline-block;border-radius:7px;font-size:11px;font-style:normal;font-weight:650;background:rgba(32,119,235,.09);color:#175bae;padding:5px 8px;white-space:nowrap}.ph-badge.risk{background:#fff1e8;color:#a7430a}
.ph-tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;padding-bottom:9px}
.ph-tabs button{flex-shrink:0;background:transparent;border:0;border-radius:8px;padding:9px 13px;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}.ph-tabs button.is-active{background:#e8f1ff;color:#1562cf}
.ph-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.ph-metric{display:grid;gap:8px;border:1px solid var(--line);border-radius:13px;padding:16px;background:var(--surface)}.ph-metric small{font-weight:650;color:var(--muted)}.ph-metric strong{font-size:24px;letter-spacing:-.5px}.ph-metric span{font-size:11px;line-height:1.55;color:var(--muted)}.ph-metric.is-risk{border-top:3px solid #e58338}
.ph-panel{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:15px;margin-bottom:16px;min-width:0}.ph-panel h3{margin:0 0 12px;font-size:16px}.ph-panel-heading{margin-bottom:15px}.ph-panel-heading h3{margin-bottom:4px}.ph-panel-heading .primary-button,.ph-panel-heading .secondary-button{flex-shrink:0;white-space:nowrap}
.ph-overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ph-facts{margin:0;display:grid;gap:12px}.ph-facts>div{display:grid;grid-template-columns:95px minmax(0,1fr);gap:9px;font-size:13px}.ph-facts dt{color:var(--muted)}.ph-facts dd{margin:0;overflow-wrap:anywhere}
.ph-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:13px;max-width:100%}.ph-help{font-size:12px;line-height:1.75;color:var(--muted);margin:8px 0}.ph-empty{font-size:13px;color:var(--muted);line-height:1.8;padding:18px 10px}
.ph-next{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}.ph-next span{color:var(--muted);font-size:12px}
.ph-task{display:flex;align-items:center;gap:18px;padding:18px 0;border-top:1px solid var(--line)}.ph-task>div{flex:1;min-width:0}.ph-task h4{margin:8px 0;overflow-wrap:anywhere}.ph-task p,.ph-task small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.ph-task .ph-progress{margin:12px 0}.ph-task>strong{font-size:20px}.ph-task>button{white-space:nowrap}
.ph-bar-row{display:grid;grid-template-columns:minmax(70px,1fr) minmax(50px,2fr) auto;align-items:center;gap:12px;font-size:12px;margin:14px 0}.ph-bar-row>span{overflow-wrap:anywhere}.ph-bar-row>div{height:7px;background:rgba(112,135,168,.16);border-radius:8px}.ph-bar-row i{display:block;height:100%;background:#287deb;border-radius:8px}.ph-bar-row strong{font-size:12px;white-space:nowrap}
.ph-table-wrap{overflow:auto}.ph-table-wrap table{width:100%;border-collapse:collapse;font-size:12px;min-width:480px}.ph-table-wrap th,.ph-table-wrap td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}.ph-table-wrap th{color:var(--muted)}
.ph-resource{border:1px solid var(--line);border-radius:10px;margin-bottom:12px}.ph-resource summary{cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px}.ph-resource summary strong{display:block;font-size:14px;overflow-wrap:anywhere}.ph-resource summary small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.ph-resource-icon{display:grid;place-items:center;flex-shrink:0;width:36px;height:42px;background:#eaf2ff;color:#1866cf;border-radius:7px}.ph-resource>div{padding:0 18px 18px}.ph-resource>div .secondary-button{display:inline-flex;margin:8px 8px 0 0;text-decoration:none}
.ph-update{border-top:1px solid var(--line);padding:17px 0}.ph-update header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}.ph-update time{margin-left:auto;font-size:11px;color:var(--muted)}
.ph-setup{padding:16px 20px;background:#fff7e9;border:1px solid #eacda0;border-radius:12px;margin-bottom:18px;color:#704608}.ph-setup p,.ph-setup small{font-size:12px;line-height:1.7}.ph-setup button{margin-top:10px;display:block}.ph-error{color:#a33827;font-size:12px;line-height:1.7}
.ph-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.ph-full{grid-column:1/-1}.ph-editor .field em{color:#c44040;font-size:11px;font-style:normal}.ph-editor input,.ph-editor select,.ph-editor textarea{width:100%;max-width:100%;box-sizing:border-box;background:var(--surface);color:inherit}.ph-editor textarea{line-height:1.7;resize:vertical}.ph-form-actions{display:flex;gap:12px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:18px;margin-top:20px;position:sticky;bottom:0;background:var(--surface)}
[data-theme="dark"] .ph-badge{background:#203f66;color:#c6dfff}[data-theme="dark"] .ph-badge.risk{background:#553720;color:#ffce9c}[data-theme="dark"] .ph-tabs button.is-active{background:#223e62;color:#d6e8ff}[data-theme="dark"] .ph-resource-icon{background:#213c61;color:#d6e8ff}[data-theme="dark"] .ph-setup{background:#322d20;border-color:#736044;color:#ffe5ac}[data-theme="dark"] .ph-error{color:#ffb8a9}
@media(max-width:1100px){.ph-layout{grid-template-columns:220px minmax(0,1fr);gap:16px}.ph-overview-grid{grid-template-columns:1fr}.ph-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.ph-task{flex-wrap:wrap}.ph-task>div{flex-basis:100%}}
@media(max-width:700px){.ph-heading{align-items:flex-start;flex-wrap:wrap}.ph-heading h1{font-size:25px}.ph-layout{grid-template-columns:1fr}.ph-project-sidebar{position:static;padding:12px}.ph-project-list{display:flex;overflow:auto;max-height:none;padding-bottom:5px}.ph-project{min-width:230px;max-width:230px}.ph-project-sidebar>select{padding:8px}.ph-detail-heading h2{font-size:20px}.ph-panel{padding:16px}.ph-panel-heading{align-items:flex-start;flex-wrap:wrap}.ph-panel-heading .primary-button{padding:10px 12px}.ph-metric{padding:13px}.ph-metric strong{font-size:21px}.ph-form-grid{grid-template-columns:1fr}.ph-next{flex-direction:column;gap:5px}.ph-bar-row{grid-template-columns:80px 1fr auto;gap:8px}.ph-heading .button-row{margin:0}.ph-tabs{gap:2px}.ph-tabs button{padding:9px 11px}}
</style>
