<style>
.ph-workspace{max-width:1600px;margin:auto;color:var(--text)}
.ph-heading,.ph-detail-heading,.ph-panel-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}

[data-theme="dark"] .ph-badge{background:#203f66;color:#c6dfff}[data-theme="dark"] .ph-badge.risk{background:#553720;color:#ffce9c}[data-theme="dark"] .ph-tabs button.is-active{background:#223e62;color:#d6e8ff}[data-theme="dark"] .ph-resource-icon{background:#213c61;color:#d6e8ff}[data-theme="dark"] .ph-setup{background:#322d20;border-color:#736044;color:#ffe5ac}[data-theme="dark"] .ph-error{color:#ffb8a9}

.ph-view-switch .is-active,.ph-filter-tabs .is-active{background:#e8f1ff;color:#1464cc}

.ph-filter-tabs{display:flex;flex-wrap:wrap;gap:4px}

.ph-warning{font-style:normal;color:#bc531f;font-size:11px}.ph-portfolio-arrow{font-size:23px;color:var(--blue)}
.ph-aside-link{cursor:pointer;font:inherit;color:var(--text);display:grid;grid-template-columns:minmax(0,1fr) 13px;gap:3px 8px;text-align:left;border:0;background:transparent;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.ph-aside-link strong{grid-column:1;font-size:13px;overflow-wrap:anywhere}.ph-aside-link small{grid-column:1;font-size:12px;color:var(--muted)}.ph-aside-link>span{grid-row:1/3;grid-column:2;align-self:center;color:var(--blue)}
.ph-full-button{display:block;width:100%;margin-top:9px;text-align:left}.ph-load-more{width:100%;margin:5px 0}
.ph-breadcrumb{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:17px}.ph-breadcrumb button{background:transparent;border:0;color:var(--blue);cursor:pointer;padding:4px;font:inherit;font-weight:650}

.ph-experience .ph-detail{max-width:none}.ph-experience .ph-overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.ph-dashboard .ph-metrics{grid-template-columns:repeat(5,minmax(0,1fr))}
.ph-manager-table td small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.ph-manager-table{min-width:760px!important}
[data-theme="dark"] .ph-view-switch .is-active,[data-theme="dark"] .ph-filter-tabs .is-active{background:#234467;color:#d1e7ff}

@media(max-width:700px){.ph-experience .ph-breadcrumb{margin-bottom:7px}.ph-experience .ph-heading{margin-bottom:8px}.ph-experience .ph-project-hero{gap:6px}.ph-experience .ph-project-hero h1{font-size:21px;line-height:1.2;margin:2px 0}.ph-experience .ph-project-hero p{font-size:11px}.ph-experience .ph-hero-facts{display:flex;overflow-x:auto;scroll-snap-type:x proximity;gap:0;padding:7px 5px;margin-bottom:8px}.ph-experience .ph-hero-facts>span{flex:0 0 130px;scroll-snap-align:start;padding:4px 8px!important;border-bottom:0!important;border-right:1px solid var(--line)!important;gap:3px}.ph-experience .ph-hero-facts small{font-size:11px}.ph-experience .ph-hero-facts strong{font-size:12px}.ph-experience .ph-tabs{margin-bottom:9px;padding-bottom:4px}}
</style>
