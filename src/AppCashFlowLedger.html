<script>
/* Normal cashflow workspace. Drafts are memory-only and never included in totals. */
let cflUi={accountId:'',kind:'ALL',rows:[],data:null,busy:false,uncertain:false,error:'',offset:0,cache:new Map(),serial:0};
const CFL_FIELDS=[['date','日付'],['description','摘要'],['outgoing','出金'],['incoming','入金'],['balance','残高'],['category','分類'],['note','メモ'],['kind','実績／予定']];
function cflReset_(){cflUi={accountId:'',kind:'ALL',rows:[],data:null,busy:false,uncertain:false,error:'',offset:0,cache:new Map(),serial:0};}
function cflDirty_(){return cflUi.rows.some(r=>CFL_FIELDS.some(([k])=>k!=='kind'&&String(r[k]||'').trim()));}
function cflCanLeave_(){if(cflUi.busy||cflUi.uncertain){showToast('保存結果を同じ入力で確認してから移動してください。');return false;}return true;}
function cflAdd_(){if(!cflCanLeave_())return;cflUi.rows.push({date:'',description:'',outgoing:'',incoming:'',balance:'',category:'',note:'',kind:'ACTUAL',requestKey:cfbKey_()});renderPageIfActive('finance');}
function cflSet_(i,key,value){if(cflUi.busy||cflUi.uncertain||!CFL_FIELDS.some(([k])=>k===key))return;const r=cflUi.rows[i];if(r)r[key]=value;}
function cflSwitch_(accountId,kind){
 if(!cflCanLeave_())return;
 const apply=()=>{cflUi.accountId=accountId; cflUi.kind=kind||'ALL';cflUi.rows=[];cflUi.data=null;cflUi.offset=0;cflLoad_();renderPageIfActive('finance');};
 if(cflDirty_()&&accountId!==cflUi.accountId){openConfirmDialog('未保存の入力','口座を変える前に保存してください。入力を破棄して変更しますか？','入力を破棄して変更',apply);return;}
 if(accountId===cflUi.accountId){cflUi.kind=kind||'ALL';cflUi.offset=0;cflLoad_();renderPageIfActive('finance');return;}apply();
}
function cflLoad_(force=false){
 if(!cfbUi.loaded||!cashFlowUi.open)return;
 const ui=cflUi;ui.accountId=ui.accountId||cfbUi.loaded.accounts.find(a=>a.active)?.id||'';if(!ui.accountId)return;
 const key=[cashFlowUi.year,ui.accountId,ui.kind,ui.offset].join('|'),cached=ui.cache.get(key);
 if(!force&&ui.loadingKey===key)return;
 if(!force&&cached&&Date.now()-cached.at<300000){ui.data=cached.data;ui.dataKey=key;ui.loadingKey='';ui.serial++;return;}
 ui.loadingKey=key;
 if(ui.dataKey!==key)ui.data=null;
 const serial=++ui.serial,identity=financeIdentity();
 const current=()=>{
  const selectedKey=[cashFlowUi.year,ui.accountId,ui.kind,ui.offset].join('|');
  if(ui===cflUi&&identity===financeIdentity()&&ui.dataKey!==selectedKey)ui.data=null;
  return ui===cflUi&&serial===ui.serial&&identity===financeIdentity()&&key===selectedKey;
 };
 cfbRpc_('getCashFlowLedgerRows',{year:cashFlowUi.year,accountId:ui.accountId,kind:ui.kind,offset:ui.offset},data=>{
  if(!current())return;ui.loadingKey='';
  if(!data||data.ok!==true){ui.error='台帳の取得結果を確認できません。';renderPageIfActive('finance');return;}
  ui.data=data;ui.dataKey=key;ui.cache.delete(key);ui.cache.set(key,{data,at:Date.now()});
  while(ui.cache.size>40)ui.cache.delete(ui.cache.keys().next().value);ui.error='';renderPageIfActive('finance');
 },err=>{if(!current())return;ui.loadingKey='';ui.error=cleanApiErrorMessage(err,'台帳を取得できません。');renderPageIfActive('finance');});
}
function cflPaste_(event,i,col){
 const text=event.clipboardData?.getData('text/plain');if(!text||(!text.includes('\t')&&!text.includes('\n'))||!cflCanLeave_())return;
 event.preventDefault();const matrix=text.replace(/\r/g,'').split('\n').filter(x=>x.trim()).map(x=>x.split('\t'));
 if(i+matrix.length>100||matrix.some(r=>col+r.length>CFL_FIELDS.length)){showToast('貼り付けは100行以内、表示している列数以内にしてください。');return;}
 while(cflUi.rows.length<i+matrix.length)cflUi.rows.push({kind:'ACTUAL',requestKey:cfbKey_()});
 matrix.forEach((r,n)=>r.forEach((v,j)=>{const key=CFL_FIELDS[col+j][0];cflUi.rows[i+n][key]=key==='kind'?({'実績':'ACTUAL','予定':'PLAN'}[v.trim()]||v.trim()):v;}));
 renderPageIfActive('finance');
}
function cflBalances_(){
 if(!cflCanLeave_())return;const anchor=cflUi.data?.balanceAnchor;
 if(!anchor){showToast('保存済み明細の最新残高が未入力です。残高を確認して入力してください。');return;}
 try{let balance=anchor.balance;const rows=cflUi.rows.filter(r=>r.kind==='ACTUAL'&&String(r.date||'').trim()).map(r=>({r,tx:cfbBankGridNormalize_({...r,externalId:''})})).sort((a,b)=>a.tx.date.localeCompare(b.tx.date));
 if(rows.some(x=>x.tx.date<anchor.date))throw Error('最新明細より前の日付は、残高を確認して手入力してください。');
 const values=rows.map(x=>{balance+=x.tx.incoming-x.tx.outgoing;if(!Number.isSafeInteger(balance))throw Error('残高の計算範囲を超えています。');return {r:x.r,balance};});values.forEach(x=>x.r.balance=x.balance);renderPageIfActive('finance');
 }catch(e){showToast(e.message);}
}
function cflSave_(){
 const ui=cflUi;if(ui.busy||!ui.accountId)return;
 const rows=ui.rows.filter(r=>CFL_FIELDS.some(([k])=>k!=='kind'&&String(r[k]||'').trim()));if(!rows.length)return;
 try{rows.forEach(r=>{cfbBankGridNormalize_({...r,externalId:''});if(!r.category||!['ACTUAL','PLAN'].includes(r.kind))throw Error('分類と実績／予定を入力してください。');});}catch(e){ui.error=e.message;renderPageIfActive('finance');return;}
 ui.busy=true;cfbUi.busy=true;ui.error='';const identity=financeIdentity(),accountId=ui.accountId,snapshot=rows.map(r=>({...r}));let index=0;
 const fail=err=>{if(ui!==cflUi||identity!==financeIdentity())return;ui.busy=false;cfbUi.busy=false;ui.uncertain=true;ui.error=cleanApiErrorMessage(err,'保存結果が未確認です。同じ内容で再試行してください。');renderPageIfActive('finance');};
 const next=()=>{
  if(ui!==cflUi||identity!==financeIdentity())return;
  if(index>=snapshot.length){ui.busy=false;ui.uncertain=false;cfbUi.busy=false;ui.rows=[];ui.cache.clear();cfbLoadAfterWrite_();showToast('台帳を保存し、年間集計を更新しました。');return;}
  const chunk=snapshot.slice(index,index+20).map(r=>({...r,incoming:cfbBankGridMoney_(r.incoming,'入金',false,false),outgoing:cfbBankGridMoney_(r.outgoing,'出金',false,false),balance:cfbBankGridMoney_(r.balance,'残高',true,true)}));
  cfbRpc_('saveCashFlowLedgerRows',{accountId,rows:chunk},result=>{
   if(ui!==cflUi||identity!==financeIdentity())return;
   if(!result||result.ok!==true||!Array.isArray(result.results)||result.results.length!==chunk.length||result.results.some((r,i)=>!r.id||r.kind!==chunk[i].kind)||new Set(result.results.map(r=>r.kind+'|'+r.id)).size!==chunk.length){fail(Error('保存件数を確認できません。同じ入力で再試行してください。'));return;}
   if(result.auditRecorded===false)showToast('保存済みですが、監査履歴は管理者が確認してください。');index+=chunk.length;next();
  },fail);
 };renderPageIfActive('finance');next();
}
function cflPage_(offset){if(!cflCanLeave_())return;cflUi.offset=Math.max(0,offset);cflLoad_();renderPageIfActive('finance');}
function cflLedgerPage_(){
 const ui=cflUi,accounts=cfbUi.loaded.accounts||[];ui.accountId=ui.accountId||accounts.find(a=>a.active)?.id||'';
 const esc=cfbEscape_,locked=ui.busy||ui.uncertain;
 const controls='<div class="cfb-form"><label>金融機関<select onchange="cflSwitch_(this.value,cflUi.kind)"'+(locked?' disabled':'')+'>'+accounts.filter(a=>a.active).map(a=>'<option value="'+esc(a.id)+'"'+(a.id===ui.accountId?' selected':'')+'>'+esc(a.bank+' / '+a.name)+'</option>').join('')+'</select></label><label>表示<select onchange="cflSwitch_(cflUi.accountId,this.value)"'+(locked?' disabled':'')+'><option value="ALL"'+(ui.kind==='ALL'?' selected':'')+'>実績と予定</option><option value="ACTUAL"'+(ui.kind==='ACTUAL'?' selected':'')+'>実績</option><option value="PLAN"'+(ui.kind==='PLAN'?' selected':'')+'>予定</option></select></label></div>';
 const saved=(ui.data?.rows||[]).map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.description)+'</td><td>'+cfbMoney_(r.outgoing)+'</td><td>'+cfbMoney_(r.incoming)+'</td><td>'+(r.balance===null?'—':cfbMoney_(r.balance))+'</td><td>'+esc(r.category)+'</td><td>'+esc(r.note)+'</td><td>'+(r.kind==='PLAN'?'予定':'実績')+'</td></tr>').join('');
 const draft=ui.rows.map((r,i)=>'<tr class="cfl-draft">'+CFL_FIELDS.map(([key,label],j)=>'<td>'+(key==='kind'?'<select onchange="cflSet_('+i+',\'kind\',this.value)"'+(locked?' disabled':'')+'><option value="ACTUAL"'+(r.kind==='ACTUAL'?' selected':'')+'>実績</option><option value="PLAN"'+(r.kind==='PLAN'?' selected':'')+'>予定</option></select>':'<input value="'+esc(r[key]||'')+'" aria-label="入力'+(i+1)+'行 '+label+'" oninput="cflSet_('+i+',\''+key+'\',this.value)" onpaste="cflPaste_(event,'+i+','+j+')"'+(locked?' readonly':'')+'>')+'</td>').join('')+'</tr>').join('');
 return '<section class="card cf-table-card"><h2>金融機関別の入力台帳</h2><p>Excelと同じ順で、下へ行を追加します。実績と予定を分けて保存し、全口座の年間表へ集計します。未保存行は集計に含めません。</p>'+controls+(ui.error?'<p role="alert">'+esc(ui.error)+'</p>':'')+'<div class="cf-scroll"><table class="cf-table cfl-table"><thead><tr>'+CFL_FIELDS.map(([,label])=>'<th>'+label+'</th>').join('')+'</tr></thead><tbody>'+saved+draft+'</tbody></table></div><div class="cfb-actions"><button class="secondary-button" onclick="cflAdd_()"'+(locked||!ui.accountId?' disabled':'')+'>＋ 入力行を追加</button><button class="secondary-button" onclick="cflBalances_()"'+(locked?' disabled':'')+'>実績の残高を計算</button><button class="primary-button" onclick="cflSave_()"'+(ui.busy||!ui.accountId?' disabled':'')+'>'+(ui.uncertain?'同じ入力で再試行':'入力を保存・年間へ集計')+'</button><button class="secondary-button" onclick="cfbSection_(\'overview\')">年間資金繰りを見る</button></div><p>'+Number(ui.data?.total||0)+'件（50件ずつ表示）</p><div class="cfb-actions"><button class="secondary-button" onclick="cflPage_('+Math.max(0,ui.offset-50)+')"'+(ui.offset===0?' disabled':'')+'>前へ</button><button class="secondary-button" onclick="cflPage_('+(ui.offset+50)+')"'+(!ui.data||ui.offset+50>=ui.data.total?' disabled':'')+'>次へ</button></div></section>';
}
function cflAnnualTable_(){
 const data=cfbUi.loaded;if(!data||!Array.isArray(data.monthly))return '';
 const fields=[['scheduledIn','予定入金'],['scheduledOut','予定出金'],['actualIn','実績入金'],['actualOut','実績出金'],['transferIn','内部振替入金'],['transferOut','内部振替出金']];
 return '<section class="card cf-table-card"><h2>全金融機関の年間集計</h2><p>各金融機関の保存済み明細と予定を、12月から翌11月へ集約します。実績の年間合計は取込済み分です。未取込月をゼロ確定とは扱いません。実績と予定を別々に示し、無条件に二重加算しません。</p><div class="cf-scroll"><table class="cf-table"><thead><tr><th>入出金項目</th>'+data.monthly.map(r=>'<th>'+cfbEscape_(r.month)+'</th>').join('')+'<th>年間合計</th></tr></thead><tbody>'+fields.map(([key,label])=>'<tr><th>'+label+'</th>'+data.monthly.map(r=>'<td>'+((key.startsWith('actual')||key.startsWith('transfer'))&&!r.importedCount&&!r.reconciled?'未取込':cfbMoney_(r[key]))+'</td>').join('')+'<td>'+cfbMoney_(data.monthly.reduce((n,r)=>n+Number(r[key]||0),0))+'</td></tr>').join('')+'</tbody></table></div><p class="cf-note">実績の内部振替は通常の入出金から分離します。将来の残高見込みと月次の照合状況は下の表で確認してください。</p></section>';
}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('beforeunload',event=>{if(cflDirty_()){event.preventDefault();event.returnValue='';}});
</script>
