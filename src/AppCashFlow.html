<script>
/* v0.21 annual fiscal cashflow; amounts never use browser persistent storage. */
let cashFlowUi={open:false,year:0,seq:0,loading:false,busy:false,dirty:false,data:null,draft:null,error:'',notice:'',auditWarning:'',key:''};
function resetCashFlowUi(){cashFlowUi={open:false,year:0,seq:cashFlowUi.seq+1,loading:false,busy:false,dirty:false,data:null,draft:null,error:'',notice:'',auditWarning:'',key:''};}
function cashFlowAllowed_(){return !!(state.sessionToken&&state.data&&state.data.permissions&&state.data.permissions.cashFlowWorkspace&&state.data.permissions.adminConsole);}
function cashFlowThisYear_(){
 const s=String(state.data&&state.data.today||new Date().toISOString().slice(0,10)),m=/^(\d{4})-(\d{2})/.exec(s);
 return m?Number(m[1])+(Number(m[2])===12?1:0):new Date().getFullYear();
}
function cashFlowDiscard_(){return !cashFlowUi.dirty||window.confirm('保存されていない内容があります。破棄して移動しますか？');}
function cashFlowOpen_(){
 if(!cashFlowAllowed_())return;
 financeUi.insightMode=false;cashFlowUi.open=true;cashFlowUi.year=cashFlowUi.year||cashFlowThisYear_();
 renderPageIfActive('finance');cashFlowLoad_();
}
function cashFlowClose_(){
 if(!cashFlowDiscard_())return;
 cashFlowUi.open=false;cashFlowUi.data=null;cashFlowUi.draft=null;cashFlowUi.dirty=false;cashFlowUi.seq++;
 renderPageIfActive('finance');
}
function cashFlowChangeYear_(value){
 const y=Number(value),input=document.getElementById('cfYear');
 if(!Number.isInteger(y)||y<2000||y>2100||!cashFlowDiscard_()){if(input)input.value=String(cashFlowUi.year);return;}
 if(y===cashFlowUi.year)return;
 cashFlowUi.seq++;cashFlowUi.year=y;cashFlowUi.data=null;cashFlowUi.draft=null;cashFlowUi.loading=false;
 cashFlowUi.dirty=false;cashFlowUi.key='';cashFlowUi.error='';cashFlowUi.notice='';cashFlowUi.auditWarning='';
 renderPageIfActive('finance');cashFlowLoad_();
}
function cashFlowLoad_(force=false){
 const ui=cashFlowUi;if(!ui.open||!cashFlowAllowed_()||ui.loading||ui.busy)return;
 if(!force&&ui.data&&ui.data.fiscalYear===ui.year)return;
 const token=state.sessionToken,year=ui.year,seq=++ui.seq;
 ui.loading=true;ui.error='';renderPageIfActive('finance');
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(result=>{
  if(seq!==cashFlowUi.seq||token!==state.sessionToken||year!==cashFlowUi.year||!cashFlowUi.open)return;
  ui.loading=false;
  if(!result||result.ok!==true){ui.error='取得したデータが正しくありません。';renderPageIfActive('finance');return;}
  ui.data=result;ui.draft={openingBalance:result.record.openingBalance,revision:result.record.revision,months:result.record.months.map(x=>({...x}))};
  ui.dirty=false;ui.key='';renderPageIfActive('finance');
 }).withFailureHandler(err=>{
  if(seq!==cashFlowUi.seq||token!==state.sessionToken||year!==cashFlowUi.year||!cashFlowUi.open)return;
  ui.loading=false;ui.error=cleanApiErrorMessage(err,'資金繰り表を読み込めませんでした。');renderPageIfActive('finance');
 }).getCashFlowYear(token,year);
}
function cashFlowReload_(){
 if(!cashFlowDiscard_())return;
 cashFlowUi.data=null;cashFlowUi.draft=null;cashFlowUi.dirty=false;cashFlowUi.key='';cashFlowLoad_(true);
}
function cashFlowInt_(value,negative=false){
 if(value==null||String(value).trim()==='')return null;
 const t=String(value).trim(),re=negative?/^-?(0|[1-9]\d{0,11})$/:/^(0|[1-9]\d{0,11})$/;
 return re.test(t)?Number(t):null;
}
function cashFlowCalc_(){
 const d=cashFlowUi.draft;if(!d)return null;
 const start=cashFlowInt_(d.openingBalance,true);let plan=start,actual=start,forecast=start,low=start,first='';
 const totals={planIn:0,planOut:0,actualIn:0,actualOut:0},counts={plan:0,actual:0};
 const months=d.months.map(row=>{
  const v={};for(const key of ['planIn','planOut','actualIn','actualOut']){v[key]=cashFlowInt_(row[key]);if(v[key]!==null)totals[key]+=v[key];}
  const hp=v.planIn!==null||v.planOut!==null,ha=v.actualIn!==null||v.actualOut!==null;
  if(hp)counts.plan++;if(ha)counts.actual++;
  plan=plan!==null&&hp?plan+(v.planIn||0)-(v.planOut||0):null;
  actual=actual!==null&&ha?actual+(v.actualIn||0)-(v.actualOut||0):null;
  forecast=forecast!==null&&(ha||hp)?forecast+(ha?v.actualIn||0:v.planIn||0)-(ha?v.actualOut||0:v.planOut||0):null;
  if(forecast!==null){if(low===null||forecast<low)low=forecast;if(!first&&forecast<0)first=row.month;}
  return {month:row.month,planEnd:plan,actualEnd:actual,forecastEnd:forecast};
 });
 return {months,counts,totals,yearEnd:forecast,minimum:low,first};
}
function cashFlowYen_(v){return v===null||v===undefined?'—':Number(v).toLocaleString('ja-JP')+'円';}
function cashFlowMetricHtml_(s){
 const item=(label,value,help)=>'<div class="cf-metric"><small>'+label+'</small><strong>'+value+'</strong><span>'+help+'</span></div>';
 return item('年間の計画入金',s.counts.plan?cashFlowYen_(s.totals.planIn):'未入力',s.counts.plan+'/12か月 入力済')+
        item('年間の計画出金',s.counts.plan?cashFlowYen_(s.totals.planOut):'未入力',s.counts.plan+'/12か月 入力済')+
        item('11月末の見込み残高',cashFlowYen_(s.yearEnd),'実績がある月は実績を優先')+
        item('最初の資金不足予測',s.first?escapeHtml(s.first):'—','見込み残高が0円を下回る月');
}
function cashFlowChartHtml_(s){
 const values=s.months.flatMap(r=>[r.planEnd,r.actualEnd,r.forecastEnd]).filter(v=>v!==null);
 if(!values.length)return '<p class="cf-note">期首残高と入出金を入力するとグラフを表示します。</p>';
 const max=Math.max(0,...values),min=Math.min(0,...values),span=Math.max(1,max-min);
 const xy=(i,v)=>(35+i*54)+','+(157-(v-min)/span*130).toFixed(1);
 const series=[['planEnd','#2563eb','計画'],['actualEnd','#0d9488','実績'],['forecastEnd','#d97706','見込み']];
 let lines='';
 for(const [key,color] of series){
  let points=[];const flush=()=>{if(points.length)lines+='<polyline fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+points.join(' ')+'"/>';points=[];};
  s.months.forEach((m,i)=>{if(m[key]===null)flush();else points.push(xy(i,m[key]));});flush();
 }
 const labels=s.months.map((m,i)=>'<text x="'+(35+i*54)+'" y="187" text-anchor="middle">'+Number(m.month.slice(-2))+'月</text>').join('');
 return '<svg viewBox="0 0 660 205" role="img" aria-label="12か月の計画・実績・見込み月末残高"><line x1="35" x2="633" y1="'+(157-(0-min)/span*130).toFixed(1)+'" y2="'+(157-(0-min)/span*130).toFixed(1)+'" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="5 4"/>'+lines+'<g class="cf-chart-labels">'+labels+'</g></svg>'+
  '<div class="cf-legend"><span>● 計画（青）</span><span>● 実績（緑）</span><span>● 見込み（橙）</span></div>';
}
function cashFlowRefresh_(){
 const ui=cashFlowUi,s=cashFlowCalc_();if(!s)return;
 const sum=document.getElementById('cfMetrics'),chart=document.getElementById('cfChart'),status=document.getElementById('cfStatus'),save=document.getElementById('cfSave');
 if(sum)sum.innerHTML=cashFlowMetricHtml_(s);
 if(chart)chart.innerHTML=cashFlowChartHtml_(s);
 if(status)status.textContent='未保存の変更あり';
 if(save)save.disabled=false;
 s.months.forEach((m,i)=>[['planEnd','plan'],['actualEnd','actual'],['forecastEnd','forecast']].forEach(pair=>{
  const cell=document.getElementById('cf-'+pair[1]+'-'+i);if(cell)cell.textContent=cashFlowYen_(m[pair[0]]);
 }));
}
function cashFlowEdit_(node){
 const ui=cashFlowUi;if(!ui.draft||ui.busy||!cashFlowAllowed_())return;
 const key=node.dataset.key;
 if(key==='openingBalance')ui.draft.openingBalance=node.value;
 else{
  const i=Number(node.dataset.index);
  if(!Number.isInteger(i)||i<0||i>=12||!['planIn','planOut','actualIn','actualOut','note'].includes(key))return;
  ui.draft.months[i][key]=node.value;
 }
 ui.dirty=true;ui.key='';ui.error='';cashFlowRefresh_();
}
function cashFlowSave_(){
 const ui=cashFlowUi;
 if(!cashFlowAllowed_()||!ui.draft||!ui.data||ui.data.setupRequired||!ui.dirty||ui.busy)return;
 if(cashFlowInt_(ui.draft.openingBalance,true)===null){ui.error='期首残高を入力してください。';renderPageIfActive('finance');return;}
 for(const m of ui.draft.months){
  for(const k of ['planIn','planOut','actualIn','actualOut'])if(m[k]!=null&&String(m[k])!==''&&cashFlowInt_(m[k])===null){ui.error=m.month+'の金額を確認してください。';renderPageIfActive('finance');return;}
  if(String(m.note||'').length>300){ui.error='備考は300文字以内にしてください。';renderPageIfActive('finance');return;}
 }
 if(!ui.key)ui.key='CF'+Date.now().toString(36)+Math.random().toString(36).slice(2,15);
 const token=state.sessionToken,year=ui.year,seq=ui.seq,payload={fiscalYear:year,openingBalance:ui.draft.openingBalance,revision:ui.draft.revision,months:ui.draft.months.map(x=>({...x})),requestKey:ui.key};
 ui.busy=true;ui.error='';renderPageIfActive('finance');
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(res=>{
  if(token!==state.sessionToken||!cashFlowUi.open||year!==cashFlowUi.year||seq!==cashFlowUi.seq)return;
  ui.busy=false;
  if(!res||res.ok!==true){ui.error='保存結果を確認できません。';renderPageIfActive('finance');return;}
  ui.auditWarning=res.auditRecorded===false?'金額は保存されましたが監査ログの記録に失敗しました。管理者が確認してください。':res.auditRecorded===null?'保存済みデータを確認しました。監査ログの状態は未確認です。':'';
  ui.notice='保存済みです。';ui.dirty=false;ui.key='';ui.data=null;ui.draft=null;cashFlowLoad_(true);
 }).withFailureHandler(err=>{
  if(token!==state.sessionToken||!cashFlowUi.open||year!==cashFlowUi.year||seq!==cashFlowUi.seq)return;
  ui.busy=false;ui.error=cleanApiErrorMessage(err,'保存できませんでした。入力は保持しています。');renderPageIfActive('finance');
 }).saveCashFlowYear(token,payload);
}
function cashFlowPage_(){
 if(!cashFlowAllowed_())return pageHead('年間資金繰り表','管理者専用です。');
 const u=cashFlowUi,year=u.year,title=year+'年11月期（'+(year-1)+'年12月～'+year+'年11月）';
 const buttons='<button class="secondary-button" type="button" onclick="cashFlowClose_()">← 経理に戻る</button><button class="secondary-button" type="button" onclick="cashFlowReload_()">更新</button>';
 const picker='<div class="cf-period"><button type="button" class="secondary-button" onclick="cashFlowChangeYear_('+(year-1)+')">‹ 前期</button>'+
  '<label>決算年度 <input id="cfYear" type="number" min="2000" max="2100" step="1" value="'+year+'" onchange="cashFlowChangeYear_(this.value)"></label>'+
  '<button type="button" class="secondary-button" onclick="cashFlowChangeYear_('+(year+1)+')">翌期 ›</button></div>';
 const header='<header class="cf-head"><div><span class="eyebrow">FINANCE / CASH FLOW</span><h1>年間資金繰り表</h1><p>'+title+'</p></div><div class="cf-actions">'+buttons+'</div></header>'+picker;
 if(u.loading&&!u.data)return '<div class="cf-workspace">'+header+'<section class="card cf-empty" role="status">資金繰り表を読み込み中です。</section></div>';
 if(!u.data)return '<div class="cf-workspace">'+header+'<section class="card cf-empty" role="alert">'+escapeHtml(u.error||'読み込み待ちです。')+'</section></div>';
 if(u.data.setupRequired)return '<div class="cf-workspace">'+header+'<section class="card cf-empty"><h2>初回設定が必要です</h2><p>管理・設定 → 運用・労務 からバックアップ付きDB更新を実行してください。既存Excelは変更しません。</p><button class="secondary-button" onclick="setAdminTab('+"'operation'"+')">DB更新画面を開く</button></section></div>';
 const d=u.draft,s=cashFlowCalc_();if(!d||!s)return '<div class="cf-workspace">'+header+'</div>';
 const input=(i,key,row)=>'<input data-index="'+i+'" data-key="'+key+'" type="number" inputmode="numeric" min="0" max="999999999999" step="1" value="'+escapeHtml(row[key]==null?'':row[key])+'" oninput="cashFlowEdit_(this)" aria-label="'+escapeHtml(row.month)+' '+key+'"'+(u.busy?' disabled':'')+'>';
 const rows=d.months.map((r,i)=>{
  const t=s.months[i];
  return '<tr><th scope="row">'+escapeHtml(r.month.replace('-','年')+'月')+'</th>'+
   ['planIn','planOut','actualIn','actualOut'].map(k=>'<td>'+input(i,k,r)+'</td>').join('')+
   '<td class="cf-num" id="cf-plan-'+i+'">'+cashFlowYen_(t.planEnd)+'</td>'+
   '<td class="cf-num" id="cf-actual-'+i+'">'+cashFlowYen_(t.actualEnd)+'</td>'+
   '<td class="cf-num" id="cf-forecast-'+i+'">'+cashFlowYen_(t.forecastEnd)+'</td>'+
   '<td><input class="cf-note-input" type="text" maxlength="300" data-index="'+i+'" data-key="note" value="'+escapeHtml(r.note||'')+'" oninput="cashFlowEdit_(this)" aria-label="'+escapeHtml(r.month)+' 備考"'+(u.busy?' disabled':'')+'></td></tr>';
 }).join('');
 const feedback=(u.error?'<p class="finance-error" role="alert">'+escapeHtml(u.error)+'</p>':'')+
  (u.auditWarning?'<p class="finance-error" role="alert">'+escapeHtml(u.auditWarning)+'</p>':'')+
  (u.notice?'<p class="cf-success" role="status">'+escapeHtml(u.notice)+'</p>':'');
 return '<div class="cf-workspace">'+header+'<section class="card cf-toolbar"><label>期首現預金残高（12月1日／円）<input type="number" step="1" min="-999999999999" max="999999999999" data-key="openingBalance" value="'+escapeHtml(d.openingBalance==null?'':d.openingBalance)+'" placeholder="例：1000000" oninput="cashFlowEdit_(this)"'+(u.busy?' disabled':'')+'></label>'+
  '<div class="cf-save"><span id="cfStatus" role="status">'+(u.dirty?'未保存の変更あり':u.data.record.exists?'保存済み':'未作成')+'</span><button type="button" id="cfSave" class="primary-button" onclick="cashFlowSave_()"'+(!u.dirty||u.busy?' disabled':'')+'>'+(u.busy?'保存中…':'年度を保存')+'</button></div></section>'+feedback+
  '<div class="cf-metrics" id="cfMetrics">'+cashFlowMetricHtml_(s)+'</div>'+
  '<section class="card cf-chart"><h2>月末残高の推移</h2><div id="cfChart">'+cashFlowChartHtml_(s)+'</div></section>'+
  '<section class="card cf-table-card"><h2>月別入出金</h2><p>計画・実績は現金ベースです。空欄＝未入力、0＝入力済み0円。未入力の月以降、月末残高は「—」で表示します。</p>'+
  '<div class="cf-scroll" role="region" aria-label="12か月の入出金" tabindex="0"><table class="cf-table"><thead><tr><th>対象月</th><th>計画入金</th><th>計画出金</th><th>実績入金</th><th>実績出金</th><th>計画末</th><th>実績末</th><th>見込み末</th><th>備考</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
  '<p class="cf-note">手入力の資金繰り表です。銀行口座、既存経費、試算表とは自動同期していません。年間残高は他年度へ自動引き継ぎしません。</p></div>';
}
</script>
