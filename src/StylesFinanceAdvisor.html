<style>
/* Finance advisor UI: inherits FM WORKS color and spacing tokens. */
.finance-advisor{gap:13px;min-width:0}
.finance-advisor .card{padding:16px;min-width:0}
.finance-advisor .card h2{font-size:15px;margin:0 0 12px}
.finance-advisor-year{display:grid;gap:2px;font-size:11px;color:var(--muted);font-weight:750}
.finance-advisor-year select{min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:6px 9px}
.finance-advisor-note{font-size:12px;line-height:1.7;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.finance-advisor-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.finance-advisor-summary .card{display:grid;gap:6px}
.finance-advisor-summary .card small{font-size:12px;color:var(--muted)}
.finance-advisor-summary .card>strong{font-size:clamp(22px,2.5vw,30px);font-variant-numeric:tabular-nums}
.finance-advisor-summary .card p{font-size:11px;color:var(--muted);margin:0}
.finance-advisor-charts{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(270px,.9fr);gap:12px}
.finance-advisor-charts .card>p,.finance-advisor-charts .card>small{color:var(--muted);font-size:11px;line-height:1.6}
.finance-advisor-months{display:grid;gap:8px}
.finance-advisor-month{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:9px;align-items:center;font-size:12px;min-width:0}
.finance-advisor-month strong{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.finance-advisor-bar-track{height:12px;min-width:0;border-radius:20px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.finance-advisor-bar-track span{display:block;height:100%;border-radius:20px;background:var(--fill-info)}
.finance-advisor-payers{display:flex;flex-wrap:wrap;gap:8px}
.finance-advisor-payer{display:grid;gap:5px;min-height:58px;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:10px;cursor:pointer;flex:1 1 125px;min-width:0;color:var(--text);font:inherit}
.finance-advisor-payer strong{font-size:12px;overflow-wrap:anywhere}
.finance-advisor-payer span{font-size:12px;color:var(--blue);font-variant-numeric:tabular-nums}
.finance-advisor-payer.selected,.finance-advisor-payer:focus-visible{border-color:var(--blue);outline:2px solid color-mix(in srgb,var(--blue) 30%,transparent)}
.finance-advisor-ranking{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.finance-advisor-ranking li{display:flex;align-items:start;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:7px 0;font-size:12px;line-height:1.5}
.finance-advisor-ranking li>span{overflow-wrap:anywhere;min-width:0}
.finance-advisor-ranking li>strong{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
.finance-advisor-table-card .finance-list-head{gap:15px;flex-wrap:wrap}
.finance-advisor-table-card .finance-list-head>label{display:grid;gap:4px;font-size:11px;flex:0 1 230px;color:var(--muted)}
.finance-advisor-table-card input{min-height:39px;border-radius:8px;border:1px solid var(--line);color:var(--text);background:var(--surface);padding:7px 10px}
.finance-advisor-table-wrap{max-height:480px;overflow:auto;min-width:0;border:1px solid var(--line);border-radius:9px}
.finance-advisor-table{width:100%;border-collapse:collapse;font-size:12px;min-width:660px}
.finance-advisor-table th{position:sticky;top:0;background:var(--surface2);font-size:11px;color:var(--muted);text-align:left}
.finance-advisor-table td,.finance-advisor-table th{border-bottom:1px solid var(--line);padding:9px;vertical-align:top}
.finance-advisor-table tbody tr:hover{background:color-mix(in srgb,var(--fill-info) 4%,var(--surface))}
.finance-advisor-table td:nth-child(4){min-width:160px;overflow-wrap:anywhere}
.finance-advisor-table td small{display:block;color:var(--muted);margin-top:4px}
.finance-advisor-num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:800}
.finance-advisor-invoice{display:grid;gap:10px;padding:14px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;margin:12px 0}
.finance-advisor-invoice>div:first-child{display:grid;gap:4px}
.finance-advisor-invoice small{font-size:11px;line-height:1.6;color:var(--muted)}
.finance-advisor-invoice button{justify-self:start}
.finance-advisor-invoice p{font-size:12px;line-height:1.65}
.finance-advisor-invoice a{color:var(--blue);font-size:12px}
.finance-travel-proof{display:grid;gap:12px;border:1px solid color-mix(in srgb,var(--blue) 25%,var(--line));background:color-mix(in srgb,var(--fill-info) 4%,var(--surface));border-radius:11px;padding:16px;margin:14px 0 0}
.finance-travel-proof h3{font-size:15px;margin:0 0 5px}
.finance-travel-proof p{font-size:12px;color:var(--muted);line-height:1.65;margin:0}
.finance-travel-proof-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.finance-travel-proof-inputs label{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--text)}
.finance-travel-proof-inputs input{min-width:0;min-height:42px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 10px}
.finance-travel-proof>button,.finance-travel-result>button{justify-self:start}
.finance-travel-result{display:grid;gap:11px}
.finance-travel-steps{padding:0;margin:0;display:grid;gap:0;list-style:none;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.finance-travel-steps li{display:grid;grid-template-columns:minmax(100px,.8fr) minmax(0,1.4fr) auto;gap:9px;align-items:center;padding:11px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px}
.finance-travel-steps li:last-child{border-bottom:0}
.finance-travel-steps li span:nth-child(2){color:var(--muted);line-height:1.55;overflow-wrap:anywhere}
.finance-travel-steps strong{font-variant-numeric:tabular-nums;white-space:nowrap}
.finance-travel-total{font-size:17px;font-variant-numeric:tabular-nums}
.finance-travel-warnings{background:color-mix(in srgb,var(--fill-warning) 10%,var(--surface));border:1px solid color-mix(in srgb,#d58a26 35%,var(--line));padding:12px;border-radius:9px;font-size:12px;line-height:1.7}
.finance-travel-warnings ul{margin:5px 0 0;padding-left:19px}
@media(max-width:900px){
 .finance-advisor-charts{grid-template-columns:1fr}
 .finance-advisor-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:540px){
 .finance-advisor-summary,.finance-travel-proof-inputs{grid-template-columns:1fr}
 .finance-advisor .card{padding:12px}
 .finance-advisor-month{grid-template-columns:32px minmax(0,1fr) 80px;gap:6px}
 .finance-advisor-month strong{text-align:right}
 .finance-travel-steps li{grid-template-columns:1fr auto;gap:5px}
 .finance-travel-steps li span:nth-child(2){grid-row:2;grid-column:1/-1}
 .finance-travel-proof{padding:12px}
}
</style>
