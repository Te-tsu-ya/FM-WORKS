<script>
function loadAttendancePreview(options={}){
  if(!state.data||!state.sessionToken)return;
  const key=state.data.today.slice(0,7)+'|'+state.data.user.employeeId;
  const preview=state.attendancePreview||(state.attendancePreview={data:null,key:'',at:0,loading:false,error:''});
  if(!options.force&&preview.data&&preview.key===key&&(Date.now()-Number(preview.at||0))<120000)return;
  const ticket=beginPageLoad('attendancePreview',key);if(!ticket)return;
  preview.loading=!(preview.data&&preview.key===key);
  preview.error='';
  google.script.run.withSuccessHandler(data=>{
    endPageLoad(ticket);
    const currentKey=state.data?state.data.today.slice(0,7)+'|'+state.data.user.employeeId:'';
    if(currentKey!==key)return;
    preview.data=data;preview.key=key;preview.at=Date.now();preview.loading=false;preview.error='';
    renderPageIfActive('attendance');
  }).withFailureHandler(err=>{
    endPageLoad(ticket);preview.loading=false;preview.error='月間情報を読み込めませんでした。';
    handleApiError(err,'勤怠の月間情報を読み込めませんでした');
    renderPageIfActive('attendance');
  }).getMonthlySummary(state.sessionToken,state.data.today.slice(0,7),state.data.user.employeeId);
}

function invalidateAttendancePreview(){
  if(!state.attendancePreview)return;
  state.attendancePreview.at=0;
}

function attendancePreviewData(){
  const p=state.attendancePreview;
  const key=state.data?state.data.today.slice(0,7)+'|'+state.data.user.employeeId:'';
  return p&&p.data&&p.key===key?p.data:null;
}

function attendancePreviewHasMeaningfulData(preview){
  return !!(preview&&Array.isArray(preview.daily)&&preview.daily.some(x=>
    x&&(
      x.clockIn||x.clockOut||Number(x.workMinutes||0)>0||x.leaveStatus||x.issue||x.worklogIssue
    )
  ));
}

function buildAttendanceSamplePreview(){
  if(!state.data||!state.data.today)return null;
  const ym=state.data.today.slice(0,7);
  const parts=ym.split('-').map(Number);
  const lastDay=new Date(parts[0],parts[1],0).getDate();
  const today=state.data.today;
  let sequence=0;
  const daily=[];
  for(let day=1;day<=lastDay;day++){
    const date=ym+'-'+String(day).padStart(2,'0');
    const dow=parseIso(date).getDay();
    const workingDay=dow!==0&&dow!==6;
    const row={
      date:date,companyType:workingDay?'通常勤務':'週末',companyName:workingDay?'通常勤務':'休日',
      workingDay:workingDay,clockIn:'',clockOut:'',workMinutes:0,overtimeMinutes:0,holidayMinutes:0,
      lateEarlyMinutes:0,breakMinutes:0,requiredBreakMinutes:workingDay?60:0,worklogMinutes:0,
      worklogDifferenceMinutes:0,worklogIssue:false,workLocation:'',remote:false,leaveStatus:'',
      absence:false,source:'SAMPLE',issue:false,issueType:''
    };
    if(workingDay&&date<today){
      sequence++;
      const pattern=((sequence-1)%5)+1;
      if(pattern===1){
        Object.assign(row,{clockIn:'09:00',clockOut:'18:00',workMinutes:480,breakMinutes:60,worklogMinutes:480,workLocation:'出社'});
      }else if(pattern===2){
        Object.assign(row,{clockIn:'08:55',clockOut:'18:15',workMinutes:500,overtimeMinutes:20,breakMinutes:60,worklogMinutes:500,workLocation:'出社→在宅',remote:true});
      }else if(pattern===3){
        Object.assign(row,{clockIn:'09:03',clockOut:'18:05',workMinutes:482,overtimeMinutes:2,breakMinutes:60,worklogMinutes:420,worklogDifferenceMinutes:-62,worklogIssue:true,workLocation:'出社'});
      }else if(pattern===4){
        Object.assign(row,{leaveStatus:'有給',worklogMinutes:0});
      }else{
        Object.assign(row,{clockIn:'09:12',clockOut:'',workMinutes:0,breakMinutes:0,worklogMinutes:0,workLocation:'外出',issue:true,issueType:'退勤打刻がありません'});
      }
    }
    daily.push(row);
  }
  const worked=daily.filter(x=>x.workMinutes>0);
  const totals={
    workDays:worked.length,
    absenceDays:0,
    totalMinutes:worked.reduce((s,x)=>s+Number(x.workMinutes||0),0),
    overtimeMinutes:worked.reduce((s,x)=>s+Number(x.overtimeMinutes||0),0),
    holidayMinutes:0,lateEarlyMinutes:0,
    paidLeaveDays:daily.filter(x=>x.leaveStatus==='有給').length,
    remoteDays:daily.filter(x=>x.remote).length,
    missingPunchDays:daily.filter(x=>x.issue).length,
    worklogMinutes:daily.reduce((s,x)=>s+Number(x.worklogMinutes||0),0),
    worklogMismatchDays:daily.filter(x=>x.worklogIssue).length
  };
  return {
    _sample:true,
    yearMonth:ym,
    employee:{employeeId:state.data.user.employeeId,name:state.data.user.fullName||state.data.user.displayName||'',displayName:state.data.user.displayName||''},
    totals:totals,
    daily:daily,
    requests:[],
    closeStatus:{closed:false,status:'OPEN'},
    reviewStatus:null
  };
}

function attendanceDisplayPreview(){
  const real=attendancePreviewData();
  if(attendancePreviewHasMeaningfulData(real))return real;
  if(state.data&&state.data.permissions&&state.data.permissions.adminConsole)return buildAttendanceSamplePreview();
  return real;
}

function openAttendanceSampleDay(date,preview){
  const item=preview&&Array.isArray(preview.daily)?preview.daily.find(x=>x.date===date):null;
  if(!item)return;
  const status=item.issue?item.issueType:(item.worklogIssue?'工数差異':(item.leaveStatus||(!item.workingDay?'休日':'正常')));
  const modal=ensureModal();
  modal.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card attendance-sample-modal' role='dialog' aria-modal='true' aria-label='勤怠サンプル詳細'>
    <div class='modal-head'><div><small>表示確認用サンプル</small><h2>${escapeHtml(fmtDate(item.date))}</h2></div><button type='button' class='icon-button' onclick='closeModal()' aria-label='閉じる'>×</button></div>
    <div class='attendance-sample-warning'>この内容は画面デザイン確認用です。Google Sheetsには保存されていません。</div>
    <div class='attendance-sample-detail-grid'>
      <div><span>状態</span><strong>${escapeHtml(status)}</strong></div>
      <div><span>出勤</span><strong>${escapeHtml(item.clockIn||'—')}</strong></div>
      <div><span>退勤</span><strong>${escapeHtml(item.clockOut||'—')}</strong></div>
      <div><span>実働</span><strong>${formatMinutesClient(item.workMinutes)}</strong></div>
      <div><span>休憩</span><strong>${formatMinutesClient(item.breakMinutes)}</strong></div>
      <div><span>勤務場所</span><strong>${escapeHtml(item.workLocation||'—')}</strong></div>
    </div>
    <div class='button-row section-gap'><button type='button' class='secondary-button' onclick='closeModal()'>閉じる</button></div>
  </section>`;
}

function openAttendanceMonthly(view){
  const preview=attendancePreviewData();
  state.monthly.yearMonth=state.data.today.slice(0,7);
  state.monthly.employeeId=state.data.user.employeeId;
  state.monthly.view=view==='list'?'list':'calendar';
  if(preview){
    state.monthly.data=preview;
    markPageCache('monthly',monthlyCacheKey());
  }
  navigate('monthly');
}

function openAttendancePreviewDay(date){
  const display=attendanceDisplayPreview();
  if(display&&display._sample){openAttendanceSampleDay(date,display);return}
  const preview=attendancePreviewData();if(!preview)return;
  state.monthly.yearMonth=preview.yearMonth;
  state.monthly.employeeId=state.data.user.employeeId;
  state.monthly.view='calendar';
  state.monthly.data=preview;
  markPageCache('monthly',monthlyCacheKey());
  navigate('monthly');
  setTimeout(()=>openMonthlyDay(date),0);
}

function attendanceStatusTone(a){
  return a.state==='working'?'working':a.state==='break'?'break':a.state==='finished'?'finished':'off';
}

function attendancePunchActions(a){
  if(a.state==='off')return `<button class='attendance-action primary' onclick="performPunch('出勤')">${svg('i-clock')}<span>出勤する</span></button>`;
  if(a.state==='working')return `<div class='attendance-action-stack'><button class='attendance-action danger' onclick="performPunch('退勤')">${svg('i-clock')}<span>退勤する</span></button><button class='attendance-secondary-action' onclick="performPunch('休憩開始')">休憩を開始</button></div>`;
  if(a.state==='break')return `<button class='attendance-action resume' onclick="performPunch('休憩終了')">${svg('i-clock')}<span>休憩を終了</span></button>`;
  return `<button class='attendance-action disabled' disabled>${svg('i-clock')}<span>本日の勤務は終了しました</span></button>`;
}

function attendanceLocationControl(){
  const a=state.data&&state.data.attendance;
  const live=a&&['working','break'].includes(a.state);
  return `<div class='attendance-location'><div class='attendance-location-label'><span>勤務場所</span>${live?`<small>変更すると時刻と一緒に履歴へ記録されます</small>`:''}</div><div>${['出社','在宅','外出'].map(x=>`<button class='${state.workLocation===x?'active':''}' onclick="selectWorkLocation('${x}')">${x}</button>`).join('')}</div></div>`;
}

function attendanceTimeline(a,company){
  const history=(a.history||[]).slice().reverse();
  const rows=history.map(x=>{
    const locationChange=x.action==='勤務場所変更';
    const kind=locationChange?'location':x.action==='出勤'?'in':x.action==='退勤'?'out':x.action.includes('休憩')?'break':'normal';
    const title=locationChange?'勤務場所を変更':x.action;
    const sub=locationChange
      ? `${x.fromWorkLocation||'—'} → ${x.workLocation||'—'}`
      : (x.workLocation||'');
    return `<div class='attendance-timeline-row ${kind}'><time>${escapeHtml(x.time)}</time><span class='attendance-timeline-dot'></span><div><strong>${escapeHtml(title)}</strong><small>${escapeHtml(sub)}</small></div></div>`;
  });
  if(a.state==='working'||a.state==='break'){
    rows.push(`<div class='attendance-timeline-row current'><time>現在</time><span class='attendance-timeline-dot'></span><div><strong>${escapeHtml(a.stateLabel)}</strong><small>${a.state==='break'?'休憩中です':escapeHtml(liveWorkedText(a))+' 経過'} / ${escapeHtml(a.workLocation||state.workLocation||'')}</small></div></div>`);
  }
  if(!a.clockOut&&company&&company.end){
    rows.push(`<div class='attendance-timeline-row planned'><time>${escapeHtml(company.end)}</time><span class='attendance-timeline-dot'></span><div><strong>退勤予定</strong><small>${company.name?escapeHtml(company.name):'会社カレンダー'}</small></div></div>`);
  }
  if(!rows.length&&company&&company.start){
    rows.push(`<div class='attendance-timeline-row planned'><time>${escapeHtml(company.start)}</time><span class='attendance-timeline-dot'></span><div><strong>出勤予定</strong><small>まだ打刻はありません</small></div></div>`);
  }
  return rows.length?rows.join(''):`<div class='attendance-empty'><strong>本日の打刻はまだありません</strong><span>出勤するとここに時系列で表示されます。</span></div>`;
}

function attendanceScheduledMinutes(company){
  if(!company||!company.working||!company.start||!company.end)return 0;
  const toMin=v=>{const p=String(v).split(':').map(Number);return p.length===2?p[0]*60+p[1]:0};
  return Math.max(0,toMin(company.end)-toMin(company.start)-Number(company.breakMinutes||0));
}

function attendanceTodayRow(preview){
  return preview&&Array.isArray(preview.daily)?preview.daily.find(x=>x.date===state.data.today)||null:null;
}

function attendanceAlerts(preview){
  const items=[],review=state.data&&state.data.monthlyReview,today=attendanceTodayRow(preview);
  if(review&&review.needsAttention){
    items.push({tone:'danger',title:`${review.targetMonth}の勤怠確認が${review.stale?'再度必要です':'未完了です'}`,sub:review.message,action:"openPreviousMonthReview()"});
  }
  if(preview&&preview._sample){
    const punchIssue=(preview.daily||[]).find(x=>x.issue);
    const worklogIssue=(preview.daily||[]).find(x=>x.worklogIssue);
    if(punchIssue)items.push({tone:'danger',title:`表示例：${punchIssue.date.slice(5).replace('-','/')} 打刻確認`,sub:punchIssue.issueType+'（画面確認用サンプル）',action:`openAttendancePreviewDay('${punchIssue.date}')`});
    if(worklogIssue)items.push({tone:'warning',title:`表示例：${worklogIssue.date.slice(5).replace('-','/')} 工数差異`,sub:`差異 ${formatMinutesClient(Math.abs(Number(worklogIssue.worklogDifferenceMinutes||0)))}（画面確認用サンプル）`,action:`openAttendancePreviewDay('${worklogIssue.date}')`});
  }else{
    if(today&&today.issue){
      items.push({tone:'danger',title:today.issueType||'本日の勤怠に確認事項があります',sub:'内容を確認し、必要に応じて打刻修正を申請してください。',action:`openAttendancePreviewDay('${today.date}')`});
    }
    if(today&&today.worklogIssue){
      const diff=Math.abs(Number(today.worklogDifferenceMinutes||0));
      items.push({tone:'warning',title:'工数と実働に差異があります',sub:`差異 ${formatMinutesClient(diff)}。工数画面で確認してください。`,action:"navigate('worklog')"});
    }
  }
  if(!items.length)return `<div class='attendance-alert-empty'><span>✓</span><div><strong>現在、確認が必要な勤怠はありません</strong><small>問題が見つかった場合はここに表示します。</small></div></div>`;
  return items.slice(0,3).map(x=>`<button class='attendance-alert-item ${x.tone}' onclick="${x.action}"><span>!</span><div><strong>${escapeHtml(x.title)}</strong><small>${escapeHtml(x.sub)}</small></div><b>›</b></button>`).join('');
}

function attendanceTodayStats(a,company,preview){
  const today=attendanceTodayRow(preview);
  const breakMinutes=today?Number(today.breakMinutes||0):0;
  const scheduled=attendanceScheduledMinutes(company);
  const remaining=scheduled?Math.max(0,scheduled-Number(a.workedMinutes||0)):null;
  return `<div class='attendance-today-stats'>
    <div><span>実働</span><strong data-live-worked>${escapeHtml(liveWorkedText(a))}</strong><small>${scheduled?'予定 '+formatMinutesClient(scheduled):'勤務予定未設定'}</small></div>
    <div><span>休憩</span><strong>${formatMinutesClient(breakMinutes)}</strong><small>${company&&company.breakMinutes?'予定 '+formatMinutesClient(company.breakMinutes):'—'}</small></div>
    <div><span>残り</span><strong>${remaining===null?'—':formatMinutesClient(remaining)}</strong><small>${company&&company.end?'退勤予定 '+escapeHtml(company.end):'終了時刻未設定'}</small></div>
  </div>`;
}

function attendanceDayTone(x){
  if(x.issue)return 'danger';
  if(x.worklogIssue)return 'warning';
  if(x.leaveStatus)return 'leave';
  if(!x.workingDay)return 'off';
  if(x.workMinutes>0)return 'ok';
  return 'empty';
}

function attendanceMonthCalendar(preview){
  if(!preview){
    const err=state.attendancePreview&&state.attendancePreview.error;
    return err?`<div class='attendance-preview-error'><strong>${escapeHtml(err)}</strong><button onclick="loadAttendancePreview({force:true})">再読込</button></div>`:`<div class='attendance-calendar-skeleton'></div>`;
  }
  const parts=preview.yearMonth.split('-').map(Number),first=new Date(parts[0],parts[1]-1,1);
  const blanks=Array.from({length:first.getDay()},()=>`<span class='attendance-mini-day blank'></span>`).join('');
  const cells=preview.daily.map(x=>{
    const n=Number(x.date.slice(-2)),tone=attendanceDayTone(x),today=x.date===state.data.today;
    return `<button class='attendance-mini-day ${tone} ${today?'today':''}' onclick="openAttendancePreviewDay('${x.date}')" aria-label='${escapeHtml(x.date)}'><span>${n}</span><i></i></button>`;
  }).join('');
  return `<div class='attendance-mini-calendar'><div class='attendance-mini-weekdays'>${['日','月','火','水','木','金','土'].map(x=>`<span>${x}</span>`).join('')}</div><div class='attendance-mini-grid'>${blanks}${cells}</div><div class='attendance-calendar-legend'><span><i class='ok'></i>正常</span><span><i class='warning'></i>工数差異</span><span><i class='danger'></i>要確認</span><span><i class='off'></i>休日・未入力</span></div></div>`;
}

function attendanceMonthSummary(preview){
  if(!preview)return `<div class='attendance-summary-skeleton'><span></span><span></span><span></span><span></span></div>`;
  const t=preview.totals||{};
  return `<div class='attendance-month-kpis'>
    <div><span>出勤日数</span><strong>${Number(t.workDays||0)}日</strong></div>
    <div><span>実働時間</span><strong>${formatMinutesClient(t.totalMinutes)}</strong></div>
    <div><span>残業時間</span><strong>${formatMinutesClient(t.overtimeMinutes)}</strong></div>
    <div><span>有給取得</span><strong>${Number(t.paidLeaveDays||0)}日</strong></div>
  </div>`;
}

function attendanceRecentHistory(preview){
  if(!preview)return `<div class='attendance-history-skeleton'></div>`;
  const rows=(preview.daily||[]).filter(x=>x.date<=state.data.today&&(x.clockIn||x.clockOut||x.workMinutes||x.leaveStatus||x.issue)).slice(-4).reverse();
  if(!rows.length)return `<div class='attendance-empty compact'><strong>今月の勤怠履歴はまだありません</strong></div>`;
  return `<div class='attendance-recent-table'><div class='attendance-recent-head'><span>日付</span><span>出勤</span><span>退勤</span><span>実働</span><span>休憩</span><span>残業</span><span>勤務場所</span><span>状態</span></div>${rows.map(x=>{
    const tone=attendanceDayTone(x);
    const label=x.issue?'要確認':x.worklogIssue?'工数差異':x.leaveStatus||'正常';
    return `<button class='attendance-recent-row' onclick="openAttendancePreviewDay('${x.date}')"><span><b>${escapeHtml(x.date.slice(5).replace('-','/'))}</b><small>${escapeHtml('日月火水木金土'[parseIso(x.date).getDay()])}</small></span><span>${escapeHtml(x.clockIn||'—')}</span><span>${escapeHtml(x.clockOut||'—')}</span><span>${formatMinutesClient(x.workMinutes)}</span><span>${formatMinutesClient(x.breakMinutes)}</span><span>${formatMinutesClient(x.overtimeMinutes)}</span><span>${escapeHtml(x.workLocation||'—')}</span><span><em class='${tone}'>${escapeHtml(label)}</em></span></button>`;
  }).join('')}</div>`;
}

function attendancePage(){
  const d=state.data,a=d.attendance,company=d.companyToday||null,preview=attendanceDisplayPreview();
  const sampleBadge=preview&&preview._sample?`<span class='attendance-sample-badge' title='実データには保存されません'>表示確認用サンプル</span>`:'';
  const dateAction=`<div class='attendance-date-actions'>${sampleBadge}<div class='attendance-date-chip'>${svg('i-calendar')}<strong>${escapeHtml(fmtDate(d.today))}</strong><span>${company?escapeHtml(company.name||company.type||'勤務日'):'会社カレンダー未登録'}</span></div></div>`;
  const stateTone=attendanceStatusTone(a);
  const currentMain=a.clockIn?`<strong class='attendance-live-value' data-live-worked>${escapeHtml(liveWorkedText(a))}</strong><span class='attendance-live-range'>${escapeHtml(a.clockIn)} 〜 ${escapeHtml(a.clockOut||'現在')}</span>`:`<strong class='attendance-live-value off-copy'>まだ出勤していません</strong><span class='attendance-live-range'>勤務を開始すると実働時間を表示します</span>`;
  return `<div class='attendance-dashboard'>
    ${pageHead('勤怠','出退勤、休憩、勤務場所、打刻履歴、月間勤怠を1つの流れで確認します。',dateAction)}
    ${attendanceWorkspaceTabs('attendance')}
    <div class='attendance-top-grid'>
      <section class='attendance-focus-card ${stateTone}'>
        <header><div><span class='eyebrow'>CURRENT STATUS</span><h2>現在の勤務状況</h2></div><span class='attendance-state-pill ${stateTone}'><i></i>${escapeHtml(a.stateLabel)}</span></header>
        <div class='attendance-focus-main'>${currentMain}</div>
        ${attendancePunchActions(a)}
        ${attendanceLocationControl()}
      </section>
      <section class='attendance-panel attendance-timeline-card'>
        <header><div><span class='eyebrow'>TODAY</span><h2>今日の勤務タイムライン</h2></div><button class='text-button' onclick="openAttendanceMonthly('list')">履歴を見る</button></header>
        <div class='attendance-timeline'>${attendanceTimeline(a,company)}</div>
        ${company&&company.working?`<div class='attendance-schedule-strip'><span>予定勤務</span><strong>${escapeHtml(company.start||'--:--')} 〜 ${escapeHtml(company.end||'--:--')}</strong><small>休憩 ${formatMinutesClient(company.breakMinutes||0)}</small></div>`:''}
      </section>
      <div class='attendance-side-stack'>
        <section class='attendance-panel attendance-alert-card'>
          <header><div><span class='eyebrow'>CHECK</span><h2>確認が必要なこと</h2></div></header>
          <div class='attendance-alert-list'>${attendanceAlerts(preview)}</div>
        </section>
        <section class='attendance-panel attendance-today-card'>
          <header><div><span class='eyebrow'>SUMMARY</span><h2>本日の集計</h2></div><button class='text-button' onclick="openAttendanceMonthly('calendar')">詳細</button></header>
          ${attendanceTodayStats(a,company,preview)}
        </section>
      </div>
    </div>
    <div class='attendance-bottom-grid'>
      <section class='attendance-panel attendance-calendar-card'>
        <header><div><span class='eyebrow'>MONTH</span><h2>${escapeHtml(d.today.slice(0,7).replace('-','年'))}月のカレンダー</h2></div><button class='text-button' onclick="openAttendanceMonthly('calendar')">月間を開く</button></header>
        ${attendanceMonthCalendar(preview)}
      </section>
      <section class='attendance-panel attendance-history-card'>
        <header><div><span class='eyebrow'>MONTHLY SUMMARY</span><h2>今月の勤怠サマリー</h2></div><button class='text-button' onclick="openAttendanceMonthly('list')">すべて見る</button></header>
        ${attendanceMonthSummary(preview)}
        <div class='attendance-history-title'>直近の勤怠履歴</div>
        ${attendanceRecentHistory(preview)}
      </section>
    </div>
  </div>`;
}

function formatMinutesClient(minutes){var m=Math.max(0,Number(minutes||0));return Math.floor(m/60)+'時間'+String(m%60).padStart(2,'0')+'分';}
function loadWorklogs(options={}){
  if(!state.worklog.date)state.worklog.date=state.data.today;
  const key=worklogCacheKey();
  if(!options.force&&cacheFresh('worklog',key))return;
  const ticket=beginPageLoad('worklog',key);if(!ticket)return;
  const hasCurrent=cacheHas('worklog',key);
  state.worklog.loading=!hasCurrent;
  if(!options.silent)renderPageIfActive('worklog');
  google.script.run.withSuccessHandler(function(data){
    endPageLoad(ticket);

  if(!dialog.contains(active)){event.preventDefault();(event.shiftKey?last:first).focus();return true}

      <div class='request-date-grid ${single?'single':''}'>
        <label id='reqStartField' class='field'><span>${single?'対象日':'開始日'} <em>必須</em></span><input id='reqStart' type='date' value='${today}' onchange='syncRequestDates()'></label>
        <label id='reqEndField' class='field ${single?'is-hidden':''}'><span>終了日 <em>必須</em></span><input id='reqEnd' type='date' value='${today}' onchange='refreshRequestPreview()'></label>
      </div>
      <div id='requestPreview' class='request-preview ${isPaid?'':'is-hidden'}'></div>
      <div id='correctionFields' class='request-correction ${type==='打刻修正'?'':'is-hidden'}'>
        <div class='request-block-title'><strong>修正する打刻</strong><span>元の打刻を選ぶか、不足打刻として追加します。</span></div>
        <div class='form-grid'>
          <label class='field full'><span>元の打刻</span><select id='reqOriginalPunch'><option value=''>不足打刻として追加</option></select></label>
          <label id='reqActionField' class='field'><span>打刻種別 <em>必須</em></span><select id='reqAction'><option>出勤</option><option>休憩開始</option><option>休憩終了</option><option>退勤</option></select></label>
          <label id='reqTimeField' class='field'><span>修正後時刻 <em>必須</em></span><input id='reqTime' type='time'></label>
          <label class='field'><span>勤務場所</span><select id='reqLocation'><option>出社</option><option>在宅</option><option>外出</option></select></label>
        </div>
      </div>
      <label id='reqReasonField' class='field full request-reason-field'><span>申請理由 <em>必須</em></span><div class='request-reason-chips'>${reasonChips}</div><textarea id='reqReason' rows='2' maxlength='600' placeholder='例：私用のため'></textarea></label>
      <label class='field full'><span>補足 <i>任意</i></span><textarea id='reqContent' rows='2' maxlength='1500' placeholder='承認者に伝えたいことがあれば入力'></textarea></label>
    </div>
    <div class='modal-actions request-modal-actions'><span class='request-submit-hint'>入力内容は申請後も履歴で確認できます。</span><div><button class='secondary-button' onclick='closeModal()'>キャンセル</button><button id='requestSubmitButton' class='primary-button' onclick='submitRequestFromModal()'>${escapeHtml(meta.label)}を申請</button></div></div>
  </section>`;
  if(type==='打刻修正')loadCorrectionPunchOptions();
  if(isPaid)refreshRequestPreview();
}
function changeRequestSubtype(type){
  const currentReason=document.getElementById('reqReason')?document.getElementById('reqReason').value:'';
  const currentDate=document.getElementById('reqStart')?document.getElementById('reqStart').value:state.data.today;
  openRequestModal(type);
  const reason=document.getElementById('reqReason'),start=document.getElementById('reqStart'),end=document.getElementById('reqEnd');
  if(reason)reason.value=currentReason;if(start)start.value=currentDate;if(end)end.value=currentDate;
  refreshRequestPreview();
}
function setRequestReason(value){const el=document.getElementById('reqReason');if(!el)return;el.value=value==='その他'?'':value+(value.endsWith('ため')?'':'のため');el.focus()}
function syncRequestDates(){
  const type=document.getElementById('reqType')?document.getElementById('reqType').value:'';
  const start=document.getElementById('reqStart'),end=document.getElementById('reqEnd');
  const single=['午前半休','午後半休','1/4日有給','打刻修正'].includes(type);
  if(start&&end&&single)end.value=start.value;
  if(type==='打刻修正')loadCorrectionPunchOptions();
  refreshRequestPreview();
}
function requestPayloadFromForm(){
  const type=document.getElementById('reqType').value;
  const start=document.getElementById('reqStart').value;
  const end=document.getElementById('reqEnd').value||start;
  const payload={type,startDate:start,endDate:end,reason:document.getElementById('reqReason').value,content:document.getElementById('reqContent').value};
  if(type==='打刻修正')payload.correction={originalPunchId:document.getElementById('reqOriginalPunch').value,action:document.getElementById('reqAction').value,time:document.getElementById('reqTime').value,workLocation:document.getElementById('reqLocation').value};
  return payload;
}
function clearRequestFieldErrors(){document.querySelectorAll('.request-modal-card .field-error').forEach(x=>x.classList.remove('field-error'))}
function showRequestError(message,fieldId){
  clearRequestFieldErrors();
  const box=document.getElementById('requestFormError');
  if(box){box.innerHTML=`<strong>申請できません</strong><span>${escapeHtml(message)}</span>`;box.classList.add('show')}
  const field=fieldId?document.getElementById(fieldId):null;
  if(field){field.classList.add('field-error');const input=field.querySelector('input,select,textarea');if(input)input.focus()}
  const card=document.querySelector('.request-modal-card');if(card)card.scrollTo({top:0,behavior:'smooth'});
}
function hideRequestError(){const box=document.getElementById('requestFormError');if(box)box.classList.remove('show');clearRequestFieldErrors()}
function validateRequestForm(payload){
  if(!payload.startDate)return ['対象日を選択してください。','reqStartField'];
  if(payload.endDate&&payload.startDate>payload.endDate)return ['終了日は開始日以降にしてください。','reqEndField'];
  if(!String(payload.reason||'').trim())return ['申請理由を入力してください。','reqReasonField'];
  if(['有給','午前半休','午後半休','1/4日有給'].includes(payload.type)){
    const x=state.requests.context||{};
    if(!x.leaveBalanceConfigured)return ['有給残日数が未設定です。管理者に社員情報の有給残日数を設定してもらってください。',''];
  }
  if(payload.type==='打刻修正'&&!payload.correction.time)return ['修正後の時刻を入力してください。','reqTimeField'];
  return null;
}
function refreshRequestPreview(){
  const typeEl=document.getElementById('reqType'),box=document.getElementById('requestPreview');
  if(!typeEl||!box)return;
  const type=typeEl.value;
  if(!['有給','午前半休','午後半休','1/4日有給'].includes(type)){box.classList.add('is-hidden');return}
  const payload=requestPayloadFromForm();
  if(!payload.startDate||!payload.endDate)return;
  box.classList.remove('is-hidden');
  box.innerHTML="<span class='preview-loading'>有給日数を確認しています…</span>";
  const seq=++requestPreviewSequence;
  google.script.run.withSuccessHandler(data=>{
    if(seq!==requestPreviewSequence||!document.getElementById('requestPreview'))return;
    if(!data.leaveBalanceConfigured){
      box.innerHTML="<div class='preview-warning'><strong>有給残日数が未設定です</strong><span>管理者が社員情報から設定すると、有給を申請できます。</span></div>";
      return;
    }
    const projected=data.projectedBalance;
    const bad=projected<0;
    box.innerHTML=`<div class='preview-item'><span>今回の消化</span><strong>${formatLeaveDays(data.requestedDays)}</strong></div><div class='preview-arrow'>→</div><div class='preview-item'><span>申請後の残数</span><strong class='${bad?'danger':''}'>${formatLeaveDays(projected)}</strong></div>${bad?"<div class='preview-warning full'><strong>残日数が不足しています</strong><span>日付または申請区分を変更してください。</span></div>":''}`;
  }).withFailureHandler(err=>{
    if(seq!==requestPreviewSequence||!document.getElementById('requestPreview'))return;
    box.innerHTML=`<div class='preview-warning'><strong>日数を確認できません</strong><span>${escapeHtml(cleanApiErrorMessage(err,'会社カレンダーを確認してください。'))}</span></div>`;
  }).previewRequest(state.sessionToken,payload);
}
function loadCorrectionPunchOptions(){
  const date=document.getElementById('reqStart').value;if(!date)return;
  const select=document.getElementById('reqOriginalPunch');if(select)select.innerHTML='<option value="">読み込み中…</option>';
  google.script.run.withSuccessHandler(function(items){
    const el=document.getElementById('reqOriginalPunch');if(!el)return;
    el.innerHTML='<option value="">不足打刻として追加</option>'+items.map(x=>'<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.timestamp.slice(11,16)+' '+x.action+' / '+x.workLocation)+'</option>').join('');
  }).withFailureHandler(function(err){showRequestError(cleanApiErrorMessage(err,'打刻履歴を読み込めませんでした。'),'');}).getPunchesForDate(state.sessionToken,date);
}
function submitRequestFromModal(){
  hideRequestError();
  const payload=requestPayloadFromForm(),invalid=validateRequestForm(payload);
  if(invalid){showRequestError(invalid[0],invalid[1]);return}
  const button=document.getElementById('requestSubmitButton');
  if(button){button.disabled=true;button.dataset.label=button.textContent;button.textContent='申請中…'}
  google.script.run.withSuccessHandler(function(){
    closeModal();showToast('申請を登録しました');
    invalidatePageCache('requests','monthly');loadRequests({force:true});
  }).withFailureHandler(function(err){
    if(button){button.disabled=false;button.textContent=button.dataset.label||'申請する'}
    const msg=cleanApiErrorMessage(err,'申請を登録できませんでした。');
    const field=msg.includes('理由')?'reqReasonField':msg.includes('日')?'reqStartField':'';
    showRequestError(msg,field);
  }).submitRequest(state.sessionToken,payload);
}
function requestApprovedCancel(id){openReasonDialog('承認済み申請の取消を依頼','取消理由を入力してください。承認者の確認後に取消されます。','取消を依頼',function(reason){google.script.run.withSuccessHandler(function(){showToast('取消を依頼しました');invalidatePageCache('requests','monthly');loadRequests({force:true});loadNotifications();}).withFailureHandler(function(err){handleApiError(err,'取消依頼できませんでした');}).requestApprovedCancellation(state.sessionToken,id,reason);});}
function approveCancellationRequest(id){openConfirmDialog('取消を承認','承認済み申請を取り消しますか？ 有給の場合は残日数を戻します。','取消を承認',function(){google.script.run.withSuccessHandler(function(){showToast('取消を承認しました');invalidatePageCache('requests','monthly','homeOverview');loadRequests({force:true});loadHomeOverview({force:true,silent:true});}).withFailureHandler(function(err){handleApiError(err,'取消承認できませんでした');}).decideApprovedCancellation(state.sessionToken,id,'APPROVE','');},true);}
function rejectCancellationRequest(id){openReasonDialog('取消を却下','申請者に表示する理由を入力してください。','取消を却下',function(reason){google.script.run.withSuccessHandler(function(){showToast('取消を却下しました');invalidatePageCache('requests');loadRequests({force:true});}).withFailureHandler(function(err){handleApiError(err,'取消却下できませんでした');}).decideApprovedCancellation(state.sessionToken,id,'REJECT',reason);});}
function cancelOwnRequest(id){openConfirmDialog('申請を取り消す','承認待ちの申請を取り消しますか？','取り消す',function(){google.script.run.withSuccessHandler(function(){showToast('申請を取り消しました');invalidatePageCache('requests','monthly');loadRequests({force:true});}).withFailureHandler(function(err){handleApiError(err,'申請を取り消せませんでした');}).cancelRequest(state.sessionToken,id);},true);}
function approveTeamRequest(id){openConfirmDialog('申請を承認','この申請を承認しますか？','承認する',function(){google.script.run.withSuccessHandler(function(){showToast('申請を承認しました');invalidatePageCache('requests','monthly');loadRequests({force:true});loadNotifications();}).withFailureHandler(function(err){handleApiError(err,'承認できませんでした');}).approveRequest(state.sessionToken,id,'APPROVE','');},false);}
function rejectTeamRequest(id){openReasonDialog('申請を差し戻す','申請者に表示する差戻し理由を入力してください。','差し戻す',function(comment){google.script.run.withSuccessHandler(function(){showToast('申請を差し戻しました');invalidatePageCache('requests','monthly');loadRequests({force:true});loadNotifications();}).withFailureHandler(function(err){handleApiError(err,'差戻しできませんでした');}).approveRequest(state.sessionToken,id,'REJECT',comment);});}


</script>
