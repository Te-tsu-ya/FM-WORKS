<script>
function attendancePage(){const d=state.data,a=d.attendance;return `${pageHead('勤怠','出退勤、休憩、勤務場所、打刻履歴を管理します。')}<div class='grid cols-2'>${card('現在の勤務状況',`<div class='status-row'><span class='status-dot' style='background:${a.state==='off'||a.state==='finished'?'#8090a8':a.state==='break'?'#f3a11b':'#18a46d'}'></span><strong>${a.stateLabel}</strong></div><div class='attendance-time'>${a.clockIn?a.clockIn+' に出勤':'まだ出勤していません'}</div><p class='muted'>現在の実働：${liveWorkedText(a)}</p><div class='button-row'>${punchButtons(a)}</div>${workLocationSelector()}`)}${card('本日の打刻状況',a.history.length?list(a.history.map(x=>({title:`${x.time} ${x.action}`,sub:x.workLocation,color:x.action==='退勤'?'#8090a8':x.action.includes('休憩')?'#f3a11b':'#1478ff'}))):'<p class=\'muted\'>まだ打刻はありません。</p>')}</div><div class='grid cols-4 section-gap'>${metric('本日の実働',liveWorkedText(a),'tone-green')}${metric('出勤時刻',a.clockIn||'--:--')}${metric('退勤時刻',a.clockOut||'--:--','tone-orange')}${metric('保存先','Google Sheets','tone-purple')}</div>`}


function formatMinutesClient(minutes){var m=Math.max(0,Number(minutes||0));return Math.floor(m/60)+'時間'+String(m%60).padStart(2,'0')+'分';}
function loadWorklogs(options={}){
  if(!state.worklog.date)state.worklog.date=state.data.today;
  const key=worklogCacheKey();
  if(!options.force&&cacheFresh('worklog',key))return;
  const ticket=beginPageLoad('worklog',key);if(!ticket)return;
  const hasCurrent=cacheHas('worklog',key);
  state.worklog.loading=!hasCurrent;
  if(!options.silent)renderPageIfActive('worklog');
  google.script.run.withSuccessHandler(function(data){
    endPageLoad(ticket);
    if(worklogCacheKey()!==key)return;
    state.worklog.items=data.items||[];
    state.worklog.totalMinutes=data.totalMinutes||0;
    state.worklog.loading=false;
    markPageCache('worklog',key);
    renderPageIfActive('worklog');
  }).withFailureHandler(function(err){
    endPageLoad(ticket);state.worklog.loading=false;
    if(!handleApiError(err,'工数を読み込めませんでした')&&!options.silent)renderPageIfActive('worklog');
  }).getWorklogs(state.sessionToken,{start:state.worklog.date,end:state.worklog.date});
}
function moveWorklogDate(n){state.worklog.date=addDays(state.worklog.date||state.data.today,n);loadWorklogs();}
function worklogPage(){var w=state.worklog,date=w.date||state.data.today,attendance=state.data.attendance,attendanceMinutes=date===state.data.today?Number(attendance.workedMinutes||0):0,unentered=Math.max(0,attendanceMinutes-Number(w.totalMinutes||0)),projects=[...new Set((w.items||[]).map(function(x){return x.project;}))].length;var rows=(w.items||[]).map(function(x){return '<div class="list-item"><span class="status-dot" style="background:#1478ff"></span><div><strong>'+escapeHtml(x.project)+'　'+formatMinutesClient(x.minutes)+'</strong><div class="muted" style="font-size:12px;margin-top:3px">'+escapeHtml(x.start)+'-'+escapeHtml(x.end)+' / '+escapeHtml(x.category||'未分類')+' / '+escapeHtml(x.description)+'</div></div><div class="admin-actions"><button class="small-button" onclick="openWorklogModal(\''+x.id+'\')">編集</button><button class="small-button" onclick="deleteWorklogItem(\''+x.id+'\')">削除</button></div></div>';}).join('');var action='<button class="primary-button" onclick="openWorklogModal()">＋ 工数追加</button>';var toolbar='<div class="schedule-toolbar"><div class="toolbar-group"><button class="secondary-button compact" onclick="moveWorklogDate(-1)">‹</button><button class="secondary-button compact" onclick="state.worklog.date=state.data.today;loadWorklogs()">今日</button><button class="secondary-button compact" onclick="moveWorklogDate(1)">›</button><strong class="period-label">'+fmtDate(date)+'</strong></div></div>';if(w.loading&&!cacheHas('worklog',worklogCacheKey()))return pageHead('工数','勤務時間に対して、どの業務に何時間使ったかを記録します。',action)+toolbar+'<div class="loading-card"></div>';return pageHead('工数','勤務時間に対して、どの業務に何時間使ったかを記録します。',action)+toolbar+'<div class="grid cols-4">'+metric('入力済工数',formatMinutesClient(w.totalMinutes),'tone-green')+metric('本日の実働',date===state.data.today?attendance.worked:'—')+metric('未入力時間',date===state.data.today?formatMinutesClient(unentered):'—','tone-orange')+metric('プロジェクト数',projects+'件','tone-purple')+'</div><div class="grid cols-2 section-gap">'+card('工数一覧',rows||'<p class="muted">この日の工数はまだありません。</p>')+card('入力ルール','<p class="muted">プロジェクト・作業分類・開始/終了・作業内容を記録します。保存内容は「FM WORKS DB / 工数」に反映され、月次集計へ自動で利用されます。</p><div class="progress"><span style="width:'+(attendanceMinutes?Math.min(100,Math.round(w.totalMinutes/attendanceMinutes*100)):0)+'%"></span></div>')+'</div>';}
function openWorklogModal(id){
  id=id||'';
  var item=id?(state.worklog.items||[]).find(function(x){return x.id===id;}):null;
  var date=state.worklog.date||state.data.today;
  var projects=(state.data.projects||[]).slice();
  if(item&&item.project&&!projects.some(function(p){return p.name===item.project;})){
    projects.push({name:item.project,status:'停止'});
  }
  var options=projects.map(function(p){
    return '<option value="'+escapeHtml(p.name)+'" '+(item&&item.project===p.name?'selected':'')+'>'+escapeHtml(p.name)+(p.status&&p.status!=='進行中'?'（'+escapeHtml(p.status)+'）':'')+'</option>';
  }).join('');
  var r=ensureModal();
  r.innerHTML='<div class="modal-backdrop" onclick="closeModal()"></div><section class="modal-card" role="dialog" aria-modal="true"><div class="modal-head"><div><small>'+(item?'工数を編集':'工数を追加')+'</small><h2>'+fmtDate(date)+'</h2></div><button class="icon-button" onclick="closeModal()">×</button></div><div class="form-grid"><label class="field full"><span>プロジェクト</span><select id="wlProject">'+(options||'<option value="">プロジェクトが未登録です</option>')+'</select></label><label class="field"><span>作業分類</span><input id="wlCategory" value="'+escapeHtml(item?item.category:'')+'" placeholder="開発 / 営業 / 会議 等"></label><label class="field"><span>日付</span><input id="wlDate" type="date" value="'+(item?item.date:date)+'"></label><label class="field"><span>開始</span><input id="wlStart" type="time" value="'+escapeHtml(item?item.start:'09:00')+'"></label><label class="field"><span>終了</span><input id="wlEnd" type="time" value="'+escapeHtml(item?item.end:'10:00')+'"></label><label class="field full"><span>作業内容</span><textarea id="wlDescription" rows="3" placeholder="実施した内容を入力">'+escapeHtml(item?item.description:'')+'</textarea></label><label class="field full"><span>備考</span><textarea id="wlNote" rows="2">'+escapeHtml(item?item.note:'')+'</textarea></label></div><div class="modal-actions"><span class="muted">'+(projects.length?'':'管理者がプロジェクトを登録してください。')+'</span><div><button class="secondary-button" onclick="closeModal()">キャンセル</button><button class="primary-button" '+(projects.length?'':'disabled')+' onclick="saveWorklogFromModal(\''+id+'\')">保存</button></div></div></section>';
}
function saveWorklogFromModal(id){var payload={id:id,date:document.getElementById('wlDate').value,project:document.getElementById('wlProject').value,category:document.getElementById('wlCategory').value,start:document.getElementById('wlStart').value,end:document.getElementById('wlEnd').value,description:document.getElementById('wlDescription').value,note:document.getElementById('wlNote').value};google.script.run.withSuccessHandler(function(){closeModal();state.worklog.date=payload.date;showToast('工数を保存しました');invalidatePageCache('worklog','monthly');loadWorklogs({force:true});}).withFailureHandler(function(err){handleApiError(err,'工数を保存できませんでした');}).saveWorklog(state.sessionToken,payload);}
function deleteWorklogItem(id){openConfirmDialog('工数を削除','削除後も監査用データは保持されます。削除しますか？','削除',function(){google.script.run.withSuccessHandler(function(){showToast('工数を削除しました');invalidatePageCache('worklog','monthly');loadWorklogs({force:true});}).withFailureHandler(function(err){handleApiError(err,'工数を削除できませんでした');}).deleteWorklog(state.sessionToken,id);},true);}

function scheduleRange(){const s=state.schedule; if(s.view==='month'||s.view==='list')return monthGridRange(s.date); if(s.view==='week')return {start:startOfWeek(s.date),end:endOfWeek(s.date)}; return {start:s.date,end:s.date}}
function loadSchedule(options={}){
  if(!state.schedule.date)return;
  const r=scheduleRange(),key=scheduleCacheKey();
  if(!options.force&&cacheFresh('schedule',key))return;
  const ticket=beginPageLoad('schedule',key);if(!ticket)return;
  const hasCurrent=cacheHas('schedule',key);
  state.schedule.loading=!hasCurrent;
  if(!options.silent)renderPageIfActive('schedule');
  google.script.run.withSuccessHandler(data=>{
    endPageLoad(ticket);
    if(scheduleCacheKey()!==key)return;
    state.schedule.events=data.events||[];
    state.schedule.companyDays=data.companyDays||[];
    state.schedule.employees=data.employees||[];
    state.schedule.loading=false;
    markPageCache('schedule',key);
    renderPageIfActive('schedule');
  }).withFailureHandler(err=>{
    endPageLoad(ticket);state.schedule.loading=false;
    if(!handleApiError(err,'予定表の読み込みに失敗しました')&&!options.silent)renderPageIfActive('schedule');
  }).getScheduleBundle(state.sessionToken,{start:r.start,end:r.end,employeeId:state.schedule.employeeId,category:state.schedule.category});
}
function changeScheduleView(v){state.schedule.view=v;loadSchedule()}
function moveSchedule(step){const s=state.schedule;if(s.view==='month'||s.view==='list')s.date=addMonths(s.date,step);else if(s.view==='week')s.date=addDays(s.date,7*step);else s.date=addDays(s.date,step);loadSchedule()}
function scheduleToday(){state.schedule.date=state.data.today;loadSchedule()}
function setScheduleFilter(kind,value){state.schedule[kind]=value;loadSchedule()}
function companyDayMap(){return Object.fromEntries((state.schedule.companyDays||[]).map(d=>[d.date,d]))}
function eventsFor(date){return (state.schedule.events||[]).filter(e=>e.date===date)}
function eventChip(e){
  const people=eventPeople(e),primary=people[0]||{id:'unknown'},color=personColor(primary.id);
  return `<button class='schedule-event' style='--person-color:${color.line};--person-bg:${color.bg};--category-color:${categoryColor(e.category)}' onclick="event.stopPropagation();openScheduleEditor('${e.id}')">
    <span class='schedule-event-time'>${e.allDay?'終日':escapeHtml(e.start||'')}</span>
    <strong class='schedule-event-title'>${escapeHtml(e.title)}</strong>
    <span class='schedule-event-owner'>${eventPersonAvatar(e)}<b>${escapeHtml(eventPeopleLabel(e))}</b></span>
    <i class='schedule-category-dot' title='${escapeHtml(e.category)}'></i>
  </button>`
}
function scheduleToolbar(){const s=state.schedule;const employees=s.employees.length?s.employees:(state.data.employees||[]);return `<div class='schedule-toolbar'><div class='toolbar-group'><button class='secondary-button compact' onclick='moveSchedule(-1)'>‹</button><button class='secondary-button compact' onclick='scheduleToday()'>今日</button><button class='secondary-button compact' onclick='moveSchedule(1)'>›</button><strong class='period-label'>${fmtMonth(s.date)}</strong></div><div class='toolbar-group'><div class='segmented'>${[['month','月'],['week','週'],['day','日'],['list','一覧']].map(x=>`<button class='${s.view===x[0]?'active':''}' onclick="changeScheduleView('${x[0]}')">${x[1]}</button>`).join('')}</div><select class='filter-select' onchange="setScheduleFilter('employeeId',this.value)"><option value='ALL'>全社員</option>${employees.map(e=>`<option value='${e.employeeId}' ${s.employeeId===e.employeeId?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select><select class='filter-select' onchange="setScheduleFilter('category',this.value)"><option value='ALL'>全カテゴリ</option>${Object.keys(CATEGORY_COLORS).map(c=>`<option value='${c}' ${s.category===c?'selected':''}>${c}</option>`).join('')}</select><button class='primary-button' onclick='openScheduleEditor()'>＋ 予定登録</button></div></div>`}
function monthView(){const s=state.schedule,range=monthGridRange(s.date),map=companyDayMap(),curMonth=parseIso(s.date).getMonth(),cells=[];for(let d=range.start;;d=addDays(d,1)){const dt=parseIso(d),ev=eventsFor(d),cd=map[d];cells.push(`<div class='month-day ${dt.getMonth()!==curMonth?'outside':''} ${isToday(d)?'today':''} ${cd&&!cd.working?'day-off':''}' onclick="openDay('${d}')"><div class='day-head'><span>${dt.getDate()}</span>${cd&&cd.type!=='通常勤務'?`<em class='day-type ${cd.working?'workday':'offday'}'>${escapeHtml(cd.name||cd.type)}</em>`:''}</div><div class='day-events'>${ev.slice(0,3).map(eventChip).join('')}${ev.length>3?`<button class='more-events'>＋${ev.length-3}件</button>`:''}</div></div>`);if(d===range.end)break}return `<div class='weekday-row'>${['日','月','火','水','木','金','土'].map(x=>`<div>${x}</div>`).join('')}</div><div class='month-grid'>${cells.join('')}</div>`}
function weekView(){const start=startOfWeek(state.schedule.date),map=companyDayMap();return `<div class='week-grid'>${Array.from({length:7},(_,i)=>{const d=addDays(start,i),cd=map[d],ev=eventsFor(d);return `<section class='week-day ${isToday(d)?'today':''} ${cd&&!cd.working?'day-off':''}'><header><strong>${fmtDate(d)}</strong><small>${cd?escapeHtml(cd.name||cd.type):''}</small></header><div>${ev.length?ev.map(eventChip).join(''):`<p class='muted empty-day'>予定なし</p>`}</div><button class='add-inline' onclick="openScheduleEditor('', '${d}')">＋</button></section>`}).join('')}</div>`}
function dayView(){const d=state.schedule.date,cd=companyDayMap()[d],ev=eventsFor(d);return `<div class='day-view'><div class='day-summary'><div><h2>${fmtDate(d)}</h2><p class='muted'>${cd?`${escapeHtml(cd.type)}${cd.name?' / '+escapeHtml(cd.name):''}${cd.working?'  '+cd.start+'-'+cd.end:''}`:'会社カレンダー未登録'}</p></div><button class='primary-button' onclick="openScheduleEditor('', '${d}')">＋ この日に予定</button></div>${ev.length?ev.map(e=>{const p=eventPeople(e)[0]||{id:'unknown'},color=personColor(p.id);return `<article class='agenda-item' style='--person-color:${color.line};--person-bg:${color.bg}' onclick="openScheduleEditor('${e.id}')"><div class='agenda-time'>${e.allDay?'終日':escapeHtml(e.start||'--:--')}${e.end?' - '+escapeHtml(e.end):''}</div><div><strong>${escapeHtml(e.title)}</strong><p class='agenda-owner'>${eventPersonAvatar(e)}<b>${escapeHtml(eventPeopleLabel(e))}</b>${e.location?' <span>・ '+escapeHtml(e.location)+'</span>':''}</p><span class='badge'><i class='inline-category-dot' style='background:${categoryColor(e.category)}'></i>${escapeHtml(e.category)}</span></div></article>`}).join(''):`<div class='empty-state'><strong>予定はありません</strong><p>右上のボタンから予定を登録できます。</p></div>`}</div>`}
function listView(){const ev=state.schedule.events||[];return `<div class='schedule-list'><div class='schedule-list-head'><span>日付</span><span>時間</span><span>予定</span><span>担当・参加者</span><span>分類</span></div>${ev.length?ev.map(e=>`<button class='schedule-list-row' onclick="openScheduleEditor('${e.id}')"><span><strong>${fmtDate(e.date)}</strong></span><span>${e.allDay?'終日':escapeHtml(e.start||'--:--')+(e.end?' - '+escapeHtml(e.end):'')}</span><span><strong>${escapeHtml(e.title)}</strong>${e.location?`<small>${escapeHtml(e.location)}</small>`:''}</span><span class='list-owner'>${eventPersonAvatar(e)}<b>${escapeHtml(eventPeopleLabel(e))}</b></span><span><i style='background:${categoryColor(e.category)}'></i>${escapeHtml(e.category)}</span></button>`).join(''):`<div class='empty-state'>該当する予定はありません。</div>`}</div>`}
function schedulePage(){const s=state.schedule;let body=(s.loading&&!cacheHas('schedule',scheduleCacheKey()))?`<div class='loading-card'></div>`:s.view==='month'?monthView():s.view==='week'?weekView():s.view==='day'?dayView():listView();return `${pageHead('予定表','社員名を予定カードに直接表示し、色と名前の両方で誰の予定か判別できます。')} ${scheduleToolbar()} ${schedulePeopleLegend()} <div class='schedule-surface'>${body}</div><div class='calendar-legend'><span><i class='legend-dot holiday'></i>会社休日・祝日</span><span><i class='legend-dot work'></i>調整出勤日</span><span><i class='legend-dot category'></i>右端の点は予定カテゴリ</span></div>`}
function openDay(date){state.schedule.date=date;state.schedule.view='day';loadSchedule()}
function openConfirmDialog(title,message,confirmLabel,onConfirm,danger){
  state.confirmAction=onConfirm;
  const r=ensureModal();
  r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card small' role='dialog' aria-modal='true'>
    <div class='modal-head'><div><small>確認</small><h2>${escapeHtml(title)}</h2></div><button class='icon-button' onclick='closeModal()'>×</button></div>
    <p class='confirm-message'>${escapeHtml(message)}</p>
    <div class='modal-actions'><span></span><div><button class='secondary-button' onclick='closeModal()'>キャンセル</button><button class='${danger?'danger-button':'primary-button'}' onclick='runConfirmAction()'>${escapeHtml(confirmLabel||'実行')}</button></div></div>
  </section>`;
}
function runConfirmAction(){
  const fn=state.confirmAction;state.confirmAction=null;closeModal();if(typeof fn==='function')fn();
}
function openReasonDialog(title,message,submitLabel,onSubmit){
  state.reasonAction=onSubmit;
  const r=ensureModal();
  r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card small' role='dialog' aria-modal='true'>
    <div class='modal-head'><div><small>理由入力</small><h2>${escapeHtml(title)}</h2></div><button class='icon-button' onclick='closeModal()'>×</button></div>
    <p class='muted'>${escapeHtml(message||'')}</p>
    <label class='field full'><span>理由</span><textarea id='reasonDialogText' rows='4' maxlength='500' placeholder='理由を入力してください'></textarea></label>
    <div class='modal-actions'><span></span><div><button class='secondary-button' onclick='closeModal()'>キャンセル</button><button class='primary-button' onclick='runReasonAction()'>${escapeHtml(submitLabel||'送信')}</button></div></div>
  </section>`;
  setTimeout(()=>{const el=document.getElementById('reasonDialogText');if(el)el.focus()},0);
}
function runReasonAction(){
  const input=document.getElementById('reasonDialogText');
  const value=input?input.value.trim():'';
  if(!value){showToast('理由を入力してください');return}
  const fn=state.reasonAction;state.reasonAction=null;closeModal();if(typeof fn==='function')fn(value);
}

function ensureModal(){let r=document.getElementById('modalRoot');if(!r){r=document.createElement('div');r.id='modalRoot';document.body.appendChild(r)}return r}
function closeModal(){const r=document.getElementById('modalRoot');if(r)r.innerHTML=''}
function openScheduleEditor(id='',date=''){
  const e=id?(state.schedule.events||[]).find(x=>x.id===id):null;
  const employees=state.schedule.employees.length?state.schedule.employees:(state.data.employees||[]);
  const d=date||(e&&e.date)||state.schedule.date||state.data.today;
  const r=ensureModal();

  if(e&&e.canEdit===false){
    r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card small' role='dialog' aria-modal='true'>
      <div class='modal-head'><div><small>予定 / 閲覧専用</small><h2>${fmtDate(d)}</h2></div><button class='icon-button' onclick='closeModal()'>×</button></div>
      <div class='readonly-calendar-detail'>
        <div><span>予定名</span><strong>${escapeHtml(e.title)}</strong></div>
        <div><span>時間</span><strong>${e.allDay?'終日':escapeHtml(e.start||'--:--')+(e.end?' - '+escapeHtml(e.end):'')}</strong></div>
        <div><span>参加者</span><strong>${escapeHtml((e.employeeNames||[]).join('、')||'—')}</strong></div>
        <div><span>分類</span><strong>${escapeHtml(e.category||'予定')}</strong></div>
        <div><span>場所</span><strong>${escapeHtml(e.location||'—')}</strong></div>
        <div><span>公開範囲</span><strong>${escapeHtml(e.visibility||'社内')}</strong></div>
      </div>
      ${e.detail?`<div class='section-gap'><small class='muted'>詳細・メモ</small><p class='readonly-note'>${escapeHtml(e.detail)}</p></div>`:''}
      <div class='modal-actions'><span class='muted'>この予定の編集権限はありません。</span><div><button class='primary-button' onclick='closeModal()'>閉じる</button></div></div>
    </section>`;
    return;
  }

  const checked=e?e.employeeIds:[state.data.user.employeeId];
  r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card' role='dialog' aria-modal='true'>
    <div class='modal-head'><div><small>${e?'予定を編集':'新しい予定'}</small><h2>${fmtDate(d)}</h2></div><button class='icon-button' onclick='closeModal()'>×</button></div>
    <div class='form-grid'>
      <label class='field full'><span>予定名</span><input id='schTitle' value='${escapeHtml(e?e.title:'')}' placeholder='例：お客様訪問'></label>
      <label class='field'><span>日付</span><input id='schDate' type='date' value='${d}'></label>
      <label class='field check-field'><input id='schAllDay' type='checkbox' ${!e||e.allDay?'checked':''} onchange='toggleScheduleTimes()'><span>終日</span></label>
      <label class='field time-field'><span>開始</span><input id='schStart' type='time' value='${escapeHtml(e?e.start:'09:00')}'></label>
      <label class='field time-field'><span>終了</span><input id='schEnd' type='time' value='${escapeHtml(e?e.end:'10:00')}'></label>
      <label class='field'><span>分類</span><select id='schCategory'>${Object.keys(CATEGORY_COLORS).map(cat=>`<option value='${cat}' ${(e?e.category:'予定')===cat?'selected':''}>${cat}</option>`).join('')}</select></label>
      <label class='field'><span>場所</span><input id='schLocation' value='${escapeHtml(e?e.location:'')}' placeholder='訪問先 / Zoom 等'></label>

      </div>
      <div id='requestPreview' class='request-preview ${isPaid?'':'is-hidden'}'></div>
      <div id='correctionFields' class='request-correction ${type==='打刻修正'?'':'is-hidden'}'>
        <div class='request-block-title'><strong>修正する打刻</strong><span>元の打刻を選ぶか、不足打刻として追加します。</span></div>
        <div class='form-grid'>
          <label class='field full'><span>元の打刻</span><select id='reqOriginalPunch'><option value=''>不足打刻として追加</option></select></label>
          <label id='reqActionField' class='field'><span>打刻種別 <em>必須</em></span><select id='reqAction'><option>出勤</option><option>休憩開始</option><option>休憩終了</option><option>退勤</option></select></label>
          <label id='reqTimeField' class='field'><span>修正後時刻 <em>必須</em></span><input id='reqTime' type='time'></label>
          <label class='field'><span>勤務場所</span><select id='reqLocation'><option>出社</option><option>在宅</option><option>外出</option></select></label>
        </div>
      </div>
      <label id='reqReasonField' class='field full request-reason-field'><span>申請理由 <em>必須</em></span><div class='request-reason-chips'>${reasonChips}</div><textarea id='reqReason' rows='2' maxlength='600' placeholder='例：私用のため'></textarea></label>
      <label class='field full'><span>補足 <i>任意</i></span><textarea id='reqContent' rows='2' maxlength='1500' placeholder='承認者に伝えたいことがあれば入力'></textarea></label>
    </div>
    <div class='modal-actions request-modal-actions'><span class='request-submit-hint'>入力内容は申請後も履歴で確認できます。</span><div><button class='secondary-button' onclick='closeModal()'>キャンセル</button><button id='requestSubmitButton' class='primary-button' onclick='submitRequestFromModal()'>${escapeHtml(meta.label)}を申請</button></div></div>
  </section>`;
  if(type==='打刻修正')loadCorrectionPunchOptions();
  if(isPaid)refreshRequestPreview();
}
function changeRequestSubtype(type){
  const currentReason=document.getElementById('reqReason')?document.getElementById('reqReason').value:'';
  const currentDate=document.getElementById('reqStart')?document.getElementById('reqStart').value:state.data.today;
  openRequestModal(type);
  const reason=document.getElementById('reqReason'),start=document.getElementById('reqStart'),end=document.getElementById('reqEnd');
  if(reason)reason.value=currentReason;if(start)start.value=currentDate;if(end)end.value=currentDate;
  refreshRequestPreview();
}
function setRequestReason(value){const el=document.getElementById('reqReason');if(!el)return;el.value=value==='その他'?'':value+(value.endsWith('ため')?'':'のため');el.focus()}
function syncRequestDates(){
  const type=document.getElementById('reqType')?document.getElementById('reqType').value:'';
  const start=document.getElementById('reqStart'),end=document.getElementById('reqEnd');
  const single=['午前半休','午後半休','1/4日有給','打刻修正'].includes(type);
  if(start&&end&&single)end.value=start.value;
  if(type==='打刻修正')loadCorrectionPunchOptions();
  refreshRequestPreview();
}
function requestPayloadFromForm(){
  const type=document.getElementById('reqType').value;
  const start=document.getElementById('reqStart').value;
  const end=document.getElementById('reqEnd').value||start;
  const payload={type,startDate:start,endDate:end,reason:document.getElementById('reqReason').value,content:document.getElementById('reqContent').value};
  if(type==='打刻修正')payload.correction={originalPunchId:document.getElementById('reqOriginalPunch').value,action:document.getElementById('reqAction').value,time:document.getElementById('reqTime').value,workLocation:document.getElementById('reqLocation').value};
  return payload;
}
function clearRequestFieldErrors(){document.querySelectorAll('.request-modal-card .field-error').forEach(x=>x.classList.remove('field-error'))}
function showRequestError(message,fieldId){
  clearRequestFieldErrors();
  const box=document.getElementById('requestFormError');
  if(box){box.innerHTML=`<strong>申請できません</strong><span>${escapeHtml(message)}</span>`;box.classList.add('show')}
  const field=fieldId?document.getElementById(fieldId):null;
  if(field){field.classList.add('field-error');const input=field.querySelector('input,select,textarea');if(input)input.focus()}
  const card=document.querySelector('.request-modal-card');if(card)card.scrollTo({top:0,behavior:'smooth'});
}
function hideRequestError(){const box=document.getElementById('requestFormError');if(box)box.classList.remove('show');clearRequestFieldErrors()}
function validateRequestForm(payload){
  if(!payload.startDate)return ['対象日を選択してください。','reqStartField'];
  if(payload.endDate&&payload.startDate>payload.endDate)return ['終了日は開始日以降にしてください。','reqEndField'];
  if(!String(payload.reason||'').trim())return ['申請理由を入力してください。','reqReasonField'];
  if(['有給','午前半休','午後半休','1/4日有給'].includes(payload.type)){
    const x=state.requests.context||{};
    if(!x.leaveBalanceConfigured)return ['有給残日数が未設定です。管理者に社員情報の有給残日数を設定してもらってください。',''];
  }
  if(payload.type==='打刻修正'&&!payload.correction.time)return ['修正後の時刻を入力してください。','reqTimeField'];
  return null;
}
function refreshRequestPreview(){
  const typeEl=document.getElementById('reqType'),box=document.getElementById('requestPreview');
  if(!typeEl||!box)return;
  const type=typeEl.value;
  if(!['有給','午前半休','午後半休','1/4日有給'].includes(type)){box.classList.add('is-hidden');return}
  const payload=requestPayloadFromForm();
  if(!payload.startDate||!payload.endDate)return;
  box.classList.remove('is-hidden');
  box.innerHTML="<span class='preview-loading'>有給日数を確認しています…</span>";
  const seq=++requestPreviewSequence;
  google.script.run.withSuccessHandler(data=>{
    if(seq!==requestPreviewSequence||!document.getElementById('requestPreview'))return;
    if(!data.leaveBalanceConfigured){
      box.innerHTML="<div class='preview-warning'><strong>有給残日数が未設定です</strong><span>管理者が社員情報から設定すると、有給を申請できます。</span></div>";
      return;
    }
    const projected=data.projectedBalance;
    const bad=projected<0;
    box.innerHTML=`<div class='preview-item'><span>今回の消化</span><strong>${formatLeaveDays(data.requestedDays)}</strong></div><div class='preview-arrow'>→</div><div class='preview-item'><span>申請後の残数</span><strong class='${bad?'danger':''}'>${formatLeaveDays(projected)}</strong></div>${bad?"<div class='preview-warning full'><strong>残日数が不足しています</strong><span>日付または申請区分を変更してください。</span></div>":''}`;
  }).withFailureHandler(err=>{
    if(seq!==requestPreviewSequence||!document.getElementById('requestPreview'))return;
    box.innerHTML=`<div class='preview-warning'><strong>日数を確認できません</strong><span>${escapeHtml(cleanApiErrorMessage(err,'会社カレンダーを確認してください。'))}</span></div>`;
  }).previewRequest(state.sessionToken,payload);
}
function loadCorrectionPunchOptions(){
  const date=document.getElementById('reqStart').value;if(!date)return;
  const select=document.getElementById('reqOriginalPunch');if(select)select.innerHTML='<option value="">読み込み中…</option>';
  google.script.run.withSuccessHandler(function(items){
    const el=document.getElementById('reqOriginalPunch');if(!el)return;
    el.innerHTML='<option value="">不足打刻として追加</option>'+items.map(x=>'<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.timestamp.slice(11,16)+' '+x.action+' / '+x.workLocation)+'</option>').join('');
  }).withFailureHandler(function(err){showRequestError(cleanApiErrorMessage(err,'打刻履歴を読み込めませんでした。'),'');}).getPunchesForDate(state.sessionToken,date);
}
function submitRequestFromModal(){
  hideRequestError();
  const payload=requestPayloadFromForm(),invalid=validateRequestForm(payload);
  if(invalid){showRequestError(invalid[0],invalid[1]);return}
  const button=document.getElementById('requestSubmitButton');
  if(button){button.disabled=true;button.dataset.label=button.textContent;button.textContent='申請中…'}
  google.script.run.withSuccessHandler(function(){
    closeModal();showToast('申請を登録しました');
    invalidatePageCache('requests','monthly');loadRequests({force:true});
  }).withFailureHandler(function(err){
    if(button){button.disabled=false;button.textContent=button.dataset.label||'申請する'}
    const msg=cleanApiErrorMessage(err,'申請を登録できませんでした。');
    const field=msg.includes('理由')?'reqReasonField':msg.includes('日')?'reqStartField':'';
    showRequestError(msg,field);
  }).submitRequest(state.sessionToken,payload);
}
function requestApprovedCancel(id){openReasonDialog('承認済み申請の取消を依頼','取消理由を入力してください。承認者の確認後に取消されます。','取消を依頼',function(reason){google.script.run.withSuccessHandler(function(){showToast('取消を依頼しました');invalidatePageCache('requests','monthly');loadRequests({force:true});loadNotifications();}).withFailureHandler(function(err){handleApiError(err,'取消依頼できませんでした');}).requestApprovedCancellation(state.sessionToken,id,reason);});}
function approveCancellationRequest(id){openConfirmDialog('取消を承認','承認済み申請を取り消しますか？ 有給の場合は残日数を戻します。','取消を承認',function(){google.script.run.withSuccessHandler(function(){showToast('取消を承認しました');invalidatePageCache('requests','monthly','homeOverview');loadRequests({force:true});loadHomeOverview({force:true,silent:true});}).withFailureHandler(function(err){handleApiError(err,'取消承認できませんでした');}).decideApprovedCancellation(state.sessionToken,id,'APPROVE','');},true);}
function rejectCancellationRequest(id){openReasonDialog('取消を却下','申請者に表示する理由を入力してください。','取消を却下',function(reason){google.script.run.withSuccessHandler(function(){showToast('取消を却下しました');invalidatePageCache('requests');loadRequests({force:true});}).withFailureHandler(function(err){handleApiError(err,'取消却下できませんでした');}).decideApprovedCancellation(state.sessionToken,id,'REJECT',reason);});}
function cancelOwnRequest(id){openConfirmDialog('申請を取り消す','承認待ちの申請を取り消しますか？','取り消す',function(){google.script.run.withSuccessHandler(function(){showToast('申請を取り消しました');invalidatePageCache('requests','monthly');loadRequests({force:true});}).withFailureHandler(function(err){handleApiError(err,'申請を取り消せませんでした');}).cancelRequest(state.sessionToken,id);},true);}
function approveTeamRequest(id){openConfirmDialog('申請を承認','この申請を承認しますか？','承認する',function(){google.script.run.withSuccessHandler(function(){showToast('申請を承認しました');invalidatePageCache('requests','monthly');loadRequests({force:true});loadNotifications();}).withFailureHandler(function(err){handleApiError(err,'承認できませんでした');}).approveRequest(state.sessionToken,id,'APPROVE','');},false);}
function rejectTeamRequest(id){openReasonDialog('申請を差し戻す','申請者に表示する差戻し理由を入力してください。','差し戻す',function(comment){google.script.run.withSuccessHandler(function(){showToast('申請を差し戻しました');invalidatePageCache('requests','monthly');loadRequests({force:true});loadNotifications();}).withFailureHandler(function(err){handleApiError(err,'差戻しできませんでした');}).approveRequest(state.sessionToken,id,'REJECT',comment);});}


</script>
