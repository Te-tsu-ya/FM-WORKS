<script>
function authStateBadge(emp){
  if(emp.lockedUntil) return "<span class='auth-state locked'>ロック中</span>";
  if(!emp.pinConfigured) return "<span class='auth-state pending'>PIN未設定</span>";
  if(emp.mustChangePin) return "<span class='auth-state pending'>初回変更待ち</span>";
  return "<span class='auth-state'>利用可能</span>";
}

function settingsTabs(){
  const tabs=[['auth','認証・サポート'],['projects','プロジェクト'],['operation','運用設定'],['requirements','要件定義書'],['technical','技術設計書']];
  return `<div class='settings-tabs'>${tabs.map(([id,label])=>`<button class='${state.adminTab===id?'active':''}' onclick="setAdminTab('${id}')">${escapeHtml(label)}</button>`).join('')}</div>`;
}
function setAdminTab(tab){
  state.adminTab=tab;renderNav();renderPage(true);
  if(['auth','projects'].includes(tab))loadAuthAdmin();
  if(tab==='operation'){loadAuthAdmin();loadMaintenance();}
  if(tab==='requirements')loadSystemDocument('requirements');
  if(tab==='technical')loadSystemDocument('technical');
}
function authSettingsSection(){
  if(!state.authAdmin)return "<div class='loading-card'></div>";
  const a=state.authAdmin,configured=a.employees.filter(e=>e.pinConfigured).length,locked=a.employees.filter(e=>e.lockedUntil).length,pending=(a.resetRequests||[]).filter(r=>r.status==='未対応').length;
  const employeeRows=a.employees.map(e=>`<tr><td><strong>${escapeHtml(e.name)}</strong><br><small class='muted'>${escapeHtml(e.employeeId)}</small></td><td>${escapeHtml(roleLabel(e.role))}</td><td>${authStateBadge(e)}</td><td>${escapeHtml(e.lastLogin||'—')}</td><td><div class='admin-actions'><button class='small-button' onclick="openTempPinModal('${e.employeeId}')">仮PIN発行</button>${e.lockedUntil?`<button class='small-button' onclick="unlockAccount('${e.employeeId}')">ロック解除</button>`:''}</div></td></tr>`).join('');
  const requestRows=(a.resetRequests||[]).slice(0,12).map(r=>`<tr><td>${escapeHtml(r.requestedAt)}</td><td><strong>${escapeHtml(r.name)}</strong><br><small class='muted'>${escapeHtml(r.employeeId)}</small></td><td>${r.status==='未対応'?'<span class="badge warning">未対応</span>':'<span class="badge success">対応済</span>'}</td><td>${escapeHtml(r.note||'—')}</td><td>${r.status==='未対応'?`<button class='small-button' onclick="openTempPinModal('${r.employeeId}')">仮PIN発行</button>`:'—'}</td></tr>`).join('');
  const s=a.support||{};
  return `<div class='security-summary compact-security'><div class='security-item'><strong>${configured} / ${a.employees.length}</strong><small>PIN設定済み</small></div><div class='security-item'><strong>${locked}</strong><small>ロック中</small></div><div class='security-item'><strong>${pending}</strong><small>再発行依頼</small></div></div>
  <div class='settings-panel-grid'><section class='card settings-panel'><h3>認証設定</h3><div class='table-wrap panel-scroll'><table class='auth-table'><thead><tr><th>社員</th><th>権限</th><th>認証状態</th><th>最終ログイン</th><th>操作</th></tr></thead><tbody>${employeeRows}</tbody></table></div></section>
  <section class='card settings-panel'><h3>PINを忘れた場合の連絡先</h3><div class='form-grid'><label class='field full'><span>表示名</span><input id='supportName' value='${escapeHtml(s.name||'FM WORKS管理者')}'></label><label class='field'><span>メール</span><input id='supportEmail' type='email' value='${escapeHtml(s.email||'')}'></label><label class='field'><span>電話番号</span><input id='supportPhone' value='${escapeHtml(s.phone||'')}'></label><label class='field full'><span>案内文</span><textarea id='supportNote' rows='3'>${escapeHtml(s.note||'')}</textarea></label></div><div class='section-gap'><button class='primary-button compact' onclick='saveSupportSettingsFromAdmin()'>連絡先を保存</button></div><h3 class='subhead'>PIN再発行依頼</h3><div class='table-wrap panel-scroll small'><table class='auth-table'><tbody>${requestRows||"<tr><td class='muted'>再発行依頼はありません。</td></tr>"}</tbody></table></div></section></div>`;
}
function projectAdminSection(){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return '';
  const projects=(state.authAdmin&&state.authAdmin.projects)||[];
  const rows=projects.map(p=>{
    const badge=p.status==='進行中'?'<span class="badge success">進行中</span>':p.status==='完了'?'<span class="badge">完了</span>':'<span class="badge warning">停止</span>';
    return '<tr><td><strong>'+escapeHtml(p.name)+'</strong><br><small class="muted">'+escapeHtml(p.projectId)+'</small></td><td>'+escapeHtml(p.client||'—')+'</td><td>'+badge+'</td><td>'+escapeHtml(p.startDate||'—')+'</td><td>'+escapeHtml(p.endDate||'—')+'</td><td><button class="small-button" onclick="openProjectModal(\''+p.projectId+'\')">編集</button></td></tr>';
  }).join('');
  return '<div class="section-gap">'+card('プロジェクト管理','<div class="card-toolbar"><p class="muted">工数入力で利用するプロジェクトを管理します。停止・完了した案件は新規工数の選択肢から外れます。</p><button class="primary-button" onclick="openProjectModal()">＋ プロジェクト追加</button></div>'+(rows?'<div class="table-wrap panel-scroll"><table class="auth-table"><thead><tr><th>プロジェクト</th><th>顧客</th><th>状態</th><th>開始</th><th>終了</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="muted">プロジェクトが登録されていません。</p>'))+'</div>';
}
function openProjectModal(projectId){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole)){showToast('管理者権限が必要です');return;}
  const p=projectId&&state.authAdmin?(state.authAdmin.projects||[]).find(x=>x.projectId===projectId):null;
  const r=ensureModal();
  r.innerHTML='<div class="modal-backdrop" onclick="closeModal()"></div><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle"><div class="modal-head"><div><small>プロジェクトマスタ</small><h2 id="projectModalTitle">'+(p?'プロジェクトを編集':'プロジェクトを追加')+'</h2></div><button class="icon-button" onclick="closeModal()" aria-label="閉じる">×</button></div><div class="form-grid"><label class="field full"><span>プロジェクト名</span><input id="prjName" maxlength="120" value="'+escapeHtml(p?p.name:'')+'" placeholder="例：Project Atlas"></label><label class="field"><span>顧客表示名</span><input id="prjClient" maxlength="100" value="'+escapeHtml(p?p.client:'')+'" placeholder="例：顧客A"></label><label class="field"><span>ステータス</span><select id="prjStatus"><option '+(!p||p.status==='進行中'?'selected':'')+'>進行中</option><option '+(p&&p.status==='停止'?'selected':'')+'>停止</option><option '+(p&&p.status==='完了'?'selected':'')+'>完了</option></select></label><label class="field"><span>開始日</span><input id="prjStart" type="date" value="'+escapeHtml(p?p.startDate:'')+'"></label><label class="field"><span>終了日</span><input id="prjEnd" type="date" value="'+escapeHtml(p?p.endDate:'')+'"></label><label class="field full"><span>備考</span><textarea id="prjNote" maxlength="500" rows="3">'+escapeHtml(p?p.note:'')+'</textarea></label></div><div class="modal-actions"><span></span><div><button class="secondary-button" onclick="closeModal()">キャンセル</button><button class="primary-button" onclick="saveProjectFromModal(\''+(p?p.projectId:'')+'\')">保存</button></div></div></section>';
}
function saveProjectFromModal(projectId){
  const payload={projectId:projectId||'',name:document.getElementById('prjName').value,client:document.getElementById('prjClient').value,status:document.getElementById('prjStatus').value,startDate:document.getElementById('prjStart').value,endDate:document.getElementById('prjEnd').value,note:document.getElementById('prjNote').value};
  google.script.run.withSuccessHandler(()=>{
    closeModal();showToast('プロジェクトを保存しました');invalidatePageCache('worklog','authAdmin');
    refreshAppData(()=>loadAuthAdmin({force:true}));
  }).withFailureHandler(err=>handleApiError(err,'プロジェクトを保存できませんでした')).saveProject(state.sessionToken,payload);
}

function inlineMarkdown(text){
  let s=escapeHtml(text);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  return s;
}
function renderMarkdownDoc(markdown){
  const lines=String(markdown||'').replace(/\r/g,'').split('\n');
  let out='',i=0,inCode=false,code=[],list=null;
  const closeList=()=>{if(list){out+=`</${list}>`;list=null}};
  while(i<lines.length){
    const line=lines[i];
    if(line.startsWith('```')){
      closeList();
      if(!inCode){inCode=true;code=[];}else{out+=`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;inCode=false;}
      i++;continue;
    }
    if(inCode){code.push(line);i++;continue}
    if(/^\|.+\|$/.test(line)&&i+1<lines.length&&/^\|\s*:?-+/.test(lines[i+1])){
      closeList();
      const rows=[];rows.push(line);i+=2;
      while(i<lines.length&&/^\|.+\|$/.test(lines[i])){rows.push(lines[i]);i++}
      const cells=r=>r.slice(1,-1).split('|').map(x=>inlineMarkdown(x.trim()));
      out+='<div class="doc-table-wrap"><table><thead><tr>'+cells(rows[0]).map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue;
    }
    const h=line.match(/^(#{1,4})\s+(.+)$/);
    if(h){closeList();out+=`<h${h[1].length}>${inlineMarkdown(h[2])}</h${h[1].length}>`;i++;continue}
    const ul=line.match(/^[-*]\s+(.+)$/),ol=line.match(/^\d+\.\s+(.+)$/);
    if(ul||ol){const t=ul?'ul':'ol';if(list!==t){closeList();list=t;out+=`<${t}>`};out+=`<li>${inlineMarkdown((ul||ol)[1])}</li>`;i++;continue}
    if(!line.trim()){closeList();out+='<div class="doc-spacer"></div>';i++;continue}
    closeList();out+=`<p>${inlineMarkdown(line)}</p>`;i++;
  }
  closeList();if(inCode)out+=`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;return out;
}
function loadSystemDocument(type,options={}){
  if(!['requirements','technical'].includes(type))return;
  if(state.documents[type]&&!options.force){renderPageIfActive('admin');return}
  if(state.documents.loading===type)return;
  state.documents.loading=type;renderPageIfActive('admin');
  google.script.run.withSuccessHandler(doc=>{
    state.documents[type]=doc;state.documents.loading=null;markPageCache('documents',type);renderPageIfActive('admin');
  }).withFailureHandler(err=>{
    state.documents.loading=null;handleApiError(err,'文書を読み込めませんでした');renderPageIfActive('admin');
  }).getSystemDocument(state.sessionToken,type);
}
function documentPane(type){
  const doc=state.documents[type];
  if(!doc)return `<div class='document-loading'><div class='loading-card'></div><p>文書を読み込んでいます…</p></div>`;
  return `<section class='document-shell'><header><div><span class='badge'>${escapeHtml(doc.version||state.data.app.version)}</span><strong>${escapeHtml(doc.title)}</strong><small>最終更新 ${escapeHtml(doc.updatedAt||'—')}</small></div><button class='secondary-button compact' onclick="loadSystemDocument('${type}',{force:true})">再読込</button></header><article class='document-reader'>${renderMarkdownDoc(doc.markdown)}</article></section>`;
}
function adminPage(){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return pageHead('設定','この画面を表示する権限がありません。');
  let content='';
  if(state.adminTab==='auth')content=authSettingsSection();
  else if(state.adminTab==='projects')content=projectAdminSection();
  else if(state.adminTab==='operation')content=maintenanceSection();
  else if(state.adminTab==='requirements')content=documentPane('requirements');
  else if(state.adminTab==='technical')content=documentPane('technical');
  else content=authSettingsSection();
  return `<div class='single-screen-layout settings-screen'>${pageHead('設定','運用設定と設計文書を管理者だけが確認できます。')}${settingsTabs()}<div class='settings-content'>${content}</div></div>`;
}

function saveLaborRulesFromAdmin(){
  const profile=document.getElementById('laborProfile').value,weekStartDay=document.getElementById('laborWeekStart').value,agreementStartMonth=document.getElementById('laborAgreementStart').value,specialClause=document.getElementById('laborSpecialClause').value,note=document.getElementById('laborRuleNote').value;
  openConfirmDialog('労務ルールを保存','就業規則・36協定の起算月・特別条項を確認した内容として保存します。','保存',()=>google.script.run.withSuccessHandler(()=>{showToast('労務ルールを保存しました');loadMaintenance();}).withFailureHandler(err=>handleApiError(err,'保存できませんでした')).saveLaborRuleConfig(state.sessionToken,{profile,weekStartDay,agreementStartMonth,specialClause,note}),true);
}
function migrateDatabaseFromAdmin(){
  openConfirmDialog('DBスキーマを更新','現在のDBをバックアップしてから、欠けているシート・列見出しを現在のスキーマへ更新します。既存の非空欄見出しが想定と異なる場合は停止します。','バックアップして更新',()=>{
    google.script.run.withSuccessHandler(r=>{showToast(r&&r.changed?'DBスキーマを更新しました':'DBスキーマは最新です');loadMaintenance();}).withFailureHandler(err=>handleApiError(err,'DBスキーマを更新できませんでした')).migrateDatabaseToCurrent(state.sessionToken);
  },true);
}
function maintenanceSection(){
  const m=state.maintenance||{},s=m.status;
  if(m.loading&&!s)return `<div class='section-gap'>${card('システム保守',"<div class='loading-card'></div>")}</div>`;
  if(!s)return `<div class='section-gap'>${card('システム保守',"<p class='muted'>システム情報を読み込んでいます。</p>")}</div>`;

  const auditRows=(m.audit||[]).slice(0,40).map(x=>`<tr>
    <td>${escapeHtml(x.at)}</td>
    <td><strong>${escapeHtml(x.employeeName||x.employeeId||'SYSTEM')}</strong><br><small class='muted'>${escapeHtml(x.employeeId||'')}</small></td>
    <td>${escapeHtml(x.operation)}</td>
    <td>${escapeHtml(x.target)}${x.targetId?`<br><small class='muted'>${escapeHtml(x.targetId)}</small>`:''}</td>
    <td>${x.result==='SUCCESS'?'<span class="badge success">成功</span>':'<span class="badge danger">エラー</span>'}</td>
  </tr>`).join('');

  const backupText=s.lastBackupAt||'まだありません';
  const labor=s.laborConfig||{profile:'UNCONFIGURED',weekStartDay:'',agreementStartMonth:0,specialClause:'UNCONFIGURED',configured:false,note:''};
  const schema=s.schemaStatus||{version:0,expectedVersion:0,ready:false,issues:[]};
  const schemaIssuesHtml=schema.ready?'':`<p class='muted'>${escapeHtml((schema.issues||[]).slice(0,3).join(' / '))}</p>`;
  const readiness=s.readiness||{ready:false,blockers:[],warnings:[],prototypeMode:true};
  const blockers=(readiness.blockers||[]);
  const warnings=(readiness.warnings||[]);
  const remainingBlockers=blockers.filter(x=>!String(x).includes('試作版共通PIN')&&!String(x).includes('実行環境が'));
  const readinessRows=[
    ...blockers.map(x=>`<div class='readiness-row blocker'><span>要対応</span><strong>${escapeHtml(x)}</strong></div>`),
    ...warnings.map(x=>`<div class='readiness-row warning'><span>確認</span><strong>${escapeHtml(x)}</strong></div>`)
  ].join('');
  const prototypeAction=readiness.prototypeMode
    ? `<button class='primary-button' ${remainingBlockers.length?'disabled':''} onclick='switchToProductionMode()'>試作モードを終了</button>`
    : '';
  return `<div class='section-gap'>
    ${card('本番運用チェック',`<div class='readiness-head'><div><span class='badge ${readiness.ready?'success':blockers.length?'danger':'warning'}'>${readiness.ready?'READY':blockers.length?'要対応':'確認あり'}</span><strong>${readiness.ready?'本番運用の内部条件を満たしています':'公開前に確認が必要です'}</strong></div><small>ここではアプリ内部の準備状態を確認します。公開範囲の変更は別工程です。</small></div>${readinessRows||"<div class='readiness-row ok'><span>OK</span><strong>重大な未対応項目はありません。</strong></div>"}<div class='button-row section-gap'>${prototypeAction}<button class='secondary-button' onclick="navigate('companyCalendar')">会社カレンダーを確認</button></div>`)}
    <div class='grid cols-4'>
      ${metric('DBレコード',Object.values(s.sheets||{}).reduce((a,b)=>a+Number(b||0),0)+'件','tone-green')}
      ${metric('有効セッション',s.activeSessions+'件')}
      ${metric('PIN未設定',s.pinPending+'名',s.pinPending?'tone-orange':'tone-green')}
      ${metric('最終バックアップ',backupText?s.lastBackupAt?'実施済み':'未実施':'未実施',s.lastBackupAt?'tone-green':'tone-orange')}
    </div>
    <div class='grid cols-2 section-gap'>
      ${card('労務ルール',`<div class='maintenance-detail'><div><span>状態</span><strong>${labor.configured?'設定済み':'未確定'}</strong></div><div><span>プロファイル</span><strong>${escapeHtml(labor.profile)}</strong></div></div><div class='form-grid section-gap'><label class='field'><span>プロファイル</span><select id='laborProfile'><option value='UNCONFIGURED' ${labor.profile!=='GENERAL_JP'?'selected':''}>未確定</option><option value='GENERAL_JP' ${labor.profile==='GENERAL_JP'?'selected':''}>日本・一般則（確認済み）</option></select></label><label class='field'><span>週開始曜日</span><select id='laborWeekStart'><option value=''>未設定</option>${[['SUNDAY','日曜'],['MONDAY','月曜'],['TUESDAY','火曜'],['WEDNESDAY','水曜'],['THURSDAY','木曜'],['FRIDAY','金曜'],['SATURDAY','土曜']].map(x=>`<option value='${x[0]}' ${labor.weekStartDay===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label class='field'><span>36協定の起算月</span><select id='laborAgreementStart'><option value=''>未設定</option>${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value='${m}' ${Number(labor.agreementStartMonth)===m?'selected':''}>${m}月</option>`).join('')}</select></label><label class='field'><span>特別条項</span><select id='laborSpecialClause'><option value='UNCONFIGURED' ${labor.specialClause==='UNCONFIGURED'?'selected':''}>未確認</option><option value='NONE' ${labor.specialClause==='NONE'?'selected':''}>なし</option><option value='ENABLED' ${labor.specialClause==='ENABLED'?'selected':''}>あり</option></select></label><label class='field full'><span>確認メモ</span><textarea id='laborRuleNote' rows='2'>${escapeHtml(labor.note||'')}</textarea></label></div><div class='button-row section-gap'><button class='primary-button' onclick='saveLaborRulesFromAdmin()'>保存</button><button class='secondary-button' onclick="navigate('companyCalendar')">法定休日を設定</button></div><p class='muted'>未確定のまま本番READY・月次締めには進めません。標準会社カレンダー生成では法定休日を自動指定しないため、就業規則に合わせて必ず明示設定してください。</p>`)}
      ${card('バックアップ',`<div class='maintenance-detail'>
        <div><span>最終バックアップ</span><strong>${escapeHtml(backupText)}</strong></div>
        <div><span>整合性確認</span><strong>${s.backupVerified?'検証済み':'未検証'}</strong></div>
        <div><span>自動バックアップ</span><strong>${s.backupEnabled?escapeHtml(s.backupMode||'時間トリガー')+' / 有効':'無効'}</strong></div>
        <div><span>時間トリガー</span><strong>${s.backupTriggerInstalled?'設定済み':'未設定'}</strong></div>
        <div><span>保持期間</span><strong>${s.backupRetentionDays}日</strong></div>
      </div><div class='button-row section-gap'><button class='primary-button' onclick='createBackupNow()'>今すぐバックアップ</button><button class='secondary-button' onclick='toggleDailyBackup()'>${s.backupEnabled?'自動バックアップを停止':'自動バックアップを有効化'}</button><button class='secondary-button' onclick='repairDailyBackupTrigger()'>時間トリガー再設定</button></div>`)}
      ${card('システム状態',`<div class='maintenance-detail'>
        <div><span>DBスキーマ</span><strong>v${schema.version||0} / expected v${schema.expectedVersion||0} ${schema.ready?'✓':'要更新'}</strong></div>
        <div><span>データベース</span><strong>${escapeHtml(s.dbName)}</strong></div>
        <div><span>アプリバージョン</span><strong>${escapeHtml(state.data.app.version)}</strong></div>
        <div><span>実行環境</span><strong>${escapeHtml(s.environment||'STAGING')}</strong></div>
        <div><span>最終確認</span><strong>${escapeHtml(s.checkedAt)}</strong></div>
      </div><div class='button-row section-gap'><button class='secondary-button' onclick='loadMaintenance()'>状態を再確認</button><button class='secondary-button' onclick='migrateDatabaseFromAdmin()'>DBスキーマ更新</button></div>${schemaIssuesHtml}`)}
    </div>
    <div class='section-gap'>${card('監査ログ（最新40件）',auditRows?`<div class='table-wrap'><table class='auth-table'><thead><tr><th>日時</th><th>操作者</th><th>操作</th><th>対象</th><th>結果</th></tr></thead><tbody>${auditRows}</tbody></table></div>`:"<p class='muted'>監査ログはありません。</p>")}</div>
  </div>`;
}

function switchToProductionMode(){
  const readiness=state.maintenance&&state.maintenance.status&&state.maintenance.status.readiness;
  const blockers=((readiness&&readiness.blockers)||[]).filter(x=>!String(x).includes('試作版共通PIN'));
  if(blockers.length){showToast('先に本番運用チェックの要対応項目を解消してください');return}
  openConfirmDialog('試作モードを終了しますか？','共通PIN 000000 は使えなくなり、現在のセッションも終了します。社員ごとのPIN設定が必要です。','試作モードを終了',()=>{
    google.script.run.withSuccessHandler(()=>{
      clearLocalSession();
      showLogin('試作モードを終了しました。社員ごとのPINでログインしてください。');
    }).withFailureHandler(err=>handleApiError(err,'試作モードを終了できませんでした')).setPrototypeMode(state.sessionToken,false);
  },true);
}

function loadMaintenance(options={}){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return;
  const key='current';
  if(!options.force&&cacheFresh('maintenance',key))return;
  const ticket=beginPageLoad('maintenance',key);if(!ticket)return;
  const hasCurrent=cacheHas('maintenance',key);
  state.maintenance.loading=!hasCurrent;
  if(!options.silent)renderPageIfActive('admin');
  let pending=2,failed=false;
  const done=()=>{pending--;if(pending<=0){endPageLoad(ticket);state.maintenance.loading=false;if(!failed)markPageCache('maintenance',key);renderPageIfActive('admin')}};
  google.script.run.withSuccessHandler(data=>{state.maintenance.status=data;done()}).withFailureHandler(err=>{failed=true;done();handleApiError(err,'システム状態を読み込めませんでした')}).getSystemStatus(state.sessionToken);
  google.script.run.withSuccessHandler(data=>{state.maintenance.audit=data||[];done()}).withFailureHandler(err=>{failed=true;done();handleApiError(err,'監査ログを読み込めませんでした')}).getAuditLogs(state.sessionToken,100);
}

function createBackupNow(){
  openConfirmDialog('バックアップを作成','現在のFM WORKS DBをGoogle Driveへ複製します。','バックアップ作成',function(){
    showToast('バックアップを作成しています...');
    google.script.run.withSuccessHandler(result=>{showToast('バックアップを作成しました');invalidatePageCache('maintenance');loadMaintenance({force:true})}).withFailureHandler(err=>handleApiError(err,'バックアップを作成できませんでした')).createManualBackup(state.sessionToken);
  },false);
}
function repairDailyBackupTrigger(){
  openConfirmDialog('時間トリガーを再設定','毎日03時台に自動バックアップする時間トリガーを1件だけ作り直します。','再設定',function(){
    google.script.run.withSuccessHandler(data=>{state.maintenance.status=data;renderPageIfActive('admin');showToast('バックアップ時間トリガーを設定しました')}).withFailureHandler(err=>handleApiError(err,'時間トリガーを設定できませんでした')).installDailyBackupTrigger(state.sessionToken);
  },false);
}

function toggleDailyBackup(){
  const current=!!(state.maintenance.status&&state.maintenance.status.backupEnabled);
  openConfirmDialog(current?'自動バックアップを停止':'自動バックアップを有効化',current?'自動バックアップと時間トリガーを停止しますか？':'毎日03時台にDBを自動バックアップし、90日間保持します。','変更する',function(){
    google.script.run.withSuccessHandler(data=>{state.maintenance.status=data;renderPage();showToast(current?'自動バックアップを停止しました':'自動バックアップを有効化しました')}).withFailureHandler(err=>handleApiError(err,'バックアップ設定を変更できませんでした')).setDailyBackupEnabled(state.sessionToken,!current);
  },false);
}

function loadAuthAdmin(options={}){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole)) return;
  const key='current';
  if(!options.force&&cacheFresh('authAdmin',key)){
    if(options.withMaintenance)loadMaintenance();
    return;
  }
  const ticket=beginPageLoad('authAdmin',key);if(!ticket)return;
  const hasCurrent=cacheHas('authAdmin',key)&&!!state.authAdmin;
  if(!hasCurrent&&!options.silent)renderPage();
  google.script.run
    .withSuccessHandler(data=>{
      endPageLoad(ticket);state.authAdmin=data;markPageCache('authAdmin',key);
      if(state.page==='admin'||state.page==='people')renderPage();
      if(options.withMaintenance||(state.page==='admin'&&state.adminTab==='operation'))loadMaintenance({silent:!!options.silent});
    })
    .withFailureHandler(err=>{endPageLoad(ticket);handleApiError(err,'管理情報を読み込めませんでした')})
    .getAuthAdminData(state.sessionToken);
}

function openTempPinModal(employeeId){
  const source=(state.authAdmin&&state.authAdmin.employees||[]).find(x=>x.employeeId===employeeId);
  const name=source?source.name:employeeId;
  const r=ensureModal();
  r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div>
  <section class='modal-card small' role='dialog' aria-modal='true'>
    <div class='modal-head'><div><small>管理者操作</small><h2>仮PINを発行</h2></div><button type='button' class='icon-button' onclick='closeModal()' aria-label='閉じる'>×</button></div>
    <p class='muted'>${escapeHtml(name)}（${escapeHtml(employeeId)}）に6桁の仮PINを設定します。本人は初回ログイン時に変更が必要です。</p>
    <div class='form-grid'>
      <label class='field full'><span>仮PIN</span><input id='tempPin' inputmode='numeric' maxlength='6' type='password' autocomplete='new-password'></label>
      <label class='field full'><span>仮PIN（確認）</span><input id='tempPinConfirm' inputmode='numeric' maxlength='6' type='password' autocomplete='new-password'></label>
    </div>
    <div class='modal-actions'><span></span><div><button class='secondary-button' onclick='closeModal()'>キャンセル</button><button class='primary-button' onclick="submitTempPin('${employeeId}')">発行</button></div></div>
  </section>`;
}

function submitTempPin(employeeId){
  const pin=document.getElementById('tempPin').value;
  const confirmPin=document.getElementById('tempPinConfirm').value;
  if(pin!==confirmPin){showToast('確認用PINが一致しません');return}
  google.script.run.withSuccessHandler(()=>{closeModal();showToast('仮PINを発行しました');invalidatePageCache('authAdmin');loadAuthAdmin({force:true})})
    .withFailureHandler(err=>handleApiError(err,'仮PINを発行できませんでした'))
    .adminSetTemporaryPin(state.sessionToken,employeeId,pin);
}

function unlockAccount(employeeId){
  openConfirmDialog('ログインロックを解除','このアカウントのログインロックを解除しますか？','解除する',function(){
  google.script.run.withSuccessHandler(()=>{showToast('ロックを解除しました');invalidatePageCache('authAdmin');loadAuthAdmin({force:true})})
    .withFailureHandler(err=>handleApiError(err,'ロック解除に失敗しました'))
    .adminUnlockAccount(state.sessionToken,employeeId);
  },false);
}

function saveSupportSettingsFromAdmin(){
  const payload={name:document.getElementById('supportName').value,email:document.getElementById('supportEmail').value,phone:document.getElementById('supportPhone').value,note:document.getElementById('supportNote').value};
  google.script.run.withSuccessHandler(support=>{state.authAdmin.support=support;state.publicConfig.support=support;renderPage();showToast('連絡先を保存しました')})
    .withFailureHandler(err=>handleApiError(err,'連絡先を保存できませんでした'))
    .saveAuthSupportSettings(state.sessionToken,payload);
}
