<script>
/* FM WORKS accounting UX: one portal, different workspaces for review, rows and finance.
 * All bulk drafts live in memory. No bank or legacy sheet writes occur here.
 */
let financeWorkspaceMode='overview';
const FINANCE_BULK_FIELDS=[
 ['usedOn','利用日'],['category','経費種別'],['vendor','取引先'],
 ['invoiceNo','適格請求書番号'],['item','品目'],['amount','金額（円）'],
 ['note','備考'],['payer','支払者'],['paymentMethod','支払方法'],
 ['paid','支払有無'],['receiptRef','証憑番号']
];
const FINANCE_BULK_ALIASES={
 usedOn:['利用日','使用日','支払日','日付','年月日'],
 category:['経費種別','経費区分','勘定科目','費目','カテゴリ','分類'],
 vendor:['取引先','支払先','店舗','購入先','仕入先'],
 invoiceNo:['適格請求書番号','インボイス番号','登録番号'],
 item:['品目','商品名','購入品','購入内容','明細','用途','内容'],
 amount:['利用金額','支払金額','金額','支出額','利用額','税込金額'],
 note:['備考','メモ','コメント','補足'],
 payer:['支払者','立替者','購入者','支払担当'],
 paymentMethod:['支払方法','決済方法','支払手段'],
 paid:['支払有無','支払状況','支払済'],
 receiptRef:['証憑整理番号','証憑番号','領収書番号','整理番号']
};
function financeBulkInitial_(){
 return {raw:'',source:null,headers:[],mapping:[],rows:[],keys:[],page:0,index:0,busy:false,
   locked:false,complete:false,error:'',notice:'',auditWarning:'',uncertain:false};
}
let financeBulkUi=financeBulkInitial_();
function financeWorkspaceReset_(){financeWorkspaceMode='overview';financeBulkUi=financeBulkInitial_();}
function financeWorkspacePermitted_(mode){
 if(!financeAccessAllowed())return false;
 if(['cashflow','reports','bankPaste'].includes(mode)&&!cashFlowAllowed_())return false;
 return true;
}
function financeWorkspaceActivate_(mode){
 if(mode==='bulk'){financeWorkspaceMode='bulk';financeUi.insightMode=false;renderPageIfActive('finance');return;}
 if(mode==='analysis'){financeWorkspaceMode='analysis';financeOpenInsights();return;}
 financeUi.insightMode=false;
 financeWorkspaceMode=mode;
 if(mode==='ledger')financeUi.tab='receipt';
 if(mode==='approvals'&&financeUi.tab==='receipt')financeUi.tab='expense';
 renderPageIfActive('finance');
 if(!financeUi.overview&&!financeUi.loading&&!financeUi.demo)loadFinanceOverview();
}
function financeWorkspaceGo_(mode){
 if(!financeWorkspacePermitted_(mode))return;
 if(financeUi.busy||financeBulkUi.busy){showToast('登録・承認処理が終わってから画面を切り替えてください。');return;}
 if(financeWorkspaceMode==='bulk'&&mode!=='bulk'){
  if(financeBulkUi.locked&&!financeBulkUi.complete){
   showToast('未確認の保存結果があります。同じ送信キーで再試行するか、登録履歴を確認してください。');return;
  }
  if(!financeBulkUi.complete&&(financeBulkUi.rows.some(financeGridHasRecord_)||String(financeBulkUi.raw||'').trim())){
   openConfirmDialog('未保存の経費入力','表に入力した内容はまだスプレッドシートに保存されていません。画面を離れると消えます。',
    '保存せず移動',()=>{financeBulkUi=financeBulkInitial_();financeWorkspaceGo_(mode);});
   return;
  }
  financeBulkUi=financeBulkInitial_();
 }
 if(['cashflow','reports','bankPaste'].includes(mode)){
   if(financeUi.demo){showToast('実データに戻ってから資金繰りを開いてください。');return;}
   financeWorkspaceMode=mode==='reports'?'reports':'cashflow';
   financeUi.insightMode=false;
   if(!cashFlowUi.open)cashFlowOpen_();
   cfbUi.active=true;
   if(mode==='reports')cfbSection_('reports');
   else if(mode==='bankPaste')cfbSection_('banks');
   else cfbSection_('ledger');
   return;
 }
 const go=()=>{
   if(cashFlowUi.open){financeWorkspaceMode=mode;cashFlowClose_();return;}
   financeWorkspaceActivate_(mode);
 };
 go();
}
function financeWorkspaceShowKind_(kind,status,match){
 financeWorkspaceMode=kind==='receipt'?'ledger':'approvals';
 financeUi.insightMode=false;
 financeJumpTo(kind,status||'ALL',match||'ALL');
}
function financeWorkspaceNav_(selected){
 const nav=[
  ['overview','概要','home'],['approvals','申請・精算','clipboard-check'],
  ['ledger','経費台帳','table'],['analysis','支出分析','chart'],
  ['cashflow','資金繰り','landmark'],['reports','提出資料','file']
 ];
 return '<nav class="fw-navigation" aria-label="経理の業務メニュー">'+nav.filter(item=>
  (item[0]!=='cashflow'&&item[0]!=='reports')||cashFlowAllowed_()).map(item=>
  '<button type="button" class="fw-nav-item'+(selected===item[0]?' is-active':'')+
  '" aria-current="'+(selected===item[0]?'page':'false')+'" onclick="financeWorkspaceGo_(\''+item[0]+'\')">'+
  escapeHtml(item[1])+'</button>').join('')+'</nav>';
}
function financeWorkspaceFrame_(selected,body){
 return '<div class="fw-root"><header class="fw-header"><div><span class="v15-kicker">FM WORKS / FINANCE</span>'+
  '<h1>経理・財務</h1></div><div class="fw-header-aside">申請の確認から日々の支出・資金繰りまで</div></header>'+
  financeWorkspaceNav_(selected)+'<div class="fw-content">'+body+'</div></div>';
}
function financeWorkspaceSummary_(){
 const d=financeDisplayedOverview_(),ready=!!(d&&!d.setupRequired),t=d&&d.totals||{};
 const number=k=>ready?String(Number(t[k]||0))+'件':'—';
 const issues=ready?(d.expenses||[]).filter(item=>{
  const match=(d.receiptMatches||{})[item.id];return !match||match.status!=='MATCHED';
 }).length:null;
 const tile=(label,value,description,action,style)=>{
  return '<button type="button" class="fw-action-card '+(style||'')+'" onclick="'+action+'">'+
   '<span>'+label+'</span><strong>'+value+'</strong><small>'+description+'</small><b>開く →</b></button>';
 };
 const warning=financeUi.error?'<p class="finance-error" role="alert">'+escapeHtml(financeUi.error)+
  ' <button type="button" class="secondary-button" onclick="loadFinanceOverview({force:true})">再試行</button></p>':'';
 const guide=financeUi.demo?'<p class="finance-demo-banner" role="status">架空データを表示中です。保存・承認・精算はできません。</p>':'';
 return '<div class="fw-overview"><div class="fw-heading"><div><h2>今日の経理業務</h2>'+
  '<p>最初に必要な確認だけを表示します。機能を探す場合は上の業務メニューへ。</p></div>'+
  '<button type="button" class="secondary-button" onclick="loadFinanceOverview({force:true})"'+
  (financeUi.loading?' disabled':'')+'>最新に更新</button></div>'+guide+warning+
  (!ready?'<p class="fw-muted" role="status">'+(financeUi.loading?'経理データを読み込み中…':d&&d.setupRequired?
    '初回設定が必要です。管理者によるバックアップ付きDB更新後に実データを確認してください。':
    'データを取得すると対応件数が表示されます。')+'</p>':'')+
  '<div class="fw-priorities">'+
  tile('経費の承認待ち',number('expensePending'),'確認・承認・差戻し',
    "financeWorkspaceShowKind_('expense','承認待ち')",'')+
  tile('出張の承認待ち',number('travelPending'),'旅費の根拠を確認',
    "financeWorkspaceShowKind_('travel','承認待ち')",'')+
  tile('精算待ち',ready?String(Number(t.expenseToSettle||0)+Number(t.travelToSettle||0))+'件':'—',
    '承認済みの記録を確認',"financeWorkspaceShowKind_('expense','承認済')",'')+
  tile('証憑の要確認',issues===null?'—':String(issues)+'件','読込済み申請の証憑を確認',
    "financeWorkspaceShowKind_('expense','ALL','ISSUE')",'')+
  '</div><h3>業務を選ぶ</h3><div class="fw-shortcuts">'+
  tile('経費台帳を入力','表にまとめて貼り付ける','Excel・Sheetsから複数行を貼り付け',
    "financeWorkspaceGo_('bulk')",'fw-important')+
  tile('経費記録の一覧','記録を確認する','日付・人・支払先で検索',
    "financeWorkspaceGo_('ledger')",'')+
  tile('過去の支出分析','月別・人別に分析','既存台帳は読み取り専用',
    "financeWorkspaceGo_('analysis')",'')+
  (cashFlowAllowed_()?
   tile('銀行Web明細','複数行を貼り付ける','口座・列・金額を確認して登録',
     "financeWorkspaceGo_('bankPaste')",'fw-important')+
   tile('資金繰り','12か月の見込み','銀行残高・予定・シナリオ',
     "financeWorkspaceGo_('cashflow')",'')+
   tile('金融機関提出資料','Excel / PDF','照合・条件を確認して出力',
     "financeWorkspaceGo_('reports')",''):'')+
  '</div><div class="fw-subtools"><button type="button" class="secondary-button" onclick="navigate(&quot;requests&quot;)">自分の経費・出張を申請</button>'+


  '</div></div>';
}
function financeWorkspaceList_(){
 const ledger=financeWorkspaceMode==='ledger';
 if(ledger)financeUi.tab='receipt';
 else if(financeUi.tab==='receipt')financeUi.tab='expense';
 const title=ledger?'経費台帳':'申請・精算',
  description=ledger?'日々の経費記録を確認します。まとめて登録する場合は「一括入力」を選びます。':
    '申請を確認し、承認・差戻し・精算を実施します。申請の内容は1件ずつ確認します。';
 const tools=ledger?
  '<button type="button" class="primary-button" onclick="financeWorkspaceGo_(\'bulk\')">表から一括入力</button>'+
  '<button type="button" class="secondary-button" onclick="openFinanceForm(\'receipt\')">1件ずつ登録</button>':
  '<button type="button" class="'+(financeUi.tab==='expense'?'primary-button':'secondary-button')+
   '" onclick="financeTabSelect(\'expense\')">経費精算</button>'+
  '<button type="button" class="'+(financeUi.tab==='travel'?'primary-button':'secondary-button')+
   '" onclick="financeTabSelect(\'travel\')">出張報告</button>';
 const toolbar='<div class="fw-list-toolbar"><div><h2>'+title+'</h2><p>'+description+'</p></div>'+
  '<div class="fw-inline-actions">'+tools+
  '<button type="button" class="secondary-button" onclick="loadFinanceOverview({force:true})"'+
  (financeUi.loading||financeUi.demo?' disabled':'')+'>最新に更新</button></div></div>';
 return toolbar+'<div class="fw-legacy">'+financeLegacyPage()+'</div>';
}
function financeWorkspacePage_(){
 if(!financeAccessAllowed())return pageHead('経理','この画面を表示する権限がありません。');
 if(cashFlowUi.open)return financeWorkspaceFrame_(
   typeof cfbUi!=='undefined'&&cfbUi.tab==='reports'?'reports':'cashflow',cashFlowPage_());
 if(financeUi.insightMode)return financeWorkspaceFrame_('analysis',financeInsightsPage());
 if(financeWorkspaceMode==='analysis'||financeWorkspaceMode==='cashflow'||financeWorkspaceMode==='reports')
   financeWorkspaceMode='overview';
 if(financeWorkspaceMode==='bulk')return financeWorkspaceFrame_('ledger',financeGridPage_());
 if(financeWorkspaceMode==='overview')return financeWorkspaceFrame_('overview',financeWorkspaceSummary_());
 return financeWorkspaceFrame_(financeWorkspaceMode,financeWorkspaceList_());
}

function financeBulkNormalizeHeader_(v){
 return String(v==null?'':v).toLowerCase().replace(/[\s\u3000()（）_・\-]/g,'');
}
function financeBulkGuessMap_(head,records,hasHeader){
 const fields=FINANCE_BULK_FIELDS.map(x=>x[0]);
 if(!hasHeader){
  const previous=['usedOn','','vendor','invoiceNo','item','amount','note','payer','paymentMethod','paid'];
  return head.map((_,i)=>head.length===10?previous[i]:fields[i]||'');
 }
 const used=new Set();
 return head.map((label,i)=>{
  const name=financeBulkNormalizeHeader_(label);
  const match=fields.find(key=>!used.has(key)&&FINANCE_BULK_ALIASES[key].some(alias=>
   financeBulkNormalizeHeader_(alias)===name))||'';
  if(match==='category'&&records.slice(0,6).some(row=>/^\d{4}年\d{1,2}月$/.test(String(row[i]||'').trim())))return '';
  if(match)used.add(match);
  return match;
 });
}
function financeBulkParseMatrix_(text){
 const raw=String(text||'').replace(/^\uFEFF/,'').trim();
 if(!raw||raw.length>150000)throw new Error('15万文字以内の表を貼り付けてください。');
 let matrix;
 if(raw.includes('\t'))matrix=raw.split(/\r\n|\n|\r/).filter(line=>line.trim())
   .map(line=>line.split('\t').map(value=>String(value).trim()));
 else matrix=cfbParseCSV_(raw);
 if(!matrix.length||matrix.length>501||matrix.some(row=>row.length>40))
   throw new Error('1回の貼り付けは500行・40列以内にしてください。');
 const first=matrix[0],recognized=first.filter(x=>Object.values(FINANCE_BULK_ALIASES).some(list=>
   list.some(alias=>financeBulkNormalizeHeader_(alias)===financeBulkNormalizeHeader_(x)))).length;
 const hasHeader=recognized>=2;
 const source=(hasHeader?matrix.slice(1):matrix).filter(row=>row.some(cell=>String(cell||'').trim()));
 if(!source.length)throw new Error('見出しだけでなく、経費の行も貼り付けてください。');
 return {headers:hasHeader?first:first.map((_,i)=>'列'+(i+1)),source:source,
   mapping:financeBulkGuessMap_(first,source,hasHeader),hasHeader:hasHeader};
}
function financeBulkDate_(text){
 const v=String(text==null?'':text).trim();
 const m=v.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/);
 return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):v;
}
function financeBulkAmountText_(raw){
 return String(raw==null?'':raw).trim().replace(/[¥￥,，\s円]/g,'');
}
function financeBulkRebuild_(){
 const ui=financeBulkUi;
 ui.rows=ui.source.map(values=>{
  const item={};
  ui.mapping.forEach((key,i)=>{if(key)item[key]=String(values[i]==null?'':values[i]).trim();});
  if(!item.category)item.category='未分類';
  if(!item.paid)item.paid='未';
  item.usedOn=financeBulkDate_(item.usedOn);
  item.amount=financeBulkAmountText_(item.amount);
  return item;
 });
 ui.keys=ui.rows.map(()=>financeNewKey());ui.index=0;ui.page=0;
 ui.locked=false;ui.complete=false;ui.uncertain=false;ui.auditWarning='';
}
function financeBulkPaste_(value){if(!financeBulkUi.locked)financeBulkUi.raw=String(value||'');}
function financeBulkPreview_(){
 if(financeBulkUi.busy||financeBulkUi.locked)return;
 try{
  const data=financeBulkParseMatrix_(financeBulkUi.raw);
  Object.assign(financeBulkUi,{...data,error:'',notice:data.source.length+'行を確認中です。まだ保存されていません。'});
  financeBulkRebuild_();
 }catch(error){financeBulkUi.error=String(error&&error.message||error);}
 renderPageIfActive('finance');
}
function financeBulkSetMap_(index,value){
 const ui=financeBulkUi;
 if(ui.locked||!ui.source)return;
 const key=String(value||'');
 if(key&&ui.mapping.some((item,i)=>i!==index&&item===key)){
  ui.error='同じ項目には複数の列を指定できません。';renderPageIfActive('finance');return;
 }
 ui.mapping[index]=key;ui.error='';financeBulkRebuild_();renderPageIfActive('finance');
}
function financeBulkValidateRow_(row){
 const r=row||{},errors=[],date=String(r.usedOn||'');
 const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date);
 if(!m)errors.push('利用日');
 else {
  const check=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  if(check.getUTCFullYear()!==+m[1]||check.getUTCMonth()!==+m[2]-1||check.getUTCDate()!==+m[3])
   errors.push('利用日');
 }
 for(const key of ['vendor','item','payer','paymentMethod'])if(!String(r[key]||'').trim())errors.push(
   FINANCE_BULK_FIELDS.find(col=>col[0]===key)[1]);
 const amount=financeBulkAmountText_(r.amount);
 if(!/^\d{1,9}$/.test(amount)||Number(amount)<=0)errors.push('金額');
 if(!['未','済'].includes(r.paid||'未'))errors.push('支払有無');
 if(/^\d{4}年\d{1,2}月$/.test(String(r.category||'')))errors.push('経費種別に年月が混入');
 const limits={category:60,vendor:120,invoiceNo:32,item:200,amount:9,note:500,payer:120,paymentMethod:80,receiptRef:160};
 Object.keys(limits).forEach(key=>{if(String(r[key]||'').length>limits[key])errors.push(key+'文字数');});
 return errors;
}
function financeBulkUpdate_(index,key,value){
 const ui=financeBulkUi;
 if(ui.locked||!ui.rows[index]||!FINANCE_BULK_FIELDS.some(x=>x[0]===key))return;
 ui.rows[index][key]=key==='amount'?financeBulkAmountText_(value):
  key==='usedOn'?financeBulkDate_(value):String(value||'');
 const status=document.getElementById('fw-bulk-error-'+index);
 if(status){const errors=financeBulkValidateRow_(ui.rows[index]);status.textContent=errors.length?errors.join('・'):'確認OK';status.dataset.valid=errors.length?'false':'true';}
 const total=document.getElementById('fw-bulk-total');
 if(total)total.textContent=ui.rows.reduce((sum,row)=>sum+(/^\d{1,9}$/.test(String(row.amount||''))?Number(row.amount):0),0).toLocaleString('ja-JP')+'円';
}
function financeBulkPageSet_(page){if(!financeBulkUi.busy){financeBulkUi.page=page;renderPageIfActive('finance');}}
function financeBulkSimilar_(row){
 const list=financeUi.overview&&financeUi.overview.receipts||[];
 return list.some(old=>financeBulkDate_(old.usedOn)===financeBulkDate_(row.usedOn)&&
  String(old.vendor||'')===String(row.vendor||'')&&String(old.item||'')===String(row.item||'')&&
  Number(old.amount)===Number(row.amount)&&String(old.payer||'')===String(row.payer||''));
}
function financeBulkStart_(approved=false){
 const ui=financeBulkUi;
 if(ui.busy||ui.complete||!ui.rows.length||!financeAccessAllowed()||financeUi.demo)return;
 if(!ui.locked){
  const filled=ui.rows.map((row,i)=>({row,key:ui.keys[i],position:i+1})).filter(x=>financeGridHasRecord_(x.row));
  if(!filled.length){ui.error='保存する経費を1行以上入力してください。空行は保存しません。';renderPageIfActive('finance');return;}
  const errors=filled.map(({row,position})=>{const e=financeBulkValidateRow_(row);return e.length?position+'行目: '+e.join('・'):'';}).filter(Boolean);
  if(errors.length){ui.error='修正が必要です：'+errors.slice(0,4).join(' ／ ')+(errors.length>4?' ほか'+(errors.length-4)+'行':'');renderPageIfActive('finance');return;}
  const duplicates=ui.rows.filter(financeBulkSimilar_).length;
  if(duplicates&&!approved){
   openConfirmDialog('既存記録と似た行があります',duplicates+'行が読込済みの経費台帳と日付・取引先・品目・金額・支払者で一致しています。重複でないことを確認した場合のみ登録します。',
    '確認して登録',()=>financeBulkStart_(true));return;
  }
  // Blank rows are only an editing aid. Keep each filled row paired with its
  // original requestKey before switching to immutable retry-safe save mode.
  ui.rows=filled.map(x=>x.row);ui.keys=filled.map(x=>x.key);
  ui.selectedRows=[];ui.page=0;
  ui.locked=true;
 }
 ui.error='';ui.notice='登録結果を確認しています。';financeBulkNext_();
}
function financeBulkNext_(){
 const ui=financeBulkUi;
 if(ui.busy||ui.complete)return;
 if(ui.index>=ui.rows.length){
  ui.complete=true;ui.locked=false;ui.uncertain=false;ui.error='';
  ui.notice=ui.rows.length+'件の登録結果を確認しました。'+
    (ui.auditWarning?'監査ログに未確認の記録があります。':'');
  loadFinanceOverview({force:true,silent:true});renderPageIfActive('finance');return;
 }
 const start=ui.index,chunk=ui.rows.slice(start,start+20).map((row,i)=>({
   ...row,requestKey:ui.keys[start+i]
 }));
 const identity=financeIdentity();
 ui.busy=true;
 renderPageIfActive('finance');
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run)
  .withSuccessHandler(result=>{
   if(ui!==financeBulkUi||identity!==financeIdentity())return;
   ui.busy=false;
   if(!result||result.ok!==true||!Array.isArray(result.results)||
      result.results.length!==chunk.length||result.results.some(x=>!x.id)){
     ui.error='登録完了の応答を確認できません。同じ内容と送信キーのまま再試行してください。';
     ui.uncertain=true;renderPageIfActive('finance');return;
   }
   if(result.auditRecorded===false)ui.auditWarning='保存済みですが監査ログの記録を確認できない行があります。履歴IDを管理者が確認してください。';
   ui.index+=chunk.length;ui.uncertain=false;ui.notice='登録結果を確認：'+ui.index+'/'+ui.rows.length+'件';
   financeBulkNext_();
  }).withFailureHandler(error=>{
   if(ui!==financeBulkUi||identity!==financeIdentity())return;
   ui.busy=false;ui.uncertain=true;
   ui.error=cleanApiErrorMessage(error,'保存結果が不明です。同じ送信キーで再試行してください。')+
     '　すでに保存された行がある可能性があります。内容を変えずに「同じ内容で再試行」を押してください。';
   renderPageIfActive('finance');
  }).saveFinanceReceiptsBulk(state.sessionToken,{rows:chunk});
}
function financeBulkReset_(){
 const ui=financeBulkUi;
 if(ui.busy)return;
 const reset=()=>{financeBulkUi=financeBulkInitial_();renderPageIfActive('finance');};
 if(!ui.locked&&!ui.complete&&(ui.rows.some(financeGridHasRecord_)||String(ui.raw||'').trim())){
  openConfirmDialog('入力表を新しくする','保存していない経費データが消えます。必要なら先に表をコピーしてください。',
    '入力表を破棄',reset);return;
 }
 if(ui.locked&&!ui.complete){
  openConfirmDialog('未確認の保存結果','通信エラー前に一部保存された可能性があります。登録履歴を確認せず破棄すると、再度貼り付けた際に二重登録する危険があります。',
    '入力を破棄',reset);return;
 }
 reset();
}
function financeBulkCopy_(){
 const rows=financeBulkUi.rows;
 if(!rows.length)return;
 const safe=v=>String(v==null?'':v).replace(/\t|\r|\n/g,' ').replace(/^([=+\-@])/,"'$1");
 const textValue=FINANCE_BULK_FIELDS.map(x=>x[1]).join('\t')+'\n'+
   rows.map(row=>FINANCE_BULK_FIELDS.map(x=>safe(row[x[0]])).join('\t')).join('\n');
 if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(textValue).then(()=>showToast('表をコピーしました。')).catch(()=>financeBulkCopyFallback_(textValue));
 }else financeBulkCopyFallback_(textValue);
}
function financeBulkCopyFallback_(value){
 const area=document.getElementById('fw-bulk-clipboard');
 if(!area)return;
 area.value=value;area.hidden=false;area.focus();area.select();
 showToast('下のテキストを選択しました。Ctrl+Cでコピーしてください。');
}
function financeBulkPage_(){
 const ui=financeBulkUi,has=ui.rows.length>0,start=ui.page*50,items=ui.rows.slice(start,start+50);
 const selector=(index,value)=>'<select aria-label="列'+(index+1)+'の対応項目" onchange="financeBulkSetMap_('+index+',this.value)"'+(ui.locked?' disabled':'')+'>'+
   '<option value="">取込しない</option>'+FINANCE_BULK_FIELDS.map(([key,label])=>
   '<option value="'+key+'"'+(key===value?' selected':'')+'>'+label+'</option>').join('')+'</select>';
 const mapping=ui.source?'<div class="fw-map"><h3>貼り付けた列の対応</h3><p>「経費種別」に年月が入っている旧台帳は自動計上しません。必要なら列を変更してください。</p>'+
   '<div class="fw-map-grid">'+ui.headers.map((head,i)=>'<label><span>'+escapeHtml(head)+'</span>'+selector(i,ui.mapping[i])+'</label>').join('')+'</div></div>':'';
 const headers=FINANCE_BULK_FIELDS.map(x=>'<th scope="col">'+escapeHtml(x[1])+'</th>').join('');
 const cells=items.map((row,i)=>{
  const index=start+i,errors=financeBulkValidateRow_(row);
  return '<tr><th scope="row">'+(index+1)+'</th>'+FINANCE_BULK_FIELDS.map(([key,label])=>
   '<td><input type="text" aria-label="'+(index+1)+'行目 '+escapeHtml(label)+'" value="'+
   escapeHtml(String(row[key]==null?'':row[key]))+'" oninput="financeBulkUpdate_('+index+',\''+key+'\',this.value)"'+
   (ui.locked?' readonly':'')+'></td>').join('')+
   '<td id="fw-bulk-error-'+index+'" data-valid="'+(errors.length?'false':'true')+'">'+
   escapeHtml(errors.length?errors.join('・'):'確認OK')+'</td></tr>';
 }).join('');
 const total=ui.rows.reduce((sum,row)=>sum+(/^\d{1,9}$/.test(String(row.amount||''))?Number(row.amount):0),0);
 const pages=Math.ceil(ui.rows.length/50);
 const feedback=(ui.error?'<p class="finance-error" role="alert">'+escapeHtml(ui.error)+'</p>':'')+
 (ui.auditWarning?'<p class="finance-error" role="alert">'+escapeHtml(ui.auditWarning)+'</p>':'')+
 (ui.notice?'<p class="fw-muted" role="status">'+escapeHtml(ui.notice)+'</p>':'');
 return '<div class="fw-bulk"><div class="fw-heading"><div><h2>経費台帳｜まとめて入力</h2>'+
  '<p>ExcelやGoogleスプレッドシートの複数行をコピーして貼り付けます。1件だけの入力も引き続き利用できます。</p></div>'+
  '<button type="button" class="secondary-button" onclick="financeWorkspaceGo_(\'ledger\')">台帳の一覧へ</button></div>'+
  (financeUi.demo?'<p class="finance-error" role="alert">サンプル表示中は登録できません。実データへ切り替えてください。</p>':'')+
  '<section class="card fw-paste"><div class="fw-paste-guide"><strong>1. 表を貼り付ける</strong><span>タブ区切り（Excel・Sheets）またはCSVに対応。既存経費台帳の10列形式も読めます。</span></div>'+
  '<textarea id="fw-bulk-input" rows="5" spellcheck="false" aria-label="経費台帳の複数行を貼り付ける" placeholder="利用日　経費種別　取引先　適格請求書番号　商品名　利用金額　備考　支払者　支払方法　支払有無" oninput="financeBulkPaste_(this.value)"'+
  (ui.locked?' readonly':'')+'>'+escapeHtml(ui.raw)+'</textarea>'+
  '<div class="fw-inline-actions"><button type="button" class="primary-button" onclick="financeBulkPreview_()"'+
  (ui.locked||ui.busy?' disabled':'')+'>貼り付け内容を表で確認</button>'+
  '<button type="button" class="secondary-button" onclick="financeBulkReset_()"'+(ui.busy?' disabled':'')+'>入力をクリア</button></div>'+
  '<p class="fw-muted">この段階ではDBを変更しません。貼り付けた「2026年10月」などの年月を経費種別と誤認しないよう確認します。</p></section>'+
  feedback+mapping+
  (has?'<section class="card fw-table-section"><div class="fw-heading"><div><h3>2. 表の内容を編集・確認</h3><p>セルをクリックして直接修正。Tabキーで次の入力欄へ移動できます。</p></div>'+
   '<button type="button" class="secondary-button" onclick="financeBulkCopy_()">表をコピー</button></div>'+
   '<p class="fw-muted">1～'+items.length+'件を表示（全'+ui.rows.length+'件）。横方向にスクロールできます。</p>'+
   '<div class="fw-grid-scroll" role="region" aria-label="経費台帳の貼り付けプレビュー" tabindex="0"><table class="fw-grid">'+
   '<thead><tr><th scope="col">行</th>'+headers+'<th scope="col">入力チェック</th></tr></thead><tbody>'+cells+'</tbody></table></div>'+
   (pages>1?'<div class="fw-pager"><button type="button" class="secondary-button" onclick="financeBulkPageSet_('+(ui.page-1)+')"'+(ui.page<=0?' disabled':'')+'>前の50行</button><span>'+
    (ui.page+1)+' / '+pages+'</span><button type="button" class="secondary-button" onclick="financeBulkPageSet_('+(ui.page+1)+')"'+
    (ui.page+1>=pages?' disabled':'')+'>次の50行</button></div>':'')+
   '<div class="fw-savebar"><div><strong>'+ui.rows.length+'行を確認</strong> ／ 合計 <strong id="fw-bulk-total">'+total.toLocaleString('ja-JP')+'円</strong>'+
   '<small>経費台帳だけに記録。銀行明細や精算申請を自動加算しません。</small></div>'+
   '<button type="button" class="primary-button" onclick="financeBulkStart_()"'+
    (ui.busy||ui.complete||financeUi.demo?' disabled':'')+'>'+
    (ui.busy?'登録中 '+ui.index+'/'+ui.rows.length:ui.complete?'登録確認済み':
     ui.uncertain?'同じ内容で再試行':'3. 確認して一括登録')+'</button></div></section>':'')+
  '<textarea id="fw-bulk-clipboard" hidden aria-label="コピー用テキスト"></textarea></div>';
}
</script>
