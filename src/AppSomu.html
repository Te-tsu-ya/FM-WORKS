<script>
/* Dedicated General Affairs UI: never persist business data in the browser. */
let somuUi={loaded:false,loading:false,busy:false,error:'',data:null,tab:'home',query:'',filter:'all',selected:'',loadedAt:0,listLimit:60};
function somuReset(){somuPageInvalidate_();somuTabState_.clear();window.somuActiveForm=null;somuUi={loaded:false,loading:false,busy:false,error:'',data:null,tab:'home',query:'',filter:'all',selected:'',loadedAt:0,listLimit:60};if(typeof somuGrowthReset_==='function')somuGrowthReset_();}
function somuSessionIdentity(){return String(state.sessionToken||'')+'|'+String(state.data&&state.data.user&&state.data.user.employeeId||'');}
function somuCanUse(){return !!(state.data&&state.data.permissions&&state.data.permissions.officeWorkspace&&state.sessionToken);}
function somuData(){return (somuUi.data||{assets:[],loans:[],purchases:[],documents:[]});}
function somuTruncated_(kind){return !!(somuData().truncatedKinds&&somuData().truncatedKinds[kind]);}
function somuCountText_(kind,count){
 return somuTruncated_(kind)?(count?count+'件以上':'未確定'):count+'件';
}
const SOMU_CLIENT_FRESH_MS=300000;
// Render the four essential ledgers first; load the three growth ledgers only
// after first paint, or when their own tab becomes active.
function somuScheduleGrowth_(force){
 if(typeof somuGrowthLoad!=='function')return;
 const needed=()=>somuUi.tab==='home'||
   (typeof somuGrowthTab_==='function'&&somuGrowthTab_(somuUi.tab));
 const defer=()=>{if(force&&typeof somuGrowth!=='undefined'){somuGrowth.forceOnNextLoad=true;somuGrowth.loadedAt=0;}};
 if(!needed()){defer();return;}
 const identity=somuSessionIdentity(),ui=somuUi;
 const launch=()=>{
  if(ui!==somuUi||identity!==somuSessionIdentity())return;
  if(state.page!=='office'||!needed()){defer();return;}
  somuGrowthLoad(!!force);
 };
 if(typeof scheduleBackgroundTask==='function')
   scheduleBackgroundTask(launch,somuUi.tab==='home'?350:0);
 else launch();
}
function somuLoad(force){
 if(!somuCanUse())return;
 if(force)somuPageInvalidate_();
 if(somuUi.loading){if(force)somuUi.refreshNeeded=true;return;}
 // Local in-memory snapshot makes return navigation instantaneous.
 if(somuUi.loaded&&!force&&Date.now()-somuUi.loadedAt<SOMU_CLIENT_FRESH_MS){
   somuScheduleGrowth_(false);
   return;
 }
 const ui=somuUi,identity=somuSessionIdentity(),started=Date.now(),hadData=!!(somuUi.loaded&&somuUi.data);
 somuUi.loading=true;somuUi.error='';
 // Base and growth RPCs own separate loading flags. A base refresh must not
 // unlock or cancel a growth request already in flight.
 if(force&&typeof somuGrowth!=='undefined'){
  somuGrowth.loadedAt=0;if(somuGrowth.loading)somuGrowth.refreshNeeded=true;
 }
 // Keep the previous cards and selected row visible during silent refresh.
 if(!hadData&&state.page==='office')renderPageIfActive('office');
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(data=>{
  if(ui!==somuUi||identity!==somuSessionIdentity())return;
  somuUi.loading=false;
  if(somuUi.refreshNeeded){somuUi.refreshNeeded=false;somuLoad(true);return;}
  somuUi.loaded=true;somuUi.data=data;somuUi.loadedAt=Date.now();
  if(data&&data.growth&&typeof somuGrowth!=='undefined'&&!somuGrowth.loading){
    somuGrowth.data=data.growth;somuGrowth.loaded=true;somuGrowth.loading=false;somuGrowth.loadedAt=Date.now();somuGrowth.error='';
  }
  if(typeof console!=='undefined'&&console.info)
    console.info('FM_SOMU_LOAD',JSON.stringify({elapsedMs:Date.now()-started,rows:data&&data.rowCount||0,refresh:hadData}));
  if(state.page==='office')renderPageIfActive('office');
  const forceGrowth=!!force||!!somuUi.growthRefreshNeeded;somuUi.growthRefreshNeeded=false;
  somuScheduleGrowth_(forceGrowth);
 }).withFailureHandler(err=>{
  if(ui!==somuUi||identity!==somuSessionIdentity())return;
  somuUi.loading=false;
  if(somuUi.refreshNeeded){somuUi.refreshNeeded=false;somuLoad(true);return;}
  const message=cleanApiErrorMessage(err,'総務データを読み込めませんでした。');
  if(hadData){
    // Network trouble must never blank an already usable workspace.
    if(state.page==='office')showToast('最新データの再取得に失敗しました。前回の表示を維持しています。');
  }else{
    somuUi.error=message;somuUi.loaded=true;
    if(state.page==='office')renderPageIfActive('office');
  }
  const forceGrowth=!!force||!!somuUi.growthRefreshNeeded;somuUi.growthRefreshNeeded=false;
  somuScheduleGrowth_(forceGrowth);
 }).getSomuWorkspace(state.sessionToken,!!force,false);
}
function somuReload(){somuLoad(true);}
const somuTabState_=new Map();
function somuTab(tab){if(!['home','assets','loans','purchases','documents','contracts','facilities','tickets'].includes(tab))return;somuTabState_.set(somuUi.tab,{filter:somuUi.filter,query:somuUi.query,selected:somuUi.selected,listLimit:somuUi.listLimit,pageBefore:somuUi.pageBefore||0,pageBack:(somuUi.pageBack||[]).slice()});somuUi.tab=tab;Object.assign(somuUi,somuTabState_.get(tab)||{filter:'all',query:'',selected:'',listLimit:60,pageBefore:0,pageBack:[]});if(typeof somuGrowthTab_==='function'&&somuGrowthTab_(tab))somuGrowthLoad(false);renderPageIfActive('office');somuPageEnsure_(0);}
function somuSearch(value){somuUi.query=String(value||'').slice(0,120);somuUi.listLimit=60;somuUi.pageBefore=0;somuUi.pageBack=[];somuPageEnsure_(450);somuRefreshLists();}
function somuFilter(value){somuUi.filter=String(value||'all');somuUi.listLimit=60;somuUi.pageBefore=0;somuUi.pageBack=[];somuPageEnsure_(0);somuRefreshLists();}
function somuPick(id){somuUi.selected=String(id);if(somuPaged_()&&!(somuPageCurrent_()&&somuPageCurrent_().items.some(x=>String(x.id)===String(id)))){somuUi.query=String(id);somuUi.filter='all';somuUi.pageBefore=0;somuUi.pageBack=[];const input=document.getElementById('somuQuery');if(input)input.value=somuUi.query;somuPageEnsure_(0);}somuRefreshLists();}
function somuMore(){if(somuPaged_()){const view=somuPageCurrent_();if(!view||view.loading||!view.hasMore)return;somuUi.pageBack=(somuUi.pageBack||[]).concat(somuUi.pageBefore||0);somuUi.pageBefore=view.nextBefore;somuUi.selected='';somuPageEnsure_(0);}else somuUi.listLimit=Math.min(2500,(somuUi.listLimit||60)+60);somuRefreshLists();}
function somuPrevious_(){if(!somuUi.pageBack||!somuUi.pageBack.length)return;somuUi.pageBefore=somuUi.pageBack.pop();somuUi.selected='';somuPageEnsure_(0);somuRefreshLists();}
const somuPageCache_=new Map();let somuPageView_=null,somuPageEpoch_=0,somuPageTimer_=null;
function somuPageInvalidate_(){somuPageEpoch_++;somuPageCache_.clear();somuPageView_=null;if(somuPageTimer_!==null)clearTimeout(somuPageTimer_);somuPageTimer_=null;}
function somuPaged_(){return ['assets','loans','purchases','documents'].includes(somuUi.tab)&&somuTruncated_(somuUi.tab);}
function somuPageKey_(){return JSON.stringify([somuSessionIdentity(),somuUi.tab,somuUi.query.trim(),somuUi.filter,somuUi.pageBefore||0]);}
function somuPageCurrent_(){return somuPageView_&&somuPageView_.key===somuPageKey_()?somuPageView_:null;}
function somuPageEnsure_(delay,retry){
 if(!somuCanUse()||state.page!=='office'||!somuPaged_()||somuUi.loading)return;
 const key=somuPageKey_(),existing=somuPageCurrent_();
 if(!retry&&existing&&(existing.loading||existing.error||Date.now()-existing.stamp<SOMU_CLIENT_FRESH_MS))return;
 const cached=somuPageCache_.get(key);
 if(!retry&&cached&&Date.now()-cached.stamp<SOMU_CLIENT_FRESH_MS){somuPageView_=cached;return;}
 if(somuPageTimer_!==null)clearTimeout(somuPageTimer_);
 const ui=somuUi,identity=somuSessionIdentity(),epoch=somuPageEpoch_,params={kind:ui.tab,query:ui.query.trim(),filter:ui.filter,before:ui.pageBefore||0};
 somuPageView_={key:key,items:existing&&existing.items||[],loading:true,error:'',stamp:0};
 somuPageTimer_=setTimeout(()=>{
  somuPageTimer_=null;
  if(ui!==somuUi||identity!==somuSessionIdentity()||epoch!==somuPageEpoch_||key!==somuPageKey_()||state.page!=='office'){if(somuPageView_&&somuPageView_.key===key)somuPageView_=null;return;}
  const valid=()=>ui===somuUi&&identity===somuSessionIdentity()&&epoch===somuPageEpoch_;
  const fail=err=>{if(!valid()||key!==somuPageKey_())return;somuPageView_={key:key,items:[],loading:false,error:cleanApiErrorMessage(err,'台帳の検索に失敗しました。再試行してください。'),stamp:0};somuRefreshLists();};
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(result=>{
   if(!valid())return;
   if(!result||result.ok!==true||result.kind!==params.kind||!Array.isArray(result.items)||result.items.length>60||result.items.some(item=>!item||typeof item!=='object'||!item.id)||typeof result.hasMore!=='boolean'||
     result.hasMore&&(!Number.isSafeInteger(result.nextBefore)||result.nextBefore<2||params.before&&result.nextBefore>=params.before))return fail(new Error('ページ結果を確認できません。'));
   const view=Object.assign({},result,{key:key,loading:false,error:'',stamp:Date.now()});
   somuPageCache_.delete(key);somuPageCache_.set(key,view);while(somuPageCache_.size>20)somuPageCache_.delete(somuPageCache_.keys().next().value);
   if(key!==somuPageKey_())return;
   somuPageView_=view;if(state.page==='office')somuRefreshLists();
  }).withFailureHandler(fail).getSomuRecordsPage(state.sessionToken,params);
 },delay||0);
}
function somuPageRetry_(){somuPageEnsure_(0,true);somuRefreshLists();}
function somuFindRecord_(kind,id){const view=somuPageCurrent_();return (view&&kind===somuUi.tab?view.items:[]).concat(somuData()[kind]||[]).find(x=>String(x.id)===String(id));}
function somuPagerMarkup_(){
 if(!somuPaged_())return '';
 const view=somuPageCurrent_();
 return '<div class="somu-notice" role="status">全台帳を検索・登録順（新しい順）で最大60件ずつ表示'+(view&&view.loading?' · 読み込み中…':'')+'</div>'+
  (view&&view.error?'<div class="somu-warning" role="alert">'+escapeHtml(view.error)+' <button type="button" class="secondary-button" onclick="somuPageRetry_()">再試行</button></div>':'')+
  '<div class="somu-detail-actions"><button type="button" class="secondary-button" onclick="somuPrevious_()" '+(!(somuUi.pageBack||[]).length||view&&view.loading?'disabled':'')+'>前のページ</button><button type="button" class="secondary-button" onclick="somuMore()" '+(!view||view.loading||view.error||!view.hasMore?'disabled':'')+'>次のページ</button></div>';
}
function somuRows(kind){
 if(kind===somuUi.tab&&somuPaged_()){const view=somuPageCurrent_();return view?view.items:[];}
 const q=somuUi.query.toLocaleLowerCase('ja-JP'),filter=somuUi.filter,d=somuData();
 return (d[kind]||[]).filter(x=>{
  const today=d.today||state.data&&state.data.today||'2026-10-10';
  const status=String(x.status||'');
  const overdue=kind==='loans'&&status==='貸出中'&&x.dueDate&&x.dueDate<today;
  if(filter==='overdue'&&!overdue)return false;
  if(filter==='open'&&(status==='返却済'||status==='入荷済'||status==='保管終了'||status==='廃止'))return false;
  if(filter==='closed'&&!['返却済','入荷済','保管終了','廃止'].includes(status))return false;
  return !q||Object.keys(x).filter(k=>k!=='requestKey').some(k=>String(x[k]??'').toLocaleLowerCase('ja-JP').includes(q));
 }).sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''))||
   String(b.id||'').localeCompare(String(a.id||'')));
}
function somuRefreshLists(){
 if(typeof somuGrowthTab_==='function'&&somuGrowthTab_(somuUi.tab)){somuGrowthRefreshLists_();return;}
 const list=document.getElementById('somuList'),detail=document.getElementById('somuDetail'),count=document.getElementById('somuCount');
 if(!list){renderPageIfActive('office');return;}
 const kind=somuUi.tab==='assets'?'assets':somuUi.tab==='loans'?'loans':somuUi.tab==='purchases'?'purchases':'documents',rows=somuRows(kind);
 if(!rows.some(x=>String(x.id)===somuUi.selected))somuUi.selected=rows.length?String(rows[0].id):'';
 list.innerHTML=somuListMarkup_(kind,rows);if(detail)detail.innerHTML=somuDetailMarkup_(kind,rows.find(x=>String(x.id)===somuUi.selected));
 if(count)count.textContent=somuPaged_()?'このページ '+rows.length+'件':somuCountText_(kind,rows.length);
 const pager=document.getElementById('somuPager');if(pager)pager.innerHTML=somuPagerMarkup_();
}
function somuStatus_(s,warning){return '<span class="somu-pill '+(warning?'danger':['申請中','貸出中'].includes(s)?'warn':['入荷済','返却済','有効'].includes(s)?'good':'')+'">'+escapeHtml(s||'未設定')+'</span>';}
function somuCard_(label,value,tone,tab,filter){return '<button type="button" class="somu-kpi '+tone+'" onclick="somuTab(\''+tab+'\');somuFilter(\''+(filter||'all')+'\')"><span>'+escapeHtml(label)+'</span><strong>'+escapeHtml(value)+'</strong><small>詳細を見る ›</small></button>';}
function somuHome_(){
 const d=somuData(),today=d.today||state.data&&state.data.today||'2026-10-10',loans=d.loans||[],assets=d.assets||[],purchases=d.purchases||[];
 const late=loans.filter(x=>x.status==='貸出中'&&x.dueDate<today),open=purchases.filter(x=>x.status==='申請中');
 const outstanding=somuOutstanding_();
 const loansTruncated=somuTruncated_('loans');
 const stock=loansTruncated?[]:assets.filter(x=>x.status!=='廃止'&&(Number(x.quantity||0)-Number(outstanding[x.id]||0))<=Number(x.minimum||0));
 const queue=[...late.map(x=>({kind:'loans',id:x.id,title:x.assetCode+' / '+x.borrower,desc:'返却期限 '+x.dueDate,type:'期限超過'})),...open.map(x=>({kind:'purchases',id:x.id,title:x.name+' / '+x.requesterName,desc:'購買承認待ち',type:'申請中'})),...stock.map(x=>({kind:'assets',id:x.id,title:x.name,desc:'在庫下限に到達',type:'要確認'}))];
 const tasks=queue.length?queue.slice(0,8).map(x=>'<button class="somu-task" type="button" data-tab="'+x.kind+'" data-id="'+escapeHtml(x.id)+'" onclick="somuTab(this.dataset.tab);somuPick(this.dataset.id)"><span class="somu-task-dot"></span><span><strong>'+escapeHtml(x.title)+'</strong><small>'+escapeHtml(x.desc)+'</small></span>'+somuStatus_(x.type,x.type==='期限超過')+'<b>›</b></button>').join(''):'<div class="somu-empty">'+(d.truncated?'一部の台帳のみ表示しています。対応待ちの全件は未確認です。':'対応待ちはありません。')+'</div>';
 return '<div class="somu-stats">'+somuCard_('登録備品',somuCountText_('assets',assets.length),'','assets')+somuCard_('返却期限超過',somuCountText_('loans',late.length),'danger','loans','overdue')+somuCard_('購買申請中',somuCountText_('purchases',open.length),'warning','purchases','open')+somuCard_('在庫下限',loansTruncated?'確認必要':stock.length+'件','warning','assets')+'</div>'+
 '<div class="somu-home-grid"><section class="card somu-panel"><div class="somu-panel-head"><div><h2>優先して対応する業務</h2><p>期限切れ・申請・在庫の順に表示</p></div><button class="secondary-button" type="button" onclick="somuReload()">更新</button></div><div class="somu-queue">'+tasks+'</div></section>'+
 '<section class="card somu-panel"><div class="somu-panel-head"><div><h2>よく使う操作</h2><p>必要な仕事を直接開けます</p></div></div><div class="somu-shortcuts">'+
 [['備品台帳','assets','i-briefcase'],['貸出・返却','loans','i-file'],['購買申請','purchases','i-chart'],['書類整理','documents','i-doc']].map(x=>'<button type="button" onclick="somuTab(\''+x[1]+'\')">'+svg(x[2])+'<strong>'+x[0]+'</strong><span>開く ›</span></button>').join('')+'</div>'+
 '<div class="somu-notice">購入が「入荷済み」になっても在庫は自動加算されません。担当者が備品台帳を確認して登録してください。</div></section></div>';
}
// Reuse the totals for all visible assets; do not scan all loans for every row.
const somuOutstandingCache=new WeakMap();
function somuOutstanding_(){
 const loans=somuData().loans||[];
 let totals=somuOutstandingCache.get(loans);
 if(totals)return totals;
 totals=Object.create(null);
 loans.forEach(x=>{
  if(x.status==='貸出中')totals[x.assetId]=(totals[x.assetId]||0)+Number(x.quantity||0);
 });
 somuOutstandingCache.set(loans,totals);
 return totals;
}
function somuAvailable_(asset){
 if(somuTruncated_('loans'))return null;
 return Math.max(0,Number(asset.quantity||0)-Number(somuOutstanding_()[asset.id]||0));
}
function somuSummary_(kind,x){if(kind==='assets'){const available=somuAvailable_(x);
 return [x.code,x.location||'保管先なし',x.quantity+'点（'+(available===null?'貸出可能数は未確定':'貸出可能 '+available+'点')+'）'];}if(kind==='loans')return [x.assetCode,x.borrower,'期限 '+x.dueDate];if(kind==='purchases')return [x.name,x.requesterName||'',x.quantity+'点・'+Number(x.estimatedPrice||0).toLocaleString('ja-JP')+'円/点'];return [x.name,x.category||'',x.location||'保管場所未登録'];}
function somuListMarkup_(kind,rows){
 if(!rows.length)return '<div class="somu-empty">'+(somuPaged_()&&(!somuPageCurrent_()||somuPageCurrent_().loading)?'台帳を検索しています…':somuPaged_()&&somuPageCurrent_().hasMore?'この範囲に一致する記録はありません。次のページへ進めます。':'条件に一致するデータはありません。検索条件を変更してください。')+'</div>';
 const today=somuData().today||state.data&&state.data.today||'2026-10-10';
 const displayed=rows.slice(0,somuUi.listLimit||60);
 return displayed.map(x=>{const [name,sub,info]=somuSummary_(kind,x),chosen=String(x.id)===somuUi.selected;
  return '<button type="button" class="somu-list-item '+(chosen?'selected':'')+'" data-id="'+escapeHtml(String(x.id))+'" onclick="somuPick(this.dataset.id)" aria-pressed="'+chosen+'"><span class="somu-item-heading"><strong>'+escapeHtml(name)+'</strong>'+somuStatus_(x.status,kind==='loans'&&x.status==='貸出中'&&x.dueDate<today)+'</span><span>'+escapeHtml(sub)+'</span><small>'+escapeHtml(info)+'</small></button>';
 }).join('')+(rows.length>displayed.length?
  '<button class="somu-more secondary-button" type="button" onclick="somuMore()">さらに60件表示（残り'+
    (rows.length-displayed.length)+'件）</button>':'');
}
function somuDetailMarkup_(kind,x){
 if(!x)return '<div class="somu-empty">左の一覧から確認する記録を選んでください。</div>';
 const labels={assets:{code:'管理番号',name:'品名',category:'分類',maker:'メーカー',model:'型番',location:'保管場所',quantity:'数量',minimum:'下限',status:'状態',note:'備考'},loans:{assetCode:'管理番号',borrower:'貸出先',quantity:'数量',loanDate:'貸出日',dueDate:'返却予定日',returnedAt:'返却日',status:'状態',purpose:'利用目的'},purchases:{name:'品名',quantity:'希望数量',estimatedPrice:'概算単価',neededOn:'希望日',reason:'申請理由',requesterName:'申請者',status:'状態',orderedOn:'発注日',receivedOn:'入荷日',note:'備考'},documents:{name:'書類名',category:'分類',location:'保管場所',expiresOn:'期限',status:'状態',note:'備考'}};
 const fields=Object.entries(labels[kind]).map(([key,label])=>'<div><dt>'+label+'</dt><dd>'+escapeHtml(x[key]??'—')+'</dd></div>').join('');
 let actions='';
 if(kind==='assets')actions='<button class="primary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuOpenForm(\'asset\',this.dataset.id)">編集</button><button class="secondary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuOpenForm(\'loan\',\'\',this.dataset.id)">貸出する</button>';
 if(kind==='loans'&&x.status==='貸出中')actions='<button class="primary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuReturn(this.dataset.id)">返却を登録</button>';
 if(kind==='purchases'){
  const mine=String(x.requesterId)===String(state.data&&state.data.user&&state.data.user.employeeId);
  if(x.status==='申請中'&&somuData().canApprove&&!mine)actions='<button class="primary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuPurchaseAction(this.dataset.id,\'APPROVE\')">承認する</button><button class="secondary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuPurchaseAction(this.dataset.id,\'RETURN\')">差戻す</button>';
  if(x.status==='承認済')actions='<button class="primary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuPurchaseAction(this.dataset.id,\'ORDER\')">発注済みにする</button>';
  if(x.status==='入荷済')actions='<button class="primary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuRegisterReceivedPurchase_(this.dataset.id)">備品台帳に登録</button>';
  if(x.status==='発注済')actions='<button class="primary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuPurchaseAction(this.dataset.id,\'RECEIVE\')">入荷済みにする</button>';
  if(x.status==='差戻し'&&mine)actions='<button class="primary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuOpenForm(\'purchase\',this.dataset.id)">修正して再申請</button>';
 }
 if(kind==='documents')actions='<button class="primary-button" data-id="'+escapeHtml(x.id)+'" onclick="somuOpenForm(\'document\',this.dataset.id)">編集</button>'+(x.url?'<a target="_blank" rel="noopener noreferrer" href="'+escapeHtml(x.url)+'" class="secondary-button">保管リンクを開く</a>':'');
 return '<div class="somu-detail-head"><h2>'+escapeHtml(somuSummary_(kind,x)[0])+'</h2>'+somuStatus_(x.status)+'</div><dl class="somu-detail-fields">'+fields+'</dl><div class="somu-detail-actions">'+actions+'</div>';
}
function somuRecords_(kind){
 somuPageEnsure_(0);
 const rows=somuRows(kind);
 const filterOptions=[['all','すべて'],['open','進行中'],['closed','完了・終了']];if(kind==='loans')filterOptions.splice(1,0,['overdue','期限超過']);
 if(!somuUi.selected&&rows.length)somuUi.selected=String(rows[0].id);
 const selected=rows.find(x=>String(x.id)===somuUi.selected)||rows[0];
 return '<div class="somu-records"><section class="card somu-record-list"><div class="somu-panel-head"><div><h2>'+({assets:'備品台帳',loans:'貸出・返却',purchases:'購買管理',documents:'書類台帳'})[kind]+'</h2><p id="somuCount">'+(somuPaged_()?'このページ '+rows.length+'件':somuCountText_(kind,rows.length))+'</p></div>'+
 ('<button class="primary-button" onclick="somuOpenForm(\''+({assets:'asset',loans:'loan',purchases:'purchase',documents:'document'})[kind]+'\')">＋ 新規登録</button>')+'</div>'+
 '<div class="somu-filters"><label><span class="visually-hidden">総務記録を検索</span><input aria-label="総務記録を検索" id="somuQuery" placeholder="番号・品名・担当者で検索" value="'+escapeHtml(somuUi.query)+'" oninput="somuSearch(this.value)"></label><label><span class="visually-hidden">状態を絞り込む</span><select aria-label="状態を絞り込む" onchange="somuFilter(this.value)">'+filterOptions.map(([value,label])=>'<option value="'+value+'" '+(somuUi.filter===value?'selected':'')+'>'+label+'</option>').join('')+'</select></label></div>'+
 '<div id="somuList" class="somu-items">'+somuListMarkup_(kind,rows)+'</div><div id="somuPager">'+somuPagerMarkup_()+'</div></section><section class="card somu-record-detail" aria-label="選択した記録の詳細"><div id="somuDetail">'+somuDetailMarkup_(kind,selected)+'</div></section></div>';
}
function somuPage(){
 if(!somuCanUse())return pageHead('総務','この画面を表示する権限がありません。');
 if(!somuUi.loaded)return '<div class="v15-workspace v15-general-affairs"><header class="v15-page-hero"><div><h1>総務</h1><p>備品・貸出・購買・書類を準備しています。</p></div></header><div class="card somu-empty" role="status">総務データを読み込んでいます…</div></div>';
 if(somuUi.error)return '<div class="v15-workspace v15-general-affairs"><header class="v15-page-hero"><h1>総務</h1></header><div class="card somu-empty" role="alert">'+escapeHtml(somuUi.error)+' <button onclick="somuReload()" class="primary-button">再読み込み</button></div></div>';
 const d=somuData();
 if(d.setupRequired)return '<div class="v15-workspace v15-general-affairs"><header class="v15-page-hero"><div><h1>総務</h1><p>備品・購買・貸出・書類の管理</p></div></header><div class="card somu-empty"><strong>総務DBの初期設定が必要です</strong><p>管理者が「管理・設定 → 運用・労務」からバックアップ付きDB更新を実行してください。</p><p>未作成：'+escapeHtml((d.missing||[]).join('、'))+'</p><button type="button" class="secondary-button" onclick="somuReload()">DBの状態を再確認</button>' + (state.data&&state.data.permissions&&state.data.permissions.adminConsole?'<button type="button" class="primary-button" onclick="setAdminTab(\'operation\')">管理画面でDBを更新</button>':'') + '</div></div>';
 const active=somuUi.tab;
 return '<div class="v15-workspace v15-general-affairs somu-workspace"><header class="somu-heading"><div><div class="v15-kicker">FM WORKS / 管理業務</div><h1>総務</h1><p>会社の資産・契約・設備・社内手続きを、一つの場所で管理</p></div><div class="somu-top-actions"><button class="secondary-button" onclick="somuReload()">更新</button></div></header>'+
 (d.truncated?'<div class="somu-notice" role="status">ホームの件数は一部の記録から集計しています。備品・貸出・購買・書類の各台帳では、過去の記録も検索してページを切り替えられます。</div>':'')+
 (typeof somuGrowthNavigation_==='function'?somuGrowthNavigation_():'<nav class="somu-tabs" aria-label="総務機能"><button type="button" onclick="somuTab(\'home\')">総務ホーム</button></nav>')+
 (active==='home'&&typeof somuGrowthHome_==='function'?somuGrowthHome_():
  typeof somuGrowthTab_==='function'&&somuGrowthTab_(active)?somuGrowthRecords_(active):
  active==='home'?somuHome_():somuRecords_(active))+'</div>';
}
function somuUuid(){return 'somu-'+Date.now()+'-'+Math.random().toString(36).slice(2,12);}
function somuOpenForm(kind,id,selectedAssetId){
 if(somuUi.busy)return;
 const plural={asset:'assets',loan:'loans',purchase:'purchases',document:'documents'}[kind];
 if(!plural)return;
 const old=somuFindRecord_(plural,id)||{};
 if(id&&!old.id){showToast('対象の記録を選び直してください。');return;}
 const fields={
 asset:[['code','管理番号','text',true],['name','品名','text',true],['category','分類','text'],['maker','メーカー','text'],['model','型番','text'],['location','保管場所','text'],['quantity','保有数','number',true],['minimum','在庫下限','number',true],['status','状態','select',false,['利用中','保管中','廃止']],['note','備考','textarea']],
 loan:[['assetId','備品を選択','asset',true],['borrower','貸出先','text',true],['quantity','貸出数','number',true],['loanDate','貸出日','date',true],['dueDate','返却予定日','date',true],['purpose','使用目的','textarea']],
 purchase:[['name','購入品目','text',true],['quantity','希望数量','number',true],['estimatedPrice','概算単価（円）','number'],['neededOn','希望日','date'],['reason','申請理由','textarea',true]],
 document:[['name','書類名','text',true],['category','分類','text'],['location','保管場所','text'],['url','保管リンク（https）','url'],['expiresOn','期限','date'],['status','状態','select',false,['有効','保管終了']],['note','備考','textarea']]
 }[kind];
 const html=fields.map(([key,label,type,required,choices])=>{
  label+=required?' <em class="v15-required">必須</em>':'';
  let value=old[key]??({quantity:1,minimum:0,estimatedPrice:0,loanDate:state.data.today,dueDate:state.data.today,status:'利用中'}[key]??'');
  if(type==='asset'){
   const chosen=somuFindRecord_('assets',selectedAssetId),assets=(somuData().assets||[]).filter(a=>a.status!=='廃止');
   if(chosen&&chosen.status!=='廃止'&&!assets.some(a=>a.id===chosen.id))assets.unshift(chosen);
   return '<label class="field"><span>'+label+'</span><select id="somu-'+key+'" required>'+assets.map(a=>'<option value="'+escapeHtml(a.id)+'" '+(a.id===selectedAssetId?'selected':'')+'>'+escapeHtml(a.code+' · '+a.name)+'</option>').join('')+'</select></label>';
  }
  if(type==='select')return '<label class="field"><span>'+label+'</span><select id="somu-'+key+'">'+choices.map(o=>'<option '+(o===value?'selected':'')+'>'+o+'</option>').join('')+'</select></label>';
  if(type==='textarea')return '<label class="field full"><span>'+label+'</span><textarea id="somu-'+key+'" rows="3" '+(required?'required':'')+'>'+escapeHtml(value)+'</textarea></label>';
  return '<label class="field"><span>'+label+'</span><input id="somu-'+key+'" type="'+type+'" '+(required?'required':'')+' '+(type==='number'?'min="'+(key==='quantity'&&kind!=='asset'?'1':'0')+'" step="1"':'')+' value="'+escapeHtml(value)+'"></label>';
 }).join('');
 const title={asset:'備品',loan:'貸出',purchase:'購買申請',document:'社内書類'}[kind];
 const isResubmit=kind==='purchase'&&!!id;
 const modal=ensureModal();
 modal.innerHTML='<div class="modal-backdrop" onclick="closeModal()"></div><section class="modal-card somu-modal" role="dialog" aria-modal="true" aria-labelledby="somuModalTitle"><div class="modal-head"><h2 id="somuModalTitle">'+(isResubmit?'差戻し内容を修正：':id?'編集：':'新規登録：')+title+'</h2><button class="icon-button" onclick="closeModal()" aria-label="閉じる">×</button></div><form id="somuForm" onsubmit="event.preventDefault();somuSubmit()"><div class="somu-form-fields">'+html+'</div><p id="somuFormError" class="somu-form-error" role="alert" hidden></p><div class="modal-actions"><button type="button" class="secondary-button" onclick="closeModal()">キャンセル</button><button id="somuSaveButton" class="primary-button" type="submit">保存する</button></div></form></section>';
 window.somuActiveForm={kind:kind,id:id||'',old:old,key:somuUuid(),fields:fields,isResubmit:isResubmit};
}
function somuRegisterReceivedPurchase_(id){
 if(somuUi.busy)return;
 const purchase=somuFindRecord_('purchases',id);
 if(!purchase||purchase.status!=='入荷済')return;
 const linked=(somuData().assets||[]).find(x=>String(x.note||'').includes('[購買:'+purchase.id+']'));
 if(linked){somuTab('assets');somuPick(linked.id);showToast('この購買に対応する備品は登録済みです');return;}
 somuOpenForm('asset');
 const values={name:purchase.name,quantity:purchase.quantity,note:'[購買:'+purchase.id+'] '+(purchase.reason||'')};
 Object.entries(values).forEach(([key,value])=>{const node=document.getElementById('somu-'+key);if(node)node.value=String(value||'')});
 showToast('品名・数量を引き継ぎました。管理番号と保管場所を確認して保存してください');
}
function somuSubmit(){
 const f=window.somuActiveForm;if(!f||somuUi.busy)return;
 const form=document.getElementById('somuForm');if(form&&form.reportValidity&&!form.reportValidity())return;
 const payload={id:f.id,requestKey:f.key,revision:f.old.revision,updatedAt:f.old.updatedAt};
 for(const [key] of f.fields){const el=document.getElementById('somu-'+key);payload[key]=el?el.value:'';}
 const api=f.isResubmit?'resubmitSomuPurchase':{asset:'saveSomuAsset',loan:'createSomuLoan',purchase:'createSomuPurchase',document:'saveSomuDocument'}[f.kind];
 const args=f.isResubmit?[state.sessionToken,f.id,payload]:[state.sessionToken,payload];
 somuUi.busy=true;
 if(form&&form.querySelectorAll)form.querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);
 const button=document.getElementById('somuSaveButton');if(button){button.disabled=true;button.textContent='保存中…';}
 const identity=somuSessionIdentity();
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(result=>{
  if(identity!==somuSessionIdentity())return;
  somuUi.busy=false;
  if(!result||result.ok!==true){somuFormFailure_('保存結果を確認できませんでした。');return;}
  window.somuActiveForm=null;closeModal();showToast('保存しました');somuReload();
 }).withFailureHandler(err=>{
  if(identity!==somuSessionIdentity())return;somuUi.busy=false;
  if(handleApiError(err,'保存に失敗しました'))return;
  somuFormFailure_(cleanApiErrorMessage(err,'保存に失敗しました'));
 })[api](...args);
}
function somuFormFailure_(message){
 const form=document.getElementById('somuForm');if(form&&form.querySelectorAll)form.querySelectorAll('input,select,textarea').forEach(el=>el.disabled=false);
 const el=document.getElementById('somuFormError');if(el){el.textContent=message;el.hidden=false;}
 const button=document.getElementById('somuSaveButton');if(button){button.disabled=false;button.textContent='保存する';}
}
function somuReturn(id){
 if(somuUi.busy)return;
 somuActionDialog_('RETURN_LOAN',id);
}
function somuPurchaseAction(id,action){
 if(somuUi.busy||!['APPROVE','RETURN','ORDER','RECEIVE'].includes(action))return;
 somuActionDialog_(action,id);
}
function somuActionDialog_(action,id){
 const labels={RETURN_LOAN:'返却を登録',APPROVE:'購買申請を承認',RETURN:'購買申請を差戻し',ORDER:'発注済みに変更',RECEIVE:'入荷済みに変更'};
 if(!Object.prototype.hasOwnProperty.call(labels,action))return;
 somuUi.pendingAction={action:action,id:String(id)};
 const warning=action==='RECEIVE'?'入荷後の在庫数量は自動更新されません。備品台帳で実数を確認してください。':'';
 const reason=action==='RETURN'?'<label class="field full"><span>差戻し理由（必須）</span><textarea id="somuDecisionReason" rows="3" required maxlength="400"></textarea></label>':'';
 const root=ensureModal();
 root.innerHTML='<div class="modal-backdrop" onclick="somuCancelDecision()"></div><section class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="somuDecisionTitle">'+
 '<div class="modal-head"><h2 id="somuDecisionTitle">'+escapeHtml(labels[action])+'</h2><button type="button" class="icon-button" aria-label="閉じる" onclick="somuCancelDecision()">×</button></div>'+
 '<form onsubmit="event.preventDefault();somuCommitDecision()"><p>'+escapeHtml(labels[action]+'してよろしいですか？')+'</p>'+
 (warning?'<p class="somu-warning">'+escapeHtml(warning)+'</p>':'')+reason+
 '<p id="somuDecisionError" role="alert" hidden></p><div class="modal-actions"><button type="button" class="secondary-button" onclick="somuCancelDecision()">キャンセル</button>'+
 '<button type="submit" class="primary-button">実行する</button></div></form></section>';
}
function somuCancelDecision(){somuUi.pendingAction=null;closeModal();}
function somuCommitDecision(){
 const current=somuUi.pendingAction;
 if(!current||somuUi.busy)return;
 const reasonNode=document.getElementById('somuDecisionReason');
 const reason=reasonNode?String(reasonNode.value||'').trim():'';
 if(current.action==='RETURN'&&!reason){
  const error=document.getElementById('somuDecisionError');
  if(error){error.textContent='差戻し理由を入力してください。';error.hidden=false;}
  return;
 }
 somuUi.pendingAction=null;closeModal();
 if(current.action==='RETURN_LOAN')somuAction_('returnSomuLoan',[current.id],'返却済みにしました');
 else somuAction_('advanceSomuPurchase',[current.id,current.action,reason],'購買状態を変更しました');
}
function somuAction_(api,args,message){
 const identity=somuSessionIdentity();somuUi.busy=true;
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(result=>{
  if(identity!==somuSessionIdentity())return;
  somuUi.busy=false;
  if(!result||result.ok!==true){showToast('処理結果を確認できませんでした');return;}
  showToast(message);somuReload();
 }).withFailureHandler(err=>{if(identity!==somuSessionIdentity())return;somuUi.busy=false;handleApiError(err,'処理できませんでした');})[api](state.sessionToken,...args);
}
</script>
