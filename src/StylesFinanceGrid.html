<style>
/* FM WORKS v0.24.0: full-width sheet entry: dense but keyboard-friendly. */
.fg-screen{min-width:0;display:grid;gap:10px;color:var(--text)}
.fg-screen .card{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.fg-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fg-heading h2{font-size:20px;line-height:1.35;margin:2px 0 3px;color:var(--text)}
.fg-heading p{font-size:12px;margin:0;color:var(--muted)}
.fg-heading-actions{display:flex;gap:7px;flex-wrap:wrap}
.fg-heading-actions button{min-height:40px}
.fg-toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.fg-toolbar button{min-height:40px}
.fg-toolbar .fg-spacer{flex:1 1 12px}
.fg-import{padding:13px;display:grid;gap:9px;min-width:0}
.fg-import h3{margin:0 0 3px;font-size:15px}
.fg-import p,.fg-hint{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.fg-import textarea{display:block;min-height:90px;width:100%;resize:vertical;background:var(--surface2);
 color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px;font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre;tab-size:4}
.fg-import textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.fg-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(162px,1fr));gap:8px;border-top:1px solid var(--line);padding-top:10px}
.fg-map label{display:grid;gap:4px;font-size:11px;color:var(--muted);min-width:0}
.fg-map span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fg-map select{min-height:37px;width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:7px;font-size:12px}
.fg-defaults{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px}
.fg-defaults>span{color:var(--muted);font-size:11px;font-weight:700}
.fg-defaults label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text);font-weight:700}
.fg-defaults input,.fg-defaults select{min-height:36px;max-width:170px;padding:6px 8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:7px;font-size:12px}
.fg-defaults button{min-height:38px}
.fg-tablewrap{padding:0;min-width:0;overflow:hidden}
.fg-tablebar{display:flex;gap:13px;align-items:center;flex-wrap:wrap;padding:11px 12px 4px}
.fg-tablebar strong{font-size:14px}
.fg-tablebar span{font-size:11px;color:var(--muted);white-space:nowrap}
.fg-tablebar span b{font-variant-numeric:tabular-nums;color:var(--text)}
.fg-tablebar .fg-meta{margin-left:auto}
.fg-tablewrap .fg-hint{padding:2px 12px 9px}
.fg-scroll{max-height:min(60svh,720px);overflow:auto;width:100%;border-left:0;border-right:0;border-bottom:1px solid var(--line);border-top:1px solid var(--line);
 scrollbar-width:thin;overscroll-behavior:contain}
.fg-grid{table-layout:fixed;width:max-content;min-width:100%;background:var(--surface);border-spacing:0;border-collapse:separate;text-align:left}
.fg-grid th,.fg-grid td{font-size:12px;line-height:1.4;white-space:nowrap;padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;min-width:112px}
.fg-grid th:first-child,.fg-grid td:first-child{min-width:57px;width:57px;max-width:57px}
.fg-grid thead th{position:sticky;top:0;z-index:4;background:var(--surface2);color:var(--muted);
 height:48px;line-height:1.25;text-align:left;padding:4px 8px;font-weight:750}
.fg-grid thead th:first-child{left:0;z-index:7}
.fg-grid thead th:nth-child(2){min-width:136px}
.fg-grid thead th:nth-child(3){min-width:172px}
.fg-grid thead th:nth-child(4){min-width:200px}
.fg-grid thead th:nth-child(5){min-width:128px;text-align:right}
.fg-grid thead th:nth-child(6){min-width:130px}
.fg-grid thead th:nth-child(7){min-width:130px}
.fg-grid thead th:nth-child(8){min-width:130px}
.fg-grid thead th:nth-child(9){min-width:115px}
.fg-grid thead th:nth-child(10){min-width:168px}
.fg-grid thead th:nth-child(11){min-width:170px}
.fg-grid thead th:nth-child(12){min-width:135px}
.fg-grid thead th:last-child{min-width:135px}
.fg-grid .fg-letter{display:block;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:2px}
.fg-grid tbody th{position:sticky;left:0;z-index:3;background:var(--surface2);height:40px;text-align:center}
.fg-grid .fg-rowhead{display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:11px;color:var(--muted)}
.fg-grid .fg-rowhead input,.fg-grid thead th:first-child input{margin:0;accent-color:var(--blue);width:16px;height:16px;min-height:16px;cursor:pointer}
.fg-grid td{height:40px}
.fg-grid td input{width:100%;height:39px;display:block;border:1px solid transparent;box-sizing:border-box;border-radius:0;padding:6px 9px;
 background:transparent;color:var(--text);font-size:12px;font-family:inherit;min-width:0}
.fg-grid td.fg-money input{text-align:right;font-variant-numeric:tabular-nums}
.fg-grid td input:hover{border-color:color-mix(in srgb,var(--blue) 28%,var(--line))}
.fg-grid td input:focus{position:relative;z-index:2;background:var(--surface);outline:2px solid var(--blue);outline-offset:-2px;border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.fg-grid tr:nth-child(even){background:color-mix(in srgb,var(--surface2) 42%,var(--surface))}
.fg-grid tr:hover{background:color-mix(in srgb,var(--blue) 5%,var(--surface))}
.fg-grid tr.fg-invalid td:last-child{color:#a96307;font-weight:700}
.fg-grid tr.fg-empty td input{color:var(--muted)}
.fg-grid td:last-child{min-width:135px;max-width:200px;white-space:normal;padding:3px 8px;font-size:11px;line-height:1.35}
.fg-grid [data-valid=true]{color:#08784c}
.fg-grid [data-valid=false]{color:#b56b08;background:color-mix(in srgb,#db911e 9%,var(--surface))}
.fg-grid [data-valid=empty]{color:var(--muted)}
.fg-grid input[readonly]{cursor:default}
.fg-grid input:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.fg-tablefooter{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:9px 12px}
.fg-tablefooter button{min-height:38px}
.fg-pager{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.fg-summary{position:sticky;bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:13px 16px;
 background:var(--surface);box-shadow:0 4px 17px color-mix(in srgb,var(--text) 10%,transparent);z-index:9}
.fg-summary strong{font-size:14px;font-variant-numeric:tabular-nums}
.fg-summary small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.fg-summary button{min-height:44px;font-weight:700}
.fg-notice{margin:0;padding:10px 12px;background:color-mix(in srgb,var(--blue) 9%,var(--surface));border-radius:8px;font-size:12px;line-height:1.6}
.fg-screen #fw-bulk-clipboard:not([hidden]){width:100%;min-height:70px}
@media(max-width:960px){
 .fg-defaults{align-items:stretch}
 .fg-tablebar{gap:7px 12px}
 .fg-scroll{max-height:55svh}
}
@media(max-width:650px){
 .fg-heading h2{font-size:18px}
 .fg-toolbar{padding:8px}
 .fg-toolbar button{min-height:40px;flex:1 1 120px}
 .fg-toolbar .fg-spacer{display:none}
 .fg-defaults input,.fg-defaults select{max-width:none;width:100%}
 .fg-defaults label{flex:1 1 130px;display:grid}
 .fg-defaults button{flex:1 1 100%}
 .fg-summary{padding:10px;bottom:4px}
 .fg-summary button{width:100%}
 .fg-tablebar .fg-meta{margin-left:0}
}
</style>
