<style>
/* Spreadsheet-style bank import review, isolated from existing reports. */
.cbg-sheet{display:grid;gap:10px;min-width:0;margin:12px 0}
.cbg-head,.cbg-totals,.cbg-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cbg-head h3{font-size:16px;margin:0 0 4px}
.cbg-head p{font-size:12px;line-height:1.6;color:var(--muted);margin:0;max-width:800px}
.cbg-head button,.cbg-bottom button{min-height:38px}
.cbg-totals{justify-content:flex-start;gap:8px 18px;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:9px}
.cbg-totals span{font-size:12px;color:var(--muted)}
.cbg-totals strong{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
.cbg-scroll{max-width:100%;max-height:min(62svh,670px);overflow:auto;border:1px solid var(--line);border-radius:10px;overscroll-behavior:contain}
.cbg-table{width:max-content;min-width:100%;border-spacing:0;border-collapse:separate;background:var(--surface);font-size:12px}
.cbg-table th,.cbg-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;padding:0;text-align:left;min-width:120px}
.cbg-table thead th{position:sticky;top:0;z-index:2;background:var(--surface2);font-size:11px;height:48px;padding:5px 9px;line-height:1.3}
.cbg-table thead th small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.cbg-table thead th:first-child{z-index:4;left:0;min-width:43px;width:43px}
.cbg-table tbody th{position:sticky;left:0;z-index:1;text-align:center;min-width:43px;width:43px;background:var(--surface2);font-weight:650;color:var(--muted)}
.cbg-table td:nth-child(2){min-width:133px}
.cbg-table td:nth-child(3){min-width:235px}
.cbg-table td:nth-child(4),.cbg-table td:nth-child(5),.cbg-table td:nth-child(6){min-width:128px}
.cbg-table td:nth-child(7){min-width:150px}
.cbg-table td:nth-child(8){min-width:125px}
.cbg-table td:nth-child(9){min-width:140px;text-align:center}
.cbg-table td:nth-child(10){min-width:170px;max-width:230px;padding:5px 9px;white-space:normal;line-height:1.4}
.cbg-table td:last-child{min-width:76px;text-align:center;padding:4px 6px}
.cbg-table tr:nth-child(even){background:color-mix(in srgb,var(--surface2) 35%,var(--surface))}
.cbg-table tr:hover{background:color-mix(in srgb,var(--fill-info) 6%,var(--surface))}
.cbg-table td input[type=text]{display:block;box-sizing:border-box;width:100%;height:41px;min-height:41px;min-width:0;border:1px solid transparent;border-radius:0;padding:7px 9px;background:transparent;color:var(--text);font:12px/1.4 inherit}
.cbg-table td.cbg-money input[type=text]{font-variant-numeric:tabular-nums;text-align:right}
.cbg-table td input[type=text]:focus{outline:2px solid var(--blue);outline-offset:-2px;background:var(--surface);position:relative;z-index:2}
.cbg-table td input[readonly]{cursor:default;color:var(--muted)}
.cbg-table td .cbg-check{display:inline-flex;align-items:center;gap:5px;justify-content:center;font-size:11px;min-height:40px;cursor:pointer}
.cbg-table td input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
.cbg-table td [data-valid=false]{color:var(--warning-ink)}
.cbg-table td[data-valid=false]{color:var(--warning-ink);background:color-mix(in srgb,var(--warning-bg) 9%,var(--surface))}
.cbg-table td[data-valid=true]{color:var(--success-ink)}
.cbg-table td button{min-height:34px;padding:6px 10px;font-size:11px}
.cbg-bottom{font-size:12px;color:var(--muted)}
.cbg-bottom>div{display:flex;gap:8px;align-items:center}
.cbg-sheet #cbg-copy:not([hidden]){width:100%;min-height:85px}
@media(max-width:650px){
 .cbg-head{align-items:stretch}
 .cbg-head button{width:100%}
 .cbg-totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 .cbg-bottom{justify-content:center}
 .cbg-table td input[type=text]{font-size:13px}
}
</style>
