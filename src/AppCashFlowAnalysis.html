<script>
/* CASH FLOW ANALYSIS: no persistent browser storage; never trust browser totals. */
let cfaUi={year:0,tab:'analysis',workspace:null,month:'',rows:null,total:0,page:0,
 loading:false,loadingMonth:false,loadingProjection:false,busy:false,exporting:false,seq:0,monthSeq:0,projectionSeq:0,
 scenarioId:'',projection:null,editor:null,ruleDraft:null,scenarioDraft:null,reconcilePending:null,error:'',notice:''};
function cfaReset_(){
 cfaUi={year:0,tab:'analysis',workspace:null,month:'',rows:null,total:0,page:0,
  loading:false,loadingMonth:false,loadingProjection:false,busy:false,exporting:false,seq:cfaUi.seq+1,
  monthSeq:cfaUi.monthSeq+1,projectionSeq:cfaUi.projectionSeq+1,scenarioId:'',projection:null,
  editor:null,ruleDraft:null,scenarioDraft:null,reconcilePending:null,error:'',notice:''};
}
function cfaKey_(){return 'CFA-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,16);}
function cfaMoney_(amount){return amount===null||amount===undefined?'未入力':Number(amount).toLocaleString('ja-JP')+'円';}
function cfaEsc_(v){return escapeHtml(String(v===null||v===undefined?'':v));}
function cfaShowError_(e,fallback){cfaUi.error=cleanApiErrorMessage(e,fallback||'資金繰りの処理に失敗しました。');cfaUi.busy=false;cfaUi.exporting=false;renderPageIfActive('finance');}
function cfaEnsureYear_(){
 const y=cashFlowUi.year;
 if(cfaUi.year===y)return;
 cfaReset_();cfaUi.year=y;
}
function cfaLoad_(force){
 if(!cashFlowAllowed_()||!cashFlowUi.open||cfbUi.demo)return;
 cfaEnsureYear_();
 const u=cfaUi,y=cashFlowUi.year;if(u.loading){u.forceAfter=true;return;}
 if(!force&&u.workspace)return;
 const seq=++u.seq;u.loading=true;u.error='';
 cfbRpc_('getCashFlowAnalysisWorkspace',y,data=>{
  if(seq!==cfaUi.seq||cashFlowUi.year!==y||!cashFlowUi.open)return;
  u.loading=false;if(u.forceAfter){u.forceAfter=false;cfaLoad_(true);return;}
  if(!data||data.ok!==true){cfaShowError_({message:'分析情報が取得できません。'});return;}
  u.workspace=data;
  if(!u.month||!(data.months||[]).includes(u.month)){
   const today=String(state.data&&state.data.today||'').slice(0,7);
   u.month=(data.months||[]).includes(today)?today:(data.months||[]).at(-1)||'';
  }
  if(u.scenarioId&&!(data.scenarios||[]).some(s=>s.id===u.scenarioId))u.scenarioId='';
  renderPageIfActive('finance');
  if(cfbUi.tab==='analysis')cfaLoadMonth_(true);
  if(cfbUi.tab==='scenarios'||cfbUi.tab==='reports')cfaLoadProjection_(true);
 },e=>{if(seq!==cfaUi.seq)return;u.loading=false;cfaShowError_(e,'分析情報を読み込めませんでした。');});
}
function cfaLoadMonth_(force){
 const u=cfaUi;if(!u.workspace||u.workspace.setupRequired||!u.month||cfbUi.demo)return;
 if(u.loadingMonth){if(force)u.monthForceAfter=true;return;}
 if(!force&&u.rows)return;
 const y=cashFlowUi.year,month=u.month,page=u.page,seq=++u.monthSeq;
 u.loadingMonth=true;
 cfbRpc_('getCashFlowAnalysisMonth',{fiscalYear:y,month,page},data=>{
  if(seq!==u.monthSeq||cashFlowUi.year!==y||u.month!==month)return;
  u.loadingMonth=false;
  if(u.monthForceAfter){u.monthForceAfter=false;cfaLoadMonth_(true);return;}
  if(!data||data.ok!==true){cfaShowError_({message:'明細を取得できません。'});return;}
  u.rows=data.rows||[];u.total=Number(data.total||0);renderPageIfActive('finance');
 },e=>{if(seq!==u.monthSeq)return;u.loadingMonth=false;cfaShowError_(e,'明細を読み込めませんでした。');});
}
function cfaLoadProjection_(force){
 const u=cfaUi;
 if(!u.workspace||u.workspace.setupRequired||cfbUi.demo)return;
 if(u.loadingProjection){if(force)u.projectionForceAfter=true;return;}
 if(!force&&u.projection&&u.projection.scenarioId===u.scenarioId)return;
 const scenario=u.scenarioId,year=cashFlowUi.year,seq=++u.projectionSeq;
 u.loadingProjection=true;
 cfbRpc_('getCashFlowProjection',{fiscalYear:year,scenarioId:scenario},data=>{
  if(seq!==u.projectionSeq||year!==cashFlowUi.year||scenario!==u.scenarioId)return;
  u.loadingProjection=false;
  if(u.projectionForceAfter){u.projectionForceAfter=false;cfaLoadProjection_(true);return;}
  if(!data||data.ok!==true){cfaShowError_({message:'シミュレーションの結果を取得できません。'});return;}
  u.projection=data;renderPageIfActive('finance');
 },e=>{if(seq!==u.projectionSeq)return;u.loadingProjection=false;cfaShowError_(e,'資金繰りの予測に失敗しました。');});
}
function cfaChangeMonth_(value){
 if(cfaUi.busy)return;
 cfaUi.reconcilePending=null;cfaUi.month=String(value||'');cfaUi.rows=null;cfaUi.editor=null;cfaUi.page=0;cfaUi.monthSeq++;cfaUi.loadingMonth=false;
 renderPageIfActive('finance');cfaLoadMonth_(true);
}
function cfaPageIndex_(index){
 if(cfaUi.busy)return;
 const last=Math.max(0,Math.ceil(cfaUi.total/100)-1);
 cfaUi.page=Math.max(0,Math.min(last,Number(index)||0));cfaUi.rows=null;cfaUi.editor=null;cfaUi.loadingMonth=false;
 cfaUi.monthSeq++;renderPageIfActive('finance');cfaLoadMonth_(true);
}
function cfaOpenEditor_(id){
 const r=(cfaUi.rows||[]).find(x=>x.id===id);if(!r)return;
 cfaUi.editor={id:r.id,category:r.reviewed?r.category:r.suggested?r.category:'',tags:r.tags,note:r.note,revision:r.revision,requestKey:''};
 renderPageIfActive('finance');
}
function cfaEditorField_(name,value){
 const d=cfaUi.editor;if(!d)return;
 const next=String(value);if(d[name]!==next){d[name]=next;d.requestKey='';}
}
function cfaSaveAnnotation_(){
 const u=cfaUi,d=u.editor;if(!d||u.busy||cfbUi.demo)return;
 if(!d.requestKey)d.requestKey=cfaKey_();
 const key=d.requestKey;
 u.busy=true;u.error='';
 cfbRpc_('saveCashFlowAnnotation',{transactionId:d.id,category:d.category,tags:d.tags,note:d.note,revision:d.revision,requestKey:key},res=>{
  if(!res||res.ok!==true){cfaShowError_({message:'保存結果を確認できません。再試行してください。'});return;}
  u.busy=false;u.editor=null;u.notice=res.auditRecorded===false?'保存済みですが監査履歴を確認してください。':'分類・メモを保存しました。';
  u.rows=null;cfaLoadMonth_(true);cfaLoad_(true);
 },e=>cfaShowError_(e,'分類・メモを保存できませんでした。'));
}
function cfaRuleNew_(id){
 const source=(cfaUi.workspace&&cfaUi.workspace.rules||[]).find(x=>x.id===id);
 cfaUi.ruleDraft=source?{...source}:{id:'',keyword:'',direction:'ANY',accountId:'',category:'',tags:'',priority:50,active:true,revision:0,requestKey:''};
 renderPageIfActive('finance');
}
function cfaRuleChange_(field,val){
 if(!cfaUi.ruleDraft)return;
 const d=cfaUi.ruleDraft,next=field==='priority'?Number(val):field==='active'?!!val:val;
 if(d[field]!==next){d[field]=next;d.requestKey='';}
}
function cfaSaveRule_(){
 const u=cfaUi;if(!u.ruleDraft||u.busy||cfbUi.demo)return;
 if(!u.ruleDraft.requestKey)u.ruleDraft.requestKey=cfaKey_();
 u.busy=true;u.error='';
 cfbRpc_('saveCashFlowRule',{...u.ruleDraft},res=>{
  if(!res||res.ok!==true){cfaShowError_({message:'ルール保存結果が不明です。再試行してください。'});return;}
  u.busy=false;u.ruleDraft=null;u.notice=res.auditRecorded===false?'保存済みですが監査履歴を確認してください。':'自動分類ルールを保存しました。';cfaLoad_(true);
 },e=>cfaShowError_(e,'分類ルールを保存できませんでした。'));
}
function cfaApplyCurrentRules_(){
 const u=cfaUi,ids=(u.rows||[]).filter(r=>r.suggested&&!r.reviewed&&!r.transfer).map(r=>r.id).slice(0,100);
 if(!ids.length){u.error='未確定の分類候補がありません。';renderPageIfActive('finance');return;}
 openConfirmDialog('分類ルールを反映','候補の'+ids.length+'件を明細に保存します。保存済みの個別メモ・分類は上書きしません。','選択月の候補を反映',()=>{
  u.busy=true;cfbRpc_('applyCashFlowRules',{transactionIds:ids,requestKey:cfaKey_()},res=>{
   u.busy=false;u.rows=null;u.notice=res.added+'件に分類を反映しました。';cfaLoad_(true);cfaLoadMonth_(true);
  },e=>cfaShowError_(e,'自動分類を反映できませんでした。'));
 });
}
function cfaReconcile_(index){
 const u=cfaUi,records=(u.workspace&&u.workspace.checks||[]).filter(x=>x.month===u.month),r=records[index];
 if(!r||u.busy||cfbUi.demo)return;
 const balance=document.getElementById('cfa-bank-balance-'+index);
 const note=document.getElementById('cfa-bank-note-'+index);
 if(!balance||balance.value.trim()===''){u.error='銀行サイトの月末残高を入力してください。';renderPageIfActive('finance');return;}
 const signature=JSON.stringify([cashFlowUi.year,u.month,r.accountId,r.revision,balance.value,note?note.value:'']);
 if(!u.reconcilePending||u.reconcilePending.signature!==signature)
  u.reconcilePending={signature,payload:{fiscalYear:cashFlowUi.year,month:u.month,accountId:r.accountId,
   closingBalance:balance.value,note:note?note.value:'',revision:r.revision,requestKey:cfaKey_()}};
 const payload=u.reconcilePending.payload;
 openConfirmDialog('銀行月次照合','銀行のWeb画面ですべての入出金が取り込まれ、表示残高が一致することを確認しましたか？','照合結果を保存',()=>{
  u.busy=true;cfbRpc_('saveCashFlowBankReconciliation',payload,res=>{
   if(!res||res.ok!==true){cfaShowError_({message:'照合の保存結果が不明です。再試行してください。'});return;}
   u.busy=false;u.reconcilePending=null;u.notice=res.auditRecorded===false?'照合済みですが監査履歴を確認してください。':'照合結果を保存しました。';
   cfaLoad_(true);cfbLoadAfterWrite_();
  },e=>cfaShowError_(e,'照合結果を保存できませんでした。'));
 });
}
function cfaScenarioSelect_(id){
 cfaUi.scenarioId=String(id||'');cfaUi.projection=null;cfaUi.projectionSeq++;cfaUi.loadingProjection=false;cfaUi.exporting=false;
 renderPageIfActive('finance');cfaLoadProjection_(true);
}
function cfaScenarioNew_(id){
 const s=(cfaUi.workspace&&cfaUi.workspace.scenarios||[]).find(x=>x.id===id);
 cfaUi.scenarioDraft=s?{id:s.id,revision:s.revision,name:s.name,changes:s.changes.map(x=>({...x}))}:
  {id:'',revision:0,name:'',changes:[]};
 renderPageIfActive('finance');
}
function cfaScenarioName_(v){const d=cfaUi.scenarioDraft;if(d&&d.name!==v){d.name=v;d.requestKey='';}}
function cfaScenarioAdd_(type){
 const d=cfaUi.scenarioDraft,plans=cfbUi.loaded&&cfbUi.loaded.plans||[];
 if(!d||d.changes.length>=30)return;
 const month=cfaUi.month||cashFlowUi.year+'-01';
 const first=plans.find(p=>p.active)||{};
 const change=type==='EXTRA'?{type,month,direction:'OUT',amount:0,title:'臨時支出'}:
  type==='SCALE'?{type,month,planId:first.id||'',percent:80}:
  type==='SHIFT'?{type,month,planId:first.id||'',monthsDelta:1}:{type:'OMIT',month,planId:first.id||''};
 d.changes.push(change);d.requestKey='';renderPageIfActive('finance');
}
function cfaScenarioField_(index,name,value){
 const d=cfaUi.scenarioDraft;if(!d||!d.changes[index])return;
 const next=['monthsDelta','percent','amount'].includes(name)?Number(value):String(value);
 if(d.changes[index][name]!==next){d.changes[index][name]=next;d.requestKey='';}
}
function cfaScenarioRemove_(index){
 const d=cfaUi.scenarioDraft;if(!d)return;d.changes.splice(index,1);d.requestKey='';renderPageIfActive('finance');
}
function cfaScenarioSave_(){
 const u=cfaUi;if(!u.scenarioDraft||u.busy||cfbUi.demo)return;
 const d=u.scenarioDraft;if(!d.requestKey)d.requestKey=cfaKey_();
 u.busy=true;u.error='';
 cfbRpc_('saveCashFlowScenario',{id:d.id,fiscalYear:cashFlowUi.year,name:d.name,changes:d.changes,
  revision:d.revision,requestKey:d.requestKey},res=>{
  if(!res||res.ok!==true){cfaShowError_({message:'シナリオ保存結果が不明です。再試行してください。'});return;}
  u.busy=false;u.scenarioDraft=null;u.scenarioId=res.id;u.projection=null;u.loadingProjection=false;u.projectionSeq++;
  u.notice=res.auditRecorded===false?'保存済みですが監査履歴を確認してください。':'条件別の資金繰りを保存しました。';
  cfaLoad_(true);cfaLoadProjection_(true);
 },e=>cfaShowError_(e,'シミュレーション条件を保存できませんでした。'));
}
function cfaDownloadReport_(format){
 const u=cfaUi;if(u.exporting||!cashFlowAllowed_()||!u.projection||cfbUi.demo)return;
 const token=state.sessionToken,year=cashFlowUi.year,scenarioId=u.scenarioId,seq=u.seq;
 const current=()=>token===state.sessionToken&&year===cashFlowUi.year&&scenarioId===cfaUi.scenarioId&&seq===cfaUi.seq&&cashFlowUi.open;
 u.exporting=true;u.error='';renderPageIfActive('finance');
 cfbRpc_('exportCashFlowReport',{fiscalYear:year,scenarioId,format},res=>{
  if(!current())return;
  u.exporting=false;
  if(!res||!res.ok||!res.base64){cfaShowError_({message:'出力データが取得できませんでした。'});return;}
  let href='';
  try{
   const bin=atob(res.base64),bytes=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
   const blob=new Blob([bytes],{type:res.mimeType});
   href=URL.createObjectURL(blob);const a=document.createElement('a');
   a.href=href;a.download=res.filename;document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(href),15000);
   u.notice=res.status==='要確認'?'出力しました。照合不足・未確認項目があるため、提出前に必ず確認してください。':'資金繰り帳票を出力しました。';
  }catch(error){if(href)URL.revokeObjectURL(href);u.error='ブラウザーでファイルを保存できませんでした。再試行してください。';}
  renderPageIfActive('finance');
 },e=>{if(current())cfaShowError_(e,'帳票の出力に失敗しました。');});
}

function cfaPlanMatchHtml_(match){
 const m=match||{},total=Number(m.total)||0;
 if(m.status==='TRANSFER')return '<span class="cfa-plan-match-none">振替・対象外</span>';
 if(m.status==='INVALID_DATE')return '<span class="cfa-plan-match-warning">日付要確認</span>';
 if(!total)return '<span class="cfa-plan-match-none">候補なし</span>';
 const items=(m.candidates||[]).map(p=>'<li><strong>'+cfaEsc_(p.title)+'</strong>'+
  '<small>予定日 '+cfaEsc_(p.plannedDate)+' ／ '+cfaMoney_(p.amount)+
  ' ／ '+cfaEsc_(Number(p.gapDays)||0)+'日差'+(p.descriptionMatch?' ／ 摘要の文字も一致':' ／ 摘要は別途確認')+'</small></li>').join('');
 return '<details class="cfa-plan-match"><summary class="'+(total>1?'cfa-plan-match-warning':'')+'">'+
  (total>1?'候補'+total+'件・要確認':'候補1件・未確定')+'</summary><ul>'+items+'</ul>'+
  (total>(m.candidates||[]).length?'<small>他にも候補があります。予定一覧で確認してください。</small>':'')+
  '</details>';
}

function cfaAnalysisPage_(){
 const u=cfaUi,w=u.workspace;if(!w)return '<p role="status">資金の分析情報を読み込み中です。</p>';
 const months=(w.months||[]).map(m=>'<option value="'+cfaEsc_(m)+'"'+(m===u.month?' selected':'')+'>'+cfaEsc_(m.replace('-','年')+'月')+'</option>').join('');
 const check=(w.checks||[]).filter(x=>x.month===u.month);
 const rows=u.rows||[];
 const table=rows.map(r=>{
  const e=u.editor&&u.editor.id===r.id,category=r.reviewed?'確定：'+r.category:r.suggested?'候補：'+r.category:'未分類';
  return '<tr><td>'+cfaEsc_(r.date)+'</td><td>'+cfaEsc_(r.description)+'</td>'+
   '<td class="cf-num">'+(r.incoming?cfaMoney_(r.incoming):'')+'</td><td class="cf-num">'+(r.outgoing?cfaMoney_(r.outgoing):'')+'</td>'+
   '<td>'+cfaEsc_(r.transfer?'口座間振替':category)+'</td><td>'+cfaEsc_(r.tags||'—')+'</td><td>'+cfaEsc_(r.note||'—')+'</td><td>'+cfaPlanMatchHtml_(r.planMatch)+'</td>'+
   '<td><button class="secondary-button" type="button" data-id="'+cfaEsc_(r.id)+'" onclick="cfaOpenEditor_(this.dataset.id)">分類・メモ</button></td></tr>'+
   (e?'<tr class="cfa-editor-row"><td colspan="9"><div class="cfa-editor"><label>計上区分<input id="cfaCategory" maxlength="60" value="'+cfaEsc_(u.editor.category)+'" oninput="cfaEditorField_(\'category\',this.value)"></label>'+
    '<label>タグ（カンマ区切り）<input id="cfaTags" maxlength="250" value="'+cfaEsc_(u.editor.tags)+'" oninput="cfaEditorField_(\'tags\',this.value)"></label>'+
    '<label>内容メモ<textarea id="cfaNote" rows="2" maxlength="800" oninput="cfaEditorField_(\'note\',this.value)">'+cfaEsc_(u.editor.note)+'</textarea></label>'+
    '<button class="primary-button" type="button" onclick="cfaSaveAnnotation_()"'+(u.busy?' disabled':'')+'>分類とメモを保存</button>'+
    '<button class="secondary-button" type="button" onclick="cfaUi.editor=null;renderPageIfActive(\'finance\')">閉じる</button></div></td></tr>':'');
 }).join('');
 const reconciliation=check.map((r,i)=>{
  const pending=u.reconcilePending&&u.reconcilePending.payload,
   draft=pending&&pending.month===u.month&&pending.accountId===r.accountId?pending:null;
  return '<div class="cfa-reconcile-item"><div><strong>'+cfaEsc_(r.accountName)+'</strong><span>'+
   (r.verified?'照合済':r.outdated?'要再照合':'未照合')+'／入金 '+cfaMoney_(r.actualIn)+'・出金 '+cfaMoney_(r.actualOut)+'／ '+r.importedCount+'件</span></div>'+
   '<label>銀行Webの月末残高（円）<input type="number" id="cfa-bank-balance-'+i+'" value="'+(draft?cfaEsc_(draft.closingBalance):r.latestBalance!==null?cfaEsc_(r.latestBalance):'')+'" placeholder="銀行サイトで確認" /></label>'+
   '<label>照合根拠・補足<input type="text" maxlength="500" id="cfa-bank-note-'+i+'" value="'+cfaEsc_(draft?draft.note:r.note||'')+'" placeholder="取引がない月も確認根拠を記入" /></label>'+
   '<button class="secondary-button" onclick="cfaReconcile_('+i+')"'+(u.busy?' disabled':'')+'>照合して保存</button></div>';
 }).join('');
 return '<section class="card cfa-panel"><div class="cfa-toolbar"><label>対象月 <select onchange="cfaChangeMonth_(this.value)">'+months+'</select></label>'+
  '<div>未確定の分類：<strong>'+Number(w.unreviewedCount||0)+'件</strong></div>'+
  '<button type="button" class="secondary-button" onclick="cfaApplyCurrentRules_()"'+(u.busy?' disabled':'')+'>このページの自動分類候補を確定</button></div>'+
  '<h2>入出金明細と個別メモ</h2><p>銀行Webの原明細は変更しません。予定照合は同額・入出金方向・口座・予定日の前後3日で候補を探します。候補は未確定で、自動承認・二重計上はしません。</p>'+
  (u.loadingMonth?'<p role="status">銀行明細を読み込み中です。</p>':
   '<div class="cf-scroll"><table class="cf-table"><thead><tr><th>日付</th><th>摘要</th><th>入金</th><th>出金</th><th>計上区分</th><th>タグ</th><th>メモ</th><th>予定との候補</th><th>操作</th></tr></thead><tbody>'+
   (table||'<tr><td colspan="9">対象月の明細はまだありません。</td></tr>')+'</tbody></table></div>'+
   '<div class="cfa-pagination"><span>'+(u.page*100+1)+'〜'+Math.min((u.page+1)*100,u.total)+'件 / '+u.total+'件</span>'+
    '<button class="secondary-button" onclick="cfaPageIndex_('+(u.page-1)+')"'+(u.page===0?' disabled':'')+'>前へ</button>'+
    '<button class="secondary-button" onclick="cfaPageIndex_('+(u.page+1)+')"'+((u.page+1)*100>=u.total?' disabled':'')+'>次へ</button></div>')+
  '</section><section class="card cfa-panel"><h2>銀行口座別の月末残高を照合する</h2><p>銀行のWebページで月内すべての明細を確認し、末尾残高を入力してください。未照合の月は確定実績として採用されません。銀行別の明細合計は自社口座間振替を含みますが、会社全体の収支からは除外します。</p>'+
  (reconciliation||'<p>登録済み銀行口座がありません。</p>')+'</section>'+cfaRulesPage_();
}
function cfaRulesPage_(){
 const u=cfaUi,w=u.workspace||{},options=[['ANY','入金・出金'],['IN','入金だけ'],['OUT','出金だけ']];
 const items=(w.rules||[]).map(r=>'<tr><td>'+cfaEsc_(r.keyword)+'</td><td>'+cfaEsc_(r.category)+'</td><td>'+cfaEsc_(r.tags||'—')+'</td><td>'+r.priority+'</td><td>'+(r.active?'有効':'無効')+'</td>'+
  '<td><button class="secondary-button" data-id="'+cfaEsc_(r.id)+'" onclick="cfaRuleNew_(this.dataset.id)">編集</button></td></tr>').join('');
 const d=u.ruleDraft;
 const form=d?'<div class="cfa-editor cfa-rule-form"><label>摘要に含まれる文字<input maxlength="80" value="'+cfaEsc_(d.keyword)+'" oninput="cfaRuleChange_(\'keyword\',this.value)" /></label>'+
  '<label>入出金<select onchange="cfaRuleChange_(\'direction\',this.value)">'+options.map(o=>'<option value="'+o[0]+'"'+(d.direction===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>'+
  '<label>対象口座<select onchange="cfaRuleChange_(\'accountId\',this.value)"><option value="">すべての口座</option>'+
   (w.accounts||[]).map(a=>'<option value="'+cfaEsc_(a.id)+'"'+(a.id===d.accountId?' selected':'')+'>'+cfaEsc_(a.bank+' '+a.name)+'</option>').join('')+'</select></label>'+
  '<label>計上区分<input maxlength="60" value="'+cfaEsc_(d.category)+'" oninput="cfaRuleChange_(\'category\',this.value)" /></label>'+
  '<label>タグ<input maxlength="250" value="'+cfaEsc_(d.tags)+'" oninput="cfaRuleChange_(\'tags\',this.value)" /></label>'+
  '<label>優先度（1〜100）<input type="number" min="1" max="100" value="'+d.priority+'" oninput="cfaRuleChange_(\'priority\',this.value)" /></label>'+
  '<label>有効<input type="checkbox"'+(d.active?' checked':'')+' onchange="cfaRuleChange_(\'active\',this.checked)" /></label>'+
  '<button type="button" class="primary-button" onclick="cfaSaveRule_()"'+(u.busy?' disabled':'')+'>ルールを保存</button>'+
  '<button type="button" class="secondary-button" onclick="cfaUi.ruleDraft=null;renderPageIfActive(\'finance\')">閉じる</button></div>':'';
 return '<section class="card cfa-panel"><div class="cfa-toolbar"><h2>自動分類ルール</h2><button class="primary-button" onclick="cfaRuleNew_()">＋ ルールを追加</button></div>'+
  '<p>銀行摘要のキーワード、入出金、口座で自動判定します。優先度が高いルールを先に適用し、確定したメモは上書きしません。</p>'+form+
  '<div class="cf-scroll"><table class="cf-table"><thead><tr><th>キーワード</th><th>計上区分</th><th>タグ</th><th>優先度</th><th>状態</th><th>編集</th></tr></thead><tbody>'+
  (items||'<tr><td colspan="6">まだルールがありません。</td></tr>')+'</tbody></table></div></section>';
}
function cfaScenarioEditor_(){
 const u=cfaUi,d=u.scenarioDraft;if(!d)return '';
 const months=u.workspace&&u.workspace.months||[],plans=(cfbUi.loaded&&cfbUi.loaded.plans||[]).filter(p=>p.active);
 const types={SHIFT:'月をずらす',OMIT:'予定を除外',SCALE:'金額を変更',EXTRA:'臨時入出金'};
 const conditions=d.changes.map((c,i)=>{
  const selector='<select onchange="cfaScenarioField_('+i+',\'month\',this.value)">'+months.map(m=>'<option value="'+cfaEsc_(m)+'"'+(c.month===m?' selected':'')+'>'+cfaEsc_(m)+'</option>').join('')+'</select>';
  const chooser=c.type==='EXTRA'?
   '<select onchange="cfaScenarioField_('+i+',\'direction\',this.value)"><option value="OUT"'+(c.direction==='OUT'?' selected':'')+'>出金</option><option value="IN"'+(c.direction==='IN'?' selected':'')+'>入金</option></select>'+
    '<input type="number" min="0" value="'+c.amount+'" aria-label="臨時金額" oninput="cfaScenarioField_('+i+',\'amount\',this.value)" />'+
    '<input value="'+cfaEsc_(c.title)+'" maxlength="90" aria-label="臨時予定名" oninput="cfaScenarioField_('+i+',\'title\',this.value)" />':
   '<select aria-label="対象の予定" onchange="cfaScenarioField_('+i+',\'planId\',this.value)">'+plans.map(p=>'<option value="'+cfaEsc_(p.id)+'"'+(c.planId===p.id?' selected':'')+'>'+cfaEsc_(p.title)+'</option>').join('')+'</select>'+
   (c.type==='SHIFT'?'<input type="number" min="-6" max="6" value="'+c.monthsDelta+'" aria-label="移動月数" oninput="cfaScenarioField_('+i+',\'monthsDelta\',this.value)" />':
    c.type==='SCALE'?'<input type="number" min="0" max="200" value="'+c.percent+'" aria-label="変更後の割合（％）" oninput="cfaScenarioField_('+i+',\'percent\',this.value)" />':'');
  return '<div class="cfa-condition"><strong>'+(i+1)+'. '+types[c.type]+'</strong>'+selector+chooser+
   '<button class="secondary-button" onclick="cfaScenarioRemove_('+i+')">削除</button></div>';
 }).join('');
 return '<section class="card cfa-panel"><h2>シミュレーション条件を編集</h2><div class="cfa-editor">'+
  '<label>条件の名前<input maxlength="100" value="'+cfaEsc_(d.name)+'" oninput="cfaScenarioName_(this.value)" /></label>'+
  '<div class="cfa-condition-actions"><button class="secondary-button" onclick="cfaScenarioAdd_(\'SHIFT\')">入金・出金を遅らせる</button>'+
  '<button class="secondary-button" onclick="cfaScenarioAdd_(\'OMIT\')">契約不成立・予定除外</button>'+
  '<button class="secondary-button" onclick="cfaScenarioAdd_(\'SCALE\')">予定額を変更</button>'+
  '<button class="secondary-button" onclick="cfaScenarioAdd_(\'EXTRA\')">臨時入出金</button></div>'+
  (conditions||'<p>条件を追加してください。条件がない場合は通常計画と同じ結果です。</p>')+
  '<button class="primary-button" onclick="cfaScenarioSave_()"'+(u.busy?' disabled':'')+'>条件を保存</button>'+
  '<button class="secondary-button" onclick="cfaUi.scenarioDraft=null;renderPageIfActive(\'finance\')">閉じる</button></div></section>';
}
function cfaScenarioControls_(){
 const u=cfaUi,w=u.workspace||{};
 const options='<option value="">通常計画（ベースライン）</option>'+(w.scenarios||[]).map(x=>
  '<option value="'+cfaEsc_(x.id)+'"'+(u.scenarioId===x.id?' selected':'')+'>'+cfaEsc_(x.name)+'</option>').join('');
 return '<div class="cfa-toolbar"><label>比較する条件 <select onchange="cfaScenarioSelect_(this.value)">'+options+'</select></label>'+
  '<button class="primary-button" onclick="cfaScenarioNew_()">＋ シミュレーションを作る</button>'+
  (u.scenarioId?'<button class="secondary-button" data-id="'+cfaEsc_(u.scenarioId)+'" onclick="cfaScenarioNew_(this.dataset.id)">この条件を編集</button>':'')+'</div>';
}
function cfaForecastTable_(){
 const p=cfaUi.projection;if(!p||p.setupRequired)return '<p role="status">資金繰り予測を取得中です。</p>';
 const rows=(p.rows||[]).map(r=>'<tr><th>'+cfaEsc_(r.month)+'</th>'+
  '<td class="cf-num">'+cfaMoney_(r.plannedIn)+'</td><td class="cf-num">'+cfaMoney_(r.plannedOut)+'</td>'+
  '<td class="cf-num">'+cfaMoney_(r.actualIn)+'</td><td class="cf-num">'+cfaMoney_(r.actualOut)+'</td>'+
  '<td class="cf-num">'+cfaMoney_(r.forecastEnd)+'</td><td class="cf-num">'+cfaMoney_(r.difference)+'</td>'+
  '<td>'+cfaEsc_(r.source)+'</td></tr>').join('');
 return '<div class="cfa-summary"><div><span>11月末予測残高</span><strong>'+cfaMoney_(p.yearEnd)+'</strong></div>'+
  '<div><span>年間予定入金</span><strong>'+cfaMoney_(p.plannedIn)+'</strong></div>'+
  '<div><span>年間予定出金</span><strong>'+cfaMoney_(p.plannedOut)+'</strong></div>'+
  '<div><span>注意が必要な最初の月</span><strong>'+(p.firstShort?cfaEsc_(p.firstShort):'—')+'</strong></div></div>'+
  (p.warnings&&p.warnings.length?'<div class="cfa-warning" role="alert"><strong>要確認の項目</strong><ul>'+p.warnings.map(x=>'<li>'+cfaEsc_(x)+'</li>').join('')+'</ul></div>':'')+
  '<div class="cf-scroll"><table class="cf-table"><thead><tr><th>月</th><th>予定入金</th><th>予定出金</th><th>取込入金</th><th>取込出金</th><th>見込み残高</th><th>通常との差</th><th>根拠</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function cfaScenariosPage_(){
 return '<section class="card cfa-panel"><h2>条件別の資金繰りを比較する</h2><p>元の計画・銀行明細には手を加えません。入金遅延、契約不成立、設備投資などを条件として保存します。</p>'+
  cfaScenarioControls_()+cfaForecastTable_()+'</section>'+cfaScenarioEditor_();
}
function cfaReportsPage_(){
 const u=cfaUi,p=u.projection;
 return '<section class="card cfa-panel"><h2>金融機関・税理士に提出する資金繰り表</h2>'+
  '<p>2026年11月期など、前年12月から11月までの年間表を作成します。提出する前に実績確定月・銀行残高・未分類明細を確認してください。</p>'+
  cfaScenarioControls_()+cfaForecastTable_()+
  '<div class="cfa-export"><p>帳票には「予定／確定実績」の区別、比較条件、月別残高、銀行月次照合、明細分類を付けます。未照合や未入力がある場合、帳票に要確認と表示されます。</p>'+
  '<button class="primary-button" onclick="cfaDownloadReport_(\'XLSX\')"'+(u.exporting||!p||p.setupRequired?' disabled':'')+'>年間資金繰りをExcel出力</button>'+
  '<button class="secondary-button" onclick="cfaDownloadReport_(\'PDF\')"'+(u.exporting||!p||p.setupRequired?' disabled':'')+'>年間資金繰りをPDF出力</button>'+
  (u.exporting?'<span role="status">帳票を作成中です...</span>':'')+'</div></section>';
}
function cfaPage_(){
 if(cfaUi.year!==cashFlowUi.year)cfaEnsureYear_();
 const u=cfaUi;if(cfbUi.demo)return '<section class="card cfa-panel"><h2>資金管理</h2><p>架空データ表示では本番用の分類・照合や帳票を保存できません。実データへ戻ってください。</p></section>';
 if(!u.workspace){if(!u.loading)cfaLoad_(true);return '<section class="card cfa-panel">明細・分類ルール・照合を読み込み中です。</section>';}
 if(u.workspace.setupRequired)return '<section class="card cfa-panel"><h2>初回設定が必要です</h2><p>個別メモ・分類ルール・銀行照合を保存するため、管理者によるバックアップ付きDB更新が必要です。</p>'+
  '<button class="primary-button" onclick="cfbSetup_()">バックアップして初期設定する</button></section>';
 const feedback=(u.error?'<p class="finance-error" role="alert">'+cfaEsc_(u.error)+'</p>':'')+
  (u.notice?'<p class="cf-success" role="status">'+cfaEsc_(u.notice)+'</p>':'');
 return '<div class="cfa-workspace">'+feedback+
  (cfbUi.tab==='analysis'?cfaAnalysisPage_():cfbUi.tab==='scenarios'?cfaScenariosPage_():cfaReportsPage_())+
  '</div>';
}
</script>
