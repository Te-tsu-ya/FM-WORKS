<script>
/* FM WORKS Rotary Loader - adapted from supplied production ZIP.
 * Front-fixed epitrochoid housing, eccentric 3:1 shaft/rotor and original palette.
 * No tachometer, plugs or external pins. Dependency-free and text-safe.
 */
(function(global){
'use strict';
const PI=Math.PI,TAU=PI*2,R=6.5,E=1,ARC=TAU/3,BOW=.14*R;
const fmt=n=>Number(n.toFixed(4));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function housingPoint(t){return {x:R*Math.cos(t)+E*Math.cos(3*t),y:R*Math.sin(t)+E*Math.sin(3*t)}}
function housingPath(){let s='';for(let i=0;i<=300;i++){const p=housingPoint(i/300*TAU);s+=(i?' L':'M')+fmt(p.x)+' '+fmt(p.y)}return s+' Z'}
function rotorShape(){const tips=[0,1,2].map(i=>({x:R*Math.cos(i*ARC),y:R*Math.sin(i*ARC)}));let s='M '+fmt(tips[0].x)+' '+fmt(tips[0].y);
for(let i=0;i<3;i++){const p=tips[i],q=tips[(i+1)%3],m={x:(p.x+q.x)/2,y:(p.y+q.y)/2};const d=Math.hypot(m.x,m.y);const ctrl={x:m.x+2*BOW*m.x/d,y:m.y+2*BOW*m.y/d};s+=' Q '+fmt(ctrl.x)+' '+fmt(ctrl.y)+' '+fmt(q.x)+' '+fmt(q.y)}return s+' Z'}
function gearPath(outer,inner,teeth){let s='';for(let i=0;i<teeth*4;i++){const a=i*TAU/(teeth*4),rad=i%4===1||i%4===2?outer:inner;s+=(i?' L':'M')+' '+fmt(rad*Math.cos(a))+' '+fmt(rad*Math.sin(a))}return s+' Z'}
const HOUSING=housingPath(),ROTOR=rotorShape(),INNER=gearPath(3.05,2.83,30),STATIONARY=gearPath(2,1.83,20);
const pads=[0,1,2].map(i=>{const a=i*ARC,x=fmt(4.12*Math.cos(a)),y=fmt(4.12*Math.sin(a));return '<ellipse cx="'+x+'" cy="'+y+'" rx=".91" ry=".40" transform="rotate('+fmt(a*180/PI)+' '+x+' '+y+')" class="fmr-pad"/>'}).join('');
let serial=0,pageLocks=0,oldOverflow='';
function svgMarkup(id){
const p='fmr'+id;return '<svg class="fmr-engine-svg" viewBox="-11 -11 22 22" focusable="false" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">'+
'<defs><linearGradient id="'+p+'-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5fbff"/><stop offset=".31" stop-color="#86accb"/><stop offset=".54" stop-color="#e4f5ff"/><stop offset="1" stop-color="#7398bd"/></linearGradient>'+
'<linearGradient id="'+p+'-face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".39" stop-color="#d7edff"/><stop offset="1" stop-color="#80bce9"/></linearGradient>'+
'<radialGradient id="'+p+'-chamber"><stop offset="0" stop-color="#3c74ae"/><stop offset=".76" stop-color="#15375f"/><stop offset="1" stop-color="#09243f"/></radialGradient></defs>'+
'<g transform="rotate(90)"><path d="'+HOUSING+'" fill="#527fa8" stroke="url(#'+p+'-rim)" stroke-width="2.05" stroke-linejoin="round"/>'+
'<path d="'+HOUSING+'" fill="url(#'+p+'-chamber)" stroke="#2b659c" stroke-width=".38"/>'+
'<path d="'+HOUSING+'" fill="none" stroke="#bde6ff" stroke-width=".15" opacity=".85"/>'+
'<g class="fmr-shaft"><path d="M 0 0 L 1 0" stroke="#d9eafa" stroke-width=".22" opacity=".7"/><circle cx="1" cy="0" r=".91" fill="#234b75" stroke="#f1f8ff" stroke-width=".14"/></g>'+
'<g class="fmr-rotor"><path d="'+ROTOR+'" fill="url(#'+p+'-face)" stroke="#224b77" stroke-width=".20" stroke-linejoin="round"/>'+
'<path d="'+ROTOR+'" fill="none" stroke="#ffffff" stroke-width=".075" opacity=".93"/>'+pads+
'<circle r="3.34" fill="#ccedff" stroke="#f7fdff" stroke-width=".12"/>'+
'<path d="'+INNER+'" fill="#f5fcff" stroke="#3f79a8" stroke-width=".10"/>'+
'<circle r="2.65" fill="#28527c"/><circle r="2.35" fill="#acd8f4" stroke="#effaff" stroke-width=".12"/>'+
'<circle r="1.35" fill="#174570" opacity=".95"/><circle r=".92" fill="#9ccff5" stroke="#ecfcff" stroke-width=".08"/></g>'+
'<path d="'+STATIONARY+'" class="fmr-fixed-gear" fill="#f7fcff" stroke="#4d83ac" stroke-width=".11"/>'+
'<circle r="1.54" fill="#5d9cce" stroke="#f3fbff" stroke-width=".08"/>'+
'<circle r=".93" fill="#1a4269"/><circle r=".58" fill="#092c52"/><circle cx="-.19" cy="-.21" r=".18" fill="#fff" opacity=".91"/></g></svg>';
}
function markup(uid){return '<div class="fmr-content"><div class="fmr-visual">'+svgMarkup(uid)+'</div>'+
'<p class="fmr-message">読み込んでいます…</p><p class="fmr-submessage">しばらくお待ちください</p>'+
'<div class="fmr-progress" role="progressbar" aria-label="読み込み進捗" aria-valuemin="0" aria-valuemax="100"><span class="fmr-track"><span class="fmr-fill"></span></span><span class="fmr-progress-value">0%</span></div>'+
'<p class="fmr-slow">通常より時間がかかっています。通信状況をご確認ください。</p>'+
'<div class="fmr-actions"><button type="button" class="fmr-action fmr-retry" hidden>もう一度試す</button>'+
'<button type="button" class="fmr-action fmr-close" hidden>閉じる</button></div></div>'}
class FMRotaryLoader{
constructor(options={}){
this.options={mode:'page',delay:160,minVisible:270,slowAfter:10000,speed:1,label:'FM WORKSを読み込んでいます…',...options};
this.mode=this.options.mode;
if(!['page','region','inline'].includes(this.mode))throw Error('Invalid rotary loader mode');
this.options.delay=options.delay===undefined?(this.mode==='page'?0:160):Math.max(0,Number(options.delay)||0);
this.options.speed=clamp(Number(this.options.speed)||1,.4,2);
this.options.minVisible=Math.max(0,Number(this.options.minVisible)||0);
this.host=this.options.host||document.body;
if(!(this.host instanceof HTMLElement))throw Error('Rotary loader requires HTML host');
this._hostPositionWas=null;
if(this.mode==='region'&&getComputedStyle(this.host).position==='static'){
this._hostPositionWas=this.host.style.position;this.host.style.position='relative';
}
this.uid=++serial;this.root=document.createElement('div');
this.root.className='fmr-root fmr-'+this.mode+(options.compact?' fmr-compact-region':'');
this.root.setAttribute('role','status');this.root.setAttribute('aria-live','polite');
this.root.innerHTML=markup(this.uid);this.host.appendChild(this.root);
const q=selector=>this.root.querySelector(selector);
this.rotor=q('.fmr-rotor');this.shaft=q('.fmr-shaft');
this.message=q('.fmr-message');this.sub=q('.fmr-submessage');
this.progressEl=q('.fmr-progress');this.bar=q('.fmr-fill');this.percent=q('.fmr-progress-value');
this.slow=q('.fmr-slow');this.retryBtn=q('.fmr-retry');this.closeBtn=q('.fmr-close');
this.retryBtn.addEventListener('click',()=>this._retry());
this.closeBtn.addEventListener('click',()=>this.hide());
this._reduceQuery=global.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
this._onVisibility=()=>{if(document.hidden)this._stopAnimation();else this._resumeAnimation()};
document.addEventListener('visibilitychange',this._onVisibility);
this._onMotion=()=>{if(this._reduceQuery.matches)this._stopAnimation();else this._resumeAnimation()};
if(this._reduceQuery.addEventListener)this._reduceQuery.addEventListener('change',this._onMotion);
this.state='idle';this.activeToken=0;this._shown=false;this._locked=false;this._angle=-3*PI/2;
this._frame=0;this._frameAt=0;this._visibleAt=0;this._showTimer=0;this._slowTimer=0;this._closeTimer=0;this._progress=null;this._displayProgress=0;this._retryFn=null;
this._setGeometry();
}
_setGeometry(){const a=this._angle,deg=a*180/PI;this.rotor.setAttribute('transform','translate('+fmt(E*Math.cos(a))+' '+fmt(E*Math.sin(a))+') rotate('+fmt(deg/3)+')');this.shaft.setAttribute('transform','rotate('+fmt(deg)+')')}
_stopAnimation(){if(this._frame)cancelAnimationFrame(this._frame);this._frame=0;this._frameAt=0}
_resumeAnimation(){if(!this._shown||this.state!=='loading'||this._reduceQuery.matches||document.hidden||this._frame)return;this._frame=requestAnimationFrame(t=>this._animate(t))}
_animate(t){
this._frame=0;if(!this._shown||this.state!=='loading'||this._reduceQuery.matches||document.hidden)return;
const dt=this._frameAt?Math.min(.06,(t-this._frameAt)/1000):0;this._frameAt=t;
const p=this._progress===null?null:this._progress/100;
if(p!==null)this._displayProgress+=(p-this._displayProgress)*Math.min(1,dt*5);
const rps=(p===null?1.22:1.17+.65*Math.pow(this._displayProgress,1.2))*this.options.speed;
this._angle+=TAU*3*rps*dt;if(this._angle>TAU*3000)this._angle-=TAU*3000;
this._setGeometry();this._frame=requestAnimationFrame(t2=>this._animate(t2));
}
_lockPage(){if(this.mode!=='page'||this._locked)return;if(!pageLocks){oldOverflow=document.body.style.overflow;document.body.style.overflow='hidden'}pageLocks++;this._locked=true}
_unlockPage(){if(!this._locked)return;pageLocks=Math.max(0,pageLocks-1);if(!pageLocks)document.body.style.overflow=oldOverflow;this._locked=false}
_show(){if(this._shown||this.state==='idle'||this.state==='destroyed')return;this._shown=true;this._visibleAt=performance.now();this.root.classList.add('fmr-visible');this._lockPage();this._resumeAnimation()}
_clearTimers(){clearTimeout(this._showTimer);clearTimeout(this._slowTimer);clearTimeout(this._closeTimer);this._showTimer=this._slowTimer=this._closeTimer=0}
_resetVisible(){this._stopAnimation();this.root.classList.remove('fmr-visible');this._shown=false;this._unlockPage()}
_announce(text){this.message.textContent=text;this.root.setAttribute('aria-label',text)}
_updateProgress(){const known=this._progress!==null;this.progressEl.classList.toggle('fmr-has-progress',known);if(known){const value=Math.round(this._progress);this.percent.textContent=value+'%';this.bar.style.width=this._progress+'%';this.progressEl.setAttribute('aria-valuenow',String(value))}else this.progressEl.removeAttribute('aria-valuenow')}
start({label,progress=null}={}){
if(this.state==='destroyed')throw Error('Rotary loader destroyed');
const keep=this._shown;this._clearTimers();this._stopAnimation();this.activeToken++;
if(!keep)this._resetVisible();
this.state='loading';this._progress=progress===null?null:clamp(Number(progress)||0,0,100);
this._displayProgress=this._progress===null?0:this._progress/100;this._retryFn=null;
this._shown=keep;if(keep)this._visibleAt=performance.now();
this.slow.classList.remove('fmr-show');this.root.classList.remove('fmr-error','fmr-success');
this.retryBtn.hidden=true;this.closeBtn.hidden=true;
this._announce(label||this.options.label);this.sub.textContent='しばらくお待ちください';this._updateProgress();
const token=this.activeToken;
if(keep)this._resumeAnimation();else this._showTimer=setTimeout(()=>{if(token===this.activeToken&&this.state==='loading')this._show()},this.options.delay);
if(this.options.slowAfter>0)this._slowTimer=setTimeout(()=>{if(token===this.activeToken&&this.state==='loading')this.slow.classList.add('fmr-show')},this.options.slowAfter);
return token;
}
setProgress(p,token=this.activeToken){
if(this.state!=='loading'||token!==this.activeToken)return false;
if(p===null||p===undefined)this._progress=null;else{const v=Number(p);if(!Number.isFinite(v))return false;this._progress=clamp(v,0,100)}
this._updateProgress();return true;
}
complete(token=this.activeToken){
if(this.state!=='loading'||token!==this.activeToken)return false;
this._clearTimers();this._stopAnimation();this.state='success';
// Unknown GAS work never receives a fabricated 100%, including the success flash.
this._progress=this._progress===null?null:100;this._updateProgress();
this.root.classList.add('fmr-success');this._announce('読み込みが完了しました');this.sub.textContent='完了';
if(!this._shown){this._resetVisible();this.state='idle';return true}
const wait=Math.max(0,this.options.minVisible-(performance.now()-this._visibleAt));
this._closeTimer=setTimeout(()=>this.hide(token),wait);return true;
}
fail(message='通信に失敗しました',{retry,token=this.activeToken}={}){
if(this.state!=='loading'||token!==this.activeToken)return false;
this._clearTimers();this._stopAnimation();this.state='error';this._progress=null;this._updateProgress();
this.root.classList.add('fmr-error');this._announce('読み込みに失敗しました');
this.sub.textContent=typeof message==='string'&&message?message:'通信状態を確認してください';
this._retryFn=typeof retry==='function'?retry:null;this.retryBtn.hidden=!this._retryFn;this.closeBtn.hidden=false;
this.slow.classList.remove('fmr-show');this._show();return true;
}
_retry(){if(!this._retryFn)return;const f=this._retryFn;this.hide();f()}
hide(token=this.activeToken){if(token!==this.activeToken||this.state==='destroyed')return false;this._clearTimers();this._resetVisible();this.state='idle';this._retryFn=null;return true}
setSpeed(v){if(!Number.isFinite(Number(v)))return false;this.options.speed=clamp(Number(v),.4,2);return true}
destroy(){
if(this.state==='destroyed')return;this.hide();
document.removeEventListener('visibilitychange',this._onVisibility);
if(this._reduceQuery.removeEventListener)this._reduceQuery.removeEventListener('change',this._onMotion);
this.root.remove();if(this._hostPositionWas!==null)this.host.style.position=this._hostPositionWas;
this.state='destroyed';
}
}
global.FMRotaryLoader=FMRotaryLoader;
global.FMRotaryGeometry=Object.freeze({housingPoint,rotorShape,R,E});
})(window);
</script>
