<script>
/* FM WORKS rotary activity integration. Covers every foreground GAS RPC without
 * changing individual success/failure handlers. The supplied rotary component is
 * the visual engine; this file binds it to real request lifecycle events.
 * Percent remains hidden because FMApi.run does not report true progress.
 */
(function(global){
'use strict';
let activity=null,sequence=0;
/* Per-method network timings: no inputs, tokens, results, employee IDs, or
 * financial records are captured. In-memory only, reset on logout.
 * This measures browser-observed RPC round trips, not server-only execution. */
const rpcPerfSamples=new Map();
let rpcPerfGeneration=0;
let rpcCallbackGeneration=0,readGeneration=0;
const sharedReads=new Map();
let coalescedReads=0;
let authenticatedMountMs=null;
function recordAuthenticatedMountMs(ms){
 const v=Number(ms);
 if(Number.isFinite(v)&&v>=0&&v<120000)authenticatedMountMs=Math.round(v);
}
function navigationTimings_(){
 try{
  const perf=global.performance,entry=perf&&typeof perf.getEntriesByType==='function'?
    (perf.getEntriesByType('navigation')||[])[0]:null;
  const value=v=>Number.isFinite(v)&&v>=0?Math.round(v):null;
  return {htmlResponseMs:entry?value(entry.responseEnd):null,
    domContentLoadedMs:entry?value(entry.domContentLoadedEventEnd):null};
 }catch(_){return {htmlResponseMs:null,domContentLoadedMs:null}}
}
function rpcPerfReset(){rpcPerfGeneration++;rpcPerfSamples.clear();coalescedReads=0;}
function rpcPerfNow(){
 const perf=global.performance;
 return perf&&typeof perf.now==='function'?perf.now():Date.now();
}
function rpcPerfRecord(method,started,failed){
 const elapsed=Math.max(0,Math.round(rpcPerfNow()-started));
 if(!Number.isFinite(elapsed))return;
 let row=rpcPerfSamples.get(method);
 if(!row){row={calls:0,failures:0,samples:[],lastMs:0};rpcPerfSamples.set(method,row);}
 row.calls++;
 if(failed)row.failures++;
 row.lastMs=elapsed;
 row.samples.push(elapsed);
 if(row.samples.length>80)row.samples.shift();
}
function rpcPerfReport(){
 const methods=[...rpcPerfSamples.entries()].map(([method,row])=>{
  const samples=row.samples.slice().sort((a,b)=>a-b);
  const value=p=>samples.length?samples[Math.max(0,Math.ceil(samples.length*p)-1)]:null;
  return {method,calls:row.calls,failures:row.failures,p50Ms:value(0.5),p95Ms:value(0.95),lastMs:row.lastMs};
 }).sort((a,b)=>(b.p95Ms||0)-(a.p95Ms||0)||a.method.localeCompare(b.method));
 return {scope:'current-browser-tab',sampleWindow:80,coalescedReads,methods,startup:{...navigationTimings_(),authenticatedMountMs}};
}
global.FMWorksPerformance=Object.freeze({report:rpcPerfReport,clear:rpcPerfReset,recordAuthenticatedMountMs});
const authMethods=new Set(['getPublicAuthConfig','resumeSession','getInitialData','login','initializeFirstAdmin']);
const quietMethods=new Set(['getNotifications','ensureDailyBackup']);
const labels={
getPublicAuthConfig:'ログイン画面を準備しています…',
resumeSession:'ログイン状態を確認しています…',
getInitialData:'勤怠データを読み込んでいます…',
login:'ログインしています…',
initializeFirstAdmin:'初期設定を保存しています…',
getHomeOverview:'ホームの集計を読み込んでいます…',
getCompanyDocuments:'社内文書を読み込んでいます…',
getCompanyDocument:'文書本文を読み込んでいます…',
searchCompanyDocumentBodies:'社内文書を検索しています…',
getFinanceOverview:'経理データを読み込んでいます…',
getQuoteWorkspace:'見積データを読み込んでいます…',
getAttendancePreview:'勤怠データを読み込んでいます…',
getWorklogWindow:'工数データを読み込んでいます…',
getMonthly:'月次データを読み込んでいます…'
};
function readable(method){
if(labels[method])return labels[method];
if(/^(record|save|create|update|upsert|submit|approve|reject|delete|remove|cancel|settle|initialize|apply|set|change|process)/i.test(method))return '変更内容を保存しています…';
if(/^(search|find)/i.test(method))return '検索しています…';
if(/^(import|export|generate|createPdf)/i.test(method))return '書類を処理しています…';
return 'データを読み込んでいます…';
}
function isBackground(method){
  if(quietMethods.has(method))return true;
  if(/Notification|ensureDailyBackup/.test(method))return true;
  // Ambient global search is displayed near its input, not over the whole page.
  return false;
}
function zoneFor(method){
  if(authMethods.has(method))return 'page';
  if(/GlobalSearch|searchGlobal/i.test(method))return 'inline';
  return 'region';
}
function ensureActivity(){
if(activity)return activity;
if(typeof FMRotaryLoader!=='function')return null;
const body=document.body,content=document.querySelector('#app .workspace');
if(!body||!content)return null;
const page=new FMRotaryLoader({mode:'page',host:body,delay:0,minVisible:270,slowAfter:10000});
const region=new FMRotaryLoader({mode:'region',host:content,delay:160,minVisible:270,slowAfter:10000});
const inlineHost=document.querySelector('.search-wrap');
const inline=inlineHost?new FMRotaryLoader({mode:'inline',host:inlineHost,delay:160,minVisible:120,slowAfter:10000}):null;
const loaders={page,region,inline};
const pending={page:new Map(),region:new Map(),inline:new Map()};
const versions={page:0,region:0,inline:0};
let bootstrap=true,bootstrapToken=page.start({label:'FM WORKSを読み込んでいます…'});
let currentRoute=null;
function refresh(zone){
 const loader=loaders[zone];if(!loader)return;
 const map=pending[zone];
 if(zone==='region'&&map.size){
   const readsOnly=Array.from(map.values()).every(info=>/^(get|list|find|search|healthCheck)/i.test(info.method));
   loader.root.classList[readsOnly?'add':'remove']('fmr-read-status');
 }
 if(zone==='page'&&bootstrap){
   // Startup is held until the first actual authentication/config result arrives.
   if(map.size)loader.sub.textContent='サーバーと通信しています…';
   return;
 }
 if(map.size){
   const newest=Array.from(map.values()).at(-1);
   if(loader.state!=='loading'){
     versions[zone]=loader.start({label:newest.label,progress:null});
   }else{
     loader._announce(newest.label);
   }
   if(zone!=='inline')loader.sub.textContent=map.size>1?map.size+'件の処理を確認しています…':'サーバーと通信しています…';
 }else{
   if(loader.state==='loading')loader.complete(versions[zone]);
 }
}
function begin(method){
if(isBackground(method))return null;
const zone=zoneFor(method);
if(!loaders[zone])return null;
const id=++sequence;
pending[zone].set(id,{method,label:readable(method),started:performance.now(),route:currentRoute});
if(zone==='page'&&bootstrap){
 page._announce(readable(method));
 page.sub.textContent='サーバーと通信しています…';
}else refresh(zone);
return {id,zone};
}
function settle(task,error){
if(!task)return;
const zone=task.zone,map=pending[zone],loader=loaders[zone];
if(!map||!map.has(task.id))return;
map.delete(task.id);
if(zone==='page'&&bootstrap){
 if(!map.size){
   bootstrap=false;
   if(error)page.fail('通信状態を確認し、画面の案内に従って再試行してください。',{token:bootstrapToken});
   else page.complete(bootstrapToken);
 }else page._announce(Array.from(map.values()).at(-1).label);
 return;
}
if(map.size){refresh(zone);return}
if(error&&loader&&loader.state==='loading'){
 loader.fail('通信状態を確認し、再試行してください。',{token:versions[zone]});
}else refresh(zone);
}
function reset(){
 rpcCallbackGeneration++;readGeneration++;sharedReads.clear();
 for(const zone of ['page','region','inline']){
   pending[zone].clear();
   if(loaders[zone])loaders[zone].hide();
 }
 bootstrap=false;currentRoute=null;
 rpcPerfReset();
}
function route(next){
 currentRoute=next;
 // Old-route reads are still free to finish and update caches, but must not
 // obstruct a newly opened page. Leave actual RPC handlers untouched.
 for(const [id,info] of pending.region){
   if(info.route!==null&&info.route!==next)pending.region.delete(id);
 }
 if(!pending.region.size&&region.state==='loading')region.hide();
}
activity={begin,settle,reset,route,loaders,pending,snapshot:()=>({
  bootstrap,pending:Object.fromEntries(Object.entries(pending).map(([z,m])=>[z,m.size])),
  state:Object.fromEntries(Object.entries(loaders).map(([z,l])=>[z,l&&l.state||'none']))
})};
global.FMRotaryActivity=activity;
return activity;
}
/* Chain-compatible proxy for FMApi.run. It only wraps callbacks and
 * dispatch; method arguments, user objects, and API results remain unchanged.
 * The direct Sites API transport is available without this wrapper.
 */
function FMRotaryRPC(){
const raw=global.FMApi&&global.FMApi.run;
if(!raw)throw Error('GAS client is unavailable');
let success=null,failure=null,userObject,hasUserObject=false;
let proxy=null;
proxy=new Proxy(Object.create(null),{get(_target,prop){
 if(prop==='withSuccessHandler')return fn=>{success=fn;return proxy};
 if(prop==='withFailureHandler')return fn=>{failure=fn;return proxy};
 if(prop==='withUserObject')return value=>{hasUserObject=true;userObject=value;return proxy};
 if(prop==='then')return undefined;
 if(typeof prop!=='string')return undefined;
 return (...args)=>{
   const callbackGeneration=rpcCallbackGeneration;
   const listener={success,failure,userObject,hasUserObject};
   const read=/^(get|list|search|find)/.test(prop)||/^(resumeSession|previewRequest|healthCheck)$/.test(prop);
   let key='';
   if(read){
     try{key=callbackGeneration+'|'+readGeneration+'|'+prop+'|'+JSON.stringify(args);}catch(_){}
     const shared=key&&sharedReads.get(key);
     if(shared){shared.listeners.push(listener);coalescedReads++;return;}
   }else{
     // A read begun before a write cannot satisfy a later refresh request.
     readGeneration++;sharedReads.clear();
   }
   const entry={listeners:[listener]};
   if(key&&sharedReads.size<32)sharedReads.set(key,entry);
   const tracking=ensureActivity();
   const task=tracking&&tracking.begin(prop);
   const perfStarted=rpcPerfNow(),perfGeneration=rpcPerfGeneration;
   let ended=false,recorded=false,timeoutId=null;
   const READ_TIMEOUT_MS=45000;
   const record=error=>{
     if(recorded)return;recorded=true;
     if(perfGeneration===rpcPerfGeneration)rpcPerfRecord(prop,perfStarted,!!error);
   };
   const finish=error=>{
     if(ended)return;ended=true;
     if(timeoutId!==null&&typeof global.clearTimeout==='function')global.clearTimeout(timeoutId);
     record(error);
     if(tracking)tracking.settle(task,error);
   };
   const deliver=(failed,values)=>{
     if(ended)return; // Never apply responses arriving after the timeout.
     if(key&&sharedReads.get(key)===entry)sharedReads.delete(key);
     if(callbackGeneration!==rpcCallbackGeneration){finish(null);return;}
     record(failed?values[0]||new Error('RPC request failed'):null);
     let thrown;
     try{
       if(failed&&/AUTH_REQUIRED|SESSION_EXPIRED/.test(String(values[0]&&values[0].message||values[0]))&&typeof global.handleApiError==='function')global.handleApiError(values[0]);
       if(!failed&&typeof global.invalidateBusinessViewsAfterWrite==='function')global.invalidateBusinessViewsAfterWrite(prop,values[0]);
       for(const target of entry.listeners){
         if(callbackGeneration!==rpcCallbackGeneration)break;
         const handler=failed?target.failure:target.success;
         if(typeof handler!=='function')continue;
         try{
           // Shared reads give each consumer an independent snapshot.
           const value=!failed&&entry.listeners.length>1&&values[0]!==undefined?JSON.parse(JSON.stringify(values[0])):values[0];
           if(target.hasUserObject)handler(value,target.userObject);else handler(value);
         }catch(error){if(!thrown)thrown=error;}
       }
     }finally{finish(failed?values[0]||new Error('RPC request failed'):null);}
     if(thrown)throw thrown;
   };
   try{
     const runner=raw.withSuccessHandler((...values)=>deliver(false,values))
       .withFailureHandler((...values)=>deliver(true,values));
     if(typeof runner[prop]!=='function')throw Error('Unknown RPC method: '+prop);
     // Do not add a client timeout to financial/attendance writes:
     // the server may commit even when its response is lost.
     if(read&&typeof global.setTimeout==='function'){
       timeoutId=global.setTimeout(()=>{
         const error=new Error('NETWORK_TIMEOUT: 読み込みの応答がありません。再読込してください。');
         error.name='TimeoutError';
         deliver(true,[error]);
       },READ_TIMEOUT_MS);
     }
     return runner[prop](...args);
   }catch(error){if(key&&sharedReads.get(key)===entry)sharedReads.delete(key);finish(error);throw error}
 };
}});
return proxy;
}
global.FMRotaryRPC=FMRotaryRPC;
global.FMRotaryInit=ensureActivity;
// Display the rotor from the first HTML paint, before authentication begins.
// Calls occur only after the body's app elements have been parsed.
try{ensureActivity()}catch(e){if(global.console)console.warn('Rotary startup fallback',e)}
})(window);
</script>
