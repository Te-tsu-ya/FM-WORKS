<script>
function authStateBadge(emp){
  if(emp.lockedUntil) return "<span class='auth-state locked'>ロック中</span>";
  if(!emp.pinConfigured) return "<span class='auth-state pending'>PIN未設定</span>";
  if(emp.mustChangePin) return "<span class='auth-state pending'>初回変更待ち</span>";
  return "<span class='auth-state'>利用可能</span>";
}


const ADMIN_CATEGORIES=[
  {id:'people',label:'社員・権限',short:'社員',icon:'人',help:'社員情報、権限と年休を管理'},
  {id:'auth',label:'認証・サポート',short:'認証',icon:'鍵',help:'PIN、ロックとサポート'},
  {id:'projects',label:'プロジェクト',short:'案件',icon:'案',help:'工数で利用する案件マスタ'},
  {id:'quotes',label:'見積・取引先',short:'取引先',icon:'見',help:'取引先マスタと正式見積番号を管理'},
  {id:'operation',label:'運用・労務',short:'運用',icon:'運',help:'労務ルールと運用状態'},
  {id:'performance',label:'通信速度',short:'速度',icon:'速',help:'このタブの通信待ち時間を確認'},
  {id:'requirements',label:'要件定義書',short:'要件',icon:'文',help:'アプリの要件と業務ルール'},
  {id:'technical',label:'技術設計書',short:'設計',icon:'技',help:'実装・データ設計'}
];
function createAdminUiState(){
  return {selectedEmployeeId:'',detailTab:'basic',search:'',role:'ALL',status:'ALL',menuOpen:false,wizard:false,wizardStep:1,saving:false};
}
function selectAdminSection(id){
  if(!ADMIN_CATEGORIES.some(item=>item.id===id))return;
  state.adminUi.menuOpen=false;
  state.adminTab=id;
  if(id==='people'){
    if(state.page!=='people')navigate('people');
    else renderPageIfActive('people');
  }else setAdminTab(id);
}
function toggleAdminMenu(){
  state.adminUi.menuOpen=!state.adminUi.menuOpen;
  renderPage();
}
function adminStatAction(mode){
  const ui=state.adminUi;
  if(mode==='employees'){ui.status='active';ui.role='ALL';}
  else if(mode==='admins'){ui.status='ALL';ui.role='ADMIN';}
  else if(mode==='leave'){ui.status='leave';ui.role='ALL';}
  else if(mode==='pin'){selectAdminSection('auth');return;}
  ui.search='';
  selectAdminSection('people');
}
function adminOverviewStats(){
  const records=state.authAdmin&&Array.isArray(state.authAdmin.employees)?state.authAdmin.employees:null;
  const count=fn=>records?String(records.filter(fn).length):'—';
  const rows=[
    ['在籍社員',count(e=>e.active!==false),'employees','staff'],
    ['管理者',count(e=>e.active!==false&&e.role==='ADMIN'),'admins','manager'],
    ['年休未設定',count(e=>e.active!==false&&!e.leaveBalanceConfigured&&!(e.autoLeaveForecast&&e.autoLeaveForecast.status==='SCHEDULED')),'leave','leave'],
    ['PIN要確認',count(e=>e.active!==false&&(!e.pinConfigured||!!e.lockedUntil)),'pin','pin']
  ];
  return `<section class='admin-overview' aria-label='管理状況'>
    ${rows.map(([label,num,action,tone])=>`<button type='button' class='admin-overview-card ${tone}'
      onclick="adminStatAction('${action}')" aria-label='${escapeHtml(label)} ${escapeHtml(num)}件。関連画面を開く'>
      <span>${escapeHtml(label)}</span><strong>${escapeHtml(num)}</strong>
      <small>${records?'クリックして確認':'管理データを読み込み中'}</small></button>`).join('')}
  </section>`;
}
function adminWorkspaceShell(active,content,action='',navigation=''){
  const current=ADMIN_CATEGORIES.find(item=>item.id===active)||ADMIN_CATEGORIES[0];
  const nav=navigation||settingsTabs(active);
  return `<div class='admin-hybrid settings-screen'>
    ${pageHead('管理','社員・権限・年休台帳や業務マスタを一か所で管理します。',action)}
    ${adminOverviewStats()}
    <button type='button' class='admin-nav-mobile-toggle' aria-expanded='${!!state.adminUi.menuOpen}'
      aria-controls='adminInternalNavigation' onclick='toggleAdminMenu()'>管理メニュー：${escapeHtml(current.label)} <span aria-hidden='true'>${state.adminUi.menuOpen?'▲':'▼'}</span></button>
    <div class='admin-workspace-body'>
      <aside id='adminInternalNavigation' class='admin-internal-sidebar ${state.adminUi.menuOpen?'is-open':''}'>${nav}</aside>
      <main class='admin-workspace-main' aria-label='${escapeHtml(current.label)}'>
        <header class='admin-workspace-heading'><div><span class='eyebrow'>ADMINISTRATION</span>
          <h2>${escapeHtml(current.label)}</h2><p>${escapeHtml(current.help)}</p></div></header>
        <div class='settings-content admin-workspace-content'>${content}</div>
      </main>
    </div>
  </div>`;
}


function settingsTabs(activeOverride){
  const active=activeOverride||state.adminTab;
  return `<nav class='settings-tabs admin-workspace-tabs admin-side-nav' aria-label='管理の設定項目'>
    <span class='admin-nav-caption'>管理メニュー</span>
    ${ADMIN_CATEGORIES.map(item=>`<button type='button' class='${active===item.id?'active':''}'
      data-admin-tab='${item.id}' aria-current='${active===item.id?'page':'false'}'
      onclick='selectAdminSection(this.dataset.adminTab)'>
      <span class='admin-nav-icon' aria-hidden='true'>${item.icon}</span>
      <span class='admin-nav-label'><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.help)}</small></span>
      <span class='admin-nav-arrow' aria-hidden='true'>›</span>
    </button>`).join('')}
  </nav>`;
}
function setAdminTab(tab){
  if(!ADMIN_CATEGORIES.some(item=>item.id===tab))return;
  if(tab==='people'){selectAdminSection('people');return;}
  state.adminTab=tab;
  state.adminUi.menuOpen=false;
  if(state.page!=='admin'){navigate('admin');return;}
  renderNav();renderPage();
  if(tab==='auth')loadAuthAdmin({scope:'auth'});
  if(tab==='projects')loadAuthAdmin({scope:'projects'});
  if(tab==='operation')loadMaintenance();
  if(tab==='quotes')loadQuoteWorkspace({silent:true});
  if(tab==='requirements')loadSystemDocument('requirements');
  if(tab==='technical')loadSystemDocument('technical');
}

function authSettingsSection(){
  if(!state.authAdmin)return "<div class='loading-card'></div>";
  const a=state.authAdmin,configured=a.employees.filter(e=>e.pinConfigured).length,locked=a.employees.filter(e=>e.lockedUntil).length,pending=(a.resetRequests||[]).filter(r=>r.status==='未対応').length;
  const employeeRows=a.employees.map(e=>`<tr><td><strong>${escapeHtml(e.name)}</strong><br><small class='muted'>${escapeHtml(e.employeeId)}</small></td><td>${escapeHtml(roleLabel(e.role))}</td><td>${authStateBadge(e)}</td><td>${escapeHtml(e.lastLogin||'—')}</td><td><div class='admin-actions'><button class='small-button' onclick="openTempPinModal('${e.employeeId}')">仮PIN発行</button>${e.lockedUntil?`<button class='small-button' onclick="unlockAccount('${e.employeeId}')">ロック解除</button>`:''}</div></td></tr>`).join('');
  const requestRows=(a.resetRequests||[]).slice(0,12).map(r=>`<tr><td>${escapeHtml(r.requestedAt)}</td><td><strong>${escapeHtml(r.name)}</strong><br><small class='muted'>${escapeHtml(r.employeeId)}</small></td><td>${r.status==='未対応'?'<span class="badge warning">未対応</span>':'<span class="badge success">対応済</span>'}</td><td>${escapeHtml(r.note||'—')}</td><td>${r.status==='未対応'?`<button class='small-button' onclick="openTempPinModal('${r.employeeId}')">仮PIN発行</button>`:'—'}</td></tr>`).join('');
  const s=a.support||{};
  return `<div class='security-summary compact-security'><div class='security-item'><strong>${configured} / ${a.employees.length}</strong><small>PIN設定済み</small></div><div class='security-item'><strong>${locked}</strong><small>ロック中</small></div><div class='security-item'><strong>${pending}</strong><small>再発行依頼</small></div></div>
  <div class='settings-panel-grid'><section class='card settings-panel'><h3>認証設定</h3><div class='table-wrap panel-scroll'><table class='auth-table'><thead><tr><th>社員</th><th>権限</th><th>認証状態</th><th>最終ログイン</th><th>操作</th></tr></thead><tbody>${employeeRows}</tbody></table></div></section>
  <section class='card settings-panel'><h3>PINを忘れた場合の連絡先</h3><div class='form-grid'><label class='field full'><span>表示名</span><input id='supportName' value='${escapeHtml(s.name||'FM WORKS管理者')}'></label><label class='field'><span>メール</span><input id='supportEmail' type='email' value='${escapeHtml(s.email||'')}'></label><label class='field'><span>電話番号</span><input id='supportPhone' value='${escapeHtml(s.phone||'')}'></label><label class='field full'><span>案内文</span><textarea id='supportNote' rows='3'>${escapeHtml(s.note||'')}</textarea></label></div><div class='section-gap'><button class='primary-button compact' onclick='saveSupportSettingsFromAdmin()'>連絡先を保存</button></div><h3 class='subhead'>PIN再発行依頼</h3><div class='table-wrap panel-scroll small'><table class='auth-table'><tbody>${requestRows||"<tr><td class='muted'>再発行依頼はありません。</td></tr>"}</tbody></table></div></section></div>`;
}
function projectAdminSection(){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return '';
  const projects=(state.authAdmin&&state.authAdmin.projects)||[];
  const rows=projects.map(p=>{
    const badge=p.status==='進行中'?'<span class="badge success">進行中</span>':p.status==='完了'?'<span class="badge">完了</span>':'<span class="badge warning">停止</span>';
    return '<tr><td><strong>'+escapeHtml(p.name)+'</strong><br><small class="muted">'+escapeHtml(p.projectId)+'</small></td><td>'+escapeHtml(p.client||'—')+'</td><td>'+badge+'</td><td>'+escapeHtml(p.startDate||'—')+'</td><td>'+escapeHtml(p.endDate||'—')+'</td><td><button class="small-button" onclick="openProjectModal(\''+p.projectId+'\')">編集</button></td></tr>';
  }).join('');
  return '<div class="section-gap">'+card('プロジェクト管理','<div class="card-toolbar"><p class="muted">工数入力で利用するプロジェクトを管理します。停止・完了した案件は新規工数の選択肢から外れます。</p><button class="primary-button" onclick="openProjectModal()">＋ プロジェクト追加</button></div>'+(rows?'<div class="table-wrap panel-scroll"><table class="auth-table"><thead><tr><th>プロジェクト</th><th>顧客</th><th>状態</th><th>開始</th><th>終了</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="muted">プロジェクトが登録されていません。</p>'))+'</div>';
}
function openProjectModal(projectId){
 if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole)){showToast('管理者権限が必要です');return;}
 const p=projectId&&state.authAdmin?(state.authAdmin.projects||[]).find(x=>x.projectId===projectId):null;
 const r=ensureModal(),status=p&&p.status||'進行中';
 r.innerHTML=`<div class="modal-backdrop" onclick="closeModal()"></div><section class="modal-card ph-project-modal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
 <div class="modal-head"><div><small>プロジェクトマスタ</small><h2 id="projectModalTitle">${p?'案件情報を編集':'新しい案件を登録'}</h2><p class="ph-help">最初は案件名だけで登録できます。顧客・日付などは後から変更できます。</p></div><button type="button" class="icon-button" onclick="closeModal()" aria-label="閉じる">×</button></div>
 <form id="projectMasterForm" data-project-id="${escapeHtml(p?p.projectId:'')}" onsubmit="event.preventDefault();saveProjectFromModal(this.dataset.projectId)">
 <div class="ph-master-primary"><label class="field full"><span>案件名 <em>必須</em></span><input id="prjName" maxlength="120" required autocomplete="off" value="${escapeHtml(p?p.name:'')}" placeholder="例：社内業務システム開発"></label>
 <label class="field"><span>顧客・依頼元</span><input id="prjClient" maxlength="100" value="${escapeHtml(p?p.client:'')}" placeholder="例：社内 / 株式会社〇〇"></label>
 <label class="field"><span>状態</span><select id="prjStatus">${['進行中','停止','完了'].map(v=>`<option value="${v}" ${status===v?'selected':''}>${v}</option>`).join('')}</select></label></div>
 <details class="ph-master-more" data-form-section="project-master-more" ${p?'open':''}><summary>期間・備考を設定する（任意）</summary><div class="form-grid">
 <label class="field"><span>開始日</span><input id="prjStart" type="date" value="${escapeHtml(p?p.startDate:'')}"></label>
 <label class="field"><span>終了予定日</span><input id="prjEnd" type="date" value="${escapeHtml(p?p.endDate:'')}"></label>
 <label class="field full"><span>備考・目的</span><textarea id="prjNote" maxlength="500" rows="3" placeholder="この案件の目的や注意点">${escapeHtml(p?p.note:'')}</textarea></label>
 </div></details><p id="projectMasterError" class="ph-error" role="alert"></p>
 <div class="modal-actions"><span></span><div><button type="button" class="secondary-button" onclick="closeModal()">キャンセル</button><button id="prjSaveButton" type="submit" class="primary-button">${p?'変更を保存':'登録して案件を開く'}</button></div></div></form></section>`;
}
function saveProjectFromModal(projectId){
 const input=document.getElementById('prjName'),button=document.getElementById('prjSaveButton'),error=document.getElementById('projectMasterError');
 if(!input||!button||button.disabled)return;
 const name=input.value.trim(),start=document.getElementById('prjStart').value,end=document.getElementById('prjEnd').value;
 if(!name){if(error)error.textContent='案件名を入力してください。';input.focus();return;}
 if(start&&end&&start>end){if(error)error.textContent='終了予定日は開始日以降にしてください。';document.getElementById('prjEnd').focus();return;}
 const payload={projectId:projectId||'',name,client:document.getElementById('prjClient').value,status:document.getElementById('prjStatus').value,startDate:start,endDate:end,note:document.getElementById('prjNote').value};
 button.disabled=true;button.textContent='保存しています…';if(error)error.textContent='';
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(result=>{
  if(!result||result.ok!==true){button.disabled=false;button.textContent='保存する';if(error)error.textContent='保存結果を確認できませんでした。更新して内容をご確認ください。';return;}
  closeModal();showToast('プロジェクトを保存しました');
  invalidatePageCache('worklog','authAdmin');
  if(state.data)state.data.projects=[];
  if(state.page==='projects'&&typeof loadProjectHub==='function'){
   if(result.projectId)projectHubUi.selected=result.projectId;
   projectHubUi.view='detail';projectHubUi.tab='overview';projectHubInvalidate_();loadProjectHub({force:true});
  }else loadAuthAdmin({force:true,scope:'projects'});
 }).withFailureHandler(err=>{
  button.disabled=false;button.textContent=projectId?'変更を保存':'登録して案件を開く';
  if(typeof handleApiError==='function'&&handleApiError(err,'プロジェクトを保存できませんでした。'))return;
  if(error)error.textContent=cleanApiErrorMessage(err,'プロジェクトを保存できませんでした。');
 }).saveProject(state.sessionToken,payload);
}
function inlineMarkdown(text){
  let s=escapeHtml(text);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  return s;
}
function renderMarkdownDoc(markdown){
  const lines=String(markdown||'').replace(/\r/g,'').split('\n');
  let out='',i=0,inCode=false,code=[],list=null;
  const closeList=()=>{if(list){out+=`</${list}>`;list=null}};
  while(i<lines.length){
    const line=lines[i];
    if(line.startsWith('```')){
      closeList();
      if(!inCode){inCode=true;code=[];}else{out+=`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;inCode=false;}
      i++;continue;
    }
    if(inCode){code.push(line);i++;continue}
    if(/^\|.+\|$/.test(line)&&i+1<lines.length&&/^\|\s*:?-+/.test(lines[i+1])){
      closeList();
      const rows=[];rows.push(line);i+=2;
      while(i<lines.length&&/^\|.+\|$/.test(lines[i])){rows.push(lines[i]);i++}
      const cells=r=>r.slice(1,-1).split('|').map(x=>inlineMarkdown(x.trim()));
      out+='<div class="doc-table-wrap"><table><thead><tr>'+cells(rows[0]).map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue;
    }
    const h=line.match(/^(#{1,4})\s+(.+)$/);
    if(h){closeList();out+=`<h${h[1].length}>${inlineMarkdown(h[2])}</h${h[1].length}>`;i++;continue}
    const ul=line.match(/^[-*]\s+(.+)$/),ol=line.match(/^\d+\.\s+(.+)$/);
    if(ul||ol){const t=ul?'ul':'ol';if(list!==t){closeList();list=t;out+=`<${t}>`};out+=`<li>${inlineMarkdown((ul||ol)[1])}</li>`;i++;continue}
    if(!line.trim()){closeList();out+='<div class="doc-spacer"></div>';i++;continue}
    closeList();out+=`<p>${inlineMarkdown(line)}</p>`;i++;
  }
  closeList();if(inCode)out+=`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;return out;
}
function loadSystemDocument(type,options={}){
  if(!['requirements','technical'].includes(type))return;
  if(state.documents[type]&&!options.force){renderPageIfActive('admin');return}
  if(state.documents.loading===type)return;
  state.documents.loading=type;renderPageIfActive('admin');
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(doc=>{
    state.documents[type]=doc;state.documents.loading=null;markPageCache('documents',type);renderPageIfActive('admin');
  }).withFailureHandler(err=>{
    state.documents.loading=null;handleApiError(err,'文書を読み込めませんでした');renderPageIfActive('admin');
  }).getSystemDocument(state.sessionToken,type);
}
function documentPane(type){
  const doc=state.documents[type];
  if(!doc)return `<div class='document-loading'><div class='loading-card'></div><p>文書を読み込んでいます…</p></div>`;
  return `<section class='document-shell'><header><div><span class='badge'>${escapeHtml(doc.version||state.data.app.version)}</span><strong>${escapeHtml(doc.title)}</strong><small>最終更新 ${escapeHtml(doc.updatedAt||'—')}</small></div><button class='secondary-button compact' onclick="loadSystemDocument('${type}',{force:true})">再読込</button></header><article class='document-reader'>${renderMarkdownDoc(doc.markdown)}</article></section>`;
}
function quoteAdministrationSection_(){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))
    return "<div class='v15-empty'>管理者権限がありません。</div>";
  const d=quoteUi.data;
  if(quoteUi.error&&!d)return "<div role='alert' class='v15-empty'><strong>見積設定を取得できませんでした。</strong>"+
    escapeHtml(quoteUi.error)+"<button class='secondary-button' onclick='loadQuoteWorkspace({force:true})'>再取得</button></div>";
  if(!d)return "<div role='status' class='v15-empty'><strong>見積用の設定を読込中です。</strong>"+
    "<button type='button' class='secondary-button' onclick='loadQuoteWorkspace({force:true})'>再取得</button></div>";
  if(d.setupRequired)return "<div class='v15-empty' role='status'><strong>見積DBの初期設定が必要です。</strong>"+
    "既存DBをバックアップしたあと「運用・労務」からDBを更新してください。</div>";
  return "<div class='v15-admin-quotes'>"+
    "<p class='v15-helper-note'>新しい取引先を登録した後、過去のExcel見積番号と重複しないことを確認して採番を設定してください。"+
    "正式発行した見積の番号は変更できません。</p>"+
    quoteAdminSetup_()+"</div>";
}

function adminPage(){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return pageHead('管理','この画面を表示する権限がありません。');
  if(state.adminTab==='people')return peoplePage();
  let content='';
  if(state.adminTab==='auth')content=authSettingsSection();
  else if(state.adminTab==='projects')content=projectAdminSection();
  else if(state.adminTab==='operation')content=maintenanceSection();
  else if(state.adminTab==='performance')content=adminPerformanceSection_();
  else if(state.adminTab==='quotes')content=quoteAdministrationSection_();
  else if(state.adminTab==='requirements')content=documentPane('requirements');
  else if(state.adminTab==='technical')content=documentPane('technical');
  else content=authSettingsSection();
  return adminWorkspaceShell(state.adminTab,content);
}


function adminPerformanceSection_(){
  const p=typeof FMWorksPerformance!=='undefined'&&FMWorksPerformance&&typeof FMWorksPerformance.report==='function'?FMWorksPerformance.report():null;
  const list=p&&Array.isArray(p.methods)?p.methods:[];
  const ms=v=>Number.isFinite(v)?Math.round(v).toLocaleString('ja-JP')+' ms':'—';
  const count=list.reduce((n,x)=>n+Number(x.calls||0),0);
  const startup=p&&p.startup||{};
  const table=list.length?
    "<div class='table-wrap'><table class='auth-table'><thead><tr><th>処理名</th><th>回数</th><th>失敗</th><th>P50</th><th>P95</th><th>直近</th></tr></thead><tbody>"+
    list.map(x=>'<tr><td><code>'+escapeHtml(x.method)+'</code></td><td>'+Number(x.calls||0).toLocaleString('ja-JP')+
      '</td><td>'+Number(x.failures||0).toLocaleString('ja-JP')+'</td><td>'+ms(x.p50Ms)+'</td><td>'+
      ms(x.p95Ms)+'</td><td>'+ms(x.lastMs)+'</td></tr>').join('')+'</tbody></table></div>':
    "<p class='muted'>まだ通信の計測がありません。勤怠や工数を操作してから戻ってください。</p>";
  return "<div class='section-gap'>"+card('通信の待ち時間（実測）',
    "<p class='muted'>現在のブラウザータブで発生したGAS通信の往復時間です。回線・サーバー起動も含みます。</p>"+
    "<div class='maintenance-detail'><div><span>計測した通信</span><strong>"+count.toLocaleString('ja-JP')+
    "回</strong></div><div><span>重複通信を省略</span><strong>"+Number(p&&p.coalescedReads||0).toLocaleString('ja-JP')+"回</strong></div></div>"+
    "<div class='maintenance-detail'><div><span>HTML受信まで</span><strong>"+ms(startup.htmlResponseMs)+
    "</strong></div><div><span>初期画面準備まで</span><strong>"+ms(startup.domContentLoadedMs)+
    "</strong></div><div><span>ログイン後の画面描画</span><strong>"+ms(startup.authenticatedMountMs)+"</strong></div></div>"+
    "<p class='muted'>HTML受信・画面準備はページを開いてからの累積時間です。ログイン後の描画はデータを受け取ってからのブラウザー処理時間で、GASサーバーの実行時間とは別です。計測できない環境は「—」と表示します。</p>"+
    "<p class='muted'>P50は半分の通信がおさまる時間、P95は95％がおさまる時間です。各処理の直近80回まで、20回未満のP95は参考値です。リロード・ログアウトで消えます。</p>"+
    table+"<div class='button-row section-gap'>"+
    "<button class='secondary-button' type='button' onclick=\"renderPageIfActive('admin')\">数値を更新</button>"+
    "<button class='secondary-button' type='button' onclick='adminCopyRpcPerformance_()'>結果をコピー</button>"+
    "<button class='secondary-button' type='button' onclick='adminClearRpcPerformance_()'>計測を消去</button>"+
    "</div><p class='muted'>測定内容は処理名・回数・待ち時間だけです。セッショントークン、PIN、社員情報、引数や返却データは含めません。</p>"
  )+"</div>";
}
function adminCopyRpcPerformance_(){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return;
  if(typeof FMWorksPerformance==='undefined'||!FMWorksPerformance||typeof navigator==='undefined'||!navigator.clipboard||!navigator.clipboard.writeText){
    showToast('コピー機能が利用できません');return;
  }
  navigator.clipboard.writeText(JSON.stringify(FMWorksPerformance.report(),null,2))
    .then(()=>showToast('通信速度をコピーしました'),()=>showToast('コピーに失敗しました'));
}
function adminClearRpcPerformance_(){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return;
  if(typeof FMWorksPerformance!=='undefined'&&FMWorksPerformance&&typeof FMWorksPerformance.clear==='function')FMWorksPerformance.clear();
  renderPageIfActive('admin');
}

  openConfirmDialog('労務ルールを保存','就業規則・36協定の起算月・特別条項を確認した内容として保存します。','保存',()=>(typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(()=>{showToast('労務ルールを保存しました');loadMaintenance({force:true});}).withFailureHandler(err=>handleApiError(err,'保存できませんでした')).saveLaborRuleConfig(state.sessionToken,{profile,weekStartDay,agreementStartMonth,specialClause,note}),true);
}
function maintenanceSection(){
  const m=state.maintenance||{},s=m.status;
  if(m.loading&&!s)return card('Sites SQLの状態',"<div class='loading-card'></div>");
  if(!s)return card('Sites SQLの状態',"<p class='muted'>システム情報を読み込んでいます。</p>");
  const auditRows=(m.audit||[]).slice(0,40).map(x=>`<tr><td>${escapeHtml(x.at)}</td><td>${escapeHtml(x.employeeName||x.employeeId||'SYSTEM')}</td><td>${escapeHtml(x.operation)}</td><td>${escapeHtml(x.target)}</td><td>${escapeHtml(x.result)}</td></tr>`).join('');
  const labor=s.laborConfig||{profile:'UNCONFIGURED',weekStartDay:'',agreementStartMonth:0,specialClause:'UNCONFIGURED',configured:false,note:''};
  const schema=s.schemaStatus||{version:0,expectedVersion:0,ready:false,issues:[]};
  const readiness=s.readiness||{ready:false,blockers:[],warnings:[]};
  const notices=[...(readiness.blockers||[]),...(readiness.warnings||[])].map(x=>`<p class='muted'>${escapeHtml(x)}</p>`).join('');
  return `<div class='section-gap'>
    ${card('Sites SQL / D1 の状態',`<div class='maintenance-detail'>
      <div><span>保存先</span><strong>Sites SQL / D1</strong></div>
      <div><span>登録レコード</span><strong>${Object.values(s.sheets||{}).reduce((a,b)=>a+Number(b||0),0)}件</strong></div>
      <div><span>DBスキーマ</span><strong>${escapeHtml(String(schema.version))}（内部管理番号）</strong></div>
      <div><span>アプリ</span><strong>v${escapeHtml(state.data.app.version)}</strong></div>
      <div><span>確認日時</span><strong>${escapeHtml(s.checkedAt||'')}</strong></div>
    </div><div class='button-row section-gap'><button class='secondary-button' onclick='loadMaintenance({force:true})'>状態を再確認</button></div>${notices}`)}
    <div class='grid cols-2 section-gap'>
      ${card('労務ルール',`<div class='maintenance-detail'><div><span>状態</span><strong>${labor.configured?'設定済み':'未確定'}</strong></div><div><span>プロファイル</span><strong>${escapeHtml(labor.profile)}</strong></div></div><div class='form-grid section-gap'><label class='field'><span>プロファイル</span><select id='laborProfile'><option value='UNCONFIGURED' ${labor.profile!=='GENERAL_JP'?'selected':''}>未確定</option><option value='GENERAL_JP' ${labor.profile==='GENERAL_JP'?'selected':''}>日本・一般則（確認済み）</option></select></label><label class='field'><span>週開始曜日</span><select id='laborWeekStart'><option value=''>未設定</option>${[['SUNDAY','日曜'],['MONDAY','月曜'],['TUESDAY','火曜'],['WEDNESDAY','水曜'],['THURSDAY','木曜'],['FRIDAY','金曜'],['SATURDAY','土曜']].map(x=>`<option value='${x[0]}' ${labor.weekStartDay===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label class='field'><span>36協定の起算月</span><select id='laborAgreementStart'><option value=''>未設定</option>${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value='${m}' ${Number(labor.agreementStartMonth)===m?'selected':''}>${m}月</option>`).join('')}</select></label><label class='field'><span>特別条項</span><select id='laborSpecialClause'><option value='UNCONFIGURED' ${labor.specialClause==='UNCONFIGURED'?'selected':''}>未確認</option><option value='NONE' ${labor.specialClause==='NONE'?'selected':''}>なし</option><option value='ENABLED' ${labor.specialClause==='ENABLED'?'selected':''}>あり</option></select></label><label class='field full'><span>確認メモ</span><textarea id='laborRuleNote' rows='2'>${escapeHtml(labor.note||'')}</textarea></label></div><div class='button-row section-gap'><button class='primary-button' onclick='saveLaborRulesFromAdmin()'>保存</button><button class='secondary-button' onclick="navigate('companyCalendar')">法定休日を設定</button></div><p class='muted'>未確定のまま本番READY・月次締めには進めません。標準会社カレンダー生成では法定休日を自動指定しないため、就業規則に合わせて必ず明示設定してください。</p>`)}
      ${card('バックアップ・復元',"<p class='muted'>Sites SQLの復旧方法は未検証です。Google Driveへの複製やGASトリガーは使用しません。</p>")}
    </div>
    ${card('監査ログ（最新40件）',auditRows?`<div class='table-wrap'><table><thead><tr><th>日時</th><th>操作者</th><th>操作</th><th>対象</th><th>結果</th></tr></thead><tbody>${auditRows}</tbody></table></div>`:"<p class='muted'>監査ログはありません。</p>")}
  </div>`;
}
function loadMaintenance(options={}){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return;
  const key='current',view=state.maintenance,identity=state.sessionToken;
  if(!options.force&&cacheFresh('maintenance',key))return;
  const ticket=beginPageLoad('maintenance',key);
  if(!ticket){if(options.force)view.refreshNeeded=true;return;}
  const hasCurrent=cacheHas('maintenance',key);
  view.loading=!hasCurrent;view.refreshNeeded=false;
  if(!options.silent)renderPageIfActive('admin');
  let pending=2,failed=false,status,audit;
  const current=()=>state.sessionToken===identity&&state.maintenance===view&&!!state.data;
  const done=()=>{
    if(!current())return;
    pending--;if(pending>0)return;
    endPageLoad(ticket);view.loading=false;
    if(view.refreshNeeded){view.refreshNeeded=false;loadMaintenance({force:true,silent:true});return;}
    if(status!==undefined)view.status=status;
    if(audit!==undefined)view.audit=audit;
    if(!failed)markPageCache('maintenance',key);
    renderPageIfActive('admin');
  };
  const fail=message=>err=>{if(!current())return;failed=true;const obsolete=view.refreshNeeded;done();if(!obsolete)handleApiError(err,message);};
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(data=>{if(!current())return;status=data;done()}).withFailureHandler(fail('システム状態を読み込めませんでした')).getSystemStatus(identity);
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(data=>{if(!current())return;audit=data||[];done()}).withFailureHandler(fail('監査ログを読み込めませんでした')).getAuditLogs(identity,100);
}

function authAdminScope_(options={}){
  if(options.scope)return options.scope;
  if(state.page==='people')return 'people';
  if(state.page==='admin'&&state.adminTab==='projects')return 'projects';
  return 'auth';
}
function authAdminCacheName_(scope){return scope==='people'?'authAdminPeople':scope==='projects'?'authAdminProjects':'authAdminAuth';}
function loadAuthAdmin(options={}){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole)) return;
  const scope=authAdminScope_(options),cacheName=authAdminCacheName_(scope);
  const identity=String(state.sessionToken||'')+'|'+String(state.data&&state.data.user&&state.data.user.employeeId||'');
  const key=scope+'|'+identity;
  if(!options.force&&cacheFresh(cacheName,key))return;
  if(!options.force&&scope==='people'&&Array.isArray(state.authAdmin&&state.authAdmin.employees)&&cacheFresh('authAdminAuth','auth|'+identity)){
    markPageCache(cacheName,key);renderPageIfActive('people');return;
  }
  const ticket=beginPageLoad(cacheName,key);if(!ticket)return;
  const hasCurrent=cacheHas(cacheName,key)&&!!state.authAdmin;
  if(!hasCurrent&&!options.silent)renderPage();
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run)
    .withSuccessHandler(data=>{
      endPageLoad(ticket);
      if(identity!==String(state.sessionToken||'')+'|'+String(state.data&&state.data.user&&state.data.user.employeeId||''))return;
      state.authAdmin={...(state.authAdmin||{}),...(data||{})};
      markPageCache(cacheName,key);
      if(state.page==='admin'||state.page==='people')renderPage();
    })
    .withFailureHandler(err=>{endPageLoad(ticket);if(identity!==String(state.sessionToken||'')+'|'+String(state.data&&state.data.user&&state.data.user.employeeId||''))return;handleApiError(err,'管理情報を読み込めませんでした')})
    .getAuthAdminData(state.sessionToken,scope);
}

function openTempPinModal(employeeId){
  const pinLength=Math.max(4,Number(state.publicConfig&&state.publicConfig.pinLength)||6);
  const source=(state.authAdmin&&state.authAdmin.employees||[]).find(x=>x.employeeId===employeeId);
  const name=source?source.name:employeeId;
  const r=ensureModal();
  r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div>
  <section class='modal-card small' role='dialog' aria-modal='true'>
    <div class='modal-head'><div><small>管理者操作</small><h2>仮PINを発行</h2></div><button type='button' class='icon-button' onclick='closeModal()' aria-label='閉じる'>×</button></div>
    <p class='muted'>${escapeHtml(name)}（${escapeHtml(employeeId)}）に${pinLength}桁の仮PINを設定します。本人は初回ログイン時に変更が必要です。</p>
    <div class='form-grid'>
      <label class='field full'><span>仮PIN</span><input id='tempPin' inputmode='numeric' maxlength='${pinLength}' type='password' autocomplete='new-password'></label>
      <label class='field full'><span>仮PIN（確認）</span><input id='tempPinConfirm' inputmode='numeric' maxlength='${pinLength}' type='password' autocomplete='new-password'></label>
    </div>
    <div class='modal-actions'><span></span><div><button class='secondary-button' onclick='closeModal()'>キャンセル</button><button class='primary-button' onclick="submitTempPin('${employeeId}')">発行</button></div></div>
  </section>`;
}

function submitTempPin(employeeId){
  const pin=document.getElementById('tempPin').value;
  const confirmPin=document.getElementById('tempPinConfirm').value;
  if(pin!==confirmPin){showToast('確認用PINが一致しません');return}
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(()=>{closeModal();showToast('仮PINを発行しました');invalidatePageCache('authAdmin');loadAuthAdmin({force:true})})
    .withFailureHandler(err=>handleApiError(err,'仮PINを発行できませんでした'))
    .adminSetTemporaryPin(state.sessionToken,employeeId,pin);
}

function unlockAccount(employeeId){
  openConfirmDialog('ログインロックを解除','このアカウントのログインロックを解除しますか？','解除する',function(){
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(()=>{showToast('ロックを解除しました');invalidatePageCache('authAdmin');loadAuthAdmin({force:true})})
    .withFailureHandler(err=>handleApiError(err,'ロック解除に失敗しました'))
    .adminUnlockAccount(state.sessionToken,employeeId);
  },false);
}

function saveSupportSettingsFromAdmin(){
  const payload={name:document.getElementById('supportName').value,email:document.getElementById('supportEmail').value,phone:document.getElementById('supportPhone').value,note:document.getElementById('supportNote').value};
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():google.script.run).withSuccessHandler(support=>{state.authAdmin.support=support;state.publicConfig.support=support;renderPage();showToast('連絡先を保存しました')})
    .withFailureHandler(err=>handleApiError(err,'連絡先を保存できませんでした'))

}
