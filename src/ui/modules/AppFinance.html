<script>
/* FM WORKS v0.13.0 finance UI. No confidential data in persistent browser storage. */
const FINANCE_READ_TTL=300000;
let financeVisual={query:'',status:'ALL',match:'ALL',month:''};
let financeUi={tab:'expense',selectedIds:{expense:'',receipt:'',travel:''},demo:false,demoData:null,insightMode:false,insights:null,insightYear:new Date().getFullYear(),insightLoading:false,insightError:'',insightQuery:'',insightPayer:'',travelEstimate:null,invoiceIssuer:null,lastLatencyMs:null,mineLatencyMs:null,revOverview:0,revMine:0,overview:null,mine:null,error:'',ownError:'',auditWarning:'',loading:false,ownLoading:false,busy:false,identity:'',limit:160,at:0,mineAt:0,refreshNeeded:false,ownRefreshNeeded:false};
function resetFinanceUi(){
  if(typeof resetCashFlowUi==='function')resetCashFlowUi();
  financeActiveForm=null;
  if(typeof financeWorkspaceReset_==='function')financeWorkspaceReset_();
  financeVisual={query:'',status:'ALL',match:'ALL',month:''};
  financeUi={tab:'expense',selectedIds:{expense:'',receipt:'',travel:''},demo:false,demoData:null,insightMode:false,insights:null,insightYear:new Date().getFullYear(),insightLoading:false,insightError:'',insightQuery:'',insightPayer:'',travelEstimate:null,invoiceIssuer:null,lastLatencyMs:null,mineLatencyMs:null,revOverview:0,revMine:0,overview:null,mine:null,error:'',ownError:'',auditWarning:'',loading:false,ownLoading:false,busy:false,identity:'',limit:160,at:0,mineAt:0,refreshNeeded:false,ownRefreshNeeded:false};
}
function financeIdentity(){
  return String(state.sessionToken||'')+'|'+String(state.data&&state.data.user&&state.data.user.employeeId||'');
}
function financeAccessAllowed(){
  return !!(state.data&&state.data.permissions&&state.data.permissions.financeWorkspace);
}
function loadFinanceOverview(options={}){
  if(!financeAccessAllowed()||!state.sessionToken)return;
  const now=Date.now();
  if(!options.force&&financeUi.overview&&financeUi.identity===financeIdentity()&&
    now-financeUi.at<FINANCE_READ_TTL)return;
  if(financeUi.loading){if(options.force)financeUi.refreshNeeded=true;return;}
  const ui=financeUi,identity=financeIdentity(),hadData=!!financeUi.overview,revision=financeUi.revOverview;
  financeUi.identity=identity;financeUi.loading=true;financeUi.refreshNeeded=false;financeUi.error='';
  if(state.page==='finance'&&!hadData&&!options.silent)renderPage();
  const started=Date.now();
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(result=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    if(revision!==financeUi.revOverview||financeUi.refreshNeeded){
      financeUi.loading=false;financeUi.refreshNeeded=false;
      loadFinanceOverview({force:true,silent:true});return;
    }
    financeUi.lastLatencyMs=Date.now()-started;
    if(!result||!Array.isArray(result.expenses)||!Array.isArray(result.travels)||!Array.isArray(result.receipts)){
      financeUi.loading=false;
      financeUi.error='経理データの形式を確認できませんでした。管理者にご連絡ください。';
      renderPageIfActive('finance');
      return;
    }
    financeUi.overview=result;financeUi.at=Date.now();financeUi.loading=false;financeUi.error='';
    if(typeof console!=='undefined'&&console.debug)console.debug('[FM PERF] finance API '+(Date.now()-started)+'ms');
    renderPageIfActive('finance');
    renderPageIfActive('office');
  }).withFailureHandler(error=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    if(revision!==financeUi.revOverview||financeUi.refreshNeeded){
      financeUi.loading=false;financeUi.refreshNeeded=false;
      loadFinanceOverview({force:true,silent:true});return;
    }
    financeUi.lastLatencyMs=Date.now()-started;
    financeUi.error=cleanApiErrorMessage(error,'経理情報を取得できませんでした。');
    financeUi.loading=false;
    renderPageIfActive('finance');
    renderPageIfActive('office');
  }).getFinanceOverview(state.sessionToken,{limit:financeUi.limit||160,forceFresh:!!options.force&&!options.reuseSnapshot});
}
function loadMyFinanceItems(options={}){
  if(!state.sessionToken)return;
  const now=Date.now();
  if(!options.force&&financeUi.mine&&financeUi.identity===financeIdentity()&&
    now-financeUi.mineAt<FINANCE_READ_TTL)return;
  if(financeUi.ownLoading){if(options.force)financeUi.ownRefreshNeeded=true;return;}
  const ui=financeUi,identity=financeIdentity(),hadData=!!financeUi.mine,started=Date.now(),revision=financeUi.revMine;
  financeUi.identity=identity;financeUi.ownLoading=true;financeUi.ownRefreshNeeded=false;financeUi.ownError='';
  if(!hadData&&!options.silent)renderPageIfActive('requests');
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(result=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    if(revision!==financeUi.revMine||financeUi.ownRefreshNeeded){
      financeUi.ownLoading=false;financeUi.ownRefreshNeeded=false;
      loadMyFinanceItems({force:true,silent:true});return;
    }
    financeUi.mineLatencyMs=Date.now()-started;
    if(!result||!Array.isArray(result.expenses)||!Array.isArray(result.travels)){
      financeUi.ownError='申請履歴の形式が不正です。';financeUi.ownLoading=false;
      renderPageIfActive('requests');return;
    }
    financeUi.mine=result;financeUi.mineAt=Date.now();financeUi.ownLoading=false;financeUi.ownError='';
    renderPageIfActive('requests');
  }).withFailureHandler(error=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    if(revision!==financeUi.revMine||financeUi.ownRefreshNeeded){
      financeUi.ownLoading=false;financeUi.ownRefreshNeeded=false;
      loadMyFinanceItems({force:true,silent:true});return;
    }
    financeUi.mineLatencyMs=Date.now()-started;
    financeUi.ownError=cleanApiErrorMessage(error,'経費・出張の履歴を取得できませんでした。');
    financeUi.ownLoading=false;
    renderPageIfActive('requests');
  }).getMyFinanceItems(state.sessionToken);
}
function financeYen(value){
  const n=Number(String(value).replace(/,/g,''));
  return Number.isFinite(n)?n.toLocaleString('ja-JP')+'円':'—';
}
function financeDateDisplay(value){return escapeHtml(String(value||'—'));}
function financeStatusLabel(status){
  return '<span class="finance-status">'+escapeHtml(status||'未処理')+'</span>';
}
function financeMyRow(kind,item){
  const title=kind==='travel'?item.destination:item.vendor;
  const day=kind==='travel'?item.startsOn:item.usedOn;
  const amount=kind==='travel'?item.spentAmount:item.amount;
  const returned=item.status==='差戻し';
  return '<div class="finance-record"><div><strong>'+escapeHtml(title||'未設定')+'</strong>'+
    '<small>'+financeDateDisplay(day)+' ／ '+escapeHtml(kind==='travel'?'出張報告':'経費精算')+
    ' ／ '+financeYen(amount)+'</small>'+
    (item.returnReason?'<small role="status">差戻し理由：'+escapeHtml(item.returnReason)+'</small>':'')+
    '</div><div class="finance-overview-actions">'+financeStatusLabel(item.status)+
    (returned?'<button class="small-button" type="button" data-kind="'+escapeHtml(kind)+'" data-id="'+
      escapeHtml(item.id)+'" onclick="openFinanceForm(this.dataset.kind,this.dataset.id)">修正して再申請</button>':'')+
    '</div></div>';
}
function financeSelfSection(){
  const mine=financeUi.mine,expenses=mine&&mine.expenses||[],travels=mine&&mine.travels||[];
  return '<section class="card finance-self" aria-labelledby="financeSelfTitle">'+
    (financeUi.auditWarning?'<p role="alert" class="finance-error">'+escapeHtml(financeUi.auditWarning)+'</p>':'')+
    '<header class="finance-section-head"><div><span class="eyebrow">EMPLOYEE / 経費・出張</span>'+
    '<h2 id="financeSelfTitle">経費精算・出張報告</h2>'+
    '<p>立替経費と出張結果を登録し、自分の申請状況を確認できます。</p></div></header>'+
    (financeActiveForm&&['expense','travel'].includes(financeActiveForm.kind)?'<button type="button" class="primary-button business-resume" onclick="navigate(\'financeEntry\')">入力途中の'+(financeActiveForm.kind==='expense'?'経費申請':'出張報告')+'を再開</button>':'')+
    '<div class="finance-actions"><button type="button" class="primary-button" onclick="openFinanceForm(\'expense\')">経費を申請</button>'+
    '<button type="button" class="secondary-button" onclick="openFinanceForm(\'travel\')">出張報告を登録</button>'+
    '<button type="button" class="secondary-button" onclick="loadMyFinanceItems({force:true})"'+(financeUi.ownLoading?' disabled':'')+'>申請履歴を確認</button></div>'+
    '<small class="finance-note">証憑の管理番号は入力できますが、領収書画像の保存・電子帳簿保存法への対応は別機能です。原本は社内の保管ルールに従って保存してください。</small>'+
    (financeUi.ownError?'<p role="alert">'+escapeHtml(financeUi.ownError)+'</p>':'')+
    (financeUi.ownLoading?'<p role="status">経費・出張履歴を読込中です…</p>':'')+
    (mine&&mine.setupRequired?'<p role="status">管理者による経理用DBの初期設定が必要です。</p>':'')+
    (mine&&!mine.setupRequired?'<div class="finance-own-list"><h3>自分の最近の申請</h3>'+
      (expenses.length||travels.length?expenses.map(x=>({kind:'expense',item:x})).concat(travels.map(x=>({kind:'travel',item:x})))
        .sort((a,b)=>(a.item.status==='差戻し'?0:1)-(b.item.status==='差戻し'?0:1)||
          String(b.item.updatedAt||b.item.createdAt||'').localeCompare(String(a.item.updatedAt||a.item.createdAt||'')))
        .slice(0,16).map(x=>financeMyRow(x.kind,x.item)).join(''):
      '<p class="muted">経費・出張の申請はまだありません。</p>')+'</div>':'')+
    '</section>';
}
const FINANCE_FORM_FIELDS={
  expense:[
    ['usedOn','使用日','date',true],
    ['vendor','取引先・支払先','text',true],
    ['item','商品・サービス名','text',true],
    ['category','経費種別','text',true],
    ['amount','申請額（円）','number',true],
    ['purpose','申請理由','textarea',true],
    ['paymentMethod','支払方法','text',false],
    ['receiptRef','領収書・証憑の整理番号','text',false]
  ],
  travel:[
    ['startsOn','出発日','date',true],['startsAt','出発時刻','time',false],
    ['endsOn','帰着日','date',true],['endsAt','帰着時刻','time',false],
    ['destination','出張先','text',true],['purpose','出張内容・目的','textarea',true],
    ['outcome','実施内容・結果・次の対応','textarea',true],
    ['distanceCategory','片道100kmの確認','distance',false],
    ['spentAmount','実際の使用金額（円）','number',false],
    ['lodgingArea','宿泊地域','lodging',false],['nights','宿泊日数','number',false],
    ['timeAllowance','時間帯手当の区分','text',false],
    ['dailyCategory','日当区分','text',false],
    ['requestedAllowance','支給希望額（円・要確認）','number',false],
    ['note','備考','textarea',false]
  ],
  receipt:[
    ['usedOn','利用日','date',true],['category','経費種別','text',true],
    ['vendor','取引先','text',true],['invoiceNo','適格請求書番号','text',false],
    ['item','商品名','text',true],['amount','利用金額（円）','number',true],
    ['payer','支払者','text',true],['paymentMethod','支払方法','text',true],
    ['paid','支払有無','paid',true],['receiptRef','証憑整理番号','text',false],
    ['note','備考','textarea',false]
  ]
};

// Client limits mirror Finance.gs validation; the server remains authoritative.
const FINANCE_FIELD_LIMITS=Object.freeze({
  expense:{vendor:120,item:200,category:60,purpose:500,paymentMethod:60,receiptRef:160},
  travel:{destination:160,purpose:600,outcome:1000,lodgingArea:90,timeAllowance:80,
    dailyCategory:60,note:500},
  receipt:{category:60,vendor:120,invoiceNo:32,item:200,note:500,payer:120,
    paymentMethod:80,receiptRef:160}
});

function financeFormField(entry,source={}){
  const key=entry[0],label=entry[1],kind=entry[2],required=entry[3],id='fin-'+key;
  const req=required?' required':'',common='id="'+id+'" name="'+escapeHtml(key)+'"'+req;
  const value=source[key]==null?'':String(source[key]);
  const formType=financeActiveForm&&financeActiveForm.kind||'expense';
  const max=Number((FINANCE_FIELD_LIMITS[formType]||{})[key]||(kind==='textarea'?1000:500));
  const caption=escapeHtml(label)+(required?" <em class='v15-required'>必須</em>":"");
  if(kind==='textarea')return '<label class="finance-field"><span>'+caption+'</span><textarea '+common+
    ' rows="3" maxlength="'+max+'">'+escapeHtml(value)+'</textarea></label>';
  if(kind==='distance'||kind==='paid'||kind==='lodging'){
    const options=kind==='distance'?['未確認','片道100km以上','片道100km未満','30km以上','30km未満']:
      kind==='lodging'?['なし','指定地域','指定地域外']:['未','済'];
    if(value&&!options.includes(value))options.push(value);
    return '<label class="finance-field"><span>'+caption+'</span><select '+common+'>'+
      options.map(x=>'<option value="'+escapeHtml(x)+'"'+((value||options[0])===x?' selected':'')+'>'+escapeHtml(x)+'</option>').join('')+
      '</select></label>';
  }
  const suggestions={category:['交通費','消耗品費','会議費','通信費','宿泊費','その他'],paymentMethod:['現金','個人カード','会社カード','銀行振込']};
  if(kind==='text'&&suggestions[key]){
    return '<label class="finance-field"><span>'+caption+'</span><input '+common+' list="fin-options-'+key+'" maxlength="'+max+'" value="'+escapeHtml(value)+'" placeholder="選択または入力"><datalist id="fin-options-'+key+'">'+suggestions[key].map(x=>'<option value="'+x+'"></option>').join('')+'</datalist></label>';
  }
  const attrs=kind==='number'?' min="'+(required?'1':'0')+'" max="999999999" step="1"':(kind==='text'?' maxlength="'+max+'"':'');
  const today=state.data&&state.data.today||'';
  const actual=value||(kind==='date'?today:'');
  return '<label class="finance-field"><span>'+caption+'</span><input type="'+kind+'" '+common+
    attrs+' value="'+escapeHtml(actual)+'"></label>';
}
function financeNewKey(){
  return 'FM'+Date.now().toString(36)+Math.random().toString(36).slice(2,15);
}
let financeActiveForm=null;
function financeCloseModalIfIdle(){
  if(financeUi.busy){showToast('経理の処理中です。結果を確認してから閉じてください。');return;}
  closeModal();
}
function financeModalBusy_(root){
  return !!(financeUi.busy&&root&&typeof root.querySelector==='function'&&
    root.querySelector('[data-finance-modal="true"]'));
}
function financeTrackAuditResult_(result){
  if(!result||result.auditRecorded!==false)return false;
  // A record may have been saved even though audit-sheet append failed.
  // Never instruct the user to resubmit an already saved financial record.
  financeUi.auditWarning='経理データ本体は保存済みですが、監査ログの記録を確認できません。'+
    '対象ID：'+String(result.id||'不明')+'。重複登録せず管理者へ確認を依頼してください。';
  return true;
}

function financeOwnEditableItem_(kind,id){
  const items=kind==='travel'?financeUi.mine&&financeUi.mine.travels:financeUi.mine&&financeUi.mine.expenses;
  const hit=(items||[]).find(x=>x.id===id&&x.status==='差戻し');
  return hit||null;
}
function openFinanceForm(kind,editId=''){
  if(!FINANCE_FORM_FIELDS[kind]||financeUi.busy)return;
  if(financeActiveForm&&['expense','travel'].includes(financeActiveForm.kind)){
    navigate('financeEntry');showToast('入力途中の申請を再開しました。新規作成は提出または破棄後にできます。');return;
  }
  if(financeUi.demo){showToast('サンプル表示中は実データへ登録できません。経理画面で「実データに戻る」を選択してください。');return;}
  if(kind==='receipt'&&!financeAccessAllowed()){showToast('経理の閲覧・記録権限が必要です');return;}
  if(!state.sessionToken)return;
  const source=editId?financeOwnEditableItem_(kind,editId):null;
  if(editId&&!source){showToast('差戻しの申請が見つかりません。履歴を更新してください');return;}
  const status=kind==='receipt'?financeUi.overview:financeUi.mine;
  if(status&&status.setupRequired){showToast('経理用DBが未初期化です。管理者にDB更新をご依頼ください');return;}
  financeActiveForm={kind:kind,key:financeNewKey(),editId:editId||'',source:source||{},changed:false};
  financeUi.travelEstimate=null;financeUi.invoiceIssuer=null;
  if(kind==='expense'||kind==='travel'){navigate('financeEntry');return;}
  const title=editId?'修正して再申請':({expense:'経費精算申請',travel:'出張報告',receipt:'レシート・経費記録'}[kind]);
  const root=ensureModal();
  root.innerHTML='<div class="modal-backdrop" onclick="financeCloseModalIfIdle()"></div>'+
    '<section class="modal-card finance-form-modal" data-finance-modal="true" role="dialog" aria-modal="true" aria-label="'+title+'">'+
    '<div class="modal-head"><div><small>FM WORKS / FINANCE</small><h2>'+title+'</h2></div>'+
    '<button type="button" class="icon-button" onclick="financeCloseModalIfIdle()" aria-label="閉じる">×</button></div>'+
    '<form id="financeEntryForm" onsubmit="event.preventDefault();submitFinanceForm()">'+
    '<div class="finance-form-grid">'+FINANCE_FORM_FIELDS[kind].map(financeFormField).join('')+'</div>'+
    (kind==='receipt'?financeInvoiceLookupPanel():'')+
    '<p class="finance-note">'+(kind==='travel'?'旅費計算は社内規程の参考値です。支給額の確定には承認と証憑確認が必要です。':
    '経費記録と精算申請を照合するには、双方に同じ証憑整理番号を入力してください。領収書画像はここでは保存されません。')+'</p>'+
    '<p id="financeFormError" role="alert" class="finance-error" hidden></p>'+
    '<div class="modal-actions"><button type="button" class="secondary-button" onclick="financeCloseModalIfIdle()">キャンセル</button>'+
    '<button id="financeSubmitButton" type="submit" class="primary-button">'+(editId?'再申請する':'登録する')+'</button></div></form></section>';
  if(source){
    FINANCE_FORM_FIELDS[kind].forEach(([field])=>{
      const node=document.getElementById('fin-'+field);
      if(node&&source[field]!=null)node.value=String(source[field]);
    });
  }
}

function financeEntryGroups_(kind,values){
  const fields=FINANCE_FORM_FIELDS[kind];
  const groups=kind==='expense'?[
    ['1. いつ・どこで・何に使いましたか？',['usedOn','vendor','item','category']],
    ['2. 金額と申請理由',['amount','purpose']],
    ['3. 支払方法・証憑番号（任意）',['paymentMethod','receiptRef']]
  ]:[
    ['1. 出張の日程・行き先',['startsOn','startsAt','endsOn','endsAt','destination','purpose']],
    ['2. 実施したこと・使った金額',['outcome','spentAmount']],
    ['3. 旅費の確認',['distanceCategory','lodgingArea','nights','requestedAllowance']],
    ['その他の区分・備考（任意）',['timeAllowance','dailyCategory','note']]
  ];
  return groups.map(([title,keys],i)=>{
    const body=keys.map(key=>financeFormField(fields.find(x=>x[0]===key),values)).join('');
    return i===groups.length-1?'<details class="business-field-group business-optional" data-form-section="finance-optional"><summary>'+title+'</summary><div class="finance-form-grid">'+body+'</div></details>':
      '<fieldset class="business-field-group"><legend>'+title+'</legend><div class="finance-form-grid">'+body+'</div></fieldset>';
  }).join('');
}
function financeEntryPage(){
  const a=financeActiveForm;
  if(!a||!['expense','travel'].includes(a.kind))
    return pageHead('申請・報告','申請画面を選択してください。');
  const exp=a.kind==='expense',name=exp?'経費申請':'出張報告',
    intro=exp?'立替経費の内容を入力して申請します。':'出張の目的・実施結果・費用を記録して提出します。';
  const values=a.source||{},amountKey=exp?'amount':'spentAmount',
    dayKey=exp?'usedOn':'startsOn';
  return ["<div class='v15-workspace v15-entry-workspace'>",
    "<header class='v15-page-hero v15-page-hero-short'><div>",
    "<button type='button' class='v15-back-link' onclick='financeCancelEntry()'>← 申請・報告トップへ</button>",
    "<div class='v15-kicker'>FM WORKS / 申請・報告</div>",
    "<h1>",escapeHtml(a.editId?'修正して再申請':name),"</h1>",
    "<p>",escapeHtml(intro),"</p></div><div class='v15-hero-mark'>",
      svg(exp?'i-file':'i-calendar'),"</div></header>",
    "<form id='financeEntryForm' class='v15-entry-form' oninput='financeMarkEntryDirty()'",
      " onchange='financeMarkEntryDirty()' onsubmit='event.preventDefault();submitFinanceForm()'>",
    "<section class='card v15-entry-main'><div class='v15-section-heading'>",
      "<div class='v15-section-icon'>",svg(exp?'i-file':'i-calendar'),"</div>",
      "<div><h2>",exp?'申請情報':'出張情報',"</h2>",
      "<p>必要事項を入力してください。 <em class='v15-required'>* は必須項目です。</em></p></div></div>",
    "<div class='finance-form-grid v15-finance-fields'>",
      financeEntryGroups_(a.kind,values),"</div>",
    exp?'':financeTravelEvidencePanel(),
    "<p class='v15-helper-note'>",
      exp?'領収書原本は社内規程に従って保管し、証憑整理番号を入力してください。':
          '旅費規程（2025-12-01）から参考計算と根拠を表示できます。承認前に確認してください。',"</p>",
    "<p id='financeFormError' role='alert' class='finance-error' hidden></p></section>",
    "<aside class='v15-entry-side'>",
    "<section class='card v15-entry-support'><div class='v15-section-heading'>",
    "<div class='v15-section-icon'>",svg('i-doc'),"</div><div><h2>",

function financeApplyServerSavedRecord_(kind,result){
  if(!result||result.ok!==true||!result.id)return false;
  // In-flight reads begun before the write must never replace the confirmed record.
  financeUi.revOverview++;
  if(kind==='expense'||kind==='travel')financeUi.revMine++;
  const entry=result.record;
  if(!entry||String(entry.id)!==String(result.id))return true;
  if(kind==='receipt'){
    // The record has been acknowledged by the GAS server, not locally invented.
    if(financeUi.overview&&!financeUi.overview.setupRequired){
      const d=financeUi.overview,idx=(d.receipts||[]).findIndex(x=>x.id===entry.id);
      if(idx>=0)d.receipts[idx]=entry;
      else{
        d.receipts=[entry].concat(d.receipts||[]).slice(0,financeUi.limit);
        if(d.totals)d.totals.receipt=Number(d.totals.receipt||0)+1;
      }
      financeUi.tab='receipt';
      financeUi.selectedIds.receipt=entry.id;
      financeUi.at=Date.now();
    }
  }else if(kind==='expense'||kind==='travel'){
    if(!financeUi.mine||financeUi.mine.setupRequired)financeUi.mine={setupRequired:false,expenses:[],travels:[]};
    const key=kind==='expense'?'expenses':'travels',existing=financeUi.mine[key]||[],
      idx=existing.findIndex(x=>x.id===entry.id);
    if(idx>=0)existing[idx]=entry;
    else existing.unshift(entry);
    financeUi.mine[key]=financeMyActionFirstClient_(existing).slice(0,80);
    financeUi.mineAt=Date.now();
  }
  return true;
}
function financeMyActionFirstClient_(rows){
  return (rows||[]).slice().sort((a,b)=>
    (a.status==='差戻し'?0:1)-(b.status==='差戻し'?0:1)||
    String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));
}

function submitFinanceForm(){
  if(!financeActiveForm||financeUi.busy||!state.sessionToken)return;
  if(financeUi.demo){showToast('サンプル表示中は実データを登録できません。');return;}
  const form=document.getElementById('financeEntryForm');
  if(!form||typeof form.checkValidity==='function'&&!form.checkValidity()){if(form&&form.reportValidity)form.reportValidity();return;}
  const kind=financeActiveForm.kind,fields=FINANCE_FORM_FIELDS[kind],payload={requestKey:financeActiveForm.key};
  fields.forEach(x=>{const el=document.getElementById('fin-'+x[0]);payload[x[0]]=el&&el.value||'';});
  const method=financeActiveForm.editId?'resubmitFinanceRequest':
    {expense:'submitFinanceExpense',travel:'submitFinanceTravel',receipt:'saveFinanceReceipt'}[kind];
  const activeForm=financeActiveForm;
  const ui=financeUi,identity=financeIdentity();
  // Freeze the entire input while one server write is pending. Otherwise the
  // user could edit values after the payload was sent and think they were saved.
  const frozen=Array.from(form.querySelectorAll('input,select,textarea,button')).map(el=>({el,disabled:el.disabled}));
  const restore=()=>frozen.forEach(({el,disabled})=>{el.disabled=disabled;});
  financeUi.busy=true;
  frozen.forEach(({el})=>{el.disabled=true;});
  const button=document.getElementById('financeSubmitButton');if(button){button.disabled=true;button.textContent='登録しています…';}
  const err=document.getElementById('financeFormError');if(err)err.hidden=true;
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(result=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    financeUi.busy=false;
    if(!result||result.ok!==true||!result.id){
      const message='サーバーから登録完了を確認できませんでした。履歴を更新してから再試行してください。';
      const node=document.getElementById('financeFormError');
      if(node){node.textContent=message;node.hidden=false;}
      restore();
      if(button){button.disabled=false;button.textContent=activeForm.editId?'修正して再申請する':'登録する';}
      return;
    }
    const auditWarning=financeTrackAuditResult_(result);
    financeApplyServerSavedRecord_(kind,result);
    if(financeActiveForm===activeForm){
      financeActiveForm=null;
      if(kind==='receipt')closeModal();
      else navigate('requests');
    }
    showToast(auditWarning?'保存済みですが監査ログを確認できません。管理者にご連絡ください。':result&&result.duplicate?'既に登録済みの申請です':activeForm.editId?'再申請しました':'登録しました');
    if(kind==='receipt')loadFinanceOverview({force:true});
    else {loadMyFinanceItems({force:true});if(financeAccessAllowed())loadFinanceOverview({force:true});}
  }).withFailureHandler(error=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    financeUi.busy=false;
    restore();
    const node=document.getElementById('financeFormError');
    if(node){node.textContent=cleanApiErrorMessage(error,'登録できませんでした。');node.hidden=false;}
    const b=document.getElementById('financeSubmitButton');
    if(b){b.disabled=false;b.textContent=activeForm.editId?'修正して再申請する':'登録する';}
  })[method](...(activeForm.editId?[state.sessionToken,kind,activeForm.editId,payload]:[state.sessionToken,payload]));
}

function financeInspectorHtml_(kind,item){
  if(!item)return '<div class="finance-inspector-empty"><strong>表示する記録がありません</strong>'+
    '<p>種類や検索条件を変更すると、ここに選択した記録の詳細が表示されます。</p></div>';
  const currentId=String(state.data&&state.data.user&&state.data.user.employeeId||'');
  const self=kind!=='receipt'&&String(item.employeeId||'')===currentId;
  const reviewable=kind!=='receipt'&&item.status==='承認待ち'&&!self;
  const payable=kind!=='receipt'&&item.status==='承認済'&&!self;
  const label=kind==='receipt'?'経費記録':kind==='travel'?'出張報告':'経費精算';
  const person=kind==='receipt'?item.payer:item.employeeName;
  const name=kind==='travel'?item.destination:item.item;
  const match=kind==='expense'&&(financeDisplayedOverview_()&&financeDisplayedOverview_().receiptMatches||{})[item.id];
  const matchPanel=kind==='expense'?
    '<div class="finance-reconcile '+financeReviewClass_(match)+'" role="status">'+
    '<strong>証憑照合：'+escapeHtml(financeMatchText_(match))+'</strong><small>'+
    escapeHtml(match&&match.label||'証憑番号を使った照合は未確認です。')+
    '</small></div>':'';
  const buttons=financeUi.demo?'<p class="finance-demo-operation" role="status">サンプルでは承認・差戻し・精算を実行できません。実データへ戻すと操作できます。</p>':reviewable?
      '<button type="button" class="primary-button" data-kind="'+escapeHtml(kind)+'" data-id="'+escapeHtml(item.id)+
      '" onclick="financeApprovalDialog(this.dataset.kind,this.dataset.id,\'APPROVE\')">内容を確認して承認</button>'+
      '<button type="button" class="secondary-button" data-kind="'+escapeHtml(kind)+'" data-id="'+escapeHtml(item.id)+
      '" onclick="financeApprovalDialog(this.dataset.kind,this.dataset.id,\'RETURN\')">差戻し</button>':
    payable?
      '<button type="button" class="primary-button" data-kind="'+escapeHtml(kind)+'" data-id="'+escapeHtml(item.id)+
      '" onclick="financeSettlementDialog(this.dataset.kind,this.dataset.id)">出金済みを確認する</button>':
      '<p class="finance-readonly-note">'+(self?'本人の申請は自分で承認・精算できません。':
        kind==='receipt'?'経費記録は照合・閲覧用です。登録済みの内容を確認してください。':
        'この状態で実行できる経理処理はありません。')+'</p>';
  return '<div class="finance-inspector-head"><div><span class="v15-kicker">'+label+' / 選択中</span>'+
    '<h2>'+escapeHtml(person||'—')+'</h2><p>'+escapeHtml(name||'—')+'</p></div>'+
    financeStatusLabel(kind==='receipt'?(item.paid==='済'?'支払済':'未払'):item.status)+'</div>'+
    '<div class="finance-inspector-total"><span>対象金額</span><strong>'+financeYen(financeAmountForItem(kind,item))+'</strong>'+
    '<small>'+financeDateDisplay(financeDateForItem(kind,item))+'</small></div>'+
    matchPanel+'<div class="finance-inspector-actions">'+buttons+'</div>'+
    '<h3 class="finance-inspector-subtitle">記録の内容</h3>'+financeDetailRows_(kind,item)+
    (kind==='expense'?'<p class="finance-inspector-note">番号・金額の一致は原本の確認や法令対応を保証するものではありません。</p>':'');
}
function financeRefreshResults_(){
  const rows=document.getElementById('financeTableRows'),panel=document.getElementById('financeSelectedDetail'),
    count=document.getElementById('financeVisibleCount'),kind=financeUi.tab;
  if(rows)rows.innerHTML=financeOverviewRows(kind);
  if(panel)panel.innerHTML=financeInspectorHtml_(kind,financeSelectedItem_(kind));
  if(count)count.textContent=financeVisibleItems_(kind).length+'件表示';
}
function financeSelectRecord(kind,id){
  if(!financeAccessAllowed()||kind!==financeUi.tab)return;
  const item=financeVisibleItems_(kind).find(x=>String(x.id)===String(id));
  if(!item)return;
  if(!financeUi.selectedIds)financeUi.selectedIds={expense:'',receipt:'',travel:''};
  financeUi.selectedIds[kind]=String(id);
  const rows=document.getElementById('financeTableRows');
  if(rows&&typeof rows.querySelectorAll==='function')rows.querySelectorAll('[data-finance-id]').forEach(node=>{
    const active=node.dataset.financeId===String(id);
    node.setAttribute('data-active',active?'true':'false');
    node.querySelectorAll('.finance-record-pick').forEach(button=>button.setAttribute('aria-pressed',active?'true':'false'));
  });
  const panel=document.getElementById('financeSelectedDetail');
  if(panel){panel.innerHTML=financeInspectorHtml_(kind,item);
    if(typeof window!=='undefined'&&window.innerWidth<761&&typeof panel.scrollIntoView==='function')panel.scrollIntoView({block:'start',behavior:'auto'});
  }
}
function financeSetVisualFilter(value){
  financeVisual.status=String(value||'ALL');renderPageIfActive('finance');
}
function financeSetMatchFilter(value){
  financeVisual.match=['ALL','MATCHED','ISSUE'].includes(value)?value:'ALL';
  renderPageIfActive('finance');
}
function financeClearFilters(){
  financeVisual={query:'',status:'ALL',match:'ALL',month:''};renderPageIfActive('finance');
}
function financeSearchVisible(value){
  financeVisual.query=String(value||'').slice(0,160);
  financeRefreshResults_();
}
function financeStatusMetric_(label,value,sub,icon,tone){
  return "<div class='card v15-stat'><span class='v15-stat-symbol "+(tone||"")+"'>"+svg(icon)+"</span>"+
    "<div class='v15-stat-content'><span class='v15-stat-title'>"+escapeHtml(label)+"</span>"+
    "<strong class='v15-stat-value'>"+escapeHtml(String(value))+"</strong>"+
    "<span class='v15-stat-caption'>"+escapeHtml(sub)+"</span></div></div>";
}


function financeOverviewRows(kind){
  const items=financeVisibleItems_(kind),selected=financeSelectedItem_(kind);
  if(!items.length)return '<div class="finance-empty"><strong>該当する記録はありません。</strong>'+
    '<p>検索、対象月、状態、証憑照合の条件を変更してください。</p>'+
    '<button type="button" class="secondary-button" onclick="financeClearFilters()">条件をすべて解除</button></div>';
  const matches=(financeDisplayedOverview_()||{}).receiptMatches||{};
  const rows=items.map(x=>{
    const person=kind==='receipt'?x.payer:x.employeeName;
    const description=kind==='travel'?x.destination:x.item;
    const category=kind==='travel'?'出張':x.category;
    const vendor=kind==='travel'?x.purpose:x.vendor;
    const status=kind==='receipt'?(x.paid==='済'?'支払済':'未払'):x.status;
    const active=!!selected&&String(selected.id)===String(x.id);
    const match=kind==='expense'?matches[x.id]:null;
    const klass=financeReviewClass_(match);
    const matchHtml=kind==='expense'?
      '<small class="finance-match-mini '+klass+'" title="'+
      escapeHtml(match&&match.label||'証憑番号の照合を確認してください')+'">証憑：'+
      escapeHtml(financeMatchText_(match))+'</small>':'';
    const attrs='data-finance-id="'+escapeHtml(x.id)+'" data-kind="'+escapeHtml(kind)+
      '" data-id="'+escapeHtml(x.id)+'" data-active="'+(active?'true':'false')+'"';
    const picker='<button type="button" class="finance-record-pick" data-kind="'+escapeHtml(kind)+
      '" data-id="'+escapeHtml(x.id)+'" aria-pressed="'+(active?'true':'false')+
      '" aria-label="'+escapeHtml(String(person||'')+'の'+String(description||'')+'の詳細を表示')+
      '" onclick="event.stopPropagation();financeSelectRecord(this.dataset.kind,this.dataset.id)">'+
      financeDateDisplay(financeDateForItem(kind,x))+'</button>';
    return {desktop:'<tr class="finance-ledger-row" '+attrs+
        ' onclick="financeSelectRecord(this.dataset.kind,this.dataset.id)">'+
        '<td class="finance-ledger-day">'+picker+'</td>'+
        '<td class="finance-ledger-person">'+escapeHtml(person||'—')+'</td>'+
        '<td class="finance-ledger-subject"><strong>'+escapeHtml(description||'—')+'</strong>'+
          '<small>'+escapeHtml(category||'—')+' ・ '+escapeHtml(vendor||'—')+'</small></td>'+
        '<td class="finance-ledger-amount">'+financeYen(financeAmountForItem(kind,x))+'</td>'+
        '<td class="finance-ledger-status">'+financeStatusLabel(status)+matchHtml+'</td></tr>',
      mobile:'<article class="finance-mobile-record" '+attrs+'>'+
        '<button type="button" class="finance-record-pick finance-mobile-record-pick" data-kind="'+escapeHtml(kind)+
        '" data-id="'+escapeHtml(x.id)+'" aria-pressed="'+(active?'true':'false')+
        '" onclick="financeSelectRecord(this.dataset.kind,this.dataset.id)">'+
        '<span class="finance-mobile-record-top"><strong>'+escapeHtml(person||'—')+'</strong>'+
        '<small>'+financeDateDisplay(financeDateForItem(kind,x))+'</small></span>'+
        '<span class="finance-mobile-record-subject">'+escapeHtml(description||'—')+'</span>'+
        '<small>'+escapeHtml(category||'—')+' ・ '+escapeHtml(vendor||'—')+'</small>'+
        '<span class="finance-mobile-record-bottom"><b>'+financeYen(financeAmountForItem(kind,x))+
        '</b>'+financeStatusLabel(status)+'</span>'+matchHtml+
        '<span class="finance-mobile-record-link">詳細を確認 →</span></button></article>'};
  });
  return '<table class="finance-ledger-table"><caption class="finance-sr-only">経理記録の一覧：行を選択して詳細を表示</caption>'+
    '<thead><tr><th scope="col">利用日</th><th scope="col">申請者・支払者</th>'+
    '<th scope="col">区分・内容</th><th scope="col" class="finance-number-header">金額</th>'+
    '<th scope="col">状態・照合</th></tr></thead><tbody>'+rows.map(x=>x.desktop).join('')+
    '</tbody></table><div class="finance-mobile-record-list">'+rows.map(x=>x.mobile).join('')+'</div>';

function financeApprovalDialog(kind,id,decision){
  if(financeUi.demo){showToast('サンプル表示から承認処理はできません。');return;}
  if(!financeAccessAllowed()||!['expense','travel'].includes(kind)||!['APPROVE','RETURN'].includes(decision))return;
  const item=financeOverviewItem_(kind,id),own=String(state.data&&state.data.user&&state.data.user.employeeId||'');
  if(!item||item.status!=='承認待ち'||String(item.employeeId||'')===own){showToast('承認できる申請ではありません。最新の情報を確認してください。');return;}
  const title=decision==='APPROVE'?'申請を承認':'申請を差戻し';
  ensureModal().innerHTML='<div class="modal-backdrop" onclick="financeCloseModalIfIdle()"></div>'+
    '<section class="modal-card small" data-finance-modal="true" role="dialog" aria-modal="true" aria-label="'+title+'">'+
    '<div class="modal-head"><h2>'+title+'</h2><button type="button" class="icon-button" onclick="financeCloseModalIfIdle()" aria-label="閉じる">×</button></div>'+
    '<p>'+ (decision==='APPROVE'?'金額・証憑・会社規程を確認してから承認してください。':'差戻しの理由を入力してください。')+'</p>'+
    (financeOverviewItem_(kind,id)?financeDetailRows_(kind,financeOverviewItem_(kind,id)):'')+
    (decision==='RETURN'?'<label class="finance-field"><span>差戻し理由（必須）</span><textarea id="financeDecisionReason" maxlength="500" rows="3"></textarea></label>':'')+
    '<div class="modal-actions"><button type="button" class="secondary-button" onclick="financeCloseModalIfIdle()">キャンセル</button>'+
    '<button id="financeDecisionSubmitButton" type="button" class="primary-button" data-k="'+escapeHtml(kind)+'" data-id="'+escapeHtml(id)+
    '" data-decision="'+decision+'" onclick="financeSubmitDecision(this.dataset.k,this.dataset.id,this.dataset.decision)">'+title+'</button></div>'+
    '<p id="financeDecisionError" class="finance-error" role="alert" hidden></p></section>';
}
function financeSubmitDecision(kind,id,decision){
  if(financeUi.demo)return;
  if(financeUi.busy||!financeAccessAllowed())return;
  const el=document.getElementById('financeDecisionReason'),reason=el&&el.value||'';
  if(decision==='RETURN'&&!reason.trim()){showToast('差戻し理由を入力してください');return;}
  const ui=financeUi,identity=financeIdentity();financeUi.busy=true;
  const action=document.getElementById('financeDecisionSubmitButton');
  if(action){action.disabled=true;action.textContent='処理しています…';}
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(result=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    financeUi.busy=false;
    if(!result||result.ok!==true){const node=document.getElementById('financeDecisionError');
      if(node){node.hidden=false;node.textContent='処理結果を確認できませんでした。最新の情報を確認してください。';}
      if(action){action.disabled=false;action.textContent=decision==='APPROVE'?'申請を承認':'申請を差戻し';}return;}
    financeUi.revOverview++;
    const auditWarning=financeTrackAuditResult_(result);
    closeModal();showToast(auditWarning?'申請の処理は保存済みですが監査ログを確認できません。':'処理しました');loadFinanceOverview({force:true});
  }).withFailureHandler(err=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    financeUi.busy=false;
    const node=document.getElementById('financeDecisionError');
    if(node){node.hidden=false;node.textContent=cleanApiErrorMessage(err,'処理できませんでした。');}
    if(action){action.disabled=false;action.textContent=decision==='APPROVE'?'申請を承認':'申請を差戻し';}
  }).reviewFinanceRequest(state.sessionToken,kind,id,decision,reason);
}
function financeSettlementDialog(kind,id){
  if(financeUi.demo){showToast('サンプル表示から精算処理はできません。');return;}
  if(!financeAccessAllowed()||!['expense','travel'].includes(kind))return;
  const item=financeOverviewItem_(kind,id),own=String(state.data&&state.data.user&&state.data.user.employeeId||'');
  if(!item||item.status!=='承認済'||String(item.employeeId||'')===own){showToast('精算できる申請ではありません。最新の情報を確認してください。');return;}
  const today=state.data&&state.data.today||'';
  ensureModal().innerHTML='<div class="modal-backdrop" onclick="financeCloseModalIfIdle()"></div><section class="modal-card small" data-finance-modal="true" role="dialog" aria-modal="true" aria-label="精算確認">'+
    '<div class="modal-head"><h2>精算済みにする</h2><button type="button" class="icon-button" onclick="financeCloseModalIfIdle()" aria-label="閉じる">×</button></div>'+
    '<p>実際の振込・出金が完了した場合のみ確定してください。この操作で銀行振込は行われません。</p>'+
    '<label class="finance-field"><span>出金・精算日</span><input id="financePaidOn" type="date" value="'+escapeHtml(today)+'"></label>'+
    (kind==='expense'?'<label class="finance-field"><span>立替者受取日（任意）</span><input id="financeReceivedOn" type="date"></label>':'')+
    '<p id="financeDecisionError" role="alert" class="finance-error" hidden></p>'+
    '<div class="modal-actions"><button type="button" class="secondary-button" onclick="financeCloseModalIfIdle()">キャンセル</button>'+
    '<button id="financeDecisionSubmitButton" type="button" class="primary-button" data-k="'+escapeHtml(kind)+'" data-id="'+escapeHtml(id)+'" onclick="financeSubmitSettlement(this.dataset.k,this.dataset.id)">精算確認を登録</button></div></section>';
}
function financeSubmitSettlement(kind,id){
  if(financeUi.demo)return;
  if(financeUi.busy||!financeAccessAllowed())return;
  const paid=document.getElementById('financePaidOn'),received=document.getElementById('financeReceivedOn');
  if(!paid||!paid.value){showToast('精算日を入力してください');return;}
  const ui=financeUi,identity=financeIdentity();financeUi.busy=true;
  const action=document.getElementById('financeDecisionSubmitButton');
  if(action){action.disabled=true;action.textContent='確認を登録しています…';}
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(result=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    financeUi.busy=false;
    if(!result||result.ok!==true){const node=document.getElementById('financeDecisionError');
      if(node){node.hidden=false;node.textContent='精算登録の結果を確認できませんでした。履歴を再確認してください。';}
      if(action){action.disabled=false;action.textContent='精算確認を登録';}return;}
    financeUi.revOverview++;
    const auditWarning=financeTrackAuditResult_(result);
    closeModal();showToast(auditWarning?'精算状態は保存済みですが監査ログを確認できません。':'精算済みに更新しました');loadFinanceOverview({force:true});
  }).withFailureHandler(error=>{
    if(ui!==financeUi||identity!==financeIdentity())return;
    financeUi.busy=false;
    const node=document.getElementById('financeDecisionError');
    if(node){node.hidden=false;node.textContent=cleanApiErrorMessage(error,'精算確認に失敗しました。');}
    if(action){action.disabled=false;action.textContent='精算確認を登録';}
  }).settleFinanceRequest(state.sessionToken,kind,id,paid.value,received&&received.value||'');
}
</script>
