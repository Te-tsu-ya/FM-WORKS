<script>
/* FM WORKS v0.11.9 — action-first, role-aware, no extra page-render requests. */
function homePortalGreeting(){
  const hour=new Date().getHours();
  return hour<11?'おはようございます':hour<18?'こんにちは':'こんばんは';
}
function homePortalTaskRoute(label){
  const routes={'工数入力':'worklog','勤怠の確認':'attendance','申請の承認':'requests','申請の確認':'requests'};
  return Object.prototype.hasOwnProperty.call(routes,label)?routes[label]:null;
}
function homePortalPriority(task){return task&&task.tone==='danger'?0:task&&task.tone==='warning'?1:2;}
function homePortalStats(){
  const d=state.data||{},m=d.month||null,manager=!!(d.permissions&&d.permissions.requestApprove);
  const pending=m&&typeof m.pendingRequests==='number'?m.pendingRequests+'件':null;
  const metrics=[
    ['今月の勤務',m&&m.workHours,'monthly','work'],
    ['今月の残業',m&&m.overtime,'monthly','overtime'],
    ['有給残日数',m&&m.leaveBalance,'requests','leave'],
    [manager?'チーム承認待ち':'自分の申請待ち',pending,'requests','requests']
  ];
  return metrics.map(([label,value,route,tone])=>{
    const known=value!==null&&value!==undefined,textValue=known?String(value):'読み込み中';
    const detail=known?`<strong>${escapeHtml(textValue)}</strong>`:
      state.homeOverview.error?'<strong>取得できません</strong>':'<span class="home-portal-skeleton" aria-hidden="true"></span>';
    return `<button type='button' class='home-portal-stat ${tone}' onclick="navigate('${route}')"
      aria-label='${escapeHtml(label)}：${escapeHtml(textValue)}。詳細を開く'>
      <span>${escapeHtml(label)}</span>${detail}<small>${tone==='leave'&&textValue==='未設定'?'設定が必要':'詳細を見る'} ›</small>
    </button>`;
  }).join('');
}
function homePortalPunch(a){
  const attendance=a||{};
  return `<section class='card home-portal-panel home-portal-attendance'>
    <header class='home-portal-panel-head'><div><span class='eyebrow'>ATTENDANCE</span><h2>現在の勤怠</h2></div>
      <span class='home-state-pill ${escapeHtml(attendance.state||'')}'><i aria-hidden='true'></i>${escapeHtml(attendance.stateLabel||'未打刻')}</span></header>
    <div class='home-portal-punch-facts'><div><span>出勤</span><strong>${escapeHtml(attendance.clockIn||'--:--')}</strong></div>
      <div><span>実働</span><strong data-live-worked>${escapeHtml(liveWorkedText(attendance))}</strong></div>
      <div><span>退勤</span><strong>${escapeHtml(attendance.clockOut||'--:--')}</strong></div></div>
    <div class='home-portal-punch-actions'>${punchButtons(attendance)}</div>
    ${homeWorkLocationSelector()}
    <div class='home-portal-inline-head'><strong>本日の打刻</strong>
      <button type='button' onclick="navigate('attendance')">勤怠詳細 ›</button></div>
    <div class='home-portal-punch-history'>${homePunchHistory(attendance)}</div>
  </section>`;
}
function homePortalScheduleRows(events){
  const list=Array.isArray(events)?events:[];
  if(!list.length)return `<div class='home-portal-agenda-empty'>
    <span class='home-portal-empty-icon' aria-hidden='true'>${svg('i-calendar')}</span>
    <div><strong>今日の予定はありません</strong><small>必要な予定は予定表から登録できます。</small></div>
    <button type='button' class='secondary-button compact' onclick="navigate('schedule')">予定を登録</button>
  </div>`;
  return `<div class='home-portal-agenda-rows'>${list.slice(0,4).map(e=>`<button type='button' class='home-portal-agenda-row'
      data-date='${escapeHtml(e.date||state.data.today)}' data-event-id='${escapeHtml(e.id||'')}'
      onclick="state.schedule.date=this.dataset.date;state.schedule.selectedDate=this.dataset.date;state.schedule.selectedEventId=this.dataset.eventId||null;navigate('schedule')">
      <span class='home-portal-agenda-time'>${e.allDay?'終日':escapeHtml(e.start||'--:--')}</span>
      <span class='home-portal-agenda-copy'><strong>${escapeHtml(e.title||'予定')}</strong>
        <small>${escapeHtml((e.employeeNames||[]).join('、')||'参加者未設定')}${e.location?' / '+escapeHtml(e.location):''}</small></span>
      <i aria-hidden='true' style='background:${categoryColor(e.category)}'></i>
    </button>`).join('')}
    ${list.length>4?`<button type='button' class='home-portal-more' onclick="navigate('schedule')">ほか${list.length-4}件を予定表で見る ›</button>`:''}
  </div>`;
}
function homePortalSchedule(events){
  const list=Array.isArray(events)?events:[];
  return `<section class='card home-portal-panel home-portal-agenda ${list.length?'':'is-empty'}'>
    <header class='home-portal-panel-head'><div><span class='eyebrow'>SCHEDULE</span><h2>今日の予定</h2></div>
      <span class='home-portal-count'>${list.length}件</span></header>
    ${homePortalScheduleRows(list)}
    ${list.length?`<div class='home-portal-panel-footer'>
      <button type='button' class='secondary-button compact' onclick="navigate('schedule')">予定表を開く</button></div>`:''}
  </section>`;
}
function homePortalTaskRow(t){
  const route=homePortalTaskRoute(t.label),risk=homePortalPriority(t)<2;
  const summary=t.label==='工数入力'?'勤務時間と入力工数を確認':
    t.label==='勤怠の確認'?'打刻漏れ・勤怠記録を確認':
    t.label==='申請の承認'?'担当チームの承認待ち申請':'自分の申請の状態を確認';
  const children=`<span class='home-portal-task-icon ${escapeHtml(t.tone||'info')}' aria-hidden='true'>${risk?'!':'✓'}</span>
    <span class='home-portal-task-copy'><strong>${escapeHtml(t.label||'確認事項')}</strong><small>${summary}</small></span>
    <span class='home-portal-task-status ${escapeHtml(t.tone||'info')}'>${escapeHtml(t.status||'—')}</span>
    ${route?'<i aria-hidden="true">›</i>':''}`;
  return route?`<button type='button' class='home-portal-task-row' onclick="navigate('${route}')">${children}</button>`:
    `<div class='home-portal-task-row'>${children}</div>`;
}
function homePortalTaskRows(tasks){
  if(!tasks)return state.homeOverview.error?'<p class="home-portal-task-load-message" role="status">集計を取得できませんでした。上の再読込から再試行してください。</p>':homeOverviewLoading();
  const items=Array.isArray(tasks)?tasks:[],
    urgent=items.filter(t=>homePortalPriority(t)<2).sort((a,b)=>homePortalPriority(a)-homePortalPriority(b)),
    rest=items.filter(t=>homePortalPriority(t)===2);
  const primary=urgent.length?`<div class='home-portal-task-list'>${urgent.map(homePortalTaskRow).join('')}</div>`:
    `<div class='home-portal-all-clear'><span aria-hidden='true'>✓</span><div>
    <strong>今すぐ対応が必要な項目はありません</strong><small>必要なときに詳細を確認できます。</small></div></div>`;
  return primary+(rest.length?`<details class='home-portal-other-tasks'>
    <summary>${urgent.length?'その他の状況':'確認済みの項目'}（${rest.length}件）</summary>
    <div class='home-portal-task-list'>${rest.map(homePortalTaskRow).join('')}</div></details>`:'');
}
function homePortalPriorities(tasks){
  const manager=!!(state.data&&state.data.permissions&&state.data.permissions.requestApprove);
  const count=Array.isArray(tasks)?tasks.filter(t=>homePortalPriority(t)<2).length:null;
  return `<section class='card home-portal-panel home-portal-priorities'>
    <header class='home-portal-panel-head'><div><span class='eyebrow'>TO DO</span>
      <h2>${manager?'自分とチームの要対応':'優先して確認すること'}</h2></div>
      ${count!==null?`<span class='home-portal-count ${count?'is-urgent':''}'>要対応 ${count}件</span>`:''}</header>
    ${homePortalTaskRows(tasks)}
  </section>`;
}
function homePortalShortcuts(){
  const routes=[
    ['見積書を作成','取引先・金額を入力','i-doc',"navigate('quotes')"],
    ['経費を申請','立替経費を登録','i-trend',"openFinanceForm('expense')"],
    ['出張を報告','出張内容・結果を提出','i-calendar',"openFinanceForm('travel')"],
    ['工数を入力','今日の仕事を記録','i-chart',"navigate('worklog')"]
  ];
  return "<section class='card home-portal-panel home-portal-shortcuts'>"+
    "<header class='home-portal-panel-head'><div><span class='eyebrow'>QUICK ACTIONS</span>"+
    "<h2>クイックアクション</h2><p>よく使う業務をすぐに実行できます。</p></div></header>"+
    "<div class='home-portal-shortcut-grid v15-home-quick'>"+
    routes.map(([label,detail,icon,action])=>
      "<button type='button' class='home-portal-shortcut' onclick=\""+action+"\">"+
      svg(icon)+"<span><strong>"+escapeHtml(label)+"</strong><small>"+escapeHtml(detail)+
      "</small></span><i aria-hidden='true'>›</i></button>").join('')+
    "</div></section>";
}
function homePage(){
  const d=state.data||{},a=d.attendance||{},schedule=Array.isArray(d.todaySchedule)?d.todaySchedule:[],
    tasks=Array.isArray(d.tasks)?d.tasks:null,company=d.companyToday,
    manager=!!(d.permissions&&d.permissions.requestApprove);
  return `<div class='single-screen-layout home-screen home-portal-screen'>
    <header class='home-portal-header v15-page-hero'>
      <div class='home-portal-intro'><div class='home-portal-meta'>
        <span class='home-portal-today'><i aria-hidden='true'></i>TODAY</span>
        <span>${escapeHtml(fmtDate(d.today||''))}</span>
        <span>${company?escapeHtml(company.name||company.type||'会社カレンダー'):'会社カレンダー未登録'}</span></div>
        <h1>ホーム</h1>
        <p>${homePortalGreeting()}、${escapeHtml(d.user&&d.user.displayName||'')}。 ${manager?'自分の勤務とチームの確認事項を確認できます。':'今日の勤務・予定・対応事項をまとめて確認できます。'}</p>
      </div>
      <div class='home-portal-current'><span>${manager?'承認担当者':'個人ポータル'}</span>
        <strong>${escapeHtml(a.stateLabel||'未打刻')}</strong>
        <button type='button' onclick="navigate('attendance')">勤務状況を確認 ›</button></div>
    </header>
    <div class='home-portal-stats v15-stats' aria-label='今月の状況'>${homePortalStats()}</div>
    ${state.homeOverview.error?`<div class='home-portal-load-error'>${homeOverviewError()}</div>`:''}
    <div class='home-portal-layout v15-home-layout'>
      ${homePortalPunch(a)}
      ${homePortalPriorities(tasks)}
      ${homePortalSchedule(schedule)}
      ${homePortalShortcuts()}
    </div>
  </div>`;
}
</script><script>
function loadAttendancePreview(options={}){
  if(!state.data||!state.sessionToken)return;
  const month=state.data.today.slice(0,7),employeeId=state.data.user.employeeId;
  const key=month+'|'+employeeId,session=state.sessionToken;
  const preview=state.attendancePreview||(state.attendancePreview={data:null,key:'',at:0,loading:false,error:''});
  if(!options.force&&preview.data&&preview.key===key&&(Date.now()-Number(preview.at||0))<300000)return;
  // The attendance monthly preview and the detailed monthly tab share one GAS result.
  const cache=monthlyCachedResult_(month,employeeId);
  if(!options.force&&cache&&(Date.now()-cache.at)<MONTHLY_RESULT_TTL){
    preview.data=cache.data;preview.key=key;preview.at=cache.at;
    preview.loading=false;preview.error='';renderPageIfActive('attendance');
    return;
  }
  const ticket=beginPageLoad('attendancePreview',session+'|'+key);if(!ticket)return;
  preview.loading=!(preview.data&&preview.key===key);
  preview.error='';
  requestMonthlyResult_(month,employeeId,(err,data)=>{
    endPageLoad(ticket);
    const currentKey=state.data?state.data.today.slice(0,7)+'|'+state.data.user.employeeId:'';
    if(session!==state.sessionToken||currentKey!==key)return;
    preview.loading=false;
    if(err&&err.message==='CACHE_INVALIDATED')return;
    if(err){
      preview.error='月間情報を読み込めませんでした。';
      handleApiError(err,'勤怠の月間情報を読み込めませんでした');
    }else{
      preview.data=data;preview.key=key;preview.at=Date.now();preview.error='';
    }
    renderPageIfActive('attendance');
  },{force:!!options.force});
}

function invalidateAttendancePreview(){
  if(!state.attendancePreview)return;
  state.attendancePreview.at=0;
}

function attendancePreviewData(){
  const p=state.attendancePreview;
  const key=state.data?state.data.today.slice(0,7)+'|'+state.data.user.employeeId:'';
  return p&&p.data&&p.key===key?p.data:null;
}

function attendanceDisplayPreview(){return attendancePreviewData();}

function openAttendanceMonthly(view){
  const preview=attendancePreviewData();
  state.monthly.yearMonth=state.data.today.slice(0,7);
  state.monthly.employeeId=state.data.user.employeeId;
  state.monthly.view=view==='list'?'list':'calendar';
  if(preview){
    state.monthly.data=preview;
    state.monthly.loadedKey=monthlyResultKey_(state.monthly.yearMonth,state.monthly.employeeId);
  }
  navigate('monthly');
}

function openAttendancePreviewDay(date){
  const preview=attendancePreviewData();if(!preview)return;
  state.monthly.yearMonth=preview.yearMonth;
  state.monthly.employeeId=state.data.user.employeeId;
  state.monthly.view='calendar';
  state.monthly.data=preview;
  state.monthly.loadedKey=monthlyResultKey_(state.monthly.yearMonth,state.monthly.employeeId);
  navigate('monthly');
  setTimeout(()=>openMonthlyDay(date),0);
}

function attendanceStatusTone(a){
  return a.state==='working'?'working':a.state==='break'?'break':a.state==='finished'?'finished':'off';
}

function attendancePunchActions(a){
  if(a.state==='off')return `<button class='attendance-action primary' onclick="performPunch('出勤')">${svg('i-clock')}<span>出勤する</span></button>`;
  if(a.state==='working')return `<div class='attendance-action-stack'><button class='attendance-action danger' onclick="performPunch('退勤')">${svg('i-clock')}<span>退勤する</span></button><button class='attendance-secondary-action' onclick="performPunch('休憩開始')">休憩を開始</button></div>`;
  if(a.state==='break')return `<button class='attendance-action resume' onclick="performPunch('休憩終了')">${svg('i-clock')}<span>休憩を終了</span></button>`;
  return `<button class='attendance-action disabled' disabled>${svg('i-clock')}<span>本日の勤務は終了しました</span></button>`;
}

function attendanceLocationControl(){
  const a=state.data&&state.data.attendance;
  const live=a&&['working','break'].includes(a.state);
  return `<div class='attendance-location'><div class='attendance-location-label'><span>勤務場所</span>${live?`<small>変更すると時刻と一緒に履歴へ記録されます</small>`:''}</div><div>${['出社','在宅','外出'].map(x=>`<button class='${state.workLocation===x?'active':''}' onclick="selectWorkLocation('${x}')">${x}</button>`).join('')}</div></div>`;
}

function attendanceTimeline(a,company){
  const history=(a.history||[]).slice().reverse();
  const rows=history.map(x=>{
    const locationChange=x.action==='勤務場所変更';
    const kind=locationChange?'location':x.action==='出勤'?'in':x.action==='退勤'?'out':x.action.includes('休憩')?'break':'normal';
    const title=locationChange?'勤務場所を変更':x.action;
    const sub=locationChange
      ? `${x.fromWorkLocation||'—'} → ${x.workLocation||'—'}`
      : (x.workLocation||'');
    return `<div class='attendance-timeline-row ${kind}'><time>${escapeHtml(x.time)}</time><span class='attendance-timeline-dot'></span><div><strong>${escapeHtml(title)}</strong><small>${escapeHtml(sub)}</small></div></div>`;
  });
  if(a.state==='working'||a.state==='break'){
    rows.push(`<div class='attendance-timeline-row current'><time>現在</time><span class='attendance-timeline-dot'></span><div><strong>${escapeHtml(a.stateLabel)}</strong><small>${a.state==='break'?'休憩中です':escapeHtml(liveWorkedText(a))+' 経過'} / ${escapeHtml(a.workLocation||state.workLocation||'')}</small></div></div>`);
  }
  if(!a.clockOut&&company&&company.end){
    rows.push(`<div class='attendance-timeline-row planned'><time>${escapeHtml(company.end)}</time><span class='attendance-timeline-dot'></span><div><strong>退勤予定</strong><small>${company.name?escapeHtml(company.name):'会社カレンダー'}</small></div></div>`);
  }
  if(!rows.length&&company&&company.start){
    rows.push(`<div class='attendance-timeline-row planned'><time>${escapeHtml(company.start)}</time><span class='attendance-timeline-dot'></span><div><strong>出勤予定</strong><small>まだ打刻はありません</small></div></div>`);
  }
  return rows.length?rows.join(''):`<div class='attendance-empty'><strong>本日の打刻はまだありません</strong><span>出勤するとここに時系列で表示されます。</span></div>`;
}

function openAttendanceTodayHistory(){
  const d=state.data;
  if(!d||!d.attendance)return;
  const a=d.attendance, count=Array.isArray(a.history)?a.history.length:0;
  const root=ensureModal();
  root.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div>
    <section class='modal-card attendance-event-modal' role='dialog' aria-modal='true' aria-labelledby='attendanceEventTitle'>
      <div class='modal-head'><div><small>${escapeHtml(fmtDate(d.today))}</small><h2 id='attendanceEventTitle'>今日の操作履歴</h2></div><button type='button' class='secondary-button compact' onclick='closeModal()'>閉じる</button></div>
      <p class='attendance-event-note'>出勤・休憩・退勤・勤務場所の変更（${count}件）</p>
      <div class='attendance-timeline'>${attendanceTimeline(a,d.companyToday||null)}</div>
    </section>`;
}

function attendanceScheduledMinutes(company){
  if(!company||!company.working||!company.start||!company.end)return 0;
  const toMin=v=>{const p=String(v).split(':').map(Number);return p.length===2?p[0]*60+p[1]:0};
  return Math.max(0,toMin(company.end)-toMin(company.start)-Number(company.breakMinutes||0));
}

function attendanceTodayRow(preview){
  return preview&&Array.isArray(preview.daily)?preview.daily.find(x=>x.date===state.data.today)||null:null;
}

function attendanceAlerts(preview){
  const items=[],review=state.data&&state.data.monthlyReview,today=attendanceTodayRow(preview);
  if(review&&review.needsAttention){
    items.push({tone:'danger',title:`${review.targetMonth}の勤怠確認が${review.stale?'再度必要です':'未完了です'}`,sub:review.message,action:"openPreviousMonthReview()"});
  }
  if(!preview&&!items.length){
    const error=state.attendancePreview&&state.attendancePreview.error;
    return `<div class='attendance-alert-empty' role='status'><div><strong>${error?'勤怠の確認状況を取得できませんでした':'月間の勤怠を確認しています'}</strong><small>${error?'月間カレンダーの再読込から確認してください。':'取得が終わるまで、問題の有無は未確定です。'}</small></div></div>`;
  }
  if(today&&today.issue){
    items.push({tone:'danger',title:today.issueType||'本日の勤怠に確認事項があります',sub:'内容を確認し、必要に応じて打刻修正を申請してください。',action:`openAttendancePreviewDay('${today.date}')`});
  }
  if(today&&today.worklogIssue){
    const diff=Math.abs(Number(today.worklogDifferenceMinutes||0));
    items.push({tone:'warning',title:'工数と実働に差異があります',sub:`差異 ${formatMinutesClient(diff)}。工数画面で確認してください。`,action:"navigate('worklog')"});
  }
  if(!items.length)return `<div class='attendance-alert-empty'><span>✓</span><div><strong>現在、確認が必要な勤怠はありません</strong><small>問題が見つかった場合はここに表示します。</small></div></div>`;
  return items.slice(0,3).map(x=>`<button class='attendance-alert-item ${x.tone}' onclick="${x.action}"><span>!</span><div><strong>${escapeHtml(x.title)}</strong><small>${escapeHtml(x.sub)}</small></div><b>›</b></button>`).join('');
}

function attendanceTodayStats(a,company,preview){
  const today=attendanceTodayRow(preview);
  const breakMinutes=today?Number(today.breakMinutes||0):0;
  const scheduled=attendanceScheduledMinutes(company);
  const remaining=scheduled?Math.max(0,scheduled-Number(a.workedMinutes||0)):null;
  return `<div class='attendance-today-stats'>
    <div><span>実働</span><strong data-live-worked>${escapeHtml(liveWorkedText(a))}</strong><small>${scheduled?'予定 '+formatMinutesClient(scheduled):'勤務予定未設定'}</small></div>
    <div><span>休憩</span><strong>${formatMinutesClient(breakMinutes)}</strong><small>${company&&company.breakMinutes?'予定 '+formatMinutesClient(company.breakMinutes):'—'}</small></div>
    <div><span>残り</span><strong>${remaining===null?'—':formatMinutesClient(remaining)}</strong><small>${company&&company.end?'退勤予定 '+escapeHtml(company.end):'終了時刻未設定'}</small></div>
  </div>`;
}

function attendanceDayTone(x){
  if(x.issue)return 'danger';
  if(x.worklogIssue)return 'warning';
  if(x.leaveStatus)return 'leave';
  if(!x.workingDay)return 'off';
  if(x.workMinutes>0)return 'ok';
  return 'empty';
}

function attendanceMonthCalendar(preview){
  if(!preview){
    const err=state.attendancePreview&&state.attendancePreview.error;
    return err?`<div class='attendance-preview-error'><strong>${escapeHtml(err)}</strong><button onclick="loadAttendancePreview({force:true})">再読込</button></div>`:`<div class='attendance-calendar-skeleton'></div>`;
  }
  const parts=preview.yearMonth.split('-').map(Number),first=new Date(parts[0],parts[1]-1,1);
  const blanks=Array.from({length:first.getDay()},()=>`<span class='attendance-mini-day blank'></span>`).join('');
  const cells=preview.daily.map(x=>{
    const n=Number(x.date.slice(-2)),tone=attendanceDayTone(x),today=x.date===state.data.today;
    return `<button class='attendance-mini-day ${tone} ${today?'today':''}' onclick="openAttendancePreviewDay('${x.date}')" aria-label='${escapeHtml(x.date)}'><span>${n}</span><i></i></button>`;
  }).join('');

const worklogWindowCache=new Map();

let worklogWindowGeneration=0;

let worklogActiveRequest=null;
// Limit concurrency, but do not let an obsolete range block the currently selected range.
const worklogWindowRequests=new Map();
const WORKLOG_MAX_CONCURRENT_READS=2;
// Empty project/task lists are valid results, not a signal to reload on every day.
const WORKLOG_CATALOG_TTL=300000;
let worklogCatalogState_={identity:'',at:0};
let worklogCatalogEpoch_=0,worklogCatalogIssued_=0,worklogCatalogApplied_=0;
function invalidateWorklogCatalog_(){
  worklogCatalogEpoch_++;
  worklogCatalogState_={identity:'',at:0};
  // Only invalidate master lists, not independent daily worklog records.
  worklogWindowCache.forEach(entry=>{entry.projects=null;entry.taskOptions=null;});
}
function worklogCatalogFresh_(){
 return worklogCatalogState_.identity===worklogWindowIdentity()&&
   Date.now()-worklogCatalogState_.at<WORKLOG_CATALOG_TTL&&
   Array.isArray(state.data&&state.data.projects)&&
   Array.isArray(state.worklog&&state.worklog.taskOptions);
}

function worklogWindowIdentity(){
  const employeeId=state.data&&state.data.user&&state.data.user.employeeId||'';
  return String(state.sessionToken||'')+'|'+String(employeeId);
}

function worklogWindowRange(date){
  // Cache the calendar month and one extra week on both sides, reducing
  // day-by-day and month-boundary navigation to local, zero-RPC switches.
  const grid=monthGridRange(date);
  return {start:addDays(grid.start,-7),end:addDays(grid.end,7)};
}

function worklogCachedWindow(date){
  const identity=worklogWindowIdentity();
  let winner=null;
  worklogWindowCache.forEach(entry=>{
    if(entry.identity!==identity||date<entry.start||date>entry.end)return;
    if(!winner||entry.at>winner.at)winner=entry;
  });
  return winner;
}

function worklogStoreWindow(identity,range,data,includesCatalog=false,catalogEpoch=worklogCatalogEpoch_,catalogTicket=0){
  const acceptsCatalog=includesCatalog&&catalogEpoch===worklogCatalogEpoch_&&
    identity===worklogWindowIdentity()&&
    catalogTicket>=worklogCatalogApplied_&&
    Array.isArray(data&&data.projects)&&Array.isArray(data&&data.taskOptions);
  const entry={
    identity:identity,start:range.start,end:range.end,at:Date.now(),
    items:Array.isArray(data&&data.items)?data.items:[],
    taskOptions:acceptsCatalog?data.taskOptions:null,
    projects:acceptsCatalog?data.projects:null
  };
  if(acceptsCatalog){
    // A late response must never replace a newer catalog or resurrect a
    // catalog invalidated by a project write or by a new user.
    state.data.projects=data.projects;
    state.worklog.taskOptions=data.taskOptions;
    worklogCatalogApplied_=catalogTicket;
    worklogCatalogState_={identity:identity,at:Date.now()};
  }
  const key=identity+'|'+range.start+'|'+range.end;
  worklogWindowCache.delete(key);
  worklogWindowCache.set(key,entry);
  while(worklogWindowCache.size>6){
    const oldest=worklogWindowCache.keys().next().value;
    worklogWindowCache.delete(oldest);
  }
  return entry;
}

function worklogShowCachedDay(date,entry){
  const items=entry.items.filter(item=>item.date===date);
  state.worklog.items=items;
  state.worklog.totalMinutes=items.reduce((total,item)=>total+Number(item.minutes||0),0);
  state.worklog.loadedDate=date;
  state.worklog.loading=false;
  state.worklog.error='';
  // A cached date is independent from the globally freshest project catalog.
  // Never restore an older project's options just because its day was visited.
  markPageCache('worklog',date);
}

function invalidateWorklogWindowCache(){
  worklogWindowGeneration++;
  worklogWindowCache.clear();
  worklogWindowRequests.forEach(request=>endPageLoad(request.ticket));
  worklogWindowRequests.clear();
  worklogActiveRequest=null;
  state.worklog.loadedDate=null;
}

function loadWorklogs(options={}){
  if(!state.data||!state.data.user||!state.sessionToken)return;
  if(!state.worklog.date)state.worklog.date=state.data.today;
  const date=state.worklog.date,identity=worklogWindowIdentity();
  const cached=worklogCachedWindow(date);
  const fresh=!!(cached&&(Date.now()-cached.at)<300000);
  if(cached){
    const switchedDay=state.worklog.loadedDate!==date;
    worklogShowCachedDay(date,cached);
    if(switchedDay||!options.silent)renderPageIfActive('worklog');
    if(fresh&&!options.force&&worklogCatalogFresh_())return;
  }else{
    state.worklog.loadedDate=null;
    state.worklog.items=[];
    state.worklog.totalMinutes=0;
    state.worklog.loading=true;
    state.worklog.error='';
    if(!options.silent)renderPageIfActive('worklog');
  }
  const range=worklogWindowRange(date);
  // Projects only need an initial load and explicit force refresh.
  const includeProjects=!!options.force||!worklogCatalogFresh_();
  const catalogEpoch=worklogCatalogEpoch_;
  const catalogTicket=includeProjects?++worklogCatalogIssued_:0;
  const generation=worklogWindowGeneration;
  const requestKey=identity+'|'+range.start+'|'+range.end;
  if(worklogWindowRequests.has(requestKey))return;
  // A second distinct range may load while the previous one is still running.
  // Rapid repeated clicks inside the same range remain a single request.
  if(worklogWindowRequests.size>=WORKLOG_MAX_CONCURRENT_READS)return;
  const ticket=beginPageLoad('worklogWindow',generation+'|'+requestKey);
  if(!ticket)return;
  const request={ticket,identity,generation,range,key:requestKey};
  worklogWindowRequests.set(requestKey,request);
  worklogActiveRequest=request;
  const finalize=()=>{
    endPageLoad(ticket);
    if(worklogWindowRequests.get(requestKey)===request)worklogWindowRequests.delete(requestKey);
    if(worklogActiveRequest===request)worklogActiveRequest=worklogWindowRequests.values().next().value||null;
  };
  const started=Date.now();
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(data=>{
    finalize();
    const currentIdentity=worklogWindowIdentity();
    if(identity!==currentIdentity)return;
    if(generation!==worklogWindowGeneration){
      if(state.page==='worklog')loadWorklogs({force:true});
      return;
    }
    worklogStoreWindow(identity,range,includeProjects?(data||{}):{...(data||{}),projects:null,taskOptions:null},includeProjects,catalogEpoch,catalogTicket);
    if(typeof console!=='undefined'&&console.debug)console.debug('[FM WORKS] worklog range '+(Date.now()-started)+'ms ('+range.start+' / '+range.end+')');
    const selected=state.worklog.date||state.data.today;
    const selectedCache=worklogCachedWindow(selected);
    if(selectedCache){
      worklogShowCachedDay(selected,selectedCache);
      renderPageIfActive('worklog');
      if((Date.now()-selectedCache.at)>=300000&&state.page==='worklog'){
        loadWorklogs({force:true,silent:true});
      }
    }else if(state.page==='worklog'){
      loadWorklogs();
    }
  }).withFailureHandler(err=>{
    finalize();
    if(identity!==worklogWindowIdentity())return;
    if(generation!==worklogWindowGeneration){
      if(state.page==='worklog')loadWorklogs({force:true});
      return;
    }
    const selected=state.worklog.date||state.data.today;
    if(selected<range.start||selected>range.end){
      if(state.page==='worklog')loadWorklogs();
      return;
    }
    if(!worklogCachedWindow(selected)){
      state.worklog.loading=false;
      state.worklog.loadedDate=null;
      state.worklog.error='工数の取得に失敗しました。';
    }
    if(!options.silent)handleApiError(err,'工数を読み込めませんでした');
    renderPageIfActive('worklog');
  }).getWorklogs(state.sessionToken,{
    start:range.start,end:range.end,includeProjects
  });
}

function worklogTimeToMinutes(value){
  const p=String(value||'').split(':').map(Number);
  return p.length===2&&Number.isFinite(p[0])&&Number.isFinite(p[1])?p[0]*60+p[1]:0;
}

function worklogMinutesToTime(value){
  const m=Math.max(0,Math.min(1439,Math.round(Number(value||0))));
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}

function worklogDisplayData(){

  const ready=w.loadedDate===date;
  const realItems=ready?(w.items||[]).slice():[];

  return {

    attendanceMinutes:attendanceMinutes,

  };
}

function worklogProjectTone(project){
  const tones=['blue','green','purple','orange','pink','slate'];
  let hash=0;String(project||'').split('').forEach(ch=>{hash=(hash*31+ch.charCodeAt(0))>>>0});
  return tones[hash%tones.length];
}

function worklogBreakRanges(display){
  const date=state.worklog.date||state.data.today;
  if(date!==state.data.today)return [];
  const history=(state.data.attendance&&state.data.attendance.history||[]).slice().sort((a,b)=>String(a.time).localeCompare(String(b.time)));
  const ranges=[];let start=null;
  history.forEach(x=>{
    if(x.action==='休憩開始')start=worklogTimeToMinutes(x.time);
    if(x.action==='休憩終了'&&start!==null){ranges.push({start:start,end:worklogTimeToMinutes(x.time)});start=null}
  });
  if(start!==null&&state.data.attendance.state==='break'){
    const server=new Date(state.data.serverTime||Date.now());
    ranges.push({start:start,end:server.getHours()*60+server.getMinutes()});
  }
  return ranges.filter(x=>x.end>x.start);
}

function worklogTimelineBounds(display){
  const date=state.worklog.date||state.data.today,items=display.items||[];
  if(date===state.data.today&&state.data.attendance&&state.data.attendance.clockIn){
    const start=worklogTimeToMinutes(state.data.attendance.clockIn);
    const end=state.data.attendance.clockOut
      ?worklogTimeToMinutes(state.data.attendance.clockOut)
      :(()=>{const d=new Date(state.data.serverTime||Date.now());return d.getHours()*60+d.getMinutes()})();
    return {start:start,end:Math.max(start+1,end)};
  }
  if(items.length){
    return {
      start:Math.min(...items.map(x=>worklogTimeToMinutes(x.start))),
      end:Math.max(...items.map(x=>worklogTimeToMinutes(x.end)))
    };
  }
  return {start:540,end:1080};
}

function worklogTimelineSegments(display){
  const bounds=worklogTimelineBounds(display),items=(display.items||[]).slice(),breaks=worklogBreakRanges(display);
  if(!items.length&&(state.worklog.date||state.data.today)!==state.data.today)return [];
  if(!items.length&&!state.data.attendance.clockIn)return [];
  const points=new Set([bounds.start,bounds.end]);
  items.forEach(x=>{points.add(Math.max(bounds.start,worklogTimeToMinutes(x.start)));points.add(Math.min(bounds.end,worklogTimeToMinutes(x.end)))});
  breaks.forEach(x=>{points.add(Math.max(bounds.start,x.start));points.add(Math.min(bounds.end,x.end))});
  const sorted=[...points].filter(x=>x>=bounds.start&&x<=bounds.end).sort((a,b)=>a-b),segments=[];
  for(let i=0;i<sorted.length-1;i++){
    const start=sorted[i],end=sorted[i+1];if(end<=start)continue;
    const br=breaks.find(x=>x.start<=start&&x.end>=end);
    if(br){segments.push({type:'break',start,end,label:'休憩'});continue}
    const item=items.find(x=>worklogTimeToMinutes(x.start)<=start&&worklogTimeToMinutes(x.end)>=end);
    if(item){segments.push({type:'work',start,end,item:item,label:item.project});continue}
    segments.push({type:'gap',start,end,label:(state.worklog.date||state.data.today)===state.data.today?'未入力':'未入力候補'});
  }
  return segments;
}

function worklogFirstGap(display){
  const gap=worklogTimelineSegments(display).find(x=>x.type==='gap'&&x.end>x.start);
  if(gap)return {start:worklogMinutesToTime(gap.start),end:worklogMinutesToTime(gap.end)};
  const items=(display.items||[]).slice().sort((a,b)=>String(a.end).localeCompare(String(b.end)));
  const start=items.length?worklogTimeToMinutes(items[items.length-1].end):540;
  return {start:worklogMinutesToTime(start),end:worklogMinutesToTime(Math.min(start+60,1439))};
}

const SCHEDULE_WINDOW_TTL=300000;
const SCHEDULE_RETRY_COOLDOWN=30000;
const SCHEDULE_MAX_WINDOWS=6;
const scheduleWindowCache=new Map();
const scheduleWindowRequests=new Map();
let scheduleWindowGeneration=0;
let scheduleDateIndexSource=null;
let scheduleDateIndex=null;
function scheduleWindowIdentity(){
  return String(state.sessionToken||'')+'|'+String(state.data&&state.data.user&&state.data.user.employeeId||'');
}
function scheduleWindowKey(identity,range){
  return identity+'|'+range.start+'|'+range.end;
}
function scheduleWindowForDate(date){
  const range=monthGridRange(date);
  return scheduleWindowCache.get(scheduleWindowKey(scheduleWindowIdentity(),range))||null;
}
function scheduleFilterEvents(events,employeeId,category){
  return (events||[]).filter(e=>
    (employeeId==='ALL'||(Array.isArray(e.employeeIds)&&e.employeeIds.includes(employeeId)))&&
    (category==='ALL'||e.category===category)
  );
}
function scheduleLoaded(){
  const s=state.schedule;
  return !!(s.loadedKey&&s.loadedKey===scheduleCacheKey()&&s.loadedIdentity===scheduleWindowIdentity());
}
function applyScheduleWindow(entry){
  if(!entry||entry.identity!==scheduleWindowIdentity()||entry.key!==scheduleCacheKey())return false;
  const s=state.schedule;
  s.rawEvents=entry.events;
  s.events=scheduleFilterEvents(entry.events,s.employeeId,s.category);
  s.companyDays=entry.companyDays;
  s.loadedIdentity=entry.identity;
  s.loadedKey=entry.key;
  s.loading=false;
  s.error='';
  if(s.selectedEventId&&!s.events.some(e=>e.id===s.selectedEventId))s.selectedEventId=null;
  markPageCache('schedule',entry.key);
  return true;
}
function saveScheduleWindow(identity,range,data){
  const entry={
    identity,key:range.start+'|'+range.end,start:range.start,end:range.end,at:Date.now(),
    events:Array.isArray(data&&data.events)?data.events:[],
    companyDays:Array.isArray(data&&data.companyDays)?data.companyDays:[]
  };
  const cacheKey=scheduleWindowKey(identity,range);
  scheduleWindowCache.delete(cacheKey);
  scheduleWindowCache.set(cacheKey,entry);
  while(scheduleWindowCache.size>SCHEDULE_MAX_WINDOWS)scheduleWindowCache.delete(scheduleWindowCache.keys().next().value);
  return entry;
}
function invalidateScheduleWindowCache(){
  scheduleWindowGeneration++;
  scheduleWindowCache.clear();
  // Old in-flight requests cannot update the new generation. Release their
  // page-loading reservations now; stale callbacks remain harmless.
  scheduleWindowRequests.forEach(request=>endPageLoad(request.ticket));
  scheduleWindowRequests.clear();
  scheduleDateIndexSource=null;
  scheduleDateIndex=null;
  const s=state.schedule;
  s.loadedKey='';
  s.loadedIdentity='';
  s.events=[];
  s.rawEvents=[];
  s.companyDays=[];
  s.loading=false;
  s.refreshing=false;
  s.error='';
}
function eventsFor(date){
  const items=state.schedule.events||[];
  if(scheduleDateIndexSource!==items){
    scheduleDateIndexSource=items;
    scheduleDateIndex=new Map();
    items.forEach(e=>{
      const key=String(e.date||'');
      if(!scheduleDateIndex.has(key))scheduleDateIndex.set(key,[]);
      scheduleDateIndex.get(key).push(e);
    });
  }
  return scheduleDateIndex.get(date)||[];
}
function companyDayMap(){return Object.fromEntries((state.schedule.companyDays||[]).map(d=>[d.date,d]));}
function scheduleSelectedDate(){return state.schedule.selectedDate||state.schedule.date||state.data.today;}
function loadSchedule(options={}){
  const s=state.schedule;
  if(!state.sessionToken||!state.data||!s.date)return;
  const identity=scheduleWindowIdentity(),range=monthGridRange(s.date),
    displayKey=range.start+'|'+range.end,
    requestKey=scheduleWindowKey(identity,range),
    cached=scheduleWindowCache.get(requestKey);
  let available=scheduleLoaded();
  const wasLoaded=available;
  if(cached)available=applyScheduleWindow(cached);
  if(cached&&!options.force&&(Date.now()-cached.at<SCHEDULE_WINDOW_TTL||Date.now()<Number(cached.retryAfter||0))){
    s.refreshing=false;
    if(!options.silent||(!wasLoaded&&available))renderPageIfActive('schedule');
    return;
  }
  const generation=scheduleWindowGeneration;
  const activeKey=generation+'|'+requestKey;
  s.loading=!available;
  s.refreshing=available;
  s.error='';
  if(!options.silent)renderPageIfActive('schedule');
  if(scheduleWindowRequests.has(activeKey))return;
  if(scheduleWindowRequests.size>=2)return;
  const ticket=beginPageLoad('scheduleWindow',activeKey);
  if(!ticket)return;
  const session=state.sessionToken;
  scheduleWindowRequests.set(activeKey,{generation,identity,session,displayKey,ticket});
  const finalize=()=>{
    endPageLoad(ticket);
    scheduleWindowRequests.delete(activeKey);
  };
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(data=>{
    finalize();
    if(generation!==scheduleWindowGeneration||session!==state.sessionToken||identity!==scheduleWindowIdentity())return;
    const stored=saveScheduleWindow(identity,range,data);
    if(scheduleCacheKey()===displayKey){
      applyScheduleWindow(stored);
      s.refreshing=false;
      if(Array.isArray(data&&data.employees)&&data.employees.length)s.employees=data.employees;
      renderPageIfActive('schedule');
      if(s.mobileDetailOpen)scheduleFocusDetail();
    }else if(!scheduleLoaded()){
      loadSchedule({silent:state.page!=='schedule'});
    }
  }).withFailureHandler(err=>{
    finalize();
    if(generation!==scheduleWindowGeneration||session!==state.sessionToken||identity!==scheduleWindowIdentity())return;
    const isAuth=/AUTH_REQUIRED|SESSION_EXPIRED/.test(sessionErrorMessage(err));
    if(!isAuth){const existing=scheduleWindowCache.get(requestKey);if(existing)existing.retryAfter=Date.now()+SCHEDULE_RETRY_COOLDOWN;}
    if(isAuth){handleApiError(err,'予定表の認証に失敗しました');return;}
    if(scheduleCacheKey()===displayKey){
      s.loading=false;
      s.refreshing=false;
      if(!scheduleLoaded())s.error='予定を読み込めませんでした。通信状態を確認して再読込してください。';
      if(!options.silent)showToast('予定表の最新データを取得できませんでした');
      renderPageIfActive('schedule');
    }else if(!scheduleLoaded()){
      loadSchedule({silent:state.page!=='schedule'});
    }
  }).getScheduleBundle(session,{
    start:range.start,end:range.end,employeeId:'ALL',category:'ALL',includeEmployees:false
  });
}
function changeScheduleView(view){

  s.date=s.view==='month'||s.view==='list'

function scheduleToday(){scheduleJumpTo(state.data.today);}
function scheduleJumpTo(date){
  const value=String(date||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||iso(parseIso(value))!==value)return;
  const s=state.schedule;
  s.date=value;
  s.selectedDate=value;
  s.selectedEventId=null;
  s.mobileDetailOpen=false;
  loadSchedule();
}
function setScheduleFilter(kind,value){
  if(!['employeeId','category'].includes(kind))return;
  const s=state.schedule;
  s[kind]=String(value||'ALL');
  if(kind==='employeeId')s.highlightEmployeeId='ALL';
  s.selectedEventId=null;
  s.mobileDetailOpen=false;
  if(scheduleLoaded())s.events=scheduleFilterEvents(s.rawEvents||[],s.employeeId,s.category);
  loadSchedule();
}
function scheduleIsSmallScreen(){
  return typeof window!=='undefined'&&typeof window.matchMedia==='function'&&
    window.matchMedia('(max-width:1320px)').matches;
}
function scheduleFocusDetail(){
  requestAnimationFrame(()=>{
    if(state.page!=='schedule')return;
    const target=document.getElementById('scheduleDetailPanel');
    if(target&&scheduleIsSmallScreen())target.focus({preventScroll:true});
    else if(typeof document.querySelector==='function'){
      const dateButton=document.querySelector('.month-day.selected .day-open');
      if(dateButton)dateButton.focus({preventScroll:true});
    }
  });
}
function selectScheduleDay(date,eventId=''){
  const value=String(date||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||iso(parseIso(value))!==value)return;
  const s=state.schedule,oldKey=scheduleCacheKey();
  s.selectedDate=value;
  s.selectedEventId=eventId||null;
  s.mobileDetailOpen=true;
  if((s.view==='month'||s.view==='list')&&s.date.slice(0,7)!==value.slice(0,7))s.date=value;
  if(s.view==='week'&&(value<startOfWeek(s.date)||value>endOfWeek(s.date)))s.date=value;
  if(s.view==='day')s.date=value;
  renderPageIfActive('schedule');
  if(scheduleCacheKey()!==oldKey)loadSchedule();
  scheduleFocusDetail();
}
function selectScheduleEvent(id){
  const e=(state.schedule.events||[]).find(item=>item.id===id);
  if(e)selectScheduleDay(e.date,e.id);
}
function moveSelectedScheduleDay(step){
  selectScheduleDay(addDays(scheduleSelectedDate(),step));
}
function closeScheduleDetail(){
  if(!state.schedule.mobileDetailOpen)return;
  state.schedule.mobileDetailOpen=false;
  renderPageIfActive('schedule');
  requestAnimationFrame(()=>{
    if(typeof document.querySelector==='function'){
      const el=document.querySelector('.month-day.selected .day-open')||
        document.getElementById('scheduleOpenDetails');
      if(el)el.focus({preventScroll:true});
    }
  });
}
function onScheduleDetailKeydown(e){
  if(!state.schedule.mobileDetailOpen||!scheduleIsSmallScreen())return;
  if(e.key==='Escape'){
    e.preventDefault();
    if(typeof e.stopPropagation==='function')e.stopPropagation();
    closeScheduleDetail();
    return;
  }
  if(e.key!=='Tab')return;
  const panel=document.getElementById('scheduleDetailPanel');
  const focusables=modalFocusables_(panel);
  if(!focusables.length){e.preventDefault();panel.focus();return;}
  const first=focusables[0],last=focusables[focusables.length-1],active=document.activeElement;
  if(!panel.contains(active)){e.preventDefault();(e.shiftKey?last:first).focus();return;}
  if(e.shiftKey&&active===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&active===last){e.preventDefault();first.focus();}
}

function scheduleHighlightClass(e){
  const chosen=state.schedule.highlightEmployeeId||'ALL';
  if(chosen==='ALL')return '';
  return (e.employeeIds||[]).includes(chosen)?'schedule-is-emphasized':'schedule-is-dimmed';
}
function scheduleEmployeeData(e){
  return escapeHtml((e.employeeIds||[]).join(','));
}
function toggleScheduleEmployeeHighlight(employeeId){
  const s=state.schedule,employees=s.employees.length?s.employees:(state.data&&state.data.employees||[]),
    id=String(employeeId||'ALL');
  if(id!=='ALL'&&!employees.some(x=>x.employeeId===id))return;
  s.highlightEmployeeId=id==='ALL'||s.highlightEmployeeId===id?'ALL':id;
  const chosen=s.highlightEmployeeId;
  const root=document.getElementById('content');
  if(!root||state.page!=='schedule')return;
  root.querySelectorAll('[data-schedule-employee-ids]').forEach(el=>{
    const ids=String(el.dataset.scheduleEmployeeIds||'').split(',').filter(Boolean);
    el.classList.toggle('schedule-is-emphasized',chosen!=='ALL'&&ids.includes(chosen));
    el.classList.toggle('schedule-is-dimmed',chosen!=='ALL'&&!ids.includes(chosen));
  });
  root.querySelectorAll('.schedule-person-button[data-employee-id]').forEach(el=>{
    const selected=chosen===el.dataset.employeeId;
    el.classList.toggle('is-emphasized',selected);
    el.setAttribute('aria-pressed',String(selected));
  });
  const label=employees.find(e=>e.employeeId===chosen);
  const status=document.getElementById('scheduleHighlightStatus');
  if(status)status.textContent=label?shortPersonName(label.name)+'さんの予定を強調中':'名前をクリックすると予定を強調します';
  const reset=document.getElementById('scheduleHighlightReset');
  if(reset)reset.hidden=chosen==='ALL';
}

function monthView(){
  const s=state.schedule,range=monthGridRange(s.date),map=companyDayMap(),
    currentMonth=parseIso(s.date).getMonth(),selected=scheduleSelectedDate(),cells=[];
  for(let date=range.start;;date=addDays(date,1)){
    const dt=parseIso(date),ev=eventsFor(date),day=map[date],
      off=day&&!day.working,selectedDay=date===selected;
    const holiday=!!(day&&!day.working&&day.type!=='週末');
    const weekend=dt.getDay()===0?'schedule-sunday':dt.getDay()===6?'schedule-saturday':'';
    const dayTone=holiday?'schedule-holiday':day&&day.working&&weekend?'schedule-adjusted-workday':weekend;
    cells.push(`<div class='month-day ${dt.getMonth()!==currentMonth?'outside':''} ${isToday(date)?'today':''} ${off?'day-off':''} ${dayTone} ${selectedDay?'selected':''}' data-date='${date}' onclick="selectScheduleDay(this.dataset.date)">
      <div class='day-head'>
        <button type='button' class='day-open' data-date='${date}' aria-pressed='${selectedDay}' aria-label='${escapeHtml(fmtDate(date))}の予定${ev.length}件を表示' onclick='event.stopPropagation();selectScheduleDay(this.dataset.date)'>${dt.getDate()}</button>
        ${day&&day.type!=='通常勤務'?`<em class='day-type ${day.working?'workday':'offday'}'>${escapeHtml(day.name||day.type)}</em>`:''}
      </div>
      <div class='day-events'>
        ${ev.slice(0,2).map(eventChip).join('')}
        ${ev.length>2?`<button type='button' class='more-events' data-date='${date}' onclick="event.stopPropagation();selectScheduleDay(this.dataset.date)" aria-label='${escapeHtml(fmtDate(date))}の残り${ev.length-2}件を表示'>＋${ev.length-2}件</button>`:''}

    </div>`);
    if(date===range.end)break;
  }
  return `<div class='weekday-row'>${['日','月','火','水','木','金','土'].map(x=>`<div>${x}</div>`).join('')}</div><div class='month-grid'>${cells.join('')}</div>`;
}
function scheduleMinutes(value){
  const match=String(value||'').match(/^(\d{1,2}):(\d{2})$/);
  if(!match)return null;
  const h=Number(match[1]),m=Number(match[2]);
  return h>=0&&h<=24&&m>=0&&m<60&&(h!==24||m===0)?h*60+m:null;
}
function scheduleTimeBounds(events){
  let first=8,last=19;
  events.forEach(e=>{
    if(e.allDay)return;
    const a=scheduleMinutes(e.start),b=scheduleMinutes(e.end);
    if(a!==null)first=Math.min(first,Math.floor(a/60));
    if(b!==null)last=Math.max(last,Math.ceil(b/60));
    else if(a!==null)last=Math.max(last,Math.ceil((a+60)/60));
  });
  return {start:Math.max(0,first),end:Math.min(24,Math.max(first+1,last))};
}
function scheduleTimelineLayout(events,bounds){
  const lo=bounds.start*60,hi=bounds.end*60;
  const items=events.filter(e=>!e.allDay&&scheduleMinutes(e.start)!==null)
    .map(e=>{
      const a=scheduleMinutes(e.start),rawEnd=scheduleMinutes(e.end);
      return {event:e,start:Math.max(lo,Math.min(hi-1,a)),end:Math.max(lo,Math.min(hi,rawEnd!==null&&rawEnd>a?rawEnd:a+60)),column:0,columns:1};
    }).sort((a,b)=>a.start-b.start||a.end-b.end);
  let group=[],maxEnd=-1;
  function layoutGroup(){
    if(!group.length)return;
    const activeEnds=[];
    group.forEach(item=>{
      let col=activeEnds.findIndex(end=>end<=item.start);
      if(col<0){col=activeEnds.length;activeEnds.push(item.end);}
      else activeEnds[col]=item.end;
      item.column=col;
    });
    group.forEach(item=>item.columns=activeEnds.length);
    group=[];
    maxEnd=-1;
  }
  for(const item of items){
    if(group.length&&item.start>=maxEnd)layoutGroup();
    group.push(item);
    maxEnd=Math.max(maxEnd,item.end);
  }
  layoutGroup();
  return items;
}
function scheduleTimelineEvent(item,bounds){
  const e=item.event,p=eventPeople(e)[0]||{id:'unknown'},color=personColor(p.id),
    top=(item.start-bounds.start*60)*.8,height=Math.max(28,(item.end-item.start)*.8-3),
    left=100*item.column/item.columns,width=100/item.columns;
  return `<button type='button' class='schedule-timed-event ${scheduleHighlightClass(e)}' data-schedule-employee-ids='${scheduleEmployeeData(e)}' data-event-id='${escapeHtml(e.id)}'
    style='top:${top}px;height:${height}px;left:calc(${left}% + 2px);width:calc(${width}% - 4px);--person-color:${color.line};--person-bg:${color.bg}'
    onclick='selectScheduleEvent(this.dataset.eventId)' title='${escapeHtml(e.title)}'>
    <small>${escapeHtml(e.start||'--:--')}${e.end?' - '+escapeHtml(e.end):''}</small>
    <strong>${escapeHtml(e.title)}</strong>
    <span>${escapeHtml(eventPeopleLabel(e))}</span>
  </button>`;
}
function scheduleTimeboard(columns,bounds,kind){
  const hasTimed=columns.some(col=>col.events.some(e=>!e.allDay&&scheduleMinutes(e.start)!==null));
  const hours=hasTimed?Array.from({length:bounds.end-bounds.start},(_,i)=>bounds.start+i):[],
    height=hasTimed?(bounds.end-bounds.start)*48:0;
  return `<div class='schedule-timeboard ${kind} ${hasTimed?'':'schedule-all-day-only'}' style='--schedule-cols:${columns.length}'>
    <div class='schedule-time-axis'><div class='schedule-time-axis-head'>時刻</div>
      <div class='schedule-time-axis-body' style='height:${height}px'>${hours.map(h=>`<span style='top:${(h-bounds.start)*48}px'>${String(h).padStart(2,'0')}:00</span>`).join('')}</div></div>
    ${columns.map(col=>{
      const allDay=col.events.filter(e=>e.allDay||scheduleMinutes(e.start)===null);
      return `<section class='schedule-time-lane'>
        <header><strong>${escapeHtml(col.label)}</strong><small>${col.events.length}件${col.note?' / '+escapeHtml(col.note):''}</small></header>
        <div class='schedule-all-day'>${allDay.length?allDay.map(e=>`<button type='button' class='schedule-all-day-item ${scheduleHighlightClass(e)}' data-schedule-employee-ids='${scheduleEmployeeData(e)}' data-event-id='${escapeHtml(e.id)}' onclick='selectScheduleEvent(this.dataset.eventId)'>終日 · ${escapeHtml(e.title)}</button>`).join(''):(!hasTimed?`<small class='schedule-lane-empty'>予定なし</small>`:'')}</div>
        <div class='schedule-time-track' style='height:${height}px'>
          ${scheduleTimelineLayout(col.events,bounds).map(item=>scheduleTimelineEvent(item,bounds)).join('')}
        </div>
      </section>`;
    }).join('')}
  </div>`;
}
function weekView(){
  const start=startOfWeek(state.schedule.date),days=companyDayMap(),
    columns=Array.from({length:7},(_,i)=>{
      const date=addDays(start,i),cd=days[date];
      return {label:fmtDate(date),note:cd&&cd.type!=='通常勤務'?(cd.name||cd.type):'',events:eventsFor(date)};
    });
  const bounds=scheduleTimeBounds(columns.flatMap(x=>x.events));
  return `<div class='schedule-board-container'><div class='schedule-board-note'>1週間の予定を時間帯で比較できます。カードを選ぶと右側に詳細を表示します。</div>
    ${scheduleTimeboard(columns,bounds,'week-board')}</div>`;
}
function scheduleDayPeople(){
  const s=state.schedule,all=s.employees.length?s.employees:(state.data.employees||[]),
    wanted=s.employeeId==='ALL'?all:all.filter(p=>p.employeeId===s.employeeId);
  const people=wanted.map(p=>({id:p.employeeId,name:p.name})),seen=new Set(people.map(p=>p.id));
  if(s.employeeId!=='ALL'&&people.length)return people;
  eventsFor(s.date).forEach(e=>{
    (e.employeeIds||[]).forEach((id,i)=>{
      if(!seen.has(id)){seen.add(id);people.push({id,name:(e.employeeNames||[])[i]||id});}
    });
  });
  if(eventsFor(s.date).some(e=>!(e.employeeIds||[]).length))people.push({id:'_unassigned',name:'参加者未設定'});
  if(!people.length)people.push({id:'_all',name:'全社員'});
  return people;
}
function dayView(){
  const date=state.schedule.date,events=eventsFor(date),day=companyDayMap()[date],
    people=scheduleDayPeople(),bounds=scheduleTimeBounds(events),chunks=[];
  for(let i=0;i<people.length;i+=5){
    const group=people.slice(i,i+5);
    chunks.push(group.map(p=>({
      label:p.name,note:'',
      events:p.id==='_all'?events:p.id==='_unassigned'?events.filter(e=>!(e.employeeIds||[]).length):
        events.filter(e=>(e.employeeIds||[]).includes(p.id))
    })));
  }
  return `<div class='schedule-board-container'>
    <div class='schedule-day-heading'><div><h2>${escapeHtml(fmtDate(date))}</h2><p>${day?escapeHtml(day.name||day.type):'会社カレンダー未登録'} / 社員別の時間軸</p></div>
      <button type='button' class='secondary-button compact' onclick="openScheduleEditor('', '${date}')">＋ この日に予定</button></div>
    ${chunks.map(group=>scheduleTimeboard(group,bounds,'day-board')).join('')}
  </div>`;
}

function schedulePage(){
  const s=state.schedule;
  const unavailable=!scheduleLoaded();

      "<strong class='v15-stat-value'>"+value(available&&availableFinance?pending+financePending:null)+"</strong>"+
      "<span class='v15-stat-caption'>自分の申請の処理待ち</span></div></div>"+
    "<div class='card v15-stat'><span class='v15-stat-symbol danger'>"+svg('i-file')+"</span>"+
      "<div class='v15-stat-content'><span class='v15-stat-title'>差戻し</span>"+
      "<strong class='v15-stat-value'>"+value(available&&availableFinance?returned:null)+"</strong>"+
      "<span class='v15-stat-caption'>修正・再申請が必要</span></div></div>"+
    "<div class='card v15-stat'><span class='v15-stat-symbol good'>"+svg('i-chart')+"</span>"+
      "<div class='v15-stat-content'><span class='v15-stat-title'>チーム承認待ち</span>"+

      "<span class='v15-stat-caption'>権限のある人だけ表示</span></div></div></section>";
}

function requestsPage(){
  const r=state.requests;
  if(!requestsDataReady())return `<div class='request-dashboard v15-workspace v15-requests-page'>
    ${requestWorkflowHero_()}
    <section class='request-load-panel' role='${r.error?'alert':'status'}'>
      ${r.error?`<strong>${escapeHtml(r.error)}</strong><button type='button' class='primary-button' onclick='loadRequests({force:true})'>再読込</button>`:
        `<div class='loading-card'></div><span>申請情報を読み込んでいます…</span>`}
    </section></div>`;

    requestTypeCard('有給','有給休暇','残日数を確認して申請'),
    requestTypeCard('午前半休','半休・1/4日','午前・午後・1/4日から選択'),
    requestTypeCard('打刻修正','打刻修正','出勤・退勤などを修正'),
    requestTypeCard('在宅勤務'),
    requestTypeCard('残業'),
    requestTypeCard('休日出勤'),
    requestTypeCard('欠勤')
  ].join('');
  return `<div class='request-dashboard v15-workspace v15-requests-page'>
    ${requestWorkflowHero_()}
    ${requestWorkflowMetrics_()}

    ${requestCompactLeaveAlert()}
    ${requestAnnualLeaveNotice()}
    ${requestOverview()}
    ${r.refreshing?`<div class='request-refresh-hint' role='status'>最新の申請情報を確認中です。表示中の内容はそのまま操作できます。</div>`:''}
    <div class='request-action-layout'>
      <section class='request-launch request-dashboard-launch'>
        <header class='request-panel-heading'><div><span class='eyebrow'>QUICK REQUEST / 新規申請</span><h2>何を申請しますか？</h2><p>申請したい種類を選び、必要な項目だけ入力します。</p></div></header>
        <div class='request-quick-grid'>${quick}</div>

    ${requestHistoryPanel()}
  </div>`;
}
function requestReasonSuggestions(type){
  if(type==='打刻修正')return ['打刻漏れ','操作ミス','その他'];
  if(type==='残業'||type==='休日出勤')return ['業務都合','納期対応','緊急対応','その他'];
  if(type==='在宅勤務')return ['業務都合','外部予定','家庭の都合','その他'];
  if(type==='欠勤')return ['私用','家庭の都合','体調不良','その他'];
  return ['私用','家庭の都合','その他'];
}
function requestTypeHeader(type){
  const meta=REQUEST_UI[type]||REQUEST_UI['有給'];
  return `<div class='request-selected-type ${meta.tone}'><span class='request-modal-mark'>${escapeHtml(meta.mark)}</span><div><small>申請種別</small><strong>${escapeHtml(meta.label)}</strong><p>${escapeHtml(meta.desc)}</p></div></div>`;
}
function requestSubtypeSelector(type){
  if(!['午前半休','午後半休','1/4日有給'].includes(type))return '';
  return `<div class='request-subtypes' role='group' aria-label='休暇区分'>${['午前半休','午後半休','1/4日有給'].map(x=>`<button type='button' class='${x===type?'active':''}' onclick="changeRequestSubtype('${x}')">${escapeHtml(REQUEST_UI[x].label)}</button>`).join('')}</div>`;
}
function requestBalanceSummary(){
  const x=state.requests.context||{};
  if(!x.leaveBalanceConfigured)return `<div class='request-balance-strip warning'><span>有給残日数が未設定です</span><b>管理者の設定が必要</b></div>`;
  return `<div class='request-balance-strip'><span>現在 ${formatLeaveDays(x.leaveBalance)}</span><span>承認待ち ${formatLeaveDays(x.pendingLeaveDays||0)}</span><b>申請可能 ${formatLeaveDays(x.availableLeaveDays)}</b></div>`;
}
function openRequestModal(type='有給',presetDate='',skipInitialPreview=false){
  if(state.requests.submitting)return;
  requestPreviewSequence++;
  const meta=REQUEST_UI[type]?REQUEST_UI[type]:REQUEST_UI['有給'];
  type=REQUEST_UI[type]?type:'有給';
  const r=ensureModal(),today=presetDate||state.data.today;
  const isPaid=['有給','午前半休','午後半休','1/4日有給'].includes(type);
  const single=['午前半休','午後半休','1/4日有給','打刻修正'].includes(type);
  const reasonChips=requestReasonSuggestions(type).map(x=>`<button type='button' onclick="setRequestReason('${escapeHtml(x)}')">${escapeHtml(x)}</button>`).join('');
  r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card request-modal-card request-guided-modal' role='dialog' aria-modal='true' aria-labelledby='requestModalTitle'>
    <div class='modal-head request-modal-head'><div><small>新規申請</small><h2 id='requestModalTitle'>${escapeHtml(meta.label)}を申請</h2></div><button class='icon-button' onclick='closeModal()' aria-label='閉じる'>×</button></div>
    <div id='requestFormError' class='request-form-error' role='alert' aria-live='assertive'></div>
    <div class='request-form-steps' role='list' aria-label='申請の進め方'><span role='listitem'><b>1</b>種類を選択</span><i>›</i><span role='listitem'><b>2</b>日付・理由</span><i>›</i><span role='listitem'><b>3</b>内容を確認</span></div>
    ${requestTypeHeader(type)}
    ${requestSubtypeSelector(type)}
    ${isPaid?requestBalanceSummary():''}
    <input id='reqType' type='hidden' value='${escapeHtml(type)}'>
    <div class='request-form-body'>
      <div class='request-date-grid ${single?'single':''}'>
        <label id='reqStartField' class='field'><span>${single?'対象日':'開始日'} <em>必須</em></span><input id='reqStart' type='date' value='${today}' onchange='syncRequestDates();updateRequestDraftSummary()'></label>
        <label id='reqEndField' class='field ${single?'is-hidden':''}'><span>終了日 <em>必須</em></span><input id='reqEnd' type='date' value='${today}' onchange='refreshRequestPreview();updateRequestDraftSummary()'></label>
      </div>
      <div id='requestPreview' class='request-preview ${isPaid?'':'is-hidden'}'></div>
      <div id='correctionFields' class='request-correction ${type==='打刻修正'?'':'is-hidden'}'>
        <div class='request-block-title'><strong>修正する打刻</strong><span>元の打刻を選ぶか、不足打刻として追加します。</span></div>
        <div class='form-grid'>
          <label class='field full'><span>元の打刻</span><select id='reqOriginalPunch'><option value=''>不足打刻として追加</option></select></label>
          <label id='reqActionField' class='field'><span>打刻種別 <em>必須</em></span><select id='reqAction'><option>出勤</option><option>休憩開始</option><option>休憩終了</option><option>退勤</option></select></label>
          <label id='reqTimeField' class='field'><span>修正後時刻 <em>必須</em></span><input id='reqTime' type='time' onchange='updateRequestDraftSummary()'></label>
          <label class='field'><span>勤務場所</span><select id='reqLocation'><option>出社</option><option>在宅</option><option>外出</option></select></label>
        </div>
      </div>
      <label id='reqReasonField' class='field full request-reason-field'><span>申請理由 <em>必須</em></span><div class='request-reason-chips'>${reasonChips}</div><textarea id='reqReason' rows='2' maxlength='600' placeholder='例：私用のため' oninput='updateRequestDraftSummary()'></textarea></label>
      <label class='field full'><span>補足 <i>任意</i></span><textarea id='reqContent' rows='2' maxlength='1500' placeholder='承認者に伝えたいことがあれば入力' oninput='updateRequestDraftSummary()'></textarea></label>
      <div id='requestDraftSummary' class='request-draft-summary' aria-label='申請前の入力内容確認'></div>
    </div>
    <div class='modal-actions request-modal-actions'><span class='request-submit-hint'>入力内容は申請後も履歴で確認できます。</span><div><button class='secondary-button' onclick='closeModal()'>キャンセル</button><button id='requestSubmitButton' class='primary-button' onclick='submitRequestFromModal()'>${escapeHtml(meta.label)}を申請</button></div></div>
  </section>`;
  if(type==='打刻修正')loadCorrectionPunchOptions();
  if(isPaid&&!skipInitialPreview)refreshRequestPreview();
  updateRequestDraftSummary();
}
function changeRequestSubtype(type){
  const currentReason=document.getElementById('reqReason')?document.getElementById('reqReason').value:'';
  const currentContent=document.getElementById('reqContent')?document.getElementById('reqContent').value:'';
  const currentDate=document.getElementById('reqStart')?document.getElementById('reqStart').value:state.data.today;
  openRequestModal(type,currentDate,true);
  const reason=document.getElementById('reqReason'),start=document.getElementById('reqStart'),end=document.getElementById('reqEnd');
  if(reason)reason.value=currentReason;if(start)start.value=currentDate;if(end)end.value=currentDate;
  const content=document.getElementById('reqContent');if(content)content.value=currentContent;
  refreshRequestPreview();updateRequestDraftSummary();
}
function setRequestReason(value){const el=document.getElementById('reqReason');if(!el)return;el.value=value==='その他'?'':value+(value.endsWith('ため')?'':'のため');el.focus();updateRequestDraftSummary()}
function syncRequestDates(){
  const type=document.getElementById('reqType')?document.getElementById('reqType').value:'';
  const start=document.getElementById('reqStart'),end=document.getElementById('reqEnd');
  const single=['午前半休','午後半休','1/4日有給','打刻修正'].includes(type);
  if(start&&end&&single)end.value=start.value;
  if(type==='打刻修正')loadCorrectionPunchOptions();
  refreshRequestPreview();updateRequestDraftSummary();
}
function updateRequestDraftSummary(){
  const root=document.getElementById('requestDraftSummary'),typeEl=document.getElementById('reqType');
  if(!root||!typeEl)return;
  const type=typeEl.value,meta=REQUEST_UI[type]||{label:type},
    start=document.getElementById('reqStart'),end=document.getElementById('reqEnd'),
    reason=document.getElementById('reqReason'),time=document.getElementById('reqTime');
  const startText=start&&start.value||'未選択',endText=end&&end.value||startText;
  const dateText=startText===endText?startText:startText+' ～ '+endText;
  const fields=[['種類',meta.label],['対象日',dateText]];
  if(type==='打刻修正')fields.push(['修正時刻',time&&time.value||'未入力']);
  fields.push(['申請理由',reason&&reason.value.trim()||'未入力']);
  root.innerHTML='<h3>申請内容の確認</h3><dl>'+
    fields.map(([label,value])=>'<div><dt>'+escapeHtml(label)+'</dt><dd>'+escapeHtml(value)+'</dd></div>').join('')+'</dl>';
}
function requestPayloadFromForm(){
  const type=document.getElementById('reqType').value;
  const start=document.getElementById('reqStart').value;
  const end=document.getElementById('reqEnd').value||start;
  const payload={type,startDate:start,endDate:end,reason:document.getElementById('reqReason').value,content:document.getElementById('reqContent').value};
  if(type==='打刻修正')payload.correction={originalPunchId:document.getElementById('reqOriginalPunch').value,action:document.getElementById('reqAction').value,time:document.getElementById('reqTime').value,workLocation:document.getElementById('reqLocation').value};
  return payload;
}
function clearRequestFieldErrors(){document.querySelectorAll('.request-modal-card .field-error').forEach(x=>x.classList.remove('field-error'))}
function showRequestError(message,fieldId){
  clearRequestFieldErrors();
  const box=document.getElementById('requestFormError');
  if(box){box.innerHTML=`<strong>申請できません</strong><span>${escapeHtml(message)}</span>`;box.classList.add('show')}
  const field=fieldId?document.getElementById(fieldId):null;
  if(field){field.classList.add('field-error');const input=field.querySelector('input,select,textarea');if(input)input.focus()}
  const card=document.querySelector('.request-modal-card');if(card)card.scrollTo({top:0,behavior:'smooth'});
}
function hideRequestError(){const box=document.getElementById('requestFormError');if(box)box.classList.remove('show');clearRequestFieldErrors()}
function validateRequestForm(payload){
  if(!payload.startDate)return ['対象日を選択してください。','reqStartField'];
  if(payload.endDate&&payload.startDate>payload.endDate)return ['終了日は開始日以降にしてください。','reqEndField'];
  if(!String(payload.reason||'').trim())return ['申請理由を入力してください。','reqReasonField'];
  if(['有給','午前半休','午後半休','1/4日有給'].includes(payload.type)){
    const x=state.requests.context||{};
    if(!x.leaveBalanceConfigured)return ['有給残日数が未設定です。管理者に社員情報の有給残日数を設定してもらってください。',''];
  }
  if(payload.type==='打刻修正'&&!payload.correction.time)return ['修正後の時刻を入力してください。','reqTimeField'];
  return null;
}
function refreshRequestPreview(){
  const typeEl=document.getElementById('reqType'),box=document.getElementById('requestPreview');
  if(!typeEl||!box)return;
  const type=typeEl.value;
  if(!['有給','午前半休','午後半休','1/4日有給'].includes(type)){box.classList.add('is-hidden');return}
  const payload=requestPayloadFromForm();
  if(!payload.startDate||!payload.endDate)return;
  box.classList.remove('is-hidden');
  box.innerHTML="<span class='preview-loading'>有給日数を確認しています…</span>";
  const seq=++requestPreviewSequence,identity=requestsIdentity();
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(data=>{
    if(identity!==requestsIdentity()||seq!==requestPreviewSequence||!document.getElementById('requestPreview'))return;
    if(!data.leaveBalanceConfigured){
      box.innerHTML="<div class='preview-warning'><strong>有給残日数が未設定です</strong><span>管理者が社員情報から設定すると、有給を申請できます。</span></div>";
      return;
    }
    const projected=data.projectedBalance;
    const bad=projected<0;
    box.innerHTML=`<div class='preview-item'><span>今回の消化</span><strong>${formatLeaveDays(data.requestedDays)}</strong></div><div class='preview-arrow'>→</div><div class='preview-item'><span>申請後の残数</span><strong class='${bad?'danger':''}'>${formatLeaveDays(projected)}</strong></div>${bad?"<div class='preview-warning full'><strong>残日数が不足しています</strong><span>日付または申請区分を変更してください。</span></div>":''}`;
  }).withFailureHandler(err=>{
    if(identity!==requestsIdentity()||seq!==requestPreviewSequence||!document.getElementById('requestPreview'))return;
    box.innerHTML=`<div class='preview-warning'><strong>日数を確認できません</strong><span>${escapeHtml(cleanApiErrorMessage(err,'会社カレンダーを確認してください。'))}</span></div>`;
  }).previewRequest(state.sessionToken,payload);
}
function loadCorrectionPunchOptions(){
  const date=document.getElementById('reqStart').value;if(!date)return;
  const select=document.getElementById('reqOriginalPunch');if(select)select.innerHTML='<option value="">読み込み中…</option>';
  const identity=requestsIdentity();
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(items){
    if(identity!==requestsIdentity())return;
    const el=document.getElementById('reqOriginalPunch'),start=document.getElementById('reqStart');if(!el||!start||start.value!==date)return;
    el.innerHTML='<option value="">不足打刻として追加</option>'+items.map(x=>'<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.timestamp.slice(11,16)+' '+x.action+' / '+x.workLocation)+'</option>').join('');
  }).withFailureHandler(function(err){if(identity!==requestsIdentity())return;showRequestError(cleanApiErrorMessage(err,'打刻履歴を読み込めませんでした。'),'');}).getPunchesForDate(state.sessionToken,date);
}
function submitRequestFromModal(){
  if(state.requests.submitting)return;
  hideRequestError();
  const payload=requestPayloadFromForm(),invalid=validateRequestForm(payload);
  if(invalid){showRequestError(invalid[0],invalid[1]);return}
  const requestState=state.requests,identity=requestsIdentity();
  requestState.submitting=true;
  const button=document.getElementById('requestSubmitButton');
  if(button){button.disabled=true;button.dataset.label=button.textContent;button.textContent='申請中…'}
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(){
    requestState.submitting=false;
    if(requestState!==state.requests||identity!==requestsIdentity())return;
    closeModal();showToast('申請を登録しました');
    invalidatePageCache('requests','monthly');loadRequests({force:true});
  }).withFailureHandler(function(err){
    requestState.submitting=false;
    if(requestState!==state.requests||identity!==requestsIdentity())return;
    if(button){button.disabled=false;button.textContent=button.dataset.label||'申請する'}
    const msg=cleanApiErrorMessage(err,'申請を登録できませんでした。');
    const field=msg.includes('理由')?'reqReasonField':msg.includes('日')?'reqStartField':'';
    showRequestError(msg,field);
  }).submitRequest(state.sessionToken,payload);
}
function requestApprovedCancel(id){openReasonDialog('承認済み申請の取消を依頼','取消理由を入力してください。承認者の確認後に取消されます。','取消を依頼',function(reason){(typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(){showToast('取消を依頼しました');invalidatePageCache('requests','monthly');loadRequests({force:true});loadNotifications();}).withFailureHandler(function(err){handleApiError(err,'取消依頼できませんでした');}).requestApprovedCancellation(state.sessionToken,id,reason);});}
function approveCancellationRequest(id){openConfirmDialog('取消を承認','承認済み申請を取り消しますか？ 有給の場合は残日数を戻します。','取消を承認',function(){(typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(){showToast('取消を承認しました');invalidatePageCache('requests','monthly','homeOverview');loadRequests({force:true});loadHomeOverview({force:true,silent:true});}).withFailureHandler(function(err){handleApiError(err,'取消承認できませんでした');}).decideApprovedCancellation(state.sessionToken,id,'APPROVE','');},true);}
function rejectCancellationRequest(id){openReasonDialog('取消を却下','申請者に表示する理由を入力してください。','取消を却下',function(reason){(typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(){showToast('取消を却下しました');invalidatePageCache('requests');loadRequests({force:true});}).withFailureHandler(function(err){handleApiError(err,'取消却下できませんでした');}).decideApprovedCancellation(state.sessionToken,id,'REJECT',reason);});}
function cancelOwnRequest(id){openConfirmDialog('申請を取り消す','承認待ちの申請を取り消しますか？','取り消す',function(){(typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(){showToast('申請を取り消しました');invalidatePageCache('requests','monthly');loadRequests({force:true});}).withFailureHandler(function(err){handleApiError(err,'申請を取り消せませんでした');}).cancelRequest(state.sessionToken,id);},true);}
function approveTeamRequest(id){openConfirmDialog('申請を承認','この申請を承認しますか？','承認する',function(){(typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(){showToast('申請を承認しました');invalidatePageCache('requests','monthly','homeOverview');loadRequests({force:true});loadHomeOverview({force:true,silent:true});loadNotifications();}).withFailureHandler(function(err){handleApiError(err,'承認できませんでした');}).approveRequest(state.sessionToken,id,'APPROVE','');},false);}
function rejectTeamRequest(id){openReasonDialog('申請を差し戻す','申請者に表示する差戻し理由を入力してください。','差し戻す',function(comment){(typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(){showToast('申請を差し戻しました');invalidatePageCache('requests','monthly');loadRequests({force:true});loadNotifications();}).withFailureHandler(function(err){handleApiError(err,'差戻しできませんでした');}).approveRequest(state.sessionToken,id,'REJECT',comment);});}


</script>
<script>

function adminPeopleRecords(){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return [];
  return state.authAdmin&&Array.isArray(state.authAdmin.employees)?state.authAdmin.employees:null;
}
function adminPeopleFiltered(){
  const rows=adminPeopleRecords()||[],ui=state.adminUi;
  const query=String(ui.search||'').trim().toLocaleLowerCase('ja-JP');
  return rows.filter(e=>{
    if(ui.role!=='ALL'&&e.role!==ui.role)return false;
    if(ui.status==='active'&&e.active===false)return false;
    if(ui.status==='inactive'&&e.active!==false)return false;
    if(ui.status==='leave'&&(e.active===false||e.leaveBalanceConfigured||e.autoLeaveForecast&&e.autoLeaveForecast.status==='SCHEDULED'))return false;
    if(ui.status==='pin'&&(e.active===false||(e.pinConfigured&&!e.lockedUntil)))return false;
    return !query||[e.name,e.displayName,e.employeeId,e.department,e.title,e.email]
      .some(v=>String(v||'').toLocaleLowerCase('ja-JP').includes(query));
  }).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja'));
}
function adminCurrentEmployee(){
  const visible=adminPeopleFiltered(),ui=state.adminUi;
  const selected=visible.find(e=>e.employeeId===ui.selectedEmployeeId)||visible[0]||null;
  if(selected)ui.selectedEmployeeId=selected.employeeId;
  else ui.selectedEmployeeId='';
  return selected;
}
function adminPeopleRows(){
  const rows=adminPeopleFiltered(),selected=adminCurrentEmployee();
  if(!rows.length)return `<div class='admin-people-empty'><strong>条件に合う社員がいません</strong>
    <p>検索条件を変えるか、絞り込みを解除してください。</p>
    <button type='button' class='secondary-button compact' onclick='resetAdminPeopleFilters()'>絞り込みを解除</button></div>`;
  return rows.map(e=>{
    const selectedRow=!!(selected&&e.employeeId===selected.employeeId),active=e.active!==false;
    const leave=!e.leaveBalanceConfigured&&!(e.autoLeaveForecast&&e.autoLeaveForecast.status==='SCHEDULED'),locked=!!e.lockedUntil;
    return `<button type='button' class='admin-employee-item ${selectedRow?'selected':''}'

function selectAdminEmployee(employeeId){

function setAdminDetailTab(tab){

function refreshAdminPeople(){
  const filtered=adminPeopleFiltered();

function filterAdminPeople(kind,value){
  if(!['search','role','status'].includes(kind))return;

  if(kind==='status'&&!['ALL','active','inactive','leave','pin'].includes(value))return;
  state.adminUi[kind]=String(value||'');

}

function refreshAppData(callback,options={}){

      tasks:rollover?null:(Array.isArray(previous.tasks)?previous.tasks:(data.tasks||null)),
      overviewReady:rollover?false:!!(previous.overviewReady||data.overviewReady)};
    state.workLocation=data.attendance.workLocation||state.workLocation;
    state.schedule.employees=data.employees||state.schedule.employees||[];
    if(rollover){
      if(state.worklog.date===previousToday&&!keepWorklogDate)state.worklog.date=data.today;
      if(state.schedule.date===previousToday&&!state.schedule.selectedEventId)state.schedule.date=data.today;
      if(state.schedule.selectedDate===previousToday&&!state.schedule.selectedEventId)state.schedule.selectedDate=data.today;
      if(state.monthly.yearMonth===previousToday.slice(0,7))state.monthly.yearMonth=data.today.slice(0,7);

    done();if(requestToken===state.sessionToken&&previous===state.data)handleApiError(err,'最新情報を取得できませんでした');
  }).getInitialData(state.sessionToken);
}

// In-memory, session-scoped month result cache. Never put employee summaries in localStorage.
const MONTHLY_RESULT_TTL=300000;
const MONTHLY_CACHE_MAX=10;
const monthlyResultCache=new Map();
const monthlyPendingRequests=new Map();
let monthlyResultGeneration=0;
function monthlyResultKey_(month,employeeId){
  const owner=state.data&&state.data.user&&state.data.user.employeeId||'';
  return String(state.sessionToken||'')+'|'+String(owner)+'|'+String(month||'')+'|'+String(employeeId||'');
}
function monthlyCachedResult_(month,employeeId){
  return monthlyResultCache.get(monthlyResultKey_(month,employeeId))||null;
}
function monthlyRememberResult_(key,data){
  monthlyResultCache.delete(key);
  monthlyResultCache.set(key,{data:data,at:Date.now()});
  while(monthlyResultCache.size>MONTHLY_CACHE_MAX)monthlyResultCache.delete(monthlyResultCache.keys().next().value);
}
function invalidateMonthlyResultCache(){
  monthlyResultGeneration++;
  monthlyResultCache.clear();
  const cancelled=[...monthlyPendingRequests.values()];
  monthlyPendingRequests.clear();
  // Release page-load tickets so a mutation can start a fresh request immediately.
  cancelled.forEach(request=>request.callbacks.forEach(fn=>fn(new Error('CACHE_INVALIDATED'),null,false)));
  state.monthly.data=null;
  state.monthly.loadedKey='';
  state.monthly.loading=false;
  if(state.attendancePreview){
    state.attendancePreview.at=0;
    state.attendancePreview.data=null;
    state.attendancePreview.key='';
  }
}
// Coalesce duplicate GAS requests from Attendance and Monthly for the SAME month/employee.
function requestMonthlyResult_(month,employeeId,callback,options={}){
  const key=monthlyResultKey_(month,employeeId),cached=monthlyResultCache.get(key);
  if(cached&&!options.force&&(Date.now()-cached.at)<MONTHLY_RESULT_TTL){
    callback(null,cached.data,true);
    return;
  }
  const pending=monthlyPendingRequests.get(key);
  if(pending){
    pending.callbacks.push(callback);
    return;
  }
  const request={callbacks:[callback],generation:monthlyResultGeneration,session:state.sessionToken};
  monthlyPendingRequests.set(key,request);
  const started=Date.now();
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(data=>{
    if(monthlyPendingRequests.get(key)!==request)return;
    monthlyPendingRequests.delete(key);
    if(request.generation!==monthlyResultGeneration||request.session!==state.sessionToken)return;
    monthlyRememberResult_(key,data);
    if(console&&console.debug)console.debug('[FM PERF] monthly API '+(Date.now()-started)+'ms');
    request.callbacks.forEach(fn=>fn(null,data,false));
  }).withFailureHandler(err=>{
    if(monthlyPendingRequests.get(key)!==request)return;
    monthlyPendingRequests.delete(key);
    if(request.generation!==monthlyResultGeneration||request.session!==state.sessionToken)return;
    request.callbacks.forEach(fn=>fn(err,null,false));
  }).getMonthlySummary(request.session,month,employeeId);
}
function loadMonthly(options={}){
  if(!state.data||!state.sessionToken)return;
  if(!state.monthly.yearMonth)state.monthly.yearMonth=state.data.today.slice(0,7);
  if(!state.monthly.employeeId)state.monthly.employeeId=state.data.user.employeeId;
  const month=state.monthly.yearMonth,employeeId=state.monthly.employeeId,key=monthlyResultKey_(month,employeeId);
  const cached=monthlyResultCache.get(key);
  const hasCurrent=state.monthly.loadedKey===key&&!!state.monthly.data;
  const isFresh=!!(cached&&(Date.now()-cached.at)<MONTHLY_RESULT_TTL);
  if(cached){
    state.monthly.data=cached.data;
    state.monthly.loadedKey=key;
    state.monthly.loading=false;
    state.monthly.error='';
    if(!hasCurrent&&state.page==='monthly')renderPageIfActive('monthly');
    if(isFresh&&!options.force)return;
  }else if(!hasCurrent){
    state.monthly.data=null;
    state.monthly.loadedKey='';
    state.monthly.loading=true;
    state.monthly.error='';
  }
  const ticket=beginPageLoad('monthly',key);
  if(!ticket){
    if(!options.silent&&!cached&&state.page==='monthly')renderPageIfActive('monthly');
    return;
  }
  state.monthly.loading=!cached&&!hasCurrent;
  if(!options.silent&&state.page==='monthly')renderPageIfActive('monthly');
  requestMonthlyResult_(month,employeeId,(err,data)=>{
    endPageLoad(ticket);
    if(monthlyResultKey_(state.monthly.yearMonth,state.monthly.employeeId)!==key)return;
    state.monthly.loading=false;
    if(err&&err.message==='CACHE_INVALIDATED')return;
    if(err){
      state.monthly.error='最新の月次データを取得できませんでした。';
      if(!handleApiError(err,'月次集計を読み込めませんでした'))renderPageIfActive('monthly');
      return;
    }
    state.monthly.data=data;
    state.monthly.loadedKey=key;
    state.monthly.error='';
    markPageCache('monthly',monthlyCacheKey());
    renderPageIfActive('monthly');
  },{force:!!options.force});
}
