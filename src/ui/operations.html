function laborRulePanel(d){
  const l=d&&d.labor||{},warnings=Array.isArray(l.warnings)?l.warnings:[];
  return `<div class='monthly-close-banner ${l.ruleStatus==='CONFIGURED'?'open':'closed'}'><div><span class='badge ${l.ruleStatus==='CONFIGURED'?'success':'danger'}'>${l.ruleStatus==='CONFIGURED'?'労務ルール設定済み':'労務ルール未確定'}</span><strong>法定時間外 ${formatMinutesClient(d.totals.statutoryOvertimeMinutes||0)} / 深夜 ${formatMinutesClient(d.totals.lateNightMinutes||0)} / 法定休日 ${formatMinutesClient(d.totals.statutoryHolidayMinutes||0)}</strong></div><small>${escapeHtml(warnings.join(' / ')||'法定区分を確認できます。')}</small></div>`;
}
function monthlySummaryStrip(d){
  return `<div class='monthly-summary-strip'>
    <div><span>実働</span><strong>${formatMinutesClient(d.totals.totalMinutes)}</strong></div>
    <div><span>残業</span><strong>${formatMinutesClient(d.totals.overtimeMinutes)}</strong></div>
    <div><span>有給</span><strong>${d.totals.paidLeaveDays}日</strong></div>
    <div><span>欠勤</span><strong>${d.totals.absenceDays}日</strong></div>
    <div class='${d.totals.missingPunchDays?'alert':''}'><span>要確認</span><strong>${d.totals.missingPunchDays}日</strong></div>
    <div class='${d.totals.worklogMismatchDays?'warn':''}'><span>工数差異</span><strong>${d.totals.worklogMismatchDays}日</strong></div>
  </div>`;
}
function monthlyPage(){
  const m=state.monthly,d=m.data,p=state.data.permissions||{},teamView=!!p.monthlyTeamView,admin=!!p.adminConsole,employees=state.data.employees||[];
  const visibleEmployees=admin?employees:teamView?employees.filter(e=>e.employeeId===state.data.user.employeeId||e.managerId===state.data.user.employeeId):employees.filter(e=>e.employeeId===state.data.user.employeeId);
  if(!visibleEmployees.some(e=>e.employeeId===state.monthly.employeeId))state.monthly.employeeId=state.data.user.employeeId;
  const selector=teamView?`<select class='filter-select' onchange="state.monthly.employeeId=this.value;loadMonthly()">${visibleEmployees.map(e=>`<option value='${e.employeeId}' ${state.monthly.employeeId===e.employeeId?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select>`:'';
  const closeStatus=d&&d.closeStatus?d.closeStatus:{closed:false,status:'OPEN'};
  const closeButton=admin&&d?(closeStatus.closed?`<button class='secondary-button compact' onclick='reopenMonthly()'>締め解除</button>`:`<button class='secondary-button compact' onclick='closeMonthly()'>月次締め</button>`):'';
  const actions=`<div class='button-row monthly-actions'>${selector}${closeButton}<button class='secondary-button compact' onclick='downloadMonthlyExport()'>Excel</button>${admin?`<button class='primary-button compact' onclick='downloadTeamMonthlyExport()'>給与対象を一括出力</button>`:''}</div>`;
  const toolbar=`<div class='monthly-toolbar'><div><button class='secondary-button compact' onclick='moveMonthly(-1)'>‹</button><button class='secondary-button compact' onclick="state.monthly.yearMonth=state.data.today.slice(0,7);loadMonthly()">今月</button><button class='secondary-button compact' onclick='moveMonthly(1)'>›</button><button class='secondary-button compact' onclick="loadMonthly({force:true})" aria-label="月次を再読込">更新</button><strong>${escapeHtml(state.monthly.yearMonth||state.data.today.slice(0,7))}</strong></div></div>`;
  const workspaceActive=m.view==='list'?'history':'monthly';
  const expectedKey=monthlyResultKey_(state.monthly.yearMonth,state.monthly.employeeId);
  if(!d||m.loadedKey!==expectedKey||d.yearMonth!==state.monthly.yearMonth||!d.employee||d.employee.employeeId!==state.monthly.employeeId){
    return pageHead('勤怠','月ごとの勤怠を確認します。',actions)+attendanceWorkspaceTabs(workspaceActive)+toolbar+
      (m.error?'<div class="card" role="alert">'+escapeHtml(m.error)+' <button type="button" class="secondary-button" onclick="loadMonthly({force:true})">再読込</button></div>':'<div class="loading-card" role="status" aria-label="月次データを読込中"></div>');
  }
  const closeBanner=`<div class='monthly-close-banner ${closeStatus.closed?'closed':'open'}'><div><span class='badge ${closeStatus.closed?'success':'warning'}'>${closeStatus.closed?'締め済み':'未締め'}</span><strong>${escapeHtml(d.yearMonth)} 月次</strong></div><small>${closeStatus.closed?escapeHtml((closeStatus.closedAt||'')+' / '+(closeStatus.closedBy||'')):'管理者が締めるまで編集可能です。'}</small></div>`;
  const body=m.view==='list'?monthlyListView(d):monthlyCalendarView(d);
  return `<div class='single-screen-layout monthly-screen'>${pageHead('勤怠',escapeHtml(d.employee.name)+' / '+escapeHtml(d.yearMonth)+' の勤怠確認',actions)}${attendanceWorkspaceTabs(workspaceActive)}${toolbar}${monthlyReviewPanel(d)}${monthlySummaryStrip(d)}${laborRulePanel(d)}${closeBanner}<div class='monthly-main'>${body}<div class='monthly-legend'><span><i class='ok'></i>正常</span><span><i class='leave'></i>休暇</span><span><i class='warn'></i>工数差異</span><span><i class='danger'></i>要確認</span></div></div></div>`;
}

function openMonthlyDay(date){
  const d=state.monthly.data,x=d&&d.daily.find(v=>v.date===date);if(!x)return;
  const r=ensureModal();
  const issue=x.issue||x.worklogIssue;
  r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card small monthly-day-modal' role='dialog' aria-modal='true'><div class='modal-head'><div><small>月次勤怠 / ${escapeHtml(d.yearMonth)}</small><h2>${escapeHtml(fmtDate(date))}</h2></div><button type='button' class='icon-button' onclick='closeModal()' aria-label='閉じる'>×</button></div>
  <div class='monthly-day-detail'>
    <div><span>区分</span><strong>${escapeHtml(x.leaveStatus||x.companyName||x.companyType||'—')}</strong></div>
    <div><span>出勤</span><strong>${escapeHtml(x.clockIn||'—')}</strong></div><div><span>退勤</span><strong>${escapeHtml(x.clockOut||'—')}</strong></div>
    <div><span>休憩</span><strong>${formatMinutesClient(x.breakMinutes||0)}</strong></div><div><span>実働</span><strong>${formatMinutesClient(x.workMinutes)}</strong></div>
    <div><span>所定外</span><strong>${formatMinutesClient(x.overtimeMinutes)}</strong></div><div><span>法定時間外</span><strong>${formatMinutesClient(Number(x.statutoryDailyOvertimeMinutes||0)+Number(x.statutoryWeeklyOvertimeMinutes||0))}</strong></div><div><span>深夜</span><strong>${formatMinutesClient(x.lateNightMinutes||0)}</strong></div><div><span>法定休日</span><strong>${formatMinutesClient(x.statutoryHolidayMinutes||0)}</strong></div><div><span>工数</span><strong>${formatMinutesClient(x.worklogMinutes||0)}</strong></div>
    <div><span>勤務場所</span><strong>${escapeHtml(x.workLocation||'—')}</strong></div>
  </div>
  ${issue?`<div class='monthly-day-warning'><strong>確認が必要です</strong><span>${escapeHtml([x.issueType,x.worklogIssue?(x.worklogDifferenceMinutes>0?'工数超過 ':'工数不足 ')+formatMinutesClient(Math.abs(x.worklogDifferenceMinutes)):''].filter(Boolean).join(' / '))}</span></div>`:''}
  <div class='modal-actions'><span></span><div>${x.issue?`<button class='secondary-button' onclick="closeModal();openRequestModal('打刻修正','${date}')">打刻修正を申請</button>`:''}${x.worklogIssue?`<button class='secondary-button' onclick="closeModal();state.worklog.date='${date}';navigate('worklog')">工数を確認</button>`:''}<button class='primary-button' onclick='closeModal()'>閉じる</button></div></div></section>`;
}
function confirmMonthlyReviewFromPage(){
  const d=state.monthly.data;if(!d)return;
  openConfirmDialog('勤怠確認を完了しますか？',d.yearMonth+' の出退勤・休暇・残業・工数を確認し、内容に誤りがないことを記録します。','確認完了',()=>{
    (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(status=>{
      d.reviewStatus=status;
      renderPageIfActive('monthly');
      showToast(d.yearMonth+'の勤怠確認を完了しました');
      loadHomeOverview({force:true,silent:true,onDone:()=>loadNotifications()});
    }).withFailureHandler(err=>handleApiError(err,'月次確認を完了できませんでした')).confirmMonthlyReview(state.sessionToken,d.yearMonth,'本人確認');
  },false);
}

function closeMonthly(){
  const ym=state.monthly.yearMonth;
  openConfirmDialog('月次を締めますか？',ym+' の給与対象者について、要確認勤怠・工数差異・承認待ち申請がないか確認して締めます。','月次締めを実行',()=>{
    (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(()=>{showToast(ym+'を締めました');invalidatePageCache('monthly');loadMonthly({force:true});}).withFailureHandler(err=>handleApiError(err,'月次締めできませんでした')).closeMonthlyPeriod(state.sessionToken,ym);
  },false);
}
function reopenMonthly(){
  const ym=state.monthly.yearMonth;
  openReasonDialog('月次締めを解除','解除理由を入力してください。','締め解除を実行',reason=>{
    (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(()=>{showToast(ym+'の締めを解除しました');invalidatePageCache('monthly');loadMonthly({force:true});}).withFailureHandler(err=>handleApiError(err,'締めを解除できませんでした')).reopenMonthlyPeriod(state.sessionToken,ym,reason);
  });
}

function downloadTeamMonthlyExport(){
  (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(result){
    var binary=atob(result.base64),bytes=new Uint8Array(binary.length);
    for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    var blob=new Blob([bytes],{type:result.mimeType||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=result.filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    openExportMessageModal(result.emailText);
    showToast('給与対象者の提出データを作成しました');
  }).withFailureHandler(function(err){handleApiError(err,'一括提出データを作成できませんでした');})
    .createTeamMonthlyExport(state.sessionToken,state.monthly.yearMonth);
}
function downloadMonthlyExport(){(typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(function(result){var binary=atob(result.base64),bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);var blob=new Blob([bytes],{type:result.mimeType||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=result.filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);openExportMessageModal(result.emailText);}).withFailureHandler(function(err){handleApiError(err,'提出データを作成できませんでした');}).createMonthlyExport(state.sessionToken,state.monthly.yearMonth,state.monthly.employeeId);}
function openExportMessageModal(text){var r=ensureModal();r.innerHTML='<div class="modal-backdrop" onclick="closeModal()"></div><section class="modal-card small" role="dialog" aria-modal="true"><div class="modal-head"><div><small>税理士提出用</small><h2>メール記載内容</h2></div><button type="button" class="icon-button" onclick="closeModal()" aria-label="閉じる">×</button></div><label class="field"><span>そのままコピーできます</span><textarea id="exportEmailText" rows="9">'+escapeHtml(text||'')+'</textarea></label><div class="modal-actions"><span></span><div><button class="secondary-button" onclick="navigator.clipboard.writeText(document.getElementById(\'exportEmailText\').value);showToast(\'コピーしました\')">コピー</button><button class="primary-button" onclick="closeModal()">閉じる</button></div></div></section>';}

</script>
