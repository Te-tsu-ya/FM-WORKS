<script>
/* v0.21 annual fiscal cashflow; amounts never use browser persistent storage. */
let cashFlowUi={open:false,year:0,seq:0,at:0,loading:false,busy:false,dirty:false,data:null,draft:null,error:'',notice:'',auditWarning:'',key:'',uncertain:false};
function resetCashFlowUi(){if(typeof cfbReset_==='function')cfbReset_();cashFlowUi={open:false,year:0,seq:cashFlowUi.seq+1,at:0,loading:false,busy:false,dirty:false,data:null,draft:null,error:'',notice:'',auditWarning:'',key:'',uncertain:false};}
function cashFlowAllowed_(){return !!(state.sessionToken&&state.data&&state.data.permissions&&state.data.permissions.cashFlowWorkspace&&state.data.permissions.adminConsole);}
function cashFlowAnalysisBusy_(){return typeof cfaUi!=='undefined'&&!!(cfaUi.busy||cfaUi.exporting);}
function cashFlowAuxDraft_(){return !!(
 (typeof cfaUi!=='undefined'&&(cfaUi.editor||cfaUi.ruleDraft||cfaUi.scenarioDraft))||
 (typeof cfbUi!=='undefined'&&(cfbUi.accountForm||cfbUi.planForm)));}
function cashFlowAuxDiscard_(next){
 if(!cashFlowAuxDraft_()){next();return;}
 openConfirmDialog('未保存の資金繰り入力','分類・条件・金融機関・入出金予定に保存前の入力があります。破棄して移動しますか？','入力を破棄して移動',()=>{
  if(typeof cfaUi!=='undefined'){cfaUi.editor=null;cfaUi.ruleDraft=null;cfaUi.scenarioDraft=null;}
  if(typeof cfbUi!=='undefined'){cfbUi.accountForm=null;cfbUi.planForm=null;}
  next();
 });
}
function cashFlowThisYear_(){
 const s=String(state.data&&state.data.today||new Date().toISOString().slice(0,10)),m=/^(\d{4})-(\d{2})/.exec(s);
 return m?Number(m[1])+(Number(m[2])===12?1:0):new Date().getFullYear();
}
function cashFlowDiscard_(next){
 if(typeof cflCanLeave_==='function'&&!cflCanLeave_())return;
 if(cashFlowAuxDraft_()){cashFlowAuxDiscard_(()=>cashFlowDiscard_(next));return;}
 if(typeof cflDirty_==='function'&&cflDirty_()){openConfirmDialog('台帳の未保存入力','保存していない台帳の入力を破棄して移動しますか？','入力を破棄して移動',()=>{cflUi.rows=[];cflUi.serial++;cflUi.data=null;cashFlowDiscard_(next);});return;}
 if(!cashFlowUi.dirty){next();return;}
 openConfirmDialog('未保存の変更',cashFlowUi.uncertain?'保存結果が未確認です。先に同じ内容と送信キーで再試行し、登録内容を照合してください。破棄すると再送の手掛かりがなくなります。破棄しますか？':'保存していない金額があります。破棄して移動しますか？','破棄して移動',next);
}
function cashFlowOpen_(){
 if(!cashFlowAllowed_())return;
 if(financeUi.demo){showToast('資金繰り表は実データです。サンプル表示を解除してから開いてください。');return;}
 financeUi.insightMode=false;cashFlowUi.open=true;cashFlowUi.year=cashFlowUi.year||cashFlowThisYear_();
 renderPageIfActive('finance');cashFlowLoad_();if(typeof cfbLoad_==='function')cfbLoad_(false);
}
function cashFlowClose_(){
 if(typeof cfbUi!=='undefined'&&cfbUi.importPending){
  showToast('銀行明細の取込結果が未確認です。同じ送信情報で再開してから画面を閉じてください。');return;
 }
 if(typeof cfbUi!=='undefined'&&cfbUi.preview&&cfbUi.preview.length&&!cfbUi.demo){
  openConfirmDialog('取込前の銀行明細を破棄','取込前の表に銀行明細が残っています。閉じると内容が失われます。続行しますか？',
   '保存せず閉じる',()=>{cfbUi.preview=null;cfbUi.bankGridEdited=false;cashFlowClose_();});return;
 }

 if(cashFlowAnalysisBusy_()||cashFlowUi.busy||typeof cfbUi!=='undefined'&&(cfbUi.busy||cfbUi.importing)){showToast('保存・取り込みが終わるまでお待ちください。');return;}
 cashFlowDiscard_(()=>{
  const bank=typeof cfbUi!=='undefined'?cfbUi:null,demo=!!(bank&&bank.demo);
  if(typeof cfbReset_==='function'){
   cfbReset_();if(bank&&!demo){cfbUi.loaded=bank.loaded;cfbUi.year=bank.year;cfbUi.at=bank.at;cfbUi.tab=bank.tab;cfbUi.active=bank.active;}
  }
  if(demo){cashFlowUi.data=null;cashFlowUi.at=0;}
  const record=cashFlowUi.data&&cashFlowUi.data.record;
  cashFlowUi.open=false;cashFlowUi.loading=false;cashFlowUi.refreshNeeded=false;cashFlowUi.draft=record?{openingBalance:record.openingBalance,revision:record.revision,months:record.months.map(x=>({...x}))}:null;
  cashFlowUi.dirty=false;cashFlowUi.key='';cashFlowUi.seq++;
  renderPageIfActive('finance');
  if(typeof loadFinanceOverview==='function')loadFinanceOverview({silent:true});
 });
}
function cashFlowChangeYear_(value){
 if(typeof cfbUi!=='undefined'&&cfbUi.importPending){showToast('銀行明細の取込を再開・完了してから年度を切り替えてください。');return;}

 if(cashFlowAnalysisBusy_()||cashFlowUi.busy||typeof cfbUi!=='undefined'&&(cfbUi.busy||cfbUi.importing)){showToast('保存・取り込み中は年度を切替できません。');return;}
 const y=Number(value),input=document.getElementById('cfYear');
 if(!Number.isInteger(y)||y<2000||y>2100){if(input)input.value=String(cashFlowUi.year);return;}
 if(y===cashFlowUi.year)return;
 if(typeof cfbUi!=='undefined'&&cfbUi.demo){cashFlowDiscard_(()=>cfbDemoActivate_(y));return;}
 cashFlowDiscard_(()=>{
  cashFlowUi.seq++;cashFlowUi.year=y;cashFlowUi.data=null;cashFlowUi.draft=null;cashFlowUi.loading=false;cashFlowUi.refreshNeeded=false;
  cashFlowUi.dirty=false;cashFlowUi.key='';cashFlowUi.error='';cashFlowUi.notice='';cashFlowUi.auditWarning='';
  if(typeof cfbReset_==='function')cfbReset_();
  renderPageIfActive('finance');cashFlowLoad_();if(typeof cfbLoad_==='function')cfbLoad_(true);
 });
 if(input)input.value=String(cashFlowUi.year);
}
function cashFlowLoad_(force=false){
 const ui=cashFlowUi;if(typeof cfbUi!=='undefined'&&cfbUi.demo)return;
 if(!ui.open||!cashFlowAllowed_()||ui.busy)return;
 if(ui.loading){if(force)ui.refreshNeeded=true;return;}
 if(!force&&ui.data&&ui.data.fiscalYear===ui.year&&(ui.dirty||Date.now()-(ui.at||0)<300000))return;
 const token=state.sessionToken,year=ui.year,seq=++ui.seq;
 ui.loading=true;ui.error='';renderPageIfActive('finance');
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(result=>{
  if(seq!==cashFlowUi.seq||token!==state.sessionToken||year!==cashFlowUi.year||!cashFlowUi.open)return;
  ui.loading=false;
  if(ui.refreshNeeded){ui.refreshNeeded=false;cashFlowLoad_(true);return;}
  if(!result||result.ok!==true){ui.error='取得したデータが正しくありません。';renderPageIfActive('finance');return;}
  ui.data=result;ui.at=Date.now();ui.draft={openingBalance:result.record.openingBalance,revision:result.record.revision,months:result.record.months.map(x=>({...x}))};
  ui.dirty=false;ui.key='';ui.uncertain=false;renderPageIfActive('finance');
 }).withFailureHandler(err=>{
  if(seq!==cashFlowUi.seq||token!==state.sessionToken||year!==cashFlowUi.year||!cashFlowUi.open)return;
  ui.loading=false;if(ui.refreshNeeded){ui.refreshNeeded=false;cashFlowLoad_(true);return;}ui.error=cleanApiErrorMessage(err,'資金繰り表を読み込めませんでした。');renderPageIfActive('finance');
 }).getCashFlowYear(token,year);
}
function cashFlowReload_(){
 if(typeof cfbUi!=='undefined'&&cfbUi.demo){cashFlowDiscard_(()=>cfbDemoActivate_(cashFlowUi.year));return;}
 if(typeof cfbReload_==='function'){cfbReload_();return;}
 cashFlowDiscard_(()=>{
  cashFlowUi.data=null;cashFlowUi.draft=null;cashFlowUi.dirty=false;cashFlowUi.key='';cashFlowLoad_(true);
 });
}
function cashFlowInt_(value,negative=false){
 if(value==null||String(value).trim()==='')return null;
 const t=String(value).trim(),re=negative?/^-?(0|[1-9]\d{0,11})$/:/^(0|[1-9]\d{0,11})$/;
 return re.test(t)?Number(t):null;
}
function cashFlowCalc_(){
 const d=cashFlowUi.draft;if(!d)return null;
 const start=cashFlowInt_(d.openingBalance,true);let plan=start,actual=start,forecast=start,low=start,first='';
 const totals={planIn:0,planOut:0,actualIn:0,actualOut:0},counts={plan:0,actual:0};
 const months=d.months.map(row=>{
  const v={};for(const key of ['planIn','planOut','actualIn','actualOut']){v[key]=cashFlowInt_(row[key]);if(v[key]!==null)totals[key]+=v[key];}
  const hp=v.planIn!==null&&v.planOut!==null,ha=v.actualIn!==null&&v.actualOut!==null;
  if(hp)counts.plan++;if(ha)counts.actual++;
  plan=plan!==null&&hp?plan+(v.planIn||0)-(v.planOut||0):null;
  actual=actual!==null&&ha?actual+(v.actualIn||0)-(v.actualOut||0):null;
  forecast=forecast!==null&&(ha||hp)?forecast+(ha?v.actualIn||0:v.planIn||0)-(ha?v.actualOut||0:v.planOut||0):null;
  if(forecast!==null){if(low===null||forecast<low)low=forecast;if(!first&&forecast<0)first=row.month;}
  return {month:row.month,planEnd:plan,actualEnd:actual,forecastEnd:forecast};
 });
 return {months,counts,totals,yearEnd:forecast,minimum:low,first};
}
function cashFlowYen_(v){return v===null||v===undefined?'—':Number(v).toLocaleString('ja-JP')+'円';}
function cashFlowMetricHtml_(s){
 const item=(label,value,help)=>'<div class="cf-metric"><small>'+label+'</small><strong>'+value+'</strong><span>'+help+'</span></div>';
 return item('年間の計画入金',s.counts.plan?cashFlowYen_(s.totals.planIn):'未入力',s.counts.plan+'/12か月 入力済')+
        item('年間の計画出金',s.counts.plan?cashFlowYen_(s.totals.planOut):'未入力',s.counts.plan+'/12か月 入力済')+
        item('11月末の見込み残高',cashFlowYen_(s.yearEnd),'実績がある月は実績を優先')+
        item('最初の資金不足予測',s.first?escapeHtml(s.first):'—','見込み残高が0円を下回る月');
}
function cashFlowChartHtml_(s){
 const values=s.months.flatMap(r=>[r.planEnd,r.actualEnd,r.forecastEnd]).filter(v=>v!==null);
 if(!values.length)return '<p class="cf-note">期首残高と入出金を入力するとグラフを表示します。</p>';
 const max=Math.max(0,...values),min=Math.min(0,...values),span=Math.max(1,max-min);
 const xy=(i,v)=>(35+i*54)+','+(157-(v-min)/span*130).toFixed(1);
 const series=[['planEnd','#2563eb','計画'],['actualEnd','#0d9488','実績'],['forecastEnd','#d97706','見込み']];
 let lines='';
 for(const [key,color] of series){
  let points=[];const flush=()=>{if(points.length)lines+='<polyline fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+points.join(' ')+'"/>';points=[];};
  s.months.forEach((m,i)=>{if(m[key]===null)flush();else points.push(xy(i,m[key]));});flush();
 }
 const labels=s.months.map((m,i)=>'<text x="'+(35+i*54)+'" y="187" text-anchor="middle">'+Number(m.month.slice(-2))+'月</text>').join('');
 return '<svg viewBox="0 0 660 205" role="img" aria-label="12か月の計画・実績・見込み月末残高"><line x1="35" x2="633" y1="'+(157-(0-min)/span*130).toFixed(1)+'" y2="'+(157-(0-min)/span*130).toFixed(1)+'" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="5 4"/>'+lines+'<g class="cf-chart-labels">'+labels+'</g></svg>'+
  '<div class="cf-legend"><span>● 計画（青）</span><span>● 実績（緑）</span><span>● 見込み（橙）</span></div>';
}
function cashFlowRefresh_(){
 const ui=cashFlowUi,s=cashFlowCalc_();if(!s)return;
 const sum=document.getElementById('cfMetrics'),chart=document.getElementById('cfChart'),status=document.getElementById('cfStatus'),save=document.getElementById('cfSave');
 if(sum)sum.innerHTML=cashFlowMetricHtml_(s);
 if(chart)chart.innerHTML=cashFlowChartHtml_(s);
 if(status)status.textContent='未保存の変更あり';
 if(save)save.disabled=false;
 s.months.forEach((m,i)=>[['planEnd','plan'],['actualEnd','actual'],['forecastEnd','forecast']].forEach(pair=>{
  const cell=document.getElementById('cf-'+pair[1]+'-'+i);if(cell)cell.textContent=cashFlowYen_(m[pair[0]]);
 }));
 if(typeof cashFlowGridSync_==='function')cashFlowGridSync_();
}
function cashFlowEdit_(node){
 const ui=cashFlowUi;if(!ui.draft||ui.busy||ui.uncertain||!cashFlowAllowed_())return;
 const key=node.dataset.key;
 if(key==='openingBalance')ui.draft.openingBalance=node.value;
 else{
  const i=Number(node.dataset.index);
  if(!Number.isInteger(i)||i<0||i>=12||!['planIn','planOut','actualIn','actualOut','note'].includes(key))return;
  ui.draft.months[i][key]=node.value;
 }
 ui.dirty=true;ui.key='';ui.error='';cashFlowRefresh_();
}
function cashFlowSave_(){
 if(typeof cfbUi!=='undefined'&&cfbUi.demo){cfbDemoSaveYear_();return;}
 const ui=cashFlowUi;
 if(!cashFlowAllowed_()||!ui.draft||!ui.data||ui.data.setupRequired||!ui.dirty||ui.busy)return;
 if(cashFlowInt_(ui.draft.openingBalance,true)===null){ui.error='期首残高を入力してください。';renderPageIfActive('finance');return;}
 for(const m of ui.draft.months){
  for(const k of ['planIn','planOut','actualIn','actualOut'])if(m[k]!=null&&String(m[k])!==''&&cashFlowInt_(m[k])===null){ui.error=m.month+'の金額を確認してください。';renderPageIfActive('finance');return;}
  if(String(m.note||'').length>300){ui.error='備考は300文字以内にしてください。';renderPageIfActive('finance');return;}
 }
 if(!ui.key)ui.key='CF'+Date.now().toString(36)+Math.random().toString(36).slice(2,15);
 const token=state.sessionToken,year=ui.year,seq=ui.seq,payload={fiscalYear:year,openingBalance:ui.draft.openingBalance,revision:ui.draft.revision,months:ui.draft.months.map(x=>({...x})),requestKey:ui.key};
 ui.busy=true;ui.error='';renderPageIfActive('finance');
 (typeof FMRotaryRPC==='function'?FMRotaryRPC():FMApi.run).withSuccessHandler(res=>{
  if(token!==state.sessionToken||!cashFlowUi.open||year!==cashFlowUi.year||seq!==cashFlowUi.seq)return;
  ui.busy=false;
  if(!res||res.ok!==true){ui.uncertain=true;ui.error='保存結果を確認できません。同じ内容と送信キーで再試行してください。';renderPageIfActive('finance');return;}
  ui.auditWarning=res.auditRecorded===false?'金額は保存されましたが監査ログの記録に失敗しました。管理者が確認してください。':res.auditRecorded===null?'保存済みデータを確認しました。監査ログの状態は未確認です。':'';
  ui.notice='保存済みです。';ui.dirty=false;ui.uncertain=false;ui.key='';ui.data=null;ui.draft=null;cashFlowLoad_(true);
 }).withFailureHandler(err=>{
  if(token!==state.sessionToken||!cashFlowUi.open||year!==cashFlowUi.year||seq!==cashFlowUi.seq)return;
  ui.busy=false;ui.uncertain=true;ui.error=cleanApiErrorMessage(err,'保存結果が不明です。入力と送信キーを保持しています。')+'　すでに保存された可能性があるため、内容を変えずに再試行してください。';renderPageIfActive('finance');
 }).saveCashFlowYear(token,payload);
}
function cashFlowPage_(){
 if(!cashFlowAllowed_())return pageHead('年間資金繰り表','管理者専用です。');
 if(typeof cfbUi!=='undefined'&&cfbUi.active)return cfbPage_();
 const u=cashFlowUi,year=u.year,title=year+'年11月期（'+(year-1)+'年12月～'+year+'年11月）';
 const buttons='<button class="secondary-button" type="button" onclick="cashFlowClose_()">← 経理に戻る</button><button class="secondary-button" type="button" onclick="cashFlowReload_()">更新</button><button class="secondary-button" type="button" onclick="cfbShowNew_()">金融機関・年間の見込みへ</button>';
 const picker='<div class="cf-period"><button type="button" class="secondary-button" onclick="cashFlowChangeYear_('+(year-1)+')">‹ 前期</button>'+
  '<label>決算年度 <input id="cfYear" type="number" min="2000" max="2100" step="1" value="'+year+'" onchange="cashFlowChangeYear_(this.value)"></label>'+
  '<button type="button" class="secondary-button" onclick="cashFlowChangeYear_('+(year+1)+')">翌期 ›</button></div>';
 const header='<header class="cf-head"><div><span class="eyebrow">FINANCE / CASH FLOW</span><h1>年間資金繰り表</h1><p>'+title+'</p></div><div class="cf-actions">'+buttons+'</div></header>'+picker;
 if(u.loading&&!u.data)return '<div class="cf-workspace">'+header+'<section class="card cf-empty" role="status">資金繰り表を読み込み中です。</section></div>';
 if(!u.data)return '<div class="cf-workspace">'+header+'<section class="card cf-empty" role="alert">'+escapeHtml(u.error||'読み込み待ちです。')+'</section></div>';
 if(u.data.setupRequired)return '<div class="cf-workspace">'+header+'<section class="card cf-empty"><h2>初回設定が必要です</h2><p>管理・設定 → 運用・労務 からバックアップ付きDB更新を実行してください。既存Excelは変更しません。</p><button class="secondary-button" onclick="setAdminTab('+"'operation'"+')">DB更新画面を開く</button></section></div>';
 const d=u.draft,s=cashFlowCalc_();if(!d||!s)return '<div class="cf-workspace">'+header+'</div>';
 const input=(i,key,row)=>'<input data-index="'+i+'" data-key="'+key+'" type="number" inputmode="numeric" min="0" max="999999999999" step="1" value="'+escapeHtml(row[key]==null?'':row[key])+'" oninput="cashFlowEdit_(this)" aria-label="'+escapeHtml(row.month)+' '+key+'"'+(u.busy||u.uncertain?' disabled':'')+'>';
 const rows=d.months.map((r,i)=>{
  const t=s.months[i];
  return '<tr><th scope="row">'+escapeHtml(r.month.replace('-','年')+'月')+'</th>'+
   ['planIn','planOut','actualIn','actualOut'].map(k=>'<td>'+input(i,k,r)+'</td>').join('')+
   '<td class="cf-num" id="cf-plan-'+i+'">'+cashFlowYen_(t.planEnd)+'</td>'+
   '<td class="cf-num" id="cf-actual-'+i+'">'+cashFlowYen_(t.actualEnd)+'</td>'+
   '<td class="cf-num" id="cf-forecast-'+i+'">'+cashFlowYen_(t.forecastEnd)+'</td>'+
   '<td><input class="cf-note-input" type="text" maxlength="300" data-index="'+i+'" data-key="note" value="'+escapeHtml(r.note||'')+'" oninput="cashFlowEdit_(this)" aria-label="'+escapeHtml(r.month)+' 備考"'+(u.busy||u.uncertain?' disabled':'')+'></td></tr>';
 }).join('');
 const feedback=(u.error?'<p class="finance-error" role="alert">'+escapeHtml(u.error)+'</p>':'')+
  (u.auditWarning?'<p class="finance-error" role="alert">'+escapeHtml(u.auditWarning)+'</p>':'')+
  (u.notice?'<p class="cf-success" role="status">'+escapeHtml(u.notice)+'</p>':'');
 return '<div class="cf-workspace">'+header+(typeof cfbUi!=='undefined'&&cfbUi.demo?cfbDemoBanner_():'')+'<section class="card cf-toolbar"><label>期首現預金残高（12月1日／円）<input type="number" step="1" min="-999999999999" max="999999999999" data-key="openingBalance" value="'+escapeHtml(d.openingBalance==null?'':d.openingBalance)+'" placeholder="例：1000000" oninput="cashFlowEdit_(this)"'+(u.busy||u.uncertain?' disabled':'')+'></label>'+
  '<div class="cf-save"><span id="cfStatus" role="status">'+(u.uncertain?'保存結果を確認中':u.dirty?'未保存の変更あり':u.data.record.exists?'保存済み':'未作成')+'</span><button type="button" id="cfSave" class="primary-button" onclick="cashFlowSave_()"'+(!u.dirty||u.busy?' disabled':'')+'>'+(u.busy?'保存中…':u.uncertain?'同じ内容で再試行':'年度を保存')+'</button></div></section>'+feedback+cashFlowGridHtml_()+
  '<div class="cf-metrics" id="cfMetrics">'+cashFlowMetricHtml_(s)+'</div>'+
  '<section class="card cf-chart"><h2>月末残高の推移</h2><div id="cfChart">'+cashFlowChartHtml_(s)+'</div></section>'+
  '<details class="cfg-legacy"><summary>従来の縦型入力表を開く（必要な場合のみ）</summary><section class="card cf-table-card"><h2>月別入出金</h2><p>計画・実績は現金ベースです。空欄＝未入力、0＝入力済み0円。入金・出金の両方が入力済みの月だけ残高を計算します（片方がない場合は0を入力）。</p>'+
  '<div class="cf-scroll" role="region" aria-label="12か月の入出金" tabindex="0"><table class="cf-table"><thead><tr><th>対象月</th><th>計画入金</th><th>計画出金</th><th>実績入金</th><th>実績出金</th><th>計画末</th><th>実績末</th><th>見込み末</th><th>備考</th></tr></thead><tbody>'+rows+'</tbody></table></div></section></details>'+
  '<p class="cf-note">手入力の資金繰り表です。銀行口座、既存経費、試算表とは自動同期していません。年間残高は他年度へ自動引き継ぎしません。</p></div>';
}
</script>
<script>
/* November-close fiscal cashflow: Excel-style 12-month horizontal input.
 * Pure browser-memory editing; existing admin-only saveCashFlowYear is unchanged. */
const CF_GRID_FIELDS=[
 ['planIn','計画入金'],['planOut','計画出金'],
 ['actualIn','実績入金'],['actualOut','実績出金'],['note','備考']
];
function cashFlowGridCanEdit_(){
 return cashFlowAllowed_()&&!!cashFlowUi.draft&&!cashFlowUi.busy&&!cashFlowUi.uncertain;
}
function cashFlowGridNormalize_(key,text){
 const value=String(text==null?'':text).trim();
 if(key==='note'){
  if(value.length>300||/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/.test(value))
   throw Error('備考は300文字以内で入力してください。');
  return value;
 }
 if(!['planIn','planOut','actualIn','actualOut'].includes(key))throw Error('入力列が不正です。');
 if(value==='')return null;
 const s=value.replace(/[,，\s¥￥円]/g,'');
 if(!/^(0|[1-9]\d{0,11})$/.test(s)||Number(s)>999999999999)
  throw Error('金額は0～9999億9999万9999円の整数で入力してください。');
 return Number(s);
}
function cashFlowGridApplyMatrix_(text,fieldIndex,monthIndex){
 if(!cashFlowGridCanEdit_())throw Error('保存中・結果未確認の資金繰り表は編集できません。');
 const ui=cashFlowUi,src=String(text||'').replace(/\r\n?/g,'\n');
 if(!src||src.length>30000)throw Error('1回の貼付は3万文字以内にしてください。');
 const lines=src.split('\n');if(lines[lines.length-1]==='')lines.pop();
 const matrix=lines.map(row=>row.split('\t'));
 const height=matrix.length,width=Math.max(...matrix.map(row=>row.length));
 if(!height||height>5||width>12||fieldIndex+height>CF_GRID_FIELDS.length||
    monthIndex+width>12||fieldIndex<0||monthIndex<0)
  throw Error('貼付範囲が5項目×12か月の入力表を超えています。');
 // Validate the entire pasted rectangle before changing any month.
 const pending=matrix.map((row,r)=>row.map(v=>cashFlowGridNormalize_(CF_GRID_FIELDS[fieldIndex+r][0],v)));
 for(let r=0;r<pending.length;r++)for(let m=0;m<pending[r].length;m++){
  ui.draft.months[monthIndex+m][CF_GRID_FIELDS[fieldIndex+r][0]]=pending[r][m];
 }
 ui.dirty=true;ui.key='';ui.error='';ui.notice='入力表へ '+height+'行×'+width+'列を貼り付けました。まだ保存していません。';
 return {rows:height,months:width};
}
function cashFlowGridPasteEvent_(event,fieldIndex,monthIndex){
 if(!cashFlowGridCanEdit_())return;
 const value=event.clipboardData?.getData('text/plain');
 if(!value||!(/[\t\r\n]/.test(value)))return;
 event.preventDefault();
 try{cashFlowGridApplyMatrix_(value,fieldIndex,monthIndex);}
 catch(e){cashFlowUi.error=String(e.message||e);}
 renderPageIfActive('finance');
 const node=document.querySelector('[data-cfg-cell="'+fieldIndex+'-'+monthIndex+'"]');
 if(node)node.focus();
}
function cashFlowGridInput_(node){
 if(!cashFlowGridCanEdit_())return;
 const key=node.dataset.cfgKey,i=Number(node.dataset.cfgMonth);
 if(!CF_GRID_FIELDS.some(x=>x[0]===key)||!Number.isInteger(i)||i<0||i>=12)return;
 cashFlowUi.draft.months[i][key]=node.value;
 cashFlowUi.dirty=true;cashFlowUi.key='';cashFlowUi.error='';
 cashFlowRefresh_();
}
function cashFlowGridBlur_(node){
 if(!cashFlowGridCanEdit_())return;
 const key=node.dataset.cfgKey,i=Number(node.dataset.cfgMonth);
 if(!Number.isInteger(i)||i<0||i>=12)return;
 try{
  const next=cashFlowGridNormalize_(key,node.value);
  cashFlowUi.draft.months[i][key]=next;
  node.value=next==null?'':String(next);
  node.removeAttribute('aria-invalid');
  cashFlowRefresh_();
 }catch(e){node.setAttribute('aria-invalid','true');cashFlowUi.error=String(e.message||e);}
 if(typeof cashFlowGridSync_==='function')cashFlowGridSync_();
}
function cashFlowGridNavigate_(event,fieldIndex,monthIndex){
 if(event.isComposing||!cashFlowGridCanEdit_())return;
 let r=fieldIndex,c=monthIndex;
 if(event.key==='Enter')r+=event.shiftKey?-1:1;
 else if(event.key==='ArrowRight'&&event.altKey)c++;
 else if(event.key==='ArrowLeft'&&event.altKey)c--;
 else return;
 if(r<0||r>=CF_GRID_FIELDS.length||c<0||c>=12)return;
 event.preventDefault();
 const next=document.querySelector('[data-cfg-cell="'+r+'-'+c+'"]');
 if(next){next.focus();next.select();}
}
function cashFlowGridSync_(){
 const u=cashFlowUi;if(!u.draft)return;
 const data=cashFlowCalc_();if(!data)return;
 for(const [kind,key] of [['plan','planEnd'],['actual','actualEnd'],['forecast','forecastEnd']]){
  data.months.forEach((row,i)=>{
   const el=document.getElementById('cfg-'+kind+'-'+i);
   if(el)el.textContent=cashFlowYen_(row[key]);
  });
 }
 if(typeof document.querySelectorAll!=='function')return;
 for(const input of document.querySelectorAll('[data-cfg-key][data-cfg-month]')){
  if(input===document.activeElement)continue;
  const key=input.dataset.cfgKey,index=Number(input.dataset.cfgMonth);
  if(!Number.isInteger(index)||index<0||index>=12)continue;
  const current=u.draft.months[index][key];
  input.value=current==null?'':String(current);
 }
}
function cashFlowGridCopy_(){
 if(!cashFlowUi.draft)return;
 const safe=v=>String(v==null?'':v).replace(/[\t\r\n]/g,' ').replace(/^[=+\-@]/,"'$&");
 const tsv=CF_GRID_FIELDS.map(([key])=>
  cashFlowUi.draft.months.map(row=>safe(row[key])).join('\t')).join('\n');
 const fallback=()=>{
  const area=document.getElementById('cfg-copy');if(!area)return;
  area.hidden=false;area.value=tsv;area.focus();area.select();
  showToast('入力データを選択しました。Ctrl+Cでコピーしてください。');
 };
 if(typeof navigator!=='undefined'&&navigator.clipboard?.writeText)
  navigator.clipboard.writeText(tsv).then(()=>showToast('12か月の入力値をコピーしました。')).catch(fallback);
 else fallback();
}

 const editable=CF_GRID_FIELDS.map(([key,label],r)=>{

  return '<tr><th scope="row">'+escapeHtml(label)+'</th>'+cols+'</tr>';
 }).join('');
 const computed=[['計画末残高','planEnd','plan'],['実績末残高','actualEnd','actual'],
  ['見込み末残高','forecastEnd','forecast']].map(([label,key,id])=>
  '<tr class="cfg-total"><th scope="row">'+label+'</th>'+
   data.months.map((m,i)=>'<td id="cfg-'+id+'-'+i+'">'+cashFlowYen_(m[key])+'</td>').join('')+'</tr>').join('');
 return '<section class="card cfg-panel"><div class="cfg-head"><div><h2>12か月を横に並べて入力</h2>'+
  '<p>左から12月～翌11月。Excelから1行×12か月や4行×12か月をコピーして貼り付けできます。</p></div>'+
  '<button type="button" class="secondary-button" onclick="cashFlowGridCopy_()">入力値（5行×12か月）をコピー</button></div>'+
  '<div class="cf-scroll cfg-scroll" role="region" aria-label="年間資金繰り・Excel型12か月入力表" tabindex="0">'+
  '<table class="cfg-table"><thead><tr><th scope="col">入出金項目</th>'+heads+'</tr></thead>'+
  '<tbody>'+editable+computed+'</tbody></table></div>'+
  '<p class="cf-note">空欄は未入力、0は確認した0円です。月末残高は計画・実績の入出金が両方そろった月だけ表示します。'+
  '貼り付けだけでは保存されず、上部の「年度を保存」を押して確定します。</p>'+
  (ui.uncertain?'<p role="alert" class="finance-error">保存結果が不明です。金額を変更せず「同じ内容で再試行」で確認してください。</p>':'')+
  '<textarea id="cfg-copy" hidden aria-label="コピー用の資金繰りデータ"></textarea></section>';
}

 },error=>{

 }
 if(cfbUi.demo){openConfirmDialog('架空データの初期化','操作中の架空データを最初の状態に戻します。','最初から試す',()=>cfbDemoActivate_(cashFlowUi.year));return;}
 if(cfbUi.busy||cfbUi.importing||cashFlowUi.busy){showToast('保存・取り込みが終わるまでお待ちください。');return;}
 cashFlowDiscard_(()=>{

 });

function cfbForecast_(){
 const data=cfbUi.loaded,year=cashFlowUi.data;
 if(!data||data.setupRequired)return null;
 const saved=year&&year.record||{},opening=saved.openingBalance==null?null:Number(saved.openingBalance),
  old=new Map((saved.months||[]).map(x=>[x.month,x])),confirm=data.closing&&data.closing.through||'';
 
  // The existence of any schedule does not certify all 12 months as explicitly planned.
 let plannedBalance=opening,actualBalance=opening,forecastBalance=opening,firstShort='',lowest=opening;
 let totalPlannedIn=0,totalPlannedOut=0,confirmedCount=0,bankMonths=0;
 const rows=data.monthly.map(row=>{
  const adjustment=old.get(row.month)||{},manualPlan=adjustment.planIn!=null&&adjustment.planOut!=null,
    manualActual=adjustment.actualIn!=null&&adjustment.actualOut!=null,hasBank=row.importedCount>0;
  const hasPlan=Number(row.scheduledCount||0)>0||manualPlan,planIn=hasPlan?row.scheduledIn+(manualPlan?Number(adjustment.planIn):0):null,
   planOut=hasPlan?row.scheduledOut+(manualPlan?Number(adjustment.planOut):0):null;
  const confirmed=!!confirm&&row.month<=confirm,verified=row.reconciled!==false,
   authoritative=confirmed&&row.reconciled===true;
  const actualReady=authoritative||hasBank||manualActual,
   actualIn=authoritative?Number(row.actualIn||0):hasBank?row.actualIn:manualActual?Number(adjustment.actualIn):null,
   actualOut=authoritative?Number(row.actualOut||0):hasBank?row.actualOut:manualActual?Number(adjustment.actualOut):null;
  if(hasPlan){totalPlannedIn+=planIn;totalPlannedOut+=planOut;}
  if(hasBank)bankMonths++;
  if(confirmed)confirmedCount++;
  plannedBalance=plannedBalance!=null&&hasPlan?plannedBalance+planIn-planOut:null;
  actualBalance=actualBalance!=null&&confirmed&&actualReady&&verified?actualBalance+actualIn-actualOut:null;
  const useActual=confirmed&&actualReady&&verified;
  const estimateKnown=confirmed&&!verified?false:useActual||hasPlan;
  forecastBalance=forecastBalance!=null&&estimateKnown?forecastBalance+(useActual?actualIn:planIn)-(useActual?actualOut:planOut):null;
  if(forecastBalance!=null){lowest=lowest===null?forecastBalance:Math.min(lowest,forecastBalance);if(forecastBalance<0&&!firstShort)firstShort=row.month;}
  return {...row,planIn,planOut,actualIn,actualOut,confirmed,

 });

function cfbParseCSV_(text){
 const src=String(text||'').replace(/^\ufeff/,'');
 const result=[],record=[];let cell='',quoted=false;
 for(let i=0;i<src.length;i++){
  const c=src[i];
  if(c==='"'){
   if(quoted&&src[i+1]==='"'){cell+='"';i++;}
   else if(!quoted&&cell.trim()==='')quoted=true;
   else if(quoted)quoted=false;
   else throw Error('CSVの引用符が不正です。');
  }else if(c===','&&!quoted){record.push(cell);cell='';}
  else if((c==='\n'||c==='\r')&&!quoted){
   if(c==='\r'&&src[i+1]==='\n')i++;
   record.push(cell);if(record.some(x=>x!==''))result.push(record.slice());
   record.length=0;cell='';
   if(result.length>3001)throw Error('CSVの行数が多すぎます。3000行以内の明細を選んでください。');
  }else{cell+=c;}
 }
 if(quoted)throw Error('CSVの引用符が閉じられていません。');
 record.push(cell);if(record.some(x=>x!==''))result.push(record);
 if(result.length<2)throw Error('日付や金額が含まれるCSVを選んでください。');
 const width=Math.max(...result.map(row=>row.length));
 if(width>80)throw Error('CSVの列数が多すぎます。');
 return result;
}
function cfbGuessCSV_(header){
 const compact=s=>String(s||'').replace(/[\s\u3000・（）()\[\]]/g,'').toLowerCase();
 const heads=header.map(compact);
 const find=(aliases,avoid=[])=>heads.findIndex(v=>aliases.some(t=>v===t||v.includes(t))&&!avoid.some(t=>v.includes(t)));
 return {date:find(['取引日','お取引日','お取扱日','取扱日','日付','年月日','日']),
  incoming:find(['入金額','預入金額','お預り金額','お預入','入金','預り'],['区分']),
  outgoing:find(['出金額','支払金額','お引出','出金','引出','払戻'],['区分']),
  amount:find(['取引金額','金額','amount'],['入金','出金','残高']),
  direction:find(['入払区分','入出金区分','入出区分']),
  description:find(['摘要','取引内容','お取引内容','内容','取引先','明細','備考']),
  balance:find(['残高','balance']),
  externalId:find(['取引番号','明細番号','取引id','reference','伝票番号'])
 };
}

function cfbPreviewCSV_(){

 }
 cfbUi.importChunkKey='';cfbUi.importIndex=0;
 cfbUi.importAdded=0;cfbUi.importSkipped=0;

   let incoming=0,outgoing=0;
   if(map.incoming>=0&&map.outgoing>=0){incoming=cfbCSVNumber_(cell('incoming'),'入金');outgoing=cfbCSVNumber_(cell('outgoing'),'出金');}
   else{
    let amount=cfbCSVNumber_(cell('amount'),'取引');
    const direction=cell('direction').trim();

     if(/^(2|出|支払|引)/.test(direction))amount=-Math.abs(amount);

     else throw Error((index+2)+'行目の入出金区分が不明です。');
    }
    incoming=amount>0?amount:0;outgoing=amount<0?-amount:0;
   }
   if(incoming<0||outgoing<0||(!incoming&&!outgoing)||incoming&&outgoing)throw Error((index+2)+'行目の入出金額を確認してください。');
   const description=cell('description').trim()||'取引',balance=map.balance>=0&&cell('balance').trim()!==''?cfbCSVNumber_(cell('balance'),'残高'):null;
   const externalId=map.externalId>=0?cell('externalId').trim():'';
   const fingerprint=[date,incoming,outgoing,description,balance,externalId].join('|');
   const occurrence=(occurrences.get(fingerprint)||0)+1;occurrences.set(fingerprint,occurrence);
   return {date,incoming,outgoing,description,balance,externalId,occurrence,transfer:false};
  }).filter(Boolean);
  if(!ui.preview.length)throw Error('取り込める明細がありません。');

function cfbImportChunk_(){

  ui.importing=false;ui.importPending=null;ui.importChunkKey='';

  cfbLoadAfterWrite_();return;
 }
 const subset=items.slice(start,start+200);
 if(!ui.importChunkKey)ui.importChunkKey=cfbKey_();
 const payload={accountId:pending.accountId,fileName:pending.fileName,rows:subset,requestKey:ui.importChunkKey};
 const fail=err=>{
  if(ui.importPending!==pending)return;
  ui.importing=false;
  ui.error=cleanApiErrorMessage(err,'取込の完了を確認できません。登録済みの行を消さず、失敗位置から再開できます。');
  renderPageIfActive('finance');
 };
 try{
  cfbRpc_('importCashFlowBankRows',payload,res=>{
   if(!ui.importing||ui.importPending!==pending)return;
   const added=Number(res&&res.added),skipped=Number(res&&res.skipped);
   if(!res||res.ok!==true||!Number.isInteger(added)||!Number.isInteger(skipped)||
      added<0||skipped<0||added+skipped!==subset.length){
    fail({message:'取込結果の件数を検証できません。現在のチャンクを同じ送信識別子で再試行してください。'});return;
   }
   ui.importAdded+=added;ui.importSkipped+=skipped;ui.importIndex+=subset.length;ui.importChunkKey='';
   renderPageIfActive('finance');cfbImportChunk_();
  },fail);
 }catch(err){fail(err);}

<script>
/* Editable bank import preview. This module edits ONLY the in-memory staging
 * rows. Import is performed by the existing admin-authorized server method. */
const CFB_GRID_FIELDS=[
 ['date','取引日'],['description','摘要'],['incoming','入金（円）'],
 ['outgoing','出金（円）'],['balance','残高（円）'],['externalId','取引番号']
];
const CFB_GRID_PAGE_SIZE=25;
function cfbBankGridEditable_(){return !cfbUi.importing&&!cfbUi.importPending&&!cfbUi.busy;}
function cfbBankGridSetAccount_(accountId){
 if(cfbUi.importing||cfbUi.importPending){
  cfbUi.error='通信結果が未確認のため、別口座には切り替えられません。';
  renderPageIfActive('finance');return;
 }
 const next=String(accountId||'');
 if(next===cfbUi.csvAccountId)return;
 const apply=()=>{cfbUi.csvAccountId=next;cfbUi.preview=null;cfbUi.bankGridEdited=false;
  cfbUi.bankGridPage=0;cfbUi.error='';renderPageIfActive('finance');};
 if(cfbUi.preview&&cfbUi.preview.length){
  openConfirmDialog('取込先口座の変更','口座を切り替えると取込前の明細プレビューは破棄されます。元データを再度解析する必要があります。',
   'プレビューを破棄して変更',apply);renderPageIfActive('finance');return;
 }
 apply();
}
function cfbBankGridDate_(value){
 const s=String(value==null?'':value).trim().replace(/年|[/.]/g,'-').replace(/月/g,'-').replace(/日/g,'');
 let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
 if(!m)m=/^(\d{4})(\d{2})(\d{2})$/.exec(s);
 if(!m)throw Error('取引日は西暦の年月日で入力');
 const year=Number(m[1]),month=Number(m[2]),day=Number(m[3]);
 const expected=String(year).padStart(4,'0')+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
 if(year<2000||year>2100||month<1||month>12||day<1||day>31||
   new Date(Date.UTC(year,month-1,day)).toISOString().slice(0,10)!==expected)
  throw Error('存在しない取引日');
 return expected;
}
function cfbBankGridMoney_(value,label,optional,negative){
 const s=String(value==null?'':value).replace(/[,，\s￥¥円]/g,'').trim();
 if(optional&&(value==null||s===''||s==='-'))return null;
 if(!s||s==='-')return 0;
 const m=s.replace(/^\((\d+)\)$/,'-$1');
 if(!/^-?(0|[1-9]\d{0,11})$/.test(m)||(!negative&&m.startsWith('-')))
  throw Error(label+'は整数の円単位');
 const n=Number(m);
 if(!Number.isSafeInteger(n)||Math.abs(n)>999999999999)throw Error(label+'が上限超過');
 return n;
}
function cfbBankGridNormalize_(row){
 const date=cfbBankGridDate_(row.date),
  description=String(row.description==null?'':row.description).trim(),
  externalId=String(row.externalId==null?'':row.externalId).trim(),
  incoming=cfbBankGridMoney_(row.incoming,'入金額',false,false),
  outgoing=cfbBankGridMoney_(row.outgoing,'出金額',false,false),
  balance=cfbBankGridMoney_(row.balance,'残高',true,true);
 if(!description||description.length>240)throw Error('摘要は1～240文字');
 if(externalId.length>100)throw Error('取引番号は100文字以内');
 if((incoming>0)===(outgoing>0))throw Error('入金・出金はどちらか一方のみ1円以上');
 return {date,description,incoming,outgoing,balance,externalId,transfer:row.transfer===true};
}
function cfbBankGridErrors_(row){
 try{cfbBankGridNormalize_(row);return [];}catch(e){return [String(e.message||e)];}
}
function cfbBankGridStats_(){
 const preview=cfbUi.preview||[];let inTotal=0,outTotal=0,invalid=0;
 for(const row of preview){
  try{const r=cfbBankGridNormalize_(row);inTotal+=r.incoming;outTotal+=r.outgoing;}
  catch(_){invalid++;}
 }
 return {count:preview.length,inTotal,outTotal,invalid};
}
function cfbBankGridReindex_(){
 const ui=cfbUi,occurrences=new Map();
 (ui.preview||[]).forEach(row=>{
  let normalized;
  try{normalized=cfbBankGridNormalize_(row);}catch(_){row.occurrence=1;return;}
  // Recompute index after edits/removals. The server deduplicates via this
  // fingerprint; independently real repeated payments must stay distinguishable.
  const k=[normalized.date,normalized.incoming,normalized.outgoing,normalized.description,
   normalized.balance,normalized.externalId].join('|');
  const nth=(occurrences.get(k)||0)+1;occurrences.set(k,nth);row.occurrence=nth;
 });
}
function cfbBankGridRefreshStats_(){
 const s=cfbBankGridStats_();
 for(const [id,val] of [['cbg-total',s.count+'件'],['cbg-in',s.inTotal.toLocaleString('ja-JP')+'円'],
  ['cbg-out',s.outTotal.toLocaleString('ja-JP')+'円'],['cbg-invalid',s.invalid+'件']]){
  const node=document.getElementById(id);if(node)node.textContent=val;
 }
 const action=document.getElementById('cbg-import');
 if(action)action.disabled=!s.count||!!s.invalid||!cfbUi.csvAccountId||cfbUi.importing;
}
function cfbBankGridCell_(index,key,value){
 if(!cfbBankGridEditable_()||!cfbUi.preview||!cfbUi.preview[index]||
    !CFB_GRID_FIELDS.some(([k])=>k===key))return;
 cfbUi.preview[index][key]=String(value==null?'':value);
 cfbUi.bankGridEdited=true;cfbBankGridReindex_();
 const status=document.getElementById('cbg-error-'+index);
 const errors=cfbBankGridErrors_(cfbUi.preview[index]);
 if(status){status.textContent=errors.length?errors.join('・'):'確認OK';status.dataset.valid=errors.length?'false':'true';}
 cfbBankGridRefreshStats_();
}
function cfbBankGridCellBlur_(index,key,node){
 if(!cfbBankGridEditable_()||!cfbUi.preview||!cfbUi.preview[index])return;
 const row=cfbUi.preview[index];
 // Standardize only valid fields, never erase invalid input while correcting it.
 try{
  if(key==='date')row.date=cfbBankGridDate_(row.date);
  else if(['incoming','outgoing','balance'].includes(key))
   row[key]=cfbBankGridMoney_(row[key],key,key==='balance',key==='balance');
  node.value=String(row[key]==null?'':row[key]);
 }catch(_){}
 cfbBankGridReindex_();cfbBankGridRefreshStats_();
}
function cfbBankGridApplyPaste_(text,startRow,startCol){
 if(!cfbBankGridEditable_())throw Error('取込中・通信結果未確認の明細は変更できません。');
 const src=String(text||'').replace(/\r\n?/g,'\n');
 if(!src||src.length>150000)throw Error('貼付は15万文字以内です。');
 const lines=src.split('\n');if(lines[lines.length-1]==='')lines.pop();
 const matrix=lines.map(line=>line.split('\t'));
 if(!matrix.length||matrix.length>3000||matrix.some(line=>line.length>6))
  throw Error('貼り付ける行と列を確認してください（6列まで）。');
 if(startCol+Math.max(...matrix.map(r=>r.length))>6||
   startRow+matrix.length>(cfbUi.preview||[]).length)
  throw Error('貼付先がプレビュー表を超えています。明細全体を貼り直す場合は上の貼り付け欄を使ってください。');
 // Validate the entire range before modifying any input cell.
 for(let i=0;i<matrix.length;i++)for(let j=0;j<matrix[i].length;j++){
  const key=CFB_GRID_FIELDS[startCol+j][0];
  if(!['date','description','incoming','outgoing','balance','externalId'].includes(key))
   throw Error('列が正しくありません。');
 }
 for(let i=0;i<matrix.length;i++)for(let j=0;j<matrix[i].length;j++){
  cfbUi.preview[startRow+i][CFB_GRID_FIELDS[startCol+j][0]]=matrix[i][j].trim();
 }
 cfbUi.bankGridEdited=true;cfbUi.bankGridPage=Math.floor(startRow/CFB_GRID_PAGE_SIZE);
 cfbBankGridReindex_();
 return {rows:matrix.length,columns:Math.max(...matrix.map(r=>r.length))};
}
function cfbBankGridPasteEvent_(event,index,col){
 if(!cfbBankGridEditable_())return;
 const text=event.clipboardData&&event.clipboardData.getData('text/plain');
 if(!text||!(/[\t\r\n]/.test(text)))return;
 event.preventDefault();
 try{const v=cfbBankGridApplyPaste_(text,index,col);
  cfbUi.error='';cfbUi.notice=v.rows+'行×'+v.columns+'列を貼り付けました。まだDBには登録されていません。';
 }catch(e){cfbUi.error=String(e.message||e);}
 renderPageIfActive('finance');
 const el=document.querySelector('[data-cbg-cell="'+index+'-'+col+'"]');
 if(el)el.focus();
}
function cfbBankGridPageChange_(page){
 if(!cfbUi.preview||!cfbUi.preview.length)return;
 const max=Math.ceil(cfbUi.preview.length/CFB_GRID_PAGE_SIZE)-1;
 cfbUi.bankGridPage=Math.max(0,Math.min(max,Number(page)||0));
 renderPageIfActive('finance');
}
function cfbBankGridRemove_(index){
 if(!cfbBankGridEditable_()||!cfbUi.preview||!cfbUi.preview[index])return;
 openConfirmDialog('明細を取込対象から除外','選んだ行をプレビューから除外します。銀行のWeb明細や既存のFM WORKS DBは変更しません。',
  'この行を除外',()=>{
   if(!cfbBankGridEditable_()||!cfbUi.preview||!cfbUi.preview[index])return;
   cfbUi.preview.splice(index,1);
   cfbUi.bankGridEdited=true;
   cfbBankGridReindex_();
   cfbUi.bankGridPage=Math.min(cfbUi.bankGridPage||0,
    Math.max(0,Math.ceil(cfbUi.preview.length/CFB_GRID_PAGE_SIZE)-1));
   cfbUi.notice='取込対象から1行除外しました。';renderPageIfActive('finance');
  });
}
function cfbBankGridCopy_(){
 const rows=cfbUi.preview||[];
 if(!rows.length)return;
 const safe=value=>String(value==null?'':value).replace(/[\r\n\t]/g,' ').replace(/^[=+\-@]/,"'$&");
 const data=CFB_GRID_FIELDS.map(r=>r[1]).join('\t')+'\n'+
   rows.map(row=>CFB_GRID_FIELDS.map(([k])=>safe(row[k])).join('\t')).join('\n');

function cfbParseBankPaste_(text){
 const raw=String(text||'').replace(/^\ufeff/,'').trim();
 if(raw.length>150000)throw Error('テキストが大きすぎます。15万文字以下に分けてください。');
 if(!raw)throw Error('銀行画面の表をコピーして貼り付けてください。');
 let records;
 if(raw.includes('\t'))records=raw.split(/\r\n|\r|\n/).filter(Boolean).map(row=>row.split('\t').map(x=>x.trim()));
 else if(/\s{2,}/.test(raw))records=raw.split(/\r\n|\r|\n/).filter(Boolean).map(row=>row.trim().split(/[\u3000 ]{2,}/));
 else records=cfbParseCSV_(raw);
 if(records.length>3001)throw Error('1回の入力は3000行以下にしてください。');
 if(records.length<1||records.some(row=>row.length>80))throw Error('行・列の数を確認してください。');
 const head=records[0];
 const date=/^(?:\d{4}[\/-]\d{1,2}[\/-]\d{1,2}|\d{8})$/;
 if(head.length===5&&date.test(String(head[0]).trim()))records.unshift(['取引日','摘要','出金額','入金額','残高']);
 if(records.length<2)throw Error('見出しと明細行を貼り付けてください。');
 return records;
}

 ))return;
 if(action==='UNLINK'&&!['APPROVED','STALE'].includes(record.planLink&&record.planLink.status))return;
 const approving=action==='APPROVE';

  u.planPending.action===action&&u.planPending.planId===(approving?planId:'')&&
  u.planPending.plannedDate===(approving?plannedDate:'');
 if(!same){
  u.planPending={action,transactionId,planId:approving?planId:'',
   plannedDate:approving?plannedDate:'',
   revision:record.planLink?Number(record.planLink.revision):0,
   reason:approving?'金額・口座・予定日を確認して承認':'照合先の見直しのため承認を解除',
   requestKey:cfaKey_()};
 }

function cfaPlanMatchHtml_(match,transactionId,link,ready){

 if(stored.status==='APPROVED'||stored.status==='STALE'){
  const stale=stored.status==='STALE';
  return '<div class="cfa-plan-approved"><strong>'+(stale?'要再確認：承認後に元データが変更':'照合承認済み・会計未確定')+'</strong>'+
   '<span>'+cfaEsc_(stored.title)+' ／ '+cfaEsc_(stored.plannedDate)+'</span>'+
   '<small>確認：'+cfaEsc_(stored.editorId)+' '+cfaEsc_(stored.updatedAt)+'</small>'+
   '<button type="button" class="secondary-button" data-id="'+cfaEsc_(transactionId)+
   '" onclick="cfaPlanAction_(\'UNLINK\',this.dataset.id)">承認を解除</button></div>';
 }
 if(m.status==='TRANSFER')return '<span class="cfa-plan-match-none">振替・対象外</span>';
 if(m.status==='INVALID_DATE')return '<span class="cfa-plan-match-warning">日付要確認</span>';
 if(!total)return '<span class="cfa-plan-match-none">候補なし</span>';
 const items=(m.candidates||[]).map(p=>'<li><strong>'+cfaEsc_(p.title)+'</strong>'+
  '<small>予定日 '+cfaEsc_(p.plannedDate)+' ／ '+cfaMoney_(p.amount)+
  ' ／ '+cfaEsc_(Number(p.gapDays)||0)+'日差'+(p.accountId?' ／ 口座指定あり':' ／ 口座未指定')+
  (p.descriptionMatch?' ／ 摘要の文字も一致':' ／ 摘要は別途確認')+'</small>'+
  (ready?'<button type="button" class="secondary-button" data-id="'+cfaEsc_(transactionId)+
  '" data-plan="'+cfaEsc_(p.planId)+'" data-date="'+cfaEsc_(p.plannedDate)+
  '" onclick="cfaPlanAction_(\'APPROVE\',this.dataset.id,this.dataset.plan,this.dataset.date)">この予定を照合承認</button>':
  '<small>承認記録を保存するにはDB v20への更新が必要です。</small>')+'</li>').join('');
 return '<details class="cfa-plan-match"><summary class="'+(total>1?'cfa-plan-match-warning':'')+'">'+
  (total>1?'候補'+total+'件・要確認':'候補1件・未確定')+'</summary><ul>'+items+'</ul>'+
  (total>(m.candidates||[]).length?'<small>他にも候補があります。予定一覧で確認してください。</small>':'')+
  '</details>';
}

function cfaAnalysisPage_(){
 const u=cfaUi,w=u.workspace;if(!w)return '<p role="status">資金の分析情報を読み込み中です。</p>';
 const months=(w.months||[]).map(m=>'<option value="'+cfaEsc_(m)+'"'+(m===u.month?' selected':'')+'>'+cfaEsc_(m.replace('-','年')+'月')+'</option>').join('');
 const check=(w.checks||[]).filter(x=>x.month===u.month);
 const rows=u.rows||[];
 const bankNames=new Map((w.accounts||[]).map(a=>[a.id,a.bank+' / '+a.name]));
 const table=rows.map(r=>{
  const e=u.editor&&u.editor.id===r.id,category=r.reviewed?'確定：'+r.category:r.suggested?'候補：'+r.category:'未分類';
  return '<tr><td>'+cfaEsc_(r.date)+'</td><td>'+cfaEsc_(bankNames.get(r.accountId)||'非表示口座')+'</td><td>'+cfaEsc_(r.description)+'</td>'+
   '<td class="cf-num">'+(r.incoming?cfaMoney_(r.incoming):'')+'</td><td class="cf-num">'+(r.outgoing?cfaMoney_(r.outgoing):'')+'</td>'+
   '<td>'+cfaEsc_(r.transfer?'口座間振替':category)+'</td><td>'+cfaEsc_(r.tags||'—')+'</td><td>'+cfaEsc_(r.note||'—')+'</td><td>'+cfaPlanMatchHtml_(r.planMatch,r.id,r.planLink,u.linkReady)+'</td>'+
   '<td><button class="secondary-button" type="button" data-id="'+cfaEsc_(r.id)+'" onclick="cfaOpenEditor_(this.dataset.id)">分類・メモ</button></td></tr>'+
   (e?'<tr class="cfa-editor-row"><td colspan="10"><div class="cfa-editor"><label>計上区分<input id="cfaCategory" maxlength="60" value="'+cfaEsc_(u.editor.category)+'" oninput="cfaEditorField_(\'category\',this.value)"></label>'+
    '<label>タグ（カンマ区切り）<input id="cfaTags" maxlength="250" value="'+cfaEsc_(u.editor.tags)+'" oninput="cfaEditorField_(\'tags\',this.value)"></label>'+
    '<label>内容メモ<textarea id="cfaNote" rows="2" maxlength="800" oninput="cfaEditorField_(\'note\',this.value)">'+cfaEsc_(u.editor.note)+'</textarea></label>'+
    '<button class="primary-button" type="button" onclick="cfaSaveAnnotation_()"'+(u.busy?' disabled':'')+'>分類とメモを保存</button>'+
    '<button class="secondary-button" type="button" onclick="cfaCancelDraft_(\'editor\')">閉じる</button></div></td></tr>':'');
 }).join('');
 const reconciliation=check.map((r,i)=>{
  const pending=u.reconcilePending&&u.reconcilePending.payload,
   draft=pending&&pending.month===u.month&&pending.accountId===r.accountId?pending:null;
  return '<div class="cfa-reconcile-item"><div><strong>'+cfaEsc_(r.accountName)+'</strong><span>'+
   (r.verified?'照合済':r.outdated?'要再照合':'未照合')+'／入金 '+cfaMoney_(r.actualIn)+'・出金 '+cfaMoney_(r.actualOut)+'／ '+r.importedCount+'件</span></div>'+
   '<label>銀行Webの月末残高（円）<input type="number" id="cfa-bank-balance-'+i+'" value="'+(draft?cfaEsc_(draft.closingBalance):r.latestBalance!==null?cfaEsc_(r.latestBalance):'')+'" placeholder="銀行サイトで確認" /></label>'+
   '<label>照合根拠・補足<input type="text" maxlength="500" id="cfa-bank-note-'+i+'" value="'+cfaEsc_(draft?draft.note:r.note||'')+'" placeholder="取引がない月も確認根拠を記入" /></label>'+
   '<button class="secondary-button" onclick="cfaReconcile_('+i+')"'+(u.busy?' disabled':'')+'>照合して保存</button></div>';
 }).join('');
 return '<section class="card cfa-panel"><div class="cfa-toolbar"><label>対象月 <select onchange="cfaChangeMonth_(this.value)">'+months+'</select></label>'+
  '<label><input type="checkbox" onchange="cfaToggleReviewOnly_(this.checked)"'+(u.reviewOnly?' checked':'')+'>説明待ちのみ表示</label>'+
  '<div>未確定の分類（年度全体）：<strong>'+Number(w.unreviewedCount||0)+'件</strong></div>'+
  '<button type="button" class="secondary-button" onclick="cfaApplyCurrentRules_()"'+(u.busy?' disabled':'')+'>このページの自動分類候補を確定</button></div>'+
  '<h2>入出金明細と個別メモ</h2><p>銀行Webの原明細は変更しません。予定照合は同額・入出金方向・口座・予定日の前後3日で候補を探します。候補は未確定です。担当者が承認しても銀行月次確定・会計処理は自動変更されません。</p>'+
  (u.loadingMonth?'<p role="status">銀行明細を読み込み中です。</p>':
   '<div class="cf-scroll"><table class="cf-table"><thead><tr><th>日付</th><th>金融機関</th><th>摘要</th><th>入金</th><th>出金</th><th>計上区分</th><th>タグ</th><th>メモ</th><th>予定との候補</th><th>操作</th></tr></thead><tbody>'+
   (table||'<tr><td colspan="10">'+(u.reviewOnly?'対象月の説明待ち明細はありません。':'対象月の明細はまだありません。')+'</td></tr>')+'</tbody></table></div>'+
   '<div class="cfa-pagination"><span>'+(u.page*100+1)+'〜'+Math.min((u.page+1)*100,u.total)+'件 / '+u.total+'件</span>'+
    '<button class="secondary-button" onclick="cfaPageIndex_('+(u.page-1)+')"'+(u.page===0?' disabled':'')+'>前へ</button>'+
    '<button class="secondary-button" onclick="cfaPageIndex_('+(u.page+1)+')"'+((u.page+1)*100>=u.total?' disabled':'')+'>次へ</button></div>')+
  '</section><section class="card cfa-panel"><h2>銀行口座別の月末残高を照合する</h2><p>銀行のWebページで月内すべての明細を確認し、末尾残高を入力してください。未照合の月は確定実績として採用されません。銀行別の明細合計は自社口座間振替を含みますが、会社全体の収支からは除外します。</p>'+
  (reconciliation||'<p>登録済み銀行口座がありません。</p>')+'</section>'+cfaRulesPage_();
}
function cfaRulesPage_(){
 const u=cfaUi,w=u.workspace||{},options=[['ANY','入金・出金'],['IN','入金だけ'],['OUT','出金だけ']];
 const items=(w.rules||[]).map(r=>'<tr><td>'+cfaEsc_(r.keyword)+'</td><td>'+cfaEsc_(r.category)+'</td><td>'+cfaEsc_(r.tags||'—')+'</td><td>'+r.priority+'</td><td>'+(r.active?'有効':'無効')+'</td>'+
  '<td><button class="secondary-button" data-id="'+cfaEsc_(r.id)+'" onclick="cfaRuleNew_(this.dataset.id)">編集</button></td></tr>').join('');
 const d=u.ruleDraft;
 const form=d?'<div class="cfa-editor cfa-rule-form"><label>摘要に含まれる文字<input maxlength="80" value="'+cfaEsc_(d.keyword)+'" oninput="cfaRuleChange_(\'keyword\',this.value)" /></label>'+
  '<label>入出金<select onchange="cfaRuleChange_(\'direction\',this.value)">'+options.map(o=>'<option value="'+o[0]+'"'+(d.direction===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>'+
  '<label>対象口座<select onchange="cfaRuleChange_(\'accountId\',this.value)"><option value="">すべての口座</option>'+
   (w.accounts||[]).map(a=>'<option value="'+cfaEsc_(a.id)+'"'+(a.id===d.accountId?' selected':'')+'>'+cfaEsc_(a.bank+' '+a.name)+'</option>').join('')+'</select></label>'+
  '<label>計上区分<input maxlength="60" value="'+cfaEsc_(d.category)+'" oninput="cfaRuleChange_(\'category\',this.value)" /></label>'+
  '<label>タグ<input maxlength="250" value="'+cfaEsc_(d.tags)+'" oninput="cfaRuleChange_(\'tags\',this.value)" /></label>'+
  '<label>優先度（1〜100）<input type="number" min="1" max="100" value="'+d.priority+'" oninput="cfaRuleChange_(\'priority\',this.value)" /></label>'+
  '<label>有効<input type="checkbox"'+(d.active?' checked':'')+' onchange="cfaRuleChange_(\'active\',this.checked)" /></label>'+
  '<button type="button" class="primary-button" onclick="cfaSaveRule_()"'+(u.busy?' disabled':'')+'>ルールを保存</button>'+
  '<button type="button" class="secondary-button" onclick="cfaCancelDraft_(\'ruleDraft\')">閉じる</button></div>':'';
 return '<section class="card cfa-panel"><div class="cfa-toolbar"><h2>自動分類ルール</h2><button class="primary-button" onclick="cfaRuleNew_()">＋ ルールを追加</button></div>'+
  '<p>銀行摘要のキーワード、入出金、口座で自動判定します。優先度が高いルールを先に適用し、確定したメモは上書きしません。</p>'+form+
  '<div class="cf-scroll"><table class="cf-table"><thead><tr><th>キーワード</th><th>計上区分</th><th>タグ</th><th>優先度</th><th>状態</th><th>編集</th></tr></thead><tbody>'+
  (items||'<tr><td colspan="6">まだルールがありません。</td></tr>')+'</tbody></table></div></section>';
}
function cfaScenarioEditor_(){
 const u=cfaUi,d=u.scenarioDraft;if(!d)return '';
 const months=u.workspace&&u.workspace.months||[],plans=(cfbUi.loaded&&cfbUi.loaded.plans||[]).filter(p=>p.active);
 const types={SHIFT:'月をずらす',OMIT:'予定を除外',SCALE:'金額を変更',EXTRA:'臨時入出金'};
 const conditions=d.changes.map((c,i)=>{
  const selector='<select onchange="cfaScenarioField_('+i+',\'month\',this.value)">'+months.map(m=>'<option value="'+cfaEsc_(m)+'"'+(c.month===m?' selected':'')+'>'+cfaEsc_(m)+'</option>').join('')+'</select>';
  const chooser=c.type==='EXTRA'?
   '<select onchange="cfaScenarioField_('+i+',\'direction\',this.value)"><option value="OUT"'+(c.direction==='OUT'?' selected':'')+'>出金</option><option value="IN"'+(c.direction==='IN'?' selected':'')+'>入金</option></select>'+
    '<input type="number" min="0" value="'+c.amount+'" aria-label="臨時金額" oninput="cfaScenarioField_('+i+',\'amount\',this.value)" />'+
    '<input value="'+cfaEsc_(c.title)+'" maxlength="90" aria-label="臨時予定名" oninput="cfaScenarioField_('+i+',\'title\',this.value)" />':
   '<select aria-label="対象の予定" onchange="cfaScenarioField_('+i+',\'planId\',this.value)">'+plans.map(p=>'<option value="'+cfaEsc_(p.id)+'"'+(c.planId===p.id?' selected':'')+'>'+cfaEsc_(p.title)+'</option>').join('')+'</select>'+
   (c.type==='SHIFT'?'<input type="number" min="-6" max="6" value="'+c.monthsDelta+'" aria-label="移動月数" oninput="cfaScenarioField_('+i+',\'monthsDelta\',this.value)" />':
    c.type==='SCALE'?'<input type="number" min="0" max="200" value="'+c.percent+'" aria-label="変更後の割合（％）" oninput="cfaScenarioField_('+i+',\'percent\',this.value)" />':'');
  return '<div class="cfa-condition"><strong>'+(i+1)+'. '+types[c.type]+'</strong>'+selector+chooser+
   '<button class="secondary-button" onclick="cfaScenarioRemove_('+i+')">削除</button></div>';
 }).join('');
 return '<section class="card cfa-panel"><h2>シミュレーション条件を編集</h2><div class="cfa-editor">'+
  '<label>条件の名前<input maxlength="100" value="'+cfaEsc_(d.name)+'" oninput="cfaScenarioName_(this.value)" /></label>'+
  '<div class="cfa-condition-actions"><button class="secondary-button" onclick="cfaScenarioAdd_(\'SHIFT\')">入金・出金を遅らせる</button>'+
  '<button class="secondary-button" onclick="cfaScenarioAdd_(\'OMIT\')">契約不成立・予定除外</button>'+
  '<button class="secondary-button" onclick="cfaScenarioAdd_(\'SCALE\')">予定額を変更</button>'+
  '<button class="secondary-button" onclick="cfaScenarioAdd_(\'EXTRA\')">臨時入出金</button></div>'+
  (conditions||'<p>条件を追加してください。条件がない場合は通常計画と同じ結果です。</p>')+
  '<button class="primary-button" onclick="cfaScenarioSave_()"'+(u.busy?' disabled':'')+'>条件を保存</button>'+
  '<button class="secondary-button" onclick="cfaCancelDraft_(\'scenarioDraft\')">閉じる</button></div></section>';
}
function cfaScenarioControls_(){
 const u=cfaUi,w=u.workspace||{};
 const options='<option value="">通常計画（ベースライン）</option>'+(w.scenarios||[]).map(x=>
  '<option value="'+cfaEsc_(x.id)+'"'+(u.scenarioId===x.id?' selected':'')+'>'+cfaEsc_(x.name)+'</option>').join('');
 return '<div class="cfa-toolbar"><label>比較する条件 <select onchange="cfaScenarioSelect_(this.value)">'+options+'</select></label>'+
  '<button class="primary-button" onclick="cfaScenarioNew_()">＋ シミュレーションを作る</button>'+
  (u.scenarioId?'<button class="secondary-button" data-id="'+cfaEsc_(u.scenarioId)+'" onclick="cfaScenarioNew_(this.dataset.id)">この条件を編集</button>':'')+'</div>';
}
function cfaForecastTable_(){
 const p=cfaUi.projection;if(!p||p.setupRequired)return '<p role="status">資金繰り予測を取得中です。</p>';
 const rows=(p.rows||[]).map(r=>'<tr><th>'+cfaEsc_(r.month)+'</th>'+
  '<td class="cf-num">'+cfaMoney_(r.plannedIn)+'</td><td class="cf-num">'+cfaMoney_(r.plannedOut)+'</td>'+
  '<td class="cf-num">'+cfaMoney_(r.actualIn)+'</td><td class="cf-num">'+cfaMoney_(r.actualOut)+'</td>'+
  '<td class="cf-num">'+cfaMoney_(r.forecastEnd)+'</td><td class="cf-num">'+cfaMoney_(r.difference)+'</td>'+
  '<td>'+cfaEsc_(r.source)+'</td></tr>').join('');
 return '<div class="cfa-summary"><div><span>11月末予測残高</span><strong>'+cfaMoney_(p.yearEnd)+'</strong></div>'+
  '<div><span>年間予定入金</span><strong>'+cfaMoney_(p.plannedIn)+'</strong></div>'+
  '<div><span>年間予定出金</span><strong>'+cfaMoney_(p.plannedOut)+'</strong></div>'+
  '<div><span>注意が必要な最初の月</span><strong>'+(p.firstShort?cfaEsc_(p.firstShort):'—')+'</strong></div></div>'+
  (p.warnings&&p.warnings.length?'<div class="cfa-warning" role="alert"><strong>要確認の項目</strong><ul>'+p.warnings.map(x=>'<li>'+cfaEsc_(x)+'</li>').join('')+'</ul></div>':'')+
  '<div class="cf-scroll"><table class="cf-table"><thead><tr><th>月</th><th>予定入金</th><th>予定出金</th><th>取込入金</th><th>取込出金</th><th>見込み残高</th><th>通常との差</th><th>根拠</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function cfaScenariosPage_(){
 return '<section class="card cfa-panel"><h2>条件別の資金繰りを比較する</h2><p>元の計画・銀行明細には手を加えません。入金遅延、契約不成立、設備投資などを条件として保存します。</p>'+
  cfaScenarioControls_()+cfaForecastTable_()+'</section>'+cfaScenarioEditor_();
}
function cfaReportsPage_(){
 const u=cfaUi,p=u.projection;
 return '<section class="card cfa-panel"><h2>金融機関・税理士に提出する資金繰り表</h2>'+
  '<p>2026年11月期など、前年12月から11月までの年間表を作成します。提出する前に実績確定月・銀行残高・未分類明細を確認してください。</p>'+
  cfaScenarioControls_()+cfaForecastTable_()+
  '<div class="cfa-export"><p>帳票には「予定／確定実績」の区別、比較条件、月別残高、銀行月次照合、明細分類を付けます。未照合や未入力がある場合、帳票に要確認と表示されます。</p>'+
  '<button class="primary-button" onclick="cfaDownloadReport_(\'XLSX\')"'+(u.exporting||!p||p.setupRequired?' disabled':'')+'>年間資金繰りをExcel出力</button>'+
  '<button class="secondary-button" onclick="cfaDownloadReport_(\'PDF\')"'+(u.exporting||!p||p.setupRequired?' disabled':'')+'>年間資金繰りをPDF出力</button>'+
  (u.exporting?'<span role="status">帳票を作成中です...</span>':'')+'</div>'+
  '<div class="cfa-export"><h3>税理士向け｜銀行取引の説明一覧</h3><p>入出金明細・分類・タグ・説明状態を出力します。銀行原本・帳簿は変更せず、外部へ自動送信しません。税理士による確認済みを意味しません。</p>'+
  '<label><input type="checkbox" onchange="cfaUi.taxIncludeMemo=this.checked"'+(u.taxIncludeMemo?' checked':'')+'>個別メモを含める（初期状態は非表示）</label>'+
  '<button class="secondary-button" onclick="cfaDownloadTaxCsv_()"'+(u.exporting?' disabled':'')+'>取引説明をCSV出力</button></div></section>';
}
function cfaPage_(){
 if(cfaUi.year!==cashFlowUi.year)cfaEnsureYear_();
 const u=cfaUi;if(cfbUi.demo)return '<section class="card cfa-panel"><h2>資金管理</h2><p>架空データ表示では本番用の分類・照合や帳票を保存できません。実データへ戻ってください。</p></section>';
 if(!u.workspace){
  if(u.error)return '<section class="card cfa-panel"><p class="finance-error" role="alert">'+cfaEsc_(u.error)+'</p><button class="secondary-button" type="button" onclick="cfaLoad_(true)">接続を再試行</button></section>';
  if(!u.loading)cfaLoad_(false);return '<section class="card cfa-panel">明細・分類ルール・照合を読み込み中です。</section>';}
 if(u.workspace.setupRequired)return '<section class="card cfa-panel"><h2>初回設定が必要です</h2><p>個別メモ・分類ルール・銀行照合を保存するため、管理者によるバックアップ付きDB更新が必要です。</p>'+
  '<button class="primary-button" onclick="cfbSetup_()">バックアップして初期設定する</button></section>';
 const feedback=(u.error?'<p class="finance-error" role="alert">'+cfaEsc_(u.error)+'</p><button class="secondary-button" type="button" onclick="cfaLoad_(true)">接続を再試行</button>':'')+
  (u.notice?'<p class="cf-success" role="status">'+cfaEsc_(u.notice)+'</p>':'');
 return '<div class="cfa-workspace">'+feedback+'<fieldset class="cfa-controls"'+(u.busy?' disabled':'')+'>'+
  (cfbUi.tab==='analysis'?cfaAnalysisPage_():cfbUi.tab==='scenarios'?cfaScenariosPage_():cfaReportsPage_())+
  '</fieldset></div>';
}
</script>
