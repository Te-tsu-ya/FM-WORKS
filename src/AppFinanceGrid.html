<script>
/* v0.24.0 — Direct, spreadsheet-style finance ledger.
 * Only the visible draft is editable here. Committing always uses the existing
 * authorization, row validation, idempotency keys and Google Sheets bulk API.
 */
const FINANCE_GRID_COLUMNS=[
 ['usedOn','利用日','日付'],['vendor','取引先','支払先'],
 ['item','内容・品目','内容'],['amount','金額 (円)','数値'],
 ['category','経費種別','分類'],['payer','支払者','氏名'],
 ['paymentMethod','支払方法','支払'],['paid','支払有無','状況'],
 ['invoiceNo','適格請求書番号','T番号'],['note','備考','メモ'],
 ['receiptRef','証憑番号','参照']
];
const FINANCE_GRID_LIMIT=500;
const FINANCE_GRID_PAGE_SIZE=50;
function financeGridBlank_(){
 return {usedOn:'',vendor:'',item:'',amount:'',category:'未分類',payer:'',
   paymentMethod:'',paid:'未',invoiceNo:'',note:'',receiptRef:''};
}
function financeGridHasRecord_(row){
 return !!row&&FINANCE_GRID_COLUMNS.some(([key])=>key!=='category'&&key!=='paid'&&
   String(row[key]==null?'':row[key]).trim()!=='');
}
function financeGridCanEdit_(){
 return !financeBulkUi.busy&&!financeBulkUi.locked&&!financeBulkUi.complete;
}
function financeGridEnsure_(){
 const ui=financeBulkUi;
 // Saving a snapshot must never append blank rows: it would cause
 // financeBulkNext_ to submit unvalidated empty records after the first RPC.
 if(ui.complete||ui.locked||ui.busy)return;
 if(!Array.isArray(ui.selectedRows))ui.selectedRows=[];
 if(typeof ui.pasteOpen!=='boolean')ui.pasteOpen=false;
 if(typeof ui.gridEdited!=='boolean')ui.gridEdited=false;
 if(typeof ui.startingRow!=='number')ui.startingRow=0;
 while(ui.rows.length<12){
  ui.rows.push(financeGridBlank_());ui.keys.push(financeNewKey());
 }
}
function financeGridStats_(){
 const entered=financeBulkUi.rows.filter(financeGridHasRecord_);
 let invalid=0,dupe=0,amount=0;
 for(const r of entered){
  if(financeBulkValidateRow_(r).length)invalid++;
  if(financeBulkSimilar_(r))dupe++;
  if(/^\d{1,9}$/.test(String(r.amount||'')))amount+=Number(r.amount);
 }
 return {entered:entered.length,invalid,dupe,amount};
}
function financeGridAdd_(count){
 if(!financeGridCanEdit_())return;
 const ui=financeBulkUi,n=Math.max(1,Math.min(50,Number(count)||10));
 if(ui.rows.length+n>FINANCE_GRID_LIMIT){
  ui.error='入力できるのは最大500行です。保存した後、新しい表を開いてください。';
  renderPageIfActive('finance');return;
 }
 for(let i=0;i<n;i++){ui.rows.push(financeGridBlank_());ui.keys.push(financeNewKey());}
 ui.page=Math.floor((ui.rows.length-1)/FINANCE_GRID_PAGE_SIZE);
 ui.error='';renderPageIfActive('finance');
}
function financeGridSelect_(index,checked){
 const ui=financeBulkUi,existing=new Set(ui.selectedRows||[]);
 if(checked)existing.add(index);else existing.delete(index);
 ui.selectedRows=[...existing].sort((a,b)=>a-b);
 financeGridUpdateStatsDom_();
}
function financeGridSelectPage_(checked){
 const ui=financeBulkUi,s=ui.page*FINANCE_GRID_PAGE_SIZE,ends=Math.min(s+FINANCE_GRID_PAGE_SIZE,ui.rows.length);
 const selected=new Set(ui.selectedRows||[]);
 for(let i=s;i<ends;i++){if(checked)selected.add(i);else selected.delete(i);}
 ui.selectedRows=[...selected].sort((a,b)=>a-b);
 renderPageIfActive('finance');
}
function financeGridCopySelected_(){
 const ui=financeBulkUi,selected=(ui.selectedRows&&ui.selectedRows.length?
  ui.selectedRows:ui.rows.map((_,i)=>i).filter(i=>financeGridHasRecord_(ui.rows[i])));
 if(!selected.length){showToast('コピーする行を選択するか、経費を入力してください。');return;}
 const safe=v=>String(v==null?'':v).replace(/[\t\r\n]/g,' ').replace(/^[=+\-@]/,"'$&");
 const lines=[FINANCE_GRID_COLUMNS.map(x=>x[1]).join('\t')];
 for(const i of selected)lines.push(FINANCE_GRID_COLUMNS.map(([k])=>safe(ui.rows[i][k])).join('\t'));
 const data=lines.join('\n');
 if(typeof navigator!=='undefined'&&navigator.clipboard?.writeText)
  navigator.clipboard.writeText(data).then(()=>showToast('行をコピーしました。'))
    .catch(()=>financeBulkCopyFallback_(data));
 else financeBulkCopyFallback_(data);
}
function financeGridDuplicate_(){
 const ui=financeBulkUi;
 if(!financeGridCanEdit_())return;
 const selected=(ui.selectedRows||[]).filter(i=>i>=0&&i<ui.rows.length);
 if(!selected.length){showToast('複製する行を選択してください。');return;}
 if(ui.rows.length+selected.length>FINANCE_GRID_LIMIT){
  ui.error='複製後の行数が500行を超えます。';renderPageIfActive('finance');return;
 }
 const ordered=selected.slice().sort((a,b)=>a-b),clones=ordered.map(i=>({...ui.rows[i]}));
 let offset=0;for(let i=0;i<ordered.length;i++){
  const at=ordered[i]+offset+1;
  ui.rows.splice(at,0,clones[i]);ui.keys.splice(at,0,financeNewKey());offset++;
 }
 ui.selectedRows=[];
 ui.gridEdited=true;ui.page=Math.floor((ordered[0]+1)/FINANCE_GRID_PAGE_SIZE);
 ui.error='';renderPageIfActive('finance');
}
function financeGridDeleteSelected_(){
 const ui=financeBulkUi;
 if(!financeGridCanEdit_())return;
 const selected=(ui.selectedRows||[]).filter(i=>i>=0&&i<ui.rows.length);
 if(!selected.length){showToast('削除する行を選択してください。');return;}
 const action=()=>{
  [...selected].sort((a,b)=>b-a).forEach(i=>{ui.rows.splice(i,1);ui.keys.splice(i,1);});
  ui.selectedRows=[];ui.range=null;ui.gridEdited=true;ui.error='';
  ui.page=Math.min(ui.page,Math.max(0,Math.ceil(ui.rows.length/FINANCE_GRID_PAGE_SIZE)-1));
  financeGridEnsure_();renderPageIfActive('finance');
 };
 if(selected.some(i=>financeGridHasRecord_(ui.rows[i])))
  openConfirmDialog('入力した行の削除',selected.length+'行を入力表から削除します。スプレッドシートへはまだ保存されていません。',
    '選択行を削除',action);
 else action();
}
function financeGridUpdateStatsDom_(){
 const s=financeGridStats_();
 const values={'fg-count':s.entered+'件','fg-errors':s.invalid+'件','fg-duplicates':s.dupe+'件',
   'fw-bulk-total':s.amount.toLocaleString('ja-JP')+'円',
   'fg-selected':String((financeBulkUi.selectedRows||[]).length)+'行選択'};
 for(const [id,value] of Object.entries(values)){const el=document.getElementById(id);if(el)el.textContent=value;}
 const save=document.getElementById('fg-save');
 if(save)save.disabled=!s.entered||!financeGridCanEdit_()||financeUi.demo;
}
function financeGridCellInput_(index,key,node){
 if(!financeGridCanEdit_())return;
 financeBulkUpdate_(index,key,node.value);
 financeBulkUi.gridEdited=true;
 const status=document.getElementById('fw-bulk-error-'+index),row=financeBulkUi.rows[index];
 if(status&&!financeGridHasRecord_(row)){
   status.textContent='空行';status.dataset.valid='empty';
 }
 financeGridUpdateStatsDom_();
}
function financeGridCellBlur_(index,key,node){
 const row=financeBulkUi.rows[index];if(!row||!financeGridCanEdit_())return;
 const expected=String(row[key]==null?'':row[key]);
 if(node.value!==expected)node.value=expected;
}
function financeGridMatrix_(text){
 const src=String(text==null?'':text).replace(/\r\n?/g,'\n');
 if(!src||src.length>150000)throw Error('貼り付けは15万文字以内にしてください。');
 const lines=src.split('\n');if(lines[lines.length-1]==='')lines.pop();
 const matrix=lines.map(line=>line.split('\t'));
 if(!matrix.length||matrix.length>FINANCE_GRID_LIMIT)throw Error('1回の貼付は500行以内です。');
 if(matrix.some(line=>line.length>FINANCE_GRID_COLUMNS.length))
  throw Error('列数が入力表を超えています。「貼付形式を読み込む」で列を対応付けてください。');
 return matrix;
}
function financeGridApplyPaste_(text,startRow,startCol){
 if(!financeGridCanEdit_())throw Error('保存処理中は貼り付けできません。');
 const matrix=financeGridMatrix_(text),ui=financeBulkUi;
 const width=Math.max(...matrix.map(r=>r.length));
 if(startCol+width>FINANCE_GRID_COLUMNS.length||startRow+matrix.length>FINANCE_GRID_LIMIT)
   throw Error('貼り付け先が表の最大列数・500行を超えています。');
 // Stage and validate shape BEFORE mutating the draft: failed pastes change nothing.
 const pending=matrix.map(line=>line.map(v=>String(v||'').trim()));
 while(ui.rows.length<startRow+pending.length){
   ui.rows.push(financeGridBlank_());ui.keys.push(financeNewKey());
 }
 for(let r=0;r<pending.length;r++)for(let c=0;c<pending[r].length;c++){
   const key=FINANCE_GRID_COLUMNS[startCol+c][0],value=pending[r][c];
   ui.rows[startRow+r][key]=key==='usedOn'?financeBulkDate_(value):
     key==='amount'?financeBulkAmountText_(value):value;
 }
 ui.gridEdited=true;ui.source=null;ui.mapping=[];ui.headers=[];
 ui.selectedRows=[];ui.error='';
 ui.range=null;
 ui.page=Math.floor(startRow/FINANCE_GRID_PAGE_SIZE);
 return {rows:pending.length,columns:width};
}
function financeGridPasteEvent_(event,row,col){
 if(!financeGridCanEdit_())return;
 const value=event.clipboardData&&event.clipboardData.getData('text/plain');
 if(!value||!/[\t\r\n]/.test(value))return;
 event.preventDefault();
 try{
   const got=financeGridApplyPaste_(value,row,col);
   financeBulkUi.notice=got.rows+'行×'+got.columns+'列を表に貼り付けました。保存はまだ実行していません。';
 }catch(err){financeBulkUi.error=String(err.message||err);}
 renderPageIfActive('finance');
 const newCell=document.querySelector('[data-fin-cell="'+row+'-'+col+'"]');
 if(newCell)newCell.focus();
}
function financeGridNavigate_(event,row,col){
 if(event.isComposing||!financeGridCanEdit_())return;
 let r=row,c=col;
 if(event.key==='Enter')r+=event.shiftKey?-1:1;
 else if(event.key==='ArrowDown')r++;
 else if(event.key==='ArrowUp')r--;
 else if(event.key==='ArrowLeft'&&(event.altKey||event.ctrlKey))c--;
 else if(event.key==='ArrowRight'&&(event.altKey||event.ctrlKey))c++;
 else return;
 if(r<0||c<0||c>=FINANCE_GRID_COLUMNS.length)return;
 if(r>=financeBulkUi.rows.length){
  if(financeBulkUi.rows.length>=FINANCE_GRID_LIMIT)return;
  financeBulkUi.rows.push(financeGridBlank_());financeBulkUi.keys.push(financeNewKey());
  financeBulkUi.page=Math.floor(r/FINANCE_GRID_PAGE_SIZE);
  renderPageIfActive('finance');
 }else if(Math.floor(r/FINANCE_GRID_PAGE_SIZE)!==financeBulkUi.page){
  financeBulkUi.page=Math.floor(r/FINANCE_GRID_PAGE_SIZE);renderPageIfActive('finance');
 }
 event.preventDefault();
 const cell=document.querySelector('[data-fin-cell="'+r+'-'+c+'"]');
 if(cell){cell.focus();cell.select();}
}
function financeGridChangePage_(page){
 if(!financeGridCanEdit_()&&financeBulkUi.busy)return;
 const pages=Math.max(1,Math.ceil(financeBulkUi.rows.length/FINANCE_GRID_PAGE_SIZE));
 financeBulkUi.page=Math.min(Math.max(0,Number(page)||0),pages-1);
 financeBulkUi.range=null;renderPageIfActive('finance');
}
function financeGridApplyDefaults_(){
 if(!financeGridCanEdit_())return;
 const payer=document.getElementById('fg-default-payer')?.value.trim()||'';
 const payment=document.getElementById('fg-default-payment')?.value.trim()||'';
 if(!payer&&!payment){showToast('共通の支払者または支払方法を入力してください。');return;}
 let changed=0;for(const row of financeBulkUi.rows){
   if(!financeGridHasRecord_(row))continue;
   if(payer&&!row.payer){row.payer=payer;changed++;}
   if(payment&&!row.paymentMethod){row.paymentMethod=payment;changed++;}
 }
 financeBulkUi.gridEdited=true;financeBulkUi.notice='入力済み行の空欄だけに共通設定を適用しました（'+changed+'項目）。';
 renderPageIfActive('finance');
}
function financeGridToggleImport_(){
 if(!financeGridCanEdit_())return;
 financeBulkUi.pasteOpen=!financeBulkUi.pasteOpen;renderPageIfActive('finance');
}
function financeGridRunImport_(){
 if(!financeGridCanEdit_())return;
 // Parse first; malformed text must not destroy an existing edited grid.
 try{financeBulkParseMatrix_(financeBulkUi.raw);}catch(err){
  financeBulkUi.error=String(err.message||err);renderPageIfActive('finance');return;
 }
 const apply=()=>{financeBulkPreview_();financeBulkUi.selectedRows=[];financeBulkUi.gridEdited=false;financeBulkUi.pasteOpen=true;};
 if(financeBulkUi.rows.some(financeGridHasRecord_))
  openConfirmDialog('入力表を貼り付けデータで置き換え',
   '現在入力中の表を貼り付けた内容で置き換えます。未保存の内容が消えるため、コピーして控えることをおすすめします。',
   '置き換えて解析',apply);
 else apply();
}
function financeGridSetMap_(index,key){
 if(financeBulkUi.gridEdited){
  openConfirmDialog('列対応を変更','表で手修正した内容が貼り付け元データから再生成されます。続行しますか？',
    '列対応を変更',()=>{financeBulkSetMap_(index,key);financeBulkUi.gridEdited=false;});
 }else financeBulkSetMap_(index,key);
}
function financeGridImportPanel_(){
 const ui=financeBulkUi;
 if(!ui.pasteOpen)return '';
 const selectors=ui.source?'<div class="fg-map">'+ui.headers.map((h,i)=>
  '<label><span>'+escapeHtml(h||'列'+(i+1))+'</span><select aria-label="列の対応" onchange="financeGridSetMap_('+i+',this.value)"'+
   (!financeGridCanEdit_()?' disabled':'')+'>'+
   '<option value="">取り込まない</option>'+
   FINANCE_BULK_FIELDS.map(([key,label])=>'<option value="'+key+'"'+(ui.mapping[i]===key?' selected':'')+'>'+escapeHtml(label)+'</option>').join('')+
   '</select></label>').join('')+'</div>':'';
 return '<section class="card fg-import"><div class="fg-import-top"><h3>Excel・銀行明細の列を合わせて取り込む</h3>'+
  '<p>表に直接貼り付ける場合と異なる列順のときに使用します。ヘッダー行も一緒に貼り付けてください。</p></div>'+
  '<textarea aria-label="Excelやスプレッドシートの表を貼り付け" spellcheck="false" rows="5" oninput="financeBulkPaste_(this.value)"'+
  (!financeGridCanEdit_()?' readonly':'')+'>'+escapeHtml(ui.raw)+'</textarea>'+
  '<div class="fg-toolbar"><button type="button" class="primary-button" onclick="financeGridRunImport_()"'+
  (!financeGridCanEdit_()?' disabled':'')+'>列を判別して表へ反映</button>'+
  '<button type="button" class="secondary-button" onclick="financeGridToggleImport_()">閉じる</button></div>'+
  selectors+'<p class="fg-hint">解析や列の変更だけではスプレッドシートに保存されません。</p></section>';
}
function financeGridPage_(){
 financeGridEnsure_();
 const ui=financeBulkUi,stats=financeGridStats_(),start=ui.page*FINANCE_GRID_PAGE_SIZE;
 const rows=ui.rows.slice(start,start+FINANCE_GRID_PAGE_SIZE),pages=Math.max(1,Math.ceil(ui.rows.length/FINANCE_GRID_PAGE_SIZE));
 const editable=financeGridCanEdit_();
 const sel=new Set(ui.selectedRows||[]);
 const feedback=(ui.error?'<p class="finance-error" role="alert">'+escapeHtml(ui.error)+'</p>':'')+
  (ui.auditWarning?'<p class="finance-error" role="alert">'+escapeHtml(ui.auditWarning)+'</p>':'')+
  (ui.notice?'<p class="fg-notice" role="status">'+escapeHtml(ui.notice)+'</p>':'');
 const headings=FINANCE_GRID_COLUMNS.map(([key,name],i)=>'<th scope="col"><span class="fg-letter">'+String.fromCharCode(65+i)+'</span>'+
   '<span>'+escapeHtml(name)+'</span></th>').join('');
 const content=rows.map((row,i)=>{
  const index=start+i,has=financeGridHasRecord_(row),errors=has?financeBulkValidateRow_(row):[];
  const value=FINANCE_GRID_COLUMNS.map(([key,label],col)=>{
   const cell=escapeHtml(String(row[key]==null?'':row[key]));
   return '<td class="'+(key==='amount'?'fg-money':'')+'"><input type="text" autocomplete="off"'+
    ' data-fin-cell="'+index+'-'+col+'" aria-label="'+(index+1)+'行目 '+escapeHtml(label)+'" value="'+cell+'"'+
    ' oninput="financeGridCellInput_('+index+',\''+key+'\',this)"'+
    ' onblur="financeGridCellBlur_('+index+',\''+key+'\',this)"'+
    ' onpaste="financeGridPasteEvent_(event,'+index+','+col+')"'+
    ' onkeydown="financeGridNavigate_(event,'+index+','+col+')"'+
    (!editable?' readonly':'')+'></td>';
  }).join('');
  return '<tr class="'+(!has?'fg-empty':errors.length?'fg-invalid':'fg-valid')+'">'+
    '<th scope="row"><label class="fg-rowhead"><input type="checkbox" aria-label="'+(index+1)+'行目を選択"'+
     (sel.has(index)?' checked':'')+' onchange="financeGridSelect_('+index+',this.checked)"'+
     (!editable?' disabled':'')+'><span>'+(index+1)+'</span></label></th>'+value+
    '<td id="fw-bulk-error-'+index+'" data-valid="'+(!has?'empty':errors.length?'false':'true')+'">'+
     escapeHtml(!has?'空行':errors.length?errors.slice(0,2).join('・'):'確認OK')+'</td></tr>';
 }).join('');
 const pageSelect=rows.length&&rows.every((_,i)=>sel.has(start+i));
 const mapHelp='<p class="fg-hint">直接入力、Tab・Enter移動、選択セルを起点にCtrl/Cmd+Vで複数セル貼り付け。'+
  '列順が違うデータは「列対応して取り込む」を使用します。</p>';
 return '<div class="fg-screen"><header class="fg-heading"><div><span class="v15-kicker">FINANCE / SHEET ENTRY</span>'+
   '<h2>経費台帳｜表にまとめて入力</h2><p>Excel感覚で入力し、確認した行だけFM WORKS DBへ保存します。</p></div>'+
   '<div class="fg-heading-actions"><button class="secondary-button" type="button" onclick="financeWorkspaceGo_(\'ledger\')">登録済みの台帳へ</button>'+
   '<button class="secondary-button" type="button" onclick="financeGridToggleImport_()"'+(!editable?' disabled':'')+
   '>列対応して取り込む</button></div></header>'+
  (financeUi.demo?'<p class="finance-error">サンプル表示中は保存できません。実データに戻してください。</p>':'')+
  '<div class="fg-toolbar card">'+
   '<button type="button" class="secondary-button" onclick="financeGridAdd_(10)"'+(!editable?' disabled':'')+'>＋ 10行追加</button>'+
   '<button type="button" class="secondary-button" onclick="financeGridDuplicate_()"'+(!editable?' disabled':'')+'>行を複製</button>'+
   '<button type="button" class="secondary-button" onclick="financeGridDeleteSelected_()"'+(!editable?' disabled':'')+'>選択行を削除</button>'+
   '<button type="button" class="secondary-button" onclick="financeGridCopySelected_()">行をコピー</button>'+
   '<span class="fg-spacer"></span>'+
   '<button type="button" class="secondary-button" onclick="financeBulkReset_()"'+(ui.busy?' disabled':'')+'>新しい入力表</button>'+
  '</div>'+financeGridImportPanel_()+feedback+
  '<section class="fg-defaults card" aria-label="共通入力の補助"><span>同じ支払い情報を繰り返し入力する場合</span>'+
   '<label>支払者 <input id="fg-default-payer" type="text" placeholder="例：担当者名" autocomplete="off"></label>'+
   '<label>支払方法 <select id="fg-default-payment"><option value="">選択してください</option>'+
    ['法人カード','現金','口座振替','個人立替','その他'].map(x=>'<option value="'+x+'">'+x+'</option>').join('')+
   '</select></label><button type="button" class="secondary-button" onclick="financeGridApplyDefaults_()"'+(!editable?' disabled':'')+
   '>入力済み行の空欄に適用</button></section>'+
  '<section class="fg-tablewrap card"><div class="fg-tablebar"><strong>入力テーブル</strong>'+
   '<span>入力済み <b id="fg-count">'+stats.entered+'件</b></span>'+
   '<span>要修正 <b id="fg-errors">'+stats.invalid+'件</b></span>'+
   '<span>重複候補 <b id="fg-duplicates">'+stats.dupe+'件</b></span>'+
   '<span class="fg-meta" id="fg-selected">'+sel.size+'行選択</span></div>'+
   mapHelp+'<div class="fw-grid-scroll fg-scroll" role="region" aria-label="経費を表で入力" tabindex="0">'+
   '<table class="fg-grid"><thead><tr><th><input type="checkbox" aria-label="表示中の全行を選択"'+
    (pageSelect?' checked':'')+' onchange="financeGridSelectPage_(this.checked)"'+(!editable?' disabled':'')+'></th>'+
   headings+'<th>入力チェック</th></tr></thead><tbody>'+content+'</tbody></table></div>'+
   '<div class="fg-tablefooter"><button class="secondary-button" type="button" onclick="financeGridAdd_(10)"'+
   (!editable?' disabled':'')+'>＋ 10行を追加</button>'+
   '<div class="fg-pager"><button class="secondary-button" type="button" onclick="financeGridChangePage_('+(ui.page-1)+')"'+
    (ui.page<=0?' disabled':'')+'>前へ</button><span>'+(ui.page+1)+' / '+pages+' ページ</span>'+
    '<button class="secondary-button" type="button" onclick="financeGridChangePage_('+(ui.page+1)+')"'+
    (ui.page+1>=pages?' disabled':'')+'>次へ</button></div></div></section>'+
  '<footer class="fg-summary card"><div><strong>入力済み '+stats.entered+'件</strong>'+
    ' ／ 要修正 '+stats.invalid+'件 ／ 合計 <strong id="fw-bulk-total">'+stats.amount.toLocaleString('ja-JP')+'円</strong>'+
    '<small>※ 未入力の行は保存しません。重複の可能性がある行は確認後に登録します。</small></div>'+
   '<button id="fg-save" class="primary-button" type="button" onclick="financeBulkStart_()"'+
   (!editable||!stats.entered||financeUi.demo?' disabled':'')+'>'+
    (ui.busy?'保存中 '+ui.index+'/'+ui.rows.length:ui.complete?'登録を確認済み':ui.uncertain?'同じ内容で再試行':
     '確認して一括登録')+'</button></footer>'+
   '<textarea id="fw-bulk-clipboard" hidden aria-label="コピー用テキスト"></textarea></div>';
}
</script>
