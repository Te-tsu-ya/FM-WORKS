<style>
.cfb-workspace{gap:15px;max-width:100%;min-width:0}
.cfb-tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.cfb-tabs button{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:12px;font-weight:700;padding:10px 14px;cursor:pointer}
.cfb-tabs button.active{background:color-mix(in srgb,var(--blue) 12%,var(--surface));border-color:var(--blue);color:var(--text)}
.cfb-confirm{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:15px}
.cfb-confirm>div{max-width:650px}.cfb-confirm h2,.cfb-edit h3{font-size:15px;margin:0 0 6px}
.cfb-confirm p{font-size:12px;line-height:1.7;color:var(--muted);margin:0}
.cfb-confirm select,.cfb-edit select,.cfb-map select,.cfb-form select,.cfb-edit input,.cfb-form input{font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);min-height:39px;padding:8px;max-width:100%;width:100%}
.cfb-confirm select{width:auto;min-width:225px}
.cfb-bank-summary{padding:15px}.cfb-bank-summary h2{font-size:16px;margin:0 0 10px}
.cfb-bank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cfb-bank-item{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);display:grid;gap:7px;font-size:12px;line-height:1.5;min-width:0}
.cfb-bank-item strong{font-size:13px;overflow-wrap:anywhere}
.cfb-bank-item small{color:var(--muted)}
.cfb-edit{padding:15px;display:grid;gap:12px}
.cfb-form,.cfb-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;align-items:start}
.cfb-form label,.cfb-map label{display:grid;gap:5px;font-size:12px;color:var(--text);font-weight:650}
.cfb-form input[type=file]{max-width:100%;padding:8px;width:100%;min-width:0;font-size:11px}
.cfb-wide{grid-column:span 2}
.cfb-map{margin:11px 0 13px}
.cfb-map select{min-width:0}
.cfb-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cfb-workspace .cf-table td,.cfb-workspace .cf-table th{white-space:nowrap}
.cfb-workspace .cf-scroll{max-height:590px;overflow:auto}
.cfb-workspace .cf-table tbody td:nth-child(3){max-width:250px;text-overflow:ellipsis;overflow:hidden}
.cfb-workspace .cf-table thead th{z-index:2}
.cfb-workspace button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:650px){.cfb-confirm{align-items:stretch}.cfb-confirm select{width:100%}.cfb-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.cfb-tabs button{padding:9px 7px}.cfb-wide{grid-column:span 1}.cfb-bank-grid{grid-template-columns:1fr}}
</style>
