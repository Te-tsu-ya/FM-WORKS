<script>
/* Temporary financial fixtures. In sample mode no GAS write or bank/expense record is touched. */
function cfbDemoMonths_(year){
 const n=Number(year),a=[];
 for(let i=0;i<12;i++)a.push((i?n:n-1)+'-'+String(i||12).padStart(2,'0'));
 return a;
}
function cfbDemoCreate_(year){
 const months=cfbDemoMonths_(year),start=months[0],end=months[11];
 const accounts=[
  {id:'SAMPLE-A',bank:'架空銀行A',branch:'本店',name:'運転資金口座A',last4:'0001',active:true,revision:1},
  {id:'SAMPLE-B',bank:'架空信用金庫B',branch:'本店',name:'決済口座B',last4:'0002',active:true,revision:1},
  {id:'SAMPLE-C',bank:'架空ネット銀行C',branch:'普通',name:'積立準備口座C',last4:'0003',active:true,revision:1}
 ];
 const specs=[
  ['月次保守入金','IN',1200000,'SAMPLE-A','MONTHLY',start,end,25,'売上入金'],
  ['受託案件入金（架空）','IN',1800000,'SAMPLE-B','QUARTERLY',start,end,28,'売上入金'],
  ['開発案件の納品入金（架空）','IN',2500000,'SAMPLE-A','ONCE',year+'-06',year+'-06',15,'売上入金'],
  ['事務所家賃','OUT',180000,'SAMPLE-B','MONTHLY',start,end,27,'地代家賃'],
  ['給与・役員報酬','OUT',850000,'SAMPLE-A','MONTHLY',start,end,25,'人件費'],
  ['社会保険料','OUT',165000,'SAMPLE-B','MONTHLY',start,end,28,'社会保険'],
  ['クラウド・通信費','OUT',72000,'SAMPLE-C','MONTHLY',start,end,26,'通信費'],
  ['車両リース','OUT',98000,'SAMPLE-B','MONTHLY',start,end,5,'車両費'],
  ['借入返済（元金）','OUT',220000,'SAMPLE-A','MONTHLY',start,end,20,'借入返済'],
  ['借入利息','OUT',22000,'SAMPLE-A','MONTHLY',start,end,20,'支払利息'],
  ['事業税等（架空）','OUT',400000,'SAMPLE-B','QUARTERLY',year+'-02',end,10,'税金'],
  ['システム設備更新（架空）','OUT',900000,'SAMPLE-C','ONCE',year+'-05',year+'-05',20,'設備投資']
 ];
 const plans=specs.map((v,i)=>({id:'SAMPLE-PLAN-'+(i+1),title:v[0],direction:v[1],amount:v[2],accountId:v[3],
  frequency:v[4],startMonth:v[5],endMonth:v[6],day:v[7],category:v[8],active:true,note:'架空の金額です',revision:1}));
 const dated=(month,day)=>month+'-'+String(day).padStart(2,'0');
 const sample=[
  ['SAMPLE-A',dated(start,20),0,220000,'借入返済（架空）',2980000],
  ['SAMPLE-A',dated(start,25),1200000,0,'保守代金入金（架空）',4180000],
  ['SAMPLE-A',dated(start,25),0,850000,'給与支払（架空）',3330000],
  ['SAMPLE-B',dated(start,27),0,180000,'事務所家賃（架空）',2220000],
  ['SAMPLE-B',dated(start,28),1800000,0,'受託案件入金（架空）',4020000],
  ['SAMPLE-C',dated(start,26),0,72000,'クラウド利用料（架空）',828000],
  ['SAMPLE-A',dated(months[1],25),1200000,0,'保守入金（架空）',4530000],
  ['SAMPLE-A',dated(months[1],25),0,850000,'給与支払（架空）',3680000],
  ['SAMPLE-B',dated(months[1],27),0,180000,'家賃支払（架空）',3840000],
  ['SAMPLE-C',dated(months[1],26),0,72000,'通信・クラウド費（架空）',756000],
  ['SAMPLE-A',dated(months[2],25),1200000,0,'保守入金（架空）',4880000],
  ['SAMPLE-A',dated(months[2],28),0,150000,'社内振替（出金・架空）',4730000,true],
  ['SAMPLE-B',dated(months[2],28),150000,0,'社内振替（入金・架空）',3990000,true],
  ['SAMPLE-C',dated(months[2],26),0,72000,'通信費（架空）',684000]
 ];
 const transactions=sample.map((v,i)=>({id:'SAMPLE-TX-'+(i+1),accountId:v[0],date:v[1],incoming:v[2],outgoing:v[3],
  description:v[4],balance:v[5],transfer:!!v[6],revision:1,occurrence:1,externalId:'SAMPLE-REF-'+(i+1)}));
 const fixture={ok:true,year,setupRequired:false,accounts,plans,transactions:[],monthly:[],bankSummaries:[],
  closing:{through:'',revision:0},importedCount:0};
 const annualMonths=months.map(month=>({month,planIn:null,planOut:null,actualIn:null,actualOut:null,note:''}));
 const yearly={ok:true,setupRequired:false,fiscalYear:year,record:{openingBalance:6500000,revision:0,exists:false,updatedAt:'',months:annualMonths},
  availableYears:[year],summary:null};
 return {fixture,yearly,transactions};
}
function cfbDemoPlanApplies_(plan,month){
 if(!plan.active||month<plan.startMonth||(plan.endMonth&&month>plan.endMonth))return false;
 const m=Number(month.slice(0,4))*12+Number(month.slice(5)),s=Number(plan.startMonth.slice(0,4))*12+Number(plan.startMonth.slice(5));
 const diff=m-s;
 return diff>=0&&(plan.frequency==='MONTHLY'||plan.frequency==='ONCE'&&diff===0||
  plan.frequency==='QUARTERLY'&&diff%3===0||plan.frequency==='YEARLY'&&diff%12===0);
}
function cfbDemoRebuild_(){
 if(!cfbUi.demo||!cfbUi.loaded)return;
 const data=cfbUi.loaded,months=cfbDemoMonths_(cashFlowUi.year),summaries=new Map(data.accounts.map(a=>[a.id,
  {accountId:a.id,bank:a.bank,name:a.name,incoming:0,outgoing:0,importedCount:0,latestBalance:null,latestDate:''}]));
 const calendar=new Map(months.map(m=>[m,{month:m,scheduledIn:0,scheduledOut:0,actualIn:0,actualOut:0,
  transferIn:0,transferOut:0,importedCount:0,scheduledCount:0}]));
 data.plans.forEach(p=>months.forEach(m=>{
  if(!cfbDemoPlanApplies_(p,m))return;
  const item=calendar.get(m);item[p.direction==='IN'?'scheduledIn':'scheduledOut']+=Number(p.amount);
  item.scheduledCount++;
 }));
 const all=cfbUi.demoTransactions||[];
 all.forEach(tx=>{
  const item=calendar.get(tx.date.slice(0,7)),bank=summaries.get(tx.accountId);
  if(!item||!bank)return;
  item.importedCount++;bank.importedCount++;
  if(tx.transfer){item.transferIn+=tx.incoming;item.transferOut+=tx.outgoing;}
  else{item.actualIn+=tx.incoming;item.actualOut+=tx.outgoing;bank.incoming+=tx.incoming;bank.outgoing+=tx.outgoing;}
  if(tx.balance!=null&&(!bank.latestDate||tx.date>=bank.latestDate)){
   bank.latestDate=tx.date;bank.latestBalance=tx.balance;
  }
 });
 data.monthly=months.map(x=>calendar.get(x));data.bankSummaries=[...summaries.values()];
 data.transactions=all.filter(tx=>calendar.has(tx.date.slice(0,7))).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,120);
 data.importedCount=data.transactions.length;
}
function cfbDemoActivate_(fiscalYear){
 if(!cashFlowAllowed_())return;
 const year=Number(fiscalYear),data=cfbDemoCreate_(year);
 cashFlowUi.open=true;cashFlowUi.year=year;cashFlowUi.loading=false;cashFlowUi.busy=false;cashFlowUi.dirty=false;
 cashFlowUi.data=data.yearly;
 cashFlowUi.draft={openingBalance:data.yearly.record.openingBalance,revision:0,months:data.yearly.record.months.map(m=>({...m}))};
 cashFlowUi.seq++;
 cfbReset_();cfbUi.demo=true;cfbUi.active=true;cfbUi.year=year;cfbUi.loaded=data.fixture;cfbUi.demoTransactions=data.transactions;
 cfbUi.notice='架空データを表示中です。変更しても本番データには保存されません。';
 cfbDemoRebuild_();renderPageIfActive('finance');
}
function cashFlowOpenDemo_(){
 if(!cashFlowAllowed_())return;
 financeUi.insightMode=false;
 cfbDemoActivate_(cashFlowThisYear_());
}
function cfbDemoExit_(){
 if(!cfbUi.demo||!cashFlowAllowed_())return;
 cfbReset_();cashFlowUi.data=null;cashFlowUi.draft=null;cashFlowUi.dirty=false;cashFlowUi.loading=false;cashFlowUi.seq++;
 cashFlowLoad_(true);cfbLoad_(true);renderPageIfActive('finance');
}
function cfbDemoAccountSave_(form){
 const bank=String(form.bank||'').trim(),name=String(form.name||'').trim();
 if(!bank||!name){cfbUi.error='金融機関名と口座表示名を入力してください。';renderPageIfActive('finance');return;}
 const existing=cfbUi.loaded.accounts.find(x=>x.id===form.id);
 const account={...form,id:existing?existing.id:'SAMPLE-A'+(cfbUi.loaded.accounts.length+1),bank,name,
  active:form.active!==false&&form.active!=='false',revision:existing?existing.revision+1:1};
 if(existing)Object.assign(existing,account);else cfbUi.loaded.accounts.push(account);
 cfbUi.accountForm=null;cfbUi.notice='架空口座を画面内で更新しました（本番DBへの保存なし）。';
 cfbDemoRebuild_();renderPageIfActive('finance');
}
function cfbDemoPlanSave_(form){
 const value=Number(form.amount),day=Number(form.day);
 if(!String(form.title||'').trim()||!Number.isSafeInteger(value)||value<0||value>999999999999||
  !['IN','OUT'].includes(form.direction)||!['ONCE','MONTHLY','QUARTERLY','YEARLY'].includes(form.frequency)||
  !/^\d{4}-(0[1-9]|1[0-2])$/.test(String(form.startMonth||''))||
  form.endMonth&&(!/^\d{4}-(0[1-9]|1[0-2])$/.test(String(form.endMonth))||form.endMonth<form.startMonth)||
  !Number.isInteger(day)||day<1||day>31){cfbUi.error='予定名・金額・期間・予定日を確認してください。';renderPageIfActive('finance');return;}
 const existing=cfbUi.loaded.plans.find(x=>x.id===form.id);
 const item={...form,id:existing?existing.id:'SAMPLE-P'+(cfbUi.loaded.plans.length+1),amount:value,day,
  active:form.active!==false&&form.active!=='false',revision:existing?existing.revision+1:1};
 if(existing)Object.assign(existing,item);else cfbUi.loaded.plans.push(item);
 cfbUi.planForm=null;cfbUi.error='';cfbUi.notice='架空の入出金予定を再計算しました（本番DBへの保存なし）。';
 cfbDemoRebuild_();renderPageIfActive('finance');
}
function cfbDemoImport_(){
 const ui=cfbUi,rows=ui.preview||[],account=ui.csvAccountId;
 if(!ui.demo||!rows.length||!ui.loaded.accounts.some(x=>x.id===account))return;
 const same=tx=>JSON.stringify([tx.accountId,tx.date,tx.incoming,tx.outgoing,tx.description,tx.balance,tx.externalId,tx.occurrence]);
 const known=new Set(ui.demoTransactions.map(same));let added=0,skipped=0;
 rows.forEach(row=>{
  const tx={...row,accountId:account};const key=same(tx);
  if(known.has(key)){skipped++;return;}
  known.add(key);ui.demoTransactions.push({...tx,id:'SAMPLE-IMPORT-'+(ui.demoTransactions.length+1),revision:1});added++;
 });
 ui.importAdded=added;ui.importSkipped=skipped;ui.preview=null;ui.csvRows=null;ui.csvMap=null;
 ui.notice='画面内で架空明細'+added+'件を追加（重複'+skipped+'件）。本番DBへの書込みはありません。';
 cfbDemoRebuild_();renderPageIfActive('finance');
}
function cfbDemoTransfer_(id,value){
 const tx=cfbUi.demoTransactions.find(x=>x.id===id);
 if(!tx)return;
 tx.transfer=!!value;tx.revision++;
 cfbDemoRebuild_();cfbUi.notice='架空明細の振替区分を変更しました。';renderPageIfActive('finance');
}
function cfbDemoSaveYear_(){
 if(!cfbUi.demo||!cashFlowUi.draft)return;
 const d=cashFlowUi.draft;
 if(cashFlowInt_(d.openingBalance,true)===null){cashFlowUi.error='期首残高を入力してください。';renderPageIfActive('finance');return;}
 const months=d.months.map(row=>({...row}));
 cashFlowUi.data.record={...cashFlowUi.data.record,openingBalance:Number(d.openingBalance),months,revision:cashFlowUi.data.record.revision+1,exists:true};
 d.revision=cashFlowUi.data.record.revision;cashFlowUi.dirty=false;cashFlowUi.error='';
 cashFlowUi.notice='架空の手入力金額を画面内で保存しました。本番DBは未変更です。';renderPageIfActive('finance');
}
function cfbDemoBanner_(){
 return '<section class="card cfb-demo-banner" role="status"><strong>サンプル表示中｜金額・銀行・明細はすべて架空</strong>'+
  '<span>画面内で口座・予定・銀行明細を試せます。更新・ログアウトで消え、本番のスプレッドシートには保存されません。</span>'+
  '<button type="button" class="secondary-button" onclick="cfbDemoExit_()">実データの画面に切り替える</button></section>';
}
function cfbParseBankPaste_(text){
 const raw=String(text||'').replace(/^\ufeff/,'').trim();
 if(raw.length>150000)throw Error('テキストが大きすぎます。15万文字以下に分けてください。');
 if(!raw)throw Error('銀行画面の表をコピーして貼り付けてください。');
 let records;
 if(raw.includes('\t'))records=raw.split(/\r\n|\r|\n/).filter(Boolean).map(row=>row.split('\t').map(x=>x.trim()));
 else if(/\s{2,}/.test(raw))records=raw.split(/\r\n|\r|\n/).filter(Boolean).map(row=>row.trim().split(/[\u3000 ]{2,}/));
 else records=cfbParseCSV_(raw);
 if(records.length>3001)throw Error('1回の入力は3000行以下にしてください。');
 if(records.length<1||records.some(row=>row.length>80))throw Error('行・列の数を確認してください。');
 const head=records[0];
 const date=/^(?:\d{4}[\/-]\d{1,2}[\/-]\d{1,2}|\d{8})$/;
 if(head.length===5&&date.test(String(head[0]).trim()))records.unshift(['取引日','摘要','出金額','入金額','残高']);
 if(records.length<2)throw Error('見出しと明細行を貼り付けてください。');
 return records;
}
function cfbPasteSample_(){
 cfbUi.pasteText='取引日\t摘要\t出金額\t入金額\t残高\n'+
  cashFlowUi.year+'-02-25\t架空の業務入金\t\t120000\t1450000\n'+
  cashFlowUi.year+'-02-26\t架空の通信費\t7500\t\t1442500';
 renderPageIfActive('finance');
}
function cfbPasteText_(value){cfbUi.pasteText=String(value||'');}
function cfbPastePreview_(){
 try{
  cfbUi.csvRows=cfbParseBankPaste_(cfbUi.pasteText);
  cfbUi.csvName='Web画面コピー';cfbUi.csvMap=cfbGuessCSV_(cfbUi.csvRows[0]);
  cfbUi.csvAccountId=cfbUi.csvAccountId||cfbUi.loaded.accounts[0]&&cfbUi.loaded.accounts[0].id||'';
  cfbUi.error='';cfbPreviewCSV_();
 }catch(err){cfbUi.preview=null;cfbUi.error=String(err&&err.message||err);renderPageIfActive('finance');}
}
function cfbPastePanel_(){
 return '<section class="card cf-table-card cfb-paste-panel"><h2>銀行Webページから貼り付ける</h2><p>銀行画面の取引表を選択→コピー→下の欄に貼り付け。区切りはタブ、2文字以上の空白、またはCSVに対応します。銀行ごとに列順を確認できます。</p>'+
  '<textarea rows="5" spellcheck="false" aria-label="銀行のWeb明細を貼り付ける" placeholder="取引日　摘要　出金額　入金額　残高" oninput="cfbPasteText_(this.value)">'+cfbEscape_(cfbUi.pasteText||'')+'</textarea>'+
  '<div class="cfb-actions"><button type="button" class="secondary-button" onclick="cfbPasteSample_()">架空の貼り付け例を入れる</button>'+
  '<button type="button" class="primary-button" onclick="cfbPastePreview_()">内容を解析して確認する</button></div>'+
  '<p class="cf-note">取込前に金額と列対応を確認してください。解析だけではスプレッドシートに保存されません。</p></section>';
}
</script>
