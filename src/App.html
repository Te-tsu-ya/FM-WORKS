<script>
const NAV = [['home','ホーム','i-home'],['attendance','勤怠','i-clock'],['worklog','工数','i-chart'],['schedule','予定表','i-calendar'],['companyCalendar','会社カレンダー','i-calendar'],['requests','申請','i-file'],['people','社員','i-users'],['monthly','月次','i-trend'],['admin','管理','i-gear']];
const MOBILE_NAV = ['home','attendance','schedule','worklog','admin'];
const CATEGORY_COLORS={予定:'#1478ff',仮予定:'#f3a11b',業務:'#7b61ff',出張:'#00a58a',休暇:'#ef4d5b',社内:'#64748b'};
let state={page:'home',data:null,publicConfig:null,sessionToken:null,workLocation:'出社',busy:false,authAdmin:null,maintenance:{status:null,audit:[],loading:false},worklog:{date:null,items:[],totalMinutes:0,loading:false},requests:{own:[],team:[],context:null,loading:false},monthly:{yearMonth:null,employeeId:null,data:null,loading:false},schedule:{date:null,view:'month',employeeId:'ALL',category:'ALL',events:[],companyDays:[],employees:[],loading:false},company:{year:null,availableYears:[],nextCreatableYear:null,days:[],workdays:0,daysOff:0,adjustedWorkdays:0,companyHolidays:0,loading:false}};
const PAGE_CACHE_TTL={worklog:90000,schedule:90000,company:300000,requests:90000,monthly:120000,authAdmin:120000,maintenance:60000};
const pageCache={};
const pendingLoads=new Set();
function cacheHas(name,key){const e=pageCache[name];return !!(e&&e.key===String(key))}
function cacheFresh(name,key){const e=pageCache[name];return !!(e&&e.key===String(key)&&(Date.now()-e.at)<(PAGE_CACHE_TTL[name]||60000))}
function markPageCache(name,key){pageCache[name]={key:String(key),at:Date.now()}}
function invalidatePageCache(...names){names.forEach(name=>delete pageCache[name])}
function beginPageLoad(name,key){const ticket=name+':'+String(key);if(pendingLoads.has(ticket))return null;pendingLoads.add(ticket);return ticket}
function endPageLoad(ticket){if(ticket)pendingLoads.delete(ticket)}
function renderPageIfActive(page){if(state.page===page)renderPage()}
function worklogCacheKey(){return state.worklog.date||state.data&&state.data.today||''}
function scheduleCacheKey(){if(!state.schedule.date)return '';const r=scheduleRange();return [state.schedule.view,r.start,r.end,state.schedule.employeeId,state.schedule.category].join('|')}
function companyCacheKey(){return String(state.company.year||state.data&&parseIso(state.data.today).getFullYear()||'')}
function monthlyCacheKey(){return [state.monthly.yearMonth||state.data&&state.data.today.slice(0,7)||'',state.monthly.employeeId||state.data&&state.data.user.employeeId||''].join('|')}
function scheduleIdleTask(fn,delay){setTimeout(()=>{if('requestIdleCallback' in window)requestIdleCallback(fn,{timeout:1200});else fn()},delay)}
function startMenuPrefetch(){
  if(!state.data||!state.sessionToken)return;
  scheduleIdleTask(()=>loadSchedule({silent:true}),120);
  scheduleIdleTask(()=>loadWorklogs({silent:true}),300);
  scheduleIdleTask(()=>loadRequests({silent:true}),520);
  scheduleIdleTask(()=>loadMonthly({silent:true}),820);
  scheduleIdleTask(()=>loadCompanyCalendar(undefined,{silent:true}),1150);
  if(state.data.permissions&&state.data.permissions.adminConsole){
    scheduleIdleTask(()=>loadAuthAdmin({silent:true}),1500);
  }
}

function svg(id){return `<svg aria-hidden='true'><use href='#${id}'/></svg>`}
function escapeHtml(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function card(title,body,cls=''){return `<section class='card ${cls}'><h3>${title}</h3>${body}</section>`}
function metric(label,value,iconTone=''){return `<section class='card metric'><div><small class='muted'>${label}</small><div><strong>${value}</strong></div></div><div class='metric-icon ${iconTone}'>●</div></section>`}
function list(items){return `<div class='list'>${items.map(i=>`<div class='list-item'><span class='status-dot' style='background:${i.color||'var(--blue)'}'></span><div><strong>${i.title}</strong><div class='muted' style='font-size:12px;margin-top:3px'>${i.sub||''}</div></div>${i.right||''}</div>`).join('')}</div>`}
function pageHead(title,desc,action=''){return `<div class='page-head'><div><div class='eyebrow'>FM WORKS</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function pad(n){return String(n).padStart(2,'0')}
function parseIso(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(s,n){const d=parseIso(s);d.setDate(d.getDate()+n);return iso(d)}
function addMonths(s,n){const d=parseIso(s);d.setDate(1);d.setMonth(d.getMonth()+n);return iso(d)}
function startOfWeek(s){const d=parseIso(s);d.setDate(d.getDate()-d.getDay());return iso(d)}
function endOfWeek(s){return addDays(startOfWeek(s),6)}
function monthGridRange(s){const d=parseIso(s);const first=new Date(d.getFullYear(),d.getMonth(),1);const last=new Date(d.getFullYear(),d.getMonth()+1,0);first.setDate(first.getDate()-first.getDay());last.setDate(last.getDate()+(6-last.getDay()));return {start:iso(first),end:iso(last)}}
function fmtDate(s){const d=parseIso(s);return `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`}
function fmtMonth(s){const d=parseIso(s);return `${d.getFullYear()}年 ${d.getMonth()+1}月`}
function isToday(s){return state.data&&s===state.data.today}
function categoryColor(c){return CATEGORY_COLORS[c]||'#64748b'}
const PERSON_COLORS=[
  {line:'#2563eb',bg:'#eff6ff',text:'#1d4ed8'},
  {line:'#7c3aed',bg:'#f5f3ff',text:'#6d28d9'},
  {line:'#059669',bg:'#ecfdf5',text:'#047857'},
  {line:'#db2777',bg:'#fdf2f8',text:'#be185d'},
  {line:'#d97706',bg:'#fffbeb',text:'#b45309'},
  {line:'#0891b2',bg:'#ecfeff',text:'#0e7490'},
  {line:'#4f46e5',bg:'#eef2ff',text:'#4338ca'},
  {line:'#dc2626',bg:'#fef2f2',text:'#b91c1c'}
];
function personColor(key){
  const s=String(key||'unknown');let hash=0;
  for(let i=0;i<s.length;i++)hash=((hash<<5)-hash+s.charCodeAt(i))|0;
  return PERSON_COLORS[Math.abs(hash)%PERSON_COLORS.length];
}
function shortPersonName(name){return String(name||'').trim().replace(/さん$/,'').split(/\s+/).filter(Boolean)[0]||'未設定'}
function eventPeople(e){
  const employees=state.schedule.employees.length?state.schedule.employees:(state.data&&state.data.employees||[]);
  const byId=Object.fromEntries(employees.map(x=>[x.employeeId,x]));
  const ids=e.employeeIds||[],names=e.employeeNames||[];
  if(ids.length)return ids.map((id,i)=>({id,name:(byId[id]&&byId[id].name)||names[i]||id}));
  return names.map((name,i)=>({id:'name:'+name+':'+i,name}));
}
function eventPeopleLabel(e){
  const people=eventPeople(e);if(!people.length)return '参加者未設定';
  const labels=people.slice(0,2).map(p=>shortPersonName(p.name));
  return labels.join('・')+(people.length>2?' +'+(people.length-2):'');
}
function eventPersonAvatar(e){
  const people=eventPeople(e);const p=people[0]||{id:'unknown',name:'?'},color=personColor(p.id);
  return `<span class='person-avatar' style='--person-bg:${color.bg};--person-text:${color.text}' aria-hidden='true'>${escapeHtml(shortPersonName(p.name).slice(0,1))}</span>`;
}
function schedulePeopleLegend(){
  const s=state.schedule,employees=s.employees.length?s.employees:(state.data&&state.data.employees||[]);
  const visible=s.employeeId==='ALL'?employees:employees.filter(e=>e.employeeId===s.employeeId);
  if(!visible.length)return '';
  return `<div class='people-legend'><span class='people-legend-label'>社員</span>${visible.map(e=>{const color=personColor(e.employeeId);return `<span class='person-chip' style='--person-color:${color.line};--person-bg:${color.bg};--person-text:${color.text}'><i></i><b>${escapeHtml(shortPersonName(e.name))}</b></span>`}).join('')}</div>`;
}
function roleLabel(role){return ({ADMIN:'管理者',CALENDAR_EDITOR:'会社カレンダー編集者',USER:'社員'})[role]||role||'社員'}
function clientInfo(){return [navigator.platform||'',navigator.userAgent||''].join(' | ').slice(0,240)}
function sessionErrorMessage(err){return String(err&&err.message||err||'')}
function cleanApiErrorMessage(err,fallback){
  let msg=sessionErrorMessage(err).trim();
  msg=msg.replace(/^(Exception|Error):\s*/,'').trim();
  return msg||fallback||'処理に失敗しました。';
}
function handleApiError(err,fallback){
  const raw=sessionErrorMessage(err);
  if(raw.includes('AUTH_REQUIRED')||raw.includes('SESSION_EXPIRED')){
    clearLocalSession();
    showLogin('セッションの有効期限が切れました。もう一度ログインしてください。');
    return true;
  }
  showToast(cleanApiErrorMessage(err,fallback));
  return false;
}
function setSessionToken(token,persistent=false){
  state.sessionToken=token||null;
  sessionStorage.removeItem('fmworks.session');
  localStorage.removeItem('fmworks.session');
  if(token){
    (persistent?localStorage:sessionStorage).setItem('fmworks.session',token);
  }
}
function getStoredSessionToken(){return localStorage.getItem('fmworks.session')||sessionStorage.getItem('fmworks.session')||null}
function clearLocalSession(){setSessionToken(null);state.data=null;state.authAdmin=null}
function svgLogo(cls=''){return `<svg class="fm-logo ${cls}" viewBox="0 0 588 587" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M 459 320 L 435 346 L 486 394 L 510 370 L 461 320 Z M 130 318 L 79 370 L 170 460 L 170 358 Z M 406 211 L 214 211 L 214 508 L 291 586 L 452 425 L 404 378 L 279 503 L 277 501 L 277 387 L 279 385 L 334 385 L 399 320 L 280 320 L 278 318 L 277 303 L 278 275 L 280 273 L 406 273 Z M 457 163 L 457 255 L 542 339 L 587 294 L 587 292 Z M 370 112 L 363 116 L 352 130 L 349 144 L 351 156 L 358 168 L 373 178 L 390 179 L 400 176 L 411 167 L 416 158 L 418 151 L 418 138 L 416 131 L 411 123 L 399 113 L 390 110 L 377 110 Z M 364 5 L 413 52 L 504 51 L 506 53 L 507 147 L 554 194 L 554 5 Z M 293 0 L 0 293 L 45 338 L 291 93 L 312 112 L 359 66 Z"/></svg>`}


function selectWorkLocation(location){if(!['出社','在宅','外出'].includes(location))return;state.workLocation=location;renderPage()}
function performPunch(action){
  if(state.busy)return;
  state.busy=true;showToast(`${action}を登録しています...`);
  google.script.run.withSuccessHandler(data=>{
    if(data&&data.attendance){
      state.data.attendance=data.attendance;
      state.workLocation=data.attendance.workLocation||state.workLocation;
    }
    state.busy=false;
    invalidatePageCache('worklog','monthly');
    renderPage();
    showToast(`${action}をGoogle Sheetsへ保存しました`);
    scheduleIdleTask(()=>refreshAppData(),700);
  }).withFailureHandler(err=>{
    state.busy=false;
    if(!handleApiError(err,'打刻の登録に失敗しました'))renderPage();
  }).recordPunch(state.sessionToken,action,state.workLocation);
}
function workLocationSelector(){return `<div class='section-gap'><small class='muted'>勤務場所</small><div class='button-row' style='margin-top:8px'>${['出社','在宅','外出'].map(x=>`<button class='${state.workLocation===x?'primary-button':'secondary-button'}' onclick="selectWorkLocation('${x}')">${x}</button>`).join('')}</div></div>`}
function punchButtons(a){if(a.state==='off')return `<button class='primary-button' onclick="performPunch('出勤')">出勤する</button>`;if(a.state==='working')return `<button class='secondary-button' onclick="performPunch('休憩開始')">休憩する</button><button class='primary-button' onclick="performPunch('退勤')">退勤する</button>`;if(a.state==='break')return `<button class='primary-button' onclick="performPunch('休憩終了')">休憩終了</button>`;return `<button class='secondary-button' disabled>本日の勤務は終了しました</button>`}

function visibleNav(){
  const p=state.data&&state.data.permissions||{};
  return NAV.filter(([id])=>id!=='admin'||p.adminConsole);
}
function renderNav(){
  const nav=visibleNav();
  document.getElementById('desktopNav').innerHTML=nav.map(([id,label,icon])=>`<button class='nav-button ${state.page===id?'active':''}' data-route='${id}'>${svg(icon)}<span>${label}</span></button>`).join('');
  const allowedIds=new Set(nav.map(x=>x[0]));
  const mobileIds=MOBILE_NAV.filter(id=>allowedIds.has(id));
  const mobile=document.getElementById('mobileNav');
  mobile.innerHTML=mobileIds.map(id=>{const n=NAV.find(x=>x[0]===id);return `<button class='mobile-tab ${state.page===id?'active':''}' data-route='${id}'>${svg(n[2])}<span>${n[1]}</span></button>`}).join('');
  mobile.style.gridTemplateColumns=`repeat(${Math.max(1,mobileIds.length)},1fr)`;
  document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>navigate(b.dataset.route));
}
function navigate(page){
  closeMobileDrawer();
  if(page==='admin'&&!(state.data&&state.data.permissions&&state.data.permissions.adminConsole)){page='home'}
  state.page=page;history.replaceState(null,'',`#${page}`);renderNav();renderPage();window.scrollTo({top:0,behavior:'auto'});
  if(page==='schedule')loadSchedule();
  if(page==='companyCalendar')loadCompanyCalendar();
  if(page==='worklog')loadWorklogs();
  if(page==='requests')loadRequests();
  if(page==='monthly')loadMonthly();
  if(page==='people'&&state.data&&state.data.permissions&&state.data.permissions.adminConsole)loadAuthAdmin();
  if(page==='admin'&&state.data&&state.data.permissions&&state.data.permissions.adminConsole)loadAuthAdmin({withMaintenance:true});
}

function homePage(){const d=state.data,a=d.attendance;const sched=(d.todaySchedule||[]);const company=d.companyToday;return `${pageHead('ホーム','今日の勤務・予定・やることをまとめて確認します。')}<div class='hero'><div class='live-chip'>● 実データ接続済み</div><h2>おはようございます、${escapeHtml(d.user.displayName)}</h2><p>${company?`${escapeHtml(company.type)}${company.name?' / '+escapeHtml(company.name):''}`:'会社カレンダー未登録'} ・ ${fmtDate(d.today)}</p></div><div class='grid cols-3'>${card('現在の勤怠状況',`<div class='status-row'><span class='status-dot' style='background:${a.state==='off'||a.state==='finished'?'#8090a8':a.state==='break'?'#f3a11b':'#18a46d'}'></span><strong>${a.stateLabel}</strong></div><div class='attendance-time'>${a.clockIn?a.clockIn+' 出勤':'未出勤'}</div><p class='muted'>実働 ${a.worked} / ${a.workLocation}</p><div class='button-row'>${punchButtons(a)}</div>${workLocationSelector()}`)}${card('今日の予定',sched.length?list(sched.map(e=>({title:`${e.allDay?'終日':e.start||'--:--'} ${escapeHtml(e.title)}`,sub:`${escapeHtml(e.employeeNames.join('、'))}${e.location?' / '+escapeHtml(e.location):''}`,color:categoryColor(e.category)}))):`<p class='muted'>今日の予定はありません。</p><button class='secondary-button' onclick="navigate('schedule')">予定表を開く</button>`)}${card('やること',d.tasks.map(x=>`<div class='list-item'><span></span><strong>${x.label}</strong><span class='badge ${x.tone==='danger'?'danger':x.tone==='warning'?'warning':''}'>${x.status}</span></div>`).join(''))}</div><div class='grid cols-3 section-gap'>${metric('勤務時間',d.month.workHours,'tone-green')}${metric('残業時間',d.month.overtime,'')}${metric('有給残',d.month.leaveBalance,'tone-orange')}</div><div class='grid cols-2 section-gap'>${card('今日の打刻履歴',a.history.length?list(a.history.map(x=>({title:`${x.time} ${x.action}`,sub:x.workLocation,color:x.action==='退勤'?'#8090a8':x.action.includes('休憩')?'#f3a11b':'#1478ff'}))):'<p class=\'muted\'>本日の打刻はまだありません。</p>')}${card('共有予定表',`<p class='muted'>旧予定表をFM WORKSへ移行済み。月・週・日・一覧で確認できます。</p><button class='primary-button' onclick="navigate('schedule')">予定表を開く</button>`)}</div>`}

function attendancePage(){const d=state.data,a=d.attendance;return `${pageHead('勤怠','出退勤、休憩、勤務場所、打刻履歴を管理します。')}<div class='grid cols-2'>${card('現在の勤務状況',`<div class='status-row'><span class='status-dot' style='background:${a.state==='off'||a.state==='finished'?'#8090a8':a.state==='break'?'#f3a11b':'#18a46d'}'></span><strong>${a.stateLabel}</strong></div><div class='attendance-time'>${a.clockIn?a.clockIn+' に出勤':'まだ出勤していません'}</div><p class='muted'>現在の実働：${a.worked}</p><div class='button-row'>${punchButtons(a)}</div>${workLocationSelector()}`)}${card('本日の打刻状況',a.history.length?list(a.history.map(x=>({title:`${x.time} ${x.action}`,sub:x.workLocation,color:x.action==='退勤'?'#8090a8':x.action.includes('休憩')?'#f3a11b':'#1478ff'}))):'<p class=\'muted\'>まだ打刻はありません。</p>')}</div><div class='grid cols-4 section-gap'>${metric('本日の実働',a.worked,'tone-green')}${metric('出勤時刻',a.clockIn||'--:--')}${metric('退勤時刻',a.clockOut||'--:--','tone-orange')}${metric('保存先','Google Sheets','tone-purple')}</div>`}


function formatMinutesClient(minutes){var m=Math.max(0,Number(minutes||0));return Math.floor(m/60)+'時間'+String(m%60).padStart(2,'0')+'分';}
function loadWorklogs(options={}){
  if(!state.worklog.date)state.worklog.date=state.data.today;
  const key=worklogCacheKey();
  if(!options.force&&cacheFresh('worklog',key))return;
  const ticket=beginPageLoad('worklog',key);if(!ticket)return;
  const hasCurrent=cacheHas('worklog',key);
  state.worklog.loading=!hasCurrent;
  if(!options.silent)renderPageIfActive('worklog');
  google.script.run.withSuccessHandler(function(data){
    endPageLoad(ticket);
    if(worklogCacheKey()!==key)return;
    state.worklog.items=data.items||[];
    state.worklog.totalMinutes=data.totalMinutes||0;
    state.worklog.loading=false;
    markPageCache('worklog',key);
    renderPageIfActive('worklog');
  }).withFailureHandler(function(err){
    endPageLoad(ticket);state.worklog.loading=false;
    if(!handleApiError(err,'工数を読み込めませんでした')&&!options.silent)renderPageIfActive('worklog');
  }).getWorklogs(state.sessionToken,{start:state.worklog.date,end:state.worklog.date});
}
function moveWorklogDate(n){state.worklog.date=addDays(state.worklog.date||state.data.today,n);loadWorklogs();}
function worklogPage(){var w=state.worklog,date=w.date||state.data.today,attendance=state.data.attendance,attendanceMinutes=date===state.data.today?Number(attendance.workedMinutes||0):0,unentered=Math.max(0,attendanceMinutes-Number(w.totalMinutes||0)),projects=[...new Set((w.items||[]).map(function(x){return x.project;}))].length;var rows=(w.items||[]).map(function(x){return '<div class="list-item"><span class="status-dot" style="background:#1478ff"></span><div><strong>'+escapeHtml(x.project)+'　'+formatMinutesClient(x.minutes)+'</strong><div class="muted" style="font-size:12px;margin-top:3px">'+escapeHtml(x.start)+'-'+escapeHtml(x.end)+' / '+escapeHtml(x.category||'未分類')+' / '+escapeHtml(x.description)+'</div></div><div class="admin-actions"><button class="small-button" onclick="openWorklogModal(\''+x.id+'\')">編集</button><button class="small-button" onclick="deleteWorklogItem(\''+x.id+'\')">削除</button></div></div>';}).join('');var action='<button class="primary-button" onclick="openWorklogModal()">＋ 工数追加</button>';var toolbar='<div class="schedule-toolbar"><div class="toolbar-group"><button class="secondary-button compact" onclick="moveWorklogDate(-1)">‹</button><button class="secondary-button compact" onclick="state.worklog.date=state.data.today;loadWorklogs()">今日</button><button class="secondary-button compact" onclick="moveWorklogDate(1)">›</button><strong class="period-label">'+fmtDate(date)+'</strong></div></div>';if(w.loading&&!cacheHas('worklog',worklogCacheKey()))return pageHead('工数','勤務時間に対して、どの業務に何時間使ったかを記録します。',action)+toolbar+'<div class="loading-card"></div>';return pageHead('工数','勤務時間に対して、どの業務に何時間使ったかを記録します。',action)+toolbar+'<div class="grid cols-4">'+metric('入力済工数',formatMinutesClient(w.totalMinutes),'tone-green')+metric('本日の実働',date===state.data.today?attendance.worked:'—')+metric('未入力時間',date===state.data.today?formatMinutesClient(unentered):'—','tone-orange')+metric('プロジェクト数',projects+'件','tone-purple')+'</div><div class="grid cols-2 section-gap">'+card('工数一覧',rows||'<p class="muted">この日の工数はまだありません。</p>')+card('入力ルール','<p class="muted">プロジェクト・作業分類・開始/終了・作業内容を記録します。保存内容は「FM WORKS DB / 工数」に反映され、月次集計へ自動で利用されます。</p><div class="progress"><span style="width:'+(attendanceMinutes?Math.min(100,Math.round(w.totalMinutes/attendanceMinutes*100)):0)+'%"></span></div>')+'</div>';}
function openWorklogModal(id){
  id=id||'';
  var item=id?(state.worklog.items||[]).find(function(x){return x.id===id;}):null;
  var date=state.worklog.date||state.data.today;
  var projects=(state.data.projects||[]).slice();
  if(item&&item.project&&!projects.some(function(p){return p.name===item.project;})){
    projects.push({name:item.project,status:'停止'});
  }
  var options=projects.map(function(p){
    return '<option value="'+escapeHtml(p.name)+'" '+(item&&item.project===p.name?'selected':'')+'>'+escapeHtml(p.name)+(p.status&&p.status!=='進行中'?'（'+escapeHtml(p.status)+'）':'')+'</option>';

  if(!s)return `<div class='section-gap'>${card('システム保守',"<p class='muted'>システム情報を読み込んでいます。</p>")}</div>`;

  const auditRows=(m.audit||[]).slice(0,40).map(x=>`<tr>
    <td>${escapeHtml(x.at)}</td>

  const remainingBlockers=blockers.filter(x=>!String(x).includes('試作版共通PIN'));

    ...warnings.map(x=>`<div class='readiness-row warning'><span>確認</span><strong>${escapeHtml(x)}</strong></div>`)

  const prototypeAction=readiness.prototypeMode
    ? `<button class='primary-button' ${remainingBlockers.length?'disabled':''} onclick='switchToProductionMode()'>試作モードを終了</button>`
    : '';
  return `<div class='section-gap'>
    ${card('本番運用チェック',`<div class='readiness-head'><div><span class='badge ${readiness.ready?'success':blockers.length?'danger':'warning'}'>${readiness.ready?'READY':blockers.length?'要対応':'確認あり'}</span><strong>${readiness.ready?'本番運用の内部条件を満たしています':'公開前に確認が必要です'}</strong></div><small>ここではアプリ内部の準備状態を確認します。公開範囲の変更は別工程です。</small></div>${readinessRows||"<div class='readiness-row ok'><span>OK</span><strong>重大な未対応項目はありません。</strong></div>"}<div class='button-row section-gap'>${prototypeAction}<button class='secondary-button' onclick="navigate('companyCalendar')">会社カレンダーを確認</button></div>`)}
    <div class='grid cols-4'>
      ${metric('DBレコード',Object.values(s.sheets||{}).reduce((a,b)=>a+Number(b||0),0)+'件','tone-green')}
      ${metric('有効セッション',s.activeSessions+'件')}
      ${metric('PIN未設定',s.pinPending+'名',s.pinPending?'tone-orange':'tone-green')}
      ${metric('最終バックアップ',backupText?s.lastBackupAt?'実施済み':'未実施':'未実施',s.lastBackupAt?'tone-green':'tone-orange')}
    </div>
    <div class='grid cols-2 section-gap'>
      ${card('バックアップ',`<div class='maintenance-detail'>
        <div><span>最終バックアップ</span><strong>${escapeHtml(backupText)}</strong></div>
        <div><span>自動バックアップ</span><strong>${s.backupEnabled?escapeHtml(s.backupMode||'管理者利用時に1日1回')+' / 有効':'無効'}</strong></div>
        <div><span>保持期間</span><strong>${s.backupRetentionDays}日</strong></div>
      </div><div class='button-row section-gap'><button class='primary-button' onclick='createBackupNow()'>今すぐバックアップ</button><button class='secondary-button' onclick='toggleDailyBackup()'>${s.backupEnabled?'自動バックアップを停止':'自動バックアップを有効化'}</button></div>`)}
      ${card('システム状態',`<div class='maintenance-detail'>
        <div><span>データベース</span><strong>${escapeHtml(s.dbName)}</strong></div>
        <div><span>アプリバージョン</span><strong>${escapeHtml(state.data.app.version)}</strong></div>
        <div><span>最終確認</span><strong>${escapeHtml(s.checkedAt)}</strong></div>
      </div><div class='section-gap'><button class='secondary-button' onclick='loadMaintenance()'>状態を再確認</button></div>`)}
    </div>
    <div class='section-gap'>${card('監査ログ（最新40件）',auditRows?`<div class='table-wrap'><table class='auth-table'><thead><tr><th>日時</th><th>操作者</th><th>操作</th><th>対象</th><th>結果</th></tr></thead><tbody>${auditRows}</tbody></table></div>`:"<p class='muted'>監査ログはありません。</p>")}</div>
  </div>`;

function switchToProductionMode(){
  const readiness=state.maintenance&&state.maintenance.status&&state.maintenance.status.readiness;
  const blockers=((readiness&&readiness.blockers)||[]).filter(x=>!String(x).includes('試作版共通PIN'));
  if(blockers.length){showToast('先に本番運用チェックの要対応項目を解消してください');return}
  openConfirmDialog('試作モードを終了しますか？','共通PIN 000000 は使えなくなり、現在のセッションも終了します。社員ごとのPIN設定が必要です。','試作モードを終了',()=>{
    google.script.run.withSuccessHandler(()=>{
      clearLocalSession();
      showLogin('試作モードを終了しました。社員ごとのPINでログインしてください。');
    }).withFailureHandler(err=>handleApiError(err,'試作モードを終了できませんでした')).setPrototypeMode(state.sessionToken,false);
  },true);
}

function loadMaintenance(options={}){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole))return;
  const key='current';
  if(!options.force&&cacheFresh('maintenance',key))return;
  const ticket=beginPageLoad('maintenance',key);if(!ticket)return;
  const hasCurrent=cacheHas('maintenance',key);
  state.maintenance.loading=!hasCurrent;
  if(!options.silent)renderPageIfActive('admin');
  let pending=2,failed=false;
  const done=()=>{pending--;if(pending<=0){endPageLoad(ticket);state.maintenance.loading=false;if(!failed)markPageCache('maintenance',key);renderPageIfActive('admin')}};
  google.script.run.withSuccessHandler(data=>{state.maintenance.status=data;done()}).withFailureHandler(err=>{failed=true;done();handleApiError(err,'システム状態を読み込めませんでした')}).getSystemStatus(state.sessionToken);
  google.script.run.withSuccessHandler(data=>{state.maintenance.audit=data||[];done()}).withFailureHandler(err=>{failed=true;done();handleApiError(err,'監査ログを読み込めませんでした')}).getAuditLogs(state.sessionToken,100);
}

function createBackupNow(){

    showToast('バックアップを作成しています...');
    google.script.run.withSuccessHandler(result=>{showToast('バックアップを作成しました');invalidatePageCache('maintenance');loadMaintenance({force:true})}).withFailureHandler(err=>handleApiError(err,'バックアップを作成できませんでした')).createManualBackup(state.sessionToken);
  },false);
}

function toggleDailyBackup(){
  const current=!!(state.maintenance.status&&state.maintenance.status.backupEnabled);
  openConfirmDialog(current?'自動バックアップを停止':'自動バックアップを有効化',current?'自動バックアップを停止しますか？':'管理者がFM WORKSを利用した日に1回DBをバックアップし、30日間保持します。','変更する',function(){
    google.script.run.withSuccessHandler(data=>{state.maintenance.status=data;renderPage();showToast(current?'自動バックアップを停止しました':'自動バックアップを有効化しました')}).withFailureHandler(err=>handleApiError(err,'バックアップ設定を変更できませんでした')).setDailyBackupEnabled(state.sessionToken,!current);
  },false);
}

function loadAuthAdmin(options={}){
  if(!(state.data&&state.data.permissions&&state.data.permissions.adminConsole)) return;
  const key='current';
  if(!options.force&&cacheFresh('authAdmin',key)){
    if(options.withMaintenance)loadMaintenance();
    return;
  }
  const ticket=beginPageLoad('authAdmin',key);if(!ticket)return;
  const hasCurrent=cacheHas('authAdmin',key)&&!!state.authAdmin;
  if(!hasCurrent&&!options.silent)renderPage();
  google.script.run
    .withSuccessHandler(data=>{
      endPageLoad(ticket);state.authAdmin=data;markPageCache('authAdmin',key);
      if(state.page==='admin'||state.page==='people')renderPage();
      if(options.withMaintenance||state.page==='admin')loadMaintenance({silent:!!options.silent});
    })
    .withFailureHandler(err=>{endPageLoad(ticket);handleApiError(err,'管理情報を読み込めませんでした')})
    .getAuthAdminData(state.sessionToken);
}

function submitLogin(event){
  event.preventDefault();
  const id=document.getElementById('loginEmployeeId').value.trim().toUpperCase();
  const pin=document.getElementById('loginPin').value;
  const remember=document.getElementById('rememberLogin').checked;
  let initialSupport=null;
  if(state.publicConfig&&state.publicConfig.needsSetup){
    const confirmPin=document.getElementById('loginPinConfirm').value;
    if(pin!==confirmPin){renderLogin('確認用PINが一致しません。');document.getElementById('loginEmployeeId').value=id;return}
    const email=document.getElementById('setupSupportEmail').value.trim();
    const phone=document.getElementById('setupSupportPhone').value.trim();
    if(!email&&!phone){renderLogin('PINを忘れた場合の連絡先として、メールまたは電話番号を入力してください。');document.getElementById('loginEmployeeId').value=id;return}
    initialSupport={name:'FM WORKS管理者',email:email,phone:phone};
  }
  if(remember)localStorage.setItem('fmworks.employeeId',id);else localStorage.removeItem('fmworks.employeeId');
  setLoginBusy(true);
  const runner=google.script.run.withSuccessHandler(acceptLogin).withFailureHandler(err=>{setLoginBusy(false);const msg=sessionErrorMessage(err)||'ログインできませんでした。';renderLogin(msg)});
  if(state.publicConfig&&state.publicConfig.needsSetup)runner.initializeFirstAdmin(id,pin,clientInfo(),initialSupport,remember);
  else runner.login(id,pin,clientInfo(),remember);
}

function acceptLogin(result){
  setSessionToken(result.sessionToken,!!result.remembered);
  loadAuthenticatedApp(!!result.mustChangePin);
}

function loadAuthenticatedApp(mustChangePin){
  setLoading();
  google.script.run.withSuccessHandler(data=>{
    state.data=data;
    state.workLocation=data.attendance.workLocation||'出社';
    state.schedule.date=data.today;
    state.schedule.employees=data.employees||[];
    state.company.year=parseIso(data.today).getFullYear();
    const requested=(location.hash||'#home').slice(1);
    state.page=NAV.some(n=>n[0]===requested)?requested:'home';
    if(state.page==='admin'&&!(data.permissions&&data.permissions.adminConsole))state.page='home';
    document.getElementById('loginShell').hidden=true;
    document.body.classList.remove('login-mode');
    document.getElementById('app').hidden=false;
    setProfileUi();
    initTopbarInteractions();
    renderNav();
    renderPage();
    loadNotifications();
    if(data.permissions&&data.permissions.adminConsole){
      google.script.run.withSuccessHandler(result=>{
        if(result&&!result.skipped&&state.page==='admin')loadMaintenance();
      }).withFailureHandler(()=>{}).ensureDailyBackup(state.sessionToken);
    }
    if(state.page==='schedule')loadSchedule();
    if(state.page==='companyCalendar')loadCompanyCalendar();
    if(state.page==='worklog')loadWorklogs();
    if(state.page==='requests')loadRequests();
    if(state.page==='monthly')loadMonthly();
    if(state.page==='people'&&data.permissions&&data.permissions.adminConsole)loadAuthAdmin();
    if(state.page==='admin'&&data.permissions&&data.permissions.adminConsole)loadAuthAdmin({withMaintenance:true});
    startMenuPrefetch();
    if(mustChangePin)setTimeout(()=>openChangePinModal(true),0);
  }).withFailureHandler(err=>{clearLocalSession();showLogin(sessionErrorMessage(err).includes('SESSION')?'セッションの有効期限が切れました。':'ログイン状態を確認できませんでした。')}).getInitialData(state.sessionToken);
}

function setProfileUi(){
  const u=state.data.user;
  document.getElementById('profileAvatar').textContent=(u.displayName||u.fullName||'?').slice(0,1);
  document.getElementById('profileName').textContent=u.displayName||u.fullName;
  document.getElementById('profileRole').textContent=roleLabel(u.role);
  document.getElementById('profileMenuName').textContent=u.fullName||u.displayName;
  document.getElementById('profileMenuId').textContent=u.employeeId+' / '+roleLabel(u.role);
}

let searchTimer=null;
function openMobileDrawer(){
  const root=document.getElementById('mobileDrawerRoot');if(!root)return;
  const nav=visibleNav();
  root.innerHTML=`<div class='mobile-drawer-backdrop' onclick='closeMobileDrawer()'></div>
    <aside class='mobile-drawer' aria-label='全メニュー'>
      <div class='mobile-drawer-head'>${svgLogo()}<div><strong>FM WORKS</strong><small>${state.data?escapeHtml(state.data.user.displayName):''}</small></div><button class='icon-button' onclick='closeMobileDrawer()' aria-label='メニューを閉じる'>×</button></div>
      <nav>${nav.map(([id,label,icon])=>`<button class='${state.page===id?'active':''}' onclick="navigate('${id}')">${svg(icon)}<span>${label}</span></button>`).join('')}</nav>
    </aside>`;
  document.body.classList.add('drawer-open');
}
function closeMobileDrawer(){
  const root=document.getElementById('mobileDrawerRoot');if(root)root.innerHTML='';
  document.body.classList.remove('drawer-open');
}

function initTopbarInteractions(){
  const menuButton=document.getElementById('mobileMenuButton');
  if(menuButton&&!menuButton.dataset.bound){menuButton.dataset.bound='1';menuButton.addEventListener('click',e=>{e.stopPropagation();openMobileDrawer()})}
  const input=document.getElementById('globalSearchInput');
  if(input&&!input.dataset.bound){
    input.dataset.bound='1';
    input.addEventListener('input',()=>{
      clearTimeout(searchTimer);
      const q=input.value.trim();
      if(q.length<2){hideSearchResults();return}
      searchTimer=setTimeout(()=>performGlobalSearch(q),220);
    });
    input.addEventListener('keydown',e=>{if(e.key==='Escape')hideSearchResults()});
  }
  const bell=document.getElementById('notificationButton');
  if(bell&&!bell.dataset.bound){
    bell.dataset.bound='1';
    bell.addEventListener('click',e=>{e.stopPropagation();toggleNotificationMenu()});
  }
}

function performGlobalSearch(query){
  if(!state.sessionToken)return;
  google.script.run
    .withSuccessHandler(renderSearchResults)
    .withFailureHandler(err=>handleApiError(err,'検索できませんでした'))
    .searchApp(state.sessionToken,query);
}

function renderSearchResults(items){
  const box=document.getElementById('globalSearchResults');
  if(!box)return;
  const rows=(items||[]);
  box.innerHTML=rows.length?rows.map((r,i)=>`<button type='button' onclick="openSearchResult(${i})"><span class='search-type'>${escapeHtml(r.type)}</span><span><strong>${escapeHtml(r.title)}</strong><small>${escapeHtml(r.sub||'')}</small></span></button>`).join(''):`<div class='search-empty'>該当する情報はありません。</div>`;
  box._items=rows;
  box.hidden=false;
}

function hideSearchResults(){
  const box=document.getElementById('globalSearchResults');
  if(box)box.hidden=true;
}

function openSearchResult(index){
  const box=document.getElementById('globalSearchResults');
  const item=box&&box._items&&box._items[index];
  if(!item)return;
  hideSearchResults();
  const input=document.getElementById('globalSearchInput');if(input)input.value='';
  if(item.route==='schedule'&&item.date){
    state.schedule.date=item.date;state.schedule.view='day';
  }
  navigate(item.route||'home');
}

function loadNotifications(){
  if(!state.sessionToken)return;
  google.script.run
    .withSuccessHandler(data=>{
      const dot=document.getElementById('notificationDot');
      if(dot)dot.hidden=!(data&&data.count);
      renderNotificationMenu(data&&data.items||[]);
    })
    .withFailureHandler(()=>{})
    .getNotifications(state.sessionToken);
}

function renderNotificationMenu(items){
  const menu=document.getElementById('notificationMenu');
  if(!menu)return;
  menu._items=items||[];
  menu.innerHTML=`<div class='notification-head'><strong>通知</strong><small>${menu._items.length}件</small></div>`+
    (menu._items.length?menu._items.map((n,i)=>`<button type='button' onclick="openNotificationItem(${i})"><span class='notification-type'>${escapeHtml(n.type)}</span><span><strong>${escapeHtml(n.title)}</strong><small>${escapeHtml(n.subtitle||'')}</small></span></button>`).join(''):`<div class='notification-empty'>新しい通知はありません。</div>`);
}

function toggleNotificationMenu(){
  const menu=document.getElementById('notificationMenu'),button=document.getElementById('notificationButton');
  if(!menu||!button)return;
  const next=menu.hidden;menu.hidden=!next;button.setAttribute('aria-expanded',String(next));
  if(next)loadNotifications();
}

function closeNotificationMenu(){
  const menu=document.getElementById('notificationMenu'),button=document.getElementById('notificationButton');
  if(menu)menu.hidden=true;if(button)button.setAttribute('aria-expanded','false');
}

function openNotificationItem(index){
  const menu=document.getElementById('notificationMenu');
  const item=menu&&menu._items&&menu._items[index];
  closeNotificationMenu();
  if(item)navigate(item.route||'home');
}

function toggleProfileMenu(){
  const menu=document.getElementById('profileMenu'),button=document.getElementById('profileButton');
  const next=menu.hidden;menu.hidden=!next;button.setAttribute('aria-expanded',String(next));
}
function closeProfileMenu(){const menu=document.getElementById('profileMenu'),button=document.getElementById('profileButton');if(menu){menu.hidden=true}if(button)button.setAttribute('aria-expanded','false')}

function performLogout(){
  const token=state.sessionToken;
  clearLocalSession();closeProfileMenu();document.getElementById('app').hidden=true;
  google.script.run.withSuccessHandler(()=>showLogin('ログアウトしました。')).withFailureHandler(()=>showLogin('ログアウトしました。')).logout(token);
}

function openChangePinModal(force=false){
  closeProfileMenu();
  const r=ensureModal();
  r.innerHTML=`<div class='modal-backdrop' ${force?'':"onclick='closeModal()'"}></div><section class='modal-card small' role='dialog' aria-modal='true'>
    <div class='modal-head'><div><small>${force?'初回ログイン':'アカウント設定'}</small><h2>PINを変更</h2></div>${force?'':"<button class='icon-button' onclick='closeModal()'>×</button>"}</div>
    ${force?"<div class='setup-note'>安全のため、管理者が発行した仮PINから新しいPINへ変更してください。</div>":''}
    <div class='form-grid'>
      <label class='field full'><span>現在のPIN</span><input id='currentPin' type='password' inputmode='numeric' maxlength='6' autocomplete='current-password'></label>
      <label class='field full'><span>新しいPIN</span><input id='newPin' type='password' inputmode='numeric' maxlength='6' autocomplete='new-password'></label>
      <label class='field full'><span>新しいPIN（確認）</span><input id='newPinConfirm' type='password' inputmode='numeric' maxlength='6' autocomplete='new-password'></label>
    </div>
    <div class='modal-actions'><span></span><div>${force?'':"<button class='secondary-button' onclick='closeModal()'>キャンセル</button>"}<button class='primary-button' onclick="submitOwnPinChange(${force})">変更</button></div></div>
  </section>`;
}

function submitOwnPinChange(force){
  const current=document.getElementById('currentPin').value,newPin=document.getElementById('newPin').value,confirmPin=document.getElementById('newPinConfirm').value;
  if(newPin!==confirmPin){showToast('確認用PINが一致しません');return}
  google.script.run.withSuccessHandler(()=>{closeModal();showToast('PINを変更しました')}).withFailureHandler(err=>{if(!handleApiError(err,'PINを変更できませんでした')&&force){} }).changeOwnPin(state.sessionToken,current,newPin);
}

function openPinHelpModal(){
  const s=(state.publicConfig&&state.publicConfig.support)||{};
  const employeeId=document.getElementById('loginEmployeeId')?document.getElementById('loginEmployeeId').value.trim().toUpperCase():'';
  const contact=[s.email?`<a href='mailto:${escapeHtml(s.email)}'>${escapeHtml(s.email)}</a>`:'',s.phone?`<a href='tel:${escapeHtml(s.phone)}'>${escapeHtml(s.phone)}</a>`:''].filter(Boolean).join('<br>');
  const r=ensureModal();
  r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card small' role='dialog' aria-modal='true'>
    <div class='modal-head'><div><small>ログインサポート</small><h2>PINを忘れた場合</h2></div><button class='icon-button' onclick='closeModal()'>×</button></div>
    <div class='support-card'><strong>${escapeHtml(s.name||'FM WORKS管理者')}</strong><small>${escapeHtml(s.note||'社内の管理者へご連絡ください。')}</small>${contact?`<div>${contact}</div>`:''}</div>
    <div class='form-grid section-gap'>
      <label class='field full'><span>社員番号</span><input id='helpEmployeeId' value='${escapeHtml(employeeId)}' placeholder='FM0001'></label>
      <label class='field full'><span>補足（任意）</span><textarea id='helpNote' rows='3' placeholder='管理者へのメモ'></textarea></label>
    </div>
    <div class='modal-actions'><span></span><div><button class='secondary-button' onclick='closeModal()'>閉じる</button><button class='primary-button' onclick='submitPinHelp()'>再発行を依頼</button></div></div>
  </section>`;
}

function submitPinHelp(){
  const id=document.getElementById('helpEmployeeId').value.trim().toUpperCase();
  const note=document.getElementById('helpNote').value;
  google.script.run.withSuccessHandler(result=>{state.publicConfig.support=result.support||state.publicConfig.support;closeModal();showToast('PIN再発行依頼を登録しました')})
    .withFailureHandler(()=>{closeModal();showToast('案内先の管理者へ直接ご連絡ください')})
    .requestPinHelp(id,note,clientInfo());
}

function bootstrap(){
  state.sessionToken=getStoredSessionToken();
  const button=document.getElementById('profileButton');
  if(button)button.addEventListener('click',e=>{e.stopPropagation();toggleProfileMenu()});
  document.addEventListener('click',e=>{
    if(!e.target.closest('.profile-wrap'))closeProfileMenu();
    if(!e.target.closest('.search-wrap'))hideSearchResults();
    if(!e.target.closest('.notification-wrap'))closeNotificationMenu();
  });
  google.script.run.withSuccessHandler(config=>{
    state.publicConfig=config;
    if(state.sessionToken){
      google.script.run.withSuccessHandler(result=>loadAuthenticatedApp(!!result.mustChangePin)).withFailureHandler(()=>{clearLocalSession();showLogin()}).resumeSession(state.sessionToken);
    }else{
      showLogin();
    }
  }).withFailureHandler(()=>showLogin('FM WORKSの初期情報を読み込めませんでした。')).getPublicAuthConfig();
}

document.addEventListener('DOMContentLoaded',bootstrap);

</script>
