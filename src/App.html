<script>
const NAV = [['home','ホーム','i-home'],['attendance','勤怠','i-clock'],['worklog','工数','i-chart'],['schedule','予定表','i-calendar'],['companyCalendar','会社カレンダー','i-calendar'],['requests','申請','i-file'],['people','社員','i-users'],['monthly','月次','i-trend'],['admin','管理','i-gear']];
const MOBILE_NAV = ['home','attendance','schedule','worklog','admin'];
const CATEGORY_COLORS={予定:'#1478ff',仮予定:'#f3a11b',業務:'#7b61ff',出張:'#00a58a',休暇:'#ef4d5b',社内:'#64748b'};
let state={page:'home',data:null,workLocation:'出社',busy:false,schedule:{date:null,view:'month',employeeId:'ALL',category:'ALL',events:[],companyDays:[],employees:[],loading:false},company:{year:null,days:[],workdays:0,daysOff:0,adjustedWorkdays:0,companyHolidays:0,loading:false}};

function svg(id){return `<svg aria-hidden='true'><use href='#${id}'/></svg>`}
function escapeHtml(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function card(title,body,cls=''){return `<section class='card ${cls}'><h3>${title}</h3>${body}</section>`}
function metric(label,value,iconTone=''){return `<section class='card metric'><div><small class='muted'>${label}</small><div><strong>${value}</strong></div></div><div class='metric-icon ${iconTone}'>●</div></section>`}
function list(items){return `<div class='list'>${items.map(i=>`<div class='list-item'><span class='status-dot' style='background:${i.color||'var(--blue)'}'></span><div><strong>${i.title}</strong><div class='muted' style='font-size:12px;margin-top:3px'>${i.sub||''}</div></div>${i.right||''}</div>`).join('')}</div>`}
function pageHead(title,desc,action=''){return `<div class='page-head'><div><div class='eyebrow'>FM WORKS</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function demoAction(label){showToast(`${label}：この機能は次フェーズで実装します`)}
function pad(n){return String(n).padStart(2,'0')}
function parseIso(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(s,n){const d=parseIso(s);d.setDate(d.getDate()+n);return iso(d)}
function addMonths(s,n){const d=parseIso(s);d.setDate(1);d.setMonth(d.getMonth()+n);return iso(d)}
function startOfWeek(s){const d=parseIso(s);d.setDate(d.getDate()-d.getDay());return iso(d)}
function endOfWeek(s){return addDays(startOfWeek(s),6)}
function monthGridRange(s){const d=parseIso(s);const first=new Date(d.getFullYear(),d.getMonth(),1);const last=new Date(d.getFullYear(),d.getMonth()+1,0);first.setDate(first.getDate()-first.getDay());last.setDate(last.getDate()+(6-last.getDay()));return {start:iso(first),end:iso(last)}}
function fmtDate(s){const d=parseIso(s);return `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`}
function fmtMonth(s){const d=parseIso(s);return `${d.getFullYear()}年 ${d.getMonth()+1}月`}
function isToday(s){return state.data&&s===state.data.today}
function categoryColor(c){return CATEGORY_COLORS[c]||'#64748b'}

function selectWorkLocation(location){if(!['出社','在宅','外出'].includes(location))return;state.workLocation=location;renderPage()}
function performPunch(action){if(state.busy)return;state.busy=true;showToast(`${action}を登録しています...`);google.script.run.withSuccessHandler(data=>{state.data=data;state.workLocation=data.attendance.workLocation||state.workLocation;state.busy=false;renderPage();showToast(`${action}をGoogle Sheetsへ保存しました`)}).withFailureHandler(err=>{state.busy=false;showToast(err&&err.message?err.message:'打刻の登録に失敗しました');renderPage()}).recordPunch(action,state.workLocation)}
function workLocationSelector(){return `<div class='section-gap'><small class='muted'>勤務場所</small><div class='button-row' style='margin-top:8px'>${['出社','在宅','外出'].map(x=>`<button class='${state.workLocation===x?'primary-button':'secondary-button'}' onclick="selectWorkLocation('${x}')">${x}</button>`).join('')}</div></div>`}
function punchButtons(a){if(a.state==='off')return `<button class='primary-button' onclick="performPunch('出勤')">出勤する</button>`;if(a.state==='working')return `<button class='secondary-button' onclick="performPunch('休憩開始')">休憩する</button><button class='primary-button' onclick="performPunch('退勤')">退勤する</button>`;if(a.state==='break')return `<button class='primary-button' onclick="performPunch('休憩終了')">休憩終了</button>`;return `<button class='secondary-button' disabled>本日の勤務は終了しました</button>`}

function renderNav(){document.getElementById('desktopNav').innerHTML=NAV.map(([id,label,icon])=>`<button class='nav-button ${state.page===id?'active':''}' data-route='${id}'>${svg(icon)}<span>${label}</span></button>`).join('');document.getElementById('mobileNav').innerHTML=MOBILE_NAV.map(id=>{const n=NAV.find(x=>x[0]===id);return `<button class='mobile-tab ${state.page===id?'active':''}' data-route='${id}'>${svg(n[2])}<span>${n[1]}</span></button>`}).join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>navigate(b.dataset.route))}
function navigate(page){state.page=page;history.replaceState(null,'',`#${page}`);renderNav();renderPage();window.scrollTo({top:0,behavior:'smooth'});if(page==='schedule')loadSchedule();if(page==='companyCalendar')loadCompanyCalendar()}

function homePage(){const d=state.data,a=d.attendance;const sched=(d.todaySchedule||[]);const company=d.companyToday;return `${pageHead('ホーム','今日の勤務・予定・やることをまとめて確認します。')}<div class='hero'><div class='live-chip'>● 実データ接続済み</div><h2>おはようございます、${escapeHtml(d.user.displayName)}</h2><p>${company?`${escapeHtml(company.type)}${company.name?' / '+escapeHtml(company.name):''}`:'会社カレンダー未登録'} ・ ${fmtDate(d.today)}</p></div><div class='grid cols-3'>${card('現在の勤怠状況',`<div class='status-row'><span class='status-dot' style='background:${a.state==='off'||a.state==='finished'?'#8090a8':a.state==='break'?'#f3a11b':'#18a46d'}'></span><strong>${a.stateLabel}</strong></div><div class='attendance-time'>${a.clockIn?a.clockIn+' 出勤':'未出勤'}</div><p class='muted'>実働 ${a.worked} / ${a.workLocation}</p><div class='button-row'>${punchButtons(a)}</div>${workLocationSelector()}`)}${card('今日の予定',sched.length?list(sched.map(e=>({title:`${e.allDay?'終日':e.start||'--:--'} ${escapeHtml(e.title)}`,sub:`${escapeHtml(e.employeeNames.join('、'))}${e.location?' / '+escapeHtml(e.location):''}`,color:categoryColor(e.category)}))):`<p class='muted'>今日の予定はありません。</p><button class='secondary-button' onclick="navigate('schedule')">予定表を開く</button>`)}${card('やること',d.tasks.map(x=>`<div class='list-item'><span></span><strong>${x.label}</strong><span class='badge ${x.tone==='danger'?'danger':x.tone==='warning'?'warning':''}'>${x.status}</span></div>`).join(''))}</div><div class='grid cols-3 section-gap'>${metric('勤務時間',d.month.workHours,'tone-green')}${metric('残業時間',d.month.overtime,'')}${metric('有給残',d.month.leaveBalance,'tone-orange')}</div><div class='grid cols-2 section-gap'>${card('今日の打刻履歴',a.history.length?list(a.history.map(x=>({title:`${x.time} ${x.action}`,sub:x.workLocation,color:x.action==='退勤'?'#8090a8':x.action.includes('休憩')?'#f3a11b':'#1478ff'}))):'<p class=\'muted\'>本日の打刻はまだありません。</p>')}${card('共有予定表',`<p class='muted'>旧予定表をFM WORKSへ移行済み。月・週・日・一覧で確認できます。</p><button class='primary-button' onclick="navigate('schedule')">予定表を開く</button>`)}</div>`}

function attendancePage(){const d=state.data,a=d.attendance;return `${pageHead('勤怠','出退勤、休憩、勤務場所、打刻履歴を管理します。')}<div class='grid cols-2'>${card('現在の勤務状況',`<div class='status-row'><span class='status-dot' style='background:${a.state==='off'||a.state==='finished'?'#8090a8':a.state==='break'?'#f3a11b':'#18a46d'}'></span><strong>${a.stateLabel}</strong></div><div class='attendance-time'>${a.clockIn?a.clockIn+' に出勤':'まだ出勤していません'}</div><p class='muted'>現在の実働：${a.worked}</p><div class='button-row'>${punchButtons(a)}</div>${workLocationSelector()}`)}${card('本日の打刻状況',a.history.length?list(a.history.map(x=>({title:`${x.time} ${x.action}`,sub:x.workLocation,color:x.action==='退勤'?'#8090a8':x.action.includes('休憩')?'#f3a11b':'#1478ff'}))):'<p class=\'muted\'>まだ打刻はありません。</p>')}</div><div class='grid cols-4 section-gap'>${metric('本日の実働',a.worked,'tone-green')}${metric('出勤時刻',a.clockIn||'--:--')}${metric('退勤時刻',a.clockOut||'--:--','tone-orange')}${metric('保存先','Google Sheets','tone-purple')}</div>`}

function worklogPage(){return `${pageHead('工数','勤務時間に対して、どの業務に何時間使ったかを記録します。','<button class=\'primary-button\' onclick="demoAction(\'工数追加\')">＋ 工数追加</button>')}<div class='grid cols-4'>${metric('今日の勤務時間','8時間36分','tone-green')}${metric('入力済工数','6時間30分')}${metric('未入力時間','2時間06分','tone-orange')}${metric('プロジェクト数','4件','tone-purple')}</div><div class='grid cols-2 section-gap'>${card('工数入力',list([{title:'会津屋アプリ 1.0h',sub:'要件定義・仕様検討',color:'#1478ff'},{title:'CoDoNa Lab 2.0h',sub:'デザインレビュー',color:'#18a46d'}]))}${card('入力進捗',`<div style='font-size:34px;font-weight:800'>6.5h / 8.0h</div><p class='muted'>進捗 81%</p><div class='progress'><span style='width:81%'></span></div>`)}</div>`}

function scheduleRange(){const s=state.schedule; if(s.view==='month'||s.view==='list')return monthGridRange(s.date); if(s.view==='week')return {start:startOfWeek(s.date),end:endOfWeek(s.date)}; return {start:s.date,end:s.date}}
function loadSchedule(){if(!state.schedule.date)return;const r=scheduleRange();state.schedule.loading=true;renderPage();google.script.run.withSuccessHandler(data=>{state.schedule.events=data.events||[];state.schedule.companyDays=data.companyDays||[];state.schedule.employees=data.employees||[];state.schedule.loading=false;renderPage()}).withFailureHandler(err=>{state.schedule.loading=false;showToast(err&&err.message?err.message:'予定表の読み込みに失敗しました');renderPage()}).getScheduleBundle({start:r.start,end:r.end,employeeId:state.schedule.employeeId,category:state.schedule.category})}
function changeScheduleView(v){state.schedule.view=v;loadSchedule()}
function moveSchedule(step){const s=state.schedule;if(s.view==='month'||s.view==='list')s.date=addMonths(s.date,step);else if(s.view==='week')s.date=addDays(s.date,7*step);else s.date=addDays(s.date,step);loadSchedule()}
function scheduleToday(){state.schedule.date=state.data.today;loadSchedule()}
function setScheduleFilter(kind,value){state.schedule[kind]=value;loadSchedule()}
function companyDayMap(){return Object.fromEntries((state.schedule.companyDays||[]).map(d=>[d.date,d]))}
function eventsFor(date){return (state.schedule.events||[]).filter(e=>e.date===date)}
function eventChip(e){return `<button class='schedule-event' style='--event-color:${categoryColor(e.category)}' onclick="event.stopPropagation();openScheduleEditor('${e.id}')"><span>${e.allDay?'終日':escapeHtml(e.start||'')}</span><strong>${escapeHtml(e.title)}</strong></button>`}
function scheduleToolbar(){const s=state.schedule;const employees=s.employees.length?s.employees:(state.data.employees||[]);return `<div class='schedule-toolbar'><div class='toolbar-group'><button class='secondary-button compact' onclick='moveSchedule(-1)'>‹</button><button class='secondary-button compact' onclick='scheduleToday()'>今日</button><button class='secondary-button compact' onclick='moveSchedule(1)'>›</button><strong class='period-label'>${fmtMonth(s.date)}</strong></div><div class='toolbar-group'><div class='segmented'>${[['month','月'],['week','週'],['day','日'],['list','一覧']].map(x=>`<button class='${s.view===x[0]?'active':''}' onclick="changeScheduleView('${x[0]}')">${x[1]}</button>`).join('')}</div><select class='filter-select' onchange="setScheduleFilter('employeeId',this.value)"><option value='ALL'>全社員</option>${employees.map(e=>`<option value='${e.employeeId}' ${s.employeeId===e.employeeId?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select><select class='filter-select' onchange="setScheduleFilter('category',this.value)"><option value='ALL'>全カテゴリ</option>${Object.keys(CATEGORY_COLORS).map(c=>`<option value='${c}' ${s.category===c?'selected':''}>${c}</option>`).join('')}</select><button class='primary-button' onclick='openScheduleEditor()'>＋ 予定登録</button></div></div>`}
function monthView(){const s=state.schedule,range=monthGridRange(s.date),map=companyDayMap(),curMonth=parseIso(s.date).getMonth(),cells=[];for(let d=range.start;;d=addDays(d,1)){const dt=parseIso(d),ev=eventsFor(d),cd=map[d];cells.push(`<div class='month-day ${dt.getMonth()!==curMonth?'outside':''} ${isToday(d)?'today':''} ${cd&&!cd.working?'day-off':''}' onclick="openDay('${d}')"><div class='day-head'><span>${dt.getDate()}</span>${cd&&cd.type!=='通常勤務'?`<em class='day-type ${cd.working?'workday':'offday'}'>${escapeHtml(cd.name||cd.type)}</em>`:''}</div><div class='day-events'>${ev.slice(0,3).map(eventChip).join('')}${ev.length>3?`<button class='more-events'>＋${ev.length-3}件</button>`:''}</div></div>`);if(d===range.end)break}return `<div class='weekday-row'>${['日','月','火','水','木','金','土'].map(x=>`<div>${x}</div>`).join('')}</div><div class='month-grid'>${cells.join('')}</div>`}
function weekView(){const start=startOfWeek(state.schedule.date),map=companyDayMap();return `<div class='week-grid'>${Array.from({length:7},(_,i)=>{const d=addDays(start,i),cd=map[d],ev=eventsFor(d);return `<section class='week-day ${isToday(d)?'today':''} ${cd&&!cd.working?'day-off':''}'><header><strong>${fmtDate(d)}</strong><small>${cd?escapeHtml(cd.name||cd.type):''}</small></header><div>${ev.length?ev.map(eventChip).join(''):`<p class='muted empty-day'>予定なし</p>`}</div><button class='add-inline' onclick="openScheduleEditor('', '${d}')">＋</button></section>`}).join('')}</div>`}
function dayView(){const d=state.schedule.date,cd=companyDayMap()[d],ev=eventsFor(d);return `<div class='day-view'><div class='day-summary'><div><h2>${fmtDate(d)}</h2><p class='muted'>${cd?`${escapeHtml(cd.type)}${cd.name?' / '+escapeHtml(cd.name):''}${cd.working?'  '+cd.start+'-'+cd.end:''}`:'会社カレンダー未登録'}</p></div><button class='primary-button' onclick="openScheduleEditor('', '${d}')">＋ この日に予定</button></div>${ev.length?ev.map(e=>`<article class='agenda-item' style='--event-color:${categoryColor(e.category)}' onclick="openScheduleEditor('${e.id}')"><div class='agenda-time'>${e.allDay?'終日':escapeHtml(e.start||'--:--')}${e.end?' - '+escapeHtml(e.end):''}</div><div><strong>${escapeHtml(e.title)}</strong><p>${escapeHtml(e.employeeNames.join('、'))}${e.location?' ・ '+escapeHtml(e.location):''}</p><span class='badge'>${escapeHtml(e.category)}</span></div></article>`).join(''):`<div class='empty-state'><strong>予定はありません</strong><p>右上のボタンから予定を登録できます。</p></div>`}</div>`}
function listView(){const ev=state.schedule.events||[];return `<div class='schedule-list'><div class='schedule-list-head'><span>日付</span><span>時間</span><span>予定</span><span>参加者</span><span>分類</span></div>${ev.length?ev.map(e=>`<button class='schedule-list-row' onclick="openScheduleEditor('${e.id}')"><span><strong>${fmtDate(e.date)}</strong></span><span>${e.allDay?'終日':escapeHtml(e.start||'--:--')+(e.end?' - '+escapeHtml(e.end):'')}</span><span><strong>${escapeHtml(e.title)}</strong>${e.location?`<small>${escapeHtml(e.location)}</small>`:''}</span><span>${escapeHtml(e.employeeNames.join('、'))}</span><span><i style='background:${categoryColor(e.category)}'></i>${escapeHtml(e.category)}</span></button>`).join(''):`<div class='empty-state'>該当する予定はありません。</div>`}</div>`}
function schedulePage(){const s=state.schedule;let body=s.loading?`<div class='loading-card'></div>`:s.view==='month'?monthView():s.view==='week'?weekView():s.view==='day'?dayView():listView();return `${pageHead('予定表','社員の予定・訪問・会議・作業予定を共有します。会社の休日設定とは分離しています。')} ${scheduleToolbar()} <div class='schedule-surface'>${body}</div><div class='calendar-legend'><span><i class='legend-dot holiday'></i>会社休日・祝日</span><span><i class='legend-dot work'></i>調整出勤日</span><span>予定データはFM WORKS DBで共有</span></div>`}
function openDay(date){state.schedule.date=date;state.schedule.view='day';loadSchedule()}
function ensureModal(){let r=document.getElementById('modalRoot');if(!r){r=document.createElement('div');r.id='modalRoot';document.body.appendChild(r)}return r}
function closeModal(){const r=document.getElementById('modalRoot');if(r)r.innerHTML=''}
function openScheduleEditor(id='',date=''){const e=id?(state.schedule.events||[]).find(x=>x.id===id):null;const employees=state.schedule.employees.length?state.schedule.employees:(state.data.employees||[]);const d=date||(e&&e.date)||state.schedule.date||state.data.today;const checked=e?e.employeeIds:[state.data.user.employeeId];const r=ensureModal();r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card' role='dialog' aria-modal='true'><div class='modal-head'><div><small>${e?'予定を編集':'新しい予定'}</small><h2>${fmtDate(d)}</h2></div><button class='icon-button' onclick='closeModal()'>×</button></div><div class='form-grid'><label class='field full'><span>予定名</span><input id='schTitle' value='${escapeHtml(e?e.title:'')}' placeholder='例：会津屋様 訪問'></label><label class='field'><span>日付</span><input id='schDate' type='date' value='${d}'></label><label class='field check-field'><input id='schAllDay' type='checkbox' ${!e||e.allDay?'checked':''} onchange='toggleScheduleTimes()'><span>終日</span></label><label class='field time-field'><span>開始</span><input id='schStart' type='time' value='${escapeHtml(e?e.start:'09:00')}'></label><label class='field time-field'><span>終了</span><input id='schEnd' type='time' value='${escapeHtml(e?e.end:'10:00')}'></label><label class='field'><span>分類</span><select id='schCategory'>${Object.keys(CATEGORY_COLORS).map(c=>`<option value='${c}' ${(e?e.category:'予定')===c?'selected':''}>${c}</option>`).join('')}</select></label><label class='field'><span>場所</span><input id='schLocation' value='${escapeHtml(e?e.location:'')}' placeholder='訪問先 / Zoom 等'></label><div class='field full'><span>参加者</span><div class='attendee-grid'>${employees.map(emp=>`<label><input type='checkbox' name='schEmployee' value='${emp.employeeId}' ${checked.includes(emp.employeeId)?'checked':''}><span>${escapeHtml(emp.name)}</span></label>`).join('')}</div></div><label class='field full'><span>詳細・メモ</span><textarea id='schDetail' rows='4'>${escapeHtml(e?e.detail:'')}</textarea></label></div><div class='modal-actions'>${e?`<button class='danger-button' onclick="deleteScheduleFromModal('${e.id}')">削除</button>`:'<span></span>'}<div><button class='secondary-button' onclick='closeModal()'>キャンセル</button><button class='primary-button' onclick="saveScheduleFromModal('${e?e.id:''}')">保存</button></div></div></section>`;toggleScheduleTimes()}
function toggleScheduleTimes(){const all=document.getElementById('schAllDay');document.querySelectorAll('.time-field').forEach(x=>x.style.display=all&&all.checked?'none':'grid')}
function saveScheduleFromModal(id){const employeeIds=[...document.querySelectorAll("input[name='schEmployee']:checked")].map(x=>x.value);const payload={id:id,date:document.getElementById('schDate').value,title:document.getElementById('schTitle').value,allDay:document.getElementById('schAllDay').checked,start:document.getElementById('schStart').value,end:document.getElementById('schEnd').value,category:document.getElementById('schCategory').value,location:document.getElementById('schLocation').value,detail:document.getElementById('schDetail').value,employeeIds};showToast('予定を保存しています...');google.script.run.withSuccessHandler(()=>{closeModal();showToast('予定を保存しました');loadSchedule()}).withFailureHandler(err=>showToast(err&&err.message?err.message:'保存に失敗しました')).saveSchedule(payload)}
function deleteScheduleFromModal(id){if(!confirm('この予定を削除しますか？'))return;google.script.run.withSuccessHandler(()=>{closeModal();showToast('予定を削除しました');loadSchedule()}).withFailureHandler(err=>showToast(err&&err.message?err.message:'削除に失敗しました')).deleteSchedule(id)}

function canEditCompanyCalendar(){return !!(state.data&&state.data.permissions&&state.data.permissions.companyCalendarEdit)}
function loadCompanyCalendar(year){state.company.year=Number(year||state.company.year||parseIso(state.data.today).getFullYear());state.company.loading=true;renderPage();google.script.run.withSuccessHandler(data=>{Object.assign(state.company,data,{loading:false});renderPage()}).withFailureHandler(err=>{state.company.loading=false;showToast(err&&err.message?err.message:'会社カレンダーを読み込めませんでした');renderPage()}).getCompanyCalendar(state.company.year)}
function moveCompanyYear(n){loadCompanyCalendar((state.company.year||2026)+n)}
function miniMonth(year,month){const days=state.company.days||[],map=Object.fromEntries(days.map(d=>[d.date,d])),first=new Date(year,month-1,1),start=new Date(first);start.setDate(1-first.getDay());const cells=[];for(let i=0;i<42;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);const ds=iso(dt),cd=map[ds],outside=dt.getMonth()!==month-1;cells.push(`<button class='mini-day ${outside?'outside':''} ${cd&&!cd.working?'off':''} ${cd&&cd.type==='調整出勤日'?'adjusted':''} ${isToday(ds)?'today':''}' onclick="openCompanyDay('${ds}')" ${outside?'disabled':''} aria-label="${fmtDate(ds)} ${cd?escapeHtml(cd.name||cd.type):'未登録'}"><span>${dt.getDate()}</span>${cd&&cd.name?`<small>${escapeHtml(cd.name)}</small>`:''}</button>`)}return `<section class='mini-month'><h3>${month}月</h3><div class='mini-weekdays'>${['日','月','火','水','木','金','土'].map(x=>`<span>${x}</span>`).join('')}</div><div class='mini-grid'>${cells.join('')}</div></section>`}
function companyCalendarPage(){const c=state.company,editable=canEditCompanyCalendar();if(c.loading)return `${pageHead('会社カレンダー','会社としての勤務日・休日・調整出勤日を確認します。予定表とは別データです。')}<div class='loading-card'></div>`;const permissionBadge=editable?`<span class='badge success'>編集権限あり</span>`:`<span class='badge'>閲覧専用</span>`;return `${pageHead('会社カレンダー','会社としての勤務日・休日・調整出勤日を確認します。予定表とは別データです。','<button class=\'secondary-button\' onclick="navigate(\'schedule\')">予定表へ</button>')}<div class='permission-banner ${editable?'can-edit':'read-only'}'><div><strong>${permissionBadge}</strong><span>${editable?'管理者または会社カレンダー編集権限を持つユーザーです。':'このアカウントは閲覧のみです。会社カレンダーの変更はできません。'}</span></div></div><div class='company-year-toolbar'><button class='secondary-button compact' onclick='moveCompanyYear(-1)'>‹</button><strong>${c.year||2026}年</strong><button class='secondary-button compact' onclick='moveCompanyYear(1)'>›</button></div><div class='grid cols-4 company-kpis'>${metric('年間稼働日数',`${c.workdays||0}日`,'tone-green')}${metric('年間休日',`${c.daysOff||0}日`,'tone-orange')}${metric('調整出勤日',`${c.adjustedWorkdays||0}日`,'')}${metric('会社独自休日',`${c.companyHolidays||0}日`,'tone-purple')}</div>${c.days&&c.days.length?`<div class='year-grid'>${Array.from({length:12},(_,i)=>miniMonth(c.year,i+1)).join('')}</div>`:`<div class='empty-state'><strong>${c.year}年の会社カレンダーは未登録です。</strong><p>管理者が登録すると予定表にも休日情報が反映されます。</p></div>`}<div class='calendar-legend'><span><i class='legend-dot holiday'></i>休日・祝日</span><span><i class='legend-dot work'></i>調整出勤日</span><span>${editable?'日付をクリックすると確認・編集できます':'日付をクリックすると詳細を確認できます'}</span></div>`}
function openCompanyDay(date){const cd=(state.company.days||[]).find(x=>x.date===date)||{date,type:'通常勤務',name:'',start:'09:00',end:'18:00',breakMinutes:60,working:true};const editable=canEditCompanyCalendar(),r=ensureModal();if(!editable){r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card small' role='dialog' aria-modal='true'><div class='modal-head'><div><small>会社カレンダー / 閲覧専用</small><h2>${fmtDate(date)}</h2></div><button class='icon-button' onclick='closeModal()'>×</button></div><div class='readonly-calendar-detail'><div><span>区分</span><strong>${escapeHtml(cd.type||'未登録')}</strong></div><div><span>名称</span><strong>${escapeHtml(cd.name||'—')}</strong></div><div><span>勤務時間</span><strong>${cd.working?`${escapeHtml(cd.start||'--:--')} - ${escapeHtml(cd.end||'--:--')}`:'休日'}</strong></div><div><span>休憩</span><strong>${cd.working?`${Number(cd.breakMinutes||0)}分`:'—'}</strong></div></div><div class='modal-actions'><span class='muted'>変更するには管理者または編集権限が必要です。</span><div><button class='primary-button' onclick='closeModal()'>閉じる</button></div></div></section>`;return}r.innerHTML=`<div class='modal-backdrop' onclick='closeModal()'></div><section class='modal-card small' role='dialog' aria-modal='true'><div class='modal-head'><div><small>会社カレンダー編集</small><h2>${fmtDate(date)}</h2></div><button class='icon-button' onclick='closeModal()'>×</button></div><div class='form-grid'><label class='field full'><span>区分</span><select id='companyType'>${['通常勤務','法定祝日','会社休日','調整出勤日','週末'].map(x=>`<option value='${x}' ${cd.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label class='field full'><span>名称</span><input id='companyName' value='${escapeHtml(cd.name||'')}' placeholder='例：夏季休暇'></label><label class='field'><span>勤務開始</span><input id='companyStart' type='time' value='${escapeHtml(cd.start||'09:00')}'></label><label class='field'><span>勤務終了</span><input id='companyEnd' type='time' value='${escapeHtml(cd.end||'18:00')}'></label><label class='field'><span>休憩（分）</span><input id='companyBreak' type='number' min='0' value='${cd.breakMinutes||60}'></label></div><div class='modal-actions'><span></span><div><button class='secondary-button' onclick='closeModal()'>キャンセル</button><button class='primary-button' onclick="saveCompanyDayFromModal('${date}')">保存</button></div></div></section>`}
function saveCompanyDayFromModal(date){if(!canEditCompanyCalendar()){showToast('会社カレンダーの編集権限がありません');return}const payload={date,type:document.getElementById('companyType').value,name:document.getElementById('companyName').value,start:document.getElementById('companyStart').value,end:document.getElementById('companyEnd').value,breakMinutes:document.getElementById('companyBreak').value};google.script.run.withSuccessHandler(()=>{closeModal();showToast('会社カレンダーを更新しました');loadCompanyCalendar(state.company.year);if(state.page==='schedule')loadSchedule()}).withFailureHandler(err=>showToast(err&&err.message?err.message:'更新に失敗しました')).saveCompanyCalendarDay(payload)}

function requestsPage(){return `${pageHead('申請','有給・半休・打刻修正・在宅・残業の申請をまとめます。','<button class=\'primary-button\' onclick="demoAction(\'新規申請\')">＋ 新規申請</button>')}<div class='grid cols-4'>${metric('有給申請','申請する','tone-green')}${metric('半休申請','申請する','')}${metric('打刻修正','申請する','tone-purple')}${metric('残業申請','申請する','tone-red')}</div>`}
function peoplePage(){
  const emps=state.data.employees||[];
  const items=emps.map(e=>({
    title:escapeHtml(e.name),
    sub:(escapeHtml(e.department||'未設定')+' / '+escapeHtml(e.role)),
    color:'#18a46d'
  }));
  return `${pageHead('社員','社員情報・所属・連絡先・勤務状況を確認します。')}
  <div class='grid cols-2'>
    ${card('社員一覧',list(items))}
    ${card('共有の考え方',`<p class='muted'>予定表は社員単位で絞り込みでき、複数社員を参加者として登録できます。</p>`)}
  </div>`;
}
function monthlyPage(){return `${pageHead('月次','月次締め前に勤怠・申請・工数の不足を確認します。','<button class=\'primary-button\' onclick="demoAction(\'税理士提出データ作成\')">税理士提出データを作成</button>')}<div class='grid cols-4'>${metric('勤務時間','168時間00分','tone-green')}${metric('残業時間','22時間30分')}${metric('有給取得','2日','tone-orange')}${metric('休日出勤','1日','tone-purple')}</div>`}
function adminPage(){
  const employeeCount=(state.data.employees||[]).length;
  return `${pageHead('管理','総務・管理者向けの運用状況と各種設定です。')}
  <div class='grid cols-4'>
    ${metric('社員',employeeCount+'名','tone-green')}
    ${metric('予定表','共有DB','')}
    ${metric('会社カレンダー','2026年登録済','tone-orange')}
    ${metric('監査ログ','記録中','tone-purple')}
  </div>
  <div class='grid cols-2 section-gap'>
    ${card('管理メニュー',`<div class='button-row'><button class='secondary-button' onclick="navigate('companyCalendar')">会社カレンダー</button><button class='secondary-button' onclick="navigate('people')">社員マスター</button></div>`)}
    ${card('データ基盤',`<p class='muted'>勤怠・予定表・会社カレンダーはGoogle Sheetsの「FM WORKS DB」に保存されています。</p>`)}
  </div>`;
}
function renderPage(){const fn={home:homePage,attendance:attendancePage,worklog:worklogPage,schedule:schedulePage,companyCalendar:companyCalendarPage,requests:requestsPage,people:peoplePage,monthly:monthlyPage,admin:adminPage}[state.page]||homePage;document.getElementById('content').innerHTML=fn()}
function setLoading(){document.getElementById('content').innerHTML='<div class=\'grid cols-3\'><div class=\'loading-card\'></div><div class=\'loading-card\'></div><div class=\'loading-card\'></div></div>'}
function bootstrap(){state.page=(location.hash||'#home').slice(1);if(!NAV.some(n=>n[0]===state.page))state.page='home';renderNav();setLoading();google.script.run.withSuccessHandler(data=>{state.data=data;state.workLocation=data.attendance.workLocation||'出社';state.schedule.date=data.today;state.schedule.employees=data.employees||[];state.company.year=parseIso(data.today).getFullYear();document.getElementById('profileName').textContent=data.user.displayName;document.getElementById('profileRole').textContent=data.user.role;document.getElementById('app').classList.remove('is-loading');renderPage();if(state.page==='schedule')loadSchedule();if(state.page==='companyCalendar')loadCompanyCalendar()}).withFailureHandler(err=>{document.getElementById('content').innerHTML=`<section class='card'><h3>読み込みに失敗しました</h3><p class='muted'>${escapeHtml(err&&err.message||'不明なエラー')}</p></section>`}).getInitialData()}
document.addEventListener('DOMContentLoaded',bootstrap);
</script>
