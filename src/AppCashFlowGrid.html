<script>
/* November-close fiscal cashflow: Excel-style 12-month horizontal input.
 * Pure browser-memory editing; existing admin-only saveCashFlowYear is unchanged. */
const CF_GRID_FIELDS=[
 ['planIn','計画入金'],['planOut','計画出金'],
 ['actualIn','実績入金'],['actualOut','実績出金'],['note','備考']
];
function cashFlowGridCanEdit_(){
 return cashFlowAllowed_()&&!!cashFlowUi.draft&&!cashFlowUi.busy&&!cashFlowUi.uncertain;
}
function cashFlowGridNormalize_(key,text){
 const value=String(text==null?'':text).trim();
 if(key==='note'){
  if(value.length>300||/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/.test(value))
   throw Error('備考は300文字以内で入力してください。');
  return value;
 }
 if(!['planIn','planOut','actualIn','actualOut'].includes(key))throw Error('入力列が不正です。');
 if(value==='')return null;
 const s=value.replace(/[,，\s¥￥円]/g,'');
 if(!/^(0|[1-9]\d{0,11})$/.test(s)||Number(s)>999999999999)
  throw Error('金額は0～9999億9999万9999円の整数で入力してください。');
 return Number(s);
}
function cashFlowGridApplyMatrix_(text,fieldIndex,monthIndex){
 if(!cashFlowGridCanEdit_())throw Error('保存中・結果未確認の資金繰り表は編集できません。');
 const ui=cashFlowUi,src=String(text||'').replace(/\r\n?/g,'\n');
 if(!src||src.length>30000)throw Error('1回の貼付は3万文字以内にしてください。');
 const lines=src.split('\n');if(lines[lines.length-1]==='')lines.pop();
 const matrix=lines.map(row=>row.split('\t'));
 const height=matrix.length,width=Math.max(...matrix.map(row=>row.length));
 if(!height||height>5||width>12||fieldIndex+height>CF_GRID_FIELDS.length||
    monthIndex+width>12||fieldIndex<0||monthIndex<0)
  throw Error('貼付範囲が5項目×12か月の入力表を超えています。');
 // Validate the entire pasted rectangle before changing any month.
 const pending=matrix.map((row,r)=>row.map(v=>cashFlowGridNormalize_(CF_GRID_FIELDS[fieldIndex+r][0],v)));
 for(let r=0;r<pending.length;r++)for(let m=0;m<pending[r].length;m++){
  ui.draft.months[monthIndex+m][CF_GRID_FIELDS[fieldIndex+r][0]]=pending[r][m];
 }
 ui.dirty=true;ui.key='';ui.error='';ui.notice='入力表へ '+height+'行×'+width+'列を貼り付けました。まだ保存していません。';
 return {rows:height,months:width};
}
function cashFlowGridPasteEvent_(event,fieldIndex,monthIndex){
 if(!cashFlowGridCanEdit_())return;
 const value=event.clipboardData?.getData('text/plain');
 if(!value||!(/[\t\r\n]/.test(value)))return;
 event.preventDefault();
 try{cashFlowGridApplyMatrix_(value,fieldIndex,monthIndex);}
 catch(e){cashFlowUi.error=String(e.message||e);}
 renderPageIfActive('finance');
 const node=document.querySelector('[data-cfg-cell="'+fieldIndex+'-'+monthIndex+'"]');
 if(node)node.focus();
}
function cashFlowGridInput_(node){
 if(!cashFlowGridCanEdit_())return;
 const key=node.dataset.cfgKey,i=Number(node.dataset.cfgMonth);
 if(!CF_GRID_FIELDS.some(x=>x[0]===key)||!Number.isInteger(i)||i<0||i>=12)return;
 cashFlowUi.draft.months[i][key]=node.value;
 cashFlowUi.dirty=true;cashFlowUi.key='';cashFlowUi.error='';
 cashFlowRefresh_();
}
function cashFlowGridBlur_(node){
 if(!cashFlowGridCanEdit_())return;
 const key=node.dataset.cfgKey,i=Number(node.dataset.cfgMonth);
 if(!Number.isInteger(i)||i<0||i>=12)return;
 try{
  const next=cashFlowGridNormalize_(key,node.value);
  cashFlowUi.draft.months[i][key]=next;
  node.value=next==null?'':String(next);
  node.removeAttribute('aria-invalid');
  cashFlowRefresh_();
 }catch(e){node.setAttribute('aria-invalid','true');cashFlowUi.error=String(e.message||e);}
 if(typeof cashFlowGridSync_==='function')cashFlowGridSync_();
}
function cashFlowGridNavigate_(event,fieldIndex,monthIndex){
 if(event.isComposing||!cashFlowGridCanEdit_())return;
 let r=fieldIndex,c=monthIndex;
 if(event.key==='Enter')r+=event.shiftKey?-1:1;
 else if(event.key==='ArrowRight'&&event.altKey)c++;
 else if(event.key==='ArrowLeft'&&event.altKey)c--;
 else return;
 if(r<0||r>=CF_GRID_FIELDS.length||c<0||c>=12)return;
 event.preventDefault();
 const next=document.querySelector('[data-cfg-cell="'+r+'-'+c+'"]');
 if(next){next.focus();next.select();}
}
function cashFlowGridSync_(){
 const u=cashFlowUi;if(!u.draft)return;
 const data=cashFlowCalc_();if(!data)return;
 for(const [kind,key] of [['plan','planEnd'],['actual','actualEnd'],['forecast','forecastEnd']]){
  data.months.forEach((row,i)=>{
   const el=document.getElementById('cfg-'+kind+'-'+i);
   if(el)el.textContent=cashFlowYen_(row[key]);
  });
 }
 if(typeof document.querySelectorAll!=='function')return;
 for(const input of document.querySelectorAll('[data-cfg-key][data-cfg-month]')){
  if(input===document.activeElement)continue;
  const key=input.dataset.cfgKey,index=Number(input.dataset.cfgMonth);
  if(!Number.isInteger(index)||index<0||index>=12)continue;
  const current=u.draft.months[index][key];
  input.value=current==null?'':String(current);
 }
}
function cashFlowGridCopy_(){
 if(!cashFlowUi.draft)return;
 const safe=v=>String(v==null?'':v).replace(/[\t\r\n]/g,' ').replace(/^[=+\-@]/,"'$&");
 const tsv=CF_GRID_FIELDS.map(([key])=>
  cashFlowUi.draft.months.map(row=>safe(row[key])).join('\t')).join('\n');
 const fallback=()=>{
  const area=document.getElementById('cfg-copy');if(!area)return;
  area.hidden=false;area.value=tsv;area.focus();area.select();
  showToast('入力データを選択しました。Ctrl+Cでコピーしてください。');
 };
 if(typeof navigator!=='undefined'&&navigator.clipboard?.writeText)
  navigator.clipboard.writeText(tsv).then(()=>showToast('12か月の入力値をコピーしました。')).catch(fallback);
 else fallback();
}
function cashFlowGridHtml_(){
 const ui=cashFlowUi;if(!ui.draft)return '';
 const data=cashFlowCalc_(),locked=!cashFlowGridCanEdit_();
 const months=ui.draft.months;
 const heads=months.map(m=>'<th scope="col">'+escapeHtml(m.month.replace('-','年')+'月')+'</th>').join('');
 const editable=CF_GRID_FIELDS.map(([key,label],r)=>{
  const cols=months.map((m,i)=>{
   const current=m[key]==null?'':String(m[key]);
   return '<td><input type="text"'+(key==='note'?'':' inputmode="numeric"')+
    ' data-cfg-key="'+key+'" data-cfg-month="'+i+'" data-cfg-cell="'+r+'-'+i+'"'+
    ' value="'+escapeHtml(current)+'" aria-label="'+escapeHtml(m.month+' '+label)+'"'+
    ' oninput="cashFlowGridInput_(this)" onblur="cashFlowGridBlur_(this)"'+
    ' onpaste="cashFlowGridPasteEvent_(event,'+r+','+i+')"'+
    ' onkeydown="cashFlowGridNavigate_(event,'+r+','+i+')"'+(locked?' readonly':'')+'></td>';
  }).join('');
  return '<tr><th scope="row">'+escapeHtml(label)+'</th>'+cols+'</tr>';
 }).join('');
 const computed=[['計画末残高','planEnd','plan'],['実績末残高','actualEnd','actual'],
  ['見込み末残高','forecastEnd','forecast']].map(([label,key,id])=>
  '<tr class="cfg-total"><th scope="row">'+label+'</th>'+
   data.months.map((m,i)=>'<td id="cfg-'+id+'-'+i+'">'+cashFlowYen_(m[key])+'</td>').join('')+'</tr>').join('');
 return '<section class="card cfg-panel"><div class="cfg-head"><div><h2>12か月を横に並べて入力</h2>'+
  '<p>左から12月～翌11月。Excelから1行×12か月や4行×12か月をコピーして貼り付けできます。</p></div>'+
  '<button type="button" class="secondary-button" onclick="cashFlowGridCopy_()">入力値（5行×12か月）をコピー</button></div>'+
  '<div class="cf-scroll cfg-scroll" role="region" aria-label="年間資金繰り・Excel型12か月入力表" tabindex="0">'+
  '<table class="cfg-table"><thead><tr><th scope="col">入出金項目</th>'+heads+'</tr></thead>'+
  '<tbody>'+editable+computed+'</tbody></table></div>'+
  '<p class="cf-note">空欄は未入力、0は確認した0円です。月末残高は計画・実績の入出金が両方そろった月だけ表示します。'+
  '貼り付けだけでは保存されず、上部の「年度を保存」を押して確定します。</p>'+
  (ui.uncertain?'<p role="alert" class="finance-error">保存結果が不明です。金額を変更せず「同じ内容で再試行」で確認してください。</p>':'')+
  '<textarea id="cfg-copy" hidden aria-label="コピー用の資金繰りデータ"></textarea></section>';
}
</script>
